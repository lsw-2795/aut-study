ap":"현업에서는 모델을 '정답'으로 두고 불일치가 나면 생성 코드 쪽 문제로 보기 쉽다. 실라버스는 결과가 다르면 차이의 원인을 분석한다고 하고, back-to-back 테스팅이 테스트 대상 사이나 그 환경 사이의 의도하지 않은 차이를 드러낸다고 한다(4.2.2).","ref":"4.2.2"},{"id":"c4-015","ch":4,"lo":"AuT-4.2.2","k":2,"q":"back-to-back 테스팅에서 테스트 대상들의 요구사항이 하는 역할로 옳은 것은?","opts":["요구사항은 기대 결과를 정하는 테스트 오라클이고, 테스트 입력은 이전 버전 SW의 실행 기록에서 가져온다.","테스트 대상들이 같은 요구사항에 기반할 필요는 없으며, 요구사항은 테스트에 쓰이지 않는다.","요구사항으로 테스트 대상마다 기대 결과를 따로 정한 뒤, 테스트 대상끼리는 결과를 비교하지 않는다.","요구사항은 보통 테스트 입력을 도출하는 기반으로 쓰지만, 기대 결과를 정하는 테스트 오라클(test oracle)로는 쓰지 않는다."],"ans":[3],"exp":"4.2.2: 테스트 대상들은 내용 면에서 같은 요구사항에 기반해야 비교 가능한 동작을 보인다. 이 요구사항은 보통 테스트 입력 도출의 기반으로 쓰이지만, 기대 결과를 정하는 테스트 오라클로는 쓰이지 않는다. 대신 한 테스트 대상의 동작을 다른 테스트 대상의 pseudo-oracle로 삼아 비교한다. (v2.1 기준. 2018년판에서는 '요구사항은 테스트 설계의 test basis가 아니다'라고 했다.)","why":["반대다. 요구사항은 입력 도출에 쓰고, 기대 결과는 다른 테스트 대상(pseudo-oracle)이 만든다.","테스트 대상들은 내용 면에서 같은 요구사항에 기반해야 비교 가능한 동작을 보인다.","back-to-back 테스팅은 같은 테스트 케이스를 모든 variant에 실행하고 결과를 서로 비교하는 것이 핵심이다.","정답. 4.2.2의 설명 그대로다."],"ref":"4.2.2"},{"id":"c4-016","ch":4,"lo":"AuT-4.2.2","k":2,"q":"엔진 제어 SW를 v1.3에서 v1.4로 수정했다. 테스터는 back-to-back 테스팅으로 같은 테스트 케이스를 두 버전에 실행하고 결과를 비교한다. 결과 판정에 대한 설명으로 옳은 것은?","opts":["결과가 같으면 통과다. 결과가 다르면 아주 작은 차이라도 그 원인을 분석한다.","결과가 조금이라도 다르면 v1.4를 결함으로 판정하고 바로 결함 보고서를 쓴다.","결과가 아주 작게 다르면 허용 범위로 보고 통과로 처리한다.","테스트 케이스는 v1.4에만 실행하고, v1.3의 결과는 요구사항 명세에서 계산해 기대 결과로 쓴다."],"ans":[0],"exp":"4.2.2: 테스터는 같은 테스트 케이스를 모든 variant에 실행하고 결과를 비교한다. 결과가 같으면 통과, 다르면 발견된 차이의 원인을 분석한다. back-to-back 테스팅은 테스트 대상 사이(또는 그 환경 사이)의 의도하지 않은 차이를 아주 작은 것까지 드러낼 것으로 기대된다. 가장 단순한 경우가 같은 SW의 다른 버전 비교이며, 이때 이전 버전(v1.3)이 리그레션 테스트처럼 pseudo-oracle 역할을 한다. (pseudo-oracle 표현은 v2.1 기준. 2018년판에서는 'test oracle'이라고 했다.)","why":["정답. 4.2.2의 판정 방식 그대로다.","다르면 차이의 원인을 분석한다. 원인을 확인하기 전에 v1.4의 결함으로 정하지 않는다.","back-to-back 테스팅은 아주 작은 의도하지 않은 차이까지 드러내는 것을 기대한다. 결과가 같을 때 통과다.","같은 테스트 케이스를 모든 variant(여기서는 두 버전)에 실행해 결과를 비교한다. 요구사항은 기대 결과를 정하는 데 쓰지 않는다."],"ref":"4.2.2"},{"id":"c4-017","ch":4,"lo":"AuT-4.2.3","k":2,"q":"HiL 테스트 환경에서 브레이크 페달 센서 신호선의 단락(short circuit)에 ECU가 안전하게 반응하는지 확인하려 한다. 실라버스에 따른 fault injection(결함 주입) 테스팅 방법으로 가장 적절한 것은?","opts":["fault injection은 SW 내부 결함만 다루므로, 신호선 단락은 fault injection의 대상이 아니다.","실행 중에는 결함을 넣을 수 없으므로, 매번 테스트를 멈추고 배선을 바꾼 뒤 처음부터 다시 실행해야 한다.","HiL 테스트 환경에서 FIU를 이용해 실행 중(run-time)에 단락을 시뮬레이션한다.","정적 분석 도구로 단락 처리 코드의 MISRA-C 준수 여부를 확인하는 것으로 대신한다."],"ans":[2],"exp":"4.2.3: 테스터가 결함을 넣는 위치에는 인터페이스 결함(예: 단락이나 메시지 손실로 인한 피해 방지)이 있다. 외부 결함이나 인터페이스 관련 결함은 보통 HiL 테스트 환경에서 FIU(fault insertion unit)를 사용해 실행 중에 시뮬레이션한다.","why":["인터페이스 결함(예: 단락, 메시지 손실)도 결함 주입 위치에 들어간다.","외부·인터페이스 관련 결함은 FIU로 실행 중에 시뮬레이션한다.","정답. 외부·인터페이스 관련 결함은 보통 HiL에서 FIU로 실행 중에 시뮬레이션한다(4.2.3).","정적 분석은 코드를 실행하지 않고 검사한다. fault injection은 결함 같은 adverse condition에 대한 시스템의 반응을 평가한다."],"ref":"4.2.3"},{"id":"c4-018","ch":4,"lo":"AuT-4.2.3","k":2,"q":"제어 SW의 내부 변수에 비정상 값을 넣어, SW 안의 오류 처리(error handling) 루틴이 내부 결함을 감지하고 처리하는지 확인하려 한다. 실라버스에 따르면 이런 SW 기반 결함은 주로 어떻게 주입하는가?","opts":["HiL 테스트 환경의 FIU로 ECU 배선에 단선을 만들어 주입한다.","SiL 테스트 환경이나 개발 환경에서 디버거나 XCP 같은 도구로 시뮬레이션한다.","실차 주행 시험에서만 주입할 수 있다.","SW 내부 결함은 fault injection의 대상이 아니므로, 단위 테스트의 positive 테스트 케이스로만 확인한다."],"ans":[1],"exp":"4.2.3: 결함 주입 위치에는 애플리케이션 결함(내부 결함을 감지하고 처리)이 포함된다. 인터페이스 결함이나 내부 결함 같은 SW 기반 결함은 SiL 테스트 환경이나 개발 환경에서 디버거나 XCP(Universal Measurement and Calibration Protocol) 같은 도구로 시뮬레이션하는 경우가 많다. (v2.1 기준. 2018년판에서는 SW 내부 결함은 개발 환경에서 디버거나 XCP로만 넣을 수 있는 경우가 많다고 했고, SiL은 SW 기반 인터페이스 결함에만 언급했다.)","why":["FIU는 외부·인터페이스 관련 결함을 HiL에서 시뮬레이션할 때 쓴다. SW 내부 변수에 비정상 값을 넣는 수단이 아니다.","정답. SW 기반 결함(인터페이스·내부 결함)은 SiL이나 개발 환경에서 디버거·XCP로 시뮬레이션하는 경우가 많다(4.2.3).","실라버스는 SiL 테스트 환경이나 개발 환경에서 시뮬레이션한다고 한다. 실차로 한정하지 않는다.","애플리케이션 결함(내부 결함 감지·처리)도 결함 주입 위치에 들어간다."],"ref":"4.2.3"},{"id":"c4-019","ch":4,"lo":"AuT-4.2.3","k":2,"q":"fault injection 테스팅에 대한 설명으로 옳은 것을 두 개 고르시오.","opts":["주입한 결함을 테스트 스위트가 몇 개나 찾아내는지 세어 테스트 케이스의 결함 검출력을 평가하는 것이 목적이다.","classic fault injection에서 테스터는 물리적 테스트 대상을 조작해 결함을 넣는다.","결함 주입 위치는 애플리케이션 내부로 한정되며, 외부 컴포넌트나 인터페이스는 대상이 아니다.","정상 범위의 입력만 사용해 요구사항이 충족되는지 확인하는 positive 테스트다.","결함을 주입하는 방법은 시스템과 테스트 환경에 따라 달라진다."],"ans":[1,4],"exp":"4.2.3: fault injection 테스팅은 컴포넌트나 시스템이 adverse condition(예: 결함)에 어떻게 반응하는지 평가한다. 결함은 시스템과 테스트 환경에 따라 여러 방법으로 주입할 수 있다. classic fault injection에서는 테스터가 물리적 테스트 대상을 조작해 결함을 넣는다. 외부·인터페이스 결함은 보통 HiL에서 FIU로, SW 기반 결함은 SiL이나 개발 환경에서 디버거·XCP로 시뮬레이션한다. 결함 주입 위치는 외부 컴포넌트, 인터페이스, 애플리케이션 세 곳이다.","why":["실라버스의 목적은 테스트 스위트 평가가 아니라 컴포넌트나 시스템이 결함에 어떻게 반응하는지 평가하는 것이다.","정답. 4.2.3의 classic fault injection 설명 그대로다.","외부 컴포넌트(예: 센서의 비정상 값)와 인터페이스(예: 단락, 메시지 손실)도 결함 주입 위치다.","fault injection은 결함 같은 adverse condition을 만들어 반응을 본다. 정상 입력만 쓰는 positive 테스트가 아니다.","정답. 4.2.3: 결함은 시스템과 테스트 환경에 따라 여러 방법으로 주입된다."],"trap":"현업에서 '결함 주입'이라고 하면 소스 코드를 일부러 고쳐 넣는 방식을 먼저 떠올리기 쉽다. 실라버스의 classic fault injection은 물리적 테스트 대상을 조작하는 방식이고, SW 기반 결함은 SiL·개발 환경에서 디버거나 XCP로 시뮬레이션하는 경우가 많다(4.2.3).","ref":"4.2.3"},{"id":"c4-020","ch":4,"lo":"AuT-4.2.4","k":1,"q":"실라버스에 따르면 요구사항 기반 테스팅(requirements-based testing)에서 요구사항 커버리지는 어떻게 측정하는가?","opts":["통과한 테스트 케이스 수 ÷ 실행한 전체 테스트 케이스 수","테스트 케이스와 연결된 요구사항 문서 항목(분해 전 ID) 수 ÷ 전체 요구사항 문서 항목 수","실행된 구문 수 ÷ 전체 실행 가능한 구문 수","테스트 케이스 1개 이상으로 커버된 atomic requirement 수 ÷ 전체 atomic requirement 수"],"ans":[3],"exp":"4.2.4: 요구사항 커버리지는 테스트 케이스 1개 이상으로 커버된 atomic requirement 수를 전체 atomic requirement 수로 나눈 비율이다. 테스터는 복잡하거나 상위 수준인 요구사항을 동작이나 조건 하나만 담은 atomic requirement로 나눠, 숨은 기대나 암묵적 기대를 놓치지 않게 한다. (v2.1 기준. 2018년판 4.2.4에는 atomic requirement와 이 공식이 없다.)","why":["테스트 결과(통과율)이지 요구사항 커버리지가 아니다.","실라버스는 분해 전 문서 항목이 아니라 atomic requirement 단위로 센다.","구문 커버리지다. 화이트박스 테스트 기법의 커버리지다.","정답. 4.2.4의 요구사항 커버리지 정의 그대로다."],"trap":"현업에서는 요구사항 관리 도구의 요구사항 ID(문서 항목) 단위로 커버리지를 세는 경우가 많다. 실라버스는 atomic requirement 단위로 센다(4.2.4). ID 하나에 여러 동작이 들어 있으면 두 값이 달라진다.","ref":"4.2.4"},{"id":"c4-021","ch":4,"lo":"AuT-4.2.4","k":1,"q":"요구사항 기반 테스팅의 테스트 케이스에 대한 설명으로 옳은 것은?","opts":["주로 positive 테스트 케이스이며, negative 테스트 케이스는 동등 분할, 오류 추정, 탐색적 테스팅 같은 보완 기법으로 도출하는 경우가 많다.","주로 negative 테스트 케이스이며, positive 테스트 케이스는 탐색적 테스팅으로 따로 만든다.","요구사항에 negative 조건이 명시돼 있어도 negative 테스트 케이스는 요구사항에서 도출하지 않는다.","요구사항에서 만들 수 있는 모든 입력 조합을 실행하는 것이 원칙이다."],"ans":[0],"exp":"4.2.4: 요구사항 기반 테스팅의 테스트 케이스는 보통 명시된 요구사항이 충족되는지 확인하는 positive 테스트 케이스다. negative 테스트 케이스는 동등 분할(equivalence partitioning), 오류 추정(error guessing), 탐색적 테스팅(exploratory testing) 같은 보완 기법으로 도출하는 경우가 많다. 다만 요구사항이 negative 조건을 명시적으로 정의할 수도 있다. (v2.1 기준. 2018년판 4.2.4에는 positive/negative 설명이 없다.)","why":["정답. 4.2.4의 설명 그대로다.","반대다. 요구사항 기반 테스팅의 테스트 케이스는 주로 명시된 요구사항이 충족되는지 확인하는 positive 테스트 케이스다.","실라버스는 요구사항이 negative 조건을 명시적으로 정의할 수도 있다고 한다.","실라버스는 atomic requirement에서 테스트 컨디션을 도출해 요구사항을 실행하는 테스트 케이스를 설계한다고 한다. 모든 입력 조합을 원칙으로 두지 않는다."],"ref":"4.2.4"},{"id":"c4-022","ch":4,"lo":"AuT-4.KW","k":1,"q":"ISTQB 용어집에서 back-to-back 테스팅(back-to-back testing)의 정의로 옳은 것은?","opts":["atomic requirement에서 테스트 컨디션을 도출하는 블랙박스 테스트 기법","pseudo-oracle을 사용하는 테스트 접근법(test approach)","테스트 대상을 실행하지 않고 작업 산출물을 검토하는 테스팅","실제 하드웨어와 통합된 SW를 테스트하는 가상 테스트 환경"],"ans":[1],"exp":"ISTQB 용어집(Version 2): back-to-back testing = 'A test approach in which a pseudo-oracle is used.' 실라버스 4.2.2도 back-to-back 테스팅을 pseudo-oracle을 사용해 기대 결과를 만드는 test approach로 설명한다. (v2.1 기준. 2018년판 키워드에 연결된 용어집 정의(Version 1)는 '두 개 이상의 variant에 같은 테스트 케이스를 실행해 결과를 비교하는 테스팅'이었다.)","why":["용어집의 requirements-based testing 정의다.","정답. 용어집 정의 'A test approach in which a pseudo-oracle is used.'","정적 테스팅에 대한 설명이다(4.1 도입부).","용어집의 HiL 정의다."],"ref":"4.2.2"},{"id":"c4-023","ch":4,"lo":"AuT-4.KW","k":1,"q":"요구사항 기반 테스팅에서 테스트 컨디션(test condition)을 도출하는 대상으로 실라버스와 ISTQB 용어집(영문)이 공통으로 드는 것은?","opts":["소스 코드의 구조(구문, 분기, 조건)","이전 버전 SW나 실행 가능한 모델의 실행 결과","테스터의 경험과 과거 결함 이력","atomic requirement"],"ans":[3],"exp":"ISTQB 용어집: requirements-based testing은 '... test conditions are derived from atomic requirements.' 실라버스 4.2.4: 테스터는 보통 텍스트로 된 요구사항을 분석해 개별 atomic requirement에서 테스트 컨디션을 도출하고, 요구사항을 실행하는 테스트 케이스를 설계해 실행한다. atomic requirement는 독립적으로 검증할 수 있는 동작이나 조건 하나를 담는다. KSTQB 한국어판 용어집은 '테스트 케이스를 요구사항을 기반으로 설계'라고만 해 atomic까지 말하지는 않지만, 요구사항이 출발점이라는 점은 같다. (v2.1 기준. 2018년판 4.2.4에는 atomic requirement가 없다.)","why":["구문 테스팅, 분기 테스팅, MC/DC 같은 화이트박스 테스트 기법이 쓰는 테스트 베이시스다.","back-to-back 테스팅에서 pseudo-oracle로 쓰는 것이다.","오류 추정 같은 경험 기반 테스트 기법의 출발점이다.","정답. 용어집과 4.2.4 모두 atomic requirement에서 테스트 컨디션을 도출한다고 한다."],"ref":"4.2.4"},{"id":"c4-024","ch":4,"lo":"AuT-4.KW","k":1,"q":"다음은 실라버스 4.2.3의 설명이다. 이 설명에 해당하는 4장 키워드는?\n\n\"컴포넌트나 시스템이 adverse condition(예: 결함. 이 맥락에서는 fault라고도 한다)에 어떻게 반응하는지 평가하도록 설계된 테스트 접근법\"","opts":["back-to-back testing","requirements-based testing","fault injection","정적 분석(static analysis)"],"ans":[2],"exp":"실라버스 4.2.3: fault injection 테스팅은 컴포넌트나 시스템이 adverse condition(예: 결함. 이 맥락에서는 fault라고도 한다)에 어떻게 반응하는지 평가하도록 설계된 테스트 접근법이다. 테스터는 외부 컴포넌트, 인터페이스, 애플리케이션에 결함을 골라 넣는다. ISTQB 용어집의 fault injection 정의는 판마다 문장이 달라서, 이 문항은 실라버스 4.2.3 본문만 근거로 한다.","why":["pseudo-oracle을 사용해 테스트 대상끼리 결과를 비교한다. adverse condition을 만들지 않는다.","atomic requirement에서 테스트 컨디션을 도출해 요구사항이 충족되는지 확인한다.","정답. 4.2.3의 fault injection 테스팅 설명이다.","코드를 실행하지 않고 검사하므로 실행 중 반응을 평가하지 않는다."],"ref":"4.2.3"},{"id":"c4-025","ch":4,"lo":"AuT-4.2.5","k":3,"q":"아래 표는 실라버스 4.2.5의 표 6이다. 한 사용자가 시스템 테스팅에 쓸 테스트 기법·테스트 접근법을 여러 선택 요인으로 평가하고 선택한 예다(빈칸은 선택하지 않음).\n이 표에서 MC/DC가 선택되지 않은 이유로 표 값이 뒷받침하는 것은?","table":{"head":["번호","테스트 기법 / 테스트 접근법","ASIL A에 권고?","테스트 베이시스 적합?","결함을 못 찾을 때 리스크","시스템 테스팅에 적합?","선택"],"rows":[["1","요구사항 기반 테스팅","++","YES","++","YES","X"],["2","동등 분할","+","YES","++","YES","X"],["3","경계값 분석","+","NO","-","YES",""],["4","구문 테스팅","++","YES","++","NO",""],["5","결정 테스팅","+","YES","++","NO",""],["6","MC/DC","+","YES","+","NO",""],["7","오류 추정","+","NO","++","YES",""],["8","fault injection 테스팅","+","YES","+","NO",""],["9","back-to-back 테스팅","+","NO","++","YES",""]]},"opts":["시스템 테스팅 레벨에서 쓰기에 적합하지 않다고 평가했기 때문이다.","ASIL A에서 권고되지 않기 때문이다.","테스트 베이시스가 MC/DC에 적합하지 않기 때문이다.","실라버스 4.2.5가 자동차 시스템과 관련된 기법으로 MC/DC를 들지 않기 때문이다."],"ans":[0],"exp":"풀이\n① MC/DC 행: ASIL A 권고 '+', 테스트 베이시스 적합 YES, 리스크 '+', 시스템 테스팅 적합 NO, 선택 없음.\n② 보기의 이유를 표 값에 대 본다. ASIL A 권고(+)와 테스트 베이시스(YES)는 선택을 막는 값이 아니다. 보기 중 표 값과 맞는 이유는 '시스템 테스팅에 적합 NO'뿐이다.\n③ 4.2.5의 테스트 레벨 요인: 화이트박스 테스팅은 소스 코드나 내부 구조가 테스트 베이시스일 때 특히 적합하다.\n검산 1: 선택된 1·2행은 테스트 베이시스와 테스트 레벨이 모두 YES다. 둘 중 하나라도 NO인 3~9행은 하나도 선택되지 않았다.\n검산 2: 같은 '시스템 테스팅 NO'인 구문 테스팅(4행)은 ASIL A '++', 리스크 '++'인데도 선택되지 않았다. 권고 수준이 높아도 테스트 레벨이 NO면 이 예에서는 선택되지 않는다.","why":["정답. MC/DC 행의 '시스템 테스팅에 적합?' 값은 NO다.","MC/DC 행의 ASIL A 권고 값은 '+'(recommended)다.","MC/DC 행의 테스트 베이시스 적합 값은 YES다.","4.2.5의 목록에 modified condition/decision testing이 들어 있다."],"trap":"현업에서는 MC/DC를 ASIL 등급이 요구하는 커버리지로만 떠올리기 쉽다. 실라버스 4.2.5는 state of the art(표준 권고) 외에 테스트 베이시스, 리스크, 테스트 레벨을 함께 따진다. 표 6에서 MC/DC는 권고(+)가 있지만 '시스템 테스팅에 적합?'이 NO이고, 선택되지 않았다.","ref":"4.2.5"},{"id":"c4-026","ch":4,"lo":"AuT-4.2.5","k":3,"q":"시스템 테스팅에서 테스터가 '배터리 전압 입력'에 경계값 분석(boundary value analysis)을 적용할지 검토한다. 확인된 사실은 다음과 같다.\n- 요구사항에 입력 전압 범위가 9V~16V로 선형으로 정의돼 있다.\n- 시스템 테스팅에서 전압 입력을 제어하고 결과를 관찰할 수 있다.\n- 팀은 이 목적에 경계값 분석이 state of the art에 해당한다고 확인했다.\n- 제품 리스크 분석 결과, 이 입력에는 범위 경계를 넘는 값이 들어올 리스크가 없고, 경계를 넘더라도 그 영향이 리스크가 되지 않는다고 평가됐다.\n실라버스 4.2.5의 선택 요인 중 경계값 분석 적용을 다시 검토하게 만드는 요인은?","opts":["state of the art","리스크 기반 테스팅(risk-based testing)","테스트 베이시스(test basis)","테스트 레벨(test level)"],"ans":[1],"exp":"풀이(4.2.5의 네 가지 선택 요인에 사실을 하나씩 대 본다)\n① state of the art: 이 목적에 state of the art로 확인됨 → 걸리지 않음.\n② 테스트 베이시스: 경계값은 값 범위가 선형으로 정의돼 있어야 테스트할 수 있다. 9V~16V로 선형 정의됨 → 걸리지 않음.\n③ 테스트 레벨: 블랙박스 테스팅은 테스트 대상을 쓸 수 있고 관찰할 수 있어야 한다. 시스템 테스팅에서 입력 제어·결과 관찰 가능 → 걸리지 않음.\n④ 리스크 기반 테스팅: 4.2.5는 '경계값 테스트는 경계 위반이 생길 리스크가 있고, 그 위반의 영향이 리스크가 될 때만 의미가 있다'고 한다. 여기서는 둘 다 없다고 평가됐다 → 재검토 요인.\n검산: 네 요인 중 주어진 사실과 충돌하는 것은 ④ 하나뿐이다.","why":["state of the art에 해당한다고 확인됐으므로 걸리지 않는다.","정답. 경계값 테스트는 경계 위반 리스크가 있고 그 영향이 리스크일 때만 의미가 있다(4.2.5).","값 범위가 선형으로 정의돼 있어 경계값을 테스트할 수 있다.","시스템 테스팅에서 테스트 대상을 쓸 수 있고 관찰할 수 있어 블랙박스 테스팅 조건을 충족한다."],"ref":"4.2.5"},{"id":"c4-027","ch":4,"lo":"AuT-4.2.5","k":3,"q":"브레이크 제어 ECU의 시스템 테스팅을 맡은 테스터가 구문 테스팅(statement testing) 적용을 검토한다. 시스템 테스팅에서는 ECU 내부 구조를 볼 수 없어 구문 커버리지를 측정할 수 없다. 테스트 전략에는 같은 SW의 소스 코드를 테스트 베이시스로 쓰는 다른 테스트 레벨이 있다. 실라버스 4.2.5에 따른 판단으로 가장 적절한 것은?","opts":["시스템 테스팅에서 쓸 수 없는 기법이므로, 다른 레벨은 따질 필요 없이 이 프로젝트에서 구문 테스팅을 뺀다.","표준 권고에서 벗어나는 결정은 테스터 재량이므로 근거를 남기지 않고 구문 테스팅을 생략해도 된다.","시스템 테스팅에서 동등 분할을 충분히 수행하면 구문 커버리지 100%로 간주한다.","시스템 테스팅 레벨에서는 쓸 수 없으므로, 테스트 전략에 따라 소스 코드를 테스트 베이시스로 쓰는 다른 테스트 레벨에서 적용한다."],"ans":[3],"exp":"풀이\n① 테스트 레벨 요인(4.2.5): 화이트박스 테스팅은 소스 코드나 내부 구조가 테스트 베이시스일 때 특히 적합하고, 이상적으로는 구조 커버리지를 측정할 수 있다.\n② 이 시스템 테스팅에서는 내부 구조를 볼 수 없고 구문 커버리지도 측정할 수 없다 → 이 레벨에서는 쓸 수 없다.\n③ 4.2.5: 어떤 기법·접근법을 한 테스트 레벨에서 쓸 수 없으면, 테스터는 테스트 전략에 따라 다른 테스트 레벨을 고른다.\n검산: 표 6에서도 구문 테스팅은 '시스템 테스팅에 적합 NO'라 시스템 테스팅용으로 선택되지 않았다. 표 6은 시스템 테스팅 기준의 선택만 보여 준다.","why":["4.2.5는 한 레벨에서 쓸 수 없으면 다른 테스트 레벨을 고르라고 한다. 바로 빼지 않는다.","4.2.5: 표준 권고에서 벗어나는 것은 신중히 검토하고 근거를 대야 한다.","구문 커버리지는 화이트박스 기법인 구문 테스팅으로 측정하는 구조 커버리지다. 블랙박스 기법인 동등 분할로 대신할 수 없다.","정답. 한 테스트 레벨에서 쓸 수 없으면 테스트 전략에 따라 다른 테스트 레벨을 고른다(4.2.5)."],"ref":"4.2.5"}],"notes":[{"ch":1,"title":"자동차 SW 테스팅 도입","titleEn":"Introduction to Automotive Software Testing","minutes":30,"examCount":3,"keywords":[],"sections":[{"id":"1.1","title":"프로젝트 목표 충돌과 제품 복잡성 증가에서 오는 요구","points":["1장 도입: 소프트웨어 테스팅 7원리 중 하나가 '테스팅은 정황에 의존적이다(Testing is context dependent)'이다. 1장은 자동차 SW 테스터가 일하는 E/E 시스템 개발 정황을 설명한다. 이후 '테스터'는 'Automotive Software Tester'의 줄임말이다.","한편으로는 비용 효율, 안전 요구사항, 빠른 시장 출시 같은 상충하는 목표와 늘어나는 복잡성, 혁신적 솔루션에 대한 강한 요구가 특별한 도전 과제를 만든다. 다른 한편으로는 표준과 차량 수명주기가 테스터가 일하는 틀이 된다. 결국 테스터는 SW와 시스템의 릴리스를 위해 일한다.","OEM(완성차 업체)과 공급업체(supplier)는 비용 압박이 커지는데도 예전보다 더 자주 신차를 출시한다. 이 과정에 영향을 주는 측면은 다음 4가지다.","① 차종 수와 복잡성 증가: 최종 고객 개개인의 요구를 더 잘 맞추려고 OEM은 차종을 점점 늘린다. 그러면 차종당 수량이 줄어든다. 늘어난 개발·생산 비용을 감당하려고 생산자는 여러 차종을 공통 플랫폼의 변형(variety)으로 개발한다. 그러나 플랫폼 개발은 가능한 많은 변형을 통제해야 하므로 단일 차종 개발보다 훨씬 복잡하다.","② 기능 범위 증가: 최종 고객은 기존 기능을 유지하면서 더 많은 혁신을 요구한다. 그래서 기능 범위가 넓어진다.","③ 구성(configuration) 수 증가: 최종 고객은 자기 차종을 개인 취향에 맞추고 싶어 한다. 그래서 차종 하나에 기능 면까지 포함한 다양한 구성이 필요하다.","④ 품질 요구사항 증가: 기능과 복잡성이 늘어도 최종 고객은 차량과 기능의 품질이 같거나 더 높기를 기대한다.","프로젝트 목표인 시간·비용·범위(scope)는 서로 경쟁한다. 이를 프로젝트 관리 삼각형(Project management triangle)이라 하며, 품질은 흔히 범위의 한 측면으로 본다. (v2.1 기준. 2018년판에서는 세 꼭짓점이 시간·비용·품질이다.)","그래서 OEM과 공급업체는 더 효율적인 시스템 개발을 추구해야 한다. 복잡성 증가, 품질 요구사항 증가, 더 적은 예산 속에서도 개발 기간을 줄일 수 있는 시스템 개발이다.","각주 예시(컨설팅사 Progenium 연구): 1990년에는 101개 차종이 판매됐고, 2014년에는 453개로 늘었다."],"traps":["프로젝트 관리 삼각형의 꼭짓점은 v2.1에서 시간·비용·범위(scope)다. 2018년판의 '시간·비용·품질'로 외우면 틀린다. 품질은 범위의 한 측면이다.","공통 플랫폼은 비용을 감당하려는 수단이지만, 플랫폼 개발 자체는 많은 변형을 통제해야 해서 단일 차종 개발보다 훨씬 복잡하다.","고객이 차종 하나를 자기 취향대로 맞추는 것(기능 선택 포함)은 '구성 수 증가'다. '기능 범위 증가'는 기존 기능을 유지하면서 새 혁신 기능이 계속 더해지는 것이다.","신차는 비용 압박에도 '더 자주' 출시된다. 차종이 늘면 차종당 수량은 '줄어든다'."]},{"id":"1.2","title":"표준이 영향을 주는 프로젝트 측면","points":["표준은 시간, 비용, 품질, 프로젝트 리스크, 제품 리스크 같은 주요 프로젝트 측면에 영향을 준다.","표준은 프로세스의 효율을 높인다(예: 품질을 안정적으로 유지하면서 개발 기간이나 비용을 줄임). 수단은 ① 통일된 명명(uniform naming) ② 투명성 향상(better transparency) ③ 협업이 쉬워짐(내부와 외부 모두) ④ 재사용성 증가(increased re-usability) ⑤ 축적된 경험('Best Practice')이다.","표준은 잘 정립된 기술 가이드라인으로 리스크와 결함을 조기에 발견하고, 찾아낸 리스크와 결함을 해결하도록 돕는다.","표준은 감사(audit)의 근거다. 그래서 감사자(auditor)는 제품이나 프로세스의 품질을 평가할 수 있다. 동시에 감사자는 표준이 요구사항을 충족하는지도 확인할 수 있다.","표준은 계약 조항이나 규제 조항, 가이드라인의 일부다.","이 실라버스가 다루는 자동차 SW 테스팅 관련 표준: ISO 26262와 ASPICE는 표준화된 프로세스와 방법을 제공한다. AUTOSAR는 SW 아키텍처와 제품을 표준화한다."],"traps":["ISO 26262·ASPICE는 프로세스와 방법, AUTOSAR는 SW 아키텍처와 제품이다. 묶음을 바꿔 놓은 보기에 주의한다.","표준은 품질만이 아니라 시간·비용, 프로젝트 리스크·제품 리스크에도 영향을 준다.","기술 가이드라인은 리스크와 결함을 '조기에' 발견하도록 돕는다."]},{"id":"1.3","title":"시스템 수명주기의 6가지 일반 단계","points":["자동차와 그 구성품(ECU의 하드웨어·소프트웨어와 컴포넌트)의 시스템 수명주기(system lifecycle)는 제품 아이디어에서 시작해 폐기(decommissioning)로 끝난다. 개발, 비즈니스, 물류, 생산 기술 프로세스가 관여한다.","정의된 시작 조건(entry criteria)과 완료 조건(exit criteria)을 갖춘 마일스톤이 성숙한 프로세스를 보장하고, 시스템 수명주기를 전형적인 테스트 활동이 있는 6단계로 나눈다. 6단계의 기준은 ISO/IEC/IEEE 24748-1이다(LO AuT-1.3). (v2.1 기준. 2018년판은 ISO/IEC 24748-1, 'phases'로 적었다.)","① concept(개념): 테스트 전략과 테스트 목적을 정의하는 테스트 계획","② development(개발): 테스트 분석, 테스트 설계, 테스트 구현, 테스트 실행, 테스트 모니터링, 테스트 제어, 테스트 완료로 품질을 보장한다. (v2.1 기준. 2018년판은 analysis, design, implementation, execution, evaluation and report로 적었다.)","③ production(생산): 준비 상태를 확인하는 EOL 테스트(end of line testing)","④ utilization(활용): 보통 테스트 활동을 하지 않는다. (v2.1 기준. 2018년판은 '보통' 없이 테스트 활동 없음으로 적었다.)","⑤ support(지원): 지속적인 신뢰도를 확보하는 유지보수 테스팅(maintenance testing)","⑥ retirement(폐기): 마이그레이션 테스팅(migration testing)으로 폐기나 데이터 이전을 밸리데이션한다.","널리 쓰이는 자동차 제품 개발 프로세스는 6단계를 흔히 concept, development, production 3개 주요 단계로 압축한다. 대부분의 테스팅과 릴리스 활동이 이 3단계에서 일어난다. (v2.1 기준. 2018년판에는 '대부분의 테스팅과 릴리스 활동' 설명이 없다.)","ISO 26262의 safety lifecycle(안전 수명주기)도 비슷한 단계로 이뤄진다(각주)."],"traps":["6단계 순서는 concept → development → production → utilization → support → retirement다. acceptance, release, implementation 같은 이름의 단계는 없다.","유지보수 테스팅은 support 단계다. 차량을 쓰는 utilization 단계에서는 보통 테스트 활동이 없다.","EOL 테스트는 production, 마이그레이션 테스팅은 retirement, 테스트 계획은 concept이다.","6단계와 자동차 제품 개발 프로세스의 3단계(concept, development, production)를 섞지 않는다."]},{"id":"1.4","title":"릴리스 프로세스에서 테스터의 기여와 참여","points":["자동차 분야에서 프로젝트는 목표 달성이 확인되면 릴리스를 선언해 마일스톤에 도달한다. 이때부터 release item(릴리스 항목)은 의도한 용도에 필요한 성숙도를 갖춘 것으로 본다.","release item은 parameterization을 포함한 SW 구성, 필요하면 하드웨어와 기구, 그리고 지원 문서를 포함한다. (v2.1 기준. 2018년판은 이를 'test item + 지원 문서'로 표현했다. 구성 요소는 같다.)","테스터는 최종 테스트 보고서(final test report)로 release process(릴리스 프로세스)에 중요한 정보를 전달한다. ① 테스트한 항목(tested items) ② 평가한 품질 특성(예: 응답 시간, 자원 사용량) ③ 알려진 결함(known defects) ④ 제품 메트릭(product metrics) ⑤ 완료 조건을 달성했을 때 release recommendation(릴리스 권고)을 위한 정보. ⑤는 Best Practice Guidelines에 정의된 release level을 근거로 한다(예: 폐쇄된 시험장 테스트, 공공 도로 테스트, installation recommendation).","(v2.1 기준 5개 항목. 2018년판은 '테스트한 항목과 성능 특성(버전 포함)'을 한 항목으로 묶어 4개였고, 릴리스 권고 근거를 release regulation이라 했다.)","추가로 테스터는 릴리스와 관련된 다른 산출물 작성에 참여한다. ① 변경 사항의 우선순위를 정하고 변경 결정에 참여 ② 구현 순서를 정하기 위한 기능 우선순위 지정"],"traps":["최종 테스트 보고서 항목 5개와, 테스터가 추가로 참여하는 산출물 2개(변경 우선순위·결정 참여, 기능 구현 순서 우선순위)를 구분해서 외운다.","release item은 SW 빌드 결과물만이 아니다. parameterization을 포함한 SW 구성과 지원 문서가 들어가고, 하드웨어와 기구는 '필요하면' 들어간다.","목표 달성 확인 → 릴리스 선언 → 이때부터 필요한 성숙도를 갖춘 것으로 봄. 순서를 뒤집은 보기에 주의한다.","릴리스 권고를 위한 정보는 완료 조건 달성이 전제이고, Best Practice Guidelines의 release level에 근거한다."]}]},{"ch":2,"title":"E/E 시스템 테스팅 표준","titleEn":"Standards for the Testing of Electric/Electronic (E/E) Systems","minutes":300,"examCount":18,"keywords":[{"ko":"기능 안전","en":"functional safety","def":"전기/전자(E/E) 시스템의 오작동 동작으로 인한 hazard 때문에 생기는 불합리한 리스크가 없는 상태(ISTQB 용어집, 출처 ISO 26262-1:2018). 실라버스 2.2.1.1 본문 표현: E/E 시스템이 오작동 동작에서 비롯된 hazard로 불합리한 리스크를 일으키지 않고 동작하도록 보장하는 것."},{"ko":"method table(메소드 테이블)","en":"method table","def":"ASIL과 테스트 대상의 정황에 따라 요구되는 여러 테스트 접근법, 테스트 기법, 테스트 유형을 담은 표(ISTQB 용어집, 출처 ISO 26262-1:2018)."},{"ko":"ASIL","en":"automotive safety integrity level (ASIL)","def":"ISO 26262에 정의된, 자동차 기능 안전을 위한 안전 무결성 수준(safety integrity level)(실라버스 6장 정의). 참고로 ISTQB 용어집 정의는 문장이 다르다: ISO 26262에서 아이템이나 element에 필요한 요구사항과, 불합리한 잔여 리스크를 피하기 위한 안전 조치를 정하는 네 가지 레벨 중 하나."},{"ko":"software verification(SWE.6)","en":"software verification","def":"Automotive SPICE에서, 통합된 SW가 SW 요구사항과 일치(consistency)하는지 검증하는 것(실라버스 6장 정의)."},{"ko":"system verification(SYS.5)","en":"system verification","def":"Automotive SPICE에서, 시스템이 시스템 요구사항과 일치(consistency)하는지 검증하는 것(실라버스 6장 정의)."}],"sections":[{"id":"2.1","title":"Automotive SPICE(ASPICE) 개요","points":["프로세스 개선은 시스템의 품질이 개발 프로세스의 품질에 영향을 받는다는 접근을 따른다.","프로세스 모델은 조직 단위나 프로젝트의 프로세스 capability를 참조 모델과 비교해 측정함으로써 개선할 수 있는 방법을 준다. 또한 심사(assessment) 결과를 이용해 조직 단위나 프로젝트의 프로세스를 개선하는 틀 역할을 한다.","2001년부터 SPICE(Software Process Improvement and Capability Determination) User Group과 AUTOSIG(Automotive Special Interest Group)가 ASPICE를 개발했다. 2005년부터 자동차 업계에 자리 잡았다.","2.1절의 모든 내용은 ASPICE 4.0 기준이다.","6장 정의: Automotive SPICE = 자동차 업계의 process reference model과 그에 딸린 process assessment model."],"traps":[]},{"id":"2.1.1.1","title":"ASPICE의 두 차원","points":["ASPICE는 심사의 두 핵심 차원을 가진 assessment model을 정의한다: process dimension과 capability dimension.","process dimension: ASPICE는 process reference model(PRM)을 정의한다. PRM은 조직의 프로세스를 그것과 비교해 심사하고 개선할 수 있게 하는 기준이다.","ASPICE는 프로세스마다 목적(purpose), 결과(results), 필요한 행동(즉 base practice), information item(즉 작업 결과와 work product)을 정의한다.","capability dimension: ASPICE는 capability level을 나누는 여러 process attribute(즉 측정 가능한 특성)를 정의한다. 프로세스마다 generic 속성과 process specific 속성이 있다.","process capability 심사의 기반은 ISO/IEC 33020이다.","이 모델로 프로세스(process dimension)를 그 capability(capability dimension) 측면에서 심사할 수 있다.","6장 정의: process dimension = 심사할 프로세스를 정의하는, process assessment model의 차원. capability dimension = 심사할 process attribute를 정의하는, process assessment model의 차원. process attribute = process capability 심사를 위한, 프로세스의 측정 가능한 특성 집합."],"traps":["PRM(프로세스별 목적·결과·base practice·information item)은 process dimension, process attribute와 capability level은 capability dimension이다. 둘을 바꿔 붙인 보기가 함정이다."]},{"id":"2.1.1.2","title":"process dimension의 프로세스 범주 [informative]","points":["(참고, 출제 LO 아님) ASPICE는 프로세스를 그룹으로 묶고, 그룹을 다시 범주(category)로 나눈다.","(참고, 출제 LO 아님) primary lifecycle processes(핵심 프로세스 전부): ACQ(Acquisition), SPL(Supply), SYS(System engineering), SWE(Software engineering), MLE(Machine learning engineering), HWE(Hardware engineering), VAL(Validation) 프로세스 그룹.","(참고, 출제 LO 아님) supporting lifecycle processes(다른 프로세스를 지원하는 프로세스 전부): SUP(Supporting) 프로세스 그룹.","(참고, 출제 LO 아님) organizational lifecycle processes(회사 목표를 지원하는 프로세스 전부): MAN(Management), PIM(Process Improvement), REU(Reuse) 프로세스 그룹.","(참고, 출제 LO 아님) 테스터에게는 SYS와 SWE 프로세스 그룹이 특히 중요하고, MLE, VAL, HWE도 관심 대상일 수 있다."],"traps":[]},{"id":"2.1.1.3","title":"capability dimension의 capability level(CL)","points":["심사원(assessor)은 6단계 심사 체계(레벨 표시)로 process capability를 심사한다. ASPICE의 capability level 0~3 정의는 아래와 같다. capability level 4와 5는 현재 자동차 업계의 관심 대상이 아니다(각주).","Level 0(incomplete process): 프로세스가 구현되지 않았거나 프로세스 목적을 달성하지 못한다. 프로세스 결과를 체계적으로 달성했다는 증거가 거의 또는 전혀 없다. 프로세스가 없거나 목적을 달성하지 못한다. 예: 테스터가 요구사항의 작은 일부만 확인한다.","Level 1(performed process): 구현된 프로세스가 목적을 달성한다(일관되지 않게 수행될 수는 있다). 예: 테스트 프로세스의 완전한 계획은 보이지 않는다. 하지만 테스터가 요구사항 충족 정도를 보여 줄 수 있다.","Level 2(managed process): 프로젝트가 테스트 실행 단계에서 테스트 프로세스를 계획하고 감독한다. 특정 상황에서는 테스트 목적을 달성하려고 테스트 실행 중 진행 방식을 조정한다. work product에 대한 요구사항이 정의되어 있다. 프로젝트 구성원이 work product를 리뷰하고 승인한다. 예: 테스트 관리자가 테스트 목적을 정하고, 테스트 활동을 계획하고, 테스트 프로세스를 관리한다. 편차에 맞게 대응하는 것도 포함한다.","Level 3(established process): 프로젝트가 표준화된 테스트 프로세스를 쓰고, 발견 사항을 지속적인 개선에 쓴다. 예: 조직 테스트 전략(organizational test strategy)이 있다. 테스트 완료 후 테스트 관리자가 그 전략을 더 발전시킨다.","6장 정의: capability level = process capability 심사에서 해당 process attribute의 심사 결과에 따라 프로세스에 부여하는 레벨."],"traps":["레벨 구분: 목적은 달성하지만 완전한 계획이 안 보이면 Level 1(performed), 프로젝트가 계획·감독하고 편차에 대응하며 work product를 리뷰·승인하면 Level 2(managed), 표준화된 프로세스(예: 조직 테스트 전략)를 쓰고 발견 사항으로 계속 개선하면 Level 3(established)이다. 가장 낮은 레벨은 1이 아니라 Level 0(incomplete)이다."]},{"id":"2.1.2.1","title":"ASPICE의 테스트 관련 프로세스","points":["ASPICE는 SW·시스템 개발의 모든 프로세스에 맞춰 테스트 프로세스를 정의한다.","software unit verification(SWE.4): 정적 테스팅과 동적 테스팅을 요구한다. software detailed design(SWE.3)을 기준으로 SW의 컴포넌트를 평가한다.","software component verification and integration verification(SWE.5): software architectural design(SWE.2)을 기준으로 통합된 SW를 평가한다.","software verification(SWE.6): software requirements analysis(SWE.1)를 기준으로 통합된 SW를 평가한다.","system integration and integration verification(SYS.4): system architectural design(SYS.3)을 기준으로 통합된 시스템을 평가한다.","system verification(SYS.5): system requirements analysis(SYS.2)를 기준으로 통합된 시스템을 평가한다.","각주: 위 테스트 프로세스 외에 VAL 프로세스 그룹도 있다. VAL.1의 목적은 최종 사용자가 직접 상호작용하는 최종 제품이 운영 대상 환경에서 의도된 사용 기대를 만족한다는 증거를 제공하는 것이다.","6장 정의: SWE.4 = SW unit이 detailed design과 일치하는지 검증. SWE.5 = software architectural design을 기준으로 통합된 SW를 검증. SWE.6 = 통합된 SW가 SW 요구사항과 일치하는지 검증. SYS.4 = 통합된 시스템 요소가 시스템 아키텍처와 일치하는지 검증. SYS.5 = 시스템이 시스템 요구사항과 일치하는지 검증."],"traps":["2018년판(인터넷 자료)과 다름: SWE.6은 2018년판에서 “software qualification test”, SYS.5는 “system qualification test”, SWE.5는 “software integration test”, SYS.4는 “system integration test”였다. v2.1 이름은 software verification, system verification, software component verification and integration verification, system integration and integration verification이다.","기준 산출물 짝: SWE.4-SWE.3, SWE.5-SWE.2, SWE.6-SWE.1, SYS.4-SYS.3, SYS.5-SYS.2(짝 번호를 더하면 모두 7). SWE.5와 SWE.6은 둘 다 “통합된 SW”를 평가하므로 기준이 architectural design(SWE.2)이냐 requirements analysis(SWE.1)냐로 구분한다. SYS.4와 SYS.5도 같은 식이다."]},{"id":"2.1.2.2","title":"rating level과 capability indicator","points":["심사원은 capability indicator로 process capability를 심사할 수 있다. ASPICE는 capability indicator를 9개 process attribute(PA)에 대해 정의한다.","capability level 1~3에 대해서는 다음 PA가 정의된다(괄호는 SWE.6을 예로 든 것):\nPA 1.1: process performance process attribute(예: 테스터가 테스트 프로세스를 따른다)\nPA 2.1: process performance management process attribute(예: 테스터가 테스트 활동을 계획·감독·통제한다)\nPA 2.2: work product management process attribute(예: 테스터가 테스트웨어의 품질을 확인한다)\nPA 3.1: process definition process attribute(예: 테스트 프로세스 책임자가 조직 테스트 전략을 정의한다)\nPA 3.2: process deployment process attribute(예: 테스터가 PA 3.1에서 정의한 테스트 전략을 적용한다)","각주: work product management는 문서화된 모든 정보에 적용된다.","프로세스 수행에 대해 ASPICE는 두 종류의 capability indicator를 정의한다: base practice(BP)와 information item. 그 밖에 generic practice(GP)와 information item도 정의한다.","process attribute 심사는 지표의 구현 수준을 네 rating level로 매긴다:\nN(None): 충족 안 됨(0% ~ ≤ 15%)\nP(Partly): 부분 충족(> 15% ~ ≤ 50%)\nL(Largely): 대부분 충족(> 50% ~ ≤ 85%)\nF(Fully): 완전 충족(> 85% ~ ≤ 100%)","프로세스가 어떤 capability level에 도달하려면 capability indicator가 L(largely fulfilled) 또는 F(fully fulfilled)로 달성돼야 한다.","6장 정의: capability indicator = process capability 심사에 쓰는 process capability 지표."],"traps":["경계값: 정확히 15%는 N, 50%는 P, 85%는 L이다. 각 등급은 아래쪽 경계를 포함하지 않고(>) 위쪽 경계를 포함한다(≤). 단 N은 0%부터다.","2018년판(인터넷 자료)과 다름: 2018년판은 “목표 레벨의 지표는 L, 하위 레벨의 지표는 F”여야 한다고 했다. v2.1은 “L 또는 F”라고만 쓴다. P로는 레벨을 달성하지 못한다. 또 지표 종류가 2018년판은 BP+work product(WP), GP+resources였고, v2.1은 BP+information item, GP+information item이다. PA 2.1 이름도 2018년판 “Performance management” → v2.1 “Process performance management”."]},{"id":"2.1.2.3","title":"테스트 전략과 criteria for regression verification","points":["ASPICE는 capability level 2부터 각 테스트 프로세스(2.1.2.1)마다 테스트 전략(즉 verification measures)을 요구한다.","테스트 관리자가 테스트 계획 중에 테스트 전략을 만든다. 테스트 지침, 프로젝트 목표, 계약·규제 요구사항이 그 기반이다.","테스터는 테스팅 원리인 조기 테스팅을 안다. 이는 자동차 환경의 SW 테스팅에도 적용된다. 다만 여기에는 상위 테스트 레벨의 테스트 환경이 훨씬 비싸다는 측면이 더해진다. 예: 상위 레벨 테스팅에는 특별히 개발된 임베디드 하드웨어(예: 프로토타입이나 단일 모델)가 필요하다.","테스트 전략은 레벨별 테스트 환경을 정하고, 테스터가 어떤 테스트를 어떤 테스트 환경에서 수행해야 하는지도 정한다.","criteria for regression verification은 테스트 전략의 핵심 부분이다. 리그레션 검증의 세부 사항을 정한다(각주: ISTQB의 regression-averse 테스트 전략과 비슷하다).","어려운 점은 테스트 케이스를 경제적으로 합리적으로 고르는 것(즉 테스팅의 부가가치)이다.","criteria for regression verification은 리그레션 테스트를 고르는 테스트 목적과 테스트 접근법을 정한다. 예를 들어 리스크 기반으로 고를 수 있다.","영향도 분석은 테스터가 리그레션 테스트로 집중해야 할 영역을 찾는 데 도움이 된다. 하지만 테스트 관리자가 릴리스마다 자동화된 테스트 케이스를 모두 반복하라고 요청할 수도 있다."],"traps":["2018년판(인터넷 자료)과 다름: 2018년판은 테스트 전략을 base practice로 요구했다. v2.1은 “capability level 2부터” 요구한다. 이름도 “regression test strategy” → “criteria for regression verification”, 리그레션 테스트 선택에서 정하는 것도 “objective and technique” → “테스트 목적과 테스트 접근법”으로 바뀌었다.","리그레션 테스트를 꼭 일부만 골라야 하는 것은 아니다. 실라버스는 리스크 기반 선택을 예로 들지만, 릴리스마다 자동화 테스트 케이스 전체를 반복하라는 요청도 가능하다고 쓴다."]},{"id":"2.1.2.4","title":"ASPICE의 테스트웨어","points":["ASPICE 4.0은 테스트웨어에 요구사항을 두지 않는다. 대신 테스팅 중 생기는 특정 정보의 문서화에 대한 요구사항을 둔다.","테스트 활동에 대해 ASPICE가 요구하는 information item(II):\n08-60: Verification measures(예: 시뮬레이션, 동적 테스트, 정적 테스트). 보통 테스트 계획서에 문서화한다.\n15-52: Verification results(예: 문서화된 검증 로그, 테스트 보고서, 결함 보고서).","ASPICE는 information item마다 information item characteristics(IIC)와 내용의 예를 정의한다. 이는 프로세스 수행의 객관적 지표 역할을 한다.","ISO/IEC/IEEE 29119-3을 이용해 information item을 더 구조화할 수 있다."],"traps":["2018년판(인터넷 자료)과 다름: 2018년판 제목은 “Test documentation in ASPICE”이고 WP 08-50(test specification), 08-52(test plan), 13-50(test result)의 세 가지였다. v2.1은 information item 08-60(verification measures)과 15-52(verification results) 두 가지다. 2018년판은 test plan이 29119-3을 직접 참조한다고 했지만, v2.1은 29119-3을 “쓸 수 있다”고만 한다.","“ASPICE가 테스트웨어 요구사항을 정한다”는 보기는 틀린다. ASPICE 4.0은 테스팅 중 생기는 정보의 문서화를 요구한다. 08-60은 verification measures(시뮬레이션, 동적·정적 테스트, 보통 테스트 계획서에 기록), 15-52는 verification results(검증 로그, 테스트 보고서, 결함 보고서)다. 결함 보고서는 15-52 쪽이다."]},{"id":"2.1.2.5","title":"software unit verification의 verification measures (K3)","points":["테스터는 verification measures에 따라 software detailed design 준수와, 기능·비기능 요구사항 준수를 검증한다. measures는 테스터가 증거를 어떻게 제공하는지를 정한다.","테스터는 SW unit 검증에 정적 테스트 기법과 동적 테스트 기법을 조합해 쓸 수 있다.","SWE.4.BP.1에서 ASPICE는 SW unit 검증을 위한 verification measures(2.1.2.4 참고) 정의를 요구한다. 이로써 테스터는 SW unit이 요구사항을 얼마나 충족하는지 평가할 수 있다.","software unit verification measures로 쓸 수 있는 예:\n① 테스트 데이터를 포함한 SW unit 테스트 케이스\n② 코딩 가이드라인(예: MISRA-C, 4.1.1) 준수를 평가하는 도구 지원 정적 분석\n③ 도구 지원 정적 분석으로 평가할 수 없는 SW unit이나 SW unit 일부에 대한 리뷰","개발자가 SW unit을 바꾸면 테스터도 그 변경을 평가해야 한다. 그래서 SW unit의 verification measures에는 criteria for regression verification도 들어간다.","여기에 포함되는 것: 변경된 코드의 검증, 확인 테스팅, 변경되지 않은 부분의 반복 검증(정적·동적 리그레션 테스트).","관련 6장 정의(4.1.1에서 다룸): MISRA-C의 rule은 정적 분석으로 완전히 검증할 수 있는 프로그래밍 가이드라인이고, directive는 정적 분석으로 완전히 검증할 수 없는 프로그래밍 가이드라인이다."],"traps":["2018년판(인터넷 자료)과 다름: 2018년판은 SWE.4.BP.2, “verification strategy / criteria for unit verification”이었고 예시에 “테스트 커버리지 목표(예: 결정 커버리지)”가 있었다. v2.1은 SWE.4.BP.1, “verification measures”이고 예시는 위 세 가지뿐이다. 2018년판의 “Code reviews”도 “Reviews”로 바뀌었다.","실라버스 예시에서 리뷰는 “도구 지원 정적 분석으로 평가할 수 없는” 부분을 위한 measure로 나온다. 코딩 가이드라인 준수 평가는 도구 지원 정적 분석 쪽이다.","SW unit이 바뀌면 바뀐 코드만 다시 보는 게 아니다. 확인 테스팅과 함께 변경되지 않은 부분도 정적·동적으로 다시 검증한다."]},{"id":"2.1.2.6","title":"ASPICE의 추적성","points":["CTFL 실라버스처럼 ASPICE도 양방향 추적성(bidirectional traceability)을 요구한다. 실라버스에서 이후 “추적성”은 항상 양방향 추적성을 뜻한다(각주).","양방향 추적성으로 테스터는 다음을 할 수 있다:\n① 영향 분석(예: 변경 영향도 분석)\n② 커버리지 평가\n③ 상태 추적","또한 연결된 요소 사이의 일관성을 텍스트상으로도, 의미상으로도 보장할 수 있다.","수직 추적성: 이해관계자 요구사항이 모든 레벨을 거쳐 SW unit까지 연결돼야 한다. 모든 개발 레벨을 잇는 연결이 관련 work product 사이의 일관성을 보장한다.","수평 추적성: 개발의 작업 결과와 그에 대응하는 테스트 명세·테스트 결과 사이의 추적성과 일관성을 요구한다.","base practice SUP.10.BP4는 변경 요청과 그 변경 요청의 영향을 받는 work product 사이의 양방향 추적성을 요구한다. 변경 요청은 결함에서 시작되는 경우가 많아서, 변경 요청과 해당 결함 보고서 사이에도 양방향 추적성을 만든다.","링크 수가 많아질 때가 있으므로 일관된 도구 체인이 도움이 된다. 테스터가 의존 관계를 효율적으로 만들고 관리할 수 있다."],"traps":["수직 = 이해관계자 요구사항부터 SW unit까지 개발 레벨을 위아래로 잇는 것, 수평 = 개발 작업 결과와 테스트 명세·테스트 결과를 잇는 것이다. 둘을 바꾼 보기가 함정이다.","2018년판(인터넷 자료)과 다름: 수직 추적성의 끝이 2018년판 “software components” → v2.1 “software units”, base practice 번호가 SUP.10.BP8 → SUP.10.BP4, 변경 요청과 잇는 대상이 “problem report” → “결함 보고서(defect reports)”로 바뀌었다."]},{"id":"2.2","title":"ISO 26262 개요","points":["2.2절 구성: 기능 안전과 안전 문화(2.2.1), 안전 수명주기 안의 테스터(2.2.2), 표준 구조와 테스터 관련 부(2.2.3), ASIL과 테스트 범위(2.2.4), method table 적용(2.2.5).","ISO 26262는 기능 안전 표준이다. 기반 표준 IEC 61508에서 ISO가 만들었고, 2018년 2판이 나와 있다(2.2.1.1)."],"traps":["2018년판(인터넷 자료)과 다름: 2018년판 실라버스는 ISO 26262:2011(10부)을 기준으로 썼다. v2.1은 2018년 2판(12부) 기준이라 부 번호와 method table이 있는 부가 다르다."]},{"id":"2.2.1.1","title":"E/E 시스템 기능 안전의 목적","points":["임베디드 시스템의 기능적·기술적 복잡도가 계속 높아진다. 동시에 강력한 SW 기반 E/E 시스템이 자동차 운전 기능 자동화 같은 새롭고 복잡한 기능을 가능하게 한다.","복잡도가 커지면 개발 중 잘못된 행동이 일어날 리스크도 커진다. 그 결과 시스템에 발견되지 않은 결함이 남을 수 있다.","생명과 신체에 위험을 줄 수 있는 시스템은 담당 safety engineer나 safety manager가 잠재 리스크를 분석해야 한다. 실제 리스크가 있으면 리스크 영향을 수용 가능한 리스크 수준까지 낮출 적절한 조치를 찾아야 한다.","이런 분석 방법은 기능 안전 표준에 정리돼 있다. 기반 표준은 IEC 61508이다. ISO(International Organization for Standardization)가 이 표준에서 ISO 26262를 만들었고, 2018년 2판이 나와 있다.","기능 안전은 E/E 시스템이 오작동 동작에서 비롯된 hazard로 불합리한 리스크를 일으키지 않고 동작하도록 보장하는 것이다.","이 의미에서 기능 안전은 정보 보안(또는 사이버보안), product safety, occupational safety 같은 관련 용어와 구별된다.","occupational safety와 사이버보안은 ISO 26262의 초점이 아니다. 그러나 사이버보안이 부족하면 기능 안전이 위협받을 수 있다. 기능 안전과 사이버보안은 모두 product safety에 기여한다."],"traps":["사이버보안은 ISO 26262의 초점이 아니지만 기능 안전과 무관하지는 않다. 사이버보안이 부족하면 기능 안전이 위협받을 수 있고, 둘 다 product safety에 기여한다.","목표는 리스크를 0으로 만드는 것이 아니다. 리스크 영향을 “수용 가능한 리스크 수준”까지 낮추고, “불합리한” 리스크가 없게 하는 것이다."]},{"id":"2.2.1.2","title":"안전 문화에 대한 테스터의 기여","points":["ISO 26262에 따른 제품 개발에서는 자기 조직의 프로세스만 모니터링하는 것으로 충분하지 않다. 모든 참여자가 프로세스를 넘나드는(cross-process) 접근을 따라야 한다.","모두가 자신이 개발 프로세스와 최종 제품의 안전에 주는 영향을 이해해야 한다. 외부 파트너와 공급업체도 포함된다.","참여자는 자기 행동이 다른 프로세스와 독립적으로 일어나지 않는다는 것을 이해해야 한다. 개발의 각 단계는 안전 관련 요구사항의 준수와 구현 모두에 핵심적으로 기여한다.","이 책임은 시장 출시로 끝나지 않는다. safety lifecycle이 끝날 때까지 이어진다.","테스터는 SW 개발 수명주기 단계에 책임 있게 참여하고, 제품 개발의 전체 맥락을 계속 보면서 일함으로써 안전 문화에 기여한다."],"traps":["2018년판(인터넷 자료)과 다름: 책임이 이어지는 끝이 2018년판 “system lifecycle”의 끝 → v2.1 “safety lifecycle”의 끝이다. 시장 출시에서 끝난다는 보기는 틀린다."]},{"id":"2.2.2","title":"safety lifecycle(안전 수명주기) 안의 테스터","points":["safety lifecycle은 제품 개발 중 안전 지향 활동을 기술한다. 첫 제품 아이디어와 가능한 리스크 식별에서 시작한다. 그 결과 나온 안전 요구사항을 명세한 뒤 특정 제품으로 구현한다. 수명이 끝난 제품의 폐기로 끝난다.","ISO 26262 safety lifecycle의 단계:\n1단계: Concept phase(개념 단계)\n2단계: Product development(제품 개발). 이 단계는 “release for production”으로 끝난다.\n3단계: Production, operation, service and decommissioning(생산, 운영, 서비스, 폐기)","테스터는 주로 처음 두 단계에서 일한다.","3단계 중 제품을 바꾸면 변경 범위에 따라 1단계나 2단계로 돌아간다. 그래서 테스터는 변경(modification)에도 참여한다.","안전 관련 요구사항을 바탕으로 테스트 기법을 고르고, 그 요구사항의 베리피케이션과 밸리데이션을 위한 테스트 케이스를 설계한다. 테스터는 이 작업을 제품 개발의 해당 하위 단계에서 수행한다.","테스트 계획은 보통 개념 단계에서 한다. 하지만 그 결과 문서(예: 테스트 계획서, 테스트 명세)는 어느 단계에서든 조정이 필요할 수 있다.","테스트 실행은 주로 제품 개발의 하위 단계 사이 전환 시점에 이뤄진다. 예: 구현에서 SW 통합으로, 그다음 HW-SW 통합으로 넘어갈 때.","또한 테스터는 테스트 활동으로 3단계로의 전환에 크게 기여한다.","6장 정의: safety lifecycle = 안전 관련 시스템의 착수부터 폐기까지의 수명주기."],"traps":["테스트 계획은 보통 “개념 단계”에서 한다. 실무 감각으로 제품 개발 단계를 고르면 틀린다. 테스트 실행은 주로 제품 개발 “하위 단계 사이의 전환 시점”이다.","2018년판(인터넷 자료)과 다름: 단계 이름이 2018년판 “Product concept / Product development / Product production and maintenance(release for production 이후)” → v2.1 “Concept phase / Product development(release for production으로 끝남) / Production, operation, service and decommissioning”. “release for production”은 v2.1에서 2단계(제품 개발)의 끝이다.","1장의 system lifecycle 6단계(concept, development, production, utilization, support, retirement)와 섞지 않는다. 1장 각주는 safety lifecycle이 비슷한 단계로 이뤄진다고 하지만, 2.2.2가 나열하는 ISO 26262 safety lifecycle 단계는 3개다."]},{"id":"2.2.3.1","title":"표준의 설계와 구조 [informative]","points":["(참고, 출제 LO 아님) ISO 26262는 12부로 구성된다:\n1부: Vocabulary(용어)\n2부: Management of functional safety(기능 안전 관리)\n3부: Concept phase(개념 단계)\n4~6부: 시스템·하드웨어·SW 레벨의 Product development(제품 개발)\n7부: Production, operation, service and decommissioning\n8부: Supporting processes(지원 프로세스)\n9부: ASIL-oriented and safety-oriented analysis\n10부: Guidelines on ISO 26262\n11부: Guidelines on application of ISO 26262 to semiconductors\n12부: Adaptation of ISO 26262 for motorcycles","(참고, 출제 LO 아님) 3~7부가 safety lifecycle의 단계에 해당한다.","(참고, 출제 LO 아님) 1부, 10부, 11부를 뺀 각 부는 일반 소개, 적용 범위, 규범적 참조, 표준 준수 요구사항을 담는다. 그 뒤에 그 부의 구체 주제가 온다.","(참고, 출제 LO 아님) 수행할 활동은 모든 부에서 반복되는 구조로 기술된다: Objective, General information, Introductory information, Prerequisites, Further supporting information, Requirements and recommendations, Work results."],"traps":[]},{"id":"2.2.3.2","title":"테스터와 관련된 ISO 26262의 부","points":["SW 테스터에게는 SW 베리피케이션과, 적어도 부분적으로는 시스템 밸리데이션이 가장 중요하다.","1부(용어) 외에 여러 부가 특히 중요하다. 4부와 6부는 권장되는 SW 베리피케이션 조치에 대한 상세 정보와 요구사항을 준다. 이는 해당 베리피케이션 조치의 선택, 설계, 구현, 실행에 적용된다.","4부는 시스템 레벨(safety validation 포함), 6부는 SW 레벨의 테스트·베리피케이션 측면에 초점을 둔다.","하드웨어 측면도 관련이 있으면 테스터는 5부에서 찾는다. 하드웨어와 SW 모두에 관한 측면은 하드웨어-SW 인터페이스 범위(4~6부)에서 다룬다.","8부는 특별한 역할을 한다. 모든 테스트 레벨에서 베리피케이션의 프로세스 특성을 기술한다. 또한 표준화된 프로세스를 보장하는 데 중요한 지원 프로세스의 요구사항(예: 형상 관리, 도구 qualification)을 담는다.","12부에서는 모터사이클 프로젝트용으로 새로 도입된 MSIL(Motorcycle Safety Integration Level) 심사에 기반해 조정된 method table을 찾을 수 있다."],"traps":["2018년판(인터넷 자료)과 다름: 8부 지원 프로세스 예시가 2018년판 “문서화와 도구 qualification” → v2.1 “형상 관리와 도구 qualification”이다. 12부는 v2.1에서 테스터 관련 부로 새로 들어갔다."]},{"id":"2.2.4.1","title":"ASIL의 criticality level","points":["ASIL은 기능 안전 조치로 필요한 리스크 감소의 척도다. 그런 조치의 예: E/E 시스템을 감시하는 독립적인 안전 기능, 특별히 정의된 방법의 구현. 리스크 수준이 높으면 더 정교한 조치가 필요할 수 있다.","프로젝트 시작 때 전문가 팀이 제품에 대해 HARA(hazard analysis and risk assessment)를 수행한다. 이 분석으로 식별한 hazard마다 팀이 표준에 정의된 방법으로 ASIL을 정한다.","다음 단계로 팀은 안전 목표(safety goal)와 안전 요구사항(safety requirement)을 정의한다. 이들은 근거가 된 hazard와 같은 ASIL을 가진다.","ISO 26262는 네 레벨을 정의한다: 낮은 안전 요구인 ASIL A부터 높은 안전 요구인 ASIL D까지(ASIL A, B, C, D).","HARA 결과 ASIL A 미만인 요구사항은 표준상 안전 관련이 아니다. 이런 요구사항에는 기능 안전 관련 조치가 필요 없고, 기존 품질경영시스템(QMS)으로 다루면 충분하다.","실무상 이런 요구사항을 ASIL 관련 요구사항과 구분하려고 “QM”으로 표시하는 경우가 많다."],"traps":["ASIL은 A~D 네 레벨이다(가장 낮은 안전 요구 ASIL A, 가장 높은 것 ASIL D). QM은 다섯 번째 ASIL 레벨이 아니다. ASIL A 미만이라 표준상 안전 관련이 아닌 요구사항을 구분하려고 붙이는 표시다."]},{"id":"2.2.4.2","title":"ASIL이 테스트 기법, 테스트 유형, 테스트 범위에 주는 영향","points":["정해진 ASIL은 테스터가 수행할 테스트의 범위에 직접 영향을 준다.","ISO 26262는 ASIL 레벨에 따라 서로 다른 조치나 조치 묶음의 수행을 권고한다. 높은 ASIL에는 더 광범위하고 상세한 조치를 권고한다. 낮은 ASIL에서는 명시된 조치의 수행이 선택 사항인 경우가 많다.","ISO 26262의 권고 수준은 세 가지다: no recommendation, recommended, highly recommended.","권고 수준의 일반적 해석:\nhighly recommended: 반드시 적용한다(must).\nrecommended: 적용하는 것이 원칙이고(should), 적용하지 않으면 그 근거를 제시해야 한다(shall).\nno recommendation: 표준이 그 조치의 사용에 찬성도 반대도 권고하지 않는다. 지원 조치로 문제없이 쓸 수 있다. 하지만 그 수행이 recommended나 highly recommended 조치를 대신하지는 않는다.","테스터 입장에서는, 표준이 안전 관련 시스템에 대해 ASIL에 따라 특정 테스트 기법과 테스트 유형을 권고한다는 뜻이다. 테스터는 표준이 그 특수한 경우에 허용하는 범위 안에서만 자유롭게 결정할 수 있다.","예: 동등 분할과 경계값 분석은 ASIL A에서는 recommended일 뿐이다. ASIL B 이상에서는 highly recommended다(2.2.5).","ASIL은 제품 전체의 특성이 아니다. 특정 안전 목표와 거기서 파생된 안전 요구사항에 묶여 있다. 그래서 같은 제품이라도 ASIL이 다른 안전 요구사항은 테스트 노력이 크게 다를 수 있다. 테스터는 테스트 범위를 계획할 때 이를 고려해야 한다."],"traps":["현업에서는 “ASIL D 제어기”처럼 제품에 ASIL을 붙여 말하기도 한다. 실라버스는 ASIL이 제품 전체의 특성이 아니라 특정 안전 목표와 그 안전 요구사항에 묶인다고 쓴다. 한 제품 안에서도 요구사항마다 테스트 노력이 다를 수 있다.","동등 분할·경계값 분석: ASIL A = recommended, ASIL B 이상 = highly recommended. 레벨을 하나씩 밀어 낸 보기에 주의한다."]},{"id":"2.2.5","title":"ISO 26262 맥락에서 CTFL 내용 적용: method table (K3)","points":["ISO 26262는 테스트 활동에 대한 구체적 권고를 method table 형태로 테스터에게 준다. method table은 4, 5, 6, 8, 12부에 있다.","method table에는 테스트 프로세스와 테스트 활동에 대한 기능 안전 고유 권고 외에, 사용할 테스트 기법도 들어 있다.","이 맥락에서 표준은 적용 가능한 모든 테스트 기법이나 테스트 활동에 “method”라는 말을 쓴다. 여기서 기능 안전 용어는 ISTQB 용어와 조금 다르다.","테스터에게 특히 중요한 ISO 26262의 method:\n① 테스트 기법(예: 동등 분할, 경계값 분석)\n② 테스트 실행 기법(예: 컴포넌트나 시스템의 시뮬레이션 또는 프로토타입)\n③ 테스트 유형(예: 성능 테스팅, endurance 테스팅 같은 비기능 테스트)\n④ 테스트 환경(예: HiL(hardware-in-the-loop), 차량)\n⑤ 정적 테스트 기법(예: 리뷰, 정적 분석)","method table은 ASIL 레벨마다 표준이 권고하는 method를 정한다. 항상 같은 구조로 되어 있다.","표 1(method table 예), 열은 ASIL A / B / C / D:\n1 Method x: o / + / ++ / ++\n2 Method y: o / o / + / +\n3a Method z1: + / ++ / ++ / ++\n3b Method z2: ++ / + / o / o","기호: + = recommended(권고), ++ = highly recommended(강력 권고), o = 선택(optional). o로 표시된 method는 표준이 사용에 찬성도 반대도 권고하지 않는다.","ISO 26262는 동등한 대체 method를 문자 접미사로 표시한다(표 1의 3a, 3b). 이때 테스터는 관련 요구사항을 ASIL에 맞게 검증할 수 있도록 적절한 조합을 골라야 하고, 고른 조합이 유용하다는 것을 정당화해야 한다.","대체 method가 없는 method(표 1의 1행, 2행)에는 이런 선택이 허용되지 않는다. 테스터는 해당 ASIL에서 highly recommended인 method를 모두 적용해야 한다.","예: ASIL C 요구사항을 검증할 때 표 1에서 나오는 결론:\nMethod x: highly recommended이므로 ISO 26262에 따라 개발할 때 반드시 적용해야 한다.\nMethod y: recommended이므로 적용하는 것이 원칙이고(should), 적용하지 않으면 근거를 제시해야 한다.\nMethod z1과 z2: ASIL C에서 권고 수준이 가장 높은 z1을 최소한 골라야 한다(should).","ISO 26262는 method table에 없는 다른 method를 쓰는 것도 허용한다. 이때 고른 method의 유용성과 적합성을 정당화해야 한다.","일반적으로 ISO 26262는 안전 활동을 특정 프로젝트의 필요에 맞게 조정하는 것(테일러링(tailoring))을 허용한다. 테스트 관련 활동에서는 테스트 전략과 테스트 접근법을 그 프로젝트에 맞게 테일러링할 수 있다는 뜻이다."],"traps":["표 1을 읽을 때는 문제의 ASIL 열 하나만 본다. 3a/3b 중 권고 수준이 더 높은 쪽은 ASIL마다 다르다(ASIL A는 z2, B·C·D는 z1). 다만 '권고 수준이 가장 높은 대안을 최소한 고른다'는 실라버스가 ASIL C 예시로만 설명한다. 대안 중에서는 적합한 조합을 고르고 그 선택이 유용한 이유를 정당화하는 것이 기본 규칙이다. 공식 샘플 A 17번도 ASIL A에서 ++ 대안 대신 + 대안을 이유와 함께 고른 결정을 정답으로 본다.","문자 접미사가 붙은 행(3a, 3b)은 대체 method라 조합을 골라 정당화한다. 접미사가 없는 행(1, 2)은 골라 쓸 수 없고, 그 ASIL에서 ++인 method는 모두 적용한다.","o는 “금지”가 아니다. 표준이 찬성도 반대도 하지 않는다는 뜻이고 지원 조치로 쓸 수 있지만, +나 ++ method를 대신하지 못한다(2.2.4.2). 또 현업에서 “+는 해도 되고 안 해도 된다”고 받아들이기 쉽지만, v2.1은 recommended를 “적용하는 것이 원칙이고, 적용하지 않으면 근거 제시”로 해석한다.","ISO 26262의 “method”는 ISTQB의 테스트 기법보다 넓다. 테스트 실행 기법, 테스트 유형, 테스트 환경(HiL, 차량), 정적 테스트 기법까지 포함한다.","2018년판(인터넷 자료)과 다름: method table이 있는 부가 2018년판 “4, 5, 6, 8부” → v2.1 “4, 5, 6, 8, 12부”. 표 1의 기호 값은 같지만 해석이 바뀌었다: method x는 2018년판 “보통 적용” → v2.1 “반드시 적용”, method y는 “근거 확보에 유용하면 적용” → “적용하거나 미적용 근거 제시”. 테스트 유형 예시도 soak test → endurance 테스팅이다. 테일러링 문단은 v2.1에 새로 들어갔다. 권고 수준의 일반 해석 문장(highly recommended는 반드시 적용, recommended는 적용하거나 미적용 근거 제시, 2.2.4.2)도 2018년판에는 없다."]},{"id":"2.3","title":"AUTOSAR 개요","points":["AUTOSAR는 AUTomotive Open System Architecture의 약자다. AUTOSAR는 아키텍처이면서 그 뒤의 개발 파트너십이기도 하다.","AUTOSAR 파트너십은 2003년에 설립됐고, 주로 자동차 업계의 OEM(완성차 업체)과 공급업체(supplier)로 이뤄진다. 목표는 자동차 SW 아키텍처를 위한 개방형 업계 표준을 함께 개발하고 확립하는 것이다.","오늘날 AUTOSAR는 자동차 E/E 시스템에 대해 전 세계적으로 자리 잡은 표준이다. 그래서 테스터는 AUTOSAR 작업 산출물을 분명히 만나게 된다.","테스터에게 중요한 것: AUTOSAR의 프로젝트 목표, AUTOSAR 아키텍처의 일반 구조, 그리고 이들이 테스터 업무에 주는 영향.","6장 정의: AUTOSAR(Automotive Open System Architecture) = 자동차 업계 SW 아키텍처의 개방형 업계 표준을 세우는 개발 파트너십. 이 말은 표준화된 SW 아키텍처와 그에 딸린 시스템/SW 개발 접근 방식을 가리키는 데도 쓴다."],"traps":[]},{"id":"2.3.1","title":"AUTOSAR의 프로젝트 목표","points":["AUTOSAR의 프로젝트 목표(8가지):\n① SW의 portability 지원\n② 서로 다른 아키텍처와 하드웨어 variant에 걸친 scalability 지원\n③ 서로 다른 기능 도메인 지원\n④ non-AUTOSAR 시스템과의 데이터 교환 지원\n⑤ 자동차 SW를 위한 개방형 아키텍처 정의\n⑥ availability, reliability, safety, integrity, maintainability, usability로 특징지어지는 dependable 시스템의 개발 지원\n⑦ 파트너 간 협업 지원\n⑧ 해당 국제 자동차 표준과 state of the art 기술 지원"],"traps":["2018년판(인터넷 자료)과 다름: 2018년판은 9개였다. v2.1에는 “천연자원의 지속가능한 사용”과 “ECU 기본 SW 기능의 표준화”가 없고, “non-AUTOSAR 시스템과의 데이터 교환 지원”이 새로 들어갔다. scalability 대상도 2018년판 “차량·플랫폼 variant” → v2.1 “아키텍처와 하드웨어 variant”이다. dependable 시스템 특성은 v2.1에서 availability, reliability, safety, integrity, maintainability, usability 6가지다. 2018년판은 safety에 사이버보안을 묶어 “safety & security”로 적었고 usability가 없었다."]},{"id":"2.3.2","title":"AUTOSAR의 일반 구조 [informative]","points":["(참고, 출제 LO 아님) AUTOSAR 아키텍처에는 Classic과 Adaptive 두 variant가 있다. 실라버스는 단순화를 위해 AUTOSAR Classic에 초점을 둔다.","(참고, 출제 LO 아님) AUTOSAR 시스템은 보통 여러 ECU로 이뤄진다. 각 ECU에서 AUTOSAR Classic의 SW 아키텍처는 세 계층으로 되어 있다:\n맨 위 application layer: 하드웨어와 무관하다. 이 계층의 컴포넌트를 AUTOSAR software component(SW-C)라고 한다.\n맨 아래 하드웨어 지향 계층: 표준화된 basic software(BSW).\n중간 추상화 계층: AUTOSAR runtime environment(RTE). 일종의 미들웨어로서 SW-C 사이, 그리고 SW-C와 BSW 사이의 데이터 흐름을 구현한다.","(참고, 출제 LO 아님) AUTOSAR 방법론에서 OEM과 공급업체는 AUTOSAR 템플릿 기반 설명 파일(이른바 arxml 파일)로 시스템 정보를 주고받는다:\nECU configuration description: 한 ECU에 SW-C를 통합하기 위한 데이터\nsystem configuration description: 차량 안의 모든 ECU를 통합하기 위한 데이터\nECU extract: system configuration description 중 한 ECU에 해당하는 데이터","(참고, 출제 LO 아님) 6장 정의: BSW = AUTOSAR에서 표준화된 하드웨어 지향 컴포넌트로 이뤄진 SW 계층. SW-C = AUTOSAR에서 하드웨어 독립적인 application SW 계층의 컴포넌트. RTE = AUTOSAR에서 SW-C 사이, 그리고 application SW와 BSW 사이의 데이터 교환을 통제하고 구현하는 추상화 계층. 이 데이터 교환은 ECU 안과 ECU 사이 모두를 가리킨다."],"traps":[]},{"id":"2.3.3","title":"AUTOSAR가 테스터 업무에 주는 영향","points":["AUTOSAR는 특히 다음 테스트 레벨에서 테스터 업무에 영향을 준다.","가상 환경(예: SiL(software-in-the-loop))에서의 SW 컴포넌트 테스팅과 SW 통합 테스팅: BSW와 RTE의 시뮬레이션을 써서 테스터가 SW-C를 일찍 테스트할 수 있다.","실제 ECU에서의 SW 컴포넌트 테스팅과 SW 통합 테스팅: 테스터가 RTE의 통신에 접근할 수 있다. 그래서 런타임에 SW-C의 동작을 관찰하고 제어할 수 있다.","AUTOSAR acceptance test: 통신 레벨과 애플리케이션 레벨에서 AUTOSAR 기능의 준수를 보장하는 SW 시스템 테스트다. AUTOSAR acceptance test 수행은 선택 사항이다.","시스템 통합 테스팅: 여러 ECU의 통합이다. 예를 들어 여러 ECU에 분산 구현된 기능을 테스트한다. 아직 구현되지 않은 기능을 시뮬레이션해 시스템 동작을 일찍 평가할 수 있다."],"traps":["AUTOSAR acceptance test는 수행이 선택 사항이다. 이름에 acceptance가 있지만 실라버스는 AUTOSAR 기능 준수(통신·애플리케이션 레벨)를 확인하는 SW 시스템 테스트로 설명한다.","가상 환경에서 시뮬레이션하는 것은 BSW(하드웨어 지향 계층)와 RTE(중간 계층)이고, 테스트 대상은 SW-C(하드웨어 독립 application layer)다. 실제 ECU에서는 RTE 통신에 접근해 SW-C 동작을 런타임에 관찰·제어한다.","2018년판(인터넷 자료)과 다름: 실제 ECU 항목이 2018년판 “Software test ... measure and stimulate” → v2.1 “Software component testing ... observe and control”이다."]},{"id":"2.4","title":"ASPICE, ISO 26262, CTFL 비교 개요","points":["2.4절은 ASPICE와 ISO 26262의 목적 차이(2.4.1)와, ASPICE·ISO 26262·CTFL의 테스트 레벨 차이(2.4.2, 표 2)를 다룬다."],"traps":[]},{"id":"2.4.1","title":"ASPICE와 ISO 26262의 목적","points":["제품 개발에 대한 요구사항을 제시하는 표준은 여럿이다. 보통 이들은 개발의 서로 다른 측면을 강조한다.","ISO 26262의 목적은 적절한 요구사항과 프로세스를 제공해 하드웨어와 SW 양쪽의 장애(failure)로 인한 리스크를 피하는 것이다. E/E 시스템 개발에서 테스터가 쓸 테스트 프로세스와 method의 요구사항을 정한다. 이 요구사항은 아이템(item)의 ASIL 레벨에 따라 달라진다.","ASPICE의 목적은 심사(assessment) 틀 안에서 제품 개발 프로세스의 capability를 판정하는 것이다. 이를 위해 ASPICE는 이 프로세스들에 대해 심사 가능한 기준을 정의한다. ISO 26262와 달리 이 기준은 제품의 ASIL 레벨과 무관하다."],"traps":["ASIL에 따라 요구가 달라지는 것은 ISO 26262다. ASPICE는 제품 안전이 아니라 제품 개발 프로세스의 capability를 판정하고, 그 심사 기준은 ASIL과 무관하다.","2018년판(인터넷 자료)과 다름: ISO 26262 목적이 2018년판 “개발 중 체계적 장애와 운영 중 하드웨어 장애로 인한 리스크 회피” → v2.1 “하드웨어와 SW 양쪽의 장애로 인한 리스크 회피”다."]},{"id":"2.4.2","title":"ASPICE, ISO 26262, CTFL의 테스트 레벨 비교","points":["ISO 26262와 ASPICE 모두 테스트 레벨을 기술하지만, CTFL의 테스트 레벨과 완전히 일치하지는 않는다. 그래서 개발 팀 안에서 효율적이고 효과적으로 협업하려면 테스터가 모든 테스트 레벨을 공통으로 이해해야 한다.","ASPICE의 “system”, ISO 26262의 “system”과 “item”은 하드웨어와 SW 컴포넌트로 이뤄진 제품을 뜻한다. 반면 CTFL 실라버스는 “system”이라는 말을 SW만 가리킬 때 쓴다.","표 2(테스트 레벨 대응), 순서는 ISTQB CTFL → ISO 26262:2018 → ASPICE 4.0:\n인수 테스팅 → Safety validation(4-8) → Validation(VAL.1)\n시스템 오브 시스템 테스팅 → System and item integration and testing(4-7) → System verification(SYS.5)\n시스템 통합 테스팅 → System and item integration and testing(4-7) → System integration and integration verification(SYS.4)\n시스템 테스팅 → Testing of the embedded software(6-11) → Software verification(SWE.6)\n컴포넌트 통합 테스팅 → Software integration and verification(6-10) → Software component verification and integration verification(SWE.5)\n컴포넌트 테스팅 → Software unit verification(6-9) → Software unit verification(SWE.4)","표 2에서 ISO 26262 칸의 괄호 숫자는 ISO 26262의 부와 그 안의 장을 가리킨다(예: 4-8). ASPICE 칸의 괄호는 프로세스 ID다. ISO 26262 칸의 System and item integration and testing(4-7)은 시스템 오브 시스템 테스팅과 시스템 통합 테스팅 두 행에 걸친 한 칸이다.","표 2 각주:\nSafety validation과 Validation(VAL.1)은 각각 ISTQB 인수 테스트의 일부만 다룬다.\n시스템 오브 시스템 테스팅 = 이종 분산 시스템 여러 개의 테스팅.\nitem integration and test는 세 단계다: element의 하드웨어·SW 통합과 테스팅, 아이템에 속한 모든 element의 통합과 테스팅, 차량 안의 다른 아이템과 연결한 아이템의 통합과 테스팅.\nTesting of the embedded software(6-11) = 타깃 하드웨어에서 실행하는, 기능 안전 SW(시스템) 요구사항의 테스트.\nSWE.5와 6-10은 CTFL의 컴포넌트 테스팅(“component” 의미)도 추가로 다룬다.\nSWE.4와 6-9는 CTFL의 컴포넌트 테스팅(“unit” 의미)을 다룬다.","CTFL 실라버스에서는 대부분의 테스트 기법을 여러 테스트 레벨에서 쓸 수 있다. 마찬가지로 ASPICE도 테스트 기법을 테스트 레벨에 일반적으로 배정하지 않는다. 둘 다 선택을 테스터에게 맡긴다.","ISO 26262에는 테스트 레벨마다 별도의 method table이 있다(2.2.4, 2.2.5). 이 표가 ASIL 레벨에 따른 테스트 기법 권고를 테스터에게 준다."],"traps":["실무 감각으로 CTFL “시스템 테스팅”을 SYS.5에 붙이기 쉽다. 표 2에서 CTFL 시스템 테스팅은 SWE.6(Software verification)과 ISO 26262 6-11이다. CTFL의 “system”은 SW만 가리키기 때문이다. SYS.5는 시스템 오브 시스템 테스팅 행에 있다.","테스트 레벨마다 method table로 테스트 기법 권고를 주는 것은 셋 중 ISO 26262다. CTFL과 ASPICE는 테스트 기법 선택을 테스터에게 맡긴다.","2018년판(인터넷 자료)과 다름: 인수 테스팅의 ISO 26262 칸이 2018년판 Safety validation(4-9) → v2.1(4-8), ASPICE 칸이 “No equivalent” → Validation(VAL.1). 시스템 오브 시스템·시스템 통합 테스팅의 ISO 26262 칸이 “Item integration and test(4-8)” → “System and item integration and testing(4-7)”. ASPICE 이름도 qualification test → verification으로 바뀌었다."]}]},{"ch":3,"title":"가상 환경 테스팅","titleEn":"Testing in a Virtual Environment","minutes":160,"examCount":13,"keywords":[{"ko":"환경 모델","en":"environment model","def":"실시간 시뮬레이션 안에서, 컴포넌트나 시스템의 실제 환경(다른 컴포넌트, 프로세스, 환경 조건 포함)을 추상화한 것(ISTQB 용어집). KSTQB 용어집 한국어판 표기도 '환경 모델'이다."},{"ko":"HiL","en":"hardware-in-the-loop","def":"소프트웨어가 통합된 실제 하드웨어를 테스트하는 가상 테스트 환경(ISTQB 용어집). (v2.1 기준. 2018년판 키워드에 연결된 이전 정의는 '시뮬레이션 환경에서 소프트웨어가 통합된 실제 하드웨어로 수행하는 동적 테스팅'이었다.)"},{"ko":"MiL","en":"model-in-the-loop","def":"시스템의 시뮬레이션 모델을 테스트하는 가상 테스트 환경(ISTQB 용어집). (v2.1 기준. 2018년판 키워드에 연결된 이전 정의는 '시뮬레이션 환경에서 시스템의 시뮬레이션 모델로 수행하는 동적 테스팅'이었다.)"},{"ko":"SiL","en":"software-in-the-loop","def":"실제 소프트웨어를 테스트하는 가상 테스트 환경(ISTQB 용어집). (v2.1 기준. 2018년판 키워드에 연결된 이전 정의는 '시뮬레이션 환경이나 실험용 하드웨어에서 실제 소프트웨어로 수행하는 동적 테스팅'이었다.)"},{"ko":"closed-loop 시스템","en":"closed-loop system","def":"제어 동작(controlling action)이나 입력이 출력 또는 출력의 변화에 의존하는 시스템(실라버스 6장). KSTQB 용어집 한국어판 표기는 '폐쇄 루프 시스템'."},{"ko":"open-loop 시스템","en":"open-loop system","def":"제어 동작(controlling action)이나 입력이 출력 또는 출력의 변화와 무관한(독립적인) 시스템(실라버스 6장). KSTQB 용어집 한국어판 표기는 '오픈-루프 시스템'."}],"sections":[{"id":"3.1","title":"테스트 환경 일반","points":["3장 시험은 13문제다. K1 5문제, K2 6문제, K3 2문제. K3 2문제는 모두 3.2.4.2(주어진 테스트 범위를 테스트 환경에 배정)에서 나온다.","K1 학습목표: 3.1.1, 3.1.2, 3.1.4, 3.2.1.1, 3.2.2.1, 3.2.2.2, 3.2.3.1, 3.2.4.3과 키워드. K2 학습목표: 3.1.3, 3.2.1.2, 3.2.3.2, 3.2.4.1.","3.1은 테스트 환경 전반을 다룬다. 왜 필요한지(3.1.1), 무엇으로 이뤄지는지(3.1.2), closed-loop와 open-loop가 어떻게 다른지(3.1.3), ECU의 기능·데이터베이스·통신 프로토콜(3.1.4)."],"traps":[]},{"id":"3.1.1","title":"자동차 개발에서 테스트 환경이 필요한 이유","points":["테스터는 두 요구 사이에서 충돌을 겪는다.\n① 개발 프로세스 초기에 결함을 찾도록 가능한 한 일찍 테스트를 시작해야 한다.\n② 완성된 제품에서 나타날 결함을 찾으려면 현실적인 환경이 필요하다.","해결책은 개발 단계마다 그 단계에 맞는 테스트 환경을 쓰는 것이다. 그러면 ECU가 완전히 생산·개발되기 전에도 개별 테스트 작업을 구현하고 실행할 수 있다.","여러 테스트 환경을 쓰면 실제 차량에서 재현하기 어려운 상황을 시뮬레이션할 수 있다. 실라버스 예: 단락(short circuit)과 네트워크 통신 과부하, 와이어링 하네스(wiring harness)의 단락과 단선(open circuit)."],"traps":[]},{"id":"3.1.2","title":"테스트 환경의 일반 구성 요소","points":["테스트하려면 빠진 부분을 시뮬레이션해 주는 테스트 환경이 필요하다. 테스트 환경은 테스트 대상의 입력을 제어하고 테스트 결과를 관찰하게 해 준다. 이 지점을 PoC(point of control)와 PoO(point of observation)라고 한다.","ISO/IEC/IEEE 29119-1에 따른 테스트 환경 구성 5가지:\n① 테스트 환경의 하드웨어: 제어 컴퓨터, 필요하면 real-time capable computer, 테스트 벤치, development kit\n② 테스트 환경의 소프트웨어: 운영체제, 시뮬레이션 소프트웨어, 환경 모델\n③ 통신 수단(facilities of communication): 네트워크 접속, 데이터 로거\n④ 도구(tools): 오실로스코프, 측정 도구\n⑤ 실험실(laboratory): 전자파 방사·노이즈 차단","환경 모델(environment model)은 테스트 환경의 중요한 부분이다. 모델은 가상 테스트 환경의 핵심 요소이고 현실 세계의 측면을 표현한다. 예: 내연기관, 변속기, 차량 센서와 ECU, 운전자와 도로 조건까지.","테스트 환경은 여러 access point도 제공한다. access point로 테스트 대상을 관찰·측정하고, 필요하면 영향을 주거나 제어한다."],"traps":["환경 모델은 5가지 구성 요소 중 별도 항목이 아니다. '테스트 환경의 소프트웨어' 예시(운영체제, 시뮬레이션 소프트웨어, 환경 모델)에 들어 있다.","예시 분류를 섞지 않는다. 데이터 로거 = 통신 수단, 오실로스코프 = 도구, real-time capable computer·테스트 벤치·development kit = 하드웨어, 전자파·노이즈 차단 = 실험실."]},{"id":"3.1.3","title":"closed-loop 시스템과 open-loop 시스템의 차이","points":["테스트 환경은 DUT(device under test)의 입력 인터페이스를 제어하고 출력 인터페이스로 출력을 모니터링한다. 그 뒤 출력 인터페이스의 동작을 분석한다. 실제 결과가 기대 결과와 같으면 성공이다.","제어 시스템은 일반적으로 closed-loop와 open-loop 두 종류다. 차이는 ECU가 환경에 반응하는 방식에 있다. 그래서 가상 테스트 환경에 요구되는 시뮬레이션 조건도 달라진다.","closed-loop 시스템(in-the-loop라고도 함): 자극(stimulation)이 테스트 대상의 출력을 고려한다. 환경 모델이 출력을 모아 테스트 대상의 입력으로 직접 또는 간접적으로 보낸다. 그래서 테스트 환경 안에 제어 루프가 생긴다.","closed-loop 시스템은 제어기(controller) 테스트에 더 자주 쓴다. 복잡한 기능을 테스트할 수 있다. 예: 모터·기어 제어, ABS(anti-lock braking system)·VDC(vehicle dynamics control) 같은 운전자 보조 시스템.","open-loop 시스템: 시스템의 출력이 입력과 관계가 없다. 피드백 루프가 없다. 테스트 대상의 입력은 테스터가 테스트 절차에서 직접 정한다.","어느 쪽을 쓸지는 테스트 대상의 동작에 크게 좌우된다. closed-loop는 출력이 입력에 영향을 줘 피드백이 생기고, open-loop에는 그런 피드백 장치가 없다.","테스트 대상이 reactive behavior를 갖거나 상태 머신처럼 동작하면 open-loop 시스템이 낫다. 실내(interior)·섀시 전장에 open-loop 예가 많다(예: 조명, 스위치).","6장 정의: closed-loop 시스템 = 제어 동작이나 입력이 출력 또는 출력의 변화에 의존하는 시스템. open-loop 시스템 = 제어 동작이나 입력이 출력 또는 출력의 변화와 무관한 시스템.","비유: closed-loop는 에어컨 자동 모드다. 실내 온도(출력)를 보고 바람 세기(입력)를 계속 바꾼다. open-loop는 벽 스위치로 켜는 방 조명이다. 누른 대로 켜지고 꺼질 뿐 결과를 보고 입력을 바꾸지 않는다. 여기까지만 맞는 비유다."],"traps":["상태 머신처럼 동작하거나 reactive behavior가 있으면 open-loop가 낫다. '상태가 있으니 피드백이 필요하다'고 생각해 closed-loop를 고르면 틀린다.","예시 짝: 모터·기어 제어, ABS, VDC → closed-loop / 조명, 스위치(실내·섀시 전장) → open-loop."]},{"id":"3.1.4","title":"ECU의 데이터베이스와 통신 프로토콜","points":["자동차 ECU는 하드웨어와 소프트웨어로 이뤄진 임베디드 시스템으로 동작한다. 6장 정의: ECU(electronic control unit) = 자동차에서 차량의 전기 (하위)시스템을 제어하는 임베디드 시스템.","입력: ECU는 여러 아날로그·디지털 입력을 받아 전압, 전류, 온도 형태의 환경 데이터를 계속 수집한다. 통신 bus system은 센서나 다른 ECU에서 오는 추가 데이터를 준다. 그 센서·ECU는 정보를 스스로 수집·처리하거나 생성한다.","처리: 테스트 대상은 출력 동작, 정보, 데이터를 처리하려고 메모리 안의 데이터를 관리한다.","출력: 생성된 출력은 아날로그·디지털 출력 핀, bus system, 진단 인터페이스로 나간다.","6장 정의: bus system = 같은 연결로 정보를 주고받는 ECU들의 네트워크.","데이터베이스(database)는 데이터 저장소(data warehouse)이고 ECU의 입력·출력 신호를 정의한다. 이 데이터에는 신호의 설명, 제어 장치(control units), 변환 공식도 들어 있다.","통신 프로토콜은 해당 물리 인터페이스를 통한 데이터 교환을 기술한다. 어떤 전압이나 비트열이 신호의 어떤 값을 뜻하는지 정한다.","데이터베이스와 통신 프로토콜은 ECU의 기능에 따라 고른다. 예: ECU의 진단 기능에 접근하려면 다음 정보가 필요하다.\n데이터베이스: ASAM MCD-3 D(application programming interface specification), ASAM SOVD(service-oriented vehicle diagnostics)\n통신 프로토콜: UDS(unified diagnostic services, ISO 14229), SOME/IP(AUTOSAR specification)","그 밖의 자동차 전용 데이터베이스는 ASAM과 AUTOSAR 표준에 정의돼 있다. ASAM = Association for Standardization of Automation and Measuring Systems.","참고(부록 D, 시험 범위 밖): 부록 표는 인터페이스별로 데이터베이스와 프로토콜을 정리한다.\n메모리: ASAM MCD-2 MC(ASAP2, A2L) / ASAM MCD-1 XCP, ASAM MCD-1 CCP\n버스: ASAM MCD-2 NET(FIBEX), DBC / FlexRay(ISO 17458), CAN(ISO 11898-2)\n진단: ASAM MCD-3 D, ASAM SOVD, CDD / KWP2000(ISO 14230), ISO-OBD(ISO 15031), UDS(ISO 14229), SOME/IP\nAUTOSAR는 차량 전체 데이터베이스를 통합하는 ARXML 형식을 둔다."],"traps":["데이터베이스는 신호를 정의하고(설명, 변환 공식 포함), 통신 프로토콜은 어떤 전압·비트열이 어떤 값인지 정한다. 진단 예에서 ASAM MCD-3 D·ASAM SOVD는 데이터베이스, UDS·SOME/IP는 통신 프로토콜이다.","인터넷의 2018년판 자료는 진단 데이터베이스 예로 'ASAM MCD2 D(Open Diagnostic Data Exchange)'만 들고 SOVD·SOME/IP가 없다. v2.1 본문 예는 ASAM MCD-3 D, ASAM SOVD, UDS, SOME/IP다. (v2.1 기준)"]},{"id":"3.2","title":"XiL 테스트 환경에서 테스팅","points":["자동차 산업에서 쓰는 XiL 테스트 환경: MiL(model-in-the-loop), SiL(software-in-the-loop), PiL(processor-in-the-loop), HiL(hardware-in-the-loop), ViL(vehicle-in-the-loop). XiL의 X는 이 목록의 각 환경을 대신하는 자리 표시다.","PiL과 ViL은 이 실라버스에서 다루지 않고 순수 참고용(informative)이다. 테스터가 익히고 이해해야 할 환경은 MiL, SiL, HiL이다.","XiL은 여러 테스트 환경을 묶어 부르는 일반 용어다. 5장 약어표: 'MiL, SiL, HiL 같은 모든 in-the-loop 테스트 환경을 가리키는 일반 용어'.","세 환경 한눈에 보기(3.2.1~3.2.3 요약):\nMiL: 테스트 대상이 모델이다. 실행은 되지만 특정 하드웨어용으로 컴파일하지 않았다. 시뮬레이션 시간으로 돌고 언제든 일시정지할 수 있다.\nSiL: 테스트 대상이 특정 SiL 환경용으로 컴파일된 코드다. 래퍼(wrapper)로 신호에 접근하고, 특수 하드웨어 없는 컴퓨터에서 실행한다. 시뮬레이션 시간으로 돌고 언제든 일시정지할 수 있다.\nHiL: 테스트 대상이 프로토타입이거나 완전히 개발된 것이다. 소프트웨어가 실제 하드웨어에서 돌아 항상 실시간이다. 일시정지·정지가 안 된다.","어느 XiL 환경이든 개발이 일정 단계를 넘어서면 그 환경을 구현하는 노력이 더는 값어치가 없어진다(3.2.1.2 각주: MiL에 대한 이 설명은 다른 모든 XiL 환경에도 해당).","비유: 새 자동차 기능을 세 단계로 시험해 보는 것. MiL은 설계 모델을 컴퓨터 화면 속에서 움직여 보는 것, SiL은 컴파일한 실제 소프트웨어를 특수 하드웨어 없는 PC에서 돌려 보는 것, HiL은 실제 ECU를 꽂고 그 주변은 실시간 시뮬레이터와 일부 실제 부품으로 채우는 것이다. 여기까지만 맞는 비유다."],"traps":["PiL·ViL은 목록에는 있지만 각주로 '이 실라버스에서 다루지 않으며 순수 참고용'이라고 적혀 있다. 구조·적용 영역을 배우는 대상은 MiL, SiL, HiL 세 가지다."]},{"id":"3.2.1.1","title":"MiL 테스트 환경의 구조","points":["MiL 테스트 환경에서 테스트 대상은 모델로 존재한다. 이 모델은 실행 가능하지만 특정 하드웨어용으로 컴파일되지 않았다.","개발자는 전용 모델링 도구로 모델을 만든다. 테스터는 그 모델을 실행하고 테스트할 테스트 환경이 필요하다. 이 테스트 환경은 보통 테스트 대상과 같은 개발 환경 안에 구현한다.","이 테스트 환경은 환경 모델을 추가로 포함할 수 있다.","테스터는 access point로 테스트 대상을 제어하고 관찰한다. access point는 테스트 대상 모델과 환경 모델 안 어디에나 임의로 둘 수 있다.","테스트 대상 모델은 환경 모델과 연결되고, closed-loop 시스템으로 쉽게 구현해 쓸 수 있다."],"traps":["MiL 테스트 대상은 '실행 가능하지만 특정 하드웨어용으로 컴파일되지 않은' 모델이다. 특정 환경용으로 컴파일된 코드를 래퍼로 연결하면 SiL이다(3.2.2.1).","access point를 임의 위치에 둘 수 있는 것은 MiL이다. SiL은 래퍼가 정한 access point의 신호만, HiL은 하드웨어나 통신 프로토콜에서 쓸 수 있는 신호만 관찰·제어한다(표 3)."]},{"id":"3.2.1.2","title":"MiL의 적용 영역과 경계 조건","points":["MiL 테스트 환경으로 functional system design을 테스트할 수 있다. 개발 중(예: 일반적인 V-모델) 단일 컴포넌트부터 전체 시스템까지 테스트할 수도 있다.","테스트를 실행하려면 컴퓨터와, 환경 모델을 포함한 시뮬레이션 소프트웨어가 필요하다.","테스트 대상의 기능 범위가 커질수록 환경 모델이 복잡해진다. 현실의 측면과 환경 요인은 매우 복잡하다. 모델의 실행 시간도 불균형하게(disproportionately) 늘어난다. 그래서 개발이 어느 단계를 넘어서면 MiL 테스트 환경을 구현하는 노력은 더는 값어치가 없다. 이 점은 다른 모든 XiL 환경에도 해당한다(각주).","MiL로 개발 초기 단계(V-모델 왼쪽)에 모든 개발 레벨에 걸쳐 모델의 기능 적합성(functional suitability)을 테스트할 수 있다.","하지만 환경 모델이 버스·진단 기능이나 단선·단락 같은 물리적 동작을 시뮬레이션하게 하는 것은 흔하지 않다. 이런 작업은 다른 테스트 환경에서 더 쉽고 적은 비용으로 할 수 있다.","MiL에서 테스트 실행은 실시간이 아니다. 모든 컴포넌트가 모델이므로 시뮬레이션 시간(simulation time)으로 돈다. 6장 정의: 시뮬레이션 시간 = 컴퓨터 시뮬레이션의 시간 틀(time frame).","시스템이 복잡할수록 필요한 정보를 다 내려면 컴퓨터에 더 많은 실행 시간이나 연산 능력이 필요하다. 작은 시스템은 시뮬레이션이 실시간 실행보다 짧게 끝난다.","큰 장점: 테스터가 언제든 시뮬레이션을 멈추고 자세히 분석·평가할 수 있다."],"traps":["MiL로 테스트하는 설계를 3.2.1.2는 'functional system design', 3.2.4.3은 'technical system design'이라고 쓴다. 둘 다 실라버스 문장이다. 문제에 나온 절의 표현을 따른다.","언제든 일시정지해 자세히 분석할 수 있는 것은 MiL과 SiL의 장점이다(시뮬레이션 시간). HiL은 소프트웨어가 실제 하드웨어에서 돌아 항상 실시간이고, 일시정지·정지가 안 된다(3.2.3.2)."]},{"id":"3.2.2.1","title":"SiL 테스트 환경의 구조","points":["테스트 대상은 특정 SiL 테스트 환경용으로 컴파일된다. 소스 코드를 특정 컴퓨터 아키텍처용으로 컴파일했다는 뜻이다. 이 기계어 코드는 바이너리 데이터 세트라서 테스트 환경이 읽을 수 있다.","테스트 환경이 신호에 접근하려면 래퍼(wrapper)가 필요하다. 래퍼는 추가 소프트웨어다. 테스트 대상이 래퍼를 거치지 않고 환경과 직접 통신하면 접근할 수 없었을 입력에 접근하게 해 준다. 그래서 테스터가 소프트웨어 신호를 제어하고 관찰할 수 있다.","래퍼는 테스트 대상의 access point를 정의하지만 테스트 대상의 기능 작업은 수행하지 않는다.","시뮬레이션에는 환경 모델이 필요하다. 테스트 대상은 래퍼를 통해 테스트 환경에 연결된다.","테스트는 특수 하드웨어 없는 컴퓨터에서 실행한다. 테스터는 테스트 대상에 테스트 환경용 access point를 갖춘 래퍼를 만들어 주는 소프트웨어 도구가 필요하다."],"traps":["래퍼는 access point를 정의할 뿐 테스트 대상의 기능을 대신 수행하지 않는다.","현업에서는 호스트 PC에서 도는 테스트를 넓게 SiL이라 부르기도 하지만, 실라버스의 SiL 구조는 '특정 SiL 환경용으로 컴파일한 테스트 대상 + 래퍼 + 환경 모델'이다."]},{"id":"3.2.2.2","title":"SiL의 적용 영역과 경계 조건","points":["개발자가 모델에서 소스 코드를 생성하면, 소프트웨어의 실제 동작이 기대 동작과 다를 수 있다. 원인은 데이터 타입 차이(모델은 주로 부동소수점, 컴파일된 코드는 주로 고정소수점)와 메모리 공간 차이다.","이런 기대 동작의 이상 사항은 SiL 테스트 환경에서 처음으로 테스트할 수 있다. 동작 비교에는 back-to-back 테스팅 같은 테스트 접근법을 쓸 수 있다(4.2.2).","SiL도 MiL처럼 시뮬레이션 시간으로 테스트한다. 계산 방식과 환경 모델의 복잡도에 따라 시뮬레이션 시간은 실시간보다 짧을 수도 길 수도 있다.","테스터는 언제든 테스트 실행을 멈추고 자세히 분석·평가할 수 있다.","SiL에서 흔히 평가하는 테스트 유형: 기능 적합성 테스트, 인터페이스 테스트, 리그레션 테스트(regression test).","SiL에서 드문 테스트 유형: 수행 효율성(performance efficiency) 테스트, 신뢰도(reliability) 테스트. 이 품질 특성은 주로 타깃 하드웨어의 영향을 받기 때문이다."],"traps":["모델(부동소수점)과 생성 코드(고정소수점)의 데이터 타입 차이, 메모리 공간 차이로 생기는 이상 사항을 '처음' 테스트할 수 있는 곳은 SiL이다.","SiL의 시뮬레이션 시간은 실시간보다 짧을 수도 길 수도 있다. '항상 실시간보다 빠르다'도, '항상 실시간'도 틀린다.","SiL에서 드문 것은 수행 효율성·신뢰도 테스트이고, 이유는 타깃 하드웨어 영향이다. (v2.1 표현. 2018년판은 functional, performance 같은 이전 용어를 썼다.)"]},{"id":"3.2.3.1","title":"HiL 테스트 환경의 구조","points":["테스트 대상이 프로토타입으로 있거나 이미 완전히 개발됐으면 HiL 테스트 환경으로 테스트를 실행할 수 있다.","HiL 테스트 환경의 전형적인 구성 7가지:\n① 전원 공급 장치(power supply): 여러 공급 전압 설정\n② real-time capable computer: 환경 모델을 실행\n③ 환경 모델에 구현되지 않은 여러 실제 부품\n④ signal processing unit: 신호 유형과 신호 진폭 처리\n⑤ FIU(fault insertion unit): 단선과 단락 시뮬레이션(4.2.3 참조)\n⑥ breakout box: 케이블 하네스의 추가 접근 인터페이스\n⑦ remaining bus: 존재하지 않는 버스 참여자를 시뮬레이션","6장 정의: breakout box = 전선의 물리 신호를 분석, 차단, 조작하는 측정 장치."],"traps":["구성 요소와 역할 짝: FIU = 단선·단락 시뮬레이션, breakout box = 케이블 하네스의 추가 접근 인터페이스, remaining bus = 없는 버스 참여자 시뮬레이션, real-time capable computer = 환경 모델 실행, 전원 공급 장치 = 공급 전압 설정.","HiL에서도 환경 모델을 쓴다. 환경 모델은 real-time capable computer에서 돌고, 환경 모델에 구현되지 않은 부분은 실제 부품으로 붙인다."]},{"id":"3.2.3.2","title":"HiL의 적용 영역과 경계 조건","points":["HiL 테스트 환경의 access point는 다양하다. 테스트 대상에 잘못된 access point를 쓰면 테스트 결과가 쓸모없어질 수 있다. access point와 그 연결을 알아야 효과적인 테스트를 구현·실행·평가할 수 있다.","HiL은 구성 요소가 여럿이라 MiL·SiL보다 복잡하다. 테스터는 이 복잡성을 다룰 수 있어야 테스트 작업을 해낼 수 있다.","HiL은 컴포넌트 테스팅, 통합 테스팅, 시스템 테스팅에 쓸 수 있다. 목적 중 하나는 소프트웨어와 하드웨어의 기능·비기능 결함을 찾는 것이다.","HiL로 여러 테스트 레벨을 분석할 수 있다. 테스트 대상이 ECU 하나면 component HiL, 여러 ECU의 조합이면 system HiL이다. 여기서 component는 E/E 시스템 맥락의 ECU를 뜻한다(각주).","component HiL로는 ECU의 기능을 테스트한다. system HiL은 ECU 간 데이터 교환과 시스템 테스트에 초점을 둔다.","MiL·SiL과 달리 HiL의 시뮬레이션 시간은 항상 실시간이다. 소프트웨어가 실제 하드웨어에서 돌기 때문이다. 일시정지나 정지는 더는 할 수 없다.","그래서 HiL 테스트 환경에는 관련 신호를 모두 미리 정한 시간 안에 수집·제공하는 real-time capable computer가 들어 있다.","6장 정의: real time = 결과가 미리 정한 시간 안에 나오도록 데이터를 처리하는 것. real time capable computer = 신호를 실시간으로 처리할 수 있는 컴퓨터."],"traps":["component HiL의 component는 E/E 시스템 안의 ECU다(각주 28). 소프트웨어 컴포넌트가 아니다. ECU 1개 = component HiL, 여러 ECU 조합 = system HiL.","HiL은 컴포넌트·통합·시스템 테스팅 모두에 쓸 수 있다. 시스템 테스팅 전용이 아니다. 찾는 결함도 기능·비기능, 소프트웨어·하드웨어 모두다."]},{"id":"3.2.4.1","title":"XiL 테스트 환경별 테스팅의 장단점","points":["테스터는 각 테스트 환경의 속성을 이해해 환경별 테스팅의 장단점을 이해·평가한다. 기준은 표 3에 있다.","표 3 읽는 법: 표 3에는 +/o 기호 범례가 따로 없다. 각 행은 MiL·SiL·HiL 중 한 칸에만 +가 있고, 그 행의 설명과 Impact(Low/Medium/High)는 + 환경에 해당한다.","현실 근접성(closeness to reality)\nMiL Low: 현실을 시뮬레이션하고 많은 특성을 추상화한다. 구조와 로직에 초점.\nSiL Low to medium: 컴파일된 실제 소프트웨어를 하드웨어 없이 실행할 수 있다.\nHiL High: 통합된 시스템이고 실행할 수 있다.","디버깅 시간·노력(time and effort in debugging)\nMiL Low: 테스트 대상 모델에서 결함을 찾는다(모델 수정).\nSiL Medium: 프로그래밍된 소프트웨어에서 결함을 찾는다(소프트웨어 수정).\nHiL High: 시스템 레벨에서 결함을 찾는다(시스템 수정).","구현·유지보수 노력(effort for implementation and maintenance)\nMiL Low: 환경 모델 작성.\nSiL Medium: 환경 모델과 래퍼 작성.\nHiL High: 환경 모델 작성과 하드웨어 부품 배선.","테스트 준비 노력(effort for test preparation)\nMiL Low: 환경을 빨리 구성할 수 있다.\nSiL Medium: 환경을 빨리 구성할 수 있다.\nHiL High: 테스트 설계·구현·평가에 큰 노력이 든다.","테스트 대상에 필요한 성숙도(necessary level of maturity of the test object)\nMiL Low: 시스템 모델을 시뮬레이션한다.\nSiL Medium: 타깃 소프트웨어로 초기 기능을 테스트한다.\nHiL High: 실행 가능한 ECU 하나 이상 또는 부분 시스템을 가능한 한 통째로 테스트한다.","테스트 베이시스(명세)에 필요한 상세 수준(necessary level of detail of the test basis)\nMiL Medium: 불완전한 명세를 부분적으로 커버하는 모델을 테스트한다.\nSiL Medium to high: 소프트웨어 레벨의 관련 정보가 있어야 한다(예: 상세 컴포넌트 명세).\nHiL High: 완전한 시스템 명세로 시스템 레벨 요구사항을 테스트할 수 있다.","테스트 대상 접근성(access to the test object)\nMiL High: 모델의 모든 신호를 관찰·제어할 수 있다.\nSiL Medium: 래퍼에 있는 신호만 관찰·제어할 수 있다.\nHiL Low: 하드웨어나 통신 프로토콜에 있는 신호만 관찰·제어할 수 있다.","정리: MiL → SiL → HiL로 갈수록 현실 근접성, 필요한 성숙도, 명세 상세 수준, 디버깅·구현·준비 노력이 커진다. 테스트 대상 접근성만 반대로 작아진다."],"traps":["MiL 값이 Low가 아닌 기준은 두 개다. 명세 상세 수준은 Medium(불완전한 명세를 부분적으로 커버), 테스트 대상 접근성은 High다.","테스트 준비 노력에서 MiL과 SiL의 설명 문장은 똑같다('환경을 빨리 구성할 수 있다'). Impact만 Low와 Medium으로 다르다."]},{"id":"3.2.4.2","title":"주어진 테스트 범위를 테스트 환경에 배정하는 기준 적용","points":["표 4는 테스트 목적별로 알맞은 테스트 환경을 배정한 것이다. 기호: + recommended(권장), o possible(가능), - not sensible(의미 없음).","고객 요구사항 테스트(test customer requirements): MiL o, SiL o, HiL +\n요구된 기능을 올바르게 제공하는지 본다. 입력의 올바른 처리, 입력에 대한 올바른 반응, 출구 지점(exit point)의 올바른 데이터 출력을 포함한다.","결함 탐지·처리 메커니즘 테스트(test mechanisms for defect detection and handling): MiL +, SiL +, HiL +\n무작위 하드웨어 결함의 탐지·처리, 소프트웨어 결함의 탐지·처리, 결함 탐지 후 안전 상태로 전환(예: 시스템 비활성화).","구성 데이터에 대한 반응 테스트(test reaction to configuration data): MiL o, SiL +, HiL +\n구성 데이터가 테스트 대상의 동작에 주는 영향을 확인한다.","진단 기능 테스트(test diagnostic functions): MiL -, SiL +, HiL +\n요구된 진단 기능을 올바르게 제공하는지 본다. 예: 결함 탐지, 결함 활성화와 리셋 요구, defect memory 안의 결함 활성화(예: OBD(on-board diagnostics)나 정비소에서).","인터페이스 상호작용 테스트(test interaction at interfaces): MiL o, SiL +, HiL +\n테스트 대상의 내부·외부 인터페이스를 확인한다.","유용성 증명(prove usability): MiL -, SiL o, HiL +\n테스트 대상이 사용자의 유용성(usability) 요구사항을 충족해야 한다.","표 4가 보여 주는 점: 테스트 환경마다 알맞은 테스트 목적이 있다. 이 분산 접근은 결함 탐지·처리 메커니즘 테스트에서 특히 잘 드러난다.","시프트 레프트(shift left)에 따른 일반적 결론: 기본적인 요구사항·설계 결함은 테스팅으로 일찍 찾는다. 그래서 MiL은 일반적인 설계 결함, SiL은 주로 기술적 소프트웨어 결함, HiL은 기술적 하드웨어/소프트웨어 결함을 찾는 데 쓴다.","신뢰도, 수행 효율성, 유용성의 증거를 빼면 모든 테스트 유형은 테스트 대상의 기능 적합성에 초점을 둔다.","테스트 관리자는 테스트 전략에서 테스트 범위를 여러 테스트 환경에 배정한다. 표 3과 표 4의 기준을 조합하면 테스트 관리자가 최적의 테스트 환경을 고를 수 있다.","테스터들은 여러 XiL 환경에 걸쳐 효율적이고 정확하게 테스트하도록 정기적으로 맞춰야(synchronize) 한다. 해당되면 테스트 목적을 맞추고, 중복을 피하고, 각 테스트가 그 개발 단계에 가장 알맞은 환경에서 실행되는지 확인하라고 권고한다.","이 협업은 자원 충돌을 막고, 커버리지 일관성을 보장하고, 부적절한 테스트 레벨에서 테스트할 리스크를 줄인다. 소통하고 도구·프레임워크를 공유하면 테스트 전략을 최적화하고 테스트 수명주기를 매끄럽게 이어 갈 수 있다.","K3 풀이 순서(배정 문제):\n① 문제의 테스트 목적이 표 4의 어느 행인지 찾는다.\n② 그 행에서 +(권장) 환경을 먼저 고르고, o(가능)는 차선, -(의미 없음)는 뺀다.\n③ 같은 기호끼리 가려야 하면 표 3 기준(필요 성숙도, 접근성, 현실 근접성, 노력)으로 비교한다.\n④ 테스트 대상이 지금 어떤 형태인지(모델, 컴파일된 코드, 프로토타입·완성 ECU)도 각 환경의 구조 조건과 맞춰 본다(3.2.1.1, 3.2.2.1, 3.2.3.1)."],"traps":["MiL이 '-'(의미 없음)인 행은 두 개뿐이다: 진단 기능 테스트, 유용성 증명. 유용성 증명은 SiL도 o(가능)이고 +는 HiL만이다.","+가 HiL에만 있는 행은 고객 요구사항 테스트와 유용성 증명이다. 세 환경 모두 +인 행은 결함 탐지·처리 메커니즘 테스트 하나다.","o는 '불가'가 아니라 'possible(가능)'이다. 고객 요구사항 테스트도 MiL·SiL에서 가능하다. 권장(+)이 HiL일 뿐이다.","환경과 결함 짝: 일반 설계 결함 = MiL, 기술적 소프트웨어 결함 = SiL, 기술적 하드웨어/소프트웨어 결함 = HiL. 근거 원칙 이름은 시프트 레프트다. (v2.1 기준. 2018년판은 Front-loading.)","테스트 범위를 환경에 배정하는 것은 테스트 관리자가 테스트 전략에서 한다. (v2.1 기준. 2018년판은 '테스트 관리자 역할의 테스터'로 썼고, XiL 환경 간 테스터 정기 조율 문단은 v2.1에 새로 들어왔다.)"]},{"id":"3.2.4.3","title":"V-모델 안에서 XiL 테스트 환경의 위치","points":["technical system design은 V-모델 왼쪽에 있다. 테스터는 이 설계를 MiL 테스트 환경으로 테스트할 수 있다. 모델과 테스트 환경이 더 발전하면 MiL로 컴포넌트 테스팅과 통합 테스팅도 할 수 있다.","테스트 대상의 단일 컴포넌트가 프로그래밍·컴파일됐으면 SiL 테스트 환경을 쓸 수 있다. SiL의 대표 테스트는 컴포넌트 테스팅과 통합 테스팅이고, V-모델 오른쪽에 있다.","시스템 테스팅 시점에는 테스트 대상의 일부 기능이 완전히 개발돼 있다. 테스터는 HiL 테스트 환경으로 시스템 테스팅을 할 수 있다.","테스트 환경을 테스트 레벨에 올바르게 배정하면 전체 테스트 프로세스를 세 측면에서 최적화할 수 있다.\n① 제품 리스크 최소화: 테스트 레벨 고유의 장애 유형을 찾는다(예: HiL 환경의 시스템 레벨에서 수행 효율성).\n② 테스트 비용 최소화: 테스트 레벨마다 알맞은 테스트 유형이 필요하다. 테스트를 더 이르고, 덜 비싼 가상 테스트 레벨로 옮긴다.\n③ 표준 준수: ISO 26262의 method table은 ASIL에 따라 테스트 환경을 권고한다."],"traps":["MiL도 모델과 테스트 환경이 발전하면 컴포넌트·통합 테스팅에 쓸 수 있다. 'MiL은 설계 테스트에만 쓴다'로 좁히지 않는다.","비용 최소화 항목은 '테스트 레벨마다 알맞은 테스트 유형'이다. (v2.1 기준. 2018년판은 '테스트 유형마다 알맞은 테스트 레벨'로 주어와 목적어가 반대였다.)"]}]},{"ch":4,"title":"정적·동적 테스팅","titleEn":"Static Testing and Dynamic Testing","minutes":230,"examCount":6,"keywords":[{"ko":"back-to-back 테스팅","en":"back-to-back testing","def":"pseudo-oracle(슈도 오라클)을 사용하는 테스트 접근법(ISTQB 용어집). 실라버스 4.2.2: 같은 테스트 케이스를 모든 variant에 실행하고 결과를 비교한다. (v2.1 기준. 2018년판 키워드에 연결된 이전 정의는 '테스트 항목의 variant 둘 이상이나 같은 테스트 항목의 시뮬레이션 모델에 같은 테스트 케이스를 실행해 결과를 비교하는 테스팅'이었다.)"},{"ko":"fault injection(결함 주입)","en":"fault injection","def":"실라버스 4.2.3: 컴포넌트나 시스템이 불리한 조건(adverse conditions. 예: 결함, 이 맥락에서는 fault라고도 부름)에 어떻게 반응하는지 평가하도록 설계한 테스트 접근법. 용어집 판에 따라 문장이 다름. 실라버스 4.2.3 본문 설명 기준으로 기억."},{"ko":"요구사항 기반 테스팅","en":"requirements-based testing","def":"실라버스 4.2.4: 텍스트 요구사항을 분석해 개별 atomic requirement에서 테스트 컨디션을 도출하고, 요구사항을 실행하는 테스트 케이스를 설계·실행하는 테스팅. 영문 용어집은 'atomic requirement에서 테스트 컨디션을 도출하는 블랙박스 테스트 기법', KSTQB 한국어판은 '요구사항을 기반으로 테스트 케이스를 설계하는 테스트 접근 방식'으로 적는다. 용어집 판에 따라 문장이 다름. 실라버스 4.2.4 본문 설명 기준으로 기억."}],"sections":[{"id":"4.1","title":"정적 테스팅","points":["4장 시험은 6문제다. K1 1문제(4.2.4와 키워드), K2 2문제(4.1.1에서 1문제, 4.2.2·4.2.3 묶음에서 1문제), K3 3문제(4.1.2, 4.2.1, 4.2.5에서 1문제씩).","정적 테스팅(static testing)은 소프트웨어 개발의 작업 산출물을 실행하지 않고 검토하는 것이다. 사람이 하는 리뷰와 도구 기반 정적 분석(static analysis)이 여기에 속한다."],"traps":[]},{"id":"4.1.1","title":"MISRA-C 가이드라인","points":["소스 코드가 코딩 가이드라인(coding guideline)을 지키는 것은 state of the art다. ISO 26262도 안전 관련 소프트웨어에 코딩 가이드라인 준수를 권고한다(각주: ISO 26262:2018 Part 6-5.4.3).","코딩 가이드라인은 결함으로 이어질 수 있는 코드의 이상 사항(anomaly)을 피하게 돕는다. 동시에 유지 가능성(maintainability)과 이동성(portability)을 돕는다.","MISRA-C는 C 언어용 코딩 가이드라인이고 자동차 소프트웨어 프로젝트에서 흔히 쓴다. 6장 정의: MISRA가 제공하는, 크리티컬 시스템에서 C 언어를 쓰기 위한 코딩 가이드라인. MISRA = Motor Industry Software Reliability Association.","가이드라인은 두 종류다.\nrule: 정적 분석 도구로 검증할 수 있다. 예: '소스 코드에 중첩 주석을 넣으면 안 된다.' 6장 정의: 정적 분석으로 완전히 검증할 수 있는 프로그래밍 가이드라인.\ndirective: 정적 분석 도구로 완전히 검증되지 않는다. 개발 프로세스의 세부 사항이나 소프트웨어 밖의 문서를 다룬다. 예: '개발자는 구현한 동작을 충분히 문서화해야 한다.' 6장 정의: 정적 분석으로 완전히 검증할 수 없는 프로그래밍 가이드라인.","가이드라인마다 세 의무 수준(level of obligation) 중 하나가 붙는다.\nadvisory: 노력이 합리적이면 개발자가 따라야 한다.\nrequired: 개발자가 따라야 한다. 예외는 가능하지만 공식 승인(예: 품질 관리)을 받아야 한다.\nmandatory: 개발자가 따라야 한다. 예외가 없다.","조직은 가이드라인의 의무 수준을 개별적으로 올릴 수는 있지만 절대 내릴 수는 없다."],"traps":["rule과 directive를 가르는 기준은 정적 분석 도구로 (완전히) 검증할 수 있느냐다. 문서화나 개발 프로세스에 관한 지침은 directive다.","required의 예외 조건은 '공식 승인(예: 품질 관리)'이다. (v2.1 기준. 2018년판은 개발자가 납득할 만하게 설명하면 무시할 수 있다고 썼다.)","advisory도 v2.1 문장은 '노력이 합리적이면 따라야 한다(must)'이다. (v2.1 기준. 2018년판은 should.)","의무 수준은 조직이 올리기만 할 수 있다. 프로젝트 사정으로 required를 advisory로 낮추는 것은 실라버스상 허용되지 않는다."]},{"id":"4.1.2","title":"요구사항 리뷰를 위한 품질 특성","points":["명세는 개발과 테스팅의 기반이다. 그래서 명세의 결함은 비용과 시간이 많이 드는 후속 작업을 부른다. 인수 테스팅이나 운영처럼 늦은 단계에서야 발견되면 특히 그렇다.","리뷰는 명세의 결함을 일찍 찾아 일찍, 적은 비용으로 고치는 효과적인 수단이다.","테스트 분석 중에 테스터는 테스트 대상의 명세를 확인해야 한다. 특히 테스트 베이시스로 적합한지를 본다. 품질 특성은 명세를 리뷰할 때 초점을 잡고 결함을 최대한 많이 찾게 돕는다.","ISO 29148:2018에는 단일 요구사항용 품질 특성과 요구사항 집합용 품질 특성이 있다.","테스터와 관련된 ISO 29148:2018 품질 특성 5가지:\nVerifiable: 각 요구사항이 올바르게 실현됐음을 증명할 수 있다.\nUnambiguous: 각 요구사항에 명확한 테스트 컨디션이 들어 있다.\nConsistent: 각 요구사항이 그 자체로, 그리고 다른 모든 요구사항과 일관된다.\nComplete: 각 요구사항이 해석의 여지를 남기지 않고, 암묵적 지식이나 경험에서 온 지식에 기대지 않는다.\nSingular: 어떤 요구사항도 의미 있는 부분 요구사항으로 나눌 수 없다. singular는 atomic이라고도 한다(각주).","요구사항 리뷰를 준비할 때 테스터는 이 품질 특성에서 체크리스트 항목을 뽑아 리뷰 체크리스트를 만들 수 있다. 체크리스트 항목은 품질 기준 이름을 그냥 적는 것보다 구체적이어야 한다. 품질 기준 이름은 너무 추상적이기 때문이다.","예: consistency에 대한 체크리스트 항목 '모든 요구사항에서 용어를 일관되게 쓰는가?'. 명세를 리뷰할 때 테스터는 아는 범위에서 최선을 다해 체크리스트 항목에 답해야 한다.","ISO 29148:2018에 따르면 요구사항은 feasible, appropriate, correct, conforming, comprehensible, necessary 해야 한다(should). 다만 테스터가 이 특성들을 평가하기는 보통 어렵다.","K3 적용 요령: 요구사항 문장을 다섯 정의와 하나씩 대조한다.\n의미 있게 나눌 수 있는 동작이 한 요구사항에 둘 이상 → Singular 위반\n다른 요구사항과 모순되거나 한 요구사항 안에서 앞뒤가 안 맞음 → Consistent 위반\n해석의 여지가 있거나 암묵적 지식·경험에 기댐 → Complete 위반\n명확한 테스트 컨디션이 없음 → Unambiguous 위반\n올바르게 실현됐는지 증명할 수 없음 → Verifiable 위반"],"traps":["'해석의 여지를 남기지 않는다'는 Unambiguous가 아니라 Complete의 정의 문장이다(4.1.2). Unambiguous의 정의는 '명확한 테스트 컨디션을 담고 있다'이다. 단어 뜻만 보고 고르면 틀리기 쉽다.","테스터 관련 품질 특성은 v2.1에서 5개(Verifiable, Unambiguous, Consistent, Complete, Singular)다. (v2.1 기준. 2018년판은 Traceable(ID로 표시)과 Bounded(개발 범위 정의)를 더한 7개였고, Complete는 '오류·중단·예외를 포함한 모든 경우를 고려', Verifiable은 '정적·동적 테스트로 검증할 수 있다'였다.)","feasible, appropriate, correct, conforming, comprehensible, necessary는 '테스터가 평가하기 어려운' 특성이다. 테스터 관련 5개 목록과 섞지 않는다. (v2.1 기준. 2018년판은 Hobbs를 출처로 feasible, implementation-free, necessary 3개를 들었다.)","Consistent는 다른 요구사항과의 일관성뿐 아니라 요구사항 자체의 일관성도 포함한다(v2.1.1 Errata에서 보강)."]},{"id":"4.2","title":"동적 테스팅","points":["4.2는 자동차 맥락의 동적 테스팅을 다룬다: MC/DC(4.2.1), back-to-back 테스팅(4.2.2), fault injection 테스팅(4.2.3), 요구사항 기반 테스팅(4.2.4), 상황에 따른 기법·접근법 선택(4.2.5).","실라버스는 MC/DC를 화이트박스 테스트 기법으로, back-to-back 테스팅과 fault injection 테스팅을 테스트 접근법(test approach)으로 소개한다(4.2.1, 4.2.2, 4.2.3)."],"traps":[]},{"id":"4.2.1","title":"MC/DC(modified condition/decision testing)","points":["여기서 다루는 기법은 화이트박스 테스트 기법이다(자세한 내용은 Technical Test Analyst 실라버스). 테스터는 테스트 대상의 구조(예: 소스 코드)에서 테스트 케이스를 바로 도출한다.","결정 테스팅(decision testing): 모든 결정 결과, 즉 각 결정의 true와 false를 실행하도록 테스트 케이스를 설계한다. 결정은 조건 하나 이상으로 이뤄지고 각 조건은 true나 false가 된다. 결정 결과는 조건 값들의 논리 조합으로 정해진다.","결정이 조건 하나로만 이뤄지면 결정 테스팅과 조건 테스팅은 같은 커버리지를 달성한다. 조건이 여러 개인 결정에는 더 상세한 기법이 있다.","조건 테스팅(condition testing, 표 5의 기법 A): 각 개별 조건의 true/false 결과를 커버하도록 설계한다. 테스트 데이터를 잘못 고르면 조건 커버리지 100%를 달성해도 모든 결정 결과를 커버하지 못한다. 표 5의 TC1, TC2에서 B1, B2는 각각 true와 false가 되지만 결정 결과는 둘 다 false다.","다중 조건 테스팅(multiple condition testing, 기법 B): 개별 조건 값의 모든 조합을 커버하도록 설계한다. 모든 조합을 테스트하면 결정 결과도 모두 테스트된다.","MC/DC(modified condition/decision testing, 기법 C): 다중 조건 테스팅과 비슷하지만, 개별 조건(B1, B2)이 결정 결과에 독립적으로 영향을 주는 조합만 고려한다. TC4에서는 B1이나 B2 하나만 false에서 true로 바꿔도 결정 결과가 바뀌지 않는다(계속 false). 그래서 TC1, TC2, TC3으로 MC/DC 커버리지 100%를 달성하고 TC4는 고려하지 않아도 된다.","표 5 (E = B1 AND B2. A = 조건 테스팅, B = 다중 조건 테스팅, C = MC/DC)\nTC1: B1=TRUE, B2=FALSE → E=FALSE / A, B, C\nTC2: B1=FALSE, B2=TRUE → E=FALSE / A, B, C\nTC3: B1=TRUE, B2=TRUE → E=TRUE / B, C\nTC4: B1=FALSE, B2=FALSE → E=FALSE / B","한계 비교: 조건 테스팅(A)은 조건 커버리지가 100%여도 결정 결과 하나만 커버할 리스크가 있다. TC3과 TC4를 고르면 이 문제가 풀린다. 다중 조건 테스팅(B)은 가능한 모든 입력과 출력을 커버하지만 실행할 테스트 수가 가장 많다. MC/DC(C)는 다중 조건 테스팅보다 적은 테스트로 모든 단일 조건과 모든 결정을 완전히 커버한다.","K3 풀이 순서:\n① 조건마다 '그 조건만 값이 다르고 나머지 조건은 같은데 결정 결과가 바뀌는' 테스트 케이스 쌍을 찾는다.\n② 모든 조건의 쌍을 포함하는 가장 작은 테스트 케이스 집합을 고른다.\n③ 검산: 각 조건이 true·false를 모두 갖는지, 결정 결과 true·false가 모두 나오는지 확인한다.\n표 5로 확인: B1 쌍 = TC2(F,T→F)와 TC3(T,T→T), B2 쌍 = TC1(T,F→F)와 TC3(T,T→T). 그래서 {TC1, TC2, TC3}."],"traps":["조건 커버리지 100%가 결정 커버리지 100%를 보장하지 않는다. 표 5의 TC1·TC2는 조건 커버리지 100%지만 결정 결과는 false뿐이다.","B1 AND B2에서 MC/DC에 필요 없는 케이스는 TC4(둘 다 FALSE)다. TC4를 포함하는 것은 다중 조건 테스팅뿐이다.","KSTQB 용어집 표기는 '변형 조건/결정 테스팅'이다. 5장 약어표는 MC/DC를 Modified Condition/Decision Coverage로 풀어 쓴다."]},{"id":"4.2.2","title":"back-to-back 테스팅","points":["back-to-back 테스팅은 pseudo-oracle(슈도 오라클)로 기대 결과를 만들어 테스트 대상을 테스트하는 테스트 접근법이다.","방법: 같은 테스트 케이스를 모든 variant에 실행하고 테스트 결과를 비교한다. 결과가 같으면 통과다. 다르면 감지된 차이의 원인을 분석한다.","테스트 대상들은 내용상 같은 요구사항에 기반해야 한다. 그래야 비교할 만한 동작을 보일 수 있다.","요구사항은 보통 테스트 입력을 도출하는 기반으로 쓰지만, 기대 결과를 정하는 테스트 오라클(test oracle)로는 쓰지 않는다. 대신 한 테스트 대상을 다른 대상의 pseudo-oracle로 삼아 동작을 비교한다. 이렇게 하면 테스트 대상 사이나 그 환경 사이의 의도하지 않은 차이를, 아주 작은 것까지 드러낼 수 있다.","가장 단순한 경우: 같은 소프트웨어의 다른 버전끼리 비교한다. 이전 버전이 pseudo-oracle이 되고, 리그레션 테스트와 비슷하다.","다른 경우: 실행 가능한 모델과 수동 또는 자동 생성 코드를 비교한다. 이것은 모델 기반 테스팅(model-based testing)의 한 형태이고 실행 가능한 모델이 pseudo-oracle이다. 그래서 자동화된 테스트 설계에 아주 알맞다. 테스터는 모델에서 기대 결과뿐 아니라 자동화된 테스트 케이스도 도출한다.","관련: SiL에서 모델(주로 부동소수점)과 컴파일된 코드(주로 고정소수점)의 동작 차이를 비교할 때 back-to-back 테스팅을 쓸 수 있다(3.2.2.2).","참고: KSTQB 용어집 한국어판의 pseudo-oracle 정의는 '동일한 테스트 입력을 기반으로 원래 테스트 항목의 결과와 비교되는 결과를 생성하는 데 사용되는 독립적으로 도출한 테스트 항목의 변형'이다."],"traps":["기대 결과의 출처는 요구사항이 아니라 pseudo-oracle(다른 variant)이다. 요구사항은 테스트 입력 도출에 쓴다. (v2.1 기준. 2018년판은 이전 버전을 'test oracle'이라 했고, 요구사항이 테스트 설계의 test basis가 아니라고 썼다. 'comparative test' 별칭과 '요구사항 기반 테스트를 대체하지 않는다'는 문장도 v2.1에는 없다.)","짝을 헷갈리지 않는다. 이전 버전 vs 새 버전 = 리그레션 테스트와 비슷, 실행 가능한 모델 vs 생성 코드 = 모델 기반 테스팅의 한 형태."]},{"id":"4.2.3","title":"fault injection 테스팅","points":["fault injection(결함 주입) 테스팅은 컴포넌트나 시스템이 불리한 조건(adverse conditions. 예: 결함, 이 맥락에서는 fault라고도 부름)에 어떻게 반응하는지 평가하도록 설계한 테스트 접근법이다.","오류 처리(error handling) 같은 프로그래밍 기법은 시스템이 내부·외부 결함에 견고하고 안전하게 반응하게 하려는 것이다.","테스터가 결함을 골라 넣을 수 있는 지점 3가지:\n외부 컴포넌트의 결함: 예) 센서의 비정상(implausible) 값 탐지\n인터페이스의 결함: 예) 단락이나 메시지 유실로 인한 피해 방지\n애플리케이션의 결함: 내부 결함의 탐지와 처리","결함을 넣는 방식(시스템과 테스트 환경에 따라 다름):\n고전적 fault injection: 테스터가 물리적 테스트 대상을 조작해 결함을 넣는다.\n외부 결함·인터페이스 관련 결함: 보통 HiL 테스트 환경에서 FIU로 실행 중(run-time)에 시뮬레이션한다.\n소프트웨어 기반 결함(인터페이스 결함, 내부 결함 등): 흔히 SiL 테스트 환경이나 개발 환경에서 직접, 디버거나 XCP(Universal Measurement and Calibration Protocol) 같은 도구로 시뮬레이션한다.","관련: HiL의 FIU(fault insertion unit)는 단선·단락 시뮬레이션용 구성 요소다(3.2.3.1)."],"traps":["결함 주입 지점의 세 번째는 '애플리케이션의 결함'이다. 소프트웨어 기반 결함(인터페이스·내부 결함)은 흔히 SiL 테스트 환경이나 개발 환경에서 디버거·XCP로 시뮬레이션한다. (v2.1 기준. 2018년판은 세 번째 지점을 'software'라 했고, 소프트웨어 결함은 개발 환경에서만 넣을 수 있는 경우가 많아 실무에서 시간이 많이 든다고 썼다. 이 문장들은 v2.1에 없다.)","도구·환경 짝: 외부·인터페이스 결함 = HiL + FIU, 소프트웨어 기반 결함 = SiL 또는 개발 환경 + 디버거·XCP, 고전적 방식 = 물리적 테스트 대상 조작."]},{"id":"4.2.4","title":"요구사항 기반 테스팅","points":["요구사항 기반 테스팅(requirements-based testing)에서 테스터는 보통 텍스트 요구사항을 분석해 개별 atomic requirement에서 테스트 컨디션을 도출하고, 요구사항을 실행하는 테스트 케이스를 설계해 실행한다.","이 분해는 한 요구사항 안에서 서로 구별되고 테스트할 수 있는 측면을 찾는 일이다. 각 atomic requirement는 독립적으로 검증할 수 있는 동작이나 조건 하나만 기술해야 한다.","복잡하거나 상위 수준인 요구사항을 이렇게 잘게 나누면 커버리지를 빠짐없이 확보하고, 숨은 기대나 암묵적 기대를 놓치지 않는다.","요구사항 커버리지 = (테스트 케이스 하나 이상으로 커버된 atomic requirement 수) ÷ (전체 atomic requirement 수).","계산 예(실라버스에 없는 연습용 숫자): 원래 요구사항 4개를 atomic requirement 10개로 나눴고 그중 8개를 테스트 케이스가 하나 이상 커버하면, 요구사항 커버리지는 8 ÷ 10 = 80%다.","요구사항 기반 테스팅의 테스트 케이스는 보통 positive 테스트 케이스다. 명시된 요구사항이 충족되는지 확인한다.","negative 테스트 케이스는 흔히 동등 분할, 오류 추정, 탐색적 테스팅 같은 보완 기법으로 도출한다. 다만 요구사항이 negative 조건을 명시하기도 한다.","atomic은 4.1.2의 Singular와 같은 말이다(각주: singular is also known as atomic)."],"traps":["요구사항 커버리지는 원래 요구사항 개수가 아니라 atomic requirement 개수로 센다. 테스트 케이스 하나라도 커버하면 '커버됨'이다.","4.2.4는 v2.1에서 전면 개정됐다. 인터넷의 2018년판 자료에 있는 '테스트 결과 분석 후 테스트 개선', '요구사항이 너무 상세하면 우선순위화 필수' 같은 내용은 v2.1에 없다."]},{"id":"4.2.5","title":"상황에 따른 기법·접근법 선택","points":["자동차 시스템 맥락에서 의미 있는 테스트 기법·접근법 9가지(일부는 CTFL에서, 일부는 4.2에서 소개): 요구사항 기반 테스팅, 동등 분할, 경계값 분석, 구문 테스팅, 분기 테스팅, MC/DC, 오류 추정, fault injection, back-to-back 테스팅.","알맞은 기법·접근법 선택은 네 요인에 달려 있다: State of the Art, 테스트 베이시스(test basis), 리스크 기반 테스팅(risk-based testing), 테스트 레벨(test level).","State of the Art: 그 기법·접근법이 이 목적에서 현재 state of the art인가? ISO/IEC/IEEE 29119와 ISO 26262가 지침이 된다. 특히 ISO/IEC/IEEE 29119-4는 표준화된 테스트 기법을 커버리지 척도와 함께 블랙박스·화이트박스·경험 기반으로 나눠 정리한다. ISO 26262는 ASIL에 따라 적용할 기법·접근법을 제시한다(2.2). 권고에서 벗어나려면 신중히 검토하고 근거를 대야 한다.","테스트 베이시스: 테스트 베이시스가 그 기법에 맞는 테스트 컨디션을 주는가? 예: 동등 분할은 테스트 베이시스에 파라미터나 변수가 있어야 만들 수 있고, 값을 동등 분할로 묶을 수 있어야 한다. 경계값도 비슷하다. 값 범위가 선형으로 정의돼 있어야 테스트할 수 있다.","리스크 기반 테스팅: 제품 리스크를 식별하고 리스크 수준을 고려해 기법·접근법을 고른다. 예: 경계값 테스트는 경계 위반이 일어날 리스크가 있고, 그 위반의 영향이 리스크가 될 때만 의미가 있다.","테스트 레벨: 그 기법·접근법을 이 테스트 레벨에서 쓸 수 있는가? 화이트박스 테스팅은 소스 코드나 내부 구조가 테스트 베이시스일 때 특히 알맞고, 이상적으로는 구조 커버리지를 잴 수 있다. 블랙박스 테스팅은 테스트 대상이 사용 가능하고 관찰 가능해야 한다. 예: 센서의 동등 분할 테스트는 컴포넌트 테스팅보다 시스템 테스팅에서 더 효율적일 수 있다. 한 테스트 레벨에서 쓸 수 없으면 테스트 전략에 따라 다른 테스트 레벨을 고른다.","표 6(사용자 평가 예시). 열 순서: ASIL A에 권고? / 테스트 베이시스 적합? / 결함 미발견 시 리스크 / 시스템 테스트 레벨에서 타당? / 선택\n1 요구사항 기반 테스팅: ++ / YES / ++ / YES / 선택\n2 동등 분할: + / YES / ++ / YES / 선택\n3 경계값 분석: + / NO / - / YES / 미선택\n4 구문 테스팅: ++ / YES / ++ / NO / 미선택\n5 결정 테스팅: + / YES / ++ / NO / 미선택\n6 MC/DC: + / YES / + / NO / 미선택\n7 오류 추정: + / NO / ++ / YES / 미선택\n8 fault injection 테스팅: + / YES / + / NO / 미선택\n9 back-to-back 테스팅: + / NO / ++ / YES / 미선택","표 6 읽기: 선택(X)된 것은 1행 요구사항 기반 테스팅과 2행 동등 분할 두 개다. 표에서 보면 이 두 행만 테스트 베이시스 적합이 YES이면서 시스템 테스트 레벨 타당이 YES다. 실라버스는 선택 이유를 따로 설명하지 않는다.","K3 풀이 순서:\n① 문제 상황에서 네 요인(state of the art·ASIL 권고, 테스트 베이시스, 리스크, 테스트 레벨)의 값을 정리한다.\n② 테스트 베이시스가 기법의 전제를 주는지 본다. 예: 동등 분할은 파라미터·변수와 묶을 수 있는 값, 경계값은 선형으로 정의된 값 범위가 있어야 한다.\n③ 리스크를 본다. 예: 경계 위반이 일어날 리스크와 그 영향이 없으면 경계값 테스트는 의미가 없다.\n④ 그 테스트 레벨에서 쓸 수 없으면 테스트 전략에 따라 다른 테스트 레벨을 고른다(should)."],"traps":["표 6에서 구문 테스팅은 ASIL A에 ++이고 테스트 베이시스 YES, 리스크 ++인데도 선택되지 않았다. 이 행에서 다른 칸과 다른 값은 '시스템 테스트 레벨에서 타당?'의 NO다. 실라버스는 한 테스트 레벨에서 쓸 수 없는 기법이면 테스트 전략에 따라 다른 테스트 레벨을 고르라고 한다(4.2.5 테스트 레벨).","경계값은 값 범위가 선형으로 정의돼 있어야 테스트할 수 있고, 경계 위반 리스크와 그 영향이 있어야 의미가 있다. 표 6에서 경계값 분석은 테스트 베이시스 NO, 리스크 '-'이고 선택되지 않았다.","9개 목록에는 '분기 테스팅'이 있지만 표 6의 5행은 '결정 테스팅'이다. v2.1 원문이 그렇다. (2018년판 목록은 결정 테스팅이었다.)"]}]}]}</script>
<script>

function mergeState(o) {
  for (const [id, r] of Object.entries(o.q || {})) if (!S.q[id] || (r.t || 0) > (S.q[id].t || 0)) S.q[id] = r;
  for (const [id, w] of Object.entries(o.wrong || {})) {
    const r = S.q[id];
    // 오답이 된 뒤 다른 쪽 기기에서 두 번 연속 맞혀 졸업한 문제는 다시 넣지 않음
    if (!S.wrong[id] && !(r && r.last === 1 && r.st >= 2 && (r.t || 0) > (w.t || 0))) S.wrong[id] = w;
  }
  S.grad = Math.max(S.grad || 0, o.grad || 0);
  const seenT = new Set(S.mocks.map(m => m.t));
  for (const m of o.mocks || []) if (!seenT.has(m.t)) S.mocks.push(m);
  S.mocks.sort((a, b) => a.t - b.t);
  for (const [k, val] of Object.entries(o.plan || {})) if (val) S.plan[k] = true;
  for (const [k, val] of Object.entries(o.cards || {})) if (S.cards[k] === undefined || val === 1) S.cards[k] = val;
  S.mockSeen = Array.from(new Set([...(S.mockSeen || []), ...(o.mockSeen || [])]));
  for (const [k, val] of Object.entries(o.samples || {})) if (val != null && S.samples[k] == null) S.samples[k] = val;
  Object.assign(S.reports, o.reports || {});
  save();
}

function paceBudget(cur, i) {
  // 공식 구조표 예상 시간(K1·K2 1분, K3 3분, 합 54분)을 60분에 비례 배분
  let t = 0; for (let j = 0; j < i; j++) t += QBY[cur.ids[j]].k === 3 ? 3 : 1;
  return t * 60 / 54 * 60000;
}

function tableHtml(t) {

}
// 채점된 보기: 정답·내 선택은 해설을 펼치고, 나머지 보기 해설은 접어 둔다
function gradedOpts(q, sel, perm) {
  const row = (oi, pos) => {
    const mine = sel.includes(oi), right = q.ans.includes(oi);
    const cls = right ? "right" : mine ? "wrong" : "";
    const tag = right ? `<span class="tag ok">정답${mine ? " · 내 선택" : ""}</span>` : mine ? `<span class="tag bad">내 선택</span>` : "";
    const why = right || mine ? `<span class="why">${fmt(q.why[oi])}</span>` : "";
    return `<div class="opt ${cls}"><span class="lt">${LETTERS[pos]}</span><span>${fmt(q.opts[oi])}</span>${tag}${why}</div>`;
  };
  const rest = perm.map((oi, pos) => ({ oi, pos })).filter(({ oi }) => !q.ans.includes(oi) && !sel.includes(oi));
  return `<div class="opts">${perm.map(row).join("")}</div>${rest.length ? `<details class="others"><summary><span class="small">나머지 보기는 왜 틀렸나요</span></summary>${rest.map(({ oi, pos }) => `<div class="opt"><span class="lt">${LETTERS[pos]}</span><span class="why">${fmt(q.why[oi])}</span></div>`).join("")}</details>` : ""}`;
}
