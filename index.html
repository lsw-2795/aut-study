공통 핵심(요구사항에서 출발해 테스트를 설계한다)과 실라버스 4.2.4 설명을 함께 기억한다. atomic requirement와 블랙박스 테스트 기법까지 적은 것은 영문 정의다."}],"sections":[{"id":"4.1","title":"정적 테스팅","points":["4장 시험은 6문제다. K1 1문제(4.2.4와 키워드), K2 2문제(4.1.1에서 1문제, 4.2.2·4.2.3 묶음에서 1문제), K3 3문제(4.1.2, 4.2.1, 4.2.5에서 1문제씩).","정적 테스팅(static testing)은 소프트웨어 개발의 작업 산출물을 실행하지 않고 검토하는 것이다. 사람이 하는 리뷰와 도구 기반 정적 분석(static analysis)이 여기에 속한다."],"traps":[]},{"id":"4.1.1","title":"MISRA-C 가이드라인","points":["소스 코드가 코딩 가이드라인(coding guideline)을 지키는 것은 state of the art다. ISO 26262도 안전 관련 소프트웨어에 코딩 가이드라인 준수를 권고한다(각주: ISO 26262:2018 Part 6-5.4.3).","코딩 가이드라인은 결함으로 이어질 수 있는 코드의 이상 사항(anomaly)을 피하게 돕는다. 동시에 유지 가능성(maintainability)과 이동성(portability)을 돕는다.","MISRA-C는 C 언어용 코딩 가이드라인이고 자동차 소프트웨어 프로젝트에서 흔히 쓴다. 6장 정의: MISRA가 제공하는, 크리티컬 시스템에서 C 언어를 쓰기 위한 코딩 가이드라인. MISRA = Motor Industry Software Reliability Association.","가이드라인은 두 종류다.\nrule: 정적 분석 도구로 검증할 수 있다. 예: '소스 코드에 중첩 주석을 넣으면 안 된다.' 6장 정의: 정적 분석으로 완전히 검증할 수 있는 프로그래밍 가이드라인.\ndirective: 정적 분석 도구로 완전히 검증되지 않는다. 개발 프로세스의 세부 사항이나 소프트웨어 밖의 문서를 다룬다. 예: '개발자는 구현한 동작을 충분히 문서화해야 한다.' 6장 정의: 정적 분석으로 완전히 검증할 수 없는 프로그래밍 가이드라인.","가이드라인마다 세 의무 수준(level of obligation) 중 하나가 붙는다.\nadvisory: 노력이 합리적이면 개발자가 따라야 한다.\nrequired: 개발자가 따라야 한다. 예외는 가능하지만 공식 승인(예: 품질 관리)을 받아야 한다.\nmandatory: 개발자가 따라야 한다. 예외가 없다.","조직은 가이드라인의 의무 수준을 개별적으로 올릴 수는 있지만 절대 내릴 수는 없다."],"traps":["rule과 directive를 가르는 기준은 정적 분석 도구로 (완전히) 검증할 수 있느냐다. directive는 개발 프로세스의 세부 사항이나 소프트웨어 밖의 문서를 다룬다. 실라버스의 rule 예시는 '소스 코드에 중첩 주석을 넣으면 안 된다'이다. 주석을 다룬다고 directive로 고르지 않는다.","required의 예외 조건은 '공식 승인(예: 품질 관리)'이다. (v2.1 기준. 2018년판은 개발자가 납득할 만하게 설명하면 무시할 수 있다고 썼다.)","advisory도 v2.1 문장은 '노력이 합리적이면 따라야 한다(must)'이다. (v2.1 기준. 2018년판은 should.)","의무 수준은 조직이 올리기만 할 수 있다. 프로젝트 사정으로 required를 advisory로 낮추는 것은 실라버스상 허용되지 않는다."]},{"id":"4.1.2","title":"요구사항 리뷰를 위한 품질 특성","points":["명세는 개발과 테스팅의 기반이다. 그래서 명세의 결함은 비용과 시간이 많이 드는 후속 작업을 부른다. 인수 테스팅이나 운영처럼 늦은 단계에서야 발견되면 특히 그렇다.","리뷰는 명세의 결함을 일찍 찾아 일찍, 적은 비용으로 고치는 효과적인 수단이다.","테스트 분석 중에 테스터는 테스트 대상의 명세를 확인해야 한다. 특히 테스트 베이시스로 적합한지를 본다. 품질 특성은 명세를 리뷰할 때 초점을 잡고 결함을 최대한 많이 찾게 돕는다.","ISO 29148:2018에는 단일 요구사항용 품질 특성과 요구사항 집합용 품질 특성이 있다.","테스터와 관련된 ISO 29148:2018 품질 특성 5가지:\nVerifiable: 각 요구사항이 올바르게 실현됐음을 증명할 수 있다.\nUnambiguous: 각 요구사항에 명확한 테스트 컨디션이 들어 있다.\nConsistent: 각 요구사항이 그 자체로, 그리고 다른 모든 요구사항과 일관된다.\nComplete: 각 요구사항이 해석의 여지를 남기지 않고, 암묵적 지식이나 경험에서 온 지식에 기대지 않는다.\nSingular: 어떤 요구사항도 의미 있는 부분 요구사항으로 나눌 수 없다. singular는 atomic이라고도 한다(각주).","요구사항 리뷰를 준비할 때 테스터는 이 품질 특성에서 체크리스트 항목을 뽑아 리뷰 체크리스트를 만들 수 있다. 체크리스트 항목은 품질 기준 이름을 그냥 적는 것보다 구체적이어야 한다. 품질 기준 이름은 너무 추상적이기 때문이다.","예: consistency에 대한 체크리스트 항목 '모든 요구사항에서 용어를 일관되게 쓰는가?'. 명세를 리뷰할 때 테스터는 아는 범위에서 최선을 다해 체크리스트 항목에 답해야 한다.","ISO 29148:2018에 따르면 요구사항은 feasible, appropriate, correct, conforming, comprehensible, necessary 해야 한다(should). 다만 테스터가 이 특성들을 평가하기는 보통 어렵다.","K3 적용 요령: 요구사항 문장을 다섯 정의와 하나씩 대조한다.\n의미 있게 나눌 수 있는 동작이 한 요구사항에 둘 이상 → Singular 위반\n다른 요구사항과 모순되거나 한 요구사항 안에서 앞뒤가 안 맞음 → Consistent 위반\n해석의 여지가 있거나 암묵적 지식·경험에 기댐 → Complete 위반\n명확한 테스트 컨디션이 없음 → Unambiguous 위반\n올바르게 실현됐는지 증명할 수 없음 → Verifiable 위반"],"traps":["'해석의 여지를 남기지 않는다'는 Unambiguous가 아니라 Complete의 정의 문장이다(4.1.2). Unambiguous의 정의는 '명확한 테스트 컨디션을 담고 있다'이다. 단어 뜻만 보고 고르면 틀리기 쉽다.","테스터 관련 품질 특성은 v2.1에서 5개(Verifiable, Unambiguous, Consistent, Complete, Singular)다. (v2.1 기준. 2018년판은 Traceable(ID로 표시)과 Bounded(개발 범위 정의)를 더한 7개였고, Complete는 '오류·중단·예외를 포함한 모든 경우를 고려', Verifiable은 '정적·동적 테스트로 검증할 수 있다'였다.)","feasible, appropriate, correct, conforming, comprehensible, necessary는 '테스터가 평가하기 어려운' 특성이다. 테스터 관련 5개 목록과 섞지 않는다. (v2.1 기준. 2018년판은 Hobbs를 출처로 feasible, implementation-free, necessary 3개를 들었다.)","Consistent는 다른 요구사항과의 일관성뿐 아니라 요구사항 자체의 일관성도 포함한다(v2.1.1 Errata에서 보강)."]},{"id":"4.2","title":"동적 테스팅","points":["4.2는 자동차 맥락의 동적 테스팅을 다룬다: MC/DC(4.2.1), back-to-back 테스팅(4.2.2), fault injection 테스팅(4.2.3), 요구사항 기반 테스팅(4.2.4), 상황에 따른 기법·접근법 선택(4.2.5).","실라버스는 MC/DC를 화이트박스 테스트 기법으로, back-to-back 테스팅과 fault injection 테스팅을 테스트 접근법(test approach)으로 소개한다(4.2.1, 4.2.2, 4.2.3)."],"traps":[]},{"id":"4.2.1","title":"MC/DC(modified condition/decision testing)","points":["여기서 다루는 기법은 화이트박스 테스트 기법이다(자세한 내용은 Technical Test Analyst 실라버스). 테스터는 테스트 대상의 구조(예: 소스 코드)에서 테스트 케이스를 바로 도출한다.","결정 테스팅(decision testing): 모든 결정 결과, 즉 각 결정의 true와 false를 실행하도록 테스트 케이스를 설계한다. 결정은 조건 하나 이상으로 이뤄지고 각 조건은 true나 false가 된다. 결정 결과는 조건 값들의 논리 조합으로 정해진다.","결정이 조건 하나로만 이뤄지면 결정 테스팅과 조건 테스팅은 같은 커버리지를 달성한다. 조건이 여러 개인 결정에는 더 상세한 기법이 있다.","조건 테스팅(condition testing, 표 5의 기법 A): 각 개별 조건의 true/false 결과를 커버하도록 설계한다. 테스트 데이터를 잘못 고르면 조건 커버리지 100%를 달성해도 모든 결정 결과를 커버하지 못한다. 표 5의 TC1, TC2에서 B1, B2는 각각 true와 false가 되지만 결정 결과는 둘 다 false다.","다중 조건 테스팅(multiple condition testing, 기법 B): 개별 조건 값의 모든 조합을 커버하도록 설계한다. 모든 조합을 테스트하면 결정 결과도 모두 테스트된다.","MC/DC(modified condition/decision testing, 기법 C): 다중 조건 테스팅과 비슷하지만, 개별 조건(B1, B2)이 결정 결과에 독립적으로 영향을 주는 조합만 고려한다. TC4에서는 B1이나 B2 하나만 false에서 true로 바꿔도 결정 결과가 바뀌지 않는다(계속 false). 그래서 TC1, TC2, TC3으로 MC/DC 커버리지 100%를 달성하고 TC4는 고려하지 않아도 된다.","표 5 (E = B1 AND B2. A = 조건 테스팅, B = 다중 조건 테스팅, C = MC/DC)\nTC1: B1=TRUE, B2=FALSE → E=FALSE / A, B, C\nTC2: B1=FALSE, B2=TRUE → E=FALSE / A, B, C\nTC3: B1=TRUE, B2=TRUE → E=TRUE / B, C\nTC4: B1=FALSE, B2=FALSE → E=FALSE / B","한계 비교: 조건 테스팅(A)은 조건 커버리지가 100%여도 결정 결과 하나만 커버할 리스크가 있다. TC3과 TC4를 고르면 이 문제가 풀린다. 다중 조건 테스팅(B)은 가능한 모든 입력과 출력을 커버하지만 실행할 테스트 수가 가장 많다. MC/DC(C)는 다중 조건 테스팅보다 적은 테스트로 모든 단일 조건과 모든 결정을 완전히 커버한다.","K3 풀이 순서:\n① 조건마다 '그 조건만 값이 다르고 나머지 조건은 같은데 결정 결과가 바뀌는' 테스트 케이스 쌍을 찾는다.\n② 모든 조건의 쌍을 포함하는 가장 작은 테스트 케이스 집합을 고른다.\n③ 검산: 각 조건이 true·false를 모두 갖는지, 결정 결과 true·false가 모두 나오는지 확인한다.\n표 5로 확인: B1 쌍 = TC2(F,T→F)와 TC3(T,T→T), B2 쌍 = TC1(T,F→F)와 TC3(T,T→T). 그래서 {TC1, TC2, TC3}."],"traps":["조건 커버리지 100%가 결정 커버리지 100%를 보장하지 않는다. 표 5의 TC1·TC2는 조건 커버리지 100%지만 결정 결과는 false뿐이다.","B1 AND B2에서 MC/DC에 필요 없는 케이스는 TC4(둘 다 FALSE)다. TC4를 포함하는 것은 다중 조건 테스팅뿐이다.","ISTQB 용어집 한국어판(ko_KR) 표기는 '변형 조건/결정 테스팅'이다. 5장 약어표는 MC/DC를 Modified Condition/Decision Coverage로 풀어 쓴다."]},{"id":"4.2.2","title":"back-to-back 테스팅","points":["back-to-back 테스팅은 pseudo-oracle(슈도 오라클)로 기대 결과를 만들어 테스트 대상을 테스트하는 테스트 접근법이다.","방법: 같은 테스트 케이스를 모든 variant에 실행하고 테스트 결과를 비교한다. 결과가 같으면 통과다. 다르면 감지된 차이의 원인을 분석한다.","테스트 대상들은 내용상 같은 요구사항에 기반해야 한다. 그래야 비교할 만한 동작을 보일 수 있다.","요구사항은 보통 테스트 입력을 도출하는 기반으로 쓰지만, 기대 결과를 정하는 테스트 오라클(test oracle)로는 쓰지 않는다. 대신 한 테스트 대상을 다른 대상의 pseudo-oracle로 삼아 동작을 비교한다. 이렇게 하면 테스트 대상 사이나 그 환경 사이의 의도하지 않은 차이를, 아주 작은 것까지 드러낼 수 있다.","가장 단순한 경우: 같은 소프트웨어의 다른 버전끼리 비교한다. 이전 버전이 pseudo-oracle이 되고, 리그레션 테스트와 비슷하다.","다른 경우: 실행 가능한 모델과 수동 또는 자동 생성 코드를 비교한다. 이것은 모델 기반 테스팅(model-based testing)의 한 형태이고 실행 가능한 모델이 pseudo-oracle이다. 그래서 자동화된 테스트 설계에 아주 알맞다. 테스터는 모델에서 기대 결과뿐 아니라 자동화된 테스트 케이스도 도출한다.","관련: SiL에서 모델(주로 부동소수점)과 컴파일된 코드(주로 고정소수점)의 동작 차이를 비교할 때 back-to-back 테스팅을 쓸 수 있다(3.2.2.2).","참고: ISTQB 용어집 한국어판(ko_KR)의 pseudo-oracle 정의는 '동일한 테스트 입력을 기반으로 원래 테스트 항목의 결과와 비교되는 결과를 생성하는 데 사용되는 독립적으로 도출한 테스트 항목의 변형'이다."],"traps":["기대 결과의 출처는 요구사항이 아니라 pseudo-oracle(다른 variant)이다. 요구사항은 테스트 입력 도출에 쓴다. (v2.1 기준. 2018년판은 이전 버전을 'test oracle'이라 했고, 요구사항이 테스트 설계의 test basis가 아니라고 썼다. 'comparative test' 별칭과 '요구사항 기반 테스트를 대체하지 않는다'는 문장도 v2.1에는 없다.)","짝을 헷갈리지 않는다. 이전 버전 vs 새 버전 = 리그레션 테스트와 비슷, 실행 가능한 모델 vs 생성 코드 = 모델 기반 테스팅의 한 형태."]},{"id":"4.2.3","title":"fault injection 테스팅","points":["fault injection(결함 주입) 테스팅은 컴포넌트나 시스템이 불리한 조건(adverse conditions. 예: 결함, 이 맥락에서는 fault라고도 부름)에 어떻게 반응하는지 평가하도록 설계한 테스트 접근법이다.","오류 처리(error handling) 같은 프로그래밍 기법은 시스템이 내부·외부 결함에 견고하고 안전하게 반응하게 하려는 것이다.","테스터가 결함을 골라 넣을 수 있는 지점 3가지:\n외부 컴포넌트의 결함: 예) 센서의 비정상(implausible) 값 탐지\n인터페이스의 결함: 예) 단락이나 메시지 유실로 인한 피해 방지\n애플리케이션의 결함: 내부 결함의 탐지와 처리","결함을 넣는 방식(시스템과 테스트 환경에 따라 다름):\n고전적 fault injection: 테스터가 물리적 테스트 대상을 조작해 결함을 넣는다.\n외부 결함·인터페이스 관련 결함: 보통 HiL 테스트 환경에서 FIU로 실행 중(run-time)에 시뮬레이션한다.\n소프트웨어 기반 결함(인터페이스 결함, 내부 결함 등): 흔히 SiL 테스트 환경이나 개발 환경에서 직접, 디버거나 XCP(Universal Measurement and Calibration Protocol) 같은 도구로 시뮬레이션한다.","관련: HiL의 FIU(fault insertion unit)는 단선·단락 시뮬레이션용 구성 요소다(3.2.3.1)."],"traps":["결함 주입 지점의 세 번째는 '애플리케이션의 결함'이다. 소프트웨어 기반 결함(인터페이스·내부 결함)은 흔히 SiL 테스트 환경이나 개발 환경에서 디버거·XCP로 시뮬레이션한다. (v2.1 기준. 2018년판은 세 번째 지점을 'software'라 했고, 소프트웨어 결함은 개발 환경에서만 넣을 수 있는 경우가 많아 실무에서 시간이 많이 든다고 썼다. 이 문장들은 v2.1에 없다.)","도구·환경 짝(원문 강도 그대로): 외부·인터페이스 관련 결함 → 보통(typically) HiL + FIU, 소프트웨어 기반 결함(인터페이스·내부 결함 등) → 흔히(often) SiL 또는 개발 환경 + 디버거·XCP, 고전적 방식 → 물리적 테스트 대상 조작. 인터페이스 결함은 HiL 쪽과 소프트웨어 기반 쪽 양쪽에 나온다."]},{"id":"4.2.4","title":"요구사항 기반 테스팅","points":["요구사항 기반 테스팅(requirements-based testing)에서 테스터는 보통 텍스트 요구사항을 분석해 개별 atomic requirement에서 테스트 컨디션을 도출하고, 요구사항을 실행하는 테스트 케이스를 설계해 실행한다.","이 분해는 한 요구사항 안에서 서로 구별되고 테스트할 수 있는 측면을 찾는 일이다. 각 atomic requirement는 독립적으로 검증할 수 있는 동작이나 조건 하나만 기술해야 한다.","복잡하거나 상위 수준인 요구사항을 이렇게 잘게 나누면 커버리지를 빠짐없이 확보하고, 숨은 기대나 암묵적 기대를 놓치지 않는다.","요구사항 커버리지 = (테스트 케이스 하나 이상으로 커버된 atomic requirement 수) ÷ (전체 atomic requirement 수).","계산 예(실라버스에 없는 연습용 숫자): 원래 요구사항 4개를 atomic requirement 10개로 나눴고 그중 8개를 테스트 케이스가 하나 이상 커버하면, 요구사항 커버리지는 8 ÷ 10 = 80%다.","요구사항 기반 테스팅의 테스트 케이스는 보통 positive 테스트 케이스다. 명시된 요구사항이 충족되는지 확인한다.","negative 테스트 케이스는 흔히 동등 분할, 오류 추정, 탐색적 테스팅 같은 보완 기법으로 도출한다. 다만 요구사항이 negative 조건을 명시하기도 한다.","atomic은 4.1.2의 Singular와 같은 말이다(각주: singular is also known as atomic)."],"traps":["요구사항 커버리지는 원래 요구사항 개수가 아니라 atomic requirement 개수로 센다. 테스트 케이스 하나라도 커버하면 '커버됨'이다.","4.2.4는 v2.1에서 전면 개정됐다. 인터넷의 2018년판 자료에 있는 '테스트 결과 분석 후 테스트 개선', '요구사항이 너무 상세하면 우선순위화 필수' 같은 내용은 v2.1에 없다."]},{"id":"4.2.5","title":"상황에 따른 기법·접근법 선택","points":["자동차 시스템 맥락에서 의미 있는 테스트 기법·접근법 9가지(일부는 CTFL에서, 일부는 4.2에서 소개): 요구사항 기반 테스팅, 동등 분할, 경계값 분석, 구문 테스팅, 분기 테스팅, MC/DC, 오류 추정, fault injection, back-to-back 테스팅.","알맞은 기법·접근법 선택은 네 요인에 달려 있다: State of the Art, 테스트 베이시스(test basis), 리스크 기반 테스팅(risk-based testing), 테스트 레벨(test level).","State of the Art: 그 기법·접근법이 이 목적에서 현재 state of the art인가? ISO/IEC/IEEE 29119와 ISO 26262가 지침이 된다. 특히 ISO/IEC/IEEE 29119-4는 표준화된 테스트 기법을 커버리지 척도와 함께 블랙박스·화이트박스·경험 기반으로 나눠 정리한다. ISO 26262는 ASIL에 따라 적용할 기법·접근법을 제시한다(2.2). 권고에서 벗어나려면 신중히 검토하고 근거를 대야 한다.","테스트 베이시스: 테스트 베이시스가 그 기법에 맞는 테스트 컨디션을 주는가? 예: 동등 분할은 테스트 베이시스에 파라미터나 변수가 있어야 만들 수 있고, 값을 동등 분할로 묶을 수 있어야 한다. 경계값도 비슷하다. 값 범위가 선형으로 정의돼 있어야 테스트할 수 있다.","리스크 기반 테스팅: 제품 리스크를 식별하고 리스크 수준을 고려해 기법·접근법을 고른다. 예: 경계값 테스트는 경계 위반이 일어날 리스크가 있고, 그 위반의 영향이 리스크가 될 때만 의미가 있다.","테스트 레벨: 그 기법·접근법을 이 테스트 레벨에서 쓸 수 있는가? 화이트박스 테스팅은 소스 코드나 내부 구조가 테스트 베이시스일 때 특히 알맞고, 이상적으로는 구조 커버리지를 잴 수 있다. 블랙박스 테스팅은 테스트 대상이 사용 가능하고 관찰 가능해야 한다. 예: 센서의 동등 분할 테스트는 컴포넌트 테스팅보다 시스템 테스팅에서 더 효율적일 수 있다. 한 테스트 레벨에서 쓸 수 없으면 테스트 전략에 따라 다른 테스트 레벨을 고른다.","표 6(사용자 평가 예시). 열 순서: ASIL A에 권고? / 테스트 베이시스 적합? / 결함 미발견 시 리스크 / 시스템 테스트 레벨에서 타당? / 선택\n1 요구사항 기반 테스팅: ++ / YES / ++ / YES / 선택\n2 동등 분할: + / YES / ++ / YES / 선택\n3 경계값 분석: + / NO / - / YES / 미선택\n4 구문 테스팅: ++ / YES / ++ / NO / 미선택\n5 결정 테스팅: + / YES / ++ / NO / 미선택\n6 MC/DC: + / YES / + / NO / 미선택\n7 오류 추정: + / NO / ++ / YES / 미선택\n8 fault injection 테스팅: + / YES / + / NO / 미선택\n9 back-to-back 테스팅: + / NO / ++ / YES / 미선택","표 6 읽기: 선택(X)된 것은 1행 요구사항 기반 테스팅과 2행 동등 분할 두 개다. 표에서 보면 이 두 행만 테스트 베이시스 적합이 YES이면서 시스템 테스트 레벨 타당이 YES다. 실라버스는 선택 이유를 따로 설명하지 않는다.","K3 풀이 순서:\n① 문제 상황에서 네 요인(state of the art·ASIL 권고, 테스트 베이시스, 리스크, 테스트 레벨)의 값을 정리한다.\n② 테스트 베이시스가 기법의 전제를 주는지 본다. 예: 동등 분할은 파라미터·변수와 묶을 수 있는 값, 경계값은 선형으로 정의된 값 범위가 있어야 한다.\n③ 리스크를 본다. 예: 경계 위반이 일어날 리스크와 그 영향이 없으면 경계값 테스트는 의미가 없다.\n④ 그 테스트 레벨에서 쓸 수 없으면 테스트 전략에 따라 다른 테스트 레벨을 고른다(should)."],"traps":["표 6에서 구문 테스팅은 ASIL A에 ++이고 테스트 베이시스 YES, 리스크 ++인데도 선택되지 않았다. 이 행에서 다른 칸과 다른 값은 '시스템 테스트 레벨에서 타당?'의 NO다. 실라버스는 한 테스트 레벨에서 쓸 수 없는 기법이면 테스트 전략에 따라 다른 테스트 레벨을 고르라고 한다(4.2.5 테스트 레벨).","경계값은 값 범위가 선형으로 정의돼 있어야 테스트할 수 있고, 경계 위반 리스크와 그 영향이 있어야 의미가 있다. 표 6에서 경계값 분석은 테스트 베이시스 NO, 리스크 '-'이고 선택되지 않았다.","9개 목록에는 '분기 테스팅'이 있지만 표 6의 5행은 '결정 테스팅'이다. v2.1 원문이 그렇다. (2018년판 목록은 결정 테스팅이었다.)"]}]}]}</script>

  [["AuT-3.1.3", "AuT-3.2.1.2", "AuT-3.2.3.2", "AuT-3.2.4.1"], 6], [["AuT-3.2.4.2"], 2],

const $ = s => document.querySelector(s);
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function ddayOf(iso) { const [y, m, d] = iso.split("-").map(Number); const [ey, em, ed] = EXAM_DAY.split("-").map(Number); return Math.round((Date.UTC(ey, em - 1, ed) - Date.UTC(y, m - 1, d)) / 86400000); }

function record(id, ok) {
  const r = S.q[id] || { n: 0, c: 0, st: 0 };
  r.n++; if (ok) { r.c++; r.st++; } else r.st = 0;
  r.last = ok ? 1 : 0; r.t = Date.now(); S.q[id] = r;
  if (!ok) { S.wrong[id] = { t: Date.now(), st: 0 }; }
  else if (S.wrong[id]) {
    // 오답노트 문제는 두 번 연속 맞히면 졸업
    S.wrong[id].st++;
    if (S.wrong[id].st >= 2) { delete S.wrong[id]; S.grad++; }
  }
}
function chStats(ch) {
  const qs = QS.filter(q => q.ch === ch);
  let seen = 0, n = 0, c = 0;
  for (const q of qs) { const r = S.q[q.id]; if (r) { seen++; n += r.n; c += r.c; } }
  return { total: qs.length, seen, n, c, acc: n ? c / n : null };
}
function estimate() {
  // 3번 이상 풀어본 장만 반영해 40문항으로 환산. 안 푼 장을 0점으로 더하면 초반엔 늘 불합격처럼 보여서.
  let est = 0, covered = 0; const used = [];
  for (const ch of CHS) { const s = chStats(ch); if (s.n >= 3) { est += s.acc * CH_N[ch]; covered += CH_N[ch]; used.push(ch); } }
  return { proj: covered ? est / covered * TOTAL : null, covered, used };
}
function loStats() {
  const m = {};
  for (const q of QS) { const r = S.q[q.id]; const o = m[q.lo] || (m[q.lo] = { n: 0, c: 0, ch: q.ch }); if (r) { o.n += r.n; o.c += r.c; } }
  return m;
}
function accColor(a) { return a >= .75 ? "var(--ok)" : a >= .65 ? "var(--warn)" : "var(--bad)"; }

function startChapter(ch) {
  const qs = QS.filter(q => q.ch === ch && !q.hard).sort(byLo);
  const unseen = qs.filter(q => !S.q[q.id]), wrong = qs.filter(q => S.q[q.id] && S.q[q.id].last === 0), rest = qs.filter(q => S.q[q.id] && S.q[q.id].last === 1);
  newSession("practice", `${ch}장 연습`, [...unseen, ...wrong, ...rest].map(q => q.id), { kind: "chapter", arg: ch });
}
function startHard(ch, n) {
  const pool = HQS.filter(q => !ch || q.ch === ch);
  const fresh = shuffle(pool.filter(q => !S.q[q.id])), wrong = shuffle(pool.filter(q => S.q[q.id] && S.q[q.id].last === 0)), rest = shuffle(pool.filter(q => S.q[q.id] && S.q[q.id].last === 1));
  let ids = [...fresh, ...wrong, ...rest].map(q => q.id);
  if (n) ids = ids.slice(0, n); else ids.sort((a, b) => byLo(QBY[a], QBY[b]));
  newSession("practice", `실전 난이도${ch ? ` · ${ch}장` : n ? ` ${n}문제` : ""}`, ids, { kind: "hard", arg: ch || 0 });
}
function startRandom(n, ch) {
  const pool = QS.filter(q => !q.hard && (!ch || q.ch === ch));
  const ids = pick(pool, n).map(q => q.id);
  newSession("practice", `랜덤 ${ids.length}문제${ch ? ` · ${ch}장` : ""}`, ids, { kind: "random" });
}
const K3_NAME = { "AuT-2.1.2.5": "SW 유닛 검증 수단", "AuT-2.2.5": "ISO 26262 방법 표", "AuT-3.2.4.2": "XiL 배정", "AuT-4.1.2": "요구사항 리뷰", "AuT-4.2.1": "MC/DC", "AuT-4.2.5": "기법 선택" };
function startK3(arg) {
  const los = typeof arg === "string" && arg.startsWith("AuT-") ? arg.split(",") : null;
  const pool = QS.filter(q => q.k === 3 && !q.hard && (los ? los.includes(q.lo) : (!arg || q.ch === arg))).sort(byLo);
  // 안 푼 것과 틀린 것 먼저
  const order = [...pool.filter(q => !S.q[q.id]), ...pool.filter(q => S.q[q.id] && S.q[q.id].last === 0), ...pool.filter(q => S.q[q.id] && S.q[q.id].last === 1)];
  const title = los ? "K3 · " + los.map(l => K3_NAME[l] || l).join("·") : `K3 계산 문제${arg ? ` · ${arg}장` : ""}`;
  newSession("practice", title, order.map(q => q.id), { kind: "k3", arg: arg || 0 });
}
function startWrong(ch) {
  const ids = Object.keys(S.wrong).filter(id => QBY[id] && (!ch || QBY[id].ch === ch)).sort((a, b) => S.wrong[a].t - S.wrong[b].t);
  if (!ids.length) return go("wrong");
  newSession("practice", "오답노트 복습", ids, { kind: "wrong", arg: 0 });

function startWeak() {
  // 이미 손댄 장 안에서만 고른다. 안 배운 장 문제가 쏟아지면 오답노트만 차고 자신감이 떨어져서.
  const started = new Set(QS.filter(q => S.q[q.id]).map(q => q.ch));
  const scope = started.size && started.size < CHS.length ? started : null;
  const ls = loStats(); const weight = {};
  for (const [los, n] of BP) for (const lo of los) weight[lo] = n / los.length;
  const scored = Object.entries(ls).filter(([, s]) => !scope || scope.has(s.ch)).map(([lo, s]) => {
    const acc = s.n ? s.c / s.n : 0.35;
    return { lo, score: (1 - acc) * (0.6 + (weight[lo] || 0)) + Math.random() * 0.15 };
  }).sort((a, b) => b.score - a.score);
  const ids = [];
  for (const { lo } of scored) {
    const cand = QS.filter(q => q.lo === lo && !q.hard && !ids.includes(q.id));
    const pref = cand.filter(q => !S.q[q.id] || S.q[q.id].last === 0);
    ids.push(...pick(pref.length ? pref : cand, 2).map(q => q.id));
    if (ids.length >= 10) break;
  }
  if (ids.length < 10) {
    const rest = QS.filter(q => !q.hard && !ids.includes(q.id) && (!scope || scope.has(q.ch)));
    ids.push(...pick(rest, 10 - ids.length).map(q => q.id));
  }
  newSession("practice", scope ? `약점 공략 · ${[...scope].sort().join("·")}장` : "약점 공략", ids.slice(0, 10), { kind: "weak", arg: 0 });
}
// 실전 난이도 문제를 먼저, 그중에서도 모의고사에 안 나온 문제를 먼저 뽑는다. 모자라면 기본 문제로 채운다.
function buildMock() {
  const seen = new Set(S.mockSeen); const ids = [];
  // 연습에서 이미 푼 문제도 모의고사에 나온 문제처럼 뒤로 미룬다(미리 본 문제로 점수가 부풀지 않게)
  // 연습에서 푼 문제(+3)보다 모의고사에 이미 나온 문제(+6)를 더 뒤로 민다.
  // 계획대로 기본 문제를 다 풀고 모의고사를 3번 봐도 회차끼리 겹치지 않게 하려는 것.
  const rank = q => (q.hard ? 0 : 2) + (S.q[q.id] ? 3 : 0) + (seen.has(q.id) ? 6 : 0) + Math.random() * 0.5;
  const take = (pool, n) => pool.filter(q => !ids.includes(q.id)).map(q => ({ q, r: rank(q) })).sort((a, b) => a.r - b.r).slice(0, n).map(x => x.q);
  for (const [los, n] of BP) {
    const avail = los.filter(lo => QS.some(q => q.lo === lo));
    const out = [];
    if (n >= avail.length) {
      for (const lo of avail) out.push(...take(QS.filter(q => q.lo === lo && !out.includes(q)), 1));
      out.push(...take(QS.filter(q => avail.includes(q.lo) && !out.includes(q)), n - out.length));
    } else {
      // 쓸 만한 실전 문제가 남아 있는 LO부터 고른다(묶음 안에서는 LO가 겹치지 않게)
      const best = lo => Math.min(...QS.filter(q => q.lo === lo && !ids.includes(q.id)).map(rank));
      const los2 = avail.map(lo => ({ lo, b: best(lo) })).sort((a, b) => a.b - b.b).slice(0, n).map(x => x.lo);
      for (const lo of los2) out.push(...take(QS.filter(q => q.lo === lo), 1));
    }
    out.sort(byLo); ids.push(...out.map(q => q.id));
  }
  return ids;
}

function act(a, x) {

    case "k3": return startK3(n || 0);

  return `${d}일 ${String(h).padStart(2, "0")}시간 ${String(mi).padStart(2, "0")}분 남음`;
}

function taskRow(day, i, [label, a, x], showDay) {

}
function bindTasks(v) {

function bindSamples(v) {

function exportCode() { const o = Object.assign({}, S, { cur: null }); o.mocks = S.mocks.map(m => ({ t: m.t, score: m.score, byCh: m.byCh, dur: m.dur, n: m.n })); return "AUT1:" + btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function parseCode(code) {
  const m = code.replace(/\s/g, "").match(/^AUT1:([A-Za-z0-9+/=]+)$/);
  if (!m) throw new Error(code.trim().startsWith("CTFL1:") ? "CTFL 앱의 코드예요. 이 앱(CT-AuT)에서 복사한 AUT1: 코드를 붙여넣어 주세요." : "코드 형식이 달라요. AUT1: 로 시작하는 코드 전체를 붙여넣어 주세요.");

function mergeState(o) {
  for (const [id, r] of Object.entries(o.q || {})) if (!S.q[id] || (r.t || 0) > (S.q[id].t || 0)) S.q[id] = r;
  for (const [id, w] of Object.entries(o.wrong || {})) {
    const r = S.q[id];
    // 오답이 된 뒤 다른 쪽 기기에서 두 번 연속 맞혀 졸업한 문제는 다시 넣지 않음
    if (!S.wrong[id] && !(r && r.last === 1 && r.st >= 2 && (r.t || 0) > (w.t || 0))) S.wrong[id] = w;
  }
  S.grad = Math.max(S.grad || 0, o.grad || 0);
  const seenT = new Set(S.mocks.map(m => m.t));
  for (const m of o.mocks || []) if (!seenT.has(m.t)) S.mocks.push(m);
  S.mocks.sort((a, b) => a.t - b.t);
  for (const [k, val] of Object.entries(o.plan || {})) if (val) S.plan[k] = true;
  for (const [k, val] of Object.entries(o.cards || {})) if (S.cards[k] === undefined || val === 1) S.cards[k] = val;
  S.mockSeen = Array.from(new Set([...(S.mockSeen || []), ...(o.mockSeen || [])]));
  for (const [k, val] of Object.entries(o.samples || {})) if (val != null && S.samples[k] == null) S.samples[k] = val;
  Object.assign(S.reports, o.reports || {});

}

function paceBudget(cur, i) {
  // 공식 구조표 예상 시간(K1·K2 1분, K3 3분, 합 54분)을 60분에 비례 배분
  let t = 0; for (let j = 0; j < i; j++) t += QBY[cur.ids[j]].k === 3 ? 3 : 1;
  return t * 60 / 54 * 60000;
}
// 실무자가 회사 방식대로 고르면 틀리는 지점. 문제에 trap 이 있을 때만 그린다.

function tableHtml(t) {

}
// 채점된 보기: 정답·내 선택은 해설을 펼치고, 나머지 보기 해설은 접어 둔다
function gradedOpts(q, sel, perm) {
  const row = (oi, pos) => {
    const mine = sel.includes(oi), right = q.ans.includes(oi);
    const cls = right ? "right" : mine ? "wrong" : "";
    const tag = right ? `<span class="tag ok">정답${mine ? " · 내 선택" : ""}</span>` : mine ? `<span class="tag bad">내 선택</span>` : "";
    const why = right || mine ? `<span class="why">${fmt(q.why[oi])}</span>` : "";
    return `<div class="opt ${cls}"><span class="lt">${LETTERS[pos]}</span><span>${fmt(q.opts[oi])}</span>${tag}${why}</div>`;
  };
  const rest = perm.map((oi, pos) => ({ oi, pos })).filter(({ oi }) => !q.ans.includes(oi) && !sel.includes(oi));
  return `<div class="opts">${perm.map(row).join("")}</div>${rest.length ? `<details class="others"><summary><span class="small">나머지 보기는 왜 틀렸나요</span></summary>${rest.map(({ oi, pos }) => `<div class="opt"><span class="lt">${LETTERS[pos]}</span><span class="why">${fmt(q.why[oi])}</span></div>`).join("")}</details>` : ""}`;
}
function vQuiz(v) {
  const cur = S.cur; if (!cur) return go("practice");

  if (mock && cur.limit - (Date.now() - cur.start) <= 0) return submitMock(true);
  const id = cur.ids[cur.i], q = QBY[id], perm = cur.perm[id];
  const sel = cur.sel[id] || [], checked = !!cur.checked[id];
  const need = q.ans.length;
  const ok = checked && same(sel, q.ans);
  if (!mock) { cur.qt = cur.qt || {}; if (!cur.qt[id]) { cur.qt[id] = { s: Date.now() }; save(); } }
  const answered = cur.ids.filter(x => (cur.sel[x] || []).length === QBY[x].ans.length).length;
  v.innerHTML = `
  <div class="quiz-top"><div class="bar1"><button class="btn ghost" id="qx">나가기</button>
    ${mock ? `<button class="prog-btn" id="qnav" aria-haspopup="dialog" aria-label="${cur.ids.length}문제 중 ${cur.i + 1}번, 문제 목록 열기">${cur.i + 1} / ${cur.ids.length} ▾</button>` : `<span class="prog" aria-label="${cur.ids.length}문제 중 ${cur.i + 1}번">${cur.i + 1} / ${cur.ids.length}</span>`}
    ${mock ? `<span class="timer" id="tm" role="timer" aria-label="남은 시간">--:--</span>` : `<span class="sw" id="sw"></span>`}</div>
    <div class="qprog" aria-hidden="true"><i style="width:${(mock ? answered : cur.i + (checked ? 1 : 0)) / cur.ids.length * 100}%"></i></div></div>
  <article class="card stack qcard"><div class="q-stem">
    ${mock ? (cur.flags[id] ? '<div class="chips"><span class="chip k3">다시 보기 표시</span></div>' : "")
      : `<div class="chips"><span class="chip">${q.ch}장</span><span class="chip mono">${esc(q.lo)}</span><span class="chip ${q.k === 3 ? "k3" : ""}">K${q.k}</span>${q.hard ? '<span class="chip hard">실전</span>' : ""}<span class="small muted">${esc(cur.title)}</span></div>`}
    <div class="qtext">${fmt(q.q)}${need === 2 ? ' <span class="pick2">(두 개를 고르시오)</span>' : ""}</div>
    ${q.table ? tableHtml(q.table) : ""}
    ${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ""}
    </div><div class="q-body">
    ${checked ? `<div class="verdict ${ok ? "ok" : "bad"}" id="verdict">${ok ? "정답이에요" : `오답이에요. 정답은 ${q.ans.map(a => LETTERS[perm.indexOf(a)]).join(", ")}`}</div>${gradedOpts(q, sel, perm)}
      <div class="exp"><b>해설</b>${fmtP(q.exp)}<div class="src">근거: 실라버스 ${esc(q.ref)}</div></div>${trapHtml(q)}${reportBtn(id)}`
    : `<div class="opts" role="group" aria-label="보기">${perm.map((oi, pos) => `<button class="opt ${sel.includes(oi) ? "sel" : ""}" data-oi="${oi}" aria-pressed="${sel.includes(oi)}"><span class="lt">${LETTERS[pos]}</span><span>${fmt(q.opts[oi])}</span></button>`).join("")}</div>`}
  </div></article>`;
  const last = cur.i === cur.ids.length - 1;
  let barHtml;
  if (mock) {
    barHtml = `<button class="btn narrow" id="qprev" ${cur.i === 0 ? "disabled" : ""}>이전</button>
      <button class="btn narrow" id="qflag" aria-pressed="${!!cur.flags[id]}">${cur.flags[id] ? "표시 해제" : "다시 보기"}</button>
      ${last ? `<button class="btn primary" id="qsubmit">제출하기</button>` : `<button class="btn primary" id="qnext">다음</button>`}`;
  } else {
    const keyTxt = q.ans.map(a => LETTERS[perm.indexOf(a)]).join(", ");
    barHtml = `${checked ? `<span class="ab-verdict ${ok ? "ok" : "bad"}">${ok ? "정답" : `오답 · 정답 ${keyTxt}`}</span><button class="btn narrow" id="qexp">해설</button>` : `<button class="btn narrow" id="qprev" ${cur.i === 0 ? "disabled" : ""}>이전</button>`}
      ${checked ? (last ? `<button class="btn primary" id="qend">결과 보기</button>` : `<button class="btn primary" id="qnext">다음 문제</button>`)
        : `<button class="btn primary" id="qcheck" ${sel.length === need ? "" : "disabled"}>${sel.length === need ? "정답 확인" : need === 2 ? "보기 두 개를 고르세요" : "보기를 고르세요"}</button>`}`;
  }
  $("#bar").innerHTML = `<div class="actionbar"><div class="in">${barHtml}</div></div>`;

  v.querySelectorAll("button.opt[data-oi]").forEach(b => b.onclick = () => {
    if (cur.checked[id]) return;
    const oi = +b.dataset.oi; let s = (cur.sel[id] || []).slice();
    if (need === 1) s = [oi];
    else if (s.includes(oi)) s = s.filter(x => x !== oi);
    else { s.push(oi); if (s.length > 2) s.shift(); }
    cur.sel[id] = s; save(); renderQuizKeepFocus();
  });
  $("#qx").onclick = () => quitQuiz();
  const prev = $("#qprev"); if (prev) prev.onclick = () => { cur.i--; save(); go("quiz"); };
  const next = $("#qnext"); if (next) next.onclick = () => { cur.i++; save(); go("quiz"); };
  const chk = $("#qcheck"); if (chk) chk.onclick = () => {
    cur.checked[id] = true; cur.qt[id].e = Date.now();
    const good = same(cur.sel[id], q.ans); record(id, good); save();
    render(); const vb = $("#verdict"); if (vb) { vb.tabIndex = -1; vb.scrollIntoView({ behavior: smooth(), block: "start" }); vb.focus({ preventScroll: true }); }
    announce(good ? "정답이에요" : `오답이에요. 정답은 ${q.ans.map(a => LETTERS[perm.indexOf(a)]).join(", ")}`);
  };
  const end = $("#qend"); if (end) end.onclick = () => finishPractice();
  const ex = $("#qexp"); if (ex) ex.onclick = () => { const e = v.querySelector(".exp"); if (e) e.scrollIntoView({ behavior: smooth(), block: "start" }); };
  if (mock) {
    $("#qflag").onclick = () => { cur.flags[id] = !cur.flags[id]; save(); renderQuizKeepFocus(); };
    const sub = $("#qsubmit"); if (sub) sub.onclick = () => openNav(true);
    $("#qnav").onclick = () => openNav(false);
    const upd = () => {
      const left = cur.limit - (Date.now() - cur.start);
      if (left <= 0) { submitMock(true); return; }
      const diff = Math.round((paceBudget(cur, cur.i) - (Date.now() - cur.start)) / 60000);
      const tm = $("#tm"); if (tm) { tm.textContent = mmss(left); tm.classList.toggle("low", left < 600000); tm.classList.toggle("behind", diff <= -1 && left >= 600000); }
      const p = $("#pace"); if (p) p.textContent = diff >= 1 ? `페이스: 예정보다 ${diff}분 여유` : diff <= -1 ? `페이스: 예정보다 ${-diff}분 늦음` : "페이스: 예정대로";
    };
    upd(); tick = setInterval(upd, 1000);
  } else {
    // 공식 구조표 기준 문제당 예상 시간: K1·K2 1분, K3 3분
    const target = q.k === 3 ? 180 : 60, t = cur.qt[id];
    const sw = () => {
      const sec = Math.floor(((t.e || Date.now()) - t.s) / 1000), el = $("#sw"); if (!el) return;
      const shown = sec >= 900 ? "15:00+" : `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
      el.textContent = `${shown} / 목표 ${target / 60}분`; el.classList.toggle("over", sec > target);
    };
    sw(); if (!t.e) tick = setInterval(sw, 1000);
  }
}
function renderQuizKeepFocus() {
  const y = window.scrollY, ae = document.activeElement, oi = ae && ae.dataset ? ae.dataset.oi : null, aid = ae ? ae.id : null;
  render(); window.scrollTo(0, y);
  const el = oi != null ? document.querySelector(`[data-oi="${oi}"]`) : aid ? document.getElementById(aid) : null;
  if (el) el.focus({ preventScroll: true });
}
function quitQuiz() {
  const cur = S.cur;
  if (cur.mode === "mock") {
    return openSheet("모의고사를 어떻게 할까요?", `<p class="small muted">남은 시간 ${mmss(cur.limit - (Date.now() - cur.start))}. 나가 있어도 시간은 계속 흘러요.</p>`, [
      { label: "계속 풀기", cls: "primary" },
      { label: "나중에 이어 풀기", fn: () => go("home") },
      { label: "지금 제출하고 채점", fn: () => submitMock(false) },
      { label: "그만두기 (기록 안 남김)", cls: "danger", fn: () => { S.cur = null; save(); go("practice"); } }
    ]);
  }
  if (Object.keys(cur.checked).length) finishPractice(); else { S.cur = null; save(); go("practice"); }
}
function finishPractice() {
  const cur = S.cur; const done = cur.ids.filter(id => cur.checked[id]);
  const right = done.filter(id => same(cur.sel[id], QBY[id].ans));
  const need = { chapter: Math.min(15, cur.ids.length), k3: Math.min(8, cur.ids.length), wrong: 1, weak: 1, hard: 1 }[cur.kind];
  if (need && done.length >= need) autoDone(cur.kind, cur.arg);
  S.cur = null; save();
  go("summary", { title: cur.title, done, right });
}
function openNav(submitting) {
  const cur = S.cur;
  const st = id => { const n = (cur.sel[id] || []).length; return n === QBY[id].ans.length ? "ans" : n ? "part" : ""; };
  const answered = cur.ids.filter(id => st(id) === "ans").length;
  const flagged = cur.ids.filter(id => cur.flags[id]).length;
  openSheet(submitting ? "제출할까요?" : "문제 목록", `
    <p class="small muted">답한 문제 ${answered}/${cur.ids.length} · 다시 보기 ${flagged}개${answered < cur.ids.length ? ` · <b>안 푼 문제 ${cur.ids.length - answered}개</b>` : ""}</p>
    <p class="pace" id="pace"></p>
    <div class="legend"><span>파란 칸 = 답함</span><span>점선 = 두 개 중 하나만 고름</span><span>! = 다시 보기</span></div>
    <div class="navgrid">${cur.ids.map((id, i) => { const s = st(id), f = !!cur.flags[id]; return `<button data-i="${i}" class="${s} ${f ? "flag" : ""} ${i === cur.i ? "cur" : ""}" aria-label="${i + 1}번, ${s === "ans" ? "답함" : s ? "일부만 답함" : "안 품"}${f ? ", 다시 보기" : ""}"${i === cur.i ? ' aria-current="true"' : ""}>${i + 1}</button>`; }).join("")}</div>`,
    submitting ? [{ label: "제출하고 채점하기", cls: "primary", fn: () => submitMock(false) }, { label: "더 풀기" }] : [{ label: "제출하기…", fn: () => openNav(true) }],
    panel => panel.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { cur.i = +b.dataset.i; save(); closeSheet(true); go("quiz"); }));
}
function submitMock(timeout) {
  const cur = S.cur; if (!cur || cur.mode !== "mock") return;
  const byCh = {}; let score = 0, blank = 0;
  for (const id of cur.ids) {
    const q = QBY[id]; const s = cur.sel[id] || []; const ok = same(s, q.ans);
    // 안 고른 문제는 점수에서만 틀린 것으로 친다. 정답률·오답노트에는 넣지 않음.
    if (s.length) record(id, ok); else blank++;
    if (ok) score++;
    const b = byCh[q.ch] || (byCh[q.ch] = [0, 0]); b[1]++; if (ok) b[0]++;
  }
  const dur = Math.min(Date.now() - cur.start, cur.limit);
  S.mocks.push({ t: Date.now(), score, byCh, dur, n: cur.ids.length, blank, timeout: !!timeout, ids: cur.ids, sel: cur.sel, perm: cur.perm });
  S.mockSeen = Array.from(new Set([...S.mockSeen, ...cur.ids]));
  S.cur = null; autoDone("mock", 0); save();
  go("result", S.mocks.length - 1);
}

/* ---------- 결과 ---------- */
function reportBtn(id) {
  return `<button class="btn ghost small report" data-report="${esc(id)}">${S.reports[id] ? "신고함 (누르면 취소)" : "이 문제가 이상해요"}</button>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-report]"); if (!b) return;
  const id = b.dataset.report;
  if (S.reports[id]) delete S.reports[id]; else S.reports[id] = Date.now();
  save(); b.textContent = S.reports[id] ? "신고함 (누르면 취소)" : "이 문제가 이상해요";
});
function qChips(q) {
  return `<span class="chip">${q.ch}장</span><span class="chip mono">${esc(q.lo)}</span><span class="chip ${q.k === 3 ? "k3" : ""}">K${q.k}</span>${q.hard ? '<span class="chip hard">실전</span>' : ""}`;
}
// bare: 오답노트처럼 바깥 제목줄이 문제 본문과 칩을 이미 보여 줄 때
function reviewCard(q, sel, perm, label, opts = {}) {
  const ok = same(sel, q.ans);
  const keyTxt = q.ans.map(a => LETTERS[perm.indexOf(a)]).join(", ");
  const verdict = opts.read ? "" : `<div class="verdict ${ok ? "ok" : "bad"}">${ok ? "맞힌 문제" : sel.length ? `틀린 문제 · 정답 ${keyTxt}` : `안 푼 문제 · 정답 ${keyTxt}`}</div>`;
  return `<article class="${opts.bare ? "" : "flat "}stack" style="margin-top:8px">
    ${opts.bare ? "" : `<div class="chips">${label ? `<span class="chip mono">${esc(label)}</span>` : ""}${qChips(q)}</div>`}
    ${opts.bare ? "" : `<div class="qtext">${fmt(q.q)}${q.ans.length === 2 ? ' <span class="pick2">(두 개를 고르시오)</span>' : ""}</div>`}
    ${q.table ? tableHtml(q.table) : ""}${q.code ? `<pre class="code">${esc(q.code)}</pre>` : ""}
    ${verdict}${gradedOpts(q, sel, perm)}
    <div class="exp"><b>해설</b>${fmtP(q.exp)}<div class="src">근거: 실라버스 ${esc(q.ref)}</div></div>${trapHtml(q)}${reportBtn(q.id)}</article>`;
}
function vResult(v) {
  const r = S.mocks[route.p]; if (!r || !r.ids) return go("practice");
  const pass = r.score >= PASS;
  const mm = Math.floor(r.dur / 60000), ss = Math.floor(r.dur % 60000 / 1000);
  const wrongIdx = r.ids.map((id, i) => i).filter(i => !same(r.sel[r.ids[i]] || [], QBY[r.ids[i]].ans));
  v.innerHTML = `
  <section class="card stack" style="text-align:center;justify-items:center">
    <span class="eyebrow">실전 모의고사 결과 · ${new Date(r.t).toLocaleDateString("ko-KR")}</span>
    <h1 class="score ${pass ? "pass" : "fail"}">${r.score}<span class="muted" style="font-size:1.4rem"> / ${r.n || r.ids.length}</span></h1>
    <div class="chip ${pass ? "ok" : "bad"}">${pass ? `합격선(26) 통과${r.score >= GOAL ? " · 목표 30 달성" : ""}` : `합격선까지 ${PASS - r.score}문제 부족`}</div>
    <div class="muted small mono">걸린 시간 ${mm}분 ${String(ss).padStart(2, "0")}초${r.timeout ? " · 시간 종료로 자동 제출" : ""}${r.blank ? ` · 안 푼 문제 ${r.blank}개` : ""}</div>
  </section>

    <div class="chres">${Object.keys(r.byCh).map(Number).sort().map(ch => { const [c, n] = r.byCh[ch]; return `<span class="mono">${ch}장</span><span class="bar"><i style="width:${c / n * 100}%;background:${accColor(c / n)}"></i></span><span class="mono">${c}/${n}</span>`; }).join("")}</div>
    <p class="small muted">빨간 장(65% 미만)부터 개념 노트를 다시 보세요. 틀린 문제는 오답노트에 들어갔어요(안 푼 문제는 제외).</p>
  </section>
  <section class="card stack"><h2>문제별 해설</h2>

    <div class="navgrid">${r.ids.map((id, i) => { const ok = same(r.sel[id] || [], QBY[id].ans), none = !(r.sel[id] || []).length; return `<button data-i="${i}" class="${ok ? "r-ok" : "r-bad"}" aria-label="${i + 1}번 ${ok ? "정답" : none ? "안 품" : "오답"}">${i + 1}<span class="mk" aria-hidden="true">${ok ? "○" : "✕"}</span></button>`; }).join("")}</div>
    ${wrongIdx.length ? `<button class="btn" id="allwrong">틀린 문제 ${wrongIdx.length}개 모두 펼치기</button>` : ""}
    <div id="rv"></div></section>
  <div class="row"><button class="btn primary" data-act="wrong">오답노트 풀기</button><button class="btn" data-go>홈으로</button></div>`;
  bindActs(v); v.querySelector("[data-go]").onclick = () => go("home");
  const show = idxs => { $("#rv").innerHTML = idxs.map(i => reviewCard(QBY[r.ids[i]], r.sel[r.ids[i]] || [], r.perm[r.ids[i]], `${i + 1}번`)).join(""); $("#rv").scrollIntoView({ behavior: smooth(), block: "start" }); };
  v.querySelectorAll("[data-i]").forEach(b => b.onclick = () => show([+b.dataset.i]));

/* ---------- 오답노트 ---------- */
let wrongCh = 0, wrongRead = false;
function wrongItem(id) {
  const q = QBY[id];
  return `<details class="list-q"><summary><div class="chips">${qChips(q)}${S.wrong[id] && S.wrong[id].st ? '<span class="chip ok">1번 맞힘</span>' : ""}</div><div class="t">${plain(q.q)}</div></summary>
    ${reviewCard(q, [], q.opts.map((_, i) => i), "", { read: true, bare: true })}</details>`;
}
function vWrong(v) {
  const all = Object.keys(S.wrong).filter(id => QBY[id]);
  const ids = all.filter(id => !wrongCh || QBY[id].ch === wrongCh).sort((a, b) => S.wrong[b].t - S.wrong[a].t);

  ${all.length ? `<div class="seg" aria-label="장 필터"><button aria-pressed="${!wrongCh}" data-wc="0">전체 ${all.length}</button>${CHS.map(c => { const n = all.filter(id => QBY[id].ch === c).length; return n ? `<button aria-pressed="${wrongCh === c}" data-wc="${c}">${c}장 ${n}</button>` : ""; }).join("")}</div>
    <button class="btn primary block" id="wgo">${ids.length}문제 다시 풀기</button>

    : `<div class="card empty"><b>오답노트가 비어 있어요</b><p>문제를 풀다 틀리면 여기에 모여요.</p><button class="btn primary" data-act="weak">약점 공략 10문제</button></div>`}
  ${Object.keys(S.reports).length ? `<section class="card stack"><h2>이상하다고 표시한 문제 ${Object.keys(S.reports).length}개</h2>
    <p class="small muted">목록을 복사해서 앱을 만든 사람에게 보내주세요. 확인해서 고칠게요.</p>
    <div class="chips">${Object.keys(S.reports).map(id => `<span class="chip mono">${esc(id)}</span>`).join("")}</div>
    <button class="btn" id="rpcopy">목록 복사</button><textarea id="rpta" rows="3" hidden readonly aria-label="신고 목록"></textarea></section>` : ""}`;
  bindActs(v);
  v.querySelectorAll("[data-wc]").forEach(b => b.onclick = () => { wrongCh = +b.dataset.wc; renderKeepScroll(); });
  const wg = $("#wgo"); if (wg) wg.onclick = () => startWrong(wrongCh);
  const rc = $("#rpcopy"); if (rc) rc.onclick = () => copyText("CT-AuT 이상한 문제: " + Object.keys(S.reports).join(", "), $("#rpta"), rc);
  if (wrongRead) { wrongRead = false; autoDone("wrongread", 0); }
}

/* ---------- 용어 카드 ---------- */
let cardSet = "0", cardIdx = 0, cardFlip = false, cardOnlyUnknown = false;
function cardChs() { return cardSet === "0" ? CHS : cardSet.split(",").map(Number); }
function cardAll() { const out = []; for (const ch of cardChs()) for (const k of (NOTES[ch]?.keywords || [])) out.push({ ...k, ch, key: `${ch}:${k.en}` }); return out; }
function cardList() { const l = cardAll(); return cardOnlyUnknown ? l.filter(k => S.cards[k.key] !== 1) : l; }
function vCards(v) {
  const list = cardList(); if (cardIdx >= list.length) cardIdx = 0;
  const c = list[cardIdx], all = cardAll();
  const known = all.filter(k => S.cards[k.key] === 1).length;
  v.innerHTML = `<header class="note-head"><h1 class="page-title">용어 카드</h1>
    <p class="lead">실라버스 각 장의 키워드예요. 정의가 그대로 K1 문제로 나올 수 있어요. 카드를 누르면 뒤집혀요.</p></header>
  <div class="seg" aria-label="장 선택"><button aria-pressed="${cardSet === "0"}" data-c="0">전체</button>${CHS.map(ch => `<button aria-pressed="${cardSet === String(ch)}" data-c="${ch}">${ch}장</button>`).join("")}${cardSet.includes(",") ? `<button aria-pressed="true" data-c="${cardSet}">${cardSet.replace(",", "·")}장</button>` : ""}</div>
  <div class="row spread"><span class="muted small">외운 용어 ${known}/${all.length}</span>
    <label class="row small toggle" style="gap:6px;min-height:44px;padding-inline:6px"><input type="checkbox" id="onlyu" ${cardOnlyUnknown ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--pen);margin:0"> 모르는 것만</label></div>
  ${c ? `<button class="flash" id="flash" aria-pressed="${cardFlip}">${cardFlip
      ? `<div class="def"><div class="eyebrow" style="margin-bottom:8px">${c.ch}장 · ${esc(c.ko)}</div>${fmt(c.def)}</div>`
      : `<div><div class="term">${esc(c.ko)}</div><div class="en" lang="en">${esc(c.en)}</div><div class="muted small" style="margin-top:14px">눌러서 뜻 보기</div></div>`}</button>
    <div class="row spread"><span class="mono muted small">${cardIdx + 1} / ${list.length}</span>${S.cards[c.key] === 1 ? '<span class="chip ok">외움</span>' : S.cards[c.key] === 0 ? '<span class="chip bad">모름</span>' : ""}</div>
    <div class="row"><button class="btn" id="cprev" style="flex:1">이전</button><button class="btn danger" id="cno" style="flex:1">모르겠어요</button><button class="btn primary" id="cyes" style="flex:1">알아요</button></div>`
    : `<div class="card empty"><b>${cardOnlyUnknown ? "모르는 용어가 없어요" : cardChs().length === 1 && cardChs()[0] === 1 ? "1장은 실라버스에 키워드가 없어요" : "용어가 없어요"}</b></div>`}`;
  v.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { cardSet = b.dataset.c; cardIdx = 0; cardFlip = false; render(); });
  $("#onlyu").onchange = e => { cardOnlyUnknown = e.target.checked; cardIdx = 0; cardFlip = false; render(); };
  if (!c) return;
  const refocus = () => { const f = $("#flash"); if (f) f.focus({ preventScroll: true }); };
  const rated = () => { if (cardAll().every(k => S.cards[k.key] !== undefined)) autoDone("cards", cardSet); };
  $("#flash").onclick = () => { cardFlip = !cardFlip; render(); refocus(); };
  const step = d => { const n = cardList().length; cardIdx = n ? (cardIdx + d + n) % n : 0; cardFlip = false; render(); refocus(); };
  $("#cprev").onclick = () => step(-1);
  $("#cyes").onclick = () => { S.cards[c.key] = 1; save(); rated(); if (cardOnlyUnknown) { cardFlip = false; render(); refocus(); } else step(1); };
  $("#cno").onclick = () => { S.cards[c.key] = 0; save(); rated(); step(1); };
}

/* ---------- 시작 ---------- */
function start(data) {
  applyFs();
  if (data && data.route && data.route.name !== "quiz") route = data.route;
  render();
}
window.claude?.hot?.snapshot?.(() => ({ route: { name: route.name, p: ["note", "result"].includes(route.name) ? route.p : null } }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body></html>
