 충분하지 않고 외부 파트너·공급업체도 포함된다는 내용은 같다.)","why":["정답. 2.2.1.2 첫 문장의 내용이다.","실라버스는 자기 조직 프로세스만 보는 것으로는 충분하지 않다고 한다.","실라버스는 외부 파트너와 공급업체도 포함된다고 명시한다.","모든 참여자가 자기 일이 최종 제품의 안전에 주는 영향을 이해해야 한다."],"ref":"2.2.1.2"},{"id":"c2-106","ch":2,"lo":"AuT-2.2.1.2","k":1,"q":"안전 문화(safety culture) 관점에서 개발 참여자의 책임에 대한 설명으로 맞는 것은?","opts":["각자의 행동은 다른 프로세스와 독립적으로 일어나므로, 자기 단계의 결과만 책임지면 된다.","안전 관련 요구사항의 구현은 개발자의 몫이고, 테스트 단계는 이 요구사항의 준수에 기여하지 않는다.","개발의 각 단계는 안전 관련 요구사항을 지키고 구현하는 데 꼭 필요한 기여를 하며, 이 책임은 시장 출시(market launch)로 끝나지 않는다.","참여자의 책임은 release for production 시점에 끝나고, 그 뒤는 생산 조직이 맡는다."],"ans":[2],"exp":"2.2.1.2: 참여자는 자기 행동이 다른 프로세스와 독립적으로 일어나지 않는다는 점을 이해해야 한다. 개발의 각 단계는 안전 관련 요구사항의 준수와 구현에 꼭 필요한 기여를 한다. 이 책임은 시장 출시로 끝나지 않고 safety lifecycle(안전 수명주기)이 끝날 때까지 이어진다. (v2.1 기준. 2018년판에서는 책임이 system lifecycle 끝까지 이어진다고 적었다. 출시로 끝나지 않는다는 내용은 같다.)","why":["실라버스는 자기 행동이 다른 프로세스와 독립적으로 일어나지 않는다고 한다.","개발의 각 단계가 안전 관련 요구사항의 준수와 구현에 기여한다.","정답. 2.2.1.2의 설명 그대로다.","책임은 출시 뒤에도 safety lifecycle 끝까지 이어진다. release for production은 2단계(product development)의 끝일 뿐이다(2.2.2)."],"ref":"2.2.1.2"},{"id":"c2-107","ch":2,"lo":"AuT-2.2.1.2","k":1,"q":"실라버스에 따르면 테스터는 어떤 방식으로 안전 문화(safety culture)에 기여하는가?","opts":["안전 문화를 지키지 않은 참여자를 찾아 safety manager에게 보고하는 감사 역할을 맡는다.","기능 안전 관련 테스트를 개발 마지막에 몰아서 독립적으로 수행해, 다른 프로세스의 영향을 받지 않게 한다.","자기가 맡은 테스트 레벨의 결과에만 집중하고, 다른 단계의 작업 산출물은 해당 담당자에게 맡긴다.","소프트웨어 개발 수명주기 단계에 책임감 있게 참여하고, 제품 개발의 전체 맥락을 계속 염두에 두고 일한다."],"ans":[3],"exp":"2.2.1.2 마지막 문장: 테스터는 소프트웨어 개발 수명주기 단계에 책임감 있게 참여하고, 제품 개발의 전체 맥락을 계속 보면서 일하는 방식으로 안전 문화에 기여한다.","why":["실라버스는 테스터에게 이런 감사 역할을 주지 않는다.","실라버스는 참여자의 행동이 다른 프로세스와 독립적이지 않다고 한다. 개발 단계에 참여하는 것이 기여 방식이다.","실라버스는 제품 개발의 전체 맥락을 계속 보라고 한다.","정답. 2.2.1.2의 설명 그대로다."],"ref":"2.2.1.2"},{"id":"c2-108","ch":2,"lo":"AuT-2.2.2","k":2,"q":"양산 중인 차량의 소프트웨어를 고쳐야 하는 변경이 생겼다. 제품은 ISO 26262 safety lifecycle(안전 수명주기)의 3단계(production, operation, service and decommissioning)에 있다.\n실라버스에 따르면 이 변경은 어떻게 처리되는가?","opts":["3단계 안에서 처리되는 변경이므로 테스터는 관여하지 않는다.","변경 범위에 따라 1단계(concept phase)나 2단계(product development)로 돌아가며, 테스터도 이 변경 작업에 참여한다.","변경 범위와 관계없이 모든 변경은 1단계(concept phase)부터 다시 시작한다.","release for production 이후의 변경이므로 safety lifecycle 밖에서 일반 유지보수로 처리한다."],"ans":[1],"exp":"2.2.2: 테스터는 주로 1단계와 2단계에서 일한다. 3단계에서 제품을 바꾸면 변경 범위에 따라 1단계나 2단계로 돌아간다. 그래서 테스터도 이런 변경 작업에 참여한다. (v2.1 기준 단계 이름. 2018년판은 Product concept / Product development / Product production and maintenance라고 불렀다. 변경 시 1·2단계로 돌아간다는 내용은 같다.)","why":["실라버스는 3단계의 변경 때문에 테스터도 변경 작업에 참여한다고 한다.","정답. 2.2.2의 설명 그대로다.","돌아가는 단계는 변경 범위에 따라 1단계 또는 2단계다.","3단계도 safety lifecycle의 일부이고, 변경은 1·2단계로 돌아가서 처리된다."],"trap":"양산 뒤 소프트웨어 수정을 현장 대응이나 일반 유지보수 업무로만 보는 감각으로 고르면 틀린다. 실라버스는 3단계의 변경이 범위에 따라 1단계나 2단계로 돌아가고 테스터도 참여한다고 한다(2.2.2).","ref":"2.2.2"},{"id":"c2-109","ch":2,"lo":"AuT-2.2.2","k":2,"q":"ISO 26262 safety lifecycle(안전 수명주기)에서 테스트 계획(test planning)과 테스트 실행(test execution)이 이루어지는 시점으로 맞는 것은?","opts":["테스트 계획은 보통 concept phase에서, 테스트 실행은 주로 product development 하위 단계 사이의 전환 시점에 한다.","테스트 계획은 product development가 끝난 뒤 release for production 직전에 한 번에 작성한다.","테스트 실행은 주로 3단계에서 운행 중인 차량의 데이터로 한다.","테스트 계획서와 테스트 명세는 concept phase에서 확정되면 이후 단계에서 바꿀 수 없다."],"ans":[0],"exp":"2.2.2: 테스트 계획은 보통 concept phase에서 한다. 결과 문서(예: 테스트 계획서, 테스트 명세)는 어느 단계에서든 조정이 필요할 수 있다. 테스트 실행은 주로 product development의 하위 단계가 넘어가는 시점에 한다. 예를 들어 구현에서 소프트웨어 통합으로, 다시 하드웨어-소프트웨어 통합으로 넘어갈 때다.","why":["정답. 2.2.2의 설명 그대로다.","테스트 계획은 보통 concept phase에서 한다.","테스트 실행은 주로 product development 하위 단계 사이의 전환 시점에 한다. 테스터는 주로 1·2단계에서 일한다.","실라버스는 테스트 계획서나 테스트 명세의 조정이 어느 단계에서든 필요할 수 있다고 한다."],"ref":"2.2.2"},{"id":"c2-110","ch":2,"lo":"AuT-2.2.2","k":2,"q":"ISO 26262 safety lifecycle(안전 수명주기)이 다루는 범위에 대한 설명으로 맞는 것은?","opts":["안전 요구사항의 명세에서 시작해, 시스템 테스팅이 끝나면 마무리된다.","release for production에서 끝나며, 그 뒤의 생산과 운행은 safety lifecycle에 들어가지 않는다.","첫 제품 아이디어와 가능한 리스크의 식별에서 시작해, 수명이 다한 제품의 폐기로 끝난다.","제품 개발 단계만 다루며, concept phase는 safety lifecycle 이전의 사전 기획으로 본다."],"ans":[2],"exp":"2.2.2: safety lifecycle은 제품 개발 중의 안전 지향 활동을 설명한다. 첫 제품 아이디어와 가능한 리스크의 식별에서 시작하고, 안전 요구사항을 명세한 뒤 구체적인 제품으로 구현한다. 수명이 다한 제품의 폐기로 끝난다. 단계는 1단계 concept phase, 2단계 product development(release for production으로 끝남), 3단계 production, operation, service and decommissioning이다.","why":["시작점은 첫 제품 아이디어와 리스크 식별이고, 끝은 제품 폐기다.","release for production은 2단계의 끝이다. 3단계도 safety lifecycle에 들어간다.","정답. 2.2.2 첫 문단의 설명이다.","concept phase는 safety lifecycle의 1단계다."],"ref":"2.2.2"},{"id":"c2-111","ch":2,"lo":"AuT-2.2.2","k":2,"q":"ISO 26262 safety lifecycle(안전 수명주기)에서 테스터의 역할에 대한 설명으로 맞는 것을 두 개 고르시오.","opts":["테스터는 주로 3단계에서 일하며, 양산 차량에서 보고된 결함을 분석한다.","테스터는 주로 1단계(concept phase)와 2단계(product development)에서 일한다.","테스트 기법은 안전 관련 요구사항과 관계없이 테스트 레벨마다 미리 정해져 있다.","테스터는 안전 관련 요구사항의 베리피케이션(verification)만 맡고, 밸리데이션(validation)용 테스트 케이스는 설계하지 않는다.","테스터는 테스트 활동으로 3단계로 넘어가는 데 크게 기여한다."],"ans":[1,4],"exp":"2.2.2: 테스터는 주로 첫 두 단계에서 일한다. 안전 관련 요구사항을 바탕으로 테스트 기법을 고르고, 이 요구사항의 베리피케이션과 밸리데이션을 위한 테스트 케이스를 설계한다. 또 테스터는 테스트 활동으로 3단계로 넘어가는 데 크게 기여한다. (v2.1 기준 단계 이름. 2018년판은 1단계를 Product concept라고 불렀다. 테스터가 주로 1·2단계에서 일한다는 내용은 같다.)","why":["테스터는 주로 1·2단계에서 일한다. 3단계에서는 변경이 생길 때 1·2단계로 돌아가 참여한다.","정답. 2.2.2의 설명이다.","테스트 기법은 안전 관련 요구사항을 바탕으로 고른다.","테스트 케이스는 베리피케이션과 밸리데이션 둘 다를 위해 설계한다.","정답. 2.2.2 마지막 문장의 내용이다."],"ref":"2.2.2"},{"id":"c2-112","ch":2,"lo":"AuT-2.2.3.2","k":1,"q":"소프트웨어 테스터가 하드웨어 고유의 측면까지 다뤄야 할 때, 실라버스가 참고하라고 안내하는 ISO 26262의 부(part)는?","opts":["3부(concept phase)","9부(ASIL-oriented and safety-oriented analysis)","2부(management of functional safety)","5부(하드웨어 수준의 제품 개발)"],"ans":[3],"exp":"2.2.3.2: 하드웨어 고유의 측면이 테스터 업무와 관련되면 5부에서 찾는다. 시스템 수준은 4부, 소프트웨어 수준은 6부이고, 하드웨어와 소프트웨어에 함께 걸친 측면은 하드웨어-소프트웨어 인터페이스로 4~6부에서 다룬다.","why":["3부는 concept phase를 다룬다. 실라버스가 하드웨어 측면으로 안내하는 부가 아니다.","9부는 ASIL·안전 지향 분석을 다룬다. 하드웨어 측면은 5부다.","2부는 기능 안전 관리를 다룬다. 하드웨어 측면은 5부다.","정답. 2.2.3.2의 설명이다."],"ref":"2.2.3.2"},{"id":"c2-113","ch":2,"lo":"AuT-2.2.3.2","k":1,"q":"실라버스 2.2.3.2에서 ISO 26262 8부가 테스터에게 특별한 역할을 하는 이유로 맞는 것은?","opts":["모터사이클 프로젝트용으로 조정된 method table(메소드 테이블)을 담고 있기 때문이다.","모든 테스트 레벨에서 베리피케이션의 프로세스 관련 특성을 설명하고, 도구 qualification(qualification of tools) 같은 지원 프로세스 요구사항을 담고 있기 때문이다.","소프트웨어 수준의 제품 개발과 권장 소프트웨어 베리피케이션 조치를 자세히 다루기 때문이다.","ISO 26262 전체에서 쓰는 용어를 정의하기 때문이다."],"ans":[1],"exp":"2.2.3.2: 8부는 모든 테스트 레벨에서 베리피케이션의 프로세스 관련 특성을 설명하므로 특별한 역할을 한다. 또 표준화된 프로세스에 중요한 지원 프로세스 요구사항을 담는다. 예로 형상 관리(configuration management)와 도구 qualification을 든다. (v2.1 기준. 2018년판은 지원 프로세스 예로 형상 관리 대신 문서화(documentation)를 들었다. 도구 qualification은 두 판 모두 있다.)","why":["MSIL 기반으로 조정된 method table은 12부에 있다(2.2.3.2, v2.1 기준).","정답. 2.2.3.2의 설명이다.","권장 소프트웨어 베리피케이션 조치를 자세히 다루는 부는 4부와 6부이고, 소프트웨어 수준은 6부다.","용어(vocabulary)는 1부다."],"ref":"2.2.3.2"},{"id":"c2-114","ch":2,"lo":"AuT-2.2.3.2","k":1,"q":"실라버스에 따르면, safety validation을 포함해 시스템 수준의 테스트·베리피케이션 측면에 초점을 두는 ISO 26262의 부(part)는?","opts":["4부","6부","7부","3부"],"ans":[0],"exp":"2.2.3.2: 4부와 6부는 권장 소프트웨어 베리피케이션 조치(선정, 설계, 구현, 실행)에 대한 자세한 정보와 요구사항을 준다. 그중 4부는 시스템 수준(safety validation 포함), 6부는 소프트웨어 수준의 테스트·베리피케이션 측면에 초점을 둔다. (v2.1 기준 표현. 2018년판은 4부를 'including system validation'으로 설명했다. 시스템 수준이 4부라는 내용은 같다.)","why":["정답. 2.2.3.2의 설명이다.","6부는 소프트웨어 수준에 초점을 둔다.","7부는 생산 이후 단계(production, operation, service and decommissioning)를 다루며, 2.2.3.2가 드는 테스터 관련 부가 아니다.","3부는 concept phase를 다루며, 2.2.3.2가 드는 테스터 관련 부가 아니다."],"ref":"2.2.3.2"},{"id":"c2-115","ch":2,"lo":"AuT-2.2.4.1","k":1,"q":"HARA(hazard analysis and risk assessment) 결과, 어떤 요구사항이 ASIL A보다 낮게 나왔다. 실라버스에 따른 처리로 맞는 것은?","opts":["최소 등급인 ASIL A로 올려서 기능 안전 활동을 적용한다.","'ASIL 0'으로 표시하고 ASIL A와 같은 method table 권고를 따른다.","표준 기준으로 안전 관련이 아니므로 기능 안전 활동이 필요 없고, 기존 품질경영시스템(QMS)으로 다루면 충분하다.","안전 목표(safety goal)는 정하지 않지만, 안전 요구사항(safety requirement)으로 관리해 ASIL A 수준으로 테스트한다."],"ans":[2],"exp":"2.2.4.1: HARA 결과 요구사항이 ASIL A보다 낮으면, 표준 기준으로 안전 관련이 아니다. 기능 안전 관련 조치가 필요 없고, 이미 있는 품질경영시스템(QMS)으로 다루면 충분하다. 실무에서는 ASIL 요구사항과 구분하려고 흔히 'QM'으로 표시한다. (v2.1 기준. 2018년판도 ASIL A 미만은 안전 관련이 아니고 기존 품질경영(QM)으로 다룬다고 적었다. 'QM' 표시를 구분용 관행으로 설명한 문장은 v2.1에만 있다.)","why":["ASIL A 미만 요구사항은 기능 안전 조치가 필요 없다.","실라버스에 'ASIL 0' 같은 등급은 없다. ASIL은 A~D 네 단계이고, 그 미만은 흔히 'QM'으로 표시한다.","정답. 2.2.4.1의 설명이다.","ASIL A 미만은 안전 관련이 아니므로 기존 QMS로 다루면 된다."],"ref":"2.2.4.1"},{"id":"c2-116","ch":2,"lo":"AuT-2.2.4.1","k":1,"q":"프로젝트 초기에 ASIL이 정해지고 이어지는 흐름으로 맞는 것은?","opts":["테스터가 시스템 테스팅 결과를 보고 hazard마다 ASIL을 정하고, 그 뒤 안전 요구사항을 정의한다.","안전 목표(safety goal)는 바탕이 된 hazard보다 한 단계 높은 ASIL을 받아 여유를 둔다.","HARA는 개발이 끝난 뒤 수행하고, 그 결과로 이미 구현된 기능의 ASIL을 정한다.","전문가 팀이 HARA를 수행해 hazard마다 ASIL을 정하고, 이어서 정의하는 안전 목표와 안전 요구사항은 바탕이 된 hazard와 같은 ASIL을 가진다."],"ans":[3],"exp":"2.2.4.1: 프로젝트 초기에 전문가 팀이 제품에 대해 HARA(hazard analysis and risk assessment)를 수행한다. 찾아낸 hazard마다 표준에 정의된 방법론으로 ASIL을 정한다. 다음 단계에서 안전 목표와 안전 요구사항을 정의하며, 이들은 바탕이 된 hazard와 같은 ASIL을 가진다.","why":["ASIL은 프로젝트 초기에 전문가 팀이 HARA로 정한다. 테스트 결과로 정하지 않는다.","안전 목표와 안전 요구사항은 바탕이 된 hazard와 같은 ASIL을 가진다.","HARA는 프로젝트 초기에 수행한다.","정답. 2.2.4.1의 설명 그대로다."],"ref":"2.2.4.1"},{"id":"c2-117","ch":2,"lo":"AuT-2.2.4.1","k":1,"q":"ASIL에 대한 설명으로 맞는 것을 두 개 고르시오.","opts":["ISO 26262는 ASIL A(낮음)부터 ASIL D(높음)까지 네 단계를 정의한다.","ASIL은 개발 조직의 프로세스 역량을 심사(assessment)해 매기는 등급이다.","ASIL은 기능 안전 조치를 통해 필요한 리스크 감소 정도를 나타내는 척도다.","ASIL에 따른 조치에는 테스트만 들어가고, E/E 시스템을 감시하는 독립적인 안전 기능 같은 조치는 들어가지 않는다.","ASIL D 요구사항은 리스크가 가장 높으므로, 기능 안전 활동 대신 기존 품질경영시스템(QMS)으로 다룬다."],"ans":[0,2],"exp":"2.2.4.1: ASIL은 기능 안전 조치를 통해 필요한 리스크 감소의 척도다. 조치의 예로 E/E 시스템을 감시하는 독립적인 안전 기능이나 특정하게 정의된 방법의 구현을 든다. 리스크가 높을수록 더 정교한 조치가 필요할 수 있다. ISO 26262는 ASIL A(낮음)부터 ASIL D(높음)까지 네 단계를 정의한다.","why":["정답. 2.2.4.1의 설명이다.","프로세스 역량을 심사해 매기는 것은 ASPICE의 capability level이다(2.1). ASIL은 리스크 감소의 척도다.","정답. 2.2.4.1 첫 문장의 내용이다.","실라버스는 조치의 예로 E/E 시스템을 감시하는 독립적인 안전 기능을 든다.","기존 QMS로 충분한 것은 ASIL A 미만 요구사항이다. ASIL D는 가장 높은 안전 요구 수준이다."],"ref":"2.2.4.1"},{"id":"c2-118","ch":2,"lo":"AuT-2.2.4.2","k":2,"q":"한 ECU에 ASIL D 안전 요구사항, ASIL A 안전 요구사항, QM 요구사항이 함께 있다. 테스트 관리자가 테스트 범위(test scope)를 계획하려 한다.\n실라버스에 따른 판단으로 맞는 것은?","opts":["가장 높은 ASIL D를 제품 전체의 ASIL로 보고, 모든 요구사항을 ASIL D 기준으로 테스트한다.","ASIL은 제품 전체의 특성이 아니라 특정 안전 목표와 거기서 나온 안전 요구사항에 묶이므로, 요구사항마다 테스트 노력이 크게 다를 수 있음을 계획에 반영한다.","요구사항 ASIL의 중간인 ASIL B를 제품 ASIL로 정하고, 모든 요구사항에 ASIL B 권고를 적용한다.","가장 낮은 등급을 제품 ASIL로 보고 테스트 범위를 잡은 뒤, ASIL D 요구사항에만 리뷰를 추가한다."],"ans":[1],"exp":"2.2.4.2: ASIL은 제품 전체의 특성이 아니다. 특정 안전 목표(safety goal)와 거기서 나온 안전 요구사항에 묶인다. 그래서 같은 제품 안에서도 ASIL이 다른 안전 요구사항은 테스트 노력(test effort)이 크게 다를 수 있고, 테스터는 테스트 범위를 계획할 때 이를 고려해야 한다.","why":["ASIL은 제품 전체의 특성이 아니다. 제품 하나에 ASIL 하나를 붙이는 판단 자체가 실라버스와 맞지 않는다.","정답. 2.2.4.2 마지막 문단의 내용이다.","ASIL은 제품 전체의 특성이 아니므로, 제품 ASIL을 하나로 정하는 방식은 맞지 않는다.","ASIL은 제품 전체의 특성이 아니며, 요구사항별 ASIL에 따라 권고되는 조치가 달라진다."],"trap":"현업에서는 'ASIL D 제어기'처럼 제품 단위로 ASIL을 부르기도 한다. 하지만 실라버스는 ASIL이 제품 전체의 특성이 아니라 안전 목표와 거기서 나온 안전 요구사항에 묶인다고 한다(2.2.4.2).","ref":"2.2.4.2"},{"id":"c2-119","ch":2,"lo":"AuT-2.2.4.2","k":2,"q":"실라버스 2.2.4.2가 예로 든 동등 분할(equivalence partitioning)과 경계값 분석(boundary value analysis)의 ISO 26262 권고 수준으로 맞는 것은?","opts":["ASIL A에서는 recommended일 뿐이고, ASIL B 이상에서는 highly recommended다.","ASIL A부터 ASIL D까지 모두 highly recommended다.","ASIL A와 ASIL B에서는 recommended이고, ASIL C 이상에서 highly recommended다.","ASIL D에서만 highly recommended이고, 나머지 ASIL에서는 권고가 없다(no recommendation)."],"ans":[0],"exp":"2.2.4.2: 표준은 ASIL에 따라 특정 테스트 기법과 테스트 유형을 권고하고, 테스터는 표준이 허용하는 범위에서만 자유롭게 정할 수 있다. 그 예로 동등 분할과 경계값 분석은 ASIL A에서는 recommended일 뿐이지만, ASIL B 이상에서는 highly recommended라고 든다.","why":["정답. 2.2.4.2의 예 그대로다.","ASIL A에서는 recommended다.","ASIL B부터 highly recommended다.","ASIL A에서 recommended, ASIL B 이상에서 highly recommended다."],"ref":"2.2.4.2"},{"id":"c2-120","ch":2,"lo":"AuT-2.2.4.2","k":2,"q":"ISO 26262가 어떤 방법을 'no recommendation'으로 둔 경우에 대한 설명으로 맞는 것은?","opts":["표준이 사용을 금지한 방법이므로 쓰면 안 된다.","그 방법을 보조 조치로 쓰면, 같은 ASIL에서 recommended인 다른 조치를 생략할 수 있다.","다른 방법을 쓰지 않을 때 기본으로 반드시 적용해야 하는 방법이다.","표준이 사용을 권하지도 말리지도 않으므로 보조 조치로 문제없이 쓸 수 있지만, recommended나 highly recommended 조치를 대신하지는 못한다."],"ans":[3],"exp":"2.2.4.2: ISO 26262의 권고 수준은 no recommendation, recommended, highly recommended 세 가지다. no recommendation이면 표준은 그 조치를 쓰라고도 쓰지 말라고도 하지 않는다. 보조 조치로 문제없이 쓸 수 있지만, 그 실행이 recommended나 highly recommended 조치를 대신하지는 않는다.","why":["no recommendation은 금지가 아니다. 권하지도 말리지도 않는다는 뜻이다.","no recommendation 방법의 실행은 recommended나 highly recommended 조치를 대신하지 못한다.","표준은 이 방법에 대해 아무 권고도 하지 않는다. 반드시 적용할 방법이 아니다.","정답. 2.2.4.2의 설명 그대로다."],"ref":"2.2.4.2"},{"id":"c2-121","ch":2,"lo":"AuT-2.2.4.2","k":2,"q":"ISO 26262의 권고 수준과 ASIL이 테스트에 주는 영향에 대한 설명으로 맞는 것은?","opts":["highly recommended는 '가능하면 적용', recommended는 '반드시 적용'이라는 뜻이다.","ASIL이 높을수록 권고되는 조치가 줄고, ASIL이 낮을수록 조치가 더 상세해진다.","highly recommended인 방법은 적용해야 하고, recommended인 방법은 적용하는 것이 원칙이고, 적용하지 않으면 그 근거를 제시해야 한다.","테스터는 ASIL과 관계없이 테스트 기법을 자유롭게 고를 수 있고, 표준의 권고는 참고용일 뿐이다."],"ans":[2],"exp":"2.2.4.2: 권고 수준에 대한 일반적인 이해는 이렇다. highly recommended로 적힌 방법은 적용해야 하고, recommended로 적힌 방법은 적용하는 것이 원칙(should)이고, 적용하지 않으면 그 근거(rationale)를 제시해야(shall) 한다. 또 표준은 높은 ASIL일수록 더 폭넓고 상세한 조치를 권고하며, 낮은 ASIL에서는 조치 실행이 선택 사항인 경우가 많다. 테스터는 표준이 허용하는 범위에서만 자유롭게 정할 수 있다. (v2.1 기준. 2018년판에는 이 해석 문장이 없고, 2.2.5 예시에서 recommended를 '증거에 유용하면 적용'으로 설명했다.)","why":["반대로 적었다. highly recommended가 '적용해야 함'이다.","높은 ASIL일수록 더 폭넓고 상세한 조치를 권고한다.","정답. 2.2.4.2의 설명이다.","테스터는 표준이 허용하는 범위에서만 자유롭게 정할 수 있다."],"trap":"현업에서는 recommended(+)를 '안 해도 되는 선택 항목'으로 다루기도 한다. 하지만 실라버스는 recommended인 방법을 적용하는 것이 원칙(should)이고, 적용하지 않으면 근거를 제시해야(shall) 한다고 한다(2.2.4.2).","ref":"2.2.4.2"},{"id":"c2-122","ch":2,"lo":"AuT-2.2.5","k":3,"q":"아래 표는 실라버스 2.2.5의 표 1(method table(메소드 테이블) 예시)이다. ++ = highly recommended, + = recommended, o = 권고 없음(no recommendation). 3a와 3b처럼 같은 번호에 문자 접미사가 붙은 행은 동등한 대안 방법이다.\n테스터가 ASIL D 안전 요구사항을 베리피케이션하려 한다. 표와 실라버스의 해석 규칙에 따라 도출한 내용으로 맞는 것은?","table":{"head":["행","Method","ASIL A","ASIL B","ASIL C","ASIL D"],"rows":[["1","Method x","o","+","++","++"],["2","Method y","o","o","+","+"],["3a","Method z1","+","++","++","++"],["3b","Method z2","++","+","o","o"]]},"opts":["method y는 ASIL D에서 권고가 없으므로(o) 고려하지 않아도 된다.","method x는 반드시 적용하고, method y는 적용하는 것이 원칙이되 적용하지 않으면 근거를 제시하며, 대안 3a/3b에서는 적어도 method z1을 고른다.","3a와 3b는 대안이므로 아무것이나 골라도 되고, method z2만 골라도 된다.","method x는 테스터가 유용성을 판단해 근거를 남기면 생략할 수 있다."],"ans":[1],"exp":"풀이(2.2.4.2, 2.2.5)\n① ASIL D 열을 읽는다: x ++, y +, z1 ++, z2 o.\n② 행 1(x)은 대안이 없는 행이다. 대안이 없는 행은 선택권이 없고, 해당 ASIL에서 highly recommended인 방법을 모두 적용해야 한다. x는 ++이므로 반드시 적용한다.\n③ 행 2(y)도 대안이 없고 +(recommended)다. recommended는 적용하는 것이 원칙(should)이고, 적용하지 않으면 그 근거(rationale)를 제시해야(shall) 한다.\n④ 행 3a/3b는 동등한 대안이다. 적합한 조합을 고르고 그 유용성을 정당화한다. 표 1의 ASIL D 열은 ASIL C 열과 값이 같다(z1 ++, z2 o). 실라버스는 ASIL C 예시에서 'z1이 권고 수준이 가장 높으므로 적어도 z1을 고른다(should be chosen)'고 했으므로, 같은 값인 ASIL D에도 그대로 적용된다.\n검산 1: 원문 표 1의 ASIL D 열을 다시 확인했다. x ++, y +, z1 ++, z2 o로 같다.\n검산 2: 보기마다 다시 대입했다. y는 o가 아니라 +이고, z2만 고르면 가장 높은 z1이 빠지며, x는 대안 없는 ++이라 생략할 수 없다. 남는 보기는 정답 하나다.\n(v2.1 기준. 2018년판은 highly recommended를 '보통 적용', recommended를 '증거에 유용하면 적용'으로 설명했다.)","why":["ASIL D에서 method y는 o가 아니라 +(recommended)다. 적용하는 것이 원칙이고, 적용하지 않으면 근거를 제시해야 한다.","정답. ASIL D 열과 해석 규칙을 그대로 적용한 결과다.","ASIL D 열은 ASIL C 열과 값이 같고(z1 ++, z2 o), 실라버스 ASIL C 예시는 적어도 z1을 고르라고 한다. 또 대안 조합은 아무것이나가 아니라 적합한 조합을 골라 정당화해야 한다.","대안이 없는 행에서는 선택권이 없고, 해당 ASIL에서 ++인 방법을 모두 적용해야 한다."],"ref":"2.2.5"},{"id":"c2-123","ch":2,"lo":"AuT-2.2.5","k":3,"q":"아래 표는 실라버스 2.2.5의 표 1(method table(메소드 테이블) 예시)이다. ++ = highly recommended, + = recommended, o = 권고 없음(no recommendation). 3a와 3b처럼 같은 번호에 문자 접미사가 붙은 행은 동등한 대안 방법이다.\n테스터가 ASIL B 안전 요구사항의 테스트 계획을 세우고 있다. 테스트 계획서에 적은 결정 중 표와 실라버스의 해석 규칙에 맞는 것은?","table":{"head":["행","Method","ASIL A","ASIL B","ASIL C","ASIL D"],"rows":[["1","Method x","o","+","++","++"],["2","Method y","o","o","+","+"],["3a","Method z1","+","++","++","++"],["3b","Method z2","++","+","o","o"]]},"opts":["method x는 대안이 없는 행이므로, ASIL B에서도 선택의 여지 없이 반드시 적용해야 한다.","method y는 ASIL B에서 o이므로 사용하면 안 된다.","3a와 3b는 대안이므로 recommended인 method z2만 골라도 되고, 고른 이유는 남기지 않아도 된다.","method x는 ASIL B에서 recommended이므로 적용하는 것을 원칙으로 하고, 적용하지 않는다면 그 근거를 제시한다."],"ans":[3],"exp":"풀이(2.2.4.2, 2.2.5)\n① ASIL B 열을 읽는다: x +, y o, z1 ++, z2 +.\n② 대안이 없는 행(1, 2)에서 반드시 적용해야 하는 것은 해당 ASIL에서 highly recommended(++)인 방법이다. ASIL B에서 x는 +, y는 o라서 둘 다 ++가 아니다.\n③ x는 recommended이므로 적용하는 것이 원칙(should)이고, 적용하지 않으면 그 근거(rationale)를 제시해야(shall) 한다. 근거 없이 빼면 안 되지만, ++처럼 예외 없이 적용해야 하는 것은 아니다.\n④ y는 o이므로 표준이 권하지도 말리지도 않는다. 보조 조치로 써도 된다.\n⑤ 3a/3b는 대안이다. 적합한 조합을 고르고 그 유용성을 정당화해야 한다. ASIL B에서 권고 수준이 가장 높은 것은 z1(++)이다.\n검산 1: 원문 표 1의 ASIL B 열을 다시 확인했다. x +, y o, z1 ++, z2 +로 같다.\n검산 2: 보기마다 다시 대입했다. x를 '선택 없이 반드시'라고 한 보기는 ++가 아닌 +에 필수 규칙을 붙였고, y 금지는 o의 뜻과 반대이며, 근거 없이 z2만 고르는 것은 정당화 규칙에 어긋난다. 남는 보기는 정답 하나다.\n(v2.1 기준. 2018년판은 recommended를 '증거에 유용하면 적용'으로 설명했다.)","why":["대안이 없는 행에서 선택권 없이 적용해야 하는 것은 해당 ASIL에서 ++인 방법이다. ASIL B에서 x는 +라서, 적용이 원칙이되 근거를 대면 적용하지 않을 수 있다.","o는 권고가 없다는 뜻이다. 사용을 말리지 않으며 보조 조치로 쓸 수 있다.","대안 조합은 고른 조합의 유용성을 정당화해야 한다(2.2.5). 이유를 남기지 않아도 된다는 부분이 틀렸다.","정답. recommended는 적용하는 것이 원칙이고, 적용하지 않으면 근거를 제시해야 한다(2.2.4.2, 2.2.5)."],"trap":"현업에서는 method table의 +(recommended) 항목도 ++처럼 예외 없는 필수로 운영하기도 한다. 실라버스 기준으로 반드시 적용(must)은 ++이고, +는 적용하는 것이 원칙(should)이되 적용하지 않으면 근거를 제시해야(shall) 하는 수준이다(2.2.4.2, 2.2.5).","ref":"2.2.5"},{"id":"c2-124","ch":2,"lo":"AuT-2.2.5","k":3,"q":"아래 표는 실라버스 2.2.5의 표 1(method table(메소드 테이블) 예시)이다. ++ = highly recommended, + = recommended, o = 권고 없음(no recommendation). 3a와 3b처럼 같은 번호에 문자 접미사가 붙은 행은 동등한 대안 방법이다.\n테스터가 ASIL A 안전 요구사항을 베리피케이션하려 한다. 대안 행 3a/3b에 대한 결정으로 표와 실라버스의 해석 규칙에 맞는 것은?","table":{"head":["행","Method","ASIL A","ASIL B","ASIL C","ASIL D"],"rows":[["1","Method x","o","+","++","++"],["2","Method y","o","o","+","+"],["3a","Method z1","+","++","++","++"],["3b","Method z2","++","+","o","o"]]},"opts":["3a/3b 중 이 요구사항을 ASIL에 맞게 베리피케이션할 수 있는 적합한 조합을 고르고, 고른 조합의 유용성을 정당화한다.","method z1과 z2는 둘 다 권고가 있으므로 둘 다 반드시 적용해야 한다.","ASIL A에서는 method x와 y가 o이므로, 대안 행도 적용할 필요가 없다.","method z1을 고르고, 대안끼리는 동등하므로 고른 이유는 남기지 않아도 된다."],"ans":[0],"exp":"풀이(2.2.5)\n① ASIL A 열을 읽는다: x o, y o, z1 +, z2 ++.\n② 3a/3b는 문자 접미사가 붙은 동등한 대안이다. 테스터는 ASIL에 맞게 요구사항을 베리피케이션할 수 있는 적합한 조합을 고르고, 고른 조합의 유용성을 정당화해야 한다.\n③ '모두 반드시 적용'은 대안이 없는 행(1, 2)에서 highly recommended인 방법에 붙는 규칙이다. 대안 행에는 선택권이 있다.\n④ x와 y가 o인 것은 행 1·2의 이야기다. 대안 행 3a/3b의 판단과는 별개이고, ASIL A에서 z1은 +, z2는 ++로 권고가 있다.\n검산 1: 원문 표 1의 ASIL A 열을 다시 확인했다. x o, y o, z1 +, z2 ++로 같다.\n검산 2: 보기마다 다시 대입했다. 대안은 선택할 수 있으므로 '둘 다 반드시'는 틀리고, z1·z2에 권고가 있으므로 '적용할 필요 없음'도 틀리며, '이유를 남기지 않아도 된다'는 정당화 규칙에 어긋난다. 남는 보기는 정답 하나다.\n(v2.1 기준. 2018년판은 조합 선택을 '설명해야 한다(should be explained)'고 적었고, v2.1은 '정당화해야 한다(must justify)'고 적었다.)","why":["정답. 대안 행에 대한 2.2.5의 규칙(적합한 조합 선택, 유용성 정당화) 그대로다.","3a/3b는 동등한 대안이라 테스터가 적합한 조합을 고른다. 둘 다 반드시 적용하라는 규칙은 없다.","ASIL A에서 z2는 ++이고 z1은 +다. 행 1·2가 o라고 대안 행까지 빠지지 않는다.","고른 조합은 유용성을 정당화해야 한다(2.2.5). 대안끼리 동등하다고 근거를 생략할 수는 없다."],"ref":"2.2.5"},{"id":"c2-125","ch":2,"lo":"AuT-2.2.5","k":3,"q":"아래 표는 실라버스 2.2.5의 표 1(method table(메소드 테이블) 예시)이다. ++ = highly recommended, + = recommended, o = 권고 없음(no recommendation). 3a와 3b처럼 같은 번호에 문자 접미사가 붙은 행은 동등한 대안 방법이다.\n테스터가 ASIL C 안전 요구사항을 베리피케이션하면서, 표에 없는 method w도 쓰려고 한다. 실라버스에 맞는 판단은?","table":{"head":["행","Method","ASIL A","ASIL B","ASIL C","ASIL D"],"rows":[["1","Method x","o","+","++","++"],["2","Method y","o","o","+","+"],["3a","Method z1","+","++","++","++"],["3b","Method z2","++","+","o","o"]]},"opts":["method table에 없는 방법은 ISO 26262에 따른 개발에서 쓸 수 없다.","method w는 표에 없으므로 o와 같이 취급되어, 아무 근거 없이 쓸 수 있다.","method w도 쓸 수 있지만, 고른 방법의 유용성과 적합성을 정당화해야 한다.","method w를 쓰면 ASIL C에서 highly recommended인 method x를 대신할 수 있다."],"ans":[2],"exp":"풀이(2.2.5)\n① 실라버스 2.2.5: ISO 26262는 테스터가 method table에 있는 방법 말고 다른 방법도 쓸 수 있게 한다. 이때 고른 방법은 유용성과 적합성을 정당화해야 한다.\n② ASIL C 열에서 x는 ++이고 행 1은 대안이 없는 행이다. 대안이 없는 행은 선택권이 없고, 해당 ASIL에서 highly recommended인 방법을 모두 적용해야 한다. 그래서 method w를 써도 x는 그대로 적용해야 한다.\n검산 1: 원문 표 1의 ASIL C 열을 다시 확인했다. x ++, y +, z1 ++, z2 o로 같다.\n검산 2: 보기마다 다시 대입했다. 표에 없는 방법도 허용되므로 '쓸 수 없다'는 틀리고, 정당화가 필요하므로 '근거 없이'도 틀리며, x는 대안 없는 ++이라 다른 방법으로 대신할 수 없다. 남는 보기는 정답 하나다.","why":["실라버스는 표에 없는 방법도 쓸 수 있다고 한다. 다만 정당화가 필요하다.","표에 없는 방법은 유용성과 적합성을 정당화해야 한다.","정답. 2.2.5의 설명 그대로다.","행 1은 대안이 없는 행이라, ASIL C에서 ++인 x는 반드시 적용해야 한다."],"trap":"현업에서는 사내 표준으로 정한 기법이나 도구를 별도 설명 없이 method table의 방법과 같은 것으로 쓰기도 한다. 실라버스는 표에 없는 방법을 쓰려면 유용성과 적합성을 정당화해야 한다고 한다(2.2.5).","ref":"2.2.5"},{"id":"c2-126","ch":2,"lo":"AuT-2.2.5","k":3,"q":"아래 표는 실라버스 2.2.5의 표 1(method table(메소드 테이블) 예시)이다. ++ = highly recommended, + = recommended, o = 권고 없음(no recommendation). 3a와 3b처럼 같은 번호에 문자 접미사가 붙은 행은 동등한 대안 방법이다.\n같은 제품에 ASIL C 안전 요구사항과 ASIL D 안전 요구사항이 있다. 표를 보고 판단한 내용으로 맞는 것을 두 개 고르시오.","table":{"head":["행","Method","ASIL A","ASIL B","ASIL C","ASIL D"],"rows":[["1","Method x","o","+","++","++"],["2","Method y","o","o","+","+"],["3a","Method z1","+","++","++","++"],["3b","Method z2","++","+","o","o"]]},"opts":["ASIL D가 더 높으므로, ASIL C에서 o였던 method z2가 ASIL D에서는 recommended(+)가 된다.","이 표에서는 ASIL C 열과 ASIL D 열의 권고 수준이 네 방법 모두 같다.","ASIL D에서는 method y가 highly recommended이므로 반드시 적용한다.","두 요구사항 모두, 대안이 없는 method x를 반드시 적용해야 한다.","ASIL C 요구사항은 대안 3a/3b 중 method z2만 골라도 된다."],"ans":[1,3],"exp":"풀이(2.2.5)\n① ASIL C 열: x ++, y +, z1 ++, z2 o. ASIL D 열: x ++, y +, z1 ++, z2 o. 네 방법 모두 같다.\n② 행 1(x)은 대안이 없고 두 ASIL 모두 ++이다. 대안이 없는 행에서는 해당 ASIL에서 highly recommended인 방법을 모두 적용해야 하므로, 두 요구사항 모두 x를 적용한다.\n③ y는 두 ASIL 모두 +(recommended)다. 적용하는 것이 원칙이지만 근거를 제시하면 적용하지 않을 수 있으므로 '반드시 적용(must)'은 아니다.\n④ z2는 두 ASIL 모두 o다. 3a/3b 대안에서는 권고 수준이 가장 높은 z1(++)을 적어도 고른다. ASIL C에서 z1을 고른다는 것은 실라버스 예 그대로다.\n검산 1: 원문 표 1의 C·D 열을 칸마다 다시 대조했다. 두 열 모두 ++, +, ++, o다.\n검산 2: 보기마다 다시 대입했다. z2는 D에서도 o, y는 D에서도 +, ASIL C에서 z2만 고르면 가장 높은 z1이 빠진다. 맞는 보기는 'C·D 열이 같다'와 'x를 두 요구사항 모두 적용' 두 개다.","why":["ASIL D 열에서 z2는 o 그대로다. ASIL이 높아진다고 표에 없는 값이 생기지 않는다.","정답. 표 1에서 C와 D 열은 ++, +, ++, o로 같다.","ASIL D에서 y는 +(recommended)다. highly recommended가 아니므로 '반드시 적용'이 아니라 '적용이 원칙, 적용하지 않으면 근거 제시'다.","정답. x는 대안이 없는 행이고 C·D 모두 ++이므로 반드시 적용한다.","실라버스의 ASIL C 예는 적어도 z1을 고르라고 한다. z2는 ASIL C에서 o다."],"ref":"2.2.5"},{"id":"c3-001","ch":3,"lo":"AuT-3.1.1","k":1,"q":"실라버스는 자동차 개발에서 테스터가 특별한 어려움, 즉 서로 부딪치는 두 요구를 함께 안고 있다고 설명한다.\n그 두 요구로 옳은 것은?","opts":["결함을 줄이려면 테스팅을 되도록 늦게 시작해야 하지만, 일정 때문에 일찍 시작하라는 압박을 받는다.","가상 환경에서는 완성 제품의 결함이 드러나지 않으므로, 실차가 나올 때까지 동적 테스팅을 시작할 수 없다.","결함을 일찍 찾으려면 테스팅을 가능한 한 일찍 시작해야 하지만, 완성 제품에서 나타날 결함을 찾으려면 현실적인 환경이 필요하다.","단락이나 통신 과부하 같은 상황은 실차에서 쉽게 재현되지만, 가상 테스트 환경에서는 재현할 수 없다."],"ans":[2],"exp":"3.1.1에 따르면 테스터는 한편으로 개발 프로세스 초기에 결함을 찾기 위해 가능한 한 일찍 테스팅을 시작하라는 기대를 받고, 다른 한편으로 완성 제품에서 나타날 결함을 찾으려면 현실적인(realistic) 환경이 필요하다. 이 두 요구가 부딪치는 것이 실라버스가 말하는 '특별한 어려움'이다.","why":["실라버스는 결함을 일찍 찾으려고 가능한 한 일찍 테스팅을 시작하라고 한다. 늦게 시작해야 한다는 말은 반대다.","실라버스는 개발 단계에 맞는 테스트 환경을 쓰면 ECU가 완성되기 전에도 테스트를 실행할 수 있다고 한다(3.1.1).","정답. 3.1.1의 두 요구(조기 테스팅과 현실적인 환경)를 그대로 옮겼다.","실라버스는 반대로 단락·통신 과부하처럼 실차에서 재현하기 어려운 상황을 테스트 환경으로 시뮬레이션할 수 있다고 한다(3.1.1)."],"ref":"3.1.1"},{"id":"c3-002","ch":3,"lo":"AuT-3.1.1","k":1,"q":"조기 테스팅과 현실적인 테스트 환경 사이의 상충을 테스터는 어떻게 해결하며, 그 결과 무엇이 가능해지는가?","opts":["개발 단계에 맞는 적절한 테스트 환경을 쓴다. 그러면 ECU가 완전히 생산·개발되기 전에도 개별 테스트 작업을 구현하고 실행할 수 있다.","완성된 ECU가 나온 뒤 HiL 한 곳에서 모든 테스트를 실행한다. 그러면 테스트 환경 관리 비용이 줄어든다.","개발 단계와 관계없이 처음부터 끝까지 같은 테스트 환경 하나를 쓴다. 그러면 단계 사이의 테스트 결과를 바로 비교할 수 있다.","개발 초기에는 정적 테스팅만 하고 동적 테스팅은 실차 시험으로 미룬다. 그러면 가상 환경을 만들 비용이 들지 않는다."],"ans":[0],"exp":"3.1.1: 테스터는 서로 다른 개발 단계(development phases)에 맞는 적절한 테스트 환경을 써서 이 상충을 해결한다. 그렇게 하면 ECU가 완전히 생산되거나 개발되기 전에도 개별 테스트 작업을 구현하고 실행할 수 있다.","why":["정답. 3.1.1의 해결 방법과 그 효과를 그대로 옮겼다.","완성된 ECU를 기다리면 조기 테스팅 요구를 버리는 셈이다. 실라버스는 ECU가 나오기 전에도 테스트할 수 있다고 한다.","실라버스는 '서로 다른 개발 단계에 맞는' 테스트 환경을 쓰라고 한다. 환경 하나로 통일하라는 말이 아니다.","실라버스의 해결책은 단계에 맞는 테스트 환경으로 일찍부터 테스트를 실행하는 것이다. 동적 테스팅을 실차로 미루는 것이 아니다."],"ref":"3.1.1"},{"id":"c3-003","ch":3,"lo":"AuT-3.1.1","k":1,"q":"실라버스는 실제 차량에서 재현하기 어렵지만 여러 테스트 환경을 쓰면 시뮬레이션할 수 있는 상황의 예를 든다.\n그 예에 해당하는 것은? 두 개를 고르시오.","opts":["ECU 소스 코드의 MISRA-C rule 위반","와이어링 하네스(wiring harness)의 단락과 단선","요구사항 명세서의 모호한 표현","정상 주행 중 운전자의 실내 조명 스위치 조작","네트워크 통신 과부하"],"ans":[1,4],"exp":"3.1.1은 여러 테스트 환경을 쓰면 실차에서 재현하기 어려운 상황을 시뮬레이션할 수 있다고 하며, 예로 단락, 네트워크 통신 과부하, 와이어링 하네스의 단락과 단선(open circuit)을 든다.","why":["코딩 가이드라인 위반은 코드를 보고 찾는 것이지 테스트 환경으로 시뮬레이션하는 차량 상황이 아니다. 3.1.1의 예에도 없다.","정답. 3.1.1이 든 예(short circuits and open circuits in wiring harnesses)다.","명세서의 모호함은 요구사항 리뷰로 찾을 문제이고, 3.1.1의 '실차에서 재현하기 어려운 상황'이 아니다.","정상 주행 중 스위치 조작은 실차에서 쉽게 재현되는 상황이라 3.1.1이 말하는 '재현하기 어려운 상황'이 아니다.","정답. 3.1.1이 든 예(overloads in network communications)다."],"ref":"3.1.1"},{"id":"c3-004","ch":3,"lo":"AuT-3.1.2","k":1,"q":"실라버스 3.1.2에 따르면 테스트 환경은 테스터가 테스트 대상의 입력을 제어하고 테스트 결과를 관찰하도록 돕는다.\n이 두 지점을 부르는 이름이 바르게 짝지어진 것은?","opts":["입력 제어: PoO / 결과 관찰: PoC","입력 제어: DUT / 결과 관찰: PoO","입력 제어: PoC / 결과 관찰: DUT","입력 제어: PoC / 결과 관찰: PoO"],"ans":[3],"exp":"3.1.2: 테스트 환경은 테스트 대상의 입력을 제어하고 테스트 결과를 관찰하도록 돕는데, 이를 각각 PoC(point of control)와 PoO(point of observation)라고 부른다. DUT(device under test)는 테스트 대상 장치 자체를 가리키는 말이다(3.1.3).","why":["두 이름이 뒤바뀌었다. 입력을 제어하는 지점이 PoC(point of control), 결과를 관찰하는 지점이 PoO(point of observation)다.","DUT는 테스트 대상 장치(device under test) 자체다. 입력을 제어하는 지점의 이름이 아니다.","결과를 관찰하는 지점은 PoO다. DUT는 테스트 대상 장치 자체다.","정답. 3.1.2의 PoC(point of control)와 PoO(point of observation)다."],"trap":"현업에서 PoC는 흔히 Proof of Concept(개념 검증)를 뜻한다. 3.1.2의 PoC는 point of control, 즉 테스트 대상의 입력을 제어하는 지점이다.","ref":"3.1.2"},{"id":"c3-005","ch":3,"lo":"AuT-3.1.2","k":1,"q":"실라버스 3.1.2는 ISO/IEC/IEEE 29119-1에 따라 테스트 환경의 구성 요소와 그 예를 나열한다.\n구성 요소와 예가 실라버스와 같게 짝지어진 것은?","opts":["테스트 환경의 하드웨어: 오실로스코프, 측정 도구","통신 설비(facilities of communication): 네트워크 접근, 데이터 로거","도구(tools): 운영체제, 시뮬레이션 소프트웨어","실험실(laboratory): 테스트 벤치, development kit"],"ans":[1],"exp":"3.1.2의 목록: 테스트 환경의 하드웨어(제어용 컴퓨터, 필요하면 real-time capable computer, 테스트 벤치, development kit), 테스트 환경의 소프트웨어(운영체제, 시뮬레이션 소프트웨어, 환경 모델), 통신 설비(네트워크 접근, 데이터 로거), 도구(오실로스코프, 측정 도구), 실험실(전자기 방사·노이즈 차단). 통신 설비의 예는 네트워크 접근과 데이터 로거다.","why":["오실로스코프와 측정 도구는 3.1.2에서 '도구(tools)'의 예다. 하드웨어의 예는 제어용 컴퓨터, 테스트 벤치, development kit 등이다.","정답. 3.1.2가 통신 설비의 예로 든 것이다.","운영체제와 시뮬레이션 소프트웨어는 '테스트 환경의 소프트웨어' 예다.","테스트 벤치와 development kit은 '테스트 환경의 하드웨어' 예다. 실험실의 예는 전자기 방사와 노이즈로부터의 보호다."],"trap":"현장에서는 오실로스코프를 계측 장비, 곧 하드웨어로 묶어 부르기 쉽다. 3.1.2 목록은 오실로스코프와 측정 도구를 '도구(tools)'로 따로 분류한다.","ref":"3.1.2"},{"id":"c3-006","ch":3,"lo":"AuT-3.1.2","k":1,"q":"실라버스 3.1.2가 환경 모델(environment model)에 대해 설명한 내용으로 옳은 것은?","opts":["가상 테스트 환경의 핵심 요소로, 연소 엔진·변속기·차량 센서·ECU와 운전자·도로 조건 같은 실제 세계의 측면을 표현한다.","실라버스는 환경 모델을 테스트 환경의 중요한 구성 요소로 보지 않는다.","차량 부품만 표현하며, 운전자나 도로 조건은 표현하지 않는다.","테스트 환경의 하드웨어에 속하는 장비로, 테스트 대상을 관찰·측정하는 access point 자체다."],"ans":[0],"exp":"3.1.2: 환경 모델은 테스트 환경의 중요한 부분이고, 모델은 가상 테스트 환경의 핵심 요소(key elements)다. 모델은 연소 엔진, 변속기, 차량 센서, ECU, 나아가 운전자와 도로 조건 같은 실제 세계의 측면을 표현한다. 29119-1 목록에서 환경 모델은 '테스트 환경의 소프트웨어'에 속한다.","why":["정답. 3.1.2 설명을 그대로 옮겼다.","3.1.2는 환경 모델을 테스트 환경의 '중요한 부분(an important part)'이라고 한다.","3.1.2는 운전자와 도로 조건(the driver and road conditions)도 표현 대상으로 든다.","환경 모델은 '테스트 환경의 소프트웨어' 예다. access point는 테스트 환경이 제공하는 관찰·제어 지점으로, 환경 모델과는 따로 설명된다."],"ref":"3.1.2"},{"id":"c3-007","ch":3,"lo":"AuT-3.1.3","k":2,"q":"open-loop 시스템으로 테스트할 때 테스트 대상의 입력은 어떻게 정해지는가?","opts":["환경 모델이 테스트 대상의 출력을 모아 테스트 대상의 입력으로 넘긴다.","테스트 대상의 출력과 그 변화에 따라 매 순간 다시 계산된다.","테스터가 테스트 절차 안에서 직접 정한다.","테스트 환경 안에 만들어진 제어 루프가 정한다."],"ans":[2],"exp":"3.1.3.2: open-loop 시스템에서는 시스템의 출력이 입력과 관계가 없고 피드백 루프가 없다. 이때 테스트 대상의 입력은 테스터가 테스트 절차에서 직접 정의한다. 나머지 보기는 모두 출력이 입력으로 되돌아가는 closed-loop 시스템의 특징이다(3.1.3.1).","why":["환경 모델이 출력을 모아 입력으로 넘기는 것은 closed-loop 시스템의 방식이다(3.1.3.1).","입력이 출력에 따라 달라지는 것은 closed-loop 시스템이다. open-loop에서는 출력이 입력과 관계가 없다.","정답. 3.1.3.2: 입력은 테스터가 테스트 절차에서 직접 정의한다.","테스트 환경 안에 제어 루프가 만들어지는 것은 closed-loop 시스템이다(3.1.3.1)."],"ref":"3.1.3.2"},{"id":"c3-008","ch":3,"lo":"AuT-3.1.3","k":2,"q":"실라버스 3.1.3.2에 따르면 테스트 대상이 어떤 경우에 open-loop 시스템이 선호되는가?","opts":["출력이 입력에 영향을 주어 피드백이 생길 때","제어기(controller)를 테스트할 때","테스트 대상의 출력을 환경 모델이 입력으로 되돌려야 할 때","테스트 대상이 reactive behavior를 보이거나 상태 머신(state machine)을 반영할 때"],"ans":[3],"exp":"3.1.3.2: open-loop과 closed-loop 중 무엇을 쓸지는 테스트 대상의 동작에 크게 달려 있다. 테스트 대상이 reactive behavior를 보이거나 상태 머신을 반영하면 open-loop 시스템이 선호된다. 피드백이 있는 경우와 제어기 테스트는 closed-loop 쪽이다.","why":["출력이 입력에 영향을 주어 피드백이 생기는 것은 closed-loop 시스템의 특징이다(3.1.3.2).","3.1.3.1은 closed-loop 시스템이 제어기 테스트에 더 자주 쓰인다고 한다.","환경 모델이 출력을 입력으로 되돌리는 것은 closed-loop 시스템이다(3.1.3.1).","정답. 3.1.3.2가 open-loop 시스템이 선호되는 경우로 든 조건이다."],"trap":"상태 머신은 이전 상태에 따라 다음 동작이 바뀌니 출력을 되돌려 주는 루프가 필요해 보일 수 있다. 실라버스는 reactive behavior나 상태 머신이면 open-loop이 선호된다고 적는다(3.1.3.2).","ref":"3.1.3.2"},{"id":"c3-009","ch":3,"lo":"AuT-3.1.3","k":2,"q":"테스트 대상과 시스템 유형을 짝지은 것 중 실라버스 3.1.3이 든 예와 맞는 것은? 두 개를 고르시오.","opts":["ABS(anti-lock braking system): closed-loop 시스템","실내 조명(lights): closed-loop 시스템","엔진(motor)·변속(gear) 제어: open-loop 시스템","실내·섀시 전장의 스위치(switches): open-loop 시스템","VDC(vehicle dynamics control): open-loop 시스템"],"ans":[0,3],"exp":"3.1.3.1: closed-loop 시스템은 제어기 테스트에 더 자주 쓰이며, 엔진·변속 제어와 ABS, VDC 같은 운전자 보조 시스템처럼 복잡한 기능을 테스트할 수 있다. 3.1.3.2: 실내(interior)와 섀시(chassis) 전장에는 open-loop 시스템의 예가 많다(예: 조명과 스위치).","why":["정답. ABS는 3.1.3.1이 closed-loop 시스템으로 테스트하는 예로 든다.","조명은 3.1.3.2가 든 open-loop 시스템의 예다.","엔진·변속 제어는 3.1.3.1이 든 closed-loop 시스템의 예다.","정답. 스위치는 3.1.3.2가 든 open-loop 시스템의 예다.","VDC는 3.1.3.1이 든 closed-loop 시스템의 예다."],"ref":"3.1.3"},{"id":"c3-010","ch":3,"lo":"AuT-3.1.3","k":2,"q":"실라버스 3.1.3에 따르면 closed-loop 시스템과 open-loop 시스템의 차이는 무엇에 달려 있으며, 그 차이는 가상 테스트 환경에 어떤 영향을 주는가?","opts":["테스트 대상이 모델인지 실제 하드웨어인지에 달려 있고, 그래서 MiL과 HiL 중 하나를 고르게 된다.","ECU가 자기 환경에 반응하는 방식에 달려 있고, 그래서 가상 테스트 환경에 서로 다른 시뮬레이션 요구사항이 생긴다.","테스트가 실시간(real time)으로 실행되는지에 달려 있고, 그래서 real-time capable computer가 필요한지가 정해진다.","실제 결과와 기대 결과를 비교하는지에 달려 있고, open-loop 시스템에서는 이 비교를 하지 않는다."],"ans":[1],"exp":"3.1.3: 제어 시스템에는 일반적으로 closed-loop과 open-loop 두 가지가 있다. 차이는 ECU가 자기 환경에 반응하는 방식에 있고, 이 때문에 가상 테스트 환경에 서로 다른 시뮬레이션 요구사항이 생긴다. 어느 쪽이든 실제 결과가 기대 결과와 맞으면 성공이다.","why":["테스트 대상이 모델인지 실제 하드웨어인지는 MiL·HiL 같은 XiL 환경의 구조 이야기다(3.2). 3.1.3은 차이가 ECU가 환경에 반응하는 방식에 있다고 한다.","정답. 3.1.3 도입부 문장을 그대로 옮겼다.","3.1.3은 실시간 실행 여부를 두 시스템의 차이로 들지 않는다. 차이는 ECU가 환경에 반응하는 방식이다.","3.1.3은 테스트 환경이 출력을 분석하고 실제 결과가 기대 결과와 맞으면 성공이라고 할 뿐, open-loop에서 비교를 생략한다고 하지 않는다."],"ref":"3.1.3"},{"id":"c3-011","ch":3,"lo":"AuT-3.1.4","k":1,"q":"ECU의 데이터베이스와 통신 프로토콜에 대한 설명으로 옳은 것은?","opts":["데이터베이스는 해당 물리 인터페이스를 통한 데이터 교환을 설명한다.","통신 프로토콜은 ECU의 입력·출력 신호와 그 설명·변환 공식을 담는 데이터 저장소다.","데이터베이스는 ECU 메모리에서 데이터를 처리해 출력 동작을 만드는 소프트웨어다.","통신 프로토콜은 어떤 전압이나 비트 시퀀스가 신호의 어떤 값을 나타내는지 정의한다."],"ans":[3],"exp":"3.1.4: 데이터베이스는 데이터 저장소(data warehouse)로, 제어 유닛의 입력·출력 신호를 정의하고 신호의 설명과 변환 공식 등을 담는다. 통신 프로토콜은 해당 물리 인터페이스를 통한 데이터 교환을 설명하며, 어떤 전압이나 비트 시퀀스가 신호의 어떤 값을 나타내는지 정의한다.","why":["물리 인터페이스를 통한 데이터 교환을 설명하는 것은 통신 프로토콜이다.","입력·출력 신호와 그 설명·변환 공식을 담는 데이터 저장소는 데이터베이스다.","메모리의 데이터를 처리해 출력 동작을 만드는 것은 테스트 대상(ECU)이다. 데이터베이스는 신호를 정의하는 데이터 저장소다.","정답. 3.1.4의 통신 프로토콜 설명이다."],"ref":"3.1.4"},{"id":"c3-012","ch":3,"lo":"AuT-3.1.4","k":1,"q":"실라버스 3.1.4에 따르면 ECU에 쓰는 데이터베이스와 통신 프로토콜의 선택은 무엇에 따라 달라지는가?","opts":["ECU의 기능","ECU에 배정된 ASIL","ECU를 테스트하는 테스트 레벨","공급업체(supplier)의 ASPICE capability level"],"ans":[0],"exp":"3.1.4: 데이터베이스와 통신 프로토콜의 선택은 ECU의 기능에 따라 달라진다. 예를 들어 제어 유닛의 진단 기능에 접근하려면 테스터는 그에 쓰인 데이터베이스와 통신 프로토콜 정보가 필요하다.","why":["정답. 3.1.4: 'depends on the ECU's function'.","ASIL은 ISO 26262의 안전 무결성 수준이다. 3.1.4는 데이터베이스·프로토콜 선택 기준으로 ASIL을 들지 않는다.","3.1.4는 선택 기준으로 테스트 레벨을 들지 않는다. 기준은 ECU의 기능이다.","capability level은 ASPICE 프로세스 심사 결과다. 3.1.4의 선택 기준이 아니다."],"ref":"3.1.4"},{"id":"c3-013","ch":3,"lo":"AuT-3.1.4","k":1,"q":"테스터가 ECU의 진단 기능에 접근하려면 그에 쓰인 데이터베이스와 통신 프로토콜 정보가 필요하다.\n실라버스 3.1.4가 든 예 중 '통신 프로토콜'에 해당하는 것은?","opts":["ASAM MCD-3 D(application programming interface specification)","ASAM SOVD(service-oriented vehicle diagnostics)","UDS(unified diagnostic services, ISO 14229)","ECU configuration description"],"ans":[2],"exp":"3.1.4: 진단 기능 접근에 필요한 데이터베이스의 예로 ASAM MCD-3 D(application programming interface specification)와 ASAM SOVD(service-oriented vehicle diagnostics)를, 통신 프로토콜의 예로 ISO 14229에 따른 UDS와 AUTOSAR 명세의 SOME/IP를 든다. (v2.1 기준. 2018년판은 진단 데이터베이스 예로 ASAM MCD2 D(ODX)만 들었고, ASAM MCD-3 D·ASAM SOVD·SOME/IP는 v2.1에서 들어왔다. UDS는 두 판 모두 프로토콜 예다.)","why":["ASAM MCD-3 D는 3.1.4가 든 데이터베이스의 예다.","ASAM SOVD도 3.1.4가 든 데이터베이스의 예다.","정답. ISO 14229에 따른 UDS는 3.1.4가 든 통신 프로토콜의 예다.","ECU configuration description은 SW-C를 ECU에 통합하는 데 필요한 데이터다(6장 정의). 통신 프로토콜이 아니다."],"ref":"3.1.4"},{"id":"c3-014","ch":3,"lo":"AuT-3.1.4","k":1,"q":"실라버스 3.1.4가 자동차 환경의 ECU를 설명한 내용으로 옳은 것은?","opts":["소프트웨어로만 이루어진 시스템이며, 입력 데이터는 bus system으로만 받는다.","하드웨어와 소프트웨어로 이루어진 임베디드 시스템이며, 아날로그·디지털 입력으로 전압·전류·온도 형태의 환경 데이터를 끊임없이 수집한다.","하드웨어와 소프트웨어로 이루어진 임베디드 시스템이지만, 출력은 진단 인터페이스로만 내보낸다.","여러 ECU가 같은 연결로 정보를 주고받는 네트워크이며, 센서 데이터는 다루지 않는다."],"ans":[1],"exp":"3.1.4: 자동차 환경의 ECU는 하드웨어와 소프트웨어로 이루어진 임베디드 시스템으로 동작한다. 여러 아날로그·디지털 입력으로 전압, 전류, 온도 형태의 환경 데이터를 끊임없이 수집하고, 통신 bus system이 센서나 다른 ECU의 데이터를 더 제공한다. 출력은 아날로그·디지털 출력 핀, bus system, 진단 인터페이스로 나간다.","why":["3.1.4는 ECU가 하드웨어와 소프트웨어로 이루어진다고 하고, 아날로그·디지털 입력으로도 데이터를 받는다고 한다.","정답. 3.1.4의 ECU 설명을 그대로 옮겼다.","3.1.4는 출력이 아날로그·디지털 출력 핀, bus system, 진단 인터페이스로 나간다고 한다. 진단 인터페이스만이 아니다.","같은 연결로 정보를 주고받는 ECU들의 네트워크는 bus system의 정의다(6장). ECU는 센서 데이터도 받는다."],"ref":"3.1.4"},{"id":"c3-015","ch":3,"lo":"AuT-3.KW","k":1,"q":"ISTQB 용어집에 따른 환경 모델(environment model)의 정의는?","opts":["실시간 시뮬레이션에서, 다른 컴포넌트·프로세스·환경 조건을 포함한 컴포넌트 또는 시스템의 실제 환경을 추상화한 것","시스템의 시뮬레이션 모델을 테스트하는 가상 테스트 환경","전선 속 물리 신호를 분석·차단·조작하는 측정 장치","컴퓨터 시뮬레이션이 다루는 시간 범위"],"ans":[0],"exp":"용어집 정의: 'An abstraction of the real environment of a component or system including other components, processes, and environment conditions, in a real-time simulation.' KSTQB 용어집 한국어판 표기도 '환경 모델'이다.","why":["정답. 용어집 정의를 옮겼다.","MiL(model-in-the-loop)의 용어집 정의다.","breakout box의 정의다(6장).","시뮬레이션 시간(simulation time)의 정의다(6장)."],"ref":"3장 Keywords"},{"id":"c3-016","ch":3,"lo":"AuT-3.KW","k":1,"q":"ISTQB 용어집에 따른 HiL(hardware-in-the-loop)의 정의는?","opts":["실제 소프트웨어를 테스트하는 가상 테스트 환경","실제 차량에 ECU를 장착하고 주행하며 테스트하는 실차 테스트 환경","소프트웨어가 통합된 실제 하드웨어를 테스트하는 가상 테스트 환경","신호를 실시간으로 처리할 수 있는 컴퓨터"],"ans":[2],"exp":"용어집 정의: 'A virtual test environment in which real hardware with integrated software is tested.' HiL도 '가상 테스트 환경'으로 분류된다는 점이 핵심이다. (v2.1 기준 용어집 정의. 2018년판 키워드에 연결된 이전 정의는 '시뮬레이션된 환경에서 소프트웨어가 통합된 실제 하드웨어로 수행하는 동적 테스팅'이었다.)","why":["SiL(software-in-the-loop)의 용어집 정의다.","HiL은 용어집에서 가상 테스트 환경(virtual test environment)으로 정의된다. 실차 주행 테스트가 아니다.","정답. 용어집 정의를 옮겼다.","real time capable computer의 정의다(6장). HiL 안에서 환경 모델을 돌리는 데 쓰이지만 HiL 자체의 정의는 아니다."],"trap":"HiL은 실제 ECU를 물리는 장비라서 '가상'이라는 말이 어색하게 들린다. 그래도 용어집은 HiL을 가상 테스트 환경(virtual test environment)으로 정의한다.","ref":"3장 Keywords"},{"id":"c3-017","ch":3,"lo":"AuT-3.KW","k":1,"q":"다음 정의에 해당하는 용어는?\n'시스템의 시뮬레이션 모델을 테스트하는 가상 테스트 환경'","opts":["SiL(software-in-the-loop)","HiL(hardware-in-the-loop)","환경 모델(environment model)","MiL(model-in-the-loop)"],"ans":[3],"exp":"용어집의 MiL 정의: 'A virtual test environment in which a simulation model of the system is tested.' (v2.1 기준 용어집 정의. 2018년판 키워드에 연결된 이전 정의는 '시뮬레이션된 환경에서 시스템의 시뮬레이션 모델로 수행하는 동적 테스팅'이었다.)","why":["SiL은 '실제 소프트웨어를 테스트하는 가상 테스트 환경'이다.","HiL은 '소프트웨어가 통합된 실제 하드웨어를 테스트하는 가상 테스트 환경'이다.","환경 모델은 테스트 환경이 아니라 실제 환경을 추상화한 것이다.","정답. MiL의 용어집 정의다."],"ref":"3장 Keywords"},{"id":"c3-018","ch":3,"lo":"AuT-3.KW","k":1,"q":"ISTQB 용어집에 따른 SiL(software-in-the-loop)의 정의는?","opts":["소프트웨어가 통합된 실제 하드웨어를 테스트하는 가상 테스트 환경","실제 소프트웨어를 테스트하는 가상 테스트 환경","AUTOSAR에서 하드웨어에 독립적인 애플리케이션 소프트웨어 계층의 컴포넌트","Automotive SPICE에서 통합된 소프트웨어가 소프트웨어 요구사항과 일관되는지 검증하는 것"],"ans":[1],"exp":"용어집 정의: 'A virtual test environment in which real software is tested.' (v2.1 기준 용어집 정의. 2018년판 키워드에 연결된 이전 정의는 '시뮬레이션된 환경이나 실험용 하드웨어에서 실제 소프트웨어로 수행하는 동적 테스팅'이었다.)","why":["HiL(hardware-in-the-loop)의 용어집 정의다.","정답. 용어집 정의를 옮겼다.","software component(AUTOSAR), 곧 SW-C의 정의다(6장).","software verification(ASPICE)의 정의다(6장)."],"ref":"3장 Keywords"},{"id":"c3-019","ch":3,"lo":"AuT-3.KW","k":1,"q":"다음 정의에 해당하는 용어는?\n'제어 동작(controlling action)이나 입력이 출력 또는 출력의 변화에 의존하는 시스템'","opts":["closed-loop 시스템","open-loop 시스템","bus system","환경 모델(environment model)"],"ans":[0],"exp":"실라버스 6장 정의: closed-loop system은 'A system in which a controlling action or an input is dependent on the output or on changes in the output.' KSTQB 용어집 한국어판은 '폐쇄 루프 시스템'으로 적는다.","why":["정답. 6장의 closed-loop system 정의다.","open-loop 시스템은 제어 동작이나 입력이 출력과 '독립적인(independent)' 시스템이다.","bus system은 같은 연결로 정보를 주고받는 ECU들의 네트워크다(6장).","환경 모델은 컴포넌트나 시스템의 실제 환경을 추상화한 것이다(용어집)."],"ref":"6장 Domain Specific Terms"},{"id":"c3-020","ch":3,"lo":"AuT-3.KW","k":1,"q":"실라버스 6장에 따른 open-loop 시스템의 정의는?","opts":["제어 동작(controlling action)이나 입력이 출력 또는 출력의 변화에 의존하는 시스템","같은 연결로 정보를 주고받는 ECU들의 네트워크","미리 정한 시간 안에 결과가 나오도록 데이터를 처리하는 것","제어 동작(controlling action)이나 입력이 출력 또는 출력의 변화와 독립적인 시스템"],"ans":[3],"exp":"실라버스 6장 정의: open-loop system은 'A system in which a controlling action or an input is independent of the output or of changes in the output.' KSTQB 용어집 한국어판은 '오픈-루프 시스템'으로 적는다.","why":["closed-loop 시스템의 정의다(6장).","bus system의 정의다(6장).","실시간(real time)의 정의다(6장).","정답. 6장의 open-loop system 정의다."],"ref":"6장 Domain Specific Terms"},{"id":"c3-101","ch":3,"lo":"AuT-3.2.1.1","k":1,"q":"MiL(model-in-the-loop) 테스트 환경에서 테스터가 테스트 대상을 제어하고 관찰하는 access point는 어디에 둘 수 있는가?","opts":["래퍼(wrapper)가 제공하는 신호에만 둘 수 있다","하드웨어나 통신 프로토콜로 제공되는 신호에만 둘 수 있다","테스트 대상 모델과 환경 모델(environment model) 안 어디에나 둘 수 있다","와이어링 하네스(wiring harness)에 연결한 breakout box에만 둘 수 있다"],"ans":[2],"exp":"3.2.1.1: MiL에서 테스터는 access point로 테스트 대상을 제어·관찰한다. access point는 테스트 대상 모델과 환경 모델 안에 임의로 배치할 수 있다. 그래서 표 3(3.2.4.1)에서도 MiL은 '모델의 모든 신호를 관찰·제어할 수 있다'로 나온다.","why":["래퍼로 access point를 정하는 것은 SiL이다(3.2.2.1).","하드웨어·통신 프로토콜 신호만 다룰 수 있는 것은 HiL이다(3.2.4.1 표 3).","정답. 3.2.1.1: access point는 테스트 대상 모델과 환경 모델 안에 임의로(arbitrarily) 둘 수 있다.","breakout box는 HiL의 하네스 추가 접근 인터페이스다(3.2.3.1). MiL은 컴퓨터와 시뮬레이션 소프트웨어로 실행한다(3.2.1.2)."],"ref":"3.2.1.1"},{"id":"c3-102","ch":3,"lo":"AuT-3.2.1.1","k":1,"q":"MiL 테스트 환경의 구조에 대한 설명으로 옳은 것은?","opts":["테스트 환경은 보통 테스트 대상과 같은 개발 환경 안에 구현한다","테스트 대상은 특정 컴퓨터 아키텍처용으로 컴파일한 기계어 코드다","모델은 실행할 수 없으므로 리뷰로만 확인한다","테스트 대상 ECU의 프로토타입이 있어야 테스트 환경을 구성할 수 있다"],"ans":[0],"exp":"3.2.1.1: MiL에서 테스트 대상은 모델로 존재한다. 이 모델은 실행되지만 특수 하드웨어용으로 컴파일하지 않았다. 개발자는 전용 모델링 도구로 모델을 만들고, 테스터가 그 모델을 실행·테스트할 테스트 환경은 보통 테스트 대상과 같은 개발 환경에 구현한다.","why":["정답. 3.2.1.1 문장 그대로다.","컴파일된 기계어 코드가 테스트 대상인 것은 SiL이다(3.2.2.1). MiL의 모델은 특수 하드웨어용으로 컴파일하지 않는다(3.2.1.1).","3.2.1.1: MiL의 모델은 실행 가능(executable)하다. 테스터는 테스트 환경에서 모델을 실행하고 테스트한다.","테스트 대상이 프로토타입이거나 완성된 상태일 때 쓰는 것은 HiL이다(3.2.3.1)."],"ref":"3.2.1.1"},{"id":"c3-103","ch":3,"lo":"AuT-3.2.1.1","k":1,"q":"MiL 테스트 환경에서 테스트 대상 모델과 환경 모델의 관계를 바르게 설명한 것은?","opts":["테스트 대상 모델은 래퍼를 거쳐야만 환경 모델과 연결된다","테스트 대상 모델을 환경 모델에 연결해 closed-loop 시스템으로 쉽게 구현하고 사용할 수 있다","환경 모델은 real-time capable computer에서 실시간으로 실행해야 한다","환경 모델을 연결하면 open-loop 시스템으로만 구성할 수 있다"],"ans":[1],"exp":"3.2.1.1: MiL 테스트 환경에는 환경 모델을 추가로 넣을 수 있다. 테스트 대상 모델을 환경 모델에 연결하면 closed-loop 시스템으로 쉽게 구현·사용할 수 있다. closed-loop 시스템은 환경 모델이 테스트 대상의 출력을 모아 다시 입력으로 보내는 구조다(3.1.3.1).","why":["래퍼로 테스트 대상을 테스트 환경에 연결하는 것은 SiL이다(3.2.2.1).","정답. 3.2.1.1 마지막 문장 그대로다.","real-time capable computer에서 환경 모델을 돌리는 것은 HiL이다(3.2.3.1). MiL은 시뮬레이션 시간으로 실행한다(3.2.1.2).","3.2.1.1은 MiL을 closed-loop 시스템으로 쉽게 쓸 수 있다고 한다."],"ref":"3.2.1.1"},{"id":"c3-104","ch":3,"lo":"AuT-3.2.1.2","k":2,"q":"한 프로젝트가 초기에는 MiL 테스트 환경을 잘 활용했다. 그런데 개발이 진행될수록 MiL 테스트 환경을 구현하는 데 드는 노력이 커졌다. 실라버스가 설명하는 이유로 가장 알맞은 것은?","opts":["MiL에서는 시뮬레이션을 일시 정지할 수 없어 분석에 시간이 많이 들기 때문이다","래퍼가 늘어나는 신호를 다 제공하지 못해 access point가 부족해지기 때문이다","개발 후반에는 MiL에 real-time capable computer를 추가해야 하기 때문이다","테스트 대상의 기능 범위가 커질수록 환경 모델이 복잡해지고, 모델 실행 시간도 불균형하게(disproportionately) 늘어나기 때문이다"],"ans":[3],"exp":"3.2.1.2: 테스트 대상의 기능 범위가 커질수록 환경 모델이 더 복잡해진다. 현실의 측면과 환경 요인은 매우 복잡하고, 모델 실행 시간도 불균형하게 늘어난다. 그래서 개발의 어느 단계부터는 MiL 테스트 환경을 구현하는 노력이 더는 값어치가 없다. 각주 25는 이 점이 다른 XiL 환경에도 해당한다고 덧붙인다.","why":["3.2.1.2: MiL은 언제든 시뮬레이션을 일시 정지할 수 있고, 이것이 큰 장점이다.","래퍼는 SiL 구성 요소다(3.2.2.1). MiL의 access point는 모델 안 어디에나 둘 수 있다(3.2.1.1).","real-time capable computer는 HiL 구성 요소다(3.2.3.1). MiL은 컴퓨터와 시뮬레이션 소프트웨어로 실행한다(3.2.1.2).","정답. 3.2.1.2가 든 이유 그대로다."],"ref":"3.2.1.2"},{"id":"c3-105","ch":3,"lo":"AuT-3.2.1.2","k":2,"q":"MiL 테스트 환경의 적용 영역에 대한 설명으로 옳은 것은?","opts":["모델에서 생성한 코드가 고정소수점 연산 때문에 다르게 동작하는 문제를 처음 테스트할 수 있다","개발 초기(V-모델 왼쪽)에 모든 개발 레벨에 걸쳐 모델의 기능 적합성(functional suitability)을 테스트할 수 있다","타깃 하드웨어의 수행 효율성(performance efficiency)을 측정하는 데 주로 쓴다","단일 컴포넌트만 테스트할 수 있고 전체 시스템 모델은 테스트할 수 없다"],"ans":[1],"exp":"3.2.1.2: MiL 테스트 환경을 쓰면 개발 초기 단계(V-모델 왼쪽)에 모든 개발 레벨에 걸쳐 모델의 기능 적합성을 테스트할 수 있다. 개발 중에는 단일 컴포넌트부터 전체 시스템까지 테스트할 수 있다.","why":["데이터 타입 차이로 생긴 이상을 처음 테스트할 수 있는 곳은 SiL이다(3.2.2.2).","정답. 3.2.1.2 문장 그대로다.","MiL은 컴퓨터와 시뮬레이션 소프트웨어로 실행하므로 타깃 하드웨어가 없다(3.2.1.2). 시스템 레벨의 수행 효율성 장애는 HiL에서 찾는 예로 나온다(3.2.4.3).","3.2.1.2: 개발 중에 단일 컴포넌트부터 전체 시스템까지 테스트할 수 있다."],"ref":"3.2.1.2"},{"id":"c3-106","ch":3,"lo":"AuT-3.2.1.2","k":2,"q":"테스터가 ECU 기능을 MiL 테스트 환경에서 테스트하고 있다. 동료가 환경 모델을 확장해 진단 기능과 와이어링 하네스의 단선·단락까지 MiL에서 시뮬레이션하자고 제안했다. 실라버스 관점에서 가장 알맞은 판단은?","opts":["MiL 환경 모델에 이런 시뮬레이션을 넣는 것은 흔하지 않다. 이런 작업은 다른 테스트 환경에서 더 쉽고 적은 비용으로 할 수 있다","MiL이 가장 저렴한 환경이므로 단선·단락 시뮬레이션은 MiL 환경 모델에 넣는 것이 권장된다","MiL에는 access point를 둘 수 없으므로 원리적으로 불가능하다","SiL의 래퍼가 단선·단락을 시뮬레이션하므로 SiL로 옮겨야 한다"],"ans":[0],"exp":"3.2.1.2: MiL에서 환경 모델이 버스·진단 기능이나 단선·단락 같은 물리적 동작을 시뮬레이션하게 하는 것은 흔하지 않다. 이런 작업은 다른 테스트 환경에서 더 쉽고 적은 비용으로 할 수 있다. 예를 들어 HiL에는 단선·단락을 시뮬레이션하는 FIU(fault insertion unit)가 있다(3.2.3.1).","why":["정답. 3.2.1.2 문장 그대로다.","3.2.1.2는 반대로, 이런 작업은 다른 테스트 환경에서 더 쉽고 싸게 할 수 있다고 한다.","MiL의 access point는 모델 안 어디에나 둘 수 있다(3.2.1.1). 실라버스는 '흔하지 않다'고 했지 불가능하다고 하지 않았다.","래퍼는 access point만 정의한다(3.2.2.1). 단선·단락 시뮬레이션은 HiL의 FIU가 맡는다(3.2.3.1)."],"ref":"3.2.1.2"},{"id":"c3-107","ch":3,"lo":"AuT-3.2.1.2","k":2,"q":"MiL 테스트 환경의 실행 시간에 대한 설명으로 옳은 것은?","opts":["MiL은 실시간으로 실행되므로 시스템 크기와 관계없이 실시간 실행과 걸리는 시간이 같다","모델이 복잡해져도 컴퓨터에 필요한 실행 시간이나 계산 능력은 달라지지 않는다","작은 시스템에서는 시뮬레이션에 걸리는 시간이 실시간(real time) 실행보다 짧다","시뮬레이션 시간을 지키려면 real-time capable computer가 있어야 한다"],"ans":[2],"exp":"3.2.1.2: MiL에서는 모든 구성 요소가 모델로 있으므로 테스트가 실시간이 아니라 시뮬레이션 시간으로 실행된다. 시스템이 복잡할수록 필요한 실행 시간이나 계산 능력이 커지고, 작은 시스템에서는 시뮬레이션이 실시간 실행보다 짧게 끝난다. 테스터는 언제든 시뮬레이션을 일시 정지해 자세히 분석할 수 있다.","why":["3.2.1.2: MiL 테스트 실행은 실시간이 아니라 시뮬레이션 시간(simulation time)으로 돈다.","3.2.1.2: 시스템이 복잡할수록 컴퓨터에 더 많은 실행 시간이나 계산 능력이 필요하다.","정답. 3.2.1.2 문장 그대로다.","real-time capable computer는 실시간으로 도는 HiL의 구성 요소다(3.2.3.1, 3.2.3.2)."],"ref":"3.2.1.2"},{"id":"c3-108","ch":3,"lo":"AuT-3.2.2.1","k":1,"q":"SiL(software-in-the-loop) 테스트 환경의 래퍼(wrapper)에 대한 설명으로 옳은 것은?","opts":["테스트 대상에 아직 없는 기능을 대신 수행해 테스트를 진행할 수 있게 한다","차량 주변 환경을 시뮬레이션하므로 SiL에는 환경 모델이 필요 없다","실제 하드웨어로 가는 신호의 종류와 진폭을 맞춰 준다","테스트 대상의 access point를 정의하지만 테스트 대상의 기능은 수행하지 않는다"],"ans":[3],"exp":"3.2.2.1: 테스트 환경이 신호에 접근하려면 래퍼가 필요하다. 래퍼는 추가 소프트웨어로, 테스트 대상이 래퍼 없이 환경과 직접 통신하면 접근할 수 없는 입력에 접근하게 해 준다. 래퍼는 테스트 대상의 access point를 정의하지만 테스트 대상의 기능적 작업은 하지 않는다.","why":["3.2.2.1: 래퍼는 테스트 대상의 기능적 작업을 수행하지 않는다.","3.2.2.1: SiL에도 시뮬레이션을 위한 환경 모델이 필요하다. 래퍼는 환경을 시뮬레이션하지 않는다.","신호 종류·진폭을 다루는 것은 HiL의 signal processing unit이다(3.2.3.1).","정답. 3.2.2.1 문장 그대로다."],"trap":"단위 테스트의 스텁·드라이버처럼 빠진 부분의 동작을 대신 흉내 내는 것으로 래퍼를 떠올리기 쉽다. 실라버스의 래퍼는 access point만 정의하고 테스트 대상의 기능은 수행하지 않는다(3.2.2.1).","ref":"3.2.2.1"},{"id":"c3-109","ch":3,"lo":"AuT-3.2.2.1","k":1,"q":"실라버스가 설명하는 SiL 테스트 환경에서 테스트 대상은 어떤 형태로 실행되는가?","opts":["타깃 ECU용으로 컴파일해 개발 보드에 올린 뒤 실제 ECU 프로세서에서 실행된다","특정 컴퓨터 아키텍처용으로 컴파일된 기계어 코드로, 특별한 하드웨어가 없는 컴퓨터에서 실행된다","컴파일하지 않은 모델 그대로 모델링 도구 안에서 실행된다","실제 ECU 프로토타입에 올라가 real-time capable computer의 환경 모델과 실시간으로 연결된다"],"ans":[1],"exp":"3.2.2.1: SiL에서 테스트 대상은 특정 SiL 테스트 환경용으로 컴파일된다. 즉 소스 코드를 특정 컴퓨터 아키텍처용으로 컴파일했다. 이 기계어 코드는 바이너리 데이터 집합이라 테스트 환경이 읽을 수 있다. 테스트 실행은 특별한 하드웨어가 없는 컴퓨터에서 한다.","why":["3.2.2.1: SiL 테스트 실행은 특별한 하드웨어 없이 컴퓨터에서 한다.","정답. 3.2.2.1의 설명 그대로다.","컴파일하지 않은 모델을 실행하는 것은 MiL이다(3.2.1.1).","프로토타입과 real-time capable computer를 쓰는 것은 HiL이다(3.2.3.1)."],"trap":"컴파일한 코드를 개발 보드나 실제 프로세서에서 돌리는 것도 '소프트웨어를 돌리니 SiL'이라고 생각하기 쉽다. 실라버스의 SiL은 특정 컴퓨터 아키텍처용으로 컴파일한 코드를 특별한 하드웨어 없이 컴퓨터에서 실행하는 환경이다(3.2.2.1). PiL(processor-in-the-loop)은 이 실라버스에서 다루지 않는 참고용 환경이다(3.2 각주 23).","ref":"3.2.2.1"},{"id":"c3-110","ch":3,"lo":"AuT-3.2.2.1","k":1,"q":"SiL 테스트 환경을 구성할 때 필요한 것을 두 개 고르시오.","opts":["여러 공급 전압을 설정하는 전원 공급 장치(power supply)","시뮬레이션을 위한 환경 모델","와이어링 하네스에 추가 접근 인터페이스를 주는 breakout box","단선·단락을 시뮬레이션하는 FIU(fault insertion unit)","테스트 대상용 래퍼(테스트 환경으로 이어지는 access point 포함)를 만들 수 있는 소프트웨어 도구"],"ans":[1,4],"exp":"3.2.2.1: SiL에는 시뮬레이션을 위한 환경 모델이 필요하고, 테스트 대상은 래퍼를 통해 테스트 환경에 연결된다. 테스트 실행은 특별한 하드웨어 없이 컴퓨터에서 하며, 테스터에게는 테스트 대상에 access point를 가진 래퍼를 만들어 주는 소프트웨어 도구가 필요하다. 전원 공급 장치, breakout box, FIU는 HiL 구성 요소다(3.2.3.1).","why":["전원 공급 장치는 HiL 구성 요소다(3.2.3.1). SiL은 특별한 하드웨어 없이 컴퓨터에서 실행한다.","정답. 3.2.2.1: 시뮬레이션에는 환경 모델이 필요하다.","breakout box는 HiL 구성 요소다(3.2.3.1).","FIU는 HiL 구성 요소다(3.2.3.1).","정답. 3.2.2.1: 테스터에게는 이런 래퍼를 만들 수 있는 소프트웨어 도구가 필요하다."],"ref":"3.2.2.1"},{"id":"c3-111","ch":3,"lo":"AuT-3.2.2.2","k":1,"q":"개발자가 모델에서 소스 코드를 생성했다. 생성된 소프트웨어의 실제 동작이 기대한 동작과 다를 수 있는 원인과, 그 차이를 처음 테스트할 수 있는 환경을 바르게 짝지은 것은?","opts":["원인: 모델(주로 부동소수점)과 컴파일된 코드(주로 고정소수점)의 데이터 타입 차이, 메모리 공간 차이 / 환경: SiL","원인: 모델과 컴파일된 코드의 데이터 타입 차이 / 환경: MiL","원인: 타깃 하드웨어의 공급 전압 변동 / 환경: HiL","원인: 래퍼가 테스트 대상의 기능 일부를 대신 수행하는 것 / 환경: SiL"],"ans":[0],"exp":"3.2.2.2: 모델에서 코드를 생성하면 소프트웨어의 실제 동작이 기대와 다를 수 있다. 원인은 모델(주로 부동소수점)과 컴파일된 코드(주로 고정소수점)의 데이터 타입 차이, 그리고 메모리 공간 차이다. 이런 이상은 SiL 테스트 환경에서 처음 테스트할 수 있다.","why":["정답. 3.2.2.2의 설명 그대로다.","MiL의 테스트 대상은 아직 컴파일하지 않은 모델이다(3.2.1.1). 컴파일된 코드와의 차이는 SiL에서 처음 테스트할 수 있다(3.2.2.2).","3.2.2.2가 든 원인은 데이터 타입 차이와 메모리 공간 차이고, 처음 테스트할 수 있는 곳은 SiL이다.","래퍼는 테스트 대상의 기능을 수행하지 않는다(3.2.2.1)."],"trap":"자동 생성 코드는 모델과 똑같이 동작한다고 여기기 쉽다. 실라버스는 데이터 타입(부동소수점/고정소수점)과 메모리 공간 차이로 동작이 달라질 수 있고, 이 차이를 SiL에서 처음 테스트할 수 있다고 한다(3.2.2.2).","ref":"3.2.2.2"},{"id":"c3-112","ch":3,"lo":"AuT-3.2.2.2","k":1,"q":"SiL 테스트 환경에서 모델의 동작과 모델에서 생성한 소프트웨어의 동작을 비교할 때 실라버스가 예로 든 테스트 접근법은?","opts":["fault injection(결함 주입) 테스팅","탐색적 테스팅(exploratory testing)","요구사항 리뷰","back-to-back 테스팅(back-to-back testing)"],"ans":[3],"exp":"3.2.2.2: 모델에서 생성한 코드는 데이터 타입·메모리 공간 차이 때문에 기대와 다르게 동작할 수 있다. 테스터는 back-to-back 테스팅(4.2.2) 같은 테스트 접근법으로 두 동작을 비교할 수 있다.","why":["fault injection 테스팅은 결함 같은 불리한 조건에 대한 반응을 평가하는 접근법이다(4.2.3). 동작 비교 예로 나온 것은 back-to-back 테스팅이다.","3.2.2.2가 동작 비교에 든 접근법은 back-to-back 테스팅이다.","3.2.2.2가 동작 비교 접근법으로 든 예는 back-to-back 테스팅이다.","정답. 3.2.2.2가 동작 비교에 쓸 수 있는 접근법으로 든 예다(4.2.2 참조)."],"ref":"3.2.2.2"},{"id":"c3-113","ch":3,"lo":"AuT-3.2.2.2","k":1,"q":"SiL 테스트 환경의 실행 시간에 대한 설명으로 옳은 것은?","opts":["컴파일된 코드를 실행하므로 HiL처럼 항상 실시간으로 실행된다","시뮬레이션 시간은 늘 실시간보다 짧지만 실행 중 일시 정지는 할 수 없다","계산 방식과 환경 모델의 복잡도에 따라 시뮬레이션 시간이 실시간보다 짧을 수도 길 수도 있고, 실행을 언제든 일시 정지할 수 있다","실행을 일시 정지하면 래퍼의 access point가 사라져 처음부터 다시 실행해야 한다"],"ans":[2],"exp":"3.2.2.2: 테스터는 MiL과 마찬가지로 SiL에서도 시뮬레이션 시간으로 테스트를 실행한다. 계산 방식과 환경 모델의 복잡도에 따라 시뮬레이션 시간은 실시간보다 짧을 수도 길 수도 있다. 테스터는 언제든 실행을 일시 정지해 자세히 분석·평가할 수 있다.","why":["3.2.2.2: SiL은 MiL처럼 시뮬레이션 시간으로 실행한다. 항상 실시간인 것은 HiL이다(3.2.3.2).","3.2.2.2: 실시간보다 길어질 수도 있고, 언제든 일시 정지할 수 있다.","정답. 3.2.2.2 문장 그대로다.","3.2.2.2: 테스터는 언제든 실행을 일시 정지해 자세히 분석·평가할 수 있다."],"ref":"3.2.2.2"},{"id":"c3-114","ch":3,"lo":"AuT-3.2.3.1","k":1,"q":"HiL(hardware-in-the-loop) 테스트 환경에서 실제로는 연결되어 있지 않은 버스 참여자를 시뮬레이션하는 구성 요소는?","opts":["remaining bus","breakout box","FIU(fault insertion unit)","signal processing unit"],"ans":[0],"exp":"3.2.3.1이 든 HiL 구성 요소는 일곱 가지다. ① 여러 공급 전압을 설정하는 전원 공급 장치 ② 환경 모델이 도는 real-time capable computer ③ 환경 모델에 구현하지 않은 여러 실제 부품 ④ 신호 종류·진폭용 signal processing unit ⑤ 단선·단락을 시뮬레이션하는 FIU ⑥ 와이어링 하네스의 추가 접근 인터페이스인 breakout box ⑦ 존재하지 않는 버스 참여자를 시뮬레이션하는 remaining bus.","why":["정답. 3.2.3.1: remaining bus는 존재하지 않는 버스 참여자를 시뮬레이션한다.","breakout box는 와이어링 하네스의 추가 접근 인터페이스다(3.2.3.1).","FIU는 단선·단락을 시뮬레이션한다(3.2.3.1).","signal processing unit은 신호 종류와 신호 진폭을 다룬다(3.2.3.1)."],"ref":"3.2.3.1"},{"id":"c3-115","ch":3,"lo":"AuT-3.2.3.1","k":1,"q":"HiL 테스트 환경의 구성 요소와 그 역할을 바르게 짝지은 것을 두 개 고르시오.","opts":["전원 공급 장치(power supply) – 여러 공급 전압 설정","FIU(fault insertion unit) – 신호 종류와 신호 진폭 처리","breakout box – 와이어링 하네스의 추가 접근 인터페이스","signal processing unit – 환경 모델을 실행","real-time capable computer – 단선·단락 시뮬레이션"],"ans":[0,2],"exp":"3.2.3.1의 HiL 구성 요소와 역할: 전원 공급 장치는 여러 공급 전압 설정, real-time capable computer는 환경 모델 실행, 실제 부품은 환경 모델에 구현하지 않은 부분, signal processing unit은 신호 종류·진폭, FIU는 단선·단락 시뮬레이션, breakout box는 와이어링 하네스의 추가 접근 인터페이스, remaining bus는 없는 버스 참여자 시뮬레이션.","why":["정답. 3.2.3.1 목록 그대로다.","FIU는 단선·단락을 시뮬레이션한다. 신호 종류·진폭은 signal processing unit이 다룬다(3.2.3.1).","정답. 3.2.3.1 목록 그대로다.","환경 모델은 real-time capable computer에서 돈다(3.2.3.1).","단선·단락 시뮬레이션은 FIU가 맡는다(3.2.3.1)."],"ref":"3.2.3.1"},{"id":"c3-116","ch":3,"lo":"AuT-3.2.3.1","k":1,"q":"테스터가 HiL 테스트 환경으로 테스트를 실행할 수 있는 상황으로 실라버스가 설명하는 것은?","opts":["테스트 대상이 모델링 도구로 만든 모델로만 있는 경우","소스 코드를 특정 컴퓨터 아키텍처용으로 컴파일하고 래퍼를 만든 경우","요구사항 명세만 있고 설계나 구현은 아직 없는 경우","테스트 대상이 프로토타입으로 있거나 이미 완전히 개발된 경우"],"ans":[3],"exp":"3.2.3.1: 테스트 대상이 프로토타입으로 있거나 이미 완전히 개발되었으면 테스터는 HiL 테스트 환경으로 테스트를 실행할 수 있다. HiL에는 환경 모델에 구현하지 않은 실제 부품 여러 개도 들어간다.","why":["모델로만 있으면 MiL을 쓴다(3.2.1.1).","컴파일된 코드를 래퍼로 연결하는 것은 SiL이다(3.2.2.1).","HiL은 테스트 대상이 프로토타입이거나 완전히 개발되었을 때 쓴다(3.2.3.1).","정답. 3.2.3.1 첫 문장 그대로다."],"ref":"3.2.3.1"},{"id":"c3-117","ch":3,"lo":"AuT-3.2.3.2","k":2,"q":"HiL 테스트 환경에서 테스터가 access point와 그 연결을 잘 알아야 하는 이유로 실라버스가 설명하는 것은?","opts":["HiL에는 access point가 하나뿐이라 그 위치를 정확히 알아야 하기 때문이다","HiL의 access point는 다양하고, 테스트 대상에 잘못된 access point를 쓰면 테스트 결과가 쓸모없어질 수 있기 때문이다","HiL의 access point는 래퍼가 정하므로 래퍼 설정을 알아야 하기 때문이다","HiL에서는 테스트 대상 모델 안에 access point를 임의로 추가해야 하기 때문이다"],"ans":[1],"exp":"3.2.3.2: HiL 테스트 환경의 access point는 다양하다. 테스트 대상에 잘못된 access point를 쓰면 테스트 결과가 쓸모없어질 수 있다. 여러 access point와 그 연결을 알면 효과적인 테스트를 구현·실행·평가할 수 있다.","why":["3.2.3.2: HiL의 access point는 다양하다(diverse).","정답. 3.2.3.2 첫 문단 내용이다.","래퍼가 access point를 정하는 것은 SiL이다(3.2.2.1).","모델 안에 access point를 임의로 두는 것은 MiL이다(3.2.1.1)."],"ref":"3.2.3.2"},{"id":"c3-118","ch":3,"lo":"AuT-3.2.3.2","k":2,"q":"테스트 대상은 차체 제어 ECU, 게이트웨이 ECU, 계기판 ECU를 묶은 조합이다. 테스트의 초점은 이 ECU들 사이의 데이터 교환이다. 실라버스 구분에 따른 HiL 테스트 환경의 이름과 그 이유로 알맞은 것은?","opts":["component HiL: 각 ECU가 여러 소프트웨어 컴포넌트로 이루어져 있기 때문이다","component HiL: ECU 사이 데이터 교환은 단일 ECU 기능 테스트에 속하기 때문이다","system HiL: 테스트 대상이 여러 ECU의 조합이기 때문이다","system HiL: component HiL과 달리 system HiL만 실시간으로 실행되기 때문이다"],"ans":[2],"exp":"3.2.3.2: 테스트 대상이 ECU 하나면 component HiL, 여러 ECU의 조합이면 system HiL이다. component HiL로는 ECU(control unit)의 기능을 테스트하고, system HiL은 ECU 사이 데이터 교환과 시스템 테스팅에 초점을 둔다.","why":["component HiL의 component는 E/E 시스템 안의 ECU 하나를 뜻한다(3.2.3.2 각주 28). 테스트 대상이 ECU 하나일 때 component HiL이다.","component HiL은 단일 ECU(control unit)의 기능을 테스트한다. ECU 간 데이터 교환은 system HiL의 초점이다(3.2.3.2).","정답. 3.2.3.2: 여러 ECU 조합이 테스트 대상이면 system HiL이고, 초점은 ECU 간 데이터 교환과 시스템 테스팅이다.","3.2.3.2: HiL은 실제 하드웨어에서 소프트웨어가 돌기 때문에 항상 실시간으로 실행된다. component HiL도 마찬가지다."],"trap":"SW 테스트 업무에서 '컴포넌트'라고 하면 SW 컴포넌트나 유닛을 떠올리기 쉽다. component HiL의 component는 E/E 시스템 안의 ECU 하나를 가리킨다(3.2.3.2 각주 28).","ref":"3.2.3.2"},{"id":"c3-119","ch":3,"lo":"AuT-3.2.3.2","k":2,"q":"MiL·SiL과 달리 HiL 테스트 환경에서는 시뮬레이션 시간이 항상 실시간으로 흐르고 일시 정지나 중단을 할 수 없다. 실라버스가 설명하는 이유는?","opts":["환경 모델이 너무 복잡해서 시뮬레이션 시간으로는 계산할 수 없기 때문이다","ISO 26262 method table이 HiL을 실시간으로 운영하도록 요구하기 때문이다","remaining bus가 버스 타이밍을 정하기 때문이며, 버스를 끊으면 일시 정지할 수 있다","소프트웨어가 실제 하드웨어에서 실행되기 때문이다"],"ans":[3],"exp":"3.2.3.2: HiL에서는 소프트웨어가 실제 하드웨어에서 돌기 때문에 시뮬레이션 시간이 항상 실시간으로 흐르고, 일시 정지나 중단을 할 수 없다. 그래서 HiL 테스트 환경에는 정해진 시간 안에 모든 관련 신호를 모으고 내보낼 수 있는 real-time capable computer가 들어간다.","why":["3.2.3.2가 든 이유는 소프트웨어가 실제 하드웨어에서 돈다는 점이다. 환경 모델 복잡도는 이유로 나오지 않는다.","3.2.4.3은 method table이 ASIL에 따라 테스트 환경을 권장한다고만 한다. HiL이 실시간인 이유는 실제 하드웨어다(3.2.3.2).","3.2.3.2: HiL에서는 일시 정지나 중단이 불가능하다. 이유는 소프트웨어가 실제 하드웨어에서 돌기 때문이다.","정답. 3.2.3.2가 든 이유 그대로다."],"ref":"3.2.3.2"},{"id":"c3-120","ch":3,"lo":"AuT-3.2.3.2","k":2,"q":"HiL 테스트 환경의 적용 영역에 대한 설명으로 옳은 것은?","opts":["컴포넌트 테스팅(component testing), 통합 테스팅, 시스템 테스팅에 쓸 수 있고, 목적에는 소프트웨어와 하드웨어의 기능·비기능 결함을 찾는 것이 들어간다","시스템 테스팅에만 쓸 수 있다","하드웨어 결함만 찾는다. 소프트웨어 결함은 SiL에서 모두 찾는다","실제 하드웨어가 환경 모델을 대신하므로 MiL·SiL보다 구성이 단순하다"],"ans":[0],"exp":"3.2.3.2: HiL 테스트 환경은 컴포넌트 테스팅, 통합 테스팅, 시스템 테스팅에 쓸 수 있다. 여러 목적 가운데 하나는 소프트웨어와 하드웨어의 기능·비기능 결함을 찾는 것이다. 구성 요소가 여러 개라 MiL·SiL보다 복잡하다.","why":["정답. 3.2.3.2 문장 그대로다.","3.2.3.2: HiL은 컴포넌트 테스팅, 통합 테스팅, 시스템 테스팅에 쓸 수 있다.","3.2.3.2: HiL의 목적에는 소프트웨어와 하드웨어의 기능·비기능 결함을 찾는 것이 들어간다.","3.2.3.2: HiL은 구성 요소가 여러 개라 MiL·SiL보다 복잡하고, 테스터는 이 복잡성을 다룰 수 있어야 한다. HiL에도 환경 모델이 있다(3.2.3.1)."],"ref":"3.2.3.2"},{"id":"c3-121","ch":3,"lo":"AuT-3.2.4.1","k":2,"q":"실라버스 표 3의 기준 '테스트 대상에 대한 접근(access to the test object)'을 바르게 요약한 것은?","opts":["HiL이 가장 높다. 실제 하드웨어와 breakout box가 있어 모든 내부 신호를 관찰할 수 있다","MiL은 모델의 모든 신호를 관찰·제어할 수 있어 접근성이 가장 높고, HiL은 하드웨어나 통신 프로토콜로 제공되는 신호만 다룰 수 있어 가장 낮다","SiL이 가장 높다. 래퍼가 소스 코드의 모든 변수를 자동으로 노출한다","세 환경의 접근성은 같다. access point 수는 테스트 도구가 정한다"],"ans":[1],"exp":"3.2.4.1 표 3의 'access to the test object' 행: MiL은 모델의 모든 신호를 관찰·제어할 수 있다(High). SiL은 래퍼에 있는 신호만 관찰·제어할 수 있다(Medium). HiL은 하드웨어나 통신 프로토콜로 제공되는 신호만 관찰·제어할 수 있다(Low).","why":["표 3: HiL은 하드웨어나 통신 프로토콜로 제공되는 신호만 관찰·제어할 수 있어 Low다.","정답. 표 3에서 접근성은 MiL High, SiL Medium, HiL Low다.","표 3: SiL은 래퍼에 있는 신호만 관찰·제어할 수 있어 Medium이다.","표 3은 접근성을 MiL High, SiL Medium, HiL Low로 구분한다."],"trap":"HiL 장비는 측정 채널과 breakout box가 많아 '가장 많이 볼 수 있는 환경'으로 느끼기 쉽다. 표 3 기준 테스트 대상 접근성은 MiL High, SiL Medium, HiL Low다(3.2.4.1).","ref":"3.2.4.1"},{"id":"c3-122","ch":3,"lo":"AuT-3.2.4.1","k":2,"q":"프로젝트 초기라 명세가 아직 불완전하다. 실라버스 표 3의 기준 '테스트 베이시스(명세)에 필요한 상세 수준(necessary level of detail of the test basis)'에 맞는 설명은?","opts":["MiL에서는 불완전한 명세를 부분적으로 다루는 모델도 테스트할 수 있다","HiL은 필요한 상세 수준이 가장 낮아 불완전한 명세로 테스트하기에 알맞다","SiL은 상세 컴포넌트 명세 없이 시스템 레벨 요구사항만 있으면 된다","세 환경 모두 시작하기 전에 완전한 시스템 명세가 있어야 한다"],"ans":[0],"exp":"3.2.4.1 표 3의 'necessary level of detail of the test basis' 행: MiL은 불완전한 명세를 부분적으로 다루는 모델을 테스트한다(Medium). SiL은 소프트웨어 레벨의 관련 정보(예: 상세 컴포넌트 명세)가 있어야 한다(Medium to high). HiL은 완전한 시스템 명세로 시스템 레벨 요구사항을 테스트한다(High).","why":["정답. 표 3: MiL은 '불완전한 명세를 부분적으로 다루는 모델을 테스트한다'(Medium).","표 3: HiL은 완전한 시스템 명세로 시스템 레벨 요구사항을 테스트한다(High).","표 3: SiL은 소프트웨어 레벨의 관련 정보(예: 상세 컴포넌트 명세)가 있어야 한다(Medium to high).","표 3: 완전한 시스템 명세가 필요한 것은 HiL이고, MiL은 불완전한 명세를 부분적으로 다루는 모델로도 테스트한다."],"ref":"3.2.4.1"},{"id":"c3-123","ch":3,"lo":"AuT-3.2.4.1","k":2,"q":"실라버스 표 3의 기준 '테스트 대상에 필요한 성숙도(necessary level of maturity of the test object)'에서 SiL에 해당하는 설명은?","opts":["시스템 모델을 시뮬레이션한다","실행 가능한 ECU 하나 이상이나 부분 시스템을 최대한 전체로 테스트한다","타깃 소프트웨어로 초기 기능을 테스트한다","완성 차량 전체가 준비되어야 테스트할 수 있다"],"ans":[2],"exp":"3.2.4.1 표 3의 'necessary level of maturity of the test object' 행: MiL은 시스템 모델을 시뮬레이션한다(Low). SiL은 타깃 소프트웨어로 초기 기능을 테스트한다(Medium). HiL은 실행 가능한 ECU 하나 이상이나 부분 시스템을 최대한 전체로 테스트한다(High).","why":["표 3에서 MiL에 해당한다(Low).","표 3에서 HiL에 해당한다(High).","정답. 표 3: SiL은 '타깃 소프트웨어로 초기 기능을 테스트한다'(Medium).","표 3에 없는 내용이다. SiL은 타깃 소프트웨어로 초기 기능을 테스트하는 수준이다(Medium)."],"ref":"3.2.4.1"},{"id":"c3-124","ch":3,"lo":"AuT-3.2.4.1","k":2,"q":"실라버스 표 3의 내용을 바르게 요약한 것을 두 개 고르시오.","opts":["구현·유지보수 노력: MiL은 환경 모델과 래퍼를 만들어야 하므로 Medium이다","디버깅 시간과 노력: HiL에서 찾은 결함은 시스템 레벨에서 발견되어 시스템 조정이 필요하므로 High다","현실과의 근접성: SiL은 실행 가능한 통합 시스템이므로 High다","테스트 준비 노력: HiL은 테스트 설계·구현·평가에 많은 노력이 들어 High다","디버깅 시간과 노력: MiL에서 찾은 결함은 소프트웨어 조정이 필요하므로 Medium이다"],"ans":[1,3],"exp":"3.2.4.1 표 3에서 MiL→SiL→HiL로 갈수록 디버깅 노력은 모델 조정(Low)→소프트웨어 조정(Medium)→시스템 조정(High)으로 커진다. 테스트 준비 노력도 MiL Low, SiL Medium(둘 다 '환경을 빠르게 구성할 수 있다'), HiL High(테스트 설계·구현·평가에 많은 노력)다. 구현·유지보수 노력은 MiL 환경 모델(Low), SiL 환경 모델과 래퍼(Medium), HiL 환경 모델과 하드웨어 배선(High)이다.","why":["표 3: 환경 모델과 래퍼를 만드는 것은 SiL(Medium)이다. MiL은 환경 모델만 만든다(Low).","정답. 표 3 'time and effort in debugging' 행의 HiL 내용이다.","표 3: 실행 가능한 통합 시스템은 HiL(High)이다. SiL은 하드웨어 없이 컴파일된 실제 소프트웨어를 실행한다(Low to medium).","정답. 표 3 'effort for test preparation' 행의 HiL 내용이다.","표 3: 소프트웨어 조정은 SiL(Medium)이다. MiL은 테스트 대상 모델에서 결함을 찾아 모델을 조정한다(Low)."],"ref":"3.2.4.1"},{"id":"c3-125","ch":3,"lo":"AuT-3.2.4.2","k":3,"q":"테스트 계획을 세우는 중이다. 이번 단계에는 MiL 테스트 환경만 준비되어 있다. 아래 세 테스트 범위 가운데 표 4에서 MiL이 not sensible(-)로 표시되어 MiL에 배정하지 말아야 할 것을 모두 고른 것은?\nA. 운전석 디스플레이가 사용자의 유용성 요구사항을 만족하는지 입증\nB. 결함이 defect memory에 올바르게 기록되는지 등 진단 기능 테스트\nC. variant별 구성 데이터(configuration data)가 테스트 대상 동작에 주는 영향 확인\n표 4(실라버스 3.2.4.2) 기호: + recommended(권장), o possible(가능), - not sensible(적절하지 않음).","table":{"head":["테스트 목적(test objective)","설명(예)","MiL","SiL","HiL"],"rows":[["고객 요구사항 테스트","요구 기능을 올바르게 제공한다. 입력의 올바른 처리, 입력에 대한 올바른 반응, 출구 지점의 올바른 데이터 출력을 포함한다.","o","o","+"],["결함 탐지·처리 메커니즘 테스트","랜덤 하드웨어 결함의 탐지·처리, 소프트웨어 결함의 탐지·처리, 결함 탐지 후 안전 상태로 전환(예: 시스템 비활성화)","+","+","+"],["구성 데이터(configuration data)에 대한 반응 테스트","구성 데이터가 테스트 대상의 동작에 주는 영향 확인","o","+","+"],["진단 기능 테스트","결함 탐지, 결함 활성화와 리셋 요구, defect memory의 결함 활성화(예: OBD 또는 정비소) 등 요구된 진단 기능을 올바르게 제공한다.","-","+","+"],["인터페이스 상호작용 테스트","테스트 대상의 내부·외부 인터페이스 확인","o","+","+"],["유용성(usability) 입증","테스트 대상이 사용자의 유용성 요구사항을 만족해야 한다.","-","o","+"]]},"opts":["A만","A, B","B, C","A, B, C"],"ans":[1],"exp":"풀이(표 4, 3.2.4.2)\n① A는 '유용성 입증' 행이다. MiL = -.\n② B는 '진단 기능 테스트' 행이다. MiL = -.\n③ C는 '구성 데이터에 대한 반응 테스트' 행이다. MiL = o(가능).\n④ 따라서 MiL에 배정하지 말아야 할 것은 A, B다.\n검산 1: 표 4의 MiL 열에서 -인 행은 진단 기능 테스트와 유용성 입증 두 개뿐이다. A, B와 일치한다.\n검산 2: C를 넣은 보기는 o를 -로 읽은 것이고, A를 뺀 보기는 유용성 행을 놓친 것이다.\n원문 표 4의 일부 칸은 대문자 O로 인쇄되어 있지만 범례에는 o(possible)만 있어 o로 옮겼다.","why":["B(진단 기능 테스트)도 MiL이 -다.","정답. A(유용성 입증)와 B(진단 기능 테스트)는 MiL이 -다.","C(구성 데이터에 대한 반응 테스트)는 MiL이 o(possible)다. A(유용성 입증)는 -인데 빠졌다.","C(구성 데이터에 대한 반응 테스트)는 MiL이 o(possible)라 배정할 수 있다."],"ref":"3.2.4.2"},{"id":"c3-126","ch":3,"lo":"AuT-3.2.4.2","k":3,"q":"이 프로젝트는 MiL → SiL → HiL 순서로 테스트 환경이 준비된다. 테스터는 '구성 데이터에 대한 반응 테스트'를 표 4에서 recommended(+)인 환경 가운데 가장 먼저 준비되는 환경에 배정하려 한다. 배정할 환경과 이유로 알맞은 것은?\n표 4(실라버스 3.2.4.2) 기호: + recommended(권장), o possible(가능), - not sensible(적절하지 않음).","table":{"head":["테스트 목적(test objective)","설명(예)","MiL","SiL","HiL"],"rows":[["고객 요구사항 테스트","요구 기능을 올바르게 제공한다. 입력의 올바른 처리, 입력에 대한 올바른 반응, 출구 지점의 올바른 데이터 출력을 포함한다.","o","o","+"],["결함 탐지·처리 메커니즘 테스트","랜덤 하드웨어 결함의 탐지·처리, 소프트웨어 결함의 탐지·처리, 결함 탐지 후 안전 상태로 전환(예: 시스템 비활성화)","+","+","+"],["구성 데이터(configuration data)에 대한 반응 테스트","구성 데이터가 테스트 대상의 동작에 주는 영향 확인","o","+","+"],["진단 기능 테스트","결함 탐지, 결함 활성화와 리셋 요구, defect memory의 결함 활성화(예: OBD 또는 정비소) 등 요구된 진단 기능을 올바르게 제공한다.","-","+","+"],["인터페이스 상호작용 테스트","테스트 대상의 내부·외부 인터페이스 확인","o","+","+"],["유용성(usability) 입증","테스트 대상이 사용자의 유용성 요구사항을 만족해야 한다.","-","o","+"]]},"opts":["MiL: 세 환경 모두 +(recommended)이므로 가장 먼저 준비되는 MiL에 배정한다","HiL: MiL과 SiL은 -(not sensible)이고 HiL만 +이기 때문","HiL: SiL은 o(possible)이고 HiL만 +이기 때문","SiL: MiL은 o(possible)이고 SiL부터 +(recommended)이기 때문"],"ans":[3],"exp":"풀이(표 4, 3.2.4.2)\n① '구성 데이터에 대한 반응 테스트' 행을 찾는다: MiL o, SiL +, HiL +.\n② +인 환경은 SiL과 HiL이다.\n③ 준비 순서 MiL → SiL → HiL에서 둘 중 먼저 오는 것은 SiL이다.\n검산 1: MiL은 o라 '권장' 조건에서 빠진다. 남은 SiL·HiL 가운데 순서상 첫째가 SiL이다.\n검산 2: 다른 보기는 행 값을 잘못 읽었다(MiL을 +로, SiL을 - 또는 o로).\n원문 표 4의 일부 칸은 대문자 O로 인쇄되어 있지만 범례에는 o(possible)만 있어 o로 옮겼다.","why":["구성 데이터 행에서 MiL은 o(possible)다. 세 환경 모두 +인 행은 결함 탐지·처리 메커니즘 테스트다.","구성 데이터 행에서 MiL은 o, SiL은 +다. -가 아니다.","구성 데이터 행에서 SiL은 +다. SiL o, HiL +인 행은 유용성 입증이다.","정답. 구성 데이터 행은 MiL o, SiL +, HiL +다."],"ref":"3.2.4.2"},{"id":"c3-127","ch":3,"lo":"AuT-3.2.4.2","k":3,"q":"테스터는 '고객 요구사항 테스트'와 '인터페이스 상호작용 테스트'를 한 테스트 환경에 묶어 실행하려 한다. 표 4에서 두 테스트 목적이 모두 recommended(+)인 환경은?\n표 4(실라버스 3.2.4.2) 기호: + recommended(권장), o possible(가능), - not sensible(적절하지 않음).","table":{"head":["테스트 목적(test objective)","설명(예)","MiL","SiL","HiL"],"rows":[["고객 요구사항 테스트","요구 기능을 올바르게 제공한다. 입력의 올바른 처리, 입력에 대한 올바른 반응, 출구 지점의 올바른 데이터 출력을 포함한다.","o","o","+"],["결함 탐지·처리 메커니즘 테스트","랜덤 하드웨어 결함의 탐지·처리, 소프트웨어 결함의 탐지·처리, 결함 탐지 후 안전 상태로 전환(예: 시스템 비활성화)","+","+","+"],["구성 데이터(configuration data)에 대한 반응 테스트","구성 데이터가 테스트 대상의 동작에 주는 영향 확인","o","+","+"],["진단 기능 테스트","결함 탐지, 결함 활성화와 리셋 요구, defect memory의 결함 활성화(예: OBD 또는 정비소) 등 요구된 진단 기능을 올바르게 제공한다.","-","+","+"],["인터페이스 상호작용 테스트","테스트 대상의 내부·외부 인터페이스 확인","o","+","+"],["유용성(usability) 입증","테스트 대상이 사용자의 유용성 요구사항을 만족해야 한다.","-","o","+"]]},"opts":["HiL","MiL","SiL","SiL과 HiL 어느 쪽이든"],"ans":[0],"exp":"풀이(표 4, 3.2.4.2)\n① 고객 요구사항 테스트 행: MiL o, SiL o, HiL +. +인 환경은 HiL뿐이다.\n② 인터페이스 상호작용 테스트 행: MiL o, SiL +, HiL +. +인 환경은 SiL, HiL이다.\n③ 두 집합의 공통은 HiL이다.\n검산 1: 표 4 HiL 열은 모든 행이 +이므로 HiL은 어떤 조합이든 조건을 만족한다.\n검산 2: SiL 열에서 고객 요구사항 행은 o다. 따라서 SiL을 포함한 보기는 틀리다.\n원문 표 4의 일부 칸은 대문자 O로 인쇄되어 있지만 범례에는 o(possible)만 있어 o로 옮겼다.","why":["정답. 고객 요구사항 테스트는 HiL만 +이고, 인터페이스 상호작용 테스트도 HiL이 +다.","MiL은 고객 요구사항 테스트와 인터페이스 상호작용 테스트 모두 o(possible)다.","SiL은 인터페이스 상호작용 테스트가 +지만 고객 요구사항 테스트는 o(possible)다.","SiL은 고객 요구사항 테스트가 o(possible)라 조건을 만족하지 못한다."],"trap":"SiL에서 기능을 다 확인했으면 고객 요구사항 테스트도 SiL로 충분하다고 여기기 쉽다. 표 4에서 고객 요구사항 테스트는 MiL·SiL이 o(possible)이고 HiL만 +(recommended)다(3.2.4.2).","ref":"3.2.4.2"},{"id":"c3-128","ch":3,"lo":"AuT-3.2.4.2","k":3,"q":"테스트 관리 도구에 테스트 범위를 환경별로 '권장(+)'으로 배정하려 한다. 표 4에 비추어 올바른 배정을 두 개 고르시오.\n표 4(실라버스 3.2.4.2) 기호: + recommended(권장), o possible(가능), - not sensible(적절하지 않음).","table":{"head":["테스트 목적(test objective)","설명(예)","MiL","SiL","HiL"],"rows":[["고객 요구사항 테스트","요구 기능을 올바르게 제공한다. 입력의 올바른 처리, 입력에 대한 올바른 반응, 출구 지점의 올바른 데이터 출력을 포함한다.","o","o","+"],["결함 탐지·처리 메커니즘 테스트","랜덤 하드웨어 결함의 탐지·처리, 소프트웨어 결함의 탐지·처리, 결함 탐지 후 안전 상태로 전환(예: 시스템 비활성화)","+","+","+"],["구성 데이터(configuration data)에 대한 반응 테스트","구성 데이터가 테스트 대상의 동작에 주는 영향 확인","o","+","+"],["진단 기능 테스트","결함 탐지, 결함 활성화와 리셋 요구, defect memory의 결함 활성화(예: OBD 또는 정비소) 등 요구된 진단 기능을 올바르게 제공한다.","-","+","+"],["인터페이스 상호작용 테스트","테스트 대상의 내부·외부 인터페이스 확인","o","+","+"],["유용성(usability) 입증","테스트 대상이 사용자의 유용성 요구사항을 만족해야 한다.","-","o","+"]]},"opts":["인터페이스 상호작용 테스트 → SiL에 권장(+)으로 배정","진단 기능 테스트 → MiL에 권장(+)으로 배정","고객 요구사항 테스트 → SiL에 권장(+)으로 배정","구성 데이터에 대한 반응 테스트 → MiL에 권장(+)으로 배정","유용성 입증 → HiL에 권장(+)으로 배정"],"ans":[0,4],"exp":"풀이(표 4, 3.2.4.2): 보기마다 해당 행과 열의 기호가 +인지 확인한다.\n① 인터페이스 상호작용 × SiL = + → 맞음\n② 유용성 입증 × HiL = + → 맞음\n③ 진단 기능 × MiL = - → 틀림\n④ 고객 요구사항 × SiL = o → 틀림\n⑤ 구성 데이터 × MiL = o → 틀림\n검산 1: 표 4에서 MiL이 +인 행은 결함 탐지·처리 메커니즘 테스트 하나뿐이다. MiL에 +로 배정한 두 보기는 모두 틀리다.\n검산 2: SiL이 +가 아닌 행은 고객 요구사항(o), 유용성(o)이다. 인터페이스는 여기에 없으므로 SiL + 배정이 맞다.\n원문 표 4의 일부 칸은 대문자 O로 인쇄되어 있지만 범례에는 o(possible)만 있어 o로 옮겼다.","why":["정답. 인터페이스 상호작용 테스트 행의 SiL은 +다.","진단 기능 테스트 행의 MiL은 -(not sensible)다.","고객 요구사항 테스트 행의 SiL은 o(possible)다.","구성 데이터에 대한 반응 테스트 행의 MiL은 o(possible)다.","정답. 유용성 입증 행의 HiL은 +다."],"ref":"3.2.4.2"},{"id":"c3-129","ch":3,"lo":"AuT-3.2.4.2","k":3,"q":"테스트 관리자가 아래 세 종류의 결함을 어느 환경에서 주로 찾을지 정하려 한다. 실라버스가 표 4 아래에서 각 테스트 환경의 주된 용도로 설명한 내용에 맞게 짝지은 것은?\nA. 제어 로직의 일반적인 설계 결함\nB. 고정소수점 데이터 타입 때문에 생긴 연산 차이처럼, 컴파일된 소프트웨어의 기술적 결함\nC. 소프트웨어를 실제 ECU 하드웨어에서 실행해야 드러나는 하드웨어/소프트웨어 기술적 결함","opts":["A: SiL, B: MiL, C: HiL","A: MiL, B: HiL, C: SiL","A: MiL, B: SiL, C: HiL","A: HiL, B: SiL, C: MiL"],"ans":[2],"exp":"풀이(3.2.4.2 표 4 아래 설명)\n① 시프트 레프트(shift left)에 따라 기본적인 요구사항·설계 결함은 테스트로 일찍 찾는다.\n② 그래서 MiL은 일반 설계 결함 탐지에, SiL은 주로 기술적 소프트웨어 결함에, HiL은 기술적 하드웨어/소프트웨어 결함에 쓴다.\n③ A는 일반 설계 결함 → MiL. B는 컴파일된 코드의 기술적 소프트웨어 결함 → SiL(데이터 타입 차이를 SiL에서 처음 테스트할 수 있다는 3.2.2.2와도 맞다). C는 하드웨어/소프트웨어 결함 → HiL.\n검산 1: 각 환경이 정확히 한 번씩 쓰였고, 보기 가운데 이 조합은 하나뿐이다.\n검산 2: 역으로 MiL·SiL·HiL의 용도를 A·B·C 설명에 대 보면 MiL-설계, SiL-소프트웨어, HiL-하드웨어/소프트웨어로 같다.\n(v2.1 기준. 2018년판에서는 같은 원칙을 'Front-loading'이라고 불렀다.)","why":["일반 설계 결함은 MiL, 기술적 소프트웨어 결함은 SiL이다. A와 B가 바뀌었다.","기술적 소프트웨어 결함은 SiL, 하드웨어/소프트웨어 결함은 HiL이다. B와 C가 바뀌었다.","정답. MiL은 일반 설계 결함, SiL은 주로 기술적 소프트웨어 결함, HiL은 기술적 하드웨어/소프트웨어 결함이다(3.2.4.2).","MiL은 일반 설계 결함, HiL은 하드웨어/소프트웨어 결함이다. A와 C가 바뀌었다."],"ref":"3.2.4.2"},{"id":"c3-130","ch":3,"lo":"AuT-3.2.4.3","k":1,"q":"V-모델(V-model)에서 SiL 테스트 환경의 위치에 대한 설명으로 옳은 것은?","opts":["V-모델 왼쪽에서 technical system design을 테스트하는 데 쓴다","테스트 대상의 특정 기능이 완전히 개발된 뒤 시스템 테스팅을 실행하는 대표 환경이다","HiL 시스템 테스팅이 끝난 뒤 인수 테스팅을 위해 쓴다","테스트 대상의 단일 컴포넌트를 프로그래밍하고 컴파일했을 때 쓰며, 대표 테스트는 V-모델 오른쪽의 컴포넌트 테스팅과 통합 테스팅이다"],"ans":[3],"exp":"3.2.4.3: 테스트 대상의 단일 컴포넌트를 프로그래밍하고 컴파일했으면 SiL 테스트 환경을 쓸 수 있다. SiL의 대표 테스트는 컴포넌트 테스팅과 통합 테스팅이고, V-모델 오른쪽에 있다.","why":["V-모델 왼쪽의 technical system design을 테스트하는 것은 MiL이다(3.2.4.3).","시스템 테스팅을 실행하는 환경은 HiL이다(3.2.4.3).","3.2.4.3은 SiL의 대표 테스트를 컴포넌트 테스팅과 통합 테스팅으로 든다.","정답. 3.2.4.3의 SiL 설명 그대로다."],"ref":"3.2.4.3"},{"id":"c3-131","ch":3,"lo":"AuT-3.2.4.3","k":1,"q":"테스트 환경을 테스트 레벨에 올바르게 배정하면 전체 테스트 프로세스를 세 가지 측면에서 최적화할 수 있다. 이 가운데 '표준 적합성(conformity to standards)' 측면으로 실라버스가 든 내용은?","opts":["테스트를 더 이르고 비용이 적은 가상 테스트 레벨로 옮긴다","HiL 환경의 시스템 레벨에서 수행 효율성 같은 테스트 레벨별 장애 유형을 찾는다","ISO 26262의 method table은 ASIL에 따라 테스트 환경을 권장한다","모든 테스트 레벨에서 같은 테스트 환경을 써서 결과 비교를 쉽게 한다"],"ans":[2],"exp":"3.2.4.3의 세 측면: ① 제품 리스크 최소화: 테스트 레벨별 장애 유형 찾기(예: HiL에서 시스템 레벨의 수행 효율성) ② 테스트 비용 최소화: 테스트를 더 이르고 비용이 적은 가상 테스트 레벨로 옮기기 등 ③ 표준 적합성: ISO 26262 method table은 ASIL에 따라 테스트 환경을 권장한다.","why":["테스트 비용 최소화(minimizing the test cost) 측면이다(3.2.4.3).","제품 리스크 최소화(minimizing the product risks) 측면이다(3.2.4.3).","정답. 3.2.4.3의 표준 적합성 항목 그대로다.","3.2.4.3에 없는 내용이다. 실라버스는 테스트 레벨마다 알맞은 환경을 배정하라고 한다."],"ref":"3.2.4.3"},{"id":"c3-132","ch":3,"lo":"AuT-3.2.4.3","k":1,"q":"V-모델에서 MiL 테스트 환경의 위치에 대한 설명으로 옳은 것은?","opts":["단일 컴포넌트를 프로그래밍하고 컴파일한 뒤에만 쓸 수 있다","V-모델 왼쪽의 설계를 테스트하고, 모델과 테스트 환경을 더 발전시키면 컴포넌트 테스팅과 통합 테스팅도 실행할 수 있다","특정 기능이 완전히 개발된 뒤 시스템 테스팅을 실행하는 대표 환경이다","모델은 컴파일되지 않았으므로 V-모델의 어떤 테스트 레벨에도 배치되지 않는다"],"ans":[1],"exp":"3.2.4.3: V-모델 왼쪽에 있는 technical system design은 MiL 테스트 환경으로 테스트할 수 있다. 모델과 테스트 환경을 더 발전시키면 같은 환경으로 컴포넌트 테스팅과 통합 테스팅도 실행할 수 있다. (3.2.1.2는 MiL로 functional system design을 테스트한다고 쓴다. 두 곳 모두 V-모델 왼쪽 설계를 가리키고, 이 문제는 둘의 차이를 묻지 않는다.)","why":["컴파일된 단일 컴포넌트가 있을 때 쓰는 것은 SiL이다(3.2.4.3).","정답. 3.2.4.3의 MiL 설명 그대로다.","시스템 테스팅을 실행하는 환경은 HiL이다(3.2.4.3).","3.2.4.3: MiL은 V-모델 왼쪽의 설계를 테스트하고 컴포넌트·통합 테스팅도 실행할 수 있다."],"ref":"3.2.4.3"},{"id":"c4-001","ch":4,"lo":"AuT-4.1.1","k":2,"q":"MISRA-C는 코딩 가이드라인(coding guideline)을 rule과 directive 두 종류로 나눈다. 두 종류에 대한 설명으로 옳은 것은?","opts":["'소스 코드에 중첩 주석을 넣지 않는다'는 SW 바깥의 문서를 다루므로 directive의 예다.","rule은 개발 프로세스의 세부 사항을 다루므로 사람이 하는 리뷰로만 검증할 수 있다.","'개발자는 구현한 동작을 충분히 문서화한다'는 directive의 예이며, 정적 분석(static analysis) 도구만으로는 완전히 검증되지 않는다.","directive는 정적 분석 도구로 완전히 검증되므로 별도의 리뷰가 필요 없다."],"ans":[2],"exp":"4.1.1: rule은 정적 분석 도구로 검증할 수 있다(예: 소스 코드에 중첩 주석을 넣지 않는다). directive는 개발 프로세스나 SW 바깥 문서의 세부 사항을 다루므로 정적 분석 도구로 완전히 검증되지 않는다(예: 개발자는 구현한 동작을 충분히 문서화한다). 6장 용어 정의도 rule은 '정적 분석으로 완전히 검증할 수 있는', directive는 '완전히 검증할 수 없는' 가이드라인으로 정의한다.","why":["중첩 주석 금지는 실라버스가 든 rule의 예다. 소스 코드 자체를 보므로 정적 분석 도구로 검증된다.","개발 프로세스의 세부 사항을 다루는 쪽은 directive다. rule은 정적 분석 도구로 검증할 수 있다.","정답. 실라버스가 든 directive의 예이며, directive는 정적 분석 도구로 완전히 검증되지 않는다(4.1.1).","반대다. 정적 분석 도구로 완전히 검증되지 않는 것이 directive다."],"trap":"현업에서는 정적 분석 도구 리포트에 MISRA 위반이 없으면 MISRA를 다 지켰다고 보기 쉽다. 실라버스는 directive가 정적 분석 도구로 완전히 검증되지 않는다고 한다(4.1.1). 도구로 평가할 수 없는 부분은 리뷰로 다룬다(2.1.2.5의 SW 유닛 검증 수단 예).","ref":"4.1.1"},{"id":"c4-002","ch":4,"lo":"AuT-4.1.1","k":2,"q":"어느 프로젝트에서 MISRA-C 가이드라인 하나가 다음과 같이 다뤄진다.\n- 개발자는 이 가이드라인을 따라야 한다.\n- 예외를 둘 수는 있지만, 품질 관리 부서의 공식 승인을 받아야 한다.\n이 가이드라인의 의무 수준(level of obligation)은?","opts":["mandatory","required","advisory","directive"],"ans":[1],"exp":"4.1.1의 세 의무 수준: advisory는 노력이 합리적이면 개발자가 따라야 한다. required는 개발자가 따라야 하고, 예외는 가능하지만 공식 승인(예: 품질 관리)을 받아야 한다. mandatory는 개발자가 따라야 하고 예외가 없다. '따라야 함 + 공식 승인을 받은 예외 가능'은 required다. (v2.1 기준. 2018년판에서는 required를 '개발자가 납득할 만하게 설명할 수 있을 때만 무시할 수 있다'고 했고 공식 승인 조건은 없었다.)","why":["mandatory는 예외가 전혀 없다. 승인을 받아도 예외를 둘 수 없다.","정답. 따라야 하지만 공식 승인을 받은 예외가 가능한 수준이 required다.","advisory는 노력이 합리적이면 따르는 수준이다. 예외에 공식 승인을 요구하는 것은 required다.","directive는 의무 수준이 아니라 가이드라인의 종류(rule/directive) 중 하나다."],"ref":"4.1.1"},{"id":"c4-003","ch":4,"lo":"AuT-4.1.1","k":2,"q":"실라버스가 설명하는 코딩 가이드라인 준수의 목적으로 옳은 것은?","opts":["코딩 가이드라인을 지키면 안전 관련 SW에서도 동적 테스팅을 생략할 수 있다.","코딩 가이드라인은 단위 테스트 케이스가 달성해야 할 구조 커버리지 목표를 정한다.","코딩 가이드라인은 C 언어로 작성하는 테스트 스크립트의 작성 규칙이다.","결함으로 이어질 수 있는 코드의 이상 사항(anomaly)을 피하게 돕고, 유지 가능성(maintainability)과 이동성(portability)을 높인다."],"ans":[3],"exp":"4.1.1: 소스 코드가 코딩 가이드라인을 지키는 것은 state of the art이고, ISO 26262도 안전 관련 SW에 코딩 가이드라인 준수를 권고한다. 코딩 가이드라인은 결함으로 이어질 수 있는 코드의 이상 사항을 피하게 돕고, 동시에 유지 가능성과 이동성을 뒷받침한다.","why":["실라버스는 코딩 가이드라인을 정적 테스팅으로 다룰 뿐, 동적 테스팅을 대신한다고 하지 않는다. SW 유닛 검증 수단에도 정적 분석과 단위 테스트 케이스가 따로 들어 있다(2.1.2.5).","구조 커버리지 목표는 코딩 가이드라인이 다루는 내용이 아니다. 코딩 가이드라인은 소스 코드를 어떻게 쓸지에 대한 지침이다.","MISRA-C는 C 프로그래밍 언어로 쓰는 SW 소스 코드용 가이드라인이다. 테스트 스크립트 규칙이 아니다.","정답. 4.1.1이 든 목적 그대로다."],"ref":"4.1.1"},{"id":"c4-004","ch":4,"lo":"AuT-4.1.1","k":2,"q":"공급업체(supplier) B는 일정이 빠듯하다는 이유로, MISRA-C에서 required로 분류된 가이드라인 하나를 사내 코딩 규정에서 advisory로 낮춰 적용하려 한다. 실라버스 기준으로 옳은 판단은?","opts":["허용되지 않는다. 조직은 가이드라인의 의무 수준을 올릴 수는 있지만 낮출 수는 없다.","허용된다. 품질 관리 부서가 공식 승인하면 조직 차원에서 의무 수준을 낮출 수 있다.","허용된다. 의무 수준은 조직이 프로젝트 사정에 맞게 자유롭게 정한다.","허용되지 않는다. 의무 수준은 MISRA-C가 정한 그대로 써야 하며 조직은 올릴 수도 낮출 수도 없다."],"ans":[0],"exp":"4.1.1: 조직은 가이드라인의 의무 수준을 개별적으로 올릴 수 있지만 절대 낮출 수 없다. 그래서 required를 advisory로 바꾸는 것은 허용되지 않는다. 결론이 같아도 '올릴 수도 없다'는 이유는 틀렸다.","why":["정답. 조직은 의무 수준을 올릴 수만 있다(4.1.1).","공식 승인은 required 가이드라인에 개별 예외를 둘 때의 조건이다(v2.1 기준). 의무 수준 자체를 낮추는 것은 승인이 있어도 허용되지 않는다.","조직은 의무 수준을 올릴 수만 있다. 자유롭게 정하는 것이 아니다.","결론은 맞지만 이유가 틀렸다. 조직은 의무 수준을 올릴 수는 있다."],"trap":"현업에서는 프로젝트 사정에 맞춰 코딩 규칙의 적용 수준을 조정하기도 한다. 실라버스는 조직이 의무 수준을 올릴 수만 있고 낮출 수는 없다고 한다(4.1.1). required 가이드라인에 승인받은 예외를 하나 두는 것과 수준 자체를 낮추는 것은 다르다.","ref":"4.1.1"},{"id":"c4-005","ch":4,"lo":"AuT-4.1.2","k":3,"q":"와이퍼 시스템의 요구사항이 다음과 같다.\n1. 와이퍼 레버를 LOW 위치에 두면 와이퍼는 분당 45회 속도로 작동한다.\n2. 와이퍼 레버를 HIGH 위치에 두면 와이퍼는 분당 65회 속도로 작동한다.\n3. 레버가 AUTO 위치이고 레인 센서가 비를 감지하면, 와이퍼는 차량 속도와 관계없이 1초 이내에 작동을 시작한다.\n4. 레버가 AUTO 위치일 때 차량 속도가 0km/h이면 와이퍼는 작동하지 않는다.\n\nISO 29148(ISO/IEC/IEEE 29148)의 요구사항 품질 특성에 비추어 옳은 것은?","opts":["요구사항 2는 verifiable하지 않다.","요구사항 1과 요구사항 2는 서로 consistent하지 않다.","요구사항 3과 요구사항 4는 서로 consistent하지 않다.","요구사항 4는 unambiguous하지 않다."],"ans":[2],"exp":"풀이(4.1.2의 특성 정의를 요구사항마다 대 본다)\n① 요구사항 3: AUTO + 비 감지면 '차량 속도와 관계없이' 1초 이내 작동.\n② 요구사항 4: AUTO일 때 속도가 0km/h면 작동하지 않음.\n③ AUTO 위치로 정차 중(0km/h)에 비가 오면 3은 '작동', 4는 '작동 안 함'을 요구한다. consistent(각 요구사항이 그 자체로, 그리고 다른 모든 요구사항과 일관됨)를 위반한다.\n검산 1: 요구사항 1·2는 서로 다른 레버 위치(LOW, HIGH)의 동작이라 충돌하지 않는다. 요구사항 2는 레버 위치(입력)와 분당 작동 횟수(기대 결과)가 분명해 올바르게 구현됐는지 증명할 수 있다(verifiable).\n검산 2: 요구사항 4는 조건(AUTO 위치, 0km/h)과 기대 결과(작동하지 않음)가 분명해 테스트 컨디션이 명확하다(unambiguous).","why":["HIGH 위치에서 분당 65회로 작동하는지 측정해 구현이 맞는지 증명할 수 있다. verifiable하다.","서로 다른 레버 위치(LOW, HIGH)의 동작을 정하므로 충돌하지 않는다.","정답. 레버가 AUTO이고 정차 중(0km/h)에 비가 오는 상황에서 두 요구사항이 서로 반대 동작을 요구한다.","조건(AUTO 위치, 0km/h)과 기대 결과(작동하지 않음)가 분명해 테스트 컨디션이 명확하다."],"ref":"4.1.2"},{"id":"c4-006","ch":4,"lo":"AuT-4.1.2","k":3,"q":"차체 제어 ECU의 요구사항 리뷰에서 다음 요구사항이 나왔다.\n\n\"차량 도어가 잠기면 1초 이내에 실내등이 꺼지고 사이드 미러가 접히며, 도어가 잠기고 30초 후 도난 경보 기능이 활성화된다.\"\n\n테스터가 실라버스가 제시한 ISO 29148 품질 특성으로 리뷰할 때, 이 요구사항이 위반한 특성으로 가장 적절한 것은?","opts":["verifiable","consistent","unambiguous","singular"],"ans":[3],"exp":"풀이\n① 요구사항을 동작 단위로 나눈다: (가) 도어 잠금 → 1초 이내 실내등 꺼짐, (나) 도어 잠금 → 1초 이내 사이드 미러 접힘, (다) 도어 잠금 30초 후 → 도난 경보 활성화.\n② 셋은 각각 따로 테스트하고 판정할 수 있는 의미 있는 부분 요구사항이다. singular('어떤 요구사항도 의미 있는 부분 요구사항으로 나눌 수 없다')를 위반한다(4.1.2. 각주: singular는 atomic이라고도 한다).\n검산 1: 각 동작은 조건과 기대 결과가 분명해 구현이 맞는지 증명할 수 있고(verifiable), 테스트 컨디션도 분명하다(unambiguous).\n검산 2: 문장 안에 서로 충돌하는 내용이 없어 그 자체로 consistent하다.","why":["세 동작 모두 조건과 기대 결과가 있어 구현이 맞는지 증명할 수 있다.","문장 안에 서로 모순되는 내용이 없다. 다른 요구사항과의 충돌도 주어지지 않았다.","도어 잠금이라는 조건, 시간 조건(1초 이내, 30초 후), 각 기대 결과가 분명해 테스트 컨디션이 명확하다.","정답. 세 개의 의미 있는 부분 요구사항으로 나눌 수 있다."],"ref":"4.1.2"},{"id":"c4-007","ch":4,"lo":"AuT-4.1.2","k":3,"q":"주차 보조 시스템의 요구사항이 다음과 같다.\n1. 후방 장애물과의 거리가 30cm 미만이면 경고음이 연속음으로 바뀐다.\n2. 주차 보조 시스템은 모든 운전자가 만족할 만큼 직관적으로 동작해야 한다.\n3. 후진 기어를 넣으면 주차 보조 시스템이 활성화된다.\n4. 후진 기어를 해제하면 주차 보조 시스템이 비활성화된다.\n\nISO 29148의 요구사항 품질 특성에 비추어 옳은 것은?","opts":["요구사항 1은 unambiguous하지 않다.","요구사항 2는 verifiable하지 않다.","요구사항 3과 요구사항 4는 서로 consistent하지 않다.","요구사항 4는 singular하지 않다."],"ans":[1],"exp":"풀이\n① verifiable은 '각 요구사항이 올바르게 구현됐음을 증명할 수 있음'이다(4.1.2).\n② 요구사항 2의 '모든 운전자가 만족할 만큼', '직관적으로'는 측정할 기준이 없다. 구현이 맞는지 증명할 방법이 없으므로 verifiable을 위반한다.\n③ 나머지 보기: 요구사항 1은 조건과 기대 결과가 분명하다(unambiguous). 3과 4는 체결·해제에 따른 활성화·비활성화로 충돌하지 않는다(consistent). 4는 동작 하나만 정한다(singular).\n검산: 보기마다 해당 요구사항에 정의를 다시 대 보면, 위반이 성립하는 것은 '요구사항 2 – verifiable' 하나뿐이다.","why":["조건(30cm 미만)과 기대 결과(연속음)가 분명해 테스트 컨디션이 명확하다.","정답. '모든 운전자가 만족할 만큼', '직관적으로'는 구현이 맞게 됐는지 증명할 기준이 없다.","3은 후진 기어 체결 시 활성화, 4는 해제 시 비활성화로 서로 맞물린다. 충돌하지 않는다.","후진 기어 해제 → 비활성화라는 동작 하나만 정한다. 더 나눌 수 없다."],"ref":"4.1.2"},{"id":"c4-008","ch":4,"lo":"AuT-4.1.2","k":3,"q":"테스터가 요구사항 리뷰를 준비하며 ISO 29148 품질 특성에서 리뷰 체크리스트(review checklist)를 만들고 있다. 'complete' 특성을 점검하는 체크리스트 항목으로 가장 적절한 것은?","opts":["요구사항을 이해하려면 문서에 적혀 있지 않은 사내 관례나 경험 지식이 필요한 부분이 있는가?","모든 요구사항에서 같은 용어를 같은 뜻으로 쓰고 있는가?","요구사항은 complete한가?","요구사항을 의미 있는 부분 요구사항으로 더 나눌 수 있는가?"],"ans":[0],"exp":"4.1.2: complete는 '각 요구사항이 해석의 여지를 남기지 않고, 암묵적 지식이나 경험에서 나온 지식에 기대지 않는다'이다. 테스터는 품질 특성에서 체크리스트 항목을 도출하는데, 항목은 품질 기준 이름을 그대로 쓰는 것보다 구체적이어야 한다(품질 기준 이름은 너무 추상적이다). 보기 중 complete의 내용을 구체적으로 묻는 것은 문서에 없는 사내 관례·경험 지식이 필요한지 묻는 항목이다.\n검산: 용어를 일관되게 쓰는지(consistent의 실라버스 예), 더 나눌 수 있는지(singular)를 빼면 남는 구체적 항목은 하나다. (v2.1 기준. 2018년판에서는 complete를 '오류·중단·예외 상황까지 모든 경우를 고려하고, 표·그림에 라벨이 있고 약어와 용어가 정의됨'으로 설명했다.)","why":["정답. complete 정의의 '암묵적 지식이나 경험에서 나온 지식에 기대지 않는다'를 구체적으로 묻는다.","실라버스가 consistent 특성의 체크리스트 항목 예로 든 질문이다.","품질 기준 이름을 그대로 묻는 항목이다. 실라버스는 체크리스트 항목이 이보다 구체적이어야 한다고 한다.","singular 특성을 점검하는 질문이다."],"trap":"현업에서는 '요구사항이 완전하다'를 '오류·예외 케이스까지 빠짐없이 다뤘다'는 뜻으로 쓰는 경우가 많다. v2.1 실라버스의 complete는 '해석의 여지가 없고 암묵적 지식·경험 지식에 기대지 않음'이다(4.1.2).","ref":"4.1.2"},{"id":"c4-009","ch":4,"lo":"AuT-4.2.1","k":3,"q":"전동 파킹 브레이크의 자동 해제 결정은 E = B1 AND B2 AND B3이다(B1: 운전석 도어 닫힘, B2: 안전벨트 체결, B3: 가속 페달 밟음). 각 조건은 서로 독립적으로 값을 정할 수 있다.\n테스터가 아래 5개 테스트 케이스를 설계했다. 100% MC/DC 커버리지를 유지하면서 뺄 수 있는 테스트 케이스는?","table":{"head":["테스트 케이스","B1","B2","B3","결정 결과 E"],"rows":[["TC1","TRUE","TRUE","TRUE","TRUE"],["TC2","FALSE","TRUE","TRUE","FALSE"],["TC3","TRUE","FALSE","TRUE","FALSE"],["TC4","TRUE","TRUE","FALSE","FALSE"],["TC5","FALSE","FALSE","TRUE","FALSE"]]},"code":"E = B1 AND B2 AND B3","opts":["TC5","TC2","TC1","TC4"],"ans":[0],"exp":"풀이(4.2.1: MC/DC는 개별 조건이 결정 결과에 독립적으로 영향을 주는 조합만 고려한다. 조건마다 '그 조건만 바뀌고 결정 결과도 바뀌는' 쌍을 찾는다.)\n① B1: TC1(T,T,T → TRUE)과 TC2(F,T,T → FALSE). B1만 다르고 결과가 바뀐다.\n② B2: TC1과 TC3(T,F,T → FALSE). B2만 다르고 결과가 바뀐다.\n③ B3: TC1과 TC4(T,T,F → FALSE). B3만 다르고 결과가 바뀐다.\n④ TC5(F,F,T → FALSE)는 TC2와 B2만, TC3과 B1만 다르지만 결과가 모두 FALSE로 같다. 어느 조건의 독립 영향도 보여 주지 않는다.\n→ TC1~TC4로 100% MC/DC가 되므로 TC5를 빼도 된다.\n검산 1: TC1을 빼면 ①~③ 쌍이 모두 사라진다. TC2·TC3·TC4는 각각 B1·B2·B3의 유일한 짝이다.\n검산 2: 남은 TC1~TC4에서 결정 결과 TRUE(TC1)와 FALSE(TC2~TC4)가 모두 나오고, 각 조건도 TRUE와 FALSE를 모두 가진다. 표 5에서 TC4(FALSE, FALSE)가 MC/DC에 필요 없던 것과 같은 이유다.","why":["정답. 어느 조건의 독립 영향도 보여 주지 않는다.","B1의 독립 영향을 보여 주는 유일한 짝(TC1–TC2)이다. 빼면 B1이 입증되지 않는다.","B1·B2·B3 쌍 모두에 들어가는 케이스다. 빼면 어느 조건도 입증되지 않고, 결정 결과 TRUE도 사라진다.","B3의 독립 영향을 보여 주는 유일한 짝(TC1–TC4)이다. 빼면 B3이 입증되지 않는다."],"ref":"4.2.1"},{"id":"c4-010","ch":4,"lo":"AuT-4.2.1","k":3,"q":"계기판 경고등 점등 결정은 E = B1 OR B2 OR B3이다(B1: 엔진 과열, B2: 오일 압력 낮음, B3: 냉각수 부족). 각 조건은 서로 독립적으로 값을 정할 수 있다.\n테스터는 MC/DC 커버리지를 위해 B1이 결정 결과(decision outcome)에 독립적으로 영향을 준다는 것을 보여 주는 테스트 케이스 쌍을 고르려 한다. 이 목적에 맞는 쌍은?","code":"E = B1 OR B2 OR B3","opts":["(B1, B2, B3) = (FALSE, TRUE, FALSE)와 (TRUE, TRUE, FALSE)","(B1, B2, B3) = (TRUE, FALSE, FALSE)와 (TRUE, FALSE, TRUE)","(B1, B2, B3) = (FALSE, FALSE, FALSE)와 (TRUE, FALSE, FALSE)","(B1, B2, B3) = (FALSE, FALSE, FALSE)와 (TRUE, TRUE, FALSE)"],"ans":[2],"exp":"풀이(4.2.1: MC/DC는 개별 조건이 결정 결과에 독립적으로 영향을 주는 조합만 고려한다. B1만 바꿨을 때 결과가 바뀌는 쌍을 찾는다.)\n① OR 식에서 B1이 결과를 좌우하려면 나머지 조건 B2·B3이 모두 FALSE여야 한다. 하나라도 TRUE면 B1과 관계없이 결과가 TRUE다.\n② (F,F,F) → FALSE, (T,F,F) → TRUE. B1만 다르고 결과가 바뀐다. 목적에 맞다.\n검산 1: (F,T,F)와 (T,T,F)는 B1만 다르지만 결과가 둘 다 TRUE다. 표 5의 TC4 설명처럼 조건 하나를 바꿔도 결정 결과가 그대로면 독립 영향을 보여 주지 못한다.\n검산 2: (F,F,F)와 (T,T,F)는 조건 두 개가 함께 바뀌어 B1 단독의 영향이 아니다. (T,F,F)와 (T,F,T)는 B3만 바뀐다.","why":["B1만 다르지만 B2가 TRUE라 결정 결과가 둘 다 TRUE다. B1이 결과를 바꾸지 못한다.","B3만 다르고 결과도 둘 다 TRUE다. B1의 영향과 관계없다.","정답. B1만 다르고 결정 결과가 FALSE → TRUE로 바뀐다.","B1과 B2가 함께 바뀐다. 결과가 바뀌어도 어느 조건 때문인지 가를 수 없다."],"trap":"현업에서는 'B1이 TRUE와 FALSE를 모두 가졌으면 그 조건은 커버됐다'고 보기 쉽다. 그건 조건 커버리지다. MC/DC는 B1만 바꿨을 때 결정 결과도 바뀌어야 한다(4.2.1, 표 5의 TC4 설명).","ref":"4.2.1"},{"id":"c4-011","ch":4,"lo":"AuT-4.2.1","k":3,"q":"크루즈 컨트롤 해제 결정은 E = (B1 OR B2) AND B3이다(B1: 브레이크 페달 밟음, B2: 클러치 페달 밟음, B3: 크루즈 컨트롤 작동 중). 각 조건은 서로 독립적으로 값을 정할 수 있다.\n테스터가 아래 4개 테스트 케이스를 설계했다. 이 집합으로 결정 결과에 대한 독립적인 영향이 입증되지 않은 조건은?","table":{"head":["테스트 케이스","B1","B2","B3","결정 결과 E"],"rows":[["TC1","TRUE","FALSE","TRUE","TRUE"],["TC2","FALSE","FALSE","TRUE","FALSE"],["TC3","TRUE","FALSE","FALSE","FALSE"],["TC4","FALSE","TRUE","FALSE","FALSE"]]},"code":"E = (B1 OR B2) AND B3","opts":["B1","B3","B1과 B3","B2"],"ans":[3],"exp":"풀이(조건마다 그 조건만 다르고 결정 결과가 바뀌는 쌍을 찾는다. 4.2.1)\n① B1: TC1(T,F,T → TRUE)과 TC2(F,F,T → FALSE)는 B1만 다르고 결과가 바뀐다. 입증됨.\n② B3: TC1과 TC3(T,F,F → FALSE)은 B3만 다르고 결과가 바뀐다. 입증됨.\n③ B2: B2가 TRUE인 케이스는 TC4(F,T,F)뿐이다. TC4와 B2만 다른 (F,F,F)는 집합에 없다. TC4는 TC2와 B2·B3, TC3과 B1·B2, TC1과 세 조건 모두가 다르다. 게다가 TC4는 B3=FALSE라 B2를 바꿔도 결과가 FALSE 그대로다. 입증 안 됨.\n→ 예를 들어 (F,T,T → TRUE)를 추가하면 TC2(F,F,T → FALSE)와 B2만 다른 쌍이 생긴다.\n검산 1: (F OR T) AND T = TRUE, (F OR F) AND T = FALSE. 추가 케이스로 결과가 바뀌는 것을 확인했다.\n검산 2: B2는 이미 TRUE(TC4)와 FALSE(TC1~TC3)를 모두 가졌다. 조건 커버리지로는 충족이지만, 결과를 바꾸는 쌍이 없어 MC/DC는 충족하지 못한다.","why":["TC1–TC2 쌍으로 입증된다(B1만 다르고 TRUE → FALSE).","TC1–TC3 쌍으로 입증된다(B3만 다르고 TRUE → FALSE).","B1(TC1–TC2)과 B3(TC1–TC3)은 모두 입증된다.","정답. B2만 바뀌고 결과가 바뀌는 쌍이 없다."],"ref":"4.2.1"},{"id":"c4-012","ch":4,"lo":"AuT-4.2.1","k":3,"q":"결정 E = B1 OR B2에 대해 테스터가 TC1(B1=TRUE, B2=FALSE)과 TC2(B1=FALSE, B2=TRUE) 두 개만 설계했다. 이 테스트 케이스 집합에 대한 설명으로 옳은 것은?","code":"E = B1 OR B2","opts":["조건 커버리지(condition coverage)는 100%지만 결정 결과는 TRUE만 나와, 100% MC/DC를 달성하지 못한다.","조건 커버리지와 MC/DC 커버리지가 모두 100%다.","두 조건이 각각 TRUE와 FALSE를 모두 가졌으므로 결정 결과도 TRUE와 FALSE가 모두 실행됐다.","100% MC/DC를 달성하려면 네 가지 조합을 모두 실행하는 다중 조건 테스팅(multiple condition testing)이 필요하다."],"ans":[0],"exp":"풀이\n① TC1: TRUE OR FALSE = TRUE. TC2: FALSE OR TRUE = TRUE.\n② B1·B2가 각각 TRUE와 FALSE를 가졌으므로 조건 커버리지는 100%다(조건 테스팅).\n③ 결정 결과는 TRUE만 나왔다. 4.2.1 표 5의 조건 테스팅(A) 예처럼, 조건 커버리지가 100%여도 결정 결과 하나만 커버할 위험이 있다.\n④ MC/DC: TC1과 TC2는 두 조건이 동시에 바뀌고 결과도 같다. (FALSE, FALSE → FALSE)를 추가하면 TC1과는 B1만, TC2와는 B2만 다르고 결과가 바뀐다.\n검산: 다중 조건 테스팅은 2개 조건의 4개 조합이 모두 필요하지만, MC/DC는 3개로 충분하다. 4.2.1도 MC/DC가 다중 조건 테스팅보다 적은 테스트로 모든 단일 조건과 결정을 커버한다고 한다.","why":["정답. 표 5의 조건 테스팅(A) 예와 같은 함정이다.","두 케이스는 조건 두 개가 동시에 다르고 결과도 같아 어느 조건의 독립 영향도 보여 주지 못한다.","TC1, TC2 모두 결과가 TRUE다. 조건 커버리지 100%가 결정 결과 커버를 보장하지 않는다.","(FALSE, FALSE)를 하나 더하면 세 개로 100% MC/DC가 된다. 네 조합 전부는 필요 없다."],"ref":"4.2.1"},{"id":"c4-013","ch":4,"lo":"AuT-4.2.1","k":3,"q":"시트 열선 작동 결정은 E = B1 AND (B2 OR B3)이다(B1: 시동 ON, B2: 운전석 열선 버튼 눌림, B3: 원격 시동 예약 열선 설정). 각 조건은 서로 독립적으로 값을 정할 수 있다.\n아래 후보 테스트 케이스 중 4개를 골라 100% MC/DC 커버리지를 달성하려 한다. 맞는 집합은?","table":{"head":["테스트 케이스","B1","B2","B3","결정 결과 E"],"rows":[["TC1","TRUE","TRUE","FALSE","TRUE"],["TC2","TRUE","FALSE","TRUE","TRUE"],["TC3","TRUE","FALSE","FALSE","FALSE"],["TC4","FALSE","TRUE","FALSE","FALSE"],["TC5","FALSE","FALSE","FALSE","FALSE"],["TC6","TRUE","TRUE","TRUE","TRUE"]]},"code":"E = B1 AND (B2 OR B3)","opts":["TC1, TC2, TC3, TC5","TC2, TC3, TC4, TC6","TC1, TC2, TC3, TC4","TC1, TC3, TC4, TC6"],"ans":[2],"exp":"풀이(조건마다 그 조건만 다르고 결정 결과가 바뀌는 쌍을 찾는다. 4.2.1)\n① B1이 결과를 좌우하려면 (B2 OR B3)=TRUE여야 한다. TC1(T,T,F → TRUE)과 TC4(F,T,F → FALSE).\n② B2가 결과를 좌우하려면 B1=TRUE, B3=FALSE여야 한다. TC1(T,T,F → TRUE)과 TC3(T,F,F → FALSE).\n③ B3이 결과를 좌우하려면 B1=TRUE, B2=FALSE여야 한다. TC2(T,F,T → TRUE)와 TC3(T,F,F → FALSE).\n→ 필요한 케이스는 TC1, TC2, TC3, TC4.\n검산 1(다른 보기): TC1·TC2·TC3·TC5는 B1 쌍이 없다(TC5와 TC3은 결과가 같다). TC2·TC3·TC4·TC6은 (T,T,F)가 없어 B1·B2 쌍이 없다. TC1·TC3·TC4·TC6은 (T,F,T)가 없어 B3 쌍이 없다.\n검산 2: 정답 집합에서 결정 결과 TRUE(TC1, TC2)와 FALSE(TC3, TC4)가 모두 나온다.","why":["B1 쌍이 없다. TC5(F,F,F)의 짝 (T,F,F)=TC3은 결과가 둘 다 FALSE다.","B1 쌍과 B2 쌍이 없다. TC6과 TC2는 B2만 다르지만 결과가 둘 다 TRUE다.","정답. B1(TC1–TC4), B2(TC1–TC3), B3(TC2–TC3) 쌍이 모두 있다.","B3 쌍이 없다. TC6과 TC1은 B3만 다르지만 결과가 둘 다 TRUE다."],"ref":"4.2.1"},{"id":"c4-014","ch":4,"lo":"AuT-4.2.2","k":2,"q":"MiL 단계에서 쓰던 실행 가능한 모델에서 C 코드를 자동 생성했다. 테스터는 모델과 생성 코드에 같은 테스트 케이스를 실행해 결과를 비교하려 한다. 이 back-to-back 테스팅(back-to-back testing)에 대한 설명으로 옳은 것은?","opts":["모델과 생성 코드의 결과가 다르면 모델이 기준이므로, 원인 분석 없이 생성 코드의 결함으로 판정한다.","실행 가능한 모델이 pseudo-oracle(슈도 오라클) 역할을 하는 모델 기반 테스팅(model-based testing)의 한 형태이며, 모델에서 기대 결과와 자동화된 테스트 케이스를 도출할 수 있다.","생성 코드의 기대 결과는 요구사항 명세에서 따로 정해 두고, 모델의 결과는 참고로만 본다.","모델과 생성 코드가 서로 다른 요구사항에 기반해도, 같은 테스트 케이스를 실행하면 비교할 수 있다."],"ans":[1],"exp":"4.2.2: 실행 가능한 모델과 수동·자동 생성 코드를 비교하는 경우는 모델 기반 테스팅의 한 형태이며, 실행 가능한 모델이 pseudo-oracle 역할을 한다. 그래서 자동화된 테스트 설계에 아주 적합하다. 테스터는 모델에서 기대 결과뿐 아니라 자동화된 테스트 케이스도 도출한다. (v2.1 기준. 2018년판에서는 모델을 'test oracle'이라고 불렀다.)","why":["결과가 다르면 발견된 차이의 원인을 분석한다(4.2.2). 실라버스는 어느 쪽이 틀렸는지 미리 정하지 않는다.","정답. 4.2.2가 모델-코드 비교를 설명한 내용 그대로다.","back-to-back 테스팅에서 요구사항은 기대 결과를 정하는 테스트 오라클로 쓰지 않는다. 기대 결과는 비교 대상(여기서는 모델)이 만든다.","테스트 대상들은 내용 면에서 같은 요구사항에 기반해야 비교 가능한 동작을 보인다."],"tr
