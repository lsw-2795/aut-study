<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>CT-AuT 합격 노트</title><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AuT 노트"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0e131d" media="(prefers-color-scheme: dark)"><link rel="apple-touch-icon" href="icon-180.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>CT-AuT 합격 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 조작 기준 단일 칼럼 + 하단 탭바. 아이패드 가로(1024px~)에서 홈은 2단, 노트는 목차 사이드바. 문제 풀이는 집중을 위해 항상 1단. */
:root {
  --paper: #f3f5f9; --surface: #ffffff; --sunk: #e9edf4;
  --ink: #141c2e; --ink2: #4a5570; --ink3: #5d6781;
  --line: #d8deea; --line-ui: #8a94ab;
  --pen: #2140c8; --pen-ink: #ffffff; --pen-soft: #e5eafc;
  --mark: rgba(255, 216, 50, .62);
  --ok: #157548; --ok-soft: #e2f3e9; --bad: #c0392b; --bad-soft: #fbe6e3; --warn: #9a5b00; --warn-soft: #fff0d3;
  --on-solid: #ffffff; --scrim: rgba(10, 14, 22, .45);
  --shadow: 0 1px 2px rgba(20, 28, 46, .06), 0 6px 20px rgba(20, 28, 46, .06);
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  --f-display: "Hahmlet", "AppleMyungjo", "Nanum Myeongjo", serif;
  /* Plex Mono엔 한글이 없어서 한글만 본문 글꼴로 이어지게 둔다 */
  --f-mono: "IBM Plex Mono", "IBM Plex Sans KR", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  --t-cap: .8125rem; --t-sm: .9rem; --t-lead: 1.0625rem; --t-h3: 1.125rem; --t-h2: 1.2rem; --t-h1: 1.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e131d; --surface: #161d2b; --sunk: #1d2537;
    --ink: #e7ecf6; --ink2: #a8b2c8; --ink3: #8d98b0;
    --line: #2b3549; --line-ui: #606d8a;
    --pen: #92a7ff; --pen-ink: #0e131d; --pen-soft: #1f2a4d;
    --mark: rgba(214, 182, 40, .32);
    --ok: #52c58e; --ok-soft: #13301f; --bad: #ff8070; --bad-soft: #3a1b17; --warn: #f0b04a; --warn-soft: #33270f;
    --on-solid: #161d2b; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e131d; --surface: #161d2b; --sunk: #1d2537;
  --ink: #e7ecf6; --ink2: #a8b2c8; --ink3: #8d98b0;
  --line: #2b3549; --line-ui: #606d8a;
  --pen: #92a7ff; --pen-ink: #0e131d; --pen-soft: #1f2a4d;
  --mark: rgba(214, 182, 40, .32);
  --ok: #52c58e; --ok-soft: #13301f; --bad: #ff8070; --bad-soft: #3a1b17; --warn: #f0b04a; --warn-soft: #33270f;
  --on-solid: #161d2b; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { font-size: var(--fs, 17px); -webkit-text-size-adjust: 100%; }
@media (min-width: 700px) { html { font-size: calc(var(--fs, 17px) + 1px); } }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 1rem; line-height: 1.75; letter-spacing: -.003em;
  padding-inline: 16px; word-break: keep-all; overflow-wrap: break-word;
}
button { font: inherit; color: inherit; }
button, a, label, summary { touch-action: manipulation; }
.qtext, .exp, .opt, .sec li, .trap, .kw dd, .flash .def, p { text-wrap: pretty; }
.pbr { display: block; height: .6em; }
a { color: var(--pen); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.wrap { max-width: 760px; margin: 0 auto; padding-block: 20px 128px; display: grid; gap: 18px; align-content: start; }
.wrap > * { min-width: 0; }
h1, h2, h3 { line-height: 1.35; text-wrap: balance; margin: 0; }
.page-title { font-family: var(--f-display); font-weight: 800; font-size: var(--t-h1); letter-spacing: -.01em; }
h2 { font-size: var(--t-h2); font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: var(--t-h3); }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink2); }
.small { font-size: var(--t-sm); line-height: 1.6; }
.ep { color: var(--ink2); }
.hl { background: linear-gradient(transparent 58%, var(--mark) 58%); padding-inline: 2px; }
.eyebrow { font-size: var(--t-cap); letter-spacing: .02em; color: var(--ink3); font-weight: 700; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.lead { color: var(--ink2); max-width: 36em; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); }
.flat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; }

.btn {
  appearance: none; border: 1px solid var(--line-ui); background: var(--surface); color: var(--ink);
  border-radius: 12px; min-height: 48px; padding: 10px 16px; font-weight: 600; cursor: pointer; line-height: 1.35;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--pen); color: var(--pen-ink); border-color: var(--pen); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--pen); padding-inline: 8px; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn.primary[disabled] { opacity: 1; background: var(--sunk); color: var(--ink2); border-color: var(--line); }
.btn.block { width: 100%; }
.btn .sub { display: block; font-size: var(--t-cap); font-weight: 400; color: inherit; opacity: .85; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 10px;
  font-size: var(--t-cap); font-weight: 600; background: var(--sunk); color: var(--ink2); white-space: nowrap; line-height: 1.5;
}
.chip.k3 { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.hard { background: var(--ink); color: var(--paper); }
.newbox { border: 1.5px solid var(--pen); background: var(--pen-soft); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  border: 1px solid var(--line-ui); background: var(--surface); border-radius: 999px; min-height: 44px; padding: 6px 14px;
  font-weight: 600; cursor: pointer; color: var(--ink2); line-height: 1.35;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btngrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.btngrid .btn { flex-direction: column; gap: 0; padding: 8px 6px; }

/* 홈: 수험표 */
.ticket { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.ticket .stub { padding: 20px 20px 16px; display: grid; gap: 4px; }
.ticket .big { font-family: var(--f-display); font-weight: 800; font-size: clamp(3.2rem, 15vw, 4.6rem); line-height: 1; letter-spacing: -.02em; }
.ticket .big .hl { padding-inline: 6px; }
.ticket .count { font-family: var(--f-mono); font-size: .98rem; color: var(--ink2); font-variant-numeric: tabular-nums; }
.ticket dl { margin: 0; padding: 14px 20px 18px; border-top: 2px dashed var(--line-ui); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; position: relative; }
.ticket dl::before, .ticket dl::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line); }
.ticket dl::before { left: -11px; }
.ticket dl::after { right: -11px; }
.ticket dt { font-size: var(--t-cap); color: var(--ink3); font-weight: 700; letter-spacing: .04em; }
.ticket dd { margin: 0; font-weight: 600; line-height: 1.45; }
@media (min-width: 560px) {
  .ticket { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
  .ticket dl { border-top: 0; border-left: 2px dashed var(--line-ui); padding: 20px; align-content: center; }
  .ticket dl::before { top: -11px; left: -11px; }
  .ticket dl::after { top: auto; bottom: -11px; right: auto; left: -11px; }
}

/* 예상 점수 막대: 0~40 눈금 하나로 그림 */
.gauge { position: relative; height: 16px; border-radius: 8px; background: var(--sunk); margin: 30px 0 24px; }
.gauge .fill { position: absolute; inset: 0 auto 0 0; border-radius: 8px; background: var(--pen); }
.gauge .tick { position: absolute; top: -8px; bottom: -8px; width: 2px; background: var(--ink); }
.gauge .tick.goal { background: var(--ok); }
.gauge .tlabel { position: absolute; top: -30px; font-size: var(--t-cap); font-weight: 700; white-space: nowrap; font-family: var(--f-mono); }
.gauge .tlabel.pass { transform: translateX(calc(-100% - 4px)); }
.gauge .tlabel.goal { transform: translateX(6px); color: var(--ok); }
.gauge .blabel { position: absolute; top: 22px; font-size: var(--t-cap); color: var(--ink3); font-family: var(--f-mono); }
.bignum { font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1; }

.chrow { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 12px 2px; border: 0; border-top: 1px solid var(--line); cursor: pointer; background: none; width: 100%; text-align: left; }
.chrow:first-of-type { border-top: 0; }
.chrow .no { font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; color: var(--ink3); grid-row: span 3; align-self: start; line-height: 1.3; }
.chrow .nm { font-weight: 600; min-width: 0; }
.chrow .meta { font-size: var(--t-cap); color: var(--ink2); grid-column: 2; }
.chrow .pct { font-family: var(--f-mono); font-weight: 600; grid-row: span 3; text-align: right; align-self: center; }
.bar { height: 6px; border-radius: 3px; background: var(--sunk); overflow: hidden; grid-column: 2; margin-top: 4px; }
.bar > i { display: block; height: 100%; background: var(--pen); }

.task { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; border-top: 1px dashed var(--line); }
.task:first-child { border-top: 0; }
.task input { width: 24px; height: 24px; accent-color: var(--pen); margin: 0; }
.task .tt { display: block; padding-block: 12px; line-height: 1.5; cursor: pointer; }
.task .btn.ghost { min-height: 44px; padding: 6px 10px; }
.task.done .tt { text-decoration: line-through; color: var(--ink3); }
.task .when { font-family: var(--f-mono); font-size: var(--t-cap); color: var(--warn); margin-right: 6px; }
.planday { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 2px; }
.planday.today { background: var(--pen-soft); border-radius: 12px; padding: 12px; border-top-color: transparent; }
.planday .d { font-family: var(--f-mono); font-weight: 600; }

.facts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.facts li { padding-left: 16px; position: relative; }
.facts li::before { content: ""; position: absolute; left: 2px; top: .75em; width: 6px; height: 6px; border-radius: 50%; background: var(--ink3); }
.src { font-size: var(--t-cap); color: var(--ink3); line-height: 1.55; }
.links { display: grid; }
.links a { display: flex; align-items: center; min-height: 46px; border-top: 1px solid var(--line); text-decoration: none; }
.links a:first-child { border-top: 0; }

.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.mode { display: grid; gap: 10px; align-content: start; }
.mode h2 { display: flex; gap: 8px; align-items: center; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick .btn.primary { grid-column: 1 / -1; }
.quick .btn { flex-direction: column; gap: 0; min-height: 64px; padding: 8px; }

/* 개념 노트 */
.note-head { display: grid; gap: 4px; }
.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--paper); display: flex; gap: 6px; overflow-x: auto; padding-block: 8px; margin-inline: -16px; padding-inline: 16px; scrollbar-width: none; }
.toc::-webkit-scrollbar { display: none; }
.toc a { text-decoration: none; flex: none; min-height: 36px; }
.toc a .tt { display: none; }
.note-nav { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px; align-items: center; }
.note-nav .btn { padding-inline: 8px; }
.note-nav .seg { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.note-nav .seg button { padding: 0; }
.sec { display: grid; gap: 12px; scroll-margin-top: 64px; }
.sec h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; }
.sec h3 .sid { font-family: var(--f-mono); color: var(--ink3); margin-right: 8px; font-size: var(--t-sm); font-weight: 600; }
.sec ul { margin: 0; padding-left: 1.15em; display: grid; gap: 10px; }
.sec li::marker { color: var(--ink3); }
.trap { background: var(--warn-soft); border-left: 3px solid var(--warn); border-radius: 4px 10px 10px 4px; padding: 12px 14px; display: grid; gap: 8px; }
.trap > b { color: var(--warn); font-size: var(--t-cap); letter-spacing: .02em; }
.trap > div + div { border-top: 1px dashed var(--line-ui); padding-top: 8px; }
.kw { margin: 0; }
.kw dt { font-weight: 700; margin-top: 14px; }
.kw dt .en { font-weight: 400; color: var(--ink3); font-size: var(--t-sm); margin-left: 6px; font-family: var(--f-mono); }
.kw dd { margin: 2px 0 0; color: var(--ink2); }
details > summary { cursor: pointer; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "펼치기"; font-size: var(--t-cap); font-weight: 600; color: var(--pen); flex: none; }
details[open] > summary::after { content: "접기"; }

/* 문제 풀이 */
.quiz-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 6px; display: grid; gap: 6px; box-shadow: 0 1px 0 var(--line); margin-inline: -16px; padding-inline: 16px; }
.quiz-top .btn { min-height: 44px; padding-block: 4px; }
.prog-btn { font: 600 1rem var(--f-mono); min-height: 44px; padding: 4px 12px; border: 1px solid var(--line-ui); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; }
.quiz-top .bar1 { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.quiz-top .prog { font-family: var(--f-mono); font-weight: 600; }
.qprog { height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; }
.qprog > i { display: block; height: 100%; background: var(--pen); }
.timer { font-family: var(--f-mono); font-weight: 600; font-size: 1.05rem; padding: 3px 10px; border-radius: 8px; background: var(--sunk); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.timer.behind { background: var(--warn-soft); color: var(--warn); }
.sw { font-family: var(--f-mono); font-size: var(--t-sm); color: var(--ink2); background: var(--sunk); border-radius: 8px; padding: 3px 8px; }
.sw.over { color: var(--warn); background: var(--warn-soft); }
.pace { font-size: var(--t-sm); color: var(--ink2); }
.qtext { font-size: var(--t-lead); line-height: 1.8; }
.pick2 { display: inline-block; font-weight: 700; color: var(--warn); }
/* 표 칸이 한 글자 폭까지 눌리지 않게 줄바꿈 규칙을 끄고, 넘치면 가로로 스크롤. 첫 열(조건·상태 이름)은 고정. */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); container-type: inline-size; }
.tbl table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: var(--t-sm); line-height: 1.45; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; overflow-wrap: normal; word-break: keep-all; }
.tbl td { min-width: 3.5em; }
.tbl th { background: var(--sunk); font-weight: 700; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { position: sticky; left: 0; z-index: 1; min-width: 7em; max-width: 11em; background: var(--surface); box-shadow: 1px 0 0 var(--line); }
.tbl th:first-child { background: var(--sunk); }
.tbl tr:last-child td { border-bottom: 0; }
/* 휴대폰 폭에서 방법 표의 ASIL C·D 열이 잘려 나가서, 좁을 때만 칸 여백과 첫 열 최소 폭을 줄인다 */
@container (max-width: 480px) {
  .tbl th, .tbl td { padding: 6px 6px; }
  .tbl td, .tbl th:first-child, .tbl td:first-child { min-width: 0; }
  .tbl th { white-space: normal; }
}
pre.code { margin: 0; overflow-x: auto; background: var(--sunk); border-radius: 10px; padding: 12px 14px; font-family: var(--f-mono); font-size: var(--t-sm); line-height: 1.6; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 4px 10px; align-items: start; text-align: left;
  border: 1.5px solid var(--line-ui); background: var(--surface); border-radius: 12px; padding: 12px 14px; min-height: 54px; line-height: 1.65;
}
.opt > :not(.lt) { grid-column: 2; }
button.opt { cursor: pointer; }
button.opt:active, .chrow:active, .navgrid button:active { background: var(--sunk); }
.opt .lt { font-family: var(--f-mono); font-weight: 600; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); color: var(--ink2); grid-row: 1 / span 3; }
.opt.sel { border-color: var(--pen); background: var(--pen-soft); }
.opt.sel .lt { background: var(--pen); color: var(--pen-ink); }
.opt.right { border: 2.5px solid var(--ok); background: var(--ok-soft); }
.opt.right .lt { background: var(--ok); color: var(--on-solid); }
.opt.wrong { border: 2px dashed var(--bad); background: var(--bad-soft); }
.opt.wrong .lt { background: var(--bad); color: var(--on-solid); }
.opt .tag { justify-self: start; font-size: var(--t-cap); font-weight: 700; line-height: 1.5; padding: 1px 9px; border-radius: 999px; color: var(--on-solid); }
.opt .tag.ok { background: var(--ok); }
.opt .tag.bad { background: var(--bad); }
.opt .why { font-size: var(--t-sm); color: var(--ink2); border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px; line-height: 1.65; }
.others { border: 1px solid var(--line); border-radius: 12px; padding: 2px 14px 6px; }
.others .opt { border: 0; padding: 10px 0; min-height: 0; background: none; border-top: 1px dashed var(--line); border-radius: 0; }
.others .opt .why { border: 0; margin: 0; padding: 0; }
.verdict { font-weight: 800; font-size: var(--t-h3); padding: 12px 14px; border-radius: 12px; scroll-margin-top: 80px; }
.verdict.ok { color: var(--ok); background: var(--ok-soft); }
.verdict.bad { color: var(--bad); background: var(--bad-soft); }

<script type="application/json" id="data">{"questions":[{"id":"c1-001","ch":1,"lo":"AuT-1.1","k":2,"q":"한 OEM(완성차 업체)이 최종 고객 개개인의 요구를 더 잘 맞추려고 차종 수를 계속 늘리고 있다. 그 결과 차종당 생산 수량이 줄었다.\n실라버스 1.1에 따르면, 늘어난 개발·생산 비용을 감당하기 위해 생산자가 쓰는 방법과 그 방법이 가져오는 어려움을 바르게 설명한 것은?","opts":["차종 수를 다시 줄여 차종당 수량을 늘린다. 대신 고객 개개인의 요구를 맞추기 어려워진다.","여러 차종을 공통 플랫폼의 변형으로 개발한다. 다만 플랫폼 개발은 수많은 변형을 통제해야 해서 단일 차종 개발보다 훨씬 복잡하다.","여러 차종을 공통 플랫폼의 변형으로 개발한다. 공통 플랫폼을 쓰면 변형을 따로 통제할 필요가 없어 단일 차종 개발보다 단순해진다.","차종마다 독립된 플랫폼을 따로 개발한다. 차종끼리 영향을 주지 않으므로 변형을 관리할 부담이 사라진다."],"ans":[1],"exp":"1.1 '차종 수와 복잡성 증가': 차종이 늘면 차종당 수량이 줄고, 늘어난 개발·생산 비용을 감당하려고 생산자는 여러 차종을 공통 플랫폼의 변형으로 개발한다. 그런데 플랫폼 개발은 가능한 많은 변형을 통제해야 하므로 단일 차종 개발보다 훨씬 복잡하다.","why":["실라버스는 차종을 줄이는 방법을 들지 않는다. 생산자는 공통 플랫폼의 변형으로 여러 차종을 개발한다(1.1).","정답. 공통 플랫폼으로 비용에 대응하지만, 많은 변형을 통제해야 해서 플랫폼 개발이 단일 차종보다 훨씬 복잡하다(1.1).","방법은 맞지만 결과가 반대다. 플랫폼 개발은 많은 변형을 통제해야 해서 더 복잡하다(1.1).","실라버스가 든 방법은 '공통' 플랫폼이다. 차종별 독립 플랫폼은 1.1에 없다."],"trap":"플랫폼 공용화를 개발 부담을 줄이는 방법으로만 생각하기 쉽다. 실라버스는 플랫폼 개발이 많은 변형을 통제해야 해서 단일 차종 개발보다 훨씬 복잡하다고 본다(1.1).","ref":"1.1"},{"id":"c1-002","ch":1,"lo":"AuT-1.1","k":2,"q":"다음 상황은 실라버스 1.1이 든 자동차 제품 개발의 어려움 중 어디에 해당하는가?\n\n고객들은 같은 차종을 사면서도 편의 기능 묶음과 주행 보조 기능을 각자 골라, 자기 차를 원하는 대로 맞추고 싶어 한다. 그래서 차종 하나에 기능까지 포함한 다양한 구성을 준비해야 한다.","opts":["차종 수와 복잡성 증가","기능 범위 증가","품질 요구사항 증가","구성 수 증가"],"ans":[3],"exp":"1.1 '구성 수 증가': 최종 고객은 자기 차종을 개인 취향에 맞추고 싶어 한다. 그래서 차종 하나에 기능 면까지 포함한 다양한 구성이 필요하다. 상황은 차종 하나를 고객별로 맞추는 이야기이므로 구성 수 증가에 해당한다.","why":["차종 수와 복잡성 증가는 차종 자체가 많아지고 공통 플랫폼으로 여러 차종을 개발하는 이야기다. 상황은 차종 하나 안의 구성 문제다.","기능 범위 증가는 기존 기능을 유지하면서 새 혁신 기능 요구가 계속 더해지는 것이다. 고객별로 기능을 골라 맞추는 것은 구성 수 증가다(1.1).","품질 요구사항 증가는 기능과 복잡성이 늘어도 같거나 더 높은 품질을 기대하는 것이다. 상황과 관계없다.","정답. 차종 하나를 개인 취향에 맞추려면 기능까지 포함한 다양한 구성이 필요하다(1.1)."],"ref":"1.1"},{"id":"c1-003","ch":1,"lo":"AuT-1.1","k":2,"q":"실라버스 1.1이 설명하는 자동차 제품 개발 환경으로 올바른 것을 두 개 고르시오.","opts":["최종 고객은 새로운 혁신 기능을 계속 요구하면서 기존 기능도 그대로 유지되기를 원한다. 그래서 기능 범위가 넓어진다.","비용 압박이 커지면서 OEM(완성차 업체)과 공급업체(supplier)는 예전보다 신차를 드물게 출시하고 있다.","차종 수가 늘어나면 차종당 생산 수량도 함께 늘어나 개발 비용 부담이 줄어든다.","기능과 복잡성이 늘어나도 최종 고객은 차량과 기능의 품질이 같거나 오히려 더 높기를 기대한다.","기능이 늘어나는 만큼 최종 고객은 어느 정도의 품질 저하를 받아들인다."],"ans":[0,3],"exp":"1.1 '기능 범위 증가': 최종 고객은 기존 기능을 유지하면서 더 많은 혁신을 요구하고, 그래서 기능 범위가 넓어진다. 1.1 '품질 요구사항 증가': 기능과 복잡성이 늘어도 최종 고객은 차량과 기능의 품질이 같거나 더 높기를 기대한다.","why":["정답. 1.1의 '기능 범위 증가' 설명과 같다.","반대다. OEM과 공급업체는 비용 압박이 커지는데도 예전보다 더 자주 신차를 출시한다(1.1).","반대다. 차종이 늘면 차종당 수량은 줄고, 늘어난 비용을 감당하려고 공통 플랫폼을 쓴다(1.1).","정답. 1.1의 '품질 요구사항 증가' 설명과 같다.","1.1은 최종 고객이 같거나 더 높은 품질을 기대한다고 한다. 품질 저하를 받아들인다는 내용은 없다."],"ref":"1.1"},{"id":"c1-004","ch":1,"lo":"AuT-1.1","k":2,"q":"한 공급업체(supplier)의 프로젝트 관리자가 다음과 같이 말했다.\n\n'다음 차종 프로젝트는 기능이 더 많고 구조도 더 복잡하다. 고객사인 OEM(완성차 업체)은 품질 요구 수준을 올렸고, 예산은 이전 프로젝트보다 줄었다.'\n\n실라버스 1.1에 따르면 이런 상황에서 OEM과 공급업체가 추구해야 하는 방향은?","opts":["더 효율적인 시스템 개발을 추구해, 이런 여건 속에서도 개발 기간을 줄일 수 있게 한다.","품질 요구사항을 맞추기 위해 개발 기간을 늘리는 것을 기본 방향으로 삼는다.","늘어난 복잡성과 품질 요구사항에 맞춰 예산을 늘리는 것을 기본 방향으로 삼는다.","예산과 일정을 지키기 위해 고객의 품질 요구 수준을 낮추는 것을 기본 방향으로 삼는다."],"ans":[0],"exp":"1.1: 프로젝트 목표들이 서로 경쟁하므로 OEM과 공급업체는 더 효율적인 시스템 개발을 추구해야 한다. 그 시스템 개발은 복잡성 증가, 품질 요구사항 증가, 더 적은 예산 속에서도 개발 기간을 줄일 수 있어야 한다.","why":["정답. 1.1의 결론 문장과 같다.","1.1은 개발 기간을 늘리는 것이 아니라 줄이는 방향을 말한다.","1.1은 예산이 줄어드는 상황을 전제로 한다. 예산을 늘리는 것은 실라버스가 말하는 방향이 아니다.","1.1은 품질 요구사항이 늘어나는 상황을 전제로 하고, 최종 고객은 같거나 더 높은 품질을 기대한다. 품질 요구를 낮추는 것은 실라버스가 말하는 방향이 아니다."],"ref":"1.1"},{"id":"c1-005","ch":1,"lo":"AuT-1.2","k":1,"q":"실라버스 1.2에 따르면 표준은 프로세스의 효율을 높인다. 그 수단으로 든 것이 **아닌** 것은?","opts":["통일된 명명(uniform naming)","협업이 쉬워짐(내부와 외부 모두)","조직마다 고유 용어를 자유롭게 정할 수 있음","축적된 경험(Best Practice)"],"ans":[2],"exp":"1.2: 표준은 다음 수단으로 프로세스 효율을 높인다(예: 품질을 안정적으로 유지하면서 개발 기간이나 비용을 줄임). ① 통일된 명명 ② 투명성 향상 ③ 협업이 쉬워짐(내부와 외부) ④ 재사용성 증가 ⑤ 축적된 경험('Best Practice'). 조직마다 고유 용어를 정하는 것은 ① 통일된 명명과 반대다.","why":["1.2 목록의 첫 번째 수단이다.","1.2 목록에 있다. 내부와 외부 협업을 모두 가리킨다.","정답. 1.2 목록에 없고, 오히려 '통일된 명명'과 반대다.","1.2 목록의 마지막 수단이다."],"ref":"1.2"},{"id":"c1-006","ch":1,"lo":"AuT-1.2","k":1,"q":"실라버스 1.2가 설명하는 표준의 역할로 올바른 것은?","opts":["표준은 회사 내부 권장 사항일 뿐이며 계약 조항이나 규제 조항에는 포함되지 않는다.","표준은 감사의 근거가 된다. 그래서 감사자는 제품이나 프로세스의 품질을 평가할 수 있다.","표준의 잘 정립된 기술 가이드라인은 리스크와 결함을 개발 후반에 한꺼번에 찾아 처리하도록 돕는다.","표준은 품질에만 영향을 주고 일정과 비용에는 영향을 주지 않는다."],"ans":[1],"exp":"1.2: 표준은 감사의 근거다. 그래서 감사자는 제품이나 프로세스의 품질을 평가할 수 있다.","why":["1.2는 표준이 계약 조항이나 규제 조항, 가이드라인의 일부라고 한다.","정답. 1.2의 감사 관련 설명과 같다.","1.2는 잘 정립된 기술 가이드라인이 리스크와 결함을 '조기에' 발견하고 해결하도록 돕는다고 한다.","1.2는 표준이 시간, 비용, 품질, 프로젝트 리스크, 제품 리스크 같은 주요 프로젝트 측면에 영향을 준다고 한다."],"ref":"1.2"},{"id":"c1-007","ch":1,"lo":"AuT-1.2","k":1,"q":"실라버스 1.2는 자동차 SW 테스팅과 관련된 표준을 몇 가지 언급한다. 이 중 표준화된 프로세스와 방법을 제공하는 표준으로 함께 묶인 것은?","opts":["ISO 26262와 ASPICE","ISO 26262와 AUTOSAR","ASPICE와 AUTOSAR","AUTOSAR만"],"ans":[0],"exp":"1.2: ISO 26262와 ASPICE는 표준화된 프로세스와 방법을 제공한다. AUTOSAR는 SW 아키텍처와 제품을 표준화한다.","why":["정답. 1.2가 프로세스와 방법을 제공하는 표준으로 함께 든 것이다.","AUTOSAR는 SW 아키텍처와 제품을 표준화하는 표준으로 따로 언급된다(1.2).","AUTOSAR는 SW 아키텍처와 제품을 표준화하는 표준으로 따로 언급된다(1.2).","AUTOSAR는 프로세스와 방법이 아니라 SW 아키텍처와 제품을 표준화한다(1.2)."],"ref":"1.2"},{"id":"c1-008","ch":1,"lo":"AuT-1.3","k":1,"q":"실라버스 1.3의 시스템 수명주기(system lifecycle) 6단계 중, 유지보수 테스팅(maintenance testing)이 전형적인 테스트 활동인 단계는?","opts":["utilization(활용)","support(지원)","production(생산)","retirement(폐기)"],"ans":[1],"exp":"1.3: support 단계에서는 지속적인 신뢰도를 확보하려고 유지보수 테스팅을 한다.","why":["utilization 단계에서는 보통 테스트 활동을 하지 않는다(1.3).","정답. support 단계의 전형적인 테스트 활동이 유지보수 테스팅이다(1.3).","production 단계의 테스트 활동은 준비 상태를 확인하는 EOL 테스트(end of line testing)다(1.3).","retirement 단계의 테스트 활동은 폐기나 데이터 이전을 밸리데이션하는 마이그레이션 테스팅(migration testing)이다(1.3)."],"trap":"차량이 고객 손에서 쓰이는 기간에 유지보수가 이뤄진다는 감각으로 utilization을 고르기 쉽다. 실라버스는 utilization에서는 보통 테스트 활동이 없고, 유지보수 테스팅은 support 단계에 둔다(1.3).","ref":"1.3"},{"id":"c1-009","ch":1,"lo":"AuT-1.3","k":1,"q":"시스템 수명주기(system lifecycle)의 단계와 그 단계의 전형적인 테스트 활동을 바르게 짝지은 것은?","opts":["concept(개념) – 유지보수 테스팅(maintenance testing)","utilization(활용) – 마이그레이션 테스팅(migration testing)","retirement(폐기) – EOL 테스트(end of line testing)","production(생산) – EOL 테스트(end of line testing)"],"ans":[3],"exp":"1.3: production 단계에서는 준비 상태를 확인하려고 EOL 테스트를 한다.","why":["concept 단계의 테스트 활동은 테스트 전략과 테스트 목적을 정의하는 테스트 계획이다. 유지보수 테스팅은 support 단계다(1.3).","utilization 단계에서는 보통 테스트 활동을 하지 않는다. 마이그레이션 테스팅은 retirement 단계다(1.3).","retirement 단계의 테스트 활동은 마이그레이션 테스팅이다. EOL 테스트는 production 단계다(1.3).","정답. production 단계의 전형적인 테스트 활동이다(1.3)."],"ref":"1.3"},{"id":"c1-010","ch":1,"lo":"AuT-1.3","k":1,"q":"실라버스 1.3에 따르면, 널리 쓰이는 자동차 제품 개발 프로세스는 시스템 수명주기(system lifecycle) 6단계를 흔히 3개의 주요 단계로 압축한다. 이 3단계는?","opts":["development(개발), production(생산), support(지원)","concept(개념), development(개발), utilization(활용)","concept(개념), development(개발), production(생산)","development(개발), production(생산), retirement(폐기)"],"ans":[2],"exp":"1.3: 널리 쓰이는 자동차 제품 개발 프로세스는 6단계를 흔히 concept(개념), development(개발), production(생산) 3개 주요 단계로 압축한다. 대부분의 테스팅과 릴리스 활동이 이 3단계에서 일어난다. (v2.1 기준. 2018년판도 같은 3단계를 들지만 '대부분의 테스팅과 릴리스 활동이 일어난다'는 설명은 없다.)","why":["concept가 빠지고 support가 들어갔다. 3단계는 concept, development, production이다(1.3).","production이 빠지고 utilization이 들어갔다. utilization은 보통 테스트 활동이 없는 단계다(1.3).","정답. 1.3이 든 3개 주요 단계다.","concept가 빠지고 retirement가 들어갔다. 3단계는 concept, development, production이다(1.3)."],"ref":"1.3"},{"id":"c1-011","ch":1,"lo":"AuT-1.4","k":1,"q":"실라버스 1.4에 따르면 테스터는 최종 테스트 보고서(final test report)를 통해 release process(릴리스 프로세스)에 중요한 정보를 전달한다. 최종 테스트 보고서에 담는 정보로 올바른 것을 두 개 고르시오.","opts":["구현 순서를 정하기 위한 기능 우선순위","알려진 결함","개발자별 코딩 생산성 실적","프로젝트 예산 집행 내역","제품 메트릭"],"ans":[1,4],"exp":"1.4: 테스터가 최종 테스트 보고서로 전달하는 정보는 ① 테스트한 항목 ② 평가한 품질 특성(예: 응답 시간, 자원 사용량) ③ 알려진 결함 ④ 제품 메트릭 ⑤ 완료 조건 달성 시 release recommendation(릴리스 권고)을 위한 정보다. 알려진 결함과 제품 메트릭이 여기에 들어간다. (v2.1 기준 5개 항목. 2018년판은 4개 항목이었지만 알려진 결함과 제품 메트릭은 두 판 모두에 있다.)","why":["기능 우선순위 지정은 최종 테스트 보고서 항목이 아니다. 1.4는 이것을 테스터가 '추가로' 작성에 참여하는 릴리스 관련 산출물로 따로 든다.","정답. 최종 테스트 보고서 항목이다(1.4).","1.4의 최종 테스트 보고서 항목에 없다. 보고서는 개발자 실적이 아니라 제품과 테스트에 관한 정보를 담는다.","1.4의 최종 테스트 보고서 항목에 없다.","정답. 최종 테스트 보고서 항목이다(1.4)."],"ref":"1.4"},{"id":"c1-012","ch":1,"lo":"AuT-1.4","k":1,"q":"실라버스 1.4가 설명하는 release item(릴리스 항목)으로 올바른 것은?","opts":["parameterization을 포함한 SW 구성, 필요하면 하드웨어와 기구, 그리고 지원 문서를 포함한다.","컴파일된 SW 바이너리만 포함한다. 파라미터와 문서는 릴리스 뒤에 따로 관리한다.","하드웨어와 기구는 어떤 경우에도 release item에 포함하지 않는다.","릴리스를 선언한 뒤에 목표 달성 여부를 확인하므로, 선언 시점의 release item은 아직 의도한 용도에 필요한 성숙도를 갖춘 것으로 보지 않는다."],"ans":[0],"exp":"1.4: release item은 parameterization을 포함한 SW 구성, 필요하면 하드웨어와 기구, 그리고 지원 문서를 포함한다. 프로젝트는 목표 달성이 확인되면 릴리스를 선언해 마일스톤에 도달하고, 이때부터 release item은 의도한 용도에 필요한 성숙도를 갖춘 것으로 본다.","why":["정답. 1.4의 release item 구성과 같다.","release item에는 parameterization을 포함한 SW 구성과 지원 문서가 들어간다(1.4).","1.4는 필요하면 하드웨어와 기구도 포함한다고 한다.","순서가 반대다. 목표 달성이 확인되면 릴리스를 선언하고, 그때부터 release item은 필요한 성숙도를 갖춘 것으로 본다(1.4)."],"trap":"현업에서는 '릴리스'를 SW 빌드 결과물을 내보내는 일로 좁게 생각하기 쉽다. 실라버스의 release item은 parameterization을 포함한 SW 구성에 필요하면 하드웨어·기구, 지원 문서까지 포함한다(1.4).","ref":"1.4"},{"id":"c2-001","ch":2,"lo":"AuT-2.1.1.1","k":1,"q":"ASPICE 심사 모델에서 process reference model(PRM)에 대한 설명으로 옳은 것은?","opts":["capability dimension에 정의되며, 프로세스 capability를 측정하는 process attribute를 담는다.","ISO/IEC 33020에 정의되어 있고, ASPICE는 이를 그대로 가져다 쓴다.","process dimension에 정의되며, 조직의 프로세스를 비교해 심사하고 개선할 수 있게 하는 기준 역할을 한다.","capability level 0~3을 정의하며, 심사원(assessor)은 이를 기준으로 레벨을 매긴다."],"ans":[2],"exp":"2.1.1.1: ASPICE는 process dimension에서 PRM을 정의한다. PRM은 조직의 프로세스를 비교할 기준(reference)이어서 프로세스를 심사하고 개선할 수 있게 한다. 각 프로세스의 목적, 결과, 필요한 활동(base practice)도 process dimension에서 정의한다.","why":["process attribute는 capability dimension에서 정의하는 것이고, PRM은 process dimension에 있다(2.1.1.1).","ISO/IEC 33020은 프로세스 capability 심사의 기반일 뿐이다. PRM은 ASPICE가 process dimension에서 직접 정의한다(2.1.1.1).","정답. process dimension의 PRM은 조직 프로세스를 비교·심사·개선하는 기준이다(2.1.1.1).","capability level은 capability dimension에 있다(2.1.1.3). PRM과는 다른 축이다."],"ref":"2.1.1.1"},{"id":"c2-002","ch":2,"lo":"AuT-2.1.1.1","k":1,"q":"ASPICE의 capability dimension에서 정의하는 것은?","opts":["capability level을 나누는 여러 process attribute(측정 가능한 특성)","각 프로세스의 목적, 결과, base practice, information item","조직의 프로세스를 비교할 기준이 되는 process reference model","프로세스 심사를 맡는 심사원의 자격 요건"],"ans":[0],"exp":"2.1.1.1: capability dimension에서 ASPICE는 capability level을 나누는 여러 process attribute(측정 가능한 특성)를 정의한다. 프로세스마다 generic attribute와 process specific attribute가 있다. 이 모델로 프로세스(process dimension)를 그 capability(capability dimension) 관점에서 심사할 수 있다.","why":["정답. process attribute는 측정 가능한 특성이며 capability level을 나눈다(2.1.1.1).","프로세스의 목적, 결과, base practice(필요한 활동), information item은 process dimension에서 정의한다(2.1.1.1).","PRM은 process dimension에서 정의한다(2.1.1.1).","실라버스는 두 dimension을 설명하면서 심사원 자격 요건을 다루지 않는다."],"ref":"2.1.1.1"},{"id":"c2-003","ch":2,"lo":"AuT-2.1.1.1","k":1,"q":"실라버스에 따르면 ASPICE에서 프로세스 capability 심사의 기반이 되는 표준은?","opts":["ISO 26262","ISO/IEC/IEEE 29119-3","ISO 29148","ISO/IEC 33020"],"ans":[3],"exp":"2.1.1.1: capability dimension 설명에서 ISO/IEC 33020이 프로세스 capability 심사의 기반이 된다고 쓴다.","why":["ISO 26262는 E/E 시스템의 기능 안전(functional safety) 표준이다(2.2). capability 심사의 기반이 아니다.","ISO/IEC/IEEE 29119-3은 information item을 더 구조화하는 데 쓸 수 있는 표준이다(2.1.2.4).","ISO 29148은 요구사항 품질 특성의 출처다(4.1.2).","정답. ISO/IEC 33020이 프로세스 capability 심사의 기반이다(2.1.1.1)."],"ref":"2.1.1.1"},{"id":"c2-004","ch":2,"lo":"AuT-2.1.1.3","k":2,"q":"어느 프로젝트의 테스트 프로세스를 심사했다. 테스터는 요구사항 가운데 일부만 확인했고, 프로세스 결과를 체계적으로 달성했다는 근거도 거의 없었다. 프로세스가 목적을 달성했다고 보기도 어려웠다.\n이 프로세스의 capability level로 가장 알맞은 것은?","opts":["Level 1(performed process)","Level 0(incomplete process)","Level 2(managed process)","Level 3(established process)"],"ans":[1],"exp":"2.1.1.3: Level 0은 프로세스가 구현되지 않았거나 목적을 달성하지 못한 상태다. 프로세스 결과를 체계적으로 달성했다는 근거가 거의 없다. 실라버스 예시도 '테스터가 요구사항의 작은 일부만 확인한다'이다. 문제 상황이 그대로 들어맞는다.","why":["Level 1은 구현된 프로세스가 목적을 달성하는 수준이다(2.1.1.3). 실라버스 예시에서도 테스터는 요구사항 충족 정도를 보여 줄 수 있다. 여기서는 목적 달성이 안 됐다.","정답. 목적 미달성, 체계적 근거 거의 없음, 요구사항 일부만 확인은 Level 0의 설명이다(2.1.1.3).","Level 2는 프로젝트가 테스트 프로세스를 계획하고 감독하는 수준이다(2.1.1.3). 목적 달성조차 안 된 상황과 맞지 않는다.","Level 3은 표준화된 테스트 프로세스를 쓰고 발견 사항으로 계속 개선하는 수준이다(2.1.1.3)."],"ref":"2.1.1.3"},{"id":"c2-005","ch":2,"lo":"AuT-2.1.1.3","k":2,"q":"어느 공급업체(supplier)의 테스트 프로세스를 심사했다. 테스트 계획은 일부만 있어 전체 계획이 보이지 않고, 수행 방식도 매번 조금씩 달랐다. 그래도 프로세스는 목적을 달성했고, 테스터는 요구사항이 어느 정도 충족됐는지 보여 줄 수 있었다.\n이 상황에 가장 알맞은 capability level은?","opts":["Level 0(incomplete process)","Level 2(managed process)","Level 3(established process)","Level 1(performed process)"],"ans":[3],"exp":"2.1.1.3: Level 1은 구현된 프로세스가 목적을 달성하는 수준이다. 다만 일관되지 않게 수행될 수 있다. 실라버스 예시도 '테스트 프로세스의 완전한 계획은 보이지 않지만, 테스터는 요구사항 충족 정도를 보여 줄 수 있다'이다.","why":["Level 0은 프로세스가 목적을 달성하지 못하는 수준이다(2.1.1.3). 여기서는 목적을 달성했다.","Level 2는 프로젝트가 테스트 프로세스를 계획하고 감독해야 한다(2.1.1.3). 전체 계획이 보이지 않으므로 해당하지 않는다.","Level 3은 표준화된 테스트 프로세스와 지속적 개선이 있어야 한다(2.1.1.3).","정답. 목적은 달성하지만 일관성이 없고 완전한 계획이 없는 것은 Level 1이다(2.1.1.3)."],"ref":"2.1.1.3"},{"id":"c2-006","ch":2,"lo":"AuT-2.1.1.3","k":2,"q":"회사에 조직 테스트 전략(organizational test strategy)이 있고, 프로젝트들은 표준화된 테스트 프로세스를 쓴다. 테스트 완료 후에는 테스트 관리자가 프로젝트에서 얻은 발견 사항을 바탕으로 이 전략을 계속 발전시킨다.\n이 설명에 해당하는 capability level은?","opts":["Level 3(established process)","Level 2(managed process)","Level 1(performed process)","Level 0(incomplete process)"],"ans":[0],"exp":"2.1.1.3: Level 3에서는 프로젝트가 표준화된 테스트 프로세스를 쓰고, 발견 사항을 지속적 개선에 쓴다. 실라버스 예시도 '조직 테스트 전략이 있고, 테스트 완료 후 테스트 관리자가 그것을 더 발전시킨다'이다.","why":["정답. 표준화된 프로세스와 발견 사항을 이용한 지속적 개선은 Level 3이다(2.1.1.3).","Level 2는 프로젝트 단위로 계획·감독·조정하는 수준이다(2.1.1.3). 조직 표준 프로세스와 지속 개선은 Level 3의 특징이다.","Level 1은 목적을 달성하지만 일관되지 않을 수 있는 수준이다(2.1.1.3).","Level 0은 프로세스가 목적을 달성하지 못하는 수준이다(2.1.1.3)."],"ref":"2.1.1.3"},{"id":"c2-007","ch":2,"lo":"AuT-2.1.1.3","k":2,"q":"어느 프로젝트에서 테스트 관리자가 테스트 목적을 정하고 테스트 활동을 계획했다. 테스트 실행 중 일정이 밀리자 테스트 목적을 달성하려고 진행 방식을 조정했다. 테스트 작업 산출물(work product)에 대한 요구사항이 정해져 있고, 프로젝트 구성원이 산출물을 리뷰하고 승인한다.\n다만 이 방식은 이 프로젝트에서만 쓰며, 조직 차원의 표준 테스트 프로세스는 없다.\n가장 알맞은 capability level은?","opts":["Level 1(performed process)","Level 3(established process)","Level 2(managed process)","Level 0(incomplete process)"],"ans":[2],"exp":"2.1.1.3: Level 2에서는 프로젝트가 테스트 프로세스를 계획하고 감독한다. 필요하면 테스트 목적을 달성하려고 진행 방식을 조정한다. 작업 산출물에 대한 요구사항이 정해져 있고, 프로젝트 구성원이 산출물을 리뷰하고 승인한다. Level 3이 되려면 표준화된 테스트 프로세스와 지속적 개선이 더 있어야 하는데, 문제에서는 조직 표준 프로세스가 없다.","why":["Level 1은 계획이 완전하지 않아도 목적만 달성하면 되는 수준이다(2.1.1.3). 계획·감독·조정과 산출물 리뷰·승인까지 있으므로 그보다 높다.","Level 3은 표준화된 테스트 프로세스를 써야 한다(2.1.1.3). 문제에는 조직 표준 프로세스가 없다.","정답. 프로젝트 단위의 계획·감독·조정, 산출물 요구사항 정의와 리뷰·승인은 Level 2다(2.1.1.3).","Level 0은 목적을 달성하지 못하는 수준이다(2.1.1.3)."],"trap":"계획과 관리가 잘 되는 프로젝트를 두고 '프로세스가 정착됐다(established)'고 부르기 쉽다. 실라버스는 표준화된 테스트 프로세스를 쓰고 발견 사항으로 계속 개선해야 Level 3으로 보고, 프로젝트 단위의 계획·감독·조정은 Level 2로 본다(2.1.1.3).","ref":"2.1.1.3"},{"id":"c2-008","ch":2,"lo":"AuT-2.1.1.3","k":2,"q":"ASPICE의 capability level에 대한 설명으로 옳은 것 두 개를 고르시오.","opts":["Level 0에서는 프로세스가 문서화되지 않았을 뿐 목적은 달성된다.","Level 1에서는 구현된 프로세스가 목적을 달성하지만, 일관되지 않게 수행될 수도 있다.","Level 2가 되려면 조직 차원의 표준화된 테스트 프로세스를 써야 한다.","심사원은 6단계 레벨 체계로 프로세스 capability를 심사하며, Level 4와 5는 현재 자동차 업계의 관심 대상이 아니다.","작업 산출물에 대한 요구사항을 정하고 리뷰·승인하는 것은 Level 3에서 처음 요구된다."],"ans":[1,3],"exp":"2.1.1.3: 심사원은 6단계 레벨 체계로 프로세스 capability를 심사하고, ASPICE는 capability level 0~3을 정의한다(각주: Level 4와 5는 현재 자동차 업계의 관심 대상이 아니다). Level 1은 구현된 프로세스가 목적을 달성하지만 일관되지 않게 수행될 수 있는 수준이다.","why":["Level 0은 프로세스가 구현되지 않았거나 목적을 달성하지 못하는 수준이다(2.1.1.3).","정답. Level 1(performed process)의 설명이다(2.1.1.3).","표준화된 테스트 프로세스는 Level 3의 특징이다(2.1.1.3). Level 2는 프로젝트가 계획하고 감독하는 수준이다.","정답. 6단계 레벨 체계와 각주 7의 설명이다(2.1.1.3).","작업 산출물 요구사항 정의와 리뷰·승인은 이미 Level 2에 있다(2.1.1.3)."],"ref":"2.1.1.3"},{"id":"c2-009","ch":2,"lo":"AuT-2.1.2.1","k":1,"q":"ASPICE의 software unit verification(SWE.4)은 무엇을 기준으로 평가하는가?","opts":["software requirements analysis(SWE.1)의 결과","software detailed design(SWE.3)","software architectural design(SWE.2)","system requirements analysis(SYS.2)의 결과"],"ans":[1],"exp":"2.1.2.1: SWE.4는 정적 테스팅과 동적 테스팅을 요구하며, 소프트웨어의 컴포넌트(원문 components of the software)를 상세 설계(SWE.3)를 기준으로 평가한다. 6장 정의는 software unit verification을 '소프트웨어 유닛이 상세 설계와 일치하는지에 대한 베리피케이션(verification)'으로 적는다.","why":["SWE.1(소프트웨어 요구사항)을 기준으로 통합된 소프트웨어를 평가하는 것은 SWE.6 software verification이다(2.1.2.1).","정답. SWE.4의 기준은 상세 설계(SWE.3)다(2.1.2.1).","SWE.2(소프트웨어 아키텍처 설계)를 기준으로 하는 것은 SWE.5다(2.1.2.1).","SYS.2(시스템 요구사항)를 기준으로 통합된 시스템을 평가하는 것은 SYS.5다(2.1.2.1)."],"trap":"화이트박스 단위 테스트에 익숙하면 소스 코드 구조 자체를 기준으로 생각하기 쉽다. 실라버스는 SWE.4가 상세 설계(SWE.3)를 기준으로 평가하고, 동적 테스팅뿐 아니라 정적 테스팅도 요구한다고 쓴다(2.1.2.1).","ref":"2.1.2.1"},{"id":"c2-010","ch":2,"lo":"AuT-2.1.2.1","k":1,"q":"실라버스 2.1.2.1은 ASPICE의 테스트 관련 프로세스(SWE.4~SWE.6, SYS.4, SYS.5)를 나열하고, 각주로 VAL 프로세스 그룹도 있다고 덧붙인다.\n각주가 인용한 VAL.1의 목적으로 맞는 것은?","opts":["최종 사용자가 직접 상호작용하는 최종 제품이 운영 대상 환경에서 의도된 사용 기대를 만족한다는 증거를 제공한다.","통합된 소프트웨어가 소프트웨어 요구사항과 일치한다는 증거를 제공한다.","통합된 시스템 요소가 system architectural design(SYS.3)과 일치한다는 증거를 제공한다.","아이템이 차량 수준에서 ISO 26262의 안전 목표(safety goal)를 달성한다는 증거를 제공한다."],"ans":[0],"exp":"2.1.2.1 각주: 위 테스트 프로세스 외에 VAL 프로세스 그룹도 있다. VAL.1의 목적은 '최종 사용자가 직접 상호작용하는 최종 제품이 운영 대상 환경에서 의도된 사용 기대를 만족한다는 증거를 제공하는 것'이다(원문 \"to provide evidence that the end product, allowing direct end user interaction, satisfies the intended use expectations in its operational target environment\"). 2.4.2 표 2에서 Validation(VAL.1)은 인수 테스팅 행에 놓인다. (v2.1 기준. 2018년판(ASPICE 3.1 기준)에는 이 각주가 없다.)","why":["정답. 2.1.2.1 각주가 인용한 VAL.1의 목적이다.","통합된 소프트웨어를 소프트웨어 요구사항 기준으로 보는 것은 software verification(SWE.6)이다(2.1.2.1).","통합된 시스템을 system architectural design(SYS.3) 기준으로 보는 것은 system integration and integration verification(SYS.4)이다(2.1.2.1).","안전 목표(safety goal)는 ISO 26262 쪽 개념이다(2.2.4.1). 각주가 인용한 VAL.1의 목적은 최종 사용자가 직접 상호작용하는 최종 제품과 의도된 사용 기대를 말한다."],"ref":"2.1.2.1"},{"id":"c2-011","ch":2,"lo":"AuT-2.1.2.1","k":1,"q":"ASPICE의 테스트 관련 프로세스와, 그 프로세스가 평가 기준으로 삼는 산출물을 바르게 짝지은 것은?","opts":["software component verification and integration verification(SWE.5) - software requirements analysis(SWE.1)","system verification(SYS.5) - system architectural design(SYS.3)","software unit verification(SWE.4) - software architectural design(SWE.2)","system integration and integration verification(SYS.4) - system architectural design(SYS.3)"],"ans":[3],"exp":"2.1.2.1: system integration and integration verification(SYS.4)은 통합된 시스템을 system architectural design(SYS.3)을 기준으로 평가한다. 나머지 짝은 SWE.5-SWE.2, SWE.6-SWE.1, SYS.5-SYS.2, SWE.4-SWE.3이다. (v2.1 기준 프로세스 이름. 2018년판에서는 SWE.5 software integration test, SYS.4 system integration test, SYS.5 system qualification test였다. 기준 산출물의 대응은 같다.)","why":["SWE.5의 기준은 software architectural design(SWE.2)이다(2.1.2.1).","SYS.5의 기준은 system requirements analysis(SYS.2)다(2.1.2.1).","SWE.4의 기준은 software detailed design(SWE.3)이다(2.1.2.1).","정답. SYS.4는 SYS.3을 기준으로 통합된 시스템을 평가한다(2.1.2.1)."],"ref":"2.1.2.1"},{"id":"c2-012","ch":2,"lo":"AuT-2.1.2.2","k":2,"q":"ASPICE 심사에서 심사원(assessor)이 어떤 process attribute의 capability indicator 이행 정도를 정확히 50%로 판단했다.\n이 process attribute의 평가 등급(rating level)은?","opts":["N(None)","L(Largely)","P(Partly)","F(Fully)"],"ans":[2],"exp":"2.1.2.2: process attribute는 capability indicator의 이행 정도를 네 평가 등급으로 매긴다. N: 0% 이상 15% 이하, P: 15% 초과 50% 이하, L: 50% 초과 85% 이하, F: 85% 초과 100% 이하. 50%는 P 구간의 상한(≤ 50%)에 들어가므로 P다. L은 50%를 '초과'해야 한다.","why":["N은 15% 이하다(2.1.2.2).","L은 50% 초과부터다. 정확히 50%는 L에 들지 않는다(2.1.2.2).","정답. P는 15% 초과 50% 이하다(2.1.2.2).","F는 85% 초과다(2.1.2.2)."],"ref":"2.1.2.2"},{"id":"c2-013","ch":2,"lo":"AuT-2.1.2.2","k":2,"q":"실라버스는 SWE.6을 예로 들어 capability level 1~3의 process attribute(PA)를 설명한다.\n'테스터가 테스트웨어(testware)의 품질을 확인한다'는 활동은 어느 PA의 예인가?","opts":["PA 1.1 process performance","PA 2.2 work product management","PA 3.1 process definition","PA 3.2 process deployment"],"ans":[1],"exp":"2.1.2.2: PA 2.2 work product management의 예는 '테스터가 테스트웨어의 품질을 확인한다'이다. 각주는 work product management가 문서화된 모든 정보에 적용된다고 덧붙인다. (2018년판 예시는 '테스트 문서'의 품질 확인이었다. 가리키는 PA는 같다.)","why":["PA 1.1의 예는 테스터가 테스트 프로세스를 따르는 것이다(2.1.2.2).","정답. 산출물(테스트웨어) 품질 확인은 PA 2.2 work product management다(2.1.2.2).","PA 3.1의 예는 테스트 프로세스 책임자가 조직 테스트 전략을 정의하는 것이다(2.1.2.2).","PA 3.2의 예는 테스터가 PA 3.1에서 정의한 테스트 전략을 적용하는 것이다(2.1.2.2)."],"ref":"2.1.2.2"},{"id":"c2-014","ch":2,"lo":"AuT-2.1.2.2","k":2,"q":"테스트 프로세스 책임자가 조직 테스트 전략을 정의해 두었다. 이제 각 프로젝트의 테스터가 그 전략을 실제 테스트에 적용한다.\n테스터의 이 활동은 어느 process attribute(PA)의 예인가?","opts":["PA 3.1 process definition","PA 2.1 process performance management","PA 1.1 process performance","PA 3.2 process deployment"],"ans":[3],"exp":"2.1.2.2: PA 3.2 process deployment의 예는 '테스터가 PA 3.1에서 정의한 테스트 전략을 적용한다'이다. 전략을 정의하는 쪽(테스트 프로세스 책임자)은 PA 3.1, 정의된 전략을 적용하는 쪽(테스터)은 PA 3.2다.","why":["PA 3.1은 테스트 프로세스 책임자가 조직 테스트 전략을 정의하는 것이다(2.1.2.2). 문제의 활동은 정의가 아니라 적용이다.","PA 2.1의 예는 테스터가 테스트 활동을 계획·감독·통제하는 것이다(2.1.2.2).","PA 1.1의 예는 테스터가 테스트 프로세스를 따르는 것이다(2.1.2.2). PA 3.1에서 정의한 전략의 적용은 PA 3.2로 따로 정의돼 있다.","정답. 정의된 테스트 전략을 적용하는 것은 PA 3.2다(2.1.2.2)."],"ref":"2.1.2.2"},{"id":"c2-015","ch":2,"lo":"AuT-2.1.2.2","k":2,"q":"ASPICE가 프로세스 실행(process execution)에 대해 정의하는 capability indicator는 두 종류다. 그중 각 프로세스에 필요한 활동을 나타내는 것은?","opts":["base practice(BP)","generic practice(GP)","process attribute(PA)","평가 등급(rating level)"],"ans":[0],"exp":"2.1.2.2: 프로세스 실행에 대한 capability indicator는 base practice(BP)와 information item 두 종류다. 2.1.1.1은 base practice를 각 프로세스에 필요한 활동(required actions)이라고 설명한다. generic practice(GP)는 이 두 종류와 별도로('추가로') 정의된다. (v2.1 기준으로 나머지 한 종류는 information item이다. 2018년판에서는 work product(WP)였다. BP는 두 판이 같다.)","why":["정답. base practice는 프로세스 실행용 capability indicator이며 필요한 활동을 뜻한다(2.1.1.1, 2.1.2.2).","GP는 프로세스 실행용 두 종류에 '추가로' 정의되는 것이다(2.1.2.2).","PA는 capability indicator로 평가받는 대상이다. capability indicator의 한 종류가 아니다(2.1.2.2).","평가 등급(N/P/L/F)은 indicator의 이행 정도를 매기는 척도다(2.1.2.2)."],"ref":"2.1.2.2"},{"id":"c2-016","ch":2,"lo":"AuT-2.1.2.2","k":2,"q":"ASPICE의 평가 등급과 process attribute(PA)에 대한 설명으로 옳은 것 두 개를 고르시오.","opts":["ASPICE는 9개 process attribute에 대해 capability indicator를 정의한다.","평가 등급 L(Largely)은 85% 초과 100% 이하 이행을 뜻한다.","평가 등급 N(None)은 이행 정도가 정확히 0%일 때만 준다.","PA 1.1의 예는 테스트 프로세스 책임자가 조직 테스트 전략을 정의하는 것이다.","PA 2.1의 예는 테스터가 테스트 활동을 계획하고 감독하고 통제하는 것이다."],"ans":[0,4],"exp":"2.1.2.2: 심사원은 capability indicator로 프로세스 capability를 심사하며, ASPICE는 이를 9개 process attribute에 대해 정의한다. PA 2.1 process performance management의 예는 테스터가 테스트 활동을 계획·감독·통제하는 것이다. (v2.1 기준 PA 2.1 이름. 2018년판에서는 performance management였다. 예시 내용은 같다.)","why":["정답. 9개 process attribute다(2.1.2.2).","L은 50% 초과 85% 이하다. 85% 초과는 F다(2.1.2.2).","N은 0% 이상 15% 이하 구간이다(2.1.2.2).","조직 테스트 전략 정의는 PA 3.1의 예다. PA 1.1의 예는 테스터가 테스트 프로세스를 따르는 것이다(2.1.2.2).","정답. PA 2.1의 예다(2.1.2.2)."],"ref":"2.1.2.2"},{"id":"c2-017","ch":2,"lo":"AuT-2.1.2.3","k":2,"q":"실라버스에 따르면 ASPICE가 요구하는 테스트 전략(test strategy)은 누가, 언제 만드는가?","opts":["심사원(assessor)이 심사를 준비하면서 만든다.","테스터가 테스트 실행을 마친 뒤 결과를 보고 만든다.","테스트 관리자가 테스트 계획(test planning) 중에 만든다.","개발자가 software detailed design(SWE.3)을 작성하면서 함께 만든다."],"ans":[2],"exp":"2.1.2.3: 테스트 전략은 테스트 관리자가 테스트 계획 중에 만든다. 테스트 지침, 프로젝트 목표, 계약·규제 요구사항이 그 기반이다.","why":["심사원은 프로세스 capability를 심사하는 사람이다(2.1.1.3, 2.1.2.2). 테스트 전략을 만드는 사람이 아니다.","테스트 전략은 테스트 실행 전, 테스트 계획 중에 만든다(2.1.2.3).","정답. 테스트 관리자가 테스트 계획 중에 만든다(2.1.2.3).","실라버스는 테스트 전략 작성자를 테스트 관리자로 적는다(2.1.2.3)."],"ref":"2.1.2.3"},{"id":"c2-018","ch":2,"lo":"AuT-2.1.2.3","k":2,"q":"테스트 관리자가 ASPICE에 맞는 테스트 전략을 만들려고 한다.\n실라버스가 테스트 전략의 기반이라고 밝힌 것은?","opts":["직전 심사에서 받은 capability level과 평가 등급","테스트 지침, 프로젝트 목표, 계약 요구사항과 규제 요구사항","개발자가 작성한 유닛 소스 코드와 정적 분석 결과","이전 릴리스의 테스트 로그와 결함 보고서"],"ans":[1],"exp":"2.1.2.3: 테스트 지침, 프로젝트 목표, 계약 요구사항과 규제 요구사항(contractual and regulatory requirements)이 테스트 전략의 기반이 된다.","why":["심사 결과는 실라버스가 든 테스트 전략의 기반에 없다(2.1.2.3).","정답. 실라버스가 든 세 가지 기반이다(2.1.2.3).","소스 코드와 정적 분석 결과는 유닛 베리피케이션(unit verification)의 대상·결과다(2.1.2.5). 테스트 전략의 기반으로 든 것이 아니다.","테스트 로그와 결함 보고서는 verification results(15-52)에 해당하는 예다(2.1.2.4). 테스트 전략의 기반으로 든 것이 아니다."],"ref":"2.1.2.3"},{"id":"c2-019","ch":2,"lo":"AuT-2.1.2.3","k":2,"q":"자동차 소프트웨어 테스팅에도 조기 테스팅(early testing) 원리가 적용된다. 실라버스는 여기에 더해 테스트 전략에서 고려할 측면을 하나 더 든다.\n그 측면과 그에 따라 테스트 전략이 정하는 내용으로 옳은 것은?","opts":["상위 테스트 레벨일수록 결함 수정 비용이 낮으므로, 테스트를 가능한 한 늦은 레벨에 몰아서 한다.","하위 테스트 레벨의 테스트 환경이 가장 비싸므로, 유닛 수준 테스트를 최소화한다.","테스트 환경 비용은 레벨과 관계없이 같으므로, 테스트 전략이 레벨별 환경을 따로 두지 않고 모든 테스트를 차량에서 한 번에 수행하게 한다.","상위 테스트 레벨의 테스트 환경이 훨씬 비싸므로, 테스트 전략이 레벨별 테스트 환경과 어떤 테스트를 어느 환경에서 할지를 정한다."],"ans":[3],"exp":"2.1.2.3: 상위 테스트 레벨의 테스트 환경은 훨씬 비싸다. 예를 들어 특별히 개발한 임베디드 하드웨어(프로토타입이나 단일 모델)가 필요하다. 그래서 테스트 전략은 레벨별 테스트 환경을 정하고, 테스터가 어떤 테스트를 어느 테스트 환경에서 해야 하는지도 정한다.","why":["실라버스는 상위 레벨의 테스트 환경이 더 비싸다고 쓴다(2.1.2.3). 늦게 몰아서 하라는 말은 조기 테스팅 원리와도 어긋난다.","비싼 쪽은 상위 테스트 레벨의 테스트 환경이다(2.1.2.3).","실라버스는 상위 테스트 레벨의 테스트 환경이 훨씬 비싸다고 쓰고, 그래서 테스트 전략이 레벨별 테스트 환경을 정한다고 한다(2.1.2.3).","정답. 비용 차이 때문에 테스트 전략이 레벨별 테스트 환경과 테스트 배치를 정한다(2.1.2.3)."],"ref":"2.1.2.3"},{"id":"c2-020","ch":2,"lo":"AuT-2.1.2.3","k":2,"q":"릴리스를 앞둔 프로젝트에서 테스트 관리자가 리그레션 테스트 대상을 고르려 한다.\nASPICE의 criteria for regression verification에 대한 실라버스 설명에 맞는 접근은?","opts":["영향도 분석으로 집중할 영역을 찾고, 리스크 기반으로 리그레션 테스트를 고른다.","criteria for regression verification은 테스트 전략과 별개이므로, 테스트 전략과 상관없이 개발팀이 정한다.","변경되지 않은 영역은 리그레션 테스트 대상에서 항상 뺀다.","ASPICE는 매 릴리스마다 모든 테스트 케이스를 수동으로 다시 실행하도록 요구한다."],"ans":[0],"exp":"2.1.2.3: criteria for regression verification은 테스트 전략의 핵심 부분이다. 리그레션 테스트를 고르는 방식은 예를 들어 리스크 기반일 수 있고, 영향도 분석은 테스터가 리그레션 테스트로 집중할 영역을 찾는 데 도움이 된다. 테스트 관리자가 릴리스마다 자동화된 테스트 케이스 전체를 다시 실행하라고 할 수도 있다. (v2.1 기준 용어. 2018년판에서는 regression test strategy라고 불렀다. 리스크 기반 선택과 영향도 분석 내용은 같다.)","why":["정답. 리스크 기반 선택과 영향도 분석은 실라버스가 든 예다(2.1.2.3).","criteria for regression verification은 테스트 전략의 핵심 부분이다(2.1.2.3).","실라버스는 테스트 관리자가 자동화된 테스트 케이스 전체 재실행을 요청할 수도 있다고 쓴다(2.1.2.3). 변경되지 않은 영역을 항상 빼라는 규칙은 없다.","실라버스의 과제는 테스트 케이스를 경제적으로 합리적으로 고르는 것이다. 전체 재실행은 테스트 관리자가 자동화된 테스트 케이스에 대해 요청할 수 있는 선택지일 뿐이다(2.1.2.3)."],"ref":"2.1.2.3"},{"id":"c2-021","ch":2,"lo":"AuT-2.1.2.3","k":2,"q":"실라버스는 criteria for regression verification을 테스트 전략의 핵심 부분이라고 한다.\n리그레션 베리피케이션(regression verification)에서 실라버스가 꼽은 어려운 점(challenge)은?","opts":["리그레션 테스트를 자동화할 도구를 고르는 것","변경 요청과 결함 보고서 사이에 추적성을 만드는 것","테스트 케이스를 경제적으로 합리적으로 고르는 것","심사원에게서 리그레션 테스트 결과를 승인받는 것"],"ans":[2],"exp":"2.1.2.3: criteria for regression verification은 리그레션 베리피케이션의 세부 사항을 정한다. 어려운 점은 테스트 케이스를 경제적으로 합리적으로 고르는 것(테스팅의 부가가치)이다. (v2.1 기준 용어. 2018년판에서는 regression test strategy라고 불렀고, 어려운 점에 대한 설명은 같다.)","why":["실라버스는 도구 선택을 어려운 점으로 들지 않는다(2.1.2.3).","변경 요청과 결함 보고서의 추적성은 2.1.2.6의 내용이다. 리그레션 베리피케이션의 어려운 점으로 든 것이 아니다.","정답. 경제적으로 합리적인 테스트 케이스 선택이 어려운 점이다(2.1.2.3).","실라버스에 심사원 승인 이야기는 없다(2.1.2.3)."],"ref":"2.1.2.3"},{"id":"c2-022","ch":2,"lo":"AuT-2.1.2.4","k":1,"q":"ASPICE 4.0이 테스트 활동에 요구하는 information item 가운데 15-52 Verification results에 들어가는 예는?","opts":["시뮬레이션(simulation)","결함 보고서(defect report)","정적 테스트(static test)","동적 테스트(dynamic test)"],"ans":[1],"exp":"2.1.2.4: 15-52 Verification results의 예는 문서화된 베리피케이션 로그(verification logs), 테스트 보고서, 결함 보고서다. 시뮬레이션, 동적 테스트, 정적 테스트는 08-60 Verification measures의 예다. (v2.1 기준. 2018년판(ASPICE 3.1)은 work product WP 08-50, 08-52, 13-50으로 설명했다.)","why":["시뮬레이션은 08-60 Verification measures의 예다(2.1.2.4).","정답. 결함 보고서는 15-52 Verification results의 예다(2.1.2.4).","정적 테스트는 08-60 Verification measures의 예다(2.1.2.4).","동적 테스트는 08-60 Verification measures의 예다(2.1.2.4)."],"ref":"2.1.2.4"},{"id":"c2-023","ch":2,"lo":"AuT-2.1.2.4","k":1,"q":"ASPICE 4.0의 information item 08-60 Verification measures에 대한 설명으로 옳은 것은?","opts":["문서화된 베리피케이션 로그, 테스트 보고서, 결함 보고서 같은 베리피케이션 결과를 담는다.","심사원이 매긴 process attribute별 평가 등급을 담는다.","변경 요청과 그 영향을 받는 작업 산출물 사이의 링크를 담는다.","시뮬레이션, 동적 테스트, 정적 테스트 같은 베리피케이션 수단이며, 보통 테스트 계획서에 문서화한다."],"ans":[3],"exp":"2.1.2.4: 08-60 Verification measures는 베리피케이션 수단(예: 시뮬레이션, 동적 테스트, 정적 테스트)이며 보통 테스트 계획서에 문서화한다. (v2.1 기준. 2018년판(ASPICE 3.1)은 work product WP 08-50, 08-52, 13-50으로 설명했다.)","why":["베리피케이션 로그, 테스트 보고서, 결함 보고서는 15-52 Verification results의 예다(2.1.2.4).","실라버스가 든 테스트 활동용 information item에 심사 평가 등급은 없다(2.1.2.4).","변경 요청과 작업 산출물 사이의 양방향 추적성은 SUP.10의 요구사항이다(2.1.2.6). 08-60의 내용이 아니다.","정답. 08-60의 설명 그대로다(2.1.2.4)."],"ref":"2.1.2.4"},{"id":"c2-024","ch":2,"lo":"AuT-2.1.2.4","k":1,"q":"ASPICE 4.0의 테스트웨어(testware) 관련 요구에 대한 설명으로 옳은 것 두 개를 고르시오.","opts":["ASPICE 4.0은 테스트 케이스 명세서, 테스트 절차 명세서 같은 테스트웨어 문서를 종류별로 정해 요구한다.","information item characteristics(IIC)는 참고용 예시일 뿐이어서 프로세스 실행을 판단하는 데 쓰지 않는다.","ASPICE 4.0은 테스트웨어 자체에 요구사항을 두지 않고, 테스트 중에 생기는 특정 정보의 문서화에 요구사항을 둔다.","ISO/IEC/IEEE 29119-3을 사용해 information item을 더 구조화할 수 있다.","information item은 개발 활동에만 요구되고, 테스트 활동에는 요구되지 않는다."],"ans":[2,3],"exp":"2.1.2.4: ASPICE 4.0은 테스트웨어에 요구사항을 두지 않는다. 대신 테스트 중에 생기는 특정 정보의 문서화에 요구사항을 둔다. 테스트 활동에는 information item 08-60과 15-52를 요구한다. ISO/IEC/IEEE 29119-3은 information item을 더 구조화하는 데 쓸 수 있다. (v2.1 기준. 2018년판(ASPICE 3.1)은 work product WP 08-50, 08-52, 13-50을 요구한다고 했고, 테스트 계획서에 대해 29119-3을 직접 참조한다고 했다.)","why":["ASPICE 4.0은 테스트웨어에 요구사항을 두지 않는다(2.1.2.4).","ASPICE는 information item마다 IIC와 내용의 예를 정의하며, 이것이 프로세스 실행의 객관적 지표가 된다(2.1.2.4).","정답. 실라버스 2.1.2.4 첫 문장들의 내용이다.","정답. 29119-3은 information item을 더 구조화하는 데 쓸 수 있다(2.1.2.4).","ASPICE는 테스트 활동에 information item 08-60과 15-52를 요구한다(2.1.2.4)."],"ref":"2.1.2.4"},{"id":"c2-025","ch":2,"lo":"AuT-2.1.2.5","k":3,"q":"당신은 software unit verification(SWE.4)을 맡은 테스터다. 프로젝트는 C 소스 코드가 MISRA-C 코딩 가이드라인(coding guideline)을 지킨다는 근거를 보여 줘야 한다. 확인할 대상은 정적 분석 도구로 위반 여부를 판정할 수 있는 MISRA-C rule이고, 소프트웨어 유닛은 200개다.\n이 목적에 맞춰 verification measures로 정의하기에 가장 알맞은 것은?","opts":["도구 지원 정적 분석으로 각 소프트웨어 유닛의 MISRA-C 준수 여부를 평가한다.","유닛마다 테스트 데이터를 넣은 단위 테스트 케이스를 실행해 MISRA-C 준수 여부를 판정한다.","통합된 소프트웨어를 software requirements analysis(SWE.1) 기준으로 평가하는 software verification(SWE.6)에서 확인한다.","변경 요청과 결함 보고서 사이에 양방향 추적성을 만든다."],"ans":[0],"exp":"풀이 과정\n① 확인할 것: 소스 코드가 코딩 가이드라인(MISRA-C)을 지키는지. 동작이 아니라 코드 자체의 규칙 준수다.\n② 2.1.2.5가 든 유닛 베리피케이션 수단 예시 세 가지: (가) 테스트 데이터를 포함한 단위 테스트 케이스, (나) 코딩 가이드라인(예: MISRA-C) 준수를 평가하는 도구 지원 정적 분석, (다) 도구 지원 정적 분석으로 평가할 수 없는 유닛(또는 그 일부)의 리뷰.\n③ 대상이 도구로 판정 가능한 MISRA-C rule이므로 (나)가 맞는다. 4.1.1도 rule은 정적 분석 도구로 검증할 수 있다고 쓴다.\n검산 1: 보기마다 ②의 예시와 대조했다. 단위 테스트 케이스는 (가)지만 코드 실행 결과를 보는 동적 테스트라서 가이드라인 준수를 평가하는 수단이 아니다. SWE.6과 추적성은 유닛 베리피케이션 수단 예시에 없다.\n검산 2: 거꾸로, 정답 보기의 문장 '코딩 가이드라인 준수를 평가하는 도구 지원 정적 분석'이 2.1.2.5 원문 예시와 같은지 다시 확인했다. 같다.","why":["정답. 코딩 가이드라인 준수 평가는 도구 지원 정적 분석의 역할이다(2.1.2.5, 4.1.1).","단위 테스트 케이스는 유닛을 실행해 보는 동적 테스트다. 실라버스는 코딩 가이드라인 준수 평가를 도구 지원 정적 분석의 역할로 든다(2.1.2.5).","SWE.6은 통합된 소프트웨어를 소프트웨어 요구사항 기준으로 평가하는 프로세스다(2.1.2.1). 유닛의 코딩 가이드라인 준수를 확인하는 SWE.4 수단이 아니다.","변경 요청과 결함 보고서의 추적성은 2.1.2.6의 내용이다. 유닛 베리피케이션 수단이 아니다."],"ref":"2.1.2.5"},{"id":"c2-026","ch":2,"lo":"AuT-2.1.2.5","k":3,"q":"유닛 A를 도구 지원 정적 분석으로 검사했더니 MISRA-C rule 위반이 0건이었다. 그런데 이 프로젝트는 MISRA-C directive인 '개발자는 구현한 동작을 충분히 문서화해야 한다'도 지켜야 한다. MISRA-C directive는 정적 분석 도구로 완전히 검증되지 않는다.\n이 directive 준수를 확인하기 위한 verification measure로 가장 알맞은 것은?","opts":["정적 분석 도구의 검사 수준을 높여 다시 실행하면 충분하다.","단위 테스트 케이스를 더 추가해 동적 테스트로 확인한다.","도구 지원 정적 분석으로 평가할 수 없는 이 부분을 리뷰로 확인한다.","rule 위반이 0건이므로 directive도 지켜진 것으로 보고 따로 확인하지 않는다."],"ans":[2],"exp":"풀이 과정\n① 확인할 것: directive 준수(구현 동작을 충분히 문서화했는지).\n② 4.1.1: directive는 정적 분석 도구로 완전히 검증되지 않는다. 그러므로 도구 결과만으로는 판단할 수 없다.\n③ 2.1.2.5의 유닛 베리피케이션 수단 예시 가운데 '도구 지원 정적 분석으로 평가할 수 없는 소프트웨어 유닛이나 그 일부에 대한 리뷰'가 이 상황에 맞는다.\n검산 1: 남은 보기를 하나씩 지웠다. 도구 재실행은 ②에 걸리고, 동적 테스트는 문서화 여부를 보는 수단이 아니고, rule 결과로 directive를 대신할 근거는 없다.\n검산 2: 정답 문장의 조건 '도구 지원 정적 분석으로 평가할 수 없는'이 문제 상황(directive는 도구로 완전히 검증되지 않음)과 맞는지 다시 확인했다. 맞다.","why":["directive는 정적 분석 도구로 완전히 검증되지 않는다(4.1.1). 검사 수준을 올려도 도구만으로는 부족하다.","동적 테스트는 유닛을 실행해 동작을 보는 것이다. 동작이 충분히 문서화됐는지는 실행 결과로 확인되지 않는다. 실라버스는 도구로 평가할 수 없는 부분에 리뷰를 든다(2.1.2.5).","정답. 도구 지원 정적 분석으로 평가할 수 없는 부분은 리뷰로 확인한다(2.1.2.5).","rule과 directive는 다른 종류의 가이드라인이다(4.1.1). rule 결과로 directive 준수를 대신할 수 없다."],"trap":"정적 분석 도구 결과가 깨끗하면 코딩 가이드라인 검증이 끝났다고 여기기 쉽다. 실라버스는 도구 지원 정적 분석으로 평가할 수 없는 부분을 리뷰로 확인하는 것을 유닛 베리피케이션 수단의 예로 들고(2.1.2.5), MISRA-C directive는 도구로 완전히 검증되지 않는다고 쓴다(4.1.1).","ref":"2.1.2.5"},{"id":"c2-027","ch":2,"lo":"AuT-2.1.2.5","k":3,"q":"개발자가 결함을 고치려고 유닛 B의 함수 f1을 수정했다. 유닛 B에는 수정하지 않은 함수 f2, f3도 있다. 테스터가 떠올린 활동은 다음과 같다.\n① 수정된 f1 코드에 정적 분석과 단위 테스트를 다시 수행한다.\n② 원래 결함을 드러낸 테스트 케이스를 다시 실행해 결함이 고쳐졌는지 확인한다.\n③ 수정하지 않은 f2, f3에도 정적 테스트와 동적 테스트를 다시 수행한다.\n유닛 베리피케이션 수단(verification measures)에 포함되는 criteria for regression verification을 충족하려면 어느 활동이 필요한가?","opts":["①, ②","①, ②, ③","② 만","①, ③"],"ans":[1],"exp":"풀이 과정\n① 2.1.2.5: 개발자가 유닛을 바꾸면 테스터도 그 변경을 평가해야 한다. 그래서 유닛의 verification measures에는 criteria for regression verification이 들어간다.\n② 그 내용은 세 가지다: (가) 변경된 코드의 베리피케이션, (나) 확인 테스팅(confirmation testing), (다) 변경되지 않은 부분의 반복 베리피케이션(정적·동적 리그레션 테스트).\n③ 대응: 활동 ①=(가), 활동 ②=(나), 활동 ③=(다). 세 활동이 모두 필요하다.\n검산 1: 보기마다 빠진 항목을 셌다. '①, ②'는 (다)가 없고, '② 만'은 (가)(다)가 없고, '①, ③'은 (나)가 없다. 빠짐없는 보기는 '①, ②, ③'뿐이다.\n검산 2: 활동 ③이 '정적 테스트와 동적 테스트'를 함께 다시 하는지 확인했다. 실라버스 괄호 '(static and dynamic regression tests)'와 맞는다. (v2.1 기준 용어. 2018년판에서는 regression strategy라고 불렀고, 세 가지 내용은 같다.)","why":["변경되지 않은 부분(f2, f3)의 반복 베리피케이션이 빠졌다(2.1.2.5).","정답. 변경 코드 베리피케이션, 확인 테스팅, 변경되지 않은 부분의 반복 베리피케이션이 모두 들어 있다(2.1.2.5).","확인 테스팅만으로는 부족하다. 변경 코드 베리피케이션과 변경되지 않은 부분의 반복 베리피케이션도 필요하다(2.1.2.5).","원래 결함이 고쳐졌는지 보는 확인 테스팅이 빠졌다(2.1.2.5)."],"trap":"결함을 고친 뒤 그 결함을 찾은 테스트만 다시 돌리고 끝내기 쉽다. 실라버스는 유닛 변경 시 변경 코드 베리피케이션, 확인 테스팅, 변경되지 않은 부분의 정적·동적 리그레션 테스트까지 포함한다고 쓴다(2.1.2.5).","ref":"2.1.2.5"},{"id":"c2-028","ch":2,"lo":"AuT-2.1.2.5","k":3,"q":"네 팀이 software unit verification(SWE.4)용 verification measures 계획을 제출했다. 유닛이 바뀔 때 적용할 criteria for regression verification은 네 팀 모두 별도 문서로 이미 정해 두었다.\n실라버스의 SWE.4 요구와 어긋나서 보완이 필요한 계획은?","opts":["테스트 데이터를 포함한 단위 테스트 케이스, MISRA-C 준수를 평가하는 도구 지원 정적 분석, 도구로 평가할 수 없는 부분의 리뷰를 정의한다.","테스트 데이터를 포함한 단위 테스트 케이스, 도구 지원 정적 분석, 리뷰를 정의하고, 유닛이 바뀌면 변경 코드 베리피케이션, 확인 테스팅, 변경되지 않은 부분의 반복 베리피케이션을 하도록 정한다.","상세 설계와 기능·비기능 요구사항을 기준으로, 정적 테스트 기법과 동적 테스트 기법을 조합해 유닛을 검증하도록 정한다.","테스트 데이터를 포함한 단위 테스트 케이스를 많이 정의해 동적 테스트만 하고, 정적 분석과 리뷰는 하지 않는다."],"ans":[3],"exp":"풀이 과정\n① 기준 1(2.1.2.1): SWE.4는 정적 테스팅과 동적 테스팅을 모두 요구한다.\n② 기준 2(2.1.2.5): 테스터는 상세 설계와 기능·비기능 요구사항을 verification measures에 따라 검증하며, 정적·동적 테스트 기법을 조합해 쓸 수 있다. 예시 수단은 단위 테스트 케이스(테스트 데이터 포함), 도구 지원 정적 분석, 리뷰다. 유닛 변경 시의 criteria for regression verification도 verification measures에 들어가지만, 문제에서 네 팀 모두 따로 정해 두었으므로 판단에서 뺀다.\n③ 각 계획에 정적 테스트와 동적 테스트가 둘 다 있는지 본다. 세 가지 예시 수단을 모두 정의한 계획, 여기에 리그레션 기준까지 적은 계획, 정적·동적 기법의 조합을 정한 계획은 둘 다 있다. 단위 테스트 케이스만 정의한 계획은 동적 테스트만 있어 기준 1을 채우지 못한다.\n검산 1: 동적 테스트만 하는 계획에서 빠진 것을 다시 셌다. 정적 분석과 리뷰가 모두 빠져 정적 테스팅이 하나도 없다.\n검산 2: 나머지 세 계획에 실라버스와 어긋나는 문장이 있는지 다시 읽었다. 모두 2.1.2.5의 문장(예시 수단, 리그레션 기준, 정적·동적 조합)과 맞는다. 정적·동적 기법의 조합만 정한 계획은 구체적인 수단 이름을 적지 않았지만 SWE.4 요구와 어긋나는 내용은 없다.","why":["2.1.2.5가 든 세 가지 예시 수단을 모두 담았다. 정적·동적 테스팅이 다 있고, 리그레션 기준은 문제에서 따로 정해 두었다.","예시 수단에 유닛 변경 시 리그레션 기준까지 담았다(2.1.2.5).","상세 설계와 기능·비기능 요구사항을 기준으로 정적·동적 기법을 조합하는 것은 2.1.2.5의 설명 그대로다. 구체적인 수단을 적지 않았을 뿐 SWE.4 요구와 어긋나지 않는다.","정답. SWE.4는 정적 테스팅과 동적 테스팅을 모두 요구하는데(2.1.2.1), 이 계획에는 정적 테스팅이 없다."],"trap":"화이트박스 테스트팀은 유닛 베리피케이션(unit verification)을 '단위 테스트 실행과 커버리지 측정'으로 좁혀 생각하기 쉽다. 실라버스는 SWE.4가 정적 테스팅과 동적 테스팅을 모두 요구한다고 쓰고(2.1.2.1), 도구 지원 정적 분석과 리뷰를 유닛 베리피케이션 수단의 예로 든다(2.1.2.5).","ref":"2.1.2.5"},{"id":"c2-029","ch":2,"lo":"AuT-2.1.2.6","k":2,"q":"고객이 브레이크 경고등 점등 조건 요구사항을 바꾸자는 변경 요청을 보냈다. 테스터는 양방향 추적성(bidirectional traceability) 링크를 따라가 이 요구사항과 연결된 테스트 명세 12개를 찾아, 다시 검토할 대상으로 정했다.\n이 활동은 실라버스가 든 추적성의 쓰임 중 어느 것에 해당하는가?","opts":["영향도 분석(예: 변경 영향도 분석)","커버리지 평가","상태 추적","capability level 판정"],"ans":[0],"exp":"2.1.2.6: 양방향 추적성으로 테스터는 영향도를 분석하고(예: 변경 영향도 분석), 커버리지를 평가하고, 상태를 추적할 수 있다. 요구사항 변경이 어떤 테스트 명세에 영향을 주는지 찾는 것은 변경 영향도 분석이다.","why":["정답. 변경된 요구사항과 연결된 테스트 명세를 찾는 것은 변경 영향도 분석이다(2.1.2.6).","커버리지 평가도 추적성의 쓰임이지만, 문제는 변경이 어디에 영향을 주는지 찾는 상황이다. 실라버스는 영향도 분석의 예로 변경 영향도 분석을 든다(2.1.2.6).","상태 추적도 추적성의 쓰임이지만, 변경이 어디에 영향을 주는지 찾는 것은 변경 영향도 분석이다(2.1.2.6).","실라버스가 든 추적성의 쓰임에 capability level 판정은 없다(2.1.2.6)."],"ref":"2.1.2.6"},{"id":"c2-030","ch":2,"lo":"AuT-2.1.2.6","k":2,"q":"software architectural design(SWE.2)의 각 요소를, 그에 대응하는 통합 테스트 명세 및 테스트 결과와 서로 연결하고 일관성을 확보했다.\nASPICE의 구분에 따르면 이것은 어떤 추적성인가?","opts":["수직 추적성(vertical traceability)","SUP.10이 요구하는 변경 요청 추적성","수평 추적성(horizontal traceability)","ASPICE가 요구하지 않는 추적성"],"ans":[2],"exp":"2.1.2.6: ASPICE는 수직 추적성과 수평 추적성을 구분한다. 수평 추적성은 개발 작업 결과와 그에 대응하는 테스트 명세·테스트 결과 사이의 추적성과 일관성이다. 아키텍처 설계(개발 작업 결과)와 통합 테스트 명세·결과의 연결은 수평 추적성이다.","why":["수직 추적성은 이해관계자 요구사항을 모든 개발 레벨에 걸쳐 연결하는 것이다(2.1.2.6). 개발 결과와 테스트 사이의 연결이 아니다.","SUP.10은 변경 요청과 영향받는 작업 산출물, 결함 보고서 사이의 추적성이다(2.1.2.6).","정답. 개발 작업 결과와 대응하는 테스트 명세·결과 사이는 수평 추적성이다(2.1.2.6).","ASPICE는 수평 추적성을 요구한다(2.1.2.6)."],"trap":"개발 산출물과 테스트를 잇는 것을 V-모델 레벨을 따라 이어진다는 이유로 '수직'으로 생각하기 쉽다. 실라버스는 이해관계자 요구사항을 개발 레벨 전체에 걸쳐 잇는 것을 수직, 개발 작업 결과와 테스트 명세·결과를 잇는 것을 수평으로 구분한다(2.1.2.6).","ref":"2.1.2.6"},{"id":"c2-031","ch":2,"lo":"AuT-2.1.2.6","k":2,"q":"시스템 테스트 중 결함이 발견돼 결함 보고서가 등록됐다. 이를 계기로 변경 요청이 만들어졌고, 소스 코드와 테스트 명세가 수정됐다.\n실라버스가 ASPICE SUP.10과 관련해 설명하는 추적성으로 옳은 것 두 개를 고르시오.","opts":["결함 보고서와 그 결함을 만든 개발자 사이의 추적성","변경 요청과, 그 변경 요청의 영향을 받는 작업 산출물(소스 코드, 테스트 명세 등) 사이의 양방향 추적성","변경 요청에서 작업 산출물 쪽으로만 이어지는 단방향 추적성","변경 요청과 심사원의 process attribute 평가 등급 사이의 추적성","변경 요청과, 그 계기가 된 결함 보고서 사이의 양방향 추적성"],"ans":[1,4],"exp":"2.1.2.6: SUP.10의 base practice는 변경 요청과 그 영향을 받는 작업 산출물 사이의 양방향 추적성을 요구한다. 변경 요청은 결함에서 시작되는 경우가 많으므로, 변경 요청과 해당 결함 보고서 사이에도 양방향 추적성을 둔다. (v2.1 기준. 2018년판에서는 이 base practice 번호가 SUP.10.BP8이었고 연결 대상을 problem report라고 불렀다. v2.1은 SUP.10.BP4, defect report다.)","why":["실라버스에 결함 보고서와 개발자 사이의 추적성 요구는 없다(2.1.2.6).","정답. SUP.10 base practice의 요구다(2.1.2.6).","실라버스는 양방향 추적성을 요구한다. 각주 11도 이 절의 추적성은 언제나 양방향을 뜻한다고 쓴다(2.1.2.6).","실라버스에 변경 요청과 심사 평가 등급 사이의 추적성은 없다(2.1.2.6).","정답. 변경 요청은 결함에서 시작되는 경우가 많으므로 결함 보고서와도 양방향으로 잇는다(2.1.2.6)."],"ref":"2.1.2.6"},{"id":"c2-032","ch":2,"lo":"AuT-2.1.2.6","k":2,"q":"실라버스는 ASPICE 추적성을 설명하면서 일관된 도구 체인(consistent chain of tools)이 도움이 될 수 있다고 한다.\n그 이유는?","opts":["ASPICE가 특정 추적성 도구의 사용을 요구하기 때문이다.","링크 수가 때로 매우 많아서, 테스터가 의존 관계를 효율적으로 만들고 관리할 수 있게 해 주기 때문이다.","도구가 연결된 요소 사이의 의미상 일관성을 자동으로 보장하므로 테스터가 확인할 필요가 없기 때문이다.","도구 체인을 쓰면 단방향 추적성만으로 충분하기 때문이다."],"ans":[1],"exp":"2.1.2.6: 링크 수가 때로 매우 많기 때문에 일관된 도구 체인이 도움이 될 수 있다. 테스터가 의존 관계를 효율적으로 만들고 관리할 수 있게 해 준다.","why":["실라버스는 특정 도구를 요구한다고 쓰지 않는다. 도구 체인은 '도움이 될 수 있다'고만 한다(2.1.2.6).","정답. 많은 링크를 효율적으로 만들고 관리하기 위해서다(2.1.2.6).","실라버스는 추적성 덕분에 테스터가 연결된 요소 사이의 텍스트·의미상 일관성을 확보할 수 있다고 쓴다(2.1.2.6). 도구가 대신 보장한다는 말은 없다.","ASPICE는 양방향 추적성을 요구한다(2.1.2.6)."],"ref":"2.1.2.6"},{"id":"c2-201","ch":2,"lo":"AuT-2.3.1","k":1,"q":"실라버스 2.3.1에 나오는 AUTOSAR(Automotive Open System Architecture)의 프로젝트 목표(project objective)는?","opts":["하드웨어 variant마다 별도의 소프트웨어 아키텍처를 정의한다","OEM(완성차 업체)이 공급업체(supplier)의 소스 코드를 검수하는 절차를 표준화한다","소프트웨어의 portability를 지원한다","ECU 테스트에 쓰는 HiL(hardware-in-the-loop) 테스트 벤치 구성을 표준화한다"],"ans":[2],"exp":"2.3.1은 AUTOSAR 프로젝트 목표 8개를 든다. 첫 항목이 '소프트웨어의 portability 지원(Support the portability of software)'이다. 나머지는 서로 다른 아키텍처·하드웨어 variant에 걸친 scalability 지원, 여러 기능 도메인 지원, non-AUTOSAR 시스템과의 데이터 교환 지원, 자동차 소프트웨어용 개방형 아키텍처 정의, dependable 시스템 개발 지원, 파트너 간 협업 지원, 적용 가능한 국제 자동차 표준과 state of the art 기술 지원이다. (목표 개수는 v2.1 기준. 2018년판은 9개였다. portability 지원은 두 판 모두에 있다.)","why":["2.3.1은 반대로 서로 다른 아키텍처와 하드웨어 variant에 걸친 scalability 지원을 목표로 든다.","공급업체 소스 코드 검수 절차의 표준화는 2.3.1 목표 목록에 없다.","정답. 2.3.1 목표 목록의 첫 항목이다.","HiL 테스트 벤치 구성의 표준화는 2.3.1 목표 목록에 없다."],"ref":"2.3.1"},{"id":"c2-202","ch":2,"lo":"AuT-2.3.1","k":1,"q":"AUTOSAR의 프로젝트 목표 중 하나는 dependable 시스템의 개발을 지원하는 것이다. 실라버스 2.3.1이 이 dependable 시스템을 특징짓는 특성으로 드는 것은? (두 개를 고르시오)","opts":["가용성(availability)","수행 효율성(performance efficiency)","시장 출시 속도(time to market)","무결성(integrity)","비용 효율성(cost efficiency)"],"ans":[0,3],"exp":"2.3.1의 목표 문장은 'availability, reliability, safety, integrity, maintainability and usability로 특징지어지는 dependable 시스템의 개발 지원'이다. 보기 중 이 목록에 있는 것은 가용성(availability)과 무결성(integrity)이다.","why":["정답. 2.3.1의 dependable 시스템 특성 목록에 있다.","수행 효율성은 2.3.1의 dependable 시스템 특성 목록에 없다.","시장 출시 속도는 2.3.1의 dependable 시스템 특성 목록에 없다.","정답. 2.3.1의 dependable 시스템 특성 목록에 있다.","비용 효율성은 2.3.1의 dependable 시스템 특성 목록에 없다."],"ref":"2.3.1"},{"id":"c2-203","ch":2,"lo":"AuT-2.3.1","k":1,"q":"다음 중 실라버스 2.3.1의 AUTOSAR 프로젝트 목표가 **아닌** 것은?","opts":["서로 다른 아키텍처와 하드웨어 variant에 걸친 scalability를 지원한다","제품의 HARA 수행 방법을 정한다","파트너 간의 협업을 지원한다","적용 가능한 국제 자동차 표준과 state of the art 기술을 지원한다"],"ans":[1],"exp":"HARA는 ISO 26262에 따라 프로젝트 초기에 전문가 팀이 제품에 대해 수행하고, 찾아낸 hazard마다 ASIL을 정하는 활동이다(2.2.4.1). AUTOSAR 프로젝트 목표(2.3.1)에는 들어 있지 않다. 나머지 세 보기는 2.3.1 목표 목록에 그대로 있다.","why":["2.3.1 목표 목록에 있는 항목이다.","정답. HARA는 ISO 26262 쪽 활동(2.2.4.1)이며 AUTOSAR 목표가 아니다.","2.3.1 목표 목록에 있는 항목이다.","2.3.1 목표 목록에 있는 항목이다."],"ref":"2.3.1"},{"id":"c2-204","ch":2,"lo":"AuT-2.3.3","k":1,"q":"SiL(software-in-the-loop) 같은 가상 환경에서 SW 컴포넌트 테스팅(software component testing)과 SW 통합 테스팅(software integration testing)을 할 때, 실라버스 2.3.3이 설명하는 AUTOSAR의 영향은?","opts":["여러 ECU를 통합해 여러 ECU에 나뉘어 구현된 기능을 시험할 수 있다","실제 ECU에서 RTE 통신에 접근해 SW-C의 런타임 동작을 관찰하고 제어할 수 있다","통신 레벨과 애플리케이션 레벨에서 AUTOSAR 기능의 준수를 보장할 수 있다","BSW와 RTE의 시뮬레이션을 써서 SW-C를 일찍 테스트할 수 있다"],"ans":[3],"exp":"2.3.3은 AUTOSAR가 테스터의 일에 영향을 주는 테스트 레벨 네 가지를 든다. 첫 항목이 가상 환경(예: SiL)에서의 SW 컴포넌트 테스팅·SW 통합 테스팅이다. 여기서는 BSW(basic software)와 RTE(runtime environment)의 시뮬레이션을 써서 SW-C(AUTOSAR software component)를 일찍 테스트할 수 있다.","why":["시스템 통합 테스팅에 대한 설명이다(2.3.3 네 번째 항목).","가상 환경이 아니라 실제 ECU에서의 SW 컴포넌트·통합 테스팅에 대한 설명이다(2.3.3 두 번째 항목).","AUTOSAR acceptance test에 대한 설명이다(2.3.3 세 번째 항목).","정답. 2.3.3 첫 번째 항목이다."],"ref":"2.3.3"},{"id":"c2-205","ch":2,"lo":"AuT-2.3.3","k":1,"q":"실라버스 2.3.3이 설명하는 AUTOSAR acceptance test로 옳은 것은?","opts":["소프트웨어 시스템에 대한 테스트로, 통신 레벨과 애플리케이션 레벨에서 AUTOSAR 기능의 준수를 보장한다","OEM(완성차 업체)이 완성 차량을 받아 사용자 요구를 만족하는지 확인하는 사용자 인수 테스팅(user acceptance testing)이다","각 SW-C를 RTE 없이 단독으로 실행해 상세 설계와 일치하는지 확인하는 테스트다","ISO 26262의 safety validation에 해당하며 ASIL에 따라 테스트 범위가 정해진다"],"ans":[0],"exp":"2.3.3 세 번째 항목: AUTOSAR acceptance test는 소프트웨어 시스템에 대한 테스트이며, 통신 레벨과 애플리케이션 레벨에서 AUTOSAR 기능의 준수를 보장한다. 같은 항목에서 이 테스트의 실행은 선택 사항(optional)이라고 덧붙인다.","why":["정답. 2.3.3 세 번째 항목의 설명 그대로다.","2.3.3은 이 테스트를 사용자 인수 테스팅이 아니라 소프트웨어 시스템의 AUTOSAR 기능 준수 테스트로 설명한다.","2.3.3은 이 테스트를 SW-C 하나만 시험하는 테스트가 아니라 소프트웨어 시스템에 대한 테스트라고 한다.","2.3.3은 AUTOSAR acceptance test를 ISO 26262 safety validation이나 ASIL과 연결하지 않는다."],"ref":"2.3.3"},{"id":"c2-206","ch":2,"lo":"AuT-2.3.3","k":1,"q":"여러 ECU에 나뉘어 구현되는 기능을 시험하려고 AUTOSAR 기반 시스템 통합 테스팅(system integration testing)을 준비하고 있다. 일부 ECU의 기능은 아직 구현되지 않았다.\n실라버스 2.3.3에 따르면 테스터는 어떻게 할 수 있는가?","opts":["아직 구현되지 않은 기능이 모두 실제 ECU에 구현될 때까지 시스템 통합 테스팅을 미룬다","아직 구현되지 않은 기능은 AUTOSAR acceptance test에서 확인하므로 시스템 통합 테스팅 범위에서 뺀다","아직 구현되지 않은 기능을 시뮬레이션해 시스템 동작을 일찍 평가한다","구현된 ECU별로 SW 컴포넌트 테스팅만 하고 시스템 동작 평가는 하지 않는다"],"ans":[2],"exp":"2.3.3 네 번째 항목: 시스템 통합 테스팅은 여러 ECU를 통합하는 단계로, 예를 들어 여러 ECU에 나뉘어 구현된 기능을 테스트한다. 아직 구현되지 않은 기능을 시뮬레이션하면 테스터가 시스템 동작을 일찍 평가할 수 있다.","why":["2.3.3은 기다리지 말고 미구현 기능을 시뮬레이션해 일찍 평가할 수 있다고 한다.","AUTOSAR acceptance test는 AUTOSAR 기능 준수를 보는 별도 테스트이며 미구현 기능을 대신 확인하는 단계가 아니다.","정답. 2.3.3 네 번째 항목의 설명 그대로다.","2.3.3은 시뮬레이션으로 시스템 동작을 일찍 평가할 수 있다고 하므로 시스템 동작 평가를 빼는 것은 맞지 않다."],"ref":"2.3.3"},{"id":"c2-207","ch":2,"lo":"AuT-2.4.1","k":1,"q":"한 공급업체가 ASIL D 요구사항이 있는 과제와 ASIL이 없는(QM) 요구사항만 있는 과제를 함께 진행한다. 두 과제 모두 ASPICE 심사(assessment)를 받는다.\n실라버스 2.4.1에 따르면 ASPICE가 정의한 심사 가능한 기준(assessable criteria)은 두 과제에 어떻게 적용되는가?","opts":["ASIL D 과제에는 더 높은 capability level(CL) 기준이 적용된다","제품의 ASIL과 무관하므로 두 과제에 같은 기준이 적용된다","QM 과제는 기능 안전과 관련이 없으므로 ASPICE 기준이 적용되지 않는다","ASIL별 method table에 따라 과제마다 다른 기준이 적용된다"],"ans":[1],"exp":"2.4.1: ASPICE는 심사라는 틀 안에서 제품 개발 프로세스의 capability를 판정하려고 그 프로세스들에 대한 심사 가능한 기준을 정의한다. 이 기준은 ISO 26262와 달리 제품의 ASIL과 무관하다. 그래서 ASIL D 과제와 QM 과제에 같은 기준이 적용된다.","why":["ASPICE 기준은 제품의 ASIL과 무관하므로 ASIL에 따라 기준이 높아지지 않는다.","정답. 2.4.1은 ASPICE 기준이 제품의 ASIL과 무관하다고 한다.","ASPICE 기준은 ASIL과 무관하므로 ASIL이 없다는 이유로 적용에서 빠지지 않는다.","ASIL별 method table은 ISO 26262의 것이며 ASPICE 기준은 ASIL과 무관하다."],"trap":"현업에서는 ASIL이 높은 과제일수록 프로세스 심사도 더 엄격하다고 느끼기 쉽다. 실라버스 2.4.1은 ASPICE 기준이 제품의 ASIL과 무관하고, ASIL에 따라 요구사항이 달라지는 쪽은 ISO 26262라고 구분한다.","ref":"2.4.1"},{"id":"c2-208","ch":2,"lo":"AuT-2.4.1","k":1,"q":"실라버스 2.4.1이 ISO 26262에 대해 설명하는 내용은? (두 개를 고르시오)","opts":["테스트 프로세스에 대한 요구사항은 ASIL과 상관없이 모든 아이템에 똑같이 적용된다","적절한 요구사항과 프로세스를 제시해 장애(failure)로 인한 리스크를 피하는 것을 목적으로 한다","하드웨어 장애(failure)는 다루지 않고 소프트웨어 장애로 인한 리스크만 피하는 것을 목적으로 한다","자동차 소프트웨어가 AUTOSAR 아키텍처를 따르도록 요구한다","E/E 시스템 개발에서 테스터가 써야 할 테스트 프로세스와 method의 요구사항을 정의하며, 이 요구사항은 아이템의 ASIL에 따라 달라진다"],"ans":[1,4],"exp":"2.4.1: ISO 26262는 적절한 요구사항과 프로세스를 제시해 하드웨어와 소프트웨어 양쪽의 장애로 인한 리스크를 피하는 것을 목적으로 한다. 또 E/E 시스템 개발에서 테스터가 쓸 테스트 프로세스와 method의 요구사항을 정의하며, 이 요구사항은 아이템의 ASIL에 따라 달라진다. (v2.1 기준. 2018년판에서는 목적을 '개발 중 체계적 장애(systematic failures)와 운영 중 하드웨어 장애로 인한 리스크 회피'라고 적었다.)","why":["2.4.1은 이 요구사항이 아이템의 ASIL에 따라 달라진다고 한다.","정답. 2.4.1이 말하는 ISO 26262의 목적이다.","2.4.1은 하드웨어와 소프트웨어 양쪽의 장애로 인한 리스크를 피하는 것이 목적이라고 한다.","2.4.1은 ISO 26262가 AUTOSAR 아키텍처를 요구한다고 하지 않는다.","정답. 2.4.1의 설명 그대로다."],"ref":"2.4.1"},{"id":"c2-209","ch":2,"lo":"AuT-2.4.1","k":1,"q":"실라버스 2.4.1에 따르면 ASPICE는 심사(assessment)라는 틀 안에서 제품 개발 프로세스의 capability를 판정하는 것을 목적으로 한다. 이를 위해 ASPICE가 정의하는 것은?","opts":["이 프로세스들에 대한 심사 가능한 기준","ASIL에 따라 권고되는 테스트 기법을 담은 method table","테스트 레벨마다 반드시 써야 하는 테스트 기법","hazard별 안전 목표(safety goal)와 안전 요구사항(safety requirement)"],"ans":[0],"exp":"2.4.1: ASPICE는 심사라는 틀 안에서 제품 개발 프로세스의 capability를 판정하려고 그 프로세스들에 대한 심사 가능한 기준(assessable criteria)을 정의한다. 이 기준은 제품의 ASIL과 무관하다.","why":["정답. 2.4.1의 설명 그대로다.","ASIL별로 테스트 기법을 권고하는 method table은 ISO 26262의 것이다(2.4.2).","2.4.2에 따르면 ASPICE는 일반적으로 테스트 기법을 테스트 레벨에 배정하지 않는다.","hazard마다 안전 목표와 안전 요구사항을 정하는 것은 ISO 26262 쪽 활동이다(2.2.4.1)."],"ref":"2.4.1"},{"id":"c2-210","ch":2,"lo":"AuT-2.4.2","k":2,"q":"실라버스 2.4.2는 ISTQB 테스트 레벨을 ISO 26262와 ASPICE의 테스트 레벨에 대응시키기 전에 'system'이라는 말의 뜻 차이를 설명한다. 그 설명으로 옳은 것은?","opts":["ASPICE와 ISO 26262는 테스트 레벨을 기술하지 않으므로 'system'의 뜻을 맞출 필요가 없다","CTFL의 'system'은 하드웨어와 소프트웨어로 된 제품을 뜻하지만, ASPICE와 ISO 26262의 'system'은 소프트웨어만 뜻한다","ISO 26262의 'item'은 소프트웨어만 뜻하고, ASPICE의 'system'은 하드웨어만 뜻한다","ASPICE와 ISO 26262의 'system'은 하드웨어와 소프트웨어 컴포넌트로 된 제품을 뜻하지만, CTFL의 'system'은 소프트웨어만 가리킨다"],"ans":[3],"exp":"2.4.2: ISO 26262와 ASPICE 모두 테스트 레벨을 기술하지만 CTFL 테스트 레벨과 완전히 일치하지는 않는다. ASPICE의 'system'과 ISO 26262의 'system'·'item'은 하드웨어와 소프트웨어 컴포넌트로 된 제품을 가리키는 반면, CTFL은 'system'이라고 할 때 소프트웨어만 가리킨다. 그래서 CTFL 시스템 테스팅(system testing)은 통합된 소프트웨어를 베리피케이션(verification)하는 ASPICE software verification(SWE.6)에 대응한다(표 2).","why":["2.4.2는 ISO 26262와 ASPICE 모두 테스트 레벨을 기술한다고 한다.","방향이 반대다. 소프트웨어만 가리키는 쪽이 CTFL이고, ASPICE와 ISO 26262의 'system'은 하드웨어와 소프트웨어 컴포넌트로 된 제품이다(2.4.2).","2.4.2는 ASPICE의 'system'과 ISO 26262의 'system'·'item'이 모두 하드웨어와 소프트웨어로 된 제품이라고 한다.","정답. 2.4.2의 설명 그대로다."],"trap":"현업에서 '시스템 테스트'라고 하면 ECU나 차량처럼 하드웨어가 포함된 대상을 떠올리기 쉽다. 실라버스는 CTFL의 'system'이 소프트웨어만 가리킨다고 보고 테스트 레벨을 대응시킨다(2.4.2).","ref":"2.4.2"},{"id":"c2-211","ch":2,"lo":"AuT-2.4.2","k":2,"q":"회사 테스트 계획서에서 ASPICE software verification(SWE.6) 단계를 맡게 됐다. 이 프로세스는 통합된 소프트웨어를 소프트웨어 요구사항과 대조해 베리피케이션(verification)한다.\n실라버스 2.4.2 표 2에서 이 프로세스에 대응하는 CTFL 테스트 레벨은?","opts":["컴포넌트 테스팅(component testing)","컴포넌트 통합 테스팅(component integration testing)","시스템 테스팅(system testing)","시스템 통합 테스팅(system integration testing)"],"ans":[2],"exp":"표 2(2.4.2)의 시스템 테스팅 행: ISO 26262는 Testing of the embedded software (6-11), ASPICE는 software verification(SWE.6)이다. CTFL의 'system'은 소프트웨어만 가리키므로, 통합된 소프트웨어 전체를 소프트웨어 요구사항 기준으로 베리피케이션하는 SWE.6이 CTFL 시스템 테스팅에 대응한다. (v2.1 기준. 2018년판에서는 SWE.6의 이름이 software qualification test였다. 대응하는 CTFL 레벨은 같다.)","why":["컴포넌트 테스팅은 software unit verification(SWE.4)에 대응한다.","컴포넌트 통합 테스팅은 software component verification and integration verification(SWE.5)에 대응한다.","정답. 표 2에서 SWE.6은 시스템 테스팅 행에 있다.","시스템 통합 테스팅은 system integration and integration verification(SYS.4)에 대응한다."],"trap":"'software verification'이라는 이름 때문에 SW를 잘게 나눠 시험하는 레벨로 생각하기 쉽다. 실라버스 표 2는 CTFL의 'system'이 소프트웨어만 가리키므로 통합된 SW 전체를 베리피케이션하는 SWE.6을 시스템 테스팅에 대응시킨다(2.4.2).","ref":"2.4.2"},{"id":"c2-212","ch":2,"lo":"AuT-2.4.2","k":2,"q":"ASPICE system verification(SYS.5)에 대응하는 CTFL 테스트 레벨과 ISO 26262 항목의 짝으로 실라버스 2.4.2 표 2와 맞는 것은?","opts":["시스템의 시스템 테스팅(system of systems testing) / System and item integration and testing (4-7)","시스템 테스팅(system testing) / Testing of the embedded software (6-11)","인수 테스팅(acceptance testing) / Safety validation (4-8)","컴포넌트 통합 테스팅(component integration testing) / Software integration and verification (6-10)"],"ans":[0],"exp":"표 2(2.4.2)에서 ASPICE system verification(SYS.5)은 CTFL의 시스템의 시스템 테스팅 행에 있다. 시스템의 시스템 테스팅은 여러 이종(heterogenic) 분산 시스템을 테스트하는 것이다(각주 17). 이 행의 ISO 26262 칸은 System and item integration and testing (4-7)이며, 이 칸은 아래 시스템 통합 테스팅 행까지 걸쳐 있다. (v2.1 기준. 2018년판에서는 SYS.5를 system qualification test, ISO 26262 항목을 Item integration and test (4-8)라고 적었다.)","why":["정답. 표 2의 시스템의 시스템 테스팅 행이다.","이 짝은 software verification(SWE.6)이 있는 시스템 테스팅 행이다.","이 짝은 validation(VAL.1)이 있는 인수 테스팅 행이다.","이 짝은 SWE.5가 있는 컴포넌트 통합 테스팅 행이다."],"trap":"SYS.5(system verification)를 '시스템 테스트'로 옮겨 생각하면 CTFL 시스템 테스팅과 같은 것으로 보기 쉽다. 실라버스 표 2에서 CTFL 시스템 테스팅은 SWE.6에 대응하고, SYS.5는 시스템의 시스템 테스팅에 대응한다(2.4.2).","ref":"2.4.2"},{"id":"c2-213","ch":2,"lo":"AuT-2.4.2","k":2,"q":"실라버스 2.4.2 표 2의 인수 테스팅(acceptance testing) 행에 대한 설명으로 옳은 것은?","opts":["ISO 26262의 Testing of the embedded software (6-11)와 ASPICE의 software verification(SWE.6)이 대응한다","ISO 26262의 safety validation(4-8)과 ASPICE의 validation(VAL.1)이 대응하지만, 둘 다 ISTQB 인수 테스팅의 일부만 다룬다","ISO 26262의 safety validation(4-8)과 ASPICE의 validation(VAL.1)이 ISTQB 인수 테스팅 전체를 다룬다","ASPICE의 system verification(SYS.5)이 대응하며, ISO 26262에는 대응하는 항목이 없다"],"ans":[1],"exp":"표 2(2.4.2)의 인수 테스팅 행: ISO 26262는 Safety validation (4-8), ASPICE는 Validation (VAL.1)이다. 각주 15와 16은 safety validation과 VAL.1이 각각 ISTQB 인수 테스팅의 일부만 다룬다고 적는다. (v2.1 기준. 2018년판 표 2에서는 ISO 26262 항목 번호가 4-9였고, ASPICE 칸은 'No equivalent'(대응 없음)였다.)","why":["이 짝은 시스템 테스팅 행이다.","정답. 표 2의 인수 테스팅 행과 각주 15·16의 내용이다.","각주 15·16은 둘 다 ISTQB 인수 테스팅의 일부만 다룬다고 한다.","SYS.5는 시스템의 시스템 테스팅에 대응하고, 인수 테스팅에는 ISO 26262 safety validation(4-8)이 대응한다."],"ref":"2.4.2"},{"id":"c2-214","ch":2,"lo":"AuT-2.4.2","k":2,"q":"아래는 실라버스 2.4.2 표 2의 마지막 두 행이다.\nCTFL의 컴포넌트 테스팅(component testing)을 'unit'이 아니라 'component'라는 의미로 볼 때, 실라버스 각주에 따르면 이 테스트를 추가로 다루는 것은?","table":{"head":["ISTQB CTFL","ISO 26262:2018","ASPICE 4.0"],"rows":[["컴포넌트 통합 테스팅","Software integration and verification (6-10)","Software component verification and integration verification (SWE.5)"],["컴포넌트 테스팅","Software unit verification (6-9)","Software unit verification (SWE.4)"]]},"opts":["ASPICE SWE.4와 ISO 26262 6-9","ASPICE SWE.6과 ISO 26262 6-11","ASPICE SYS.4와 ISO 26262 4-7","ASPICE SWE.5와 ISO 26262 6-10"],"ans":[3],"exp":"표 2 각주 20: ASPICE SWE.5와 ISO 26262 6-10은 CTFL의 컴포넌트 테스팅('component'라는 의미)도 추가로 다룬다. 각주 21: ASPICE SWE.4와 ISO 26262 6-9는 CTFL의 컴포넌트 테스팅('unit'이라는 의미)을 다룬다. 표만 보면 컴포넌트 테스팅 행에 SWE.4·6-9만 있지만, 'component' 의미일 때는 각주 20에 따라 SWE.5·6-10이 답이다. (v2.1.1 기준. 이 두 각주는 v2.1.1 errata에서 컴포넌트(통합) 테스트 레벨 대응을 고치며 추가됐고, 2018년판 표에는 없다.)","why":["SWE.4와 6-9는 'unit'이라는 의미의 컴포넌트 테스팅을 다룬다(각주 21).","SWE.6과 6-11은 시스템 테스팅 행이다.","SYS.4와 4-7은 시스템 통합 테스팅 행이다.","정답. 각주 20의 내용이다."],"trap":"현업에서는 SW 컴포넌트 단위 시험을 모두 SWE.4(software unit verification)로 묶기 쉽다. 실라버스 각주는 'unit' 의미의 컴포넌트 테스팅은 SWE.4·6-9가, 'component' 의미의 컴포넌트 테스팅은 SWE.5·6-10이 추가로 다룬다고 구분한다(2.4.2).","ref":"2.4.2"},{"id":"c2-215","ch":2,"lo":"AuT-2.KW","k":1,"q":"ISTQB 용어집에서 기능 안전(functional safety)의 정의는?","opts":["E/E 시스템이 외부의 악의적인 공격에서 보호되는 정도","E/E 시스템의 오작동으로 생길 수 있는 모든 hazard와 리스크가 완전히 제거된 상태","E/E 시스템의 오작동으로 인한 hazard 때문에 생기는 불합리한 리스크가 없는 상태","E/E 시스템이 명세된 기능 요구사항을 모두 구현하고 있는 정도"],"ans":[2],"exp":"용어집 정의: 'The absence of unreasonable risk due to hazards caused by malfunctioning behavior of electric/electronic systems.' 즉 E/E 시스템의 오작동으로 인한 hazard 때문에 생기는 불합리한 리스크가 없는 상태다. 실라버스 2.2.1.1도 기능 안전을 E/E 시스템이 오작동으로 인한 hazard 때문에 불합리한 리스크를 일으키지 않고 동작하게 하는 것이라고 설명한다.","why":["공격에서 보호하는 것은 사이버보안(cybersecurity) 쪽 개념이며, 2.2.1.1은 기능 안전을 이와 구분한다.","정의는 모든 hazard와 리스크를 없앤 상태가 아니라 '불합리한' 리스크가 없는 상태다.","정답. 용어집 정의 그대로다.","기능 요구사항의 구현 정도는 기능 안전의 정의와 관계없다."],"ref":"2장 Keywords(ISTQB 용어집), 2.2.1.1"},{"id":"c2-216","ch":2,"lo":"AuT-2.KW","k":1,"q":"ISTQB 용어집에서 method table(메소드 테이블)의 정의는?","opts":["ASIL과 테스트 대상의 정황에 따라 요구되는 여러 테스트 접근법, 테스트 기법, 테스트 유형을 담은 표","ISTQB 테스트 레벨을 ISO 26262와 ASPICE의 항목에 대응시킨 표","ASPICE 프로세스별 base practice(BP)와 generic practice(GP)를 정리한 표","hazard 분석과 리스크 평가 결과로 hazard마다 ASIL을 정하는 표"],"ans":[0],"exp":"용어집 정의: 'A table containing different test approaches, test techniques and test types that are required depending on the automotive safety integrity level and on the context of a test object.' 즉 ASIL과 테스트 대상의 정황에 따라 요구되는 여러 테스트 접근법, 테스트 기법, 테스트 유형을 담은 표다.","why":["정답. 용어집 정의 그대로다.","실라버스 2.4.2의 표 2(테스트 레벨 대응표)에 대한 설명이며 method table이 아니다.","BP와 GP는 ASPICE의 개념이며(2.1.2.2), ASIL에 따라 테스트 기법 등을 정리한 method table과 관계없다.","hazard마다 ASIL을 정하는 것은 HARA의 결과다(2.2.4.1). method table은 정해진 ASIL에 따라 테스트 기법 등을 정리한 표다."],"ref":"2장 Keywords(ISTQB 용어집)"},{"id":"c2-217","ch":2,"lo":"AuT-2.KW","k":1,"q":"실라버스 2장의 Domain Specific Keyword인 ASIL(automotive safety integrity level)을 바르게 설명한 것은?","opts":["ASPICE 심사에서 프로세스에 부여하는 capability 수준","AUTOSAR의 BSW(basic software)가 표준을 준수하는 수준","MISRA-C 가이드라인의 준수 의무 수준","ISO 26262에 정의된, 자동차 기능 안전을 위한 안전 무결성 수준"],"ans":[3],"exp":"실라버스 6장 정의: 'A safety integrity level for automotive functional safety, defined in ISO 26262.' 즉 ISO 26262에 정의된, 자동차 기능 안전을 위한 안전 무결성 수준이다. ISTQB 용어집 정의('ISO 26262에서 아이템이나 element에 필요한 요구사항과 불합리한 잔여 리스크를 피하기 위한 안전 조치를 정하는 네 가지 등급 중 하나')도 ISO 26262의 기능 안전 레벨이라는 점은 같다.","why":["ASPICE에서 프로세스에 부여하는 것은 capability level(CL)이다(2.1.1.3).","ASIL은 AUTOSAR와 관계없는 ISO 26262의 레벨이다.","MISRA-C의 준수 의무 수준은 mandatory, required, advisory다(4.1.1).","정답. 실라버스 6장 정의 그대로다."],"ref":"6장 Domain Specific Terms, 2.2.4.1"},{"id":"c2-218","ch":2,"lo":"AuT-2.KW","k":1,"q":"실라버스 6장에서 다음 정의에 해당하는 용어는?\n'Automotive SPICE에서, 통합된 소프트웨어가 소프트웨어 요구사항과 일치하는지(consistency) 베리피케이션(verification)하는 것'","opts":["software unit verification(ASPICE)","software verification(ASPICE)","software component verification and integration verification(ASPICE)","system verification(ASPICE)"],"ans":[1],"exp":"실라버스 6장의 software verification(ASPICE) 정의: 'In Automotive SPICE, a verification of the integrated software for consistency with the software requirements'. ASPICE 프로세스 ID는 SWE.6이다(2.1.2.1). (v2.1 기준. 2018년판에서는 이 프로세스를 software qualification test라고 불렀고, 용어 정의(Definitions)에도 software qualification test (ASPICE)로 실려 있었다.)","why":["software unit verification은 소프트웨어 유닛이 상세 설계와 일치하는지 베리피케이션하는 것이다.","정답. 6장 정의 그대로다.","software component verification and integration verification은 통합된 소프트웨어를 소프트웨어 아키텍처 설계에 기반해 베리피케이션하는 것이다.","system verification은 시스템이 시스템 요구사항과 일치하는지 베리피케이션하는 것이다."],"ref":"6장 Domain Specific Terms"},{"id":"c2-219","ch":2,"lo":"AuT-2.KW","k":1,"q":"실라버스 6장에서 system verification(ASPICE)의 정의는?","opts":["Automotive SPICE에서, 시스템이 시스템 요구사항과 일치하는지 베리피케이션(verification)하는 것","Automotive SPICE에서, 통합된 시스템 요소가 시스템 아키텍처와 일치하는지 베리피케이션(verification)하는 것","Automotive SPICE에서, 통합된 소프트웨어를 소프트웨어 아키텍처 설계에 기반해 베리피케이션(verification)하는 것","Automotive SPICE에서, 소프트웨어 유닛이 상세 설계와 일치하는지 베리피케이션(verification)하는 것"],"ans":[0],"exp":"실라버스 6장의 system verification(ASPICE) 정의: 'In Automotive SPICE, a verification of the system for consistency with the system requirements'. ASPICE 프로세스 ID는 SYS.5다(2.1.2.1). (v2.1 기준. 2018년판에서는 이 프로세스를 system qualification test라고 불렀고, 용어 정의(Definitions)에도 system qualification test (ASPICE)로 실려 있었다.)","why":["정답. 6장 정의 그대로다.","system integration and integration verification(SYS.4)의 정의다.","software component verification and integration verification(SWE.5)의 정의다.","software unit verification(SWE.4)의 정의다."],"ref":"6장 Domain Specific Terms"},{"id":"c2-101","ch":2,"lo":"AuT-2.2.1.1","k":2,"q":"기능 안전(functional safety), 사이버보안(cybersecurity), product safety의 관계에 대한 설명으로 실라버스와 맞는 것은?","opts":["사이버보안은 ISO 26262의 중심 주제이므로, 기능 안전 활동 안에서 사이버보안 요구사항까지 함께 다룬다.","사이버보안이 부족하면 기능 안전이 위험해질 수 있고, 기능 안전과 사이버보안은 둘 다 product safety에 기여한다.","기능 안전이 확보된 시스템이라면 사이버보안이 부족해도 기능 안전에는 영향이 없다.","기능 안전과 occupational safety는 같은 개념이므로 ISO 26262가 둘을 함께 다룬다."],"ans":[1],"exp":"2.2.1.1에 따르면 occupational safety와 사이버보안은 ISO 26262의 초점이 아니다. 그래도 사이버보안이 부족하면 기능 안전이 위험해질 수 있다. 그리고 기능 안전과 사이버보안은 둘 다 product safety에 기여한다.","why":["2.2.1.1은 사이버보안이 ISO 26262의 초점이 아니라고 한다.","정답. 사이버보안 부족은 기능 안전을 위협할 수 있고, 둘 다 product safety에 기여한다(2.2.1.1).","실라버스는 사이버보안이 부족하면 기능 안전이 위험해질 수 있다고 한다.","기능 안전은 occupational safety와 구분해야 하는 개념이고, occupational safety는 ISO 26262의 초점이 아니다."],"ref":"2.2.1.1"},{"id":"c2-102","ch":2,"lo":"AuT-2.2.1.1","k":2,"q":"실라버스 2.2.1.1이 설명하는, 기능 안전(functional safety) 측면에서 리스크를 다루는 방식으로 맞는 것은?","opts":["개발 중 오류가 생길 가능성은 시스템 복잡도와 관계없으므로, 리스크 분석은 개발 중이 아니라 양산이 시작된 뒤 현장에서 모은 고장 데이터로 한다.","생명·신체 위험 여부와 관계없이 모든 E/E 시스템은 리스크를 0으로 없애는 조치를 찾아야 하고, 그런 조치가 없으면 차량에 탑재해 시장에 출시할 수 없다.","리스크 분석은 safety engineer가 아니라 테스터가 단독으로 맡고, 시스템 테스팅 결과를 보고 리스크가 있는지 판정한다.","생명·신체에 위험이 있는 시스템은 safety engineer나 safety manager가 잠재 리스크를 분석해, 실제 리스크를 수용 가능한 수준으로 낮출 조치를 찾는다."],"ans":[3],"exp":"2.2.1.1: 임베디드 시스템의 복잡도가 커질수록 개발 중 오류(error)가 생길 리스크도 커지고, 그 결과 발견되지 않은 결함이 시스템에 남을 수 있다. 그래서 생명·신체에 위험을 줄 수 있는 시스템은 책임 있는 safety engineer나 safety manager가 잠재 리스크를 분석한다. 실제 리스크가 있으면 그 영향을 수용 가능한 리스크 수준으로 낮출 조치를 찾는다.","why":["실라버스는 복잡도가 커질수록 개발 중 오류 리스크도 커진다고 한다.","목표는 리스크를 수용 가능한 수준(acceptable risk level)으로 낮추는 것이지 0으로 없애는 것이 아니다.","실라버스는 리스크 분석의 책임자로 safety engineer나 safety manager를 든다.","정답. 2.2.1.1의 설명 그대로다."],"ref":"2.2.1.1"},{"id":"c2-103","ch":2,"lo":"AuT-2.2.1.1","k":2,"q":"실라버스가 설명하는 기능 안전(functional safety)의 뜻에 가장 가까운 것은?","opts":["E/E 시스템 오작동으로 생기는 hazard 때문에 불합리한 리스크가 생기지 않게 하는 것","E/E 시스템과 차량 데이터를 외부 해킹 공격과 무단 접근으로부터 보호하는 것","차량 생산 라인에서 작업자가 다치지 않도록 설비와 작업 환경을 관리하는 것","E/E 시스템을 포함해 차량에 남아 있는 모든 리스크를 완전히 없앤 상태로 출고하는 것"],"ans":[0],"exp":"2.2.1.1: 기능 안전은 E/E 시스템이 오작동(malfunctioning behavior)으로 생기는 hazard 때문에 불합리한 리스크(unreasonable risk)를 일으키지 않고 동작하도록 하는 것이다. 용어집 정의도 같은 뜻이다(E/E 시스템의 오작동이 일으킨 hazard로 인한 불합리한 리스크가 없는 상태). 정보 보안(또는 사이버보안), product safety, occupational safety와는 구분한다.","why":["정답. 2.2.1.1과 용어집 정의의 뜻이다.","정보 보안(또는 사이버보안)에 가까운 설명이다. 실라버스는 기능 안전을 이와 구분한다.","occupational safety에 가까운 설명이다. 기능 안전과 구분하며 ISO 26262의 초점도 아니다.","기능 안전이 없애려는 것은 '불합리한' 리스크다. 모든 리스크를 없애는 것이 아니다."],"ref":"2.2.1.1"},{"id":"c2-104","ch":2,"lo":"AuT-2.2.1.1","k":2,"q":"기능 안전 표준인 IEC 61508과 ISO 26262의 관계로 맞는 것은?","opts":["ISO 26262가 기반 표준이고, IEC 61508은 ISO 26262를 바탕으로 만든 표준이다.","IEC 61508은 사이버보안 표준이고, ISO 26262는 그 보안 요구사항을 차량에 옮긴 표준이다.","기능 안전의 기반 표준은 IEC 61508이고, ISO가 이 표준을 바탕으로 ISO 26262를 만들었다.","두 표준은 서로 관계가 없고, ISO 26262는 ASPICE를 바탕으로 만든 표준이다."],"ans":[2],"exp":"2.2.1.1: 리스크 분석 방법은 기능 안전 표준에 정리되어 있다. 기반 표준(foundation standard)은 IEC 61508이고, ISO(International Organization for Standardization)가 이 표준을 바탕으로 ISO 26262를 만들었다(adapted).","why":["방향이 반대다. IEC 61508이 기반 표준이다.","IEC 61508은 기능 안전의 기반 표준이다. 사이버보안은 ISO 26262의 초점도 아니다.","정답. 2.2.1.1의 설명 그대로다.","실라버스는 ISO 26262가 IEC 61508을 바탕으로 만들어졌다고 한다. ASPICE는 심사 모델(assessment model)을 정의한다(2.1.1)."],"ref":"2.2.1.1"},{"id":"c2-105","ch":2,"lo":"AuT-2.2.1.2","k":1,"q":"ISO 26262에 따른 제품 개발에서 안전 문화(safety culture)에 대한 설명으로 맞는 것은?","opts":["자기 조직의 프로세스만 모니터링해서는 충분하지 않고, 모든 참여자가 프로세스를 넘나드는(cross-process) 접근을 따라야 한다.","각 조직이 자기 프로세스를 잘 지키면 충분하므로, 다른 조직의 프로세스는 신경 쓰지 않아도 된다.","안전 문화는 OEM(완성차 업체) 내부 구성원에게만 해당하고, 외부 파트너와 공급업체(supplier)는 계약 요구사항만 지키면 된다.","안전 문화는 safety manager의 책임이므로, 개발자와 테스터는 자기 작업 산출물의 품질만 챙기면 된다."],"ans":[0],"exp":"2.2.1.2: ISO 26262에 따른 제품 개발에서는 자기 조직의 프로세스만 모니터링하는 것으로 충분하지 않다. 모든 참여자가 cross-process 접근을 따라야 한다. 누구나 자기 일이 개발 프로세스와 최종 제품의 안전에 어떤 영향을 주는지 이해해야 하며, 여기에는 외부 파트너와 공급업체도 포함된다. (v2.1 기준 표현. 2018년판은 'process-independent approach'라고 적었다. 자기 조직 프로세스만 모니터링하는 것으로는 충분하지 않고 외부 파트너·공급업체도 포함된다는 내용은 같다.)","why":["정답. 2.2.1.2 첫 문장의 내용이다.","실라버스는 자기 조직 프로세스만 보는 것으로는 충분하지 않다고 한다.","실라버스는 외부 파트너와 공급업체도 포함된다고 명시한다.","모든 참여자가 자기 일이 최종 제품의 안전에 주는 영향을 이해해야 한다."],"ref":"2.2.1.2"},{"id":"c2-106","ch":2,"lo":"AuT-2.2.1.2","k":1,"q":"안전 문화(safety culture) 관점에서 개발 참여자의 책임에 대한 설명으로 맞는 것은?","opts":["각자의 행동은 다른 프로세스와 독립적으로 일어나므로, 각 참여자는 자기 단계의 결과만 책임지면 된다.","안전 관련 요구사항의 구현은 개발자의 몫이고, 테스트 단계는 이 요구사항의 준수에 기여하지 않는다.","개발의 각 단계는 안전 관련 요구사항을 지키고 구현하는 데 꼭 필요한 기여를 하며, 이 책임은 시장 출시로 끝나지 않는다.","참여자의 책임은 2단계가 끝나는 release for production 시점에 끝나고, 그 뒤는 생산 조직이 맡는다."],"ans":[2],"exp":"2.2.1.2: 참여자는 자기 행동이 다른 프로세스와 독립적으로 일어나지 않는다는 점을 이해해야 한다. 개발의 각 단계는 안전 관련 요구사항의 준수와 구현에 꼭 필요한 기여를 한다. 이 책임은 시장 출시로 끝나지 않고 safety lifecycle(안전 수명주기)이 끝날 때까지 이어진다. (v2.1 기준. 2018년판에서는 책임이 system lifecycle 끝까지 이어진다고 적었다. 출시로 끝나지 않는다는 내용은 같다.)","why":["실라버스는 자기 행동이 다른 프로세스와 독립적으로 일어나지 않는다고 한다.","개발의 각 단계가 안전 관련 요구사항의 준수와 구현에 기여한다.","정답. 2.2.1.2의 설명 그대로다.","책임은 출시 뒤에도 safety lifecycle 끝까지 이어진다. release for production은 2단계(product development)의 끝일 뿐이다(2.2.2)."],"
