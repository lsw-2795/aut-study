ASIL C: x, y / ASIL D: x, y","ASIL A: 없음 / ASIL B: 없음 / ASIL C: x / ASIL D: x, y","ASIL A: 없음 / ASIL B: x / ASIL C: x / ASIL D: x","ASIL A: 없음 / ASIL B: 없음 / ASIL C: x / ASIL D: x"],"ans":[3],"exp":"풀이(2.2.4.2, 2.2.5)\n① 규칙: 대안이 없는 행에서는 선택권이 없고, 그 ASIL에서 highly recommended(++)인 방법을 모두 적용해야(must) 한다. recommended(+)는 적용하는 것이 원칙(should)이되 근거를 제시하면 적용하지 않을 수 있으므로 '선택의 여지 없이 반드시'에 들지 않는다. o는 권고가 없다.\n② 행 1(x): A o, B +, C ++, D ++ → 반드시 적용은 ASIL C, D.\n③ 행 2(y): A o, B o, C +, D + → 어느 ASIL에도 ++가 없으므로 반드시 적용은 없다.\n④ 합치면 ASIL A 없음, ASIL B 없음, ASIL C x, ASIL D x.\n검산 1: 원문 표 1의 행 1, 2를 다시 대조했다. x: o, +, ++, ++ / y: o, o, +, +로 같다.\n검산 2: 보기마다 대입했다. ASIL B에 x를 넣은 보기와 ASIL C·D에 y를 넣은 보기는 모두 + 칸을 must로 본 것이다. 남는 것은 정답 하나다.\n함정 포인트: +를 '사실상 필수'로 운영하는 조직에 익숙하면 + 칸까지 넣은 보기가 끌린다.\n(v2.1 기준. 2018년판은 highly recommended를 '보통 적용(normally to be applied)', recommended를 '증거에 유용하면 적용'으로 설명했다. 대안 없는 행에서 그 ASIL의 ++를 모두 적용한다는 규칙은 두 판이 같다.)","why":["+를 must로 본 것이다. ASIL B의 x와 ASIL C·D의 y는 +라서 적용이 원칙이지만, 근거를 제시하면 적용하지 않을 수 있다.","ASIL D에서 y는 ++가 아니라 +다. ASIL이 높다고 권고 수준이 저절로 올라가지 않으며, 표에 적힌 값을 읽어야 한다.","ASIL B에서 x는 +다. 적용이 원칙이지만 근거를 제시하면 적용하지 않을 수 있으므로 '선택의 여지 없이 반드시'에는 들지 않는다.","정답. 행 1, 2에서 ++인 칸만 모은 결과다."],"trap":"recommended도 사실상 필수라고 생각하면 + 칸도 '반드시'에 넣기 쉽다. 실라버스 2.2.4.2·2.2.5는 반드시 적용(must)을 highly recommended에 쓰고, recommended는 적용하지 않을 때 근거를 제시하게 한다.","ref":"2.2.5","hard":true},{"id":"h2-112","ch":2,"lo":"AuT-2.3.1","k":1,"q":"AUTOSAR 도입 교육에서 강사가 아래 네 가지를 'AUTOSAR와 관련된 내용'으로 소개했다. 이 중 실라버스 2.3.1이 AUTOSAR의 프로젝트 목표(project objective)로 나열한 것은?","opts":["서로 다른 아키텍처와 하드웨어 variant에 걸친 scalability를 지원한다","실제 ECU에서 RTE 통신에 접근해 SW-C의 런타임 동작을 관찰·제어하게 한다","AUTOSAR acceptance test로 통신·애플리케이션 레벨의 AUTOSAR 기능 준수를 확인한다","ECU extract로 ECU 하나에 해당하는 system configuration 데이터를 제공한다"],"ans":[0],"exp":"2.3.1: AUTOSAR의 프로젝트 목표는 SW portability 지원, 서로 다른 아키텍처와 하드웨어 variant에 걸친 scalability 지원, 서로 다른 기능 도메인 지원, non-AUTOSAR 시스템과의 데이터 교환 지원, 차량용 SW를 위한 open architecture 정의, dependable 시스템 개발 지원, 파트너 간 협업 지원, 적용 가능한 국제 자동차 표준과 state of the art 기술 지원이다. 나머지 보기는 실라버스에 있는 맞는 설명이지만 프로젝트 목표가 아니다. RTE 통신 접근과 AUTOSAR acceptance test는 2.3.3(테스터 업무에 주는 영향), ECU extract는 2.3.2(AUTOSAR 방법론)의 내용이다.\n함정 포인트: AUTOSAR 하면 RTE나 arxml 설정 파일 같은 실무 경험이 먼저 떠올라 이런 내용을 목표로 착각하기 쉽다.\n(v2.1 기준. 2018년판은 목표가 9개였고 scalability를 'different vehicle and platform variants'에 대한 것으로 적었다. scalability 지원이 목표라는 점은 같다.)","why":["정답. 2.3.1 목록의 두 번째 항목이다.","2.3.3에서 실제 ECU 테스트에 주는 영향으로 설명한 내용이다. 프로젝트 목표 목록에는 없다.","2.3.3의 AUTOSAR acceptance test 설명이다. 프로젝트 목표 목록에는 없다.","2.3.2(AUTOSAR 방법론, informative)의 ECU extract 설명이다. 프로젝트 목표 목록에는 없다."],"trap":"AUTOSAR를 RTE나 arxml 파일로 먼저 접했다면 이런 내용을 AUTOSAR의 목표로 착각하기 쉽다. 실라버스 2.3.1의 목표 목록에는 들어 있지 않다.","ref":"2.3.1","hard":true},{"id":"h2-113","ch":2,"lo":"AuT-2.3.3","k":1,"q":"실라버스 2.3.3은 AUTOSAR가 테스터의 업무에 영향을 주는 테스트 레벨 네 가지를 든다. 테스트 레벨(1~4)과 그 영향(A~D)을 바르게 연결한 것은?\n1. 가상 환경(예: SiL)에서의 SW 컴포넌트 테스팅(software component testing)과 SW 통합 테스팅(software integration testing)\n2. 실제 ECU에서의 SW 컴포넌트 테스팅과 SW 통합 테스팅\n3. AUTOSAR acceptance test\n4. 시스템 통합 테스팅(system integration testing)\nA. 아직 구현되지 않은 기능을 시뮬레이션해 여러 ECU에 걸친 시스템 동작을 일찍 평가할 수 있다.\nB. 통신 레벨과 애플리케이션 레벨에서 AUTOSAR 기능의 준수를 보장하며, 수행은 선택 사항이다.\nC. BSW와 RTE의 시뮬레이션을 써서 SW-C를 일찍 테스트할 수 있다.\nD. RTE의 통신에 접근해 런타임에 SW-C의 동작을 관찰하고 제어할 수 있다.","opts":["1-D, 2-C, 3-B, 4-A","1-C, 2-D, 3-B, 4-A","1-C, 2-D, 3-A, 4-B","1-A, 2-D, 3-B, 4-C"],"ans":[1],"exp":"2.3.3: ① 가상 환경(예: SiL)에서는 BSW와 RTE의 시뮬레이션을 써서 SW-C를 일찍 테스트한다(1-C). ② 실제 ECU에서는 RTE의 통신에 접근해 런타임에 SW-C의 동작을 관찰하고 제어한다(2-D). ③ AUTOSAR acceptance test는 SW 시스템에 대한 테스트로, 통신·애플리케이션 레벨에서 AUTOSAR 기능의 준수를 보장하며 수행은 선택 사항이다(3-B). ④ 시스템 통합 테스팅은 여러 ECU를 통합해 여러 ECU에 나뉘어 구현된 기능 등을 시험하며, 아직 구현되지 않은 기능을 시뮬레이션해 시스템 동작을 일찍 평가할 수 있다(4-A).\n함정 포인트: C와 A 모두 '시뮬레이션'이 들어 있어 헷갈리기 쉽다. C는 BSW와 RTE를 시뮬레이션해 SW-C를 시험하는 것이고, A는 아직 없는 기능을 시뮬레이션해 시스템 동작을 보는 것이다.\n(v2.1 기준 표현. 2018년판은 실제 ECU 항목을 'Software test and software integration tests in the real control unit'으로, 동작을 'measure and stimulate'로 적었다. 레벨별 영향의 짝은 같다.)","why":["가상 환경과 실제 ECU의 짝이 뒤바뀌었다. RTE 통신에 접근해 런타임 동작을 보는 것은 실제 ECU에서다.","정답. 2.3.3의 네 항목과 같다.","AUTOSAR acceptance test와 시스템 통합 테스팅의 짝이 뒤바뀌었다.","가상 환경은 BSW·RTE 시뮬레이션으로 SW-C를 일찍 테스트하는 것이고, 미구현 기능 시뮬레이션은 시스템 통합 테스팅의 내용이다."],"trap":"현업에서는 시뮬레이션이라고 하면 SiL을 먼저 떠올려 '미구현 기능 시뮬레이션'을 가상 환경 항목에 붙이기 쉽다. 실라버스 2.3.3은 그 내용을 시스템 통합 테스팅 항목에 둔다.","ref":"2.3.3","hard":true},{"id":"h2-114","ch":2,"lo":"AuT-2.4.1","k":1,"q":"ASIL D 제동 ECU 과제의 공급업체(supplier)가 OEM(완성차 업체)에 이렇게 주장했다.\n'우리 테스트 프로세스는 ASPICE 심사(assessment)에서 capability level 2를 받았으니, ISO 26262가 요구하는 테스트 프로세스와 method 요구사항도 충족한 것으로 봐야 한다.'\n실라버스 2.4.1에 비추어 이 주장의 문제를 가장 정확히 짚은 것은?","opts":["ASPICE 기준은 제품의 ASIL이 높을수록 엄격해지므로, ASIL D 과제라면 capability level 3 이상을 받아야 같은 주장을 할 수 있다.","ASPICE와 ISO 26262는 목적이 같고 다루는 대상만 조금 다르므로, ASPICE 심사 결과가 있다면 공급업체의 주장 자체는 타당하다.","ISO 26262는 하드웨어 장애만 다루므로, 소프트웨어 테스트 쪽 요구사항은 원래부터 ASPICE 심사 결과로 판단하게 되어 있다.","ASPICE의 심사 가능한 기준은 제품의 ASIL과 무관하므로, 그 심사 결과만으로 ASIL에 따라 달라지는 ISO 26262 요구사항을 충족했다고 볼 수 없다."],"ans":[3],"exp":"2.4.1: ISO 26262는 적절한 요구사항과 프로세스를 제시해 장애(failure)로 인한 리스크를 피하는 것을 목적으로 하며, E/E 시스템 개발에서 테스터가 쓸 테스트 프로세스와 method의 요구사항을 정의한다. 이 요구사항은 아이템의 ASIL에 따라 달라진다. ASPICE는 심사라는 틀 안에서 제품 개발 프로세스의 capability를 판정하는 것이 목적이고, 이를 위해 심사 가능한 기준을 정의한다. 이 기준은 ISO 26262와 달리 제품의 ASIL과 무관하다. 그래서 ASPICE capability level만으로 ASIL에 따라 달라지는 ISO 26262 테스트 요구사항을 충족했다고 할 수 없다.\n함정 포인트: 과제 중요도에 따라 요구 capability level을 다르게 거는 계약을 겪어 봤다면 'ASIL D면 CL3' 보기가 그럴듯하지만, 실라버스는 ASPICE 기준이 ASIL과 무관하다고 한다.\n(v2.1 기준 표현. 2018년판은 ISO 26262의 목적을 '개발 중 체계적 장애(systematic failures)와 운영 중 하드웨어 장애로 인한 리스크 회피'로 적었다. 어느 판으로도 하드웨어 장애만 다룬다는 보기는 틀리고, ASPICE 기준이 ASIL과 무관하다는 내용은 두 판이 같다.)","why":["ASPICE의 심사 가능한 기준은 제품의 ASIL과 무관하다.","ISO 26262는 장애로 인한 리스크 회피, ASPICE는 프로세스 capability 판정이 목적이라 목적이 다르다.","ISO 26262는 하드웨어와 소프트웨어 양쪽 장애로 인한 리스크를 다루고, 테스터가 쓸 테스트 프로세스와 method의 요구사항을 정의한다.","정답. 두 표준의 목적과 ASIL 의존 여부 차이를 정확히 짚었다."],"trap":"고ASIL 과제일수록 더 높은 ASPICE capability level이 필요하다고 생각하면, ASPICE 기준 자체가 ASIL에 따라 달라진다고 착각하기 쉽다. 실라버스 2.4.1은 ASPICE 기준이 제품의 ASIL과 무관하다고 한다.","ref":"2.4.1","hard":true},{"id":"h2-115","ch":2,"lo":"AuT-2.4.2","k":2,"q":"실라버스 2.4.2 표 2에서 ISTQB CTFL 테스트 레벨(1~4)과 ISO 26262:2018 항목(A~D)을 바르게 연결한 것은?\n1. 시스템 테스팅(system testing)\n2. 컴포넌트 통합 테스팅(component integration testing)\n3. 시스템 통합 테스팅(system integration testing)\n4. 인수 테스팅(acceptance testing)\nA. Safety validation (4-8)\nB. Testing of the embedded software (6-11)\nC. System and item integration and testing (4-7)\nD. Software integration and verification (6-10)","opts":["1-D, 2-B, 3-C, 4-A","1-B, 2-D, 3-A, 4-C","1-B, 2-D, 3-C, 4-A","1-C, 2-D, 3-B, 4-A"],"ans":[2],"exp":"2.4.2 표 2: ① 시스템 테스팅 ↔ Testing of the embedded software (6-11). CTFL은 'system'이라고 할 때 소프트웨어만 가리키므로 이렇게 대응한다. 각주 19는 6-11을 타깃 하드웨어에서 수행하는 기능 안전 SW(시스템) 요구사항 테스트라고 설명한다. ② 컴포넌트 통합 테스팅 ↔ Software integration and verification (6-10). ③ 시스템 통합 테스팅 ↔ System and item integration and testing (4-7). 이 칸은 시스템의 시스템 테스팅(system of systems testing) 행과 병합돼 있다. ④ 인수 테스팅 ↔ Safety validation (4-8). safety validation은 ISTQB 인수 테스팅의 일부만 다룬다.\n함정 포인트: '시스템'이라는 말 때문에 시스템 테스팅을 4-7과 잇기 쉽지만, CTFL 시스템 테스팅은 소프트웨어 쪽 항목인 6-11에 대응한다.\n(v2.1.1 기준 표. 2018년판 표는 Safety validation (4-9), Item integration and test (4-8), Verification of the Software-safety requirements (6-11), Software integration and test (6-10)처럼 부·절 번호와 이름이 달랐다.)","why":["6-11은 시스템 테스팅, 6-10은 컴포넌트 통합 테스팅에 대응한다. 짝이 뒤바뀌었다.","인수 테스팅이 Safety validation (4-8), 시스템 통합 테스팅이 System and item integration and testing (4-7)이다.","정답. 표 2와 같다.","CTFL의 'system'은 소프트웨어만 가리키므로 시스템 테스팅은 6-11에 대응한다. 4-7은 시스템 통합 테스팅(과 시스템의 시스템 테스팅) 행이다."],"trap":"'시스템 테스트'를 ECU나 차량 단위의 HW+SW 시험으로 떠올리면 4-7과 잇기 쉽다. 실라버스 2.4.2는 CTFL의 'system'이 소프트웨어만 가리킨다고 하고, 표 2에서 시스템 테스팅을 6-11에 대응시킨다.","ref":"2.4.2","hard":true},{"id":"h2-116","ch":2,"lo":"AuT-2.4.2","k":2,"q":"공급업체(supplier)와 OEM(완성차 업체)이 둘 다 '시스템 테스트'라는 말을 쓰고 있다.\n- 공급업체 SW 팀의 시스템 테스트: 통합된 소프트웨어를 소프트웨어 요구사항과 대조해 타깃 하드웨어에서 베리피케이션(verification)한다.\n- OEM의 시스템 테스트: 여러 ECU로 된 차량 시스템을 시스템 요구사항과 대조해 베리피케이션한다.\n실라버스 2.4.2(표 2 포함)와 6장 정의에 비추어 맞는 것을 두 개 고르시오.","opts":["공급업체 쪽 테스트는 표 2에서 CTFL 시스템 테스팅, ISO 26262 6-11, ASPICE SWE.6이 있는 행에 대응한다.","CTFL의 'system'도 하드웨어와 소프트웨어로 된 제품을 뜻하므로, OEM의 시스템 테스트가 CTFL 시스템 테스팅에 해당한다.","OEM 쪽 테스트는 시스템이 시스템 요구사항과 일치하는지 베리피케이션하는 ASPICE system verification(SYS.5)의 정의에 해당한다.","두 팀 모두 '시스템 테스트'라는 같은 이름을 쓰므로, 표 2에서도 같은 CTFL 테스트 레벨 행에 대응한다.","공급업체 SW 팀의 시스템 테스트는 표 2에서 ISO 26262 System and item integration and testing (4-7) 행에 대응한다."],"ans":[0,2],"exp":"2.4.2: ASPICE의 'system'과 ISO 26262의 'system'·'item'은 하드웨어와 소프트웨어 컴포넌트로 된 제품을 뜻하지만, CTFL은 'system'이라고 할 때 소프트웨어만 가리킨다. ① 공급업체 SW 팀의 테스트는 통합된 소프트웨어를 SW 요구사항과 대조하므로 6장의 software verification(ASPICE) 정의와 같고, 표 2에서 CTFL 시스템 테스팅 ↔ 6-11 ↔ SWE.6 행에 해당한다. ② OEM의 테스트는 시스템을 시스템 요구사항과 대조하므로 6장의 system verification(ASPICE) 정의와 같다. 표 2에서 SYS.5는 CTFL 시스템의 시스템 테스팅(system of systems testing) 행에 있다.\n함정 포인트: 같은 '시스템 테스트'라는 이름 때문에 같은 레벨로 보기 쉽지만, CTFL과 ASPICE·ISO 26262에서 'system'이 가리키는 범위가 다르다.\n(v2.1 기준 이름. 2018년판은 SWE.6을 software qualification test, SYS.5를 system qualification test, 6-11을 Verification of the Software-safety requirements라고 불렀다. 대응 관계는 같다.)","why":["정답. SW 요구사항 대비 통합 SW 베리피케이션은 표 2의 시스템 테스팅 행이다.","CTFL은 'system'이라고 할 때 소프트웨어만 가리킨다.","정답. 6장 system verification(ASPICE) 정의와 같다.","이름이 같아도 가리키는 범위가 다르다. 공급업체 쪽은 SWE.6 행, OEM 쪽은 SYS.5에 해당한다.","4-7은 시스템 통합 테스팅과 시스템의 시스템 테스팅 행이다. 통합 SW를 SW 요구사항과 대조하는 테스트는 6-11에 대응한다."],"trap":"공급업체와 OEM이 같은 '시스템 테스트'라는 말을 쓰면 같은 레벨로 생각하기 쉽다. 실라버스 2.4.2는 'system'의 뜻이 CTFL과 ASPICE·ISO 26262에서 다르다고 설명한다.","ref":"2.4.2, 6장 Domain Specific Terms","hard":true},{"id":"h2-117","ch":2,"lo":"AuT-2.4.2","k":2,"q":"실라버스 2.4.2 표 2의 각주(footnote)에 대한 진술이다.\ni. 시스템의 시스템 테스팅(system of systems testing)은 같은 종류의 ECU 여러 개를 하나로 묶어 시험하는 것이다.\nii. System and item integration and testing (4-7)에 붙은 각주는 item integration and test가 세 단계, 곧 element의 HW·SW 통합과 테스트, 아이템에 속한 모든 element의 통합과 테스트, 차량 안 다른 아이템과 연결한 아이템의 통합과 테스트를 포함한다고 한다.\niii. Testing of the embedded software (6-11)는 타깃 하드웨어에서 수행하는 기능 안전 소프트웨어(시스템) 요구사항 테스트다.\niv. ASPICE SWE.4와 ISO 26262 6-9는 CTFL 컴포넌트 테스팅을 'component' 의미로, SWE.5와 6-10은 'unit' 의미로 다룬다.\nv. ISO 26262 safety validation (4-8)과 ASPICE validation(VAL.1)은 각각 ISTQB 인수 테스팅의 일부만 다룬다.\n맞는 진술만 모두 고른 것은?","opts":["ii, iii, v","i, ii, iii","ii, iv, v","i, ii, iii, v"],"ans":[0],"exp":"2.4.2 표 2 각주: ① 각주 17: 시스템의 시스템 테스팅은 여러 이종(heterogenic) 분산 시스템의 테스팅이다. 같은 종류를 하나로 묶는 것이 아니다(i 틀림). ② 각주 18: item integration and test는 세 단계(element의 HW·SW 통합과 테스트, 아이템에 속한 모든 element의 통합과 테스트, 차량 안 다른 아이템과 연결한 아이템의 통합과 테스트)를 포함한다(ii 맞음). ③ 각주 19: 6-11은 타깃 하드웨어에서 수행하는 기능 안전 SW(시스템) 요구사항 테스트다(iii 맞음). ④ 각주 20·21: SWE.4와 6-9는 CTFL 컴포넌트 테스팅의 'unit' 의미를 다루고, SWE.5와 6-10은 'component' 의미를 추가로 다룬다. iv는 둘을 뒤바꿨다(iv 틀림). ⑤ 각주 15·16: safety validation과 VAL.1은 각각 ISTQB 인수 테스팅의 일부만 다룬다(v 맞음).\n함정 포인트: SWE.4 단계를 '컴포넌트 테스트'라고 부르는 습관이 있으면 iv가 맞아 보이지만, 실라버스 각주는 SWE.4·6-9를 'unit' 의미로 둔다.\n(v2.1.1 기준. 각주 번호도 v2.1.1 기준이다. 6-11 설명(각주 19), unit·component 구분(각주 20·21), VAL.1 대응(각주 16)은 2018년판 표에 없었고, 2018년판은 인수 테스트의 ASPICE 칸을 'No equivalent'로 적었다. safety validation이 인수 테스트의 일부만 다룬다는 각주, 시스템의 시스템 테스팅 각주, item integration and test 세 단계 각주는 2018년판에도 같은 내용으로 있었다.)","why":["정답.","i이 틀렸다. 시스템의 시스템 테스팅은 여러 이종(heterogenic) 분산 시스템의 테스팅이다. 맞는 진술 v가 빠졌다.","iv가 틀렸다. SWE.4·6-9가 'unit' 의미, SWE.5·6-10이 'component' 의미를 다룬다. 맞는 진술 iii도 빠졌다.","i이 틀렸다. 시스템의 시스템 테스팅은 같은 종류를 묶는 것이 아니라 여러 이종 분산 시스템의 테스팅이다."],"trap":"SWE.4 단계를 '컴포넌트 테스트'나 '모듈 테스트'로 부르는 데 익숙하면 iv의 짝을 맞다고 보기 쉽다. 실라버스 각주 21은 SWE.4와 6-9가 CTFL 컴포넌트 테스팅을 'unit' 의미로 다룬다고 한다.","ref":"2.4.2","hard":true},{"id":"h2-118","ch":2,"lo":"AuT-2.KW","k":1,"q":"실라버스 6장의 ASPICE 용어(1~4)와 정의(A~D)를 바르게 연결한 것은? (1과 2는 2장의 Domain Specific Keyword다.)\n1. software verification(ASPICE)\n2. system verification(ASPICE)\n3. system integration and integration verification(ASPICE)\n4. software component verification and integration verification(ASPICE)\nA. Automotive SPICE에서, 통합된 시스템 요소가 시스템 아키텍처와 일치하는지 베리피케이션(verification)하는 것\nB. Automotive SPICE에서, 통합된 소프트웨어를 소프트웨어 아키텍처 설계에 기반해 베리피케이션하는 것\nC. Automotive SPICE에서, 시스템이 시스템 요구사항과 일치하는지 베리피케이션하는 것\nD. Automotive SPICE에서, 통합된 소프트웨어가 소프트웨어 요구사항과 일치하는지 베리피케이션하는 것","opts":["1-B, 2-C, 3-A, 4-D","1-D, 2-C, 3-A, 4-B","1-D, 2-A, 3-C, 4-B","1-B, 2-A, 3-C, 4-D"],"ans":[1],"exp":"6장 Domain Specific Terms: software verification(ASPICE)은 통합된 SW가 SW 요구사항과 일치하는지(D), system verification(ASPICE)은 시스템이 시스템 요구사항과 일치하는지(C), system integration and integration verification(ASPICE)은 통합된 시스템 요소가 시스템 아키텍처와 일치하는지(A), software component verification and integration verification(ASPICE)은 SW 아키텍처 설계에 기반해 통합된 SW를 베리피케이션하는 것(B)이다. 요구사항과 대조하면 verification(SWE.6·SYS.5), 아키텍처와 대조하면 통합 쪽(SWE.5·SYS.4)으로 정리하면 구분하기 쉽다.\n함정 포인트: 'SW 통합 테스트'와 'software verification'을 한 단계로 묶어 부르는 데 익숙하면 1과 4의 정의를 뒤바꾸기 쉽다.\n(v2.1 기준. 2018년판 용어 정의(Definitions)에는 software qualification test(ASPICE), system qualification test(ASPICE), System integration test(ASPICE)라는 옛 이름과 다른 문장으로 실려 있었고, SWE.5에 해당하는 정의는 없었다.)","why":["software verification은 SW 요구사항과 대조한다. SW 아키텍처 설계에 기반한 통합 SW 베리피케이션은 software component verification and integration verification이다.","정답. 6장 정의와 같다.","system verification은 시스템 요구사항과 대조한다. 시스템 아키텍처와 대조하는 것은 system integration and integration verification이다.","소프트웨어 쪽과 시스템 쪽 짝이 모두 뒤바뀌었다."],"trap":"SW 통합 테스트와 software verification을 한 단계로 묶어 생각하면 두 정의를 섞기 쉽다. 실라버스 6장은 SW 요구사항과 대조하는 software verification과 SW 아키텍처 설계에 기반한 software component verification and integration verification을 나눈다.","ref":"6장 Domain Specific Terms","hard":true},{"id":"h2-119","ch":2,"lo":"AuT-2.KW","k":1,"q":"ISTQB 용어집의 기능 안전(functional safety) 정의에 비추어, 기능 안전이 다루는 상황에 해당하는 것은?","opts":["생산 공장의 작업자가 무거운 부품을 손으로 옮기다가 허리를 크게 다치는 상황","브레이크 패드가 기계적으로 닳아서 차량의 제동 거리가 점점 길어지고 있는 상황","텔레매틱스 서버가 해킹을 당해 고객 수천 명의 개인정보가 회사 밖으로 빠져나가는 상황","제동 ECU의 SW 결함으로 의도치 않은 제동이 걸려 hazard가 생기는 상황"],"ans":[3],"exp":"용어집 정의: 기능 안전은 E/E(전기/전자) 시스템의 오작동으로 인한 hazard 때문에 생기는 불합리한 리스크가 없는 상태다(absence of unreasonable risk due to hazards caused by malfunctioning behavior of electric/electronic systems). 따라서 ① 원인이 E/E 시스템의 오작동이고 ② 그 결과 hazard가 생기는 상황이 대상이다. 제동 ECU의 SW 결함으로 의도하지 않은 제동이 걸리는 상황만 두 조건을 모두 만족한다. 실라버스 2.2.1.1도 기능 안전을 정보 보안(information security, 또는 사이버보안), product safety, occupational safety와 구분한다.\n함정 포인트: 브레이크 패드 마모도 제동 안전 문제라 끌리지만, 원인이 E/E 시스템의 오작동이 아니다.","why":["작업 중 부상은 occupational safety 영역이다. E/E 시스템의 오작동으로 인한 hazard가 아니다.","기계 부품의 마모는 E/E 시스템의 오작동이 아니다.","개인정보 유출은 정보 보안(또는 사이버보안) 영역이며, E/E 시스템의 오작동으로 인한 hazard가 아니다.","정답. E/E 시스템의 오작동이 hazard를 만든 경우다."],"trap":"현업에서는 '제동 관련이면 모두 안전 이슈'로 묶어 기능 안전 담당에게 보내기 쉽다. 용어집 정의는 원인을 E/E 시스템의 오작동으로 한정한다.","ref":"2장 Keywords(ISTQB 용어집), 2.2.1.1","hard":true},{"id":"h2-120","ch":2,"lo":"AuT-2.KW","k":1,"q":"2장 키워드인 method table(메소드 테이블)과 Domain Specific Keyword인 ASIL(automotive safety integrity level)의 정의에 대한 설명으로 맞는 것을 두 개 고르시오.","opts":["method table은 ASIL에 따라 요구되는 테스트 기법만 모아 놓은 표이고, 테스트 유형은 이 표에 담지 않는다.","method table은 ASIL과 테스트 대상의 정황에 따라 요구되는 테스트 접근법·기법·유형을 담은 표다.","method table은 테스트 대상의 정황과 관계없이, ASIL 하나만으로 요구되는 내용이 정해지는 표다.","ASIL은 IEC 61508에 정의된 안전 무결성 수준이며, ISO 26262는 이 수준을 자동차에 그대로 가져다 쓴다.","ASIL은 ISO 26262에 정의된, 자동차 기능 안전(functional safety)용 안전 무결성 수준이다."],"ans":[1,4],"exp":"용어집 정의: method table은 'ASIL과 테스트 대상의 정황에 따라 요구되는 여러 테스트 접근법, 테스트 기법, 테스트 유형을 담은 표'다. 테스트 기법만 담는다거나 정황과 관계없다는 설명은 정의와 다르다. 실라버스 6장 정의: ASIL은 'ISO 26262에 정의된, 자동차 기능 안전을 위한 안전 무결성 수준'이다. IEC 61508은 ISO 26262의 기반 표준이지만(2.2.1.1), ASIL은 ISO 26262에 정의돼 있다.\n함정 포인트: method table을 '기법 표'로만 기억하면 테스트 기법만 담는다는 보기가 끌리지만, 정의에는 테스트 접근법과 테스트 유형도 들어 있다.\n(ASIL 정의는 v2.1 6장 기준. 2018년판 정의와 ISTQB 용어집 정의는 'ISO 26262의 요구사항을 명시하는 네 가지 등급 중 하나'라는 다른 문장을 쓰지만, ISO 26262에 정의된 자동차 기능 안전용 레벨이라는 점은 같다.)","why":["정의에는 테스트 기법뿐 아니라 테스트 접근법과 테스트 유형도 들어 있다.","정답. 용어집의 method table 정의와 같다.","정의는 ASIL과 테스트 대상의 정황에 따라 요구 내용이 달라진다고 한다.","ASIL은 ISO 26262에 정의돼 있다. IEC 61508은 ISO 26262가 바탕으로 삼은 기반 표준이다(2.2.1.1).","정답. 실라버스 6장의 ASIL 정의와 같다."],"trap":"method table을 'ISO 26262 기법 표'라고 줄여 기억하면 테스트 기법만 담은 표로 착각하기 쉽다. 용어집 정의에는 테스트 접근법과 테스트 유형도 들어 있다.","ref":"2장 Keywords(ISTQB 용어집), 6장 Domain Specific Terms","hard":true},{"id":"h2-151","ch":2,"lo":"AuT-2.2.1.1","k":2,"q":"기능 안전(functional safety)에 대한 설명으로 실라버스 2.2.1.1과 맞지 **않는** 것은?","opts":["SW 기반 E/E 시스템은 운전 기능 자동화 같은 복잡한 기능을 가능하게 하며, 복잡도도 계속 높아진다.","기능 안전은 E/E 시스템이 정상적으로 동작하는 동안에 불합리한 리스크를 일으키지 않게 보장하는 것이다.","기능 안전은 정보 보안(사이버보안), product safety, occupational safety와 구분되는 개념이다.","ISO 26262는 IEC 61508을 바탕으로 만들어졌고, occupational safety는 그 초점이 아니다."],"ans":[1],"exp":"2.2.1.1: 기능 안전은 E/E 시스템이 오작동(malfunctioning behavior)으로 인한 hazard 때문에 불합리한 리스크(unreasonable risk)를 일으키지 않고 동작하게 하는 것이다. 정의의 핵심은 '오작동으로 인한 hazard'다. 이것을 '정상적으로 동작하는 동안'으로 바꾸면 다른 말이 된다.\n나머지 보기는 2.2.1.1에 있는 내용이다. SW 기반 E/E 시스템이 운전 기능 자동화 같은 새로운 복잡한 기능을 가능하게 하고 임베디드 시스템의 복잡도는 계속 높아진다. 기능 안전은 정보 보안(사이버보안), product safety, occupational safety와 구분된다. ISO가 기반 표준 IEC 61508을 바탕으로 ISO 26262를 만들었고, occupational safety는 ISO 26262의 초점이 아니다.","why":["맞는 진술이다. 임베디드 시스템의 기능·기술 복잡도는 계속 높아지고, SW 기반 E/E 시스템은 운전 기능 자동화 같은 새로운 복잡한 기능을 가능하게 한다.","정답. 실라버스 정의는 '오작동으로 인한 hazard 때문에' 생기는 불합리한 리스크를 다룬다. '정상 동작 중'으로 바꿔 놓은 진술이다.","맞는 진술이다. 실라버스는 기능 안전을 정보 보안(사이버보안), product safety, occupational safety와 구분한다.","맞는 진술이다. ISO가 IEC 61508을 바탕으로 ISO 26262를 만들었고, occupational safety는 ISO 26262의 초점이 아니다."],"trap":"현업에서는 '안전'을 '정상적으로 쓸 때 사고가 나지 않는 것'처럼 넓게 말하기도 한다. 실라버스 2.2.1.1의 기능 안전은 오작동으로 인한 hazard 때문에 생기는 불합리한 리스크를 다룬다.","ref":"2.2.1.1","hard":true},{"id":"h2-152","ch":2,"lo":"AuT-2.2.1.1","k":2,"q":"다음 중 ISO 26262가 다루는 기능 안전(functional safety)의 문제로 가장 적절한 것은?","opts":["정비소에서 정비사가 차량 리프트 작업 중 다치지 않도록 작업장 안전 수칙을 정하는 문제","인포테인먼트에 저장된 운전자 연락처가 외부로 유출되지 않도록 접근을 통제하는 문제","전동 조향 ECU의 SW 오작동으로 주행 중 의도하지 않은 조향이 생기는 hazard를 다루는 문제","결함 없이 사양대로 동작하지만, 내비게이션 경로 계산이 경쟁 차종보다 느리다는 문제"],"ans":[2],"exp":"2.2.1.1: 기능 안전은 E/E 시스템이 오작동으로 인한 hazard 때문에 불합리한 리스크를 일으키지 않고 동작하게 하는 것이다. 이 뜻에서 정보 보안(사이버보안), product safety, occupational safety와 구분된다. occupational safety와 사이버보안은 ISO 26262의 초점이 아니다.\n네 상황 중 E/E 시스템(조향 ECU)의 오작동이 주행 중 hazard로 이어지는 것만 이 정의에 맞는다.","why":["작업자 안전은 occupational safety다. 기능 안전과 구분되며 ISO 26262의 초점이 아니다.","개인정보 유출 방지는 정보 보안(사이버보안)의 문제다. 기능 안전과 구분되며 ISO 26262의 초점이 아니다.","정답. E/E 시스템의 오작동으로 인한 hazard라 기능 안전의 정의에 맞는다.","오작동도 hazard도 없는 성능 문제다. 기능 안전의 정의에 들지 않는다."],"ref":"2.2.1.1","hard":true},{"id":"h2-153","ch":2,"lo":"AuT-2.2.1.2","k":1,"q":"실라버스 2.2.1.2에 따르면, ISO 26262에 따른 제품 개발에서 자기 작업이 개발 프로세스와 최종 제품의 안전에 주는 영향을 이해해야 하는 사람의 범위는?","opts":["외부 파트너와 공급업체(supplier)까지 포함한 모든 참여자","기능 안전을 맡은 safety manager와 safety engineer","ASIL C 이상인 안전 요구사항(safety requirement)을 맡은 참여자","OEM 내부에서 ISO 26262 개발 프로세스를 따르는 구성원"],"ans":[0],"exp":"2.2.1.2: ISO 26262에 따른 제품 개발에서는 자기 조직의 프로세스만 모니터링해서는 충분하지 않고, 모든 참여자가 프로세스를 넘나드는(cross-process) 접근을 따라야 한다. 모든 사람(everybody)이 자기 작업이 개발 프로세스와 최종 제품의 안전에 주는 영향을 이해해야 하며, 여기에는 외부 파트너와 공급업체도 포함된다.","why":["정답. 외부 파트너와 공급업체를 포함해 모든 사람이 이해해야 한다.","특정 역할로 한정하지 않는다. 모든 참여자가 이해해야 한다.","ASIL로 대상을 나누지 않는다. 모든 참여자가 이해해야 한다.","OEM 내부로 한정하지 않는다. 외부 파트너와 공급업체도 포함된다."],"ref":"2.2.1.2","hard":true},{"id":"h2-154","ch":2,"lo":"AuT-2.2.2","k":2,"q":"ASIL D 제동 제어 ECU 프로젝트가 방금 release for production을 받았다. 실라버스 2.2.2의 safety lifecycle(안전 수명주기) 설명에 비추어 맞는 것은?","opts":["release for production으로 1단계(concept phase)가 끝났고, 이제부터 product development가 시작된다.","release for production은 product development의 시작점이고, 이때부터 하위 단계 사이의 테스트 실행이 시작된다.","release for production으로 safety lifecycle이 끝나고, 이후 생산과 서비스는 기존 품질경영시스템(QMS)으로 다룬다.","release for production으로 2단계(product development)가 끝났고, 제품은 safety lifecycle의 3단계로 넘어간다."],"ans":[3],"exp":"2.2.2: ISO 26262 safety lifecycle은 세 단계다. 1단계 concept phase, 2단계 product development(이 단계는 release for production으로 끝난다), 3단계 production, operation, service and decommissioning. safety lifecycle은 첫 제품 아이디어와 가능한 리스크 식별에서 시작해 수명이 다한 제품의 폐기로 끝난다.\n그래서 release for production은 2단계의 끝이고, 제품은 3단계로 넘어간다. 테스터는 테스트 활동으로 이 3단계 전환에 크게 기여한다.\n(v2.1 기준. 2018년판은 1단계를 Product concept, 3단계를 release for production 이후의 Product production and maintenance로 적었다.)","why":["concept phase는 1단계다. release for production은 2단계 product development를 끝내는 시점이다.","release for production은 product development의 끝이다. 하위 단계 사이의 테스트 실행은 그 전, product development 안에서 이루어진다.","safety lifecycle은 수명이 다한 제품의 폐기로 끝나며, 3단계도 safety lifecycle 안에 있다. 기존 품질경영시스템(QMS)으로 충분하다는 말은 ASIL A 미만 요구사항에 대한 것이다(2.2.4.1).","정답. 2단계는 release for production으로 끝나고, 그다음이 3단계다."],"ref":"2.2.2","hard":true},{"id":"h2-155","ch":2,"lo":"AuT-2.2.2","k":2,"q":"safety lifecycle(안전 수명주기)에서 테스터의 활동에 대한 설명으로 실라버스 2.2.2와 맞지 **않는** 것은?","opts":["테스터는 safety lifecycle의 처음 두 단계에서 주로 일하지만, 3단계에서 생긴 제품 변경에도 참여한다.","테스트 계획은 보통 concept phase에서 하지만, 테스트 계획서나 테스트 명세의 조정은 어느 단계에서든 필요할 수 있다.","테스트 실행은 product development 하위 단계 사이의 전환 시점(예: 구현 → SW 통합)에서만 이루어진다.","안전 관련 요구사항을 바탕으로 테스트 기법을 고르고, 그 요구사항의 베리피케이션과 밸리데이션용 테스트 케이스를 설계한다."],"ans":[2],"exp":"2.2.2: 테스트 실행은 주로(primarily) product development 하위 단계 사이의 전환 시점에 이루어진다(예: 구현 → SW 통합 → HW-SW 통합). 실라버스는 이어서 테스터가 테스트 활동으로 3단계로 넘어가는 전환에도 크게 기여한다고 한다. '주로'를 '~에서만'으로 바꾼 진술이 틀렸다.\n나머지는 2.2.2에 있는 내용이다. 테스터는 처음 두 단계에서 주로 일하고, 3단계의 제품 변경은 범위에 따라 1단계나 2단계로 돌아가므로 수정에도 참여한다. 테스트 계획은 보통 concept phase에서 하지만 테스트 계획서·테스트 명세 같은 결과 문서의 조정은 어느 단계에서든 필요할 수 있다. 안전 관련 요구사항을 바탕으로 테스트 기법을 고르고 베리피케이션(verification)·밸리데이션(validation)용 테스트 케이스를 설계한다.","why":["맞는 진술이다. 3단계의 변경은 범위에 따라 1단계나 2단계로 돌아가므로 테스터도 수정에 참여한다.","맞는 진술이다. 테스트 계획은 보통 concept phase에서 하고, 결과 문서의 조정은 어느 단계에서든 필요할 수 있다.","정답. 실라버스는 '주로(primarily)' 전환 시점에 실행한다고 한다. 테스터는 3단계로 넘어가는 전환에도 테스트 활동으로 크게 기여한다.","맞는 진술이다. 2.2.2에 그대로 있다."],"trap":"현업에서 '단계가 넘어갈 때 테스트한다'고 줄여 말하다 보면 '그때만' 한다고 기억하기 쉽다. 실라버스 2.2.2는 '주로'라고 쓰고, 3단계로 넘어가는 전환에 대한 테스터의 기여를 따로 적는다.","ref":"2.2.2","hard":true},{"id":"h2-156","ch":2,"lo":"AuT-2.2.3.2","k":1,"q":"SW 테스터가 테스트에 쓸 도구의 qualification(qualification of tools) 요구사항을 찾으려 한다. 실라버스 2.2.3.2에 따르면 이 요구사항을 담고 있는 ISO 26262의 부(part)는?","opts":["6부","2부","4부","8부"],"ans":[3],"exp":"2.2.3.2: 8부는 모든 테스트 레벨에서 베리피케이션의 프로세스 관련 특성을 설명하는 특별한 역할을 한다. 또 표준화된 프로세스를 보장하는 데 중요한 지원 프로세스 요구사항을 담고 있는데, 그 예가 형상 관리(configuration management)와 도구 qualification이다.\n(v2.1 기준. 2018년판은 8부 지원 프로세스의 예로 형상 관리 대신 문서화를 들었다. 도구 qualification은 두 판에 모두 있다.)","why":["6부는 SW 수준의 테스트·베리피케이션 측면을 다룬다. 도구 qualification 요구사항은 8부에 있다.","2부는 기능 안전 관리(management of functional safety)다(2.2.3.1). 실라버스가 도구 qualification 요구사항이 있다고 한 부는 8부다.","4부는 safety validation을 포함한 시스템 수준의 테스트·베리피케이션 측면을 다룬다.","정답. 8부에 형상 관리, 도구 qualification 같은 지원 프로세스 요구사항이 있다."],"ref":"2.2.3.2","hard":true},{"id":"h2-157","ch":2,"lo":"AuT-2.2.4.1","k":1,"q":"실라버스 2.2.4.1에 따르면, HARA(hazard analysis and risk assessment)에서 찾아낸 hazard의 ASIL은 어떻게 정해지는가?","opts":["HARA를 수행한 전문가 팀이 ISO 26262에 정의된 방법론을 써서 hazard마다 정한다.","HARA를 수행한 전문가 팀이 공급업체의 ASPICE capability level을 반영해 hazard마다 정한다.","HARA를 수행한 전문가 팀이 기능별로 필요한 테스트 노력을 추정해 hazard마다 정한다.","HARA를 수행한 전문가 팀이 제품 전체에 ASIL 하나를 정해 모든 hazard에 똑같이 적용한다."],"ans":[0],"exp":"2.2.4.1: 프로젝트 초기에 전문가 팀이 제품에 대해 HARA를 수행한다. 이 분석으로 찾아낸 hazard마다 표준에 정의된 방법론(methodologies defined in the standard)을 써서 ASIL을 정한다. 다음 단계에서 안전 목표(safety goal)와 안전 요구사항을 정의하며, 이들은 바탕이 된 hazard와 같은 ASIL을 가진다.","why":["정답. hazard마다 표준에 정의된 방법론으로 ASIL을 정한다.","ASPICE의 평가 기준은 제품의 ASIL과 무관하다(2.4.1). ASIL은 표준에 정의된 방법론으로 정한다.","순서가 반대다. 정해진 ASIL이 테스트 범위에 영향을 준다(2.2.4.2). 테스트 노력으로 ASIL을 정하지 않는다.","ASIL은 hazard마다 정한다. 또 ASIL은 제품 전체의 특성이 아니라 특정 안전 목표에 묶인다(2.2.4.2)."],"ref":"2.2.4.1","hard":true},{"id":"h2-158","ch":2,"lo":"AuT-2.2.4.2","k":2,"q":"ASIL이 테스트에 주는 영향에 대한 진술 중 실라버스 2.2.4.2와 맞는 것은?","opts":["ASIL이 낮은 요구사항은 명시된 조치의 수행이 항상 선택 사항이므로, method table을 확인하지 않아도 된다.","정해진 ASIL은 테스트 범위에 직접 영향을 주며, ASIL이 높을수록 표준은 더 폭넓고 상세한 조치를 권고한다.","ISO 26262는 조치의 권고 수준을 recommended와 no recommendation 두 가지로만 나누어 ASIL별로 정한다.","ASIL이 높은 요구사항에는 method table에 적힌 방법만 쓸 수 있어서, 테스터가 다른 방법을 고를 여지가 없다."],"ans":[1],"exp":"2.2.4.2: 정해진 ASIL은 테스터가 수행할 테스트의 범위에 직접 영향을 준다. 표준은 ASIL에 따라 서로 다른 조치나 조치 묶음을 권고하며, 높은 ASIL일수록 더 폭넓고 상세한 조치를 권고한다. 낮은 ASIL에서는 명시된 조치의 수행이 선택 사항인 경우가 많다(often).\n권고 수준은 no recommendation, recommended, highly recommended 세 가지다. 테스터는 표준이 그 경우에 허용하는 범위 안에서만 자유롭게 정할 수 있고, 2.2.5에 따르면 method table에 없는 방법도 유용성과 적합성을 정당화하면 쓸 수 있다.","why":["실라버스는 낮은 ASIL에서 조치가 선택 사항인 경우가 '많다(often)'고 한다. '항상'이 아니다. 예를 들어 ASIL A에서도 동등 분할과 경계값 분석은 recommended다.","정답. 2.2.4.2의 설명이다.","권고 수준은 no recommendation, recommended, highly recommended 세 가지다.","ISO 26262는 method table에 없는 방법도 쓰도록 허용한다. 다만 고른 방법의 유용성과 적합성을 정당화해야 한다(2.2.5)."],"trap":"현업에서는 ASIL이 낮으면 안전 조치를 건너뛰어도 된다고 여기기 쉽다. 실라버스 2.2.4.2는 낮은 ASIL에서 조치가 선택 사항인 경우가 '많다'고만 하며, ASIL A에서도 recommended인 기법이 있다.","ref":"2.2.4.2","hard":true},{"id":"h2-159","ch":2,"lo":"AuT-2.2.4.2","k":2,"q":"ASIL A 안전 요구사항의 테스트를 계획하던 테스터가 경계값 분석(boundary value analysis)을 쓰지 않기로 했다. 실라버스 2.2.4.2에 비추어 이 결정에 대한 평가로 맞는 것은?","opts":["ASIL A에서 경계값 분석은 recommended이므로, 쓰지 않으려면 그 근거를 제시해야 한다.","ASIL A에서도 경계값 분석은 highly recommended이므로, 쓰지 않는 결정은 허용되지 않는다.","ASIL A에서 경계값 분석은 권고가 없으므로(no recommendation), 근거 없이 빼도 된다.","ASIL A는 기능 안전 조치가 필요 없는 수준이라, 기존 품질경영시스템(QMS)만 따르면 된다."],"ans":[0],"exp":"2.2.4.2: 동등 분할(equivalence partitioning)과 경계값 분석은 ASIL A에서는 recommended일 뿐이고, ASIL B 이상에서는 highly recommended다. recommended인 방법은 적용하는 것이 원칙(should)이고, 적용하지 않으면 그 근거(rationale)를 제시해야(shall) 한다. 그래서 쓰지 않는 결정 자체는 할 수 있지만 근거가 있어야 한다.\n기능 안전 조치가 필요 없고 기존 QMS로 충분한 것은 HARA 결과 ASIL A 미만으로 나온 요구사항이다(2.2.4.1).\n(v2.1 기준. 2018년판에는 recommended를 '적용이 원칙, 미적용 시 근거 제시'로 해석하는 문장이 없다.)","why":["정답. recommended는 적용하는 것이 원칙이고, 적용하지 않으면 근거를 제시해야 한다.","경계값 분석이 highly recommended인 것은 ASIL B 이상이다. ASIL A에서는 recommended다.","ASIL A에서 경계값 분석은 recommended다. 권고가 없는 것이 아니므로 근거 없이 뺄 수 없다.","기능 안전 조치가 필요 없는 것은 ASIL A 미만으로 나온 요구사항이다. ASIL A는 안전 관련 요구사항이다."],"ref":"2.2.4.2","hard":true},{"id":"h2-160","ch":2,"lo":"AuT-2.2.5","k":3,"q":"아래 표는 실라버스 2.2.5의 표 1(method table(메소드 테이블) 예시)이다. ++ = highly recommended, + = recommended, o = 권고 없음(no recommendation). 3a와 3b처럼 같은 번호에 문자 접미사가 붙은 행은 동등한 대안 방법이다.\n테스터가 어떤 안전 요구사항의 ASIL 열을 읽고, 표가 요구하는 내용을 아래 세 줄로 옮겨 적었다. 세 줄이 모두 바르게 옮긴 것이라면 이 요구사항의 ASIL은?\n① method x: 적용하는 것이 원칙이고, 적용하지 않으려면 근거를 제시한다.\n② method y: 표준이 사용을 권하지도 말리지도 않는다. 쓴다면 보조 조치로 쓴다.\n③ 3a/3b: 적합한 조합을 골라 ASIL에 맞게 베리피케이션하고, 고른 조합의 유용성을 정당화한다.","table":{"head":["행","Method","ASIL A","ASIL B","ASIL C","ASIL D"],"rows":[["1","Method x","o","+","++","++"],["2","Method y","o","o","+","+"],["3a","Method z1","+","++","++","++"],["3b","Method z2","++","+","o","o"]]},"opts":["ASIL A","ASIL B","ASIL C","ASIL D"],"ans":[1],"exp":"풀이(2.2.4.2, 2.2.5)\n① 줄 ①은 recommended(+)의 뜻이다. 행 1(x)은 A o, B +, C ++, D ++이므로 +인 열은 ASIL B뿐이다.\n② 줄 ②는 o(권고 없음)의 뜻이다. 행 2(y)는 A o, B o, C +, D +이므로 o인 열은 ASIL A와 B다.\n③ 줄 ③은 대안 행(3a/3b)의 일반 규칙이다. 적합한 조합을 고르고 그 유용성(usefulness)을 정당화하는 것은 어느 ASIL에서나 맞으므로 ASIL을 가르지 않는다.\n④ ①과 ②를 함께 만족하는 열은 ASIL B다.\n검산 1: 원문 표 1의 행 1, 2를 다시 대조했다. x: o, +, ++, ++ / y: o, o, +, +로 같다.\n검산 2: 보기마다 대입했다. ASIL A는 x가 o라 줄 ①과 맞지 않는다. ASIL C, D는 x가 ++라 근거를 대고 뺄 수 없고(반드시 적용), y도 +라 줄 ②와 맞지 않는다. 세 줄이 모두 맞는 것은 ASIL B 하나다.\n참고: 실라버스가 '권고 수준이 가장 높은 z1을 적어도 고른다'고 한 것은 ASIL C로 표 1을 읽는 예시에서 나온 말이다. 대안 행에 대한 일반 규칙은 줄 ③처럼 적합한 조합을 고르고 유용성을 정당화하는 것이다.\n(v2.1 기준. 2018년판은 recommended를 '증거에 유용하면 적용'으로 설명했다.)","why":["ASIL A에서 x는 o다. 권고가 없으므로 줄 ①('적용이 원칙, 안 하면 근거 제시')으로 옮길 수 없다.","정답. x가 +, y가 o인 열은 ASIL B뿐이고, 줄 ③은 어느 ASIL에서나 맞는다.","ASIL C에서 x는 ++라 반드시 적용해야 하므로 근거를 대고 뺄 수 없다. y도 +라 줄 ②와 맞지 않는다.","ASIL D 열은 ASIL C 열과 같다(x ++, y +). 줄 ①과 ② 모두 맞지 않는다."],"ref":"2.2.5","hard":true},{"id":"h3-001","ch":3,"lo":"AuT-3.1.1","k":1,"q":"공급업체(supplier)의 테스트 리더가 일정 회의에서 이렇게 말했다.\n\"ECU 시제품은 10개월 뒤에 나옵니다. 그때까지는 테스트를 실행할 수 없고, 와이어링 하네스(wiring harness) 단락 같은 상황은 시제품이 나온 뒤 시험 차량에서 직접 만들어 확인하겠습니다.\"\n실라버스 3.1.1에 비추어 이 계획에 대한 판단으로 가장 적절한 것은?","opts":["실차가 가장 현실적인 환경이므로, 시제품을 기다렸다가 시험 차량에서 단락을 직접 재현하는 계획이 실라버스의 취지와 맞다.","조기 테스팅이 우선이므로 현실적인 환경은 필요 없고, 완성 제품에서 나타날 결함까지 모두 개발 초기의 가상 환경에서 찾으면 된다.","단계에 맞는 테스트 환경을 쓰면 ECU 완성 전에도 테스트 작업을 실행하고, 실차에서 재현하기 어려운 단락도 시뮬레이션할 수 있다.","ECU 완성 전에는 개별 테스트 작업을 구현까지만 할 수 있고, 테스트 실행과 단락 시뮬레이션은 완성된 ECU가 있어야 할 수 있다."],"ans":[2],"exp":"3.1.1: 테스터는 결함을 일찍 찾으려고 되도록 일찍 테스팅을 시작해야 하고, 완성 제품에서 나타날 결함을 찾으려면 현실적인 환경도 필요하다. 이 상충은 개발 단계에 맞는 테스트 환경을 써서 푼다. 그러면 ECU가 완전히 생산·개발되기 전에도 개별 테스트 작업을 구현·실행할 수 있고, 단락·단선이나 네트워크 통신 과부하처럼 실차에서 재현하기 어려운 상황도 시뮬레이션할 수 있다.\n함정 포인트: '실차가 가장 현실적'이라는 감각 때문에 시제품을 기다리는 보기가 끌리지만, 실라버스는 단락을 실차에서 재현하기 어려운 상황의 예로 든다.","why":["3.1.1은 단락을 실차에서 재현하기 어려운 상황의 예로 들고, 여러 테스트 환경으로 시뮬레이션할 수 있다고 한다.","3.1.1: 완성 제품에서 나타날 결함을 찾으려면 현실적인 환경도 필요하다. 이 요구를 버리는 것이 아니라 단계에 맞는 환경으로 상충을 푼다.","정답. 3.1.1: 개발 단계에 맞는 테스트 환경을 쓰면 ECU가 완전히 생산·개발되기 전에도 개별 테스트 작업을 구현·실행할 수 있고, 단락처럼 실차에서 재현하기 어려운 상황을 시뮬레이션할 수 있다.","3.1.1은 ECU 완성 전에도 개별 테스트 작업을 구현하고 실행(implement and execute)할 수 있다고 한다."],"trap":"전기적 고장은 실제 차량이나 실제 하네스에서 직접 만들어 봐야 믿을 수 있다고 생각하기 쉽다. 실라버스 3.1.1은 단락·단선을 실차에서 재현하기 어려운 상황으로 보고, 테스트 환경으로 시뮬레이션할 수 있다고 한다.","ref":"3.1.1","hard":true},{"id":"h3-002","ch":3,"lo":"AuT-3.1.2","k":1,"q":"한 공급업체가 바디 ECU용 테스트 환경을 꾸리면서 장비와 소프트웨어를 실라버스 3.1.2(ISO/IEC/IEEE 29119-1에 따른 구성 요소)로 분류했다. 실라버스가 든 예와 맞지 **않는** 분류는?","opts":["real-time capable computer → 시뮬레이션 소프트웨어·환경 모델을 돌리는 데 쓰므로 소프트웨어","제어 컴퓨터와 테스트 벤치 → 하드웨어","운영체제와 환경 모델 → 소프트웨어","전자기 방사·노이즈 차단 → 실험실"],"ans":[0],"exp":"3.1.2는 테스트 환경을 하드웨어(제어 컴퓨터, 필요하면 real-time capable computer, 테스트 벤치, development kit), 소프트웨어(운영체제, 시뮬레이션 소프트웨어, 환경 모델), 통신 설비(네트워크 접근, 데이터 로거), 도구(오실로스코프, 측정 도구), 실험실(전자기 방사·노이즈 차단)로 나눈다. real-time capable computer는 소프트웨어가 아니라 하드웨어의 예이고, 실라버스는 '필요할 때(when needed)' 들어간다고 적는다.\n함정 포인트: real-time capable computer는 HiL에서 환경 모델이 도는 컴퓨터라(3.2.3.1) 환경 모델·시뮬레이션 소프트웨어와 한 묶음으로 보기 쉽지만, 3.1.2 분류는 하드웨어다.","why":["정답(맞지 않는 분류). 3.1.2에서 real-time capable computer는 제어 컴퓨터, 테스트 벤치, development kit과 함께 테스트 환경의 하드웨어 예다. 환경 모델이 이 컴퓨터에서 돈다는 설명은 3.2.3.1의 HiL 구성 요소 설명이다.","3.1.2: 하드웨어의 예는 제어 컴퓨터, 필요할 때 real-time capable computer, 테스트 벤치, development kit이다. 맞는 분류다.","3.1.2: 소프트웨어의 예는 운영체제, 시뮬레이션 소프트웨어, 환경 모델이다. 맞는 분류다.","3.1.2: 실험실의 예는 전자기 방사·노이즈 차단이다. 맞는 분류다."],"trap":"real-time capable computer는 환경 모델을 돌리는 장비라(3.2.3.1) 시뮬레이션 소프트웨어·환경 모델과 같은 '소프트웨어' 쪽으로 묶기 쉽다. 실라버스 3.1.2는 real-time capable computer를 필요할 때 들어가는 테스트 환경의 하드웨어 예로 든다.","ref":"3.1.2","hard":true},{"id":"h3-003","ch":3,"lo":"AuT-3.1.3","k":2,"q":"테스터가 다섯 가지 테스트 구성을 검토하고 있다. 실라버스 3.1.3의 설명에 따라 closed-loop 시스템으로 테스트하는 구성을 두 개 고르시오.","opts":["환경 모델이 ECU가 내보낸 브레이크 압력 명령으로 차량 감속을 계산하고, 그 결과를 휠 속도 신호로 바꿔 다시 ECU 입력에 넣는다.","테스터가 테스트 절차에 스위치 입력 순서를 미리 적어 두고, 그 순서대로 입력을 넣으면서 램프 출력만 확인한다.","환경 모델이 미리 정한 도로 경사 프로파일을 시간 순서대로 ECU 입력에 넣고, ECU 출력은 기록만 할 뿐 입력 계산에 쓰지 않는다.","환경 모델이 ECU의 스로틀 출력을 모아 엔진 회전수를 계산하고, 그 회전수를 ECU 입력으로 되돌려 제어 루프를 만든다.","ECU 출력을 오실로스코프로 측정해 기대 결과와 비교하지만, 측정값은 ECU 입력에 아무 영향도 주지 않는다."],"ans":[0,3],"exp":"3.1.3.1: closed-loop 시스템(in-the-loop)에서 자극은 테스트 대상의 출력을 고려한다. 환경 모델이 출력을 모아 직접 또는 간접적으로 테스트 대상의 입력에 넘기므로 테스트 환경 안에 제어 루프가 생긴다. 3.1.3.2: open-loop 시스템에서는 출력이 입력과 관계가 없고 피드백 루프가 없으며, 입력은 테스터가 테스트 절차에서 직접 정한다.\n함정 포인트: 환경 모델이 입력을 만들어 주는 구성도 출력을 입력 계산에 쓰지 않으면 closed-loop가 아니다.","why":["정답. 환경 모델이 출력(브레이크 압력 명령)을 모아 차량 모델을 거쳐 간접적으로 입력(휠 속도)에 넘긴다. 3.1.3.1: 출력을 '직접 또는 간접적으로' 입력에 넘기면 closed-loop다.","입력을 테스터가 테스트 절차에서 직접 정하고 출력이 입력에 영향을 주지 않는다. 3.1.3.2의 open-loop 시스템이다.","환경 모델을 쓰지만 출력을 입력 계산에 쓰지 않아 제어 루프가 없다. closed-loop에서는 자극이 테스트 대상의 출력을 고려해야 한다(3.1.3.1).","정답. 환경 모델이 출력을 모아 입력으로 되돌려 테스트 환경 안에 제어 루프를 만든다(3.1.3.1).","출력을 관찰해 기대 결과와 비교하는 것은 테스트 환경의 일반 역할이다(3.1.3). 출력이 입력으로 돌아가지 않으므로 closed-loop가 아니다."],"trap":"가상 환경에서 환경 모델이 입력을 만들어 주면 closed-loop라고 생각하기 쉽다. 실라버스 3.1.3.1의 기준은 환경 모델의 유무가 아니라, 테스트 대상의 출력이 직접 또는 간접적으로 입력에 되돌아가는지다.","ref":"3.1.3","hard":true},{"id":"h3-004","ch":3,"lo":"AuT-3.1.3","k":2,"q":"closed-loop 시스템과 open-loop 시스템에 대한 진술 i~v 가운데 실라버스 3.1.3과 맞는 것만 모두 고른 것은?\ni. closed-loop 시스템은 in-the-loop라고도 하며, 테스트 환경 안에 제어 루프가 만들어진다.\nii. closed-loop 시스템에서 환경 모델은 테스트 대상의 출력을 모아 직접 또는 간접적으로 테스트 대상의 입력에 넘긴다.\niii. 테스트 대상이 reactive behavior를 보이거나 상태 머신(state machine)을 반영하면 closed-loop 시스템이 선호된다.\niv. 제어기(controller)를 테스트할 때는 closed-loop 시스템을 더 자주 쓴다.\nv. open-loop 시스템에서는 환경 모델이 테스트 대상의 출력을 보고 다음 입력을 정한다.","opts":["i, ii, iii","ii, iv, v","i, iv, v","i, ii, iv"],"ans":[3],"exp":"i 맞음: 3.1.3.1, closed-loop는 in-the-loop라고도 하며 테스트 환경 안에 제어 루프가 생긴다. ii 맞음: 환경 모델이 출력을 모아 직접 또는 간접적으로 입력에 넘긴다. iii 틀림: 3.1.3.2, reactive behavior나 상태 머신이면 open-loop가 선호된다. iv 맞음: 3.1.3.1, closed-loop는 제어기 테스트에 더 자주 쓴다(예: 엔진·변속 제어, ABS, VDC). v 틀림: open-loop에서는 출력이 입력과 관계없고 입력을 테스터가 테스트 절차에서 정한다.\n함정 포인트: 상태가 바뀌며 동작하는 대상은 피드백이 필요해 보여 iii을 맞다고 고르기 쉽다.","why":["iii 틀림. reactive behavior나 상태 머신이면 open-loop 시스템이 선호된다(3.1.3.2). 맞는 iv도 빠졌다.","v 틀림. open-loop 시스템에는 피드백 루프가 없고 입력은 테스터가 테스트 절차에서 직접 정한다(3.1.3.2). 맞는 i도 빠졌다.","v 틀림. 맞는 ii도 빠졌다.","정답. i(3.1.3.1: in-the-loop, 제어 루프), ii(출력을 직접 또는 간접적으로 입력에 넘김), iv(제어기 테스트에 더 자주 사용)가 맞다."],"trap":"상태 머신처럼 이전 상태에 따라 다음 동작이 바뀌는 대상은 closed-loop로 테스트해야 한다고 생각하기 쉽다. 실라버스 3.1.3.2는 테스트 대상이 reactive behavior를 보이거나 상태 머신을 반영하면 open-loop 시스템이 선호된다고 한다.","ref":"3.1.3","hard":true},{"id":"h3-005","ch":3,"lo":"AuT-3.1.4","k":1,"q":"ECU의 입력·출력과 데이터 처리에 대한 진술 i~v 가운데 실라버스 3.1.4와 맞는 것만 모두 고른 것은?\ni. ECU는 하드웨어와 소프트웨어로 이루어진 임베디드 시스템으로 동작한다.\nii. bus system은 센서나 다른 ECU에서 오는 정보를 ECU에 추가로 제공한다.\niii. ECU가 만든 출력은 bus system으로만 내보내고, 진단 인터페이스는 입력 전용이다.\niv. 테스트 대상은 출력 동작·정보·데이터를 처리하려고 메모리 안의 데이터를 관리한다.\nv. 진단 기능용 데이터베이스(예: ASAM MCD-3 D) 말고도 자동차 전용 데이터베이스가 있으며, 그것은 ISO 26262에 정의되어 있다.","opts":["i, iii, iv","i, ii, iv","ii, iv, v","i, ii, iii"],"ans":[1],"exp":"3.1.4: 자동차 환경의 ECU는 하드웨어와 소프트웨어로 이루어진 임베디드 시스템으로 동작한다(i). 아날로그·디지털 입력으로 전압·전류·온도 형태의 환경 데이터를 수집하고, bus system은 센서나 다른 ECU에서 오는 정보를 추가로 제공한다(ii). 테스트 대상은 출력 동작·정보·데이터를 처리하려고 메모리 안의 데이터를 관리한다(iv). 출력은 아날로그·디지털 출력 핀, bus system, 진단 인터페이스로 나간다(iii 틀림). 그 밖의 자동차 전용 데이터베이스는 ASAM과 AUTOSAR 표준에 정의되어 있다(v 틀림).\n함정 포인트: ISO 26262가 자동차 SW 표준으로 익숙해 v가 그럴듯해 보이지만, 3.1.4가 든 표준은 ASAM과 AUTOSAR다.","why":["iii 틀림. 출력은 아날로그·디지털 출력 핀, bus system, 진단 인터페이스로 내보낸다(3.1.4). 맞는 ii도 빠졌다.","정답. i(임베디드 시스템), ii(bus system의 추가 정보), iv(메모리 안의 데이터 관리)가 3.1.4와 맞다.","v 틀림. 3.1.4는 그 밖의 자동차 전용 데이터베이스가 ASAM과 AUTOSAR 표준에 정의되어 있다고 한다. 맞는 i도 빠졌다.","iii 틀림. 맞는 iv도 빠졌다."],"ref":"3.1.4","hard":true},{"id":"h3-006","ch":3,"lo":"AuT-3.KW","k":1,"q":"ISTQB 용어집 정의 1~4와 용어 A~D를 바르게 짝지은 것은?\n1. 실제 소프트웨어를 테스트하는 가상 테스트 환경\n2. 소프트웨어가 통합된 실제 하드웨어를 테스트하는 가상 테스트 환경\n3. 시스템의 시뮬레이션 모델을 테스트하는 가상 테스트 환경\n4. 실시간 시뮬레이션에서, 다른 컴포넌트·프로세스·환경 조건을 포함한 컴포넌트 또는 시스템의 실제 환경을 추상화한 것\nA. MiL(model-in-the-loop)\nB. SiL(software-in-the-loop)\nC. HiL(hardware-in-the-loop)\nD. 환경 모델(environment model)","opts":["1-A, 2-C, 3-B, 4-D","1-C, 2-B, 3-A, 4-D","1-B, 2-C, 3-A, 4-D","1-B, 2-D, 3-A, 4-C"],"ans":[2],"exp":"용어집(v2.1 연결 정의): MiL은 시스템의 시뮬레이션 모델을, SiL은 실제 소프트웨어를, HiL은 소프트웨어가 통합된 실제 하드웨어를 테스트하는 가상 테스트 환경이다. 환경 모델은 실시간 시뮬레이션에서 다른 컴포넌트·프로세스·환경 조건을 포함한 컴포넌트 또는 시스템의 실제 환경을 추상화한 것이다. 세 XiL 정의는 무엇을 테스트하느냐(모델 / 실제 소프트웨어 / 소프트웨어가 통합된 실제 하드웨어)로만 갈린다.\n함정 포인트: 1과 2에 모두 '실제'와 '소프트웨어'가 들어 있어 SiL과 HiL을 바꿔 잇기 쉽다.\n(v2.1 기준. 2018년판 키워드에 연결된 이전 용어집 정의는 MiL·SiL·HiL을 'Dynamic testing performed using …'처럼 테스트 활동으로 정의했다.)","why":["1과 3이 바뀌었다. 시뮬레이션 모델을 테스트하는 것이 MiL, 실제 소프트웨어를 테스트하는 것이 SiL이다.","1과 2가 바뀌었다. 소프트웨어가 통합된 '실제 하드웨어'를 테스트하는 것이 HiL이다.","정답. SiL은 실제 소프트웨어, HiL은 소프트웨어가 통합된 실제 하드웨어, MiL은 시스템의 시뮬레이션 모델을 테스트하는 가상 테스트 환경이고, 4는 환경 모델 정의다.","2와 4가 바뀌었다. 4는 실제 환경을 추상화한 것이라 테스트 환경이 아니라 환경 모델의 정의다."],"ref":"3장 Keywords","hard":true},{"id":"h3-007","ch":3,"lo":"AuT-3.KW","k":1,"q":"실라버스 6장의 정의를 그대로 적용할 때 closed-loop 시스템에 해당하는 것은?","opts":["입력이 테스트 절차에 미리 정해져 있어 출력이나 출력의 변화와 관계없는 시스템","출력이 버스로 다른 ECU에 전달되지만, 그 결과가 이 시스템의 입력이나 제어 동작에는 영향을 주지 않는 시스템","출력을 기록해 테스트 뒤 기대 결과와 비교할 뿐, 입력은 출력과 독립적으로 정해지는 시스템","제어 동작이 출력값 자체가 아니라 출력의 변화에 따라 정해지는 시스템"],"ans":[3],"exp":"6장 정의: closed-loop 시스템은 제어 동작이나 입력이 출력 또는 출력의 변화에 의존하는 시스템이고, open-loop 시스템은 제어 동작이나 입력이 출력 또는 출력의 변화와 독립적인 시스템이다. 출력의 변화에만 의존해도 closed-loop 정의에 들어간다.\n함정 포인트: 출력의 '변화'에 반응하는 것은 출력 자체에 의존하는 것이 아니라고 보고 정답을 버리기 쉽다.","why":["입력이 출력이나 출력의 변화와 독립적이므로 open-loop 시스템 정의에 해당한다.","출력이 다른 곳으로 나가도 이 시스템의 입력·제어 동작이 출력에 의존하지 않으면 open-loop 정의에 해당한다.","출력을 기대 결과와 비교하는지는 정의의 기준이 아니다. 입력이 출력과 독립적이므로 open-loop 정의에 해당한다.","정답. 6장 정의: 제어 동작이나 입력이 출력 '또는 출력의 변화'에 의존하는 시스템이 closed-loop 시스템이다."],"ref":"6장 Domain Specific Terms","hard":true},{"id":"h3-008","ch":3,"lo":"AuT-3.2.1.1","k":1,"q":"모델 기반 개발 팀이 브레이크등 제어 기능을 모델로 만들어 테스터에게 넘겼다. 테스터가 이 모델로 MiL(model-in-the-loop) 테스트 환경을 꾸리려 한다. 실라버스 3.2.1.1의 MiL 구조 설명과 맞는 것은?","opts":["모델을 특정 컴퓨터 아키텍처용으로 컴파일한 뒤, 래퍼(wrapper)를 거쳐 환경 모델(environment model)과 연결해 실행한다.","모델은 실행할 수 있지만 특수 하드웨어용으로 컴파일되지 않았고, 테스트 환경은 보통 테스트 대상과 같은 개발 환경에 구현한다.","모델은 사람이 읽을 수는 있지만 실행할 수는 없어서, 환경 모델과 연결해 closed-loop 시스템으로 쓰기 어렵다.","테스트 대상 모델은 테스터가 특수 모델링 도구로 따로 만들고, access point는 환경 모델 안에만 둘 수 있다."],"ans":[1],"exp":"3.2.1.1: MiL에서 테스트 대상은 모델로 있다. 이 모델은 실행할 수 있지만 특수 하드웨어용으로 컴파일되지 않았다. 개발자가 특수 모델링 도구로 모델을 만들고, 테스터는 이 모델을 실행·테스트할 테스트 환경이 필요하다. 이 환경은 보통 테스트 대상과 같은 개발 환경에 구현하고, 환경 모델을 추가로 담을 수 있다. access point는 테스트 대상 모델과 환경 모델 안에 임의로 둘 수 있고, 테스트 대상 모델을 환경 모델에 연결해 closed-loop 시스템으로 쉽게 쓸 수 있다.\n함정 포인트: 모델을 '실행'하려면 코드 생성·컴파일이 필요하다고 생각하면 SiL 구조를 MiL로 고르게 된다.","why":["특정 컴퓨터 아키텍처용 컴파일과 래퍼는 SiL 구조다(3.2.2.1).","정답. 3.2.1.1: MiL의 테스트 대상은 실행 가능하지만 특수 하드웨어용으로 컴파일되지 않은 모델이고, 테스트 환경은 보통 테스트 대상과 같은 개발 환경에 구현한다.","MiL 모델은 실행 가능하며, 환경 모델과 연결해 closed-loop 시스템으로 쉽게 구현·사용할 수 있다(3.2.1.1).","모델은 개발자가 특수 모델링 도구로 만들고, access point는 테스트 대상 모델과 환경 모델 안 어디에나 둘 수 있다(3.2.1.1)."],"trap":"모델을 돌리려면 코드를 생성해 컴파일해야 한다고 생각하기 쉽다. 3.2.1.1은 MiL 모델이 실행 가능하지만 특수 하드웨어용으로 컴파일되지 않았다고 하고, 컴파일과 래퍼는 SiL 구조(3.2.2.1)다.","ref":"3.2.1.1","hard":true},{"id":"h3-009","ch":3,"lo":"AuT-3.2.1.2","k":2,"q":"MiL 테스트 환경의 경계 조건 1~4와, 실라버스 3.2.1.2가 각각에 붙인 이유·의미 A~D를 바르게 짝지은 것은?\n1. 테스트 실행이 실시간(real time)으로 이루어지지 않는다.\n2. 개발의 어느 단계부터는 MiL 테스트 환경을 구현하는 노력이 값어치를 잃는다.\n3. 환경 모델로 bus·진단 기능이나 단선·단락 같은 물리적 동작을 시뮬레이션하는 것은 흔하지 않다.\n4. 테스터가 시뮬레이션을 언제든 일시 정지할 수 있다.\nA. 상세한 분석과 평가를 할 수 있다는 큰 장점이 된다.\nB. 이런 작업은 다른 테스트 환경에서 더 쉽고 적은 비용으로 할 수 있다.\nC. 모든 구성 요소가 모델로 있어서 테스트가 시뮬레이션 시간으로 실행된다.\nD. 테스트 대상의 기능 범위가 커질수록 환경 모델이 복잡해지고, 모델 실행 시간이 불균형하게 늘어난다.","opts":["1-C, 2-D, 3-B, 4-A","1-D, 2-C, 3-B, 4-A","1-C, 2-B, 3-D, 4-A","1-D, 2-B, 3-A, 4-C"],"ans":[0],"exp":"3.2.1.2: ① 모든 구성 요소가 모델로 있으므로 테스트는 실시간이 아니라 시뮬레이션 시간으로 실행된다(1-C). ② 기능 범위가 커질수록 환경 모델이 복잡해지고 모델 실행 시간이 불균형하게 늘어나므로, 어느 단계부터 MiL 구현 노력이 값어치를 잃는다(2-D). ③ 환경 모델로 bus·진단 기능이나 단선·단락 같은 물리적 동작을 시뮬레이션하는 것은 흔하지 않다. 이런 작업은 다른 테스트 환경에서 더 쉽고 적은 비용으로 할 수 있다(3-B). ④ 시뮬레이션을 언제든 일시 정지해 상세히 분석·평가할 수 있다는 것이 큰 장점이다(4-A).\n함정 포인트: '실행 시간이 늘어난다'(D)는 말이 '실시간이 아니다'(1)와 가까워 보여 1-D로 잇기 쉽다.","why":["정답. 3.2.1.2의 각 경계 조건이 실라버스가 붙인 이유·의미와 그대로 짝지어졌다.","1의 이유는 모든 구성 요소가 모델이라 시뮬레이션 시간으로 실행되기 때문이다(C). D는 구현 노력이 값어치를 잃는 이유(2)다.","2의 이유는 환경 모델 복잡도와 실행 시간의 불균형한 증가(D)다. B는 bus·진단·물리적 동작 시뮬레이션이 흔하지 않은 이유(3)다.","네 짝이 모두 엇갈렸다. 1은 C, 2는 D, 3은 B, 4는 A와 이어진다."],"trap":"시뮬레이션이 실시간으로 돌지 않는 이유를 'PC 계산이 느려서'로 떠올려 D와 잇기 쉽다. 3.2.1.2는 모든 구성 요소가 모델이라 시뮬레이션 시간으로 실행되기 때문이라고 하며, 작은 시스템은 오히려 실시간보다 짧게 끝난다고 한다.","ref":"3.2.1.2","hard":true},{"id":"h3-010","ch":3,"lo":"AuT-3.2.1.2","k":2,"q":"차간 거리 유지 보조 기능을 모델 기반으로 개발하는 프로젝트다. 아직 모델에서 코드를 생성하지 않았고 ECU 하드웨어도 없다. 테스터가 MiL 테스트 환경에서 하려는 작업 가운데, 실라버스 3.2.1.2가 MiL로 할 수 있다고 설명하는 것을 두 개 고르시오.","opts":["레이더 센서 케이블의 단선을 환경 모델로 시뮬레이션해 결함 처리 동작을 확인한다.","모델에서 생성할 코드의 고정소수점 연산 차이를 이 단계에서 처음 확인한다.","모델의 기능 적합성(functional suitability)을 초기에 테스트한다.","CAN 메시지 응답 시간을 실시간으로 측정해 bus 통신 동작을 확인한다.","제동 판단 직전에 시뮬레이션을 일시 정지하고 모델 내부 신호를 자세히 분석한다."],"ans":[2,4],"exp":"3.2.1.2: MiL로 개발 초기에 모든 개발 레벨에 걸쳐 모델의 기능 적합성을 테스트할 수 있고, 시뮬레이션을 언제든 일시 정지해 상세히 분석·평가할 수 있다. 반면 환경 모델로 bus·진단 기능이나 단선·단락을 시뮬레이션하는 것은 흔하지 않고, 테스트는 실시간이 아니라 시뮬레이션 시간으로 실행된다. 모델과 생성 코드의 데이터 타입 차이는 SiL에서 처음 테스트할 수 있다(3.2.2.2).\n함정 포인트: 고정소수점 문제는 모델 단계에서 미리 잡고 싶어지지만, 실라버스는 그 차이를 처음 테스트할 수 있는 곳을 SiL로 둔다.\n(v2.1 기준. 2018년판은 '모델의 기능(functionality)'을 테스트한다고 썼다.)","why":["3.2.1.2: 단선·단락 같은 물리적 동작을 환경 모델로 시뮬레이션하는 것은 흔하지 않고, 다른 테스트 환경에서 더 쉽고 적은 비용으로 할 수 있다.","모델(주로 부동소수점)과 컴파일된 코드(주로 고정소수점)의 차이는 SiL에서 처음 테스트할 수 있다(3.2.2.2). 이 프로젝트에는 아직 코드도 없다.","정답. 3.2.1.2: MiL로 개발 초기(V-모델 왼쪽)에 모든 개발 레벨에 걸쳐 모델의 기능 적합성을 테스트할 수 있다.","MiL은 실시간이 아니라 시뮬레이션 시간으로 실행되고, 환경 모델로 bus 기능을 시뮬레이션하는 것도 흔하지 않다(3.2.1.2).","정답. 3.2.1.2: 테스터는 시뮬레이션을 언제든 일시 정지해 상세한 분석과 평가를 할 수 있다."],"trap":"화이트박스 테스터는 모델 단계에서 고정소수점 연산 차이까지 미리 보고 싶어 하기 쉽다. 실라버스 3.2.2.2는 모델(주로 부동소수점)과 컴파일된 코드(주로 고정소수점)의 차이를 SiL에서 처음 테스트할 수 있다고 한다.","ref":"3.2.1.2","hard":true},{"id":"h3-011","ch":3,"lo":"AuT-3.2.1.2","k":2,"q":"MiL 테스트 환경에 대한 진술 i~v 가운데 실라버스 3.2.1.2(각주 포함)와 맞는 것만 모두 고른 것은?\ni. 개발의 어느 단계부터 테스트 환경을 구현하는 노력이 값어치를 잃는다는 점은 MiL뿐 아니라 다른 XiL 환경에도 해당한다.\nii. 테스트 대상의 기능 범위가 커질수록 모델 실행 시간은 기능 범위에 비례해 늘어난다.\niii. 개발 중에 MiL로 단일 컴포넌트부터 전체 시스템까지 테스트할 수 있다.\niv. 테스트를 실행하려면 컴퓨터와, 환경 모델을 포함한 시뮬레이션 소프트웨어가 필요하다.\nv. MiL 환경 모델로 bus·진단 기능을 시뮬레이션하는 것이 일반적이다.","opts":["i, ii, iv","iii, iv, v","i, iii, iv","i, ii, iii"],"ans":[2],"exp":"i 맞음: 3.2.1.2 각주 25는 '구현 노력이 어느 단계부터 값어치를 잃는다'는 점이 다른 모든 XiL 환경에도 해당한다고 한다. ii 틀림: 모델 실행 시간은 불균형하게(disproportionately) 늘어난다. iii 맞음: 개발 중에 단일 컴포넌트부터 전체 시스템까지 테스트할 수 있다. iv 맞음: 컴퓨터와 환경 모델을 포함한 시뮬레이션 소프트웨어가 필요하다. v 틀림: bus·진단 기능이나 물리적 동작 시뮬레이션은 흔하지 않고, 다른 환경에서 더 쉽고 적은 비용으로 할 수 있다.\n함정 포인트: '비례해'와 '불균형하게'의 차이를 놓치면 ii를 맞다고 고르게 된다.","why":["ii 틀림. 실행 시간은 비례가 아니라 불균형하게(disproportionately) 늘어난다. 맞는 iii도 빠졌다.","v 틀림. 환경 모델로 bus·진단 기능을 시뮬레이션하는 것은 흔하지 않다. 맞는 i도 빠졌다.","정답. i(각주 25), iii, iv가 3.2.1.2와 맞다.","ii 틀림. 맞는 iv도 빠졌다."],"trap":"각주를 놓치면 '구현 노력이 값어치를 잃는' 한계를 MiL만의 문제로 보고, SiL·HiL로 옮기면 사라진다고 생각하기 쉽다. 3.2.1.2 각주 25는 이 점이 다른 XiL 환경에도 해당한다고 한다.","ref":"3.2.1.2","hard":true},{"id":"h3-012","ch":3,"lo":"AuT-3.2.2.1","k":1,"q":"SiL(software-in-the-loop) 테스트 환경의 구조에 대한 진술 i~v 가운데 실라버스 3.2.2.1과 맞는 것만 모두 고른 것은?\ni. 소스 코드를 특정 컴퓨터 아키텍처용으로 컴파일한 것이 테스트 대상이다.\nii. 컴파일된 기계어 코드는 바이너리 데이터 세트라서 테스트 환경이 읽을 수 있다.\niii. 래퍼(wrapper)는 테스트 대상의 access point를 정의하고, 아직 구현되지 않은 기능은 대신 수행한다.\niv. 테스트 대상은 래퍼의 도움으로 테스트 환경과 연결된다.\nv. 테스트를 실행하려면 타깃 프로세서가 달린 development kit이 필요하다.","opts":["i, iii, iv","ii, iv, v","i, ii, iii","i, ii, iv"],"ans":[3],"exp":"3.2.2.1: SiL의 테스트 대상은 특정 컴퓨터 아키텍처용으로 컴파일된 소스 코드다(i). 이 기계어 코드는 바이너리 데이터 세트라서 테스트 환경이 읽을 수 있다(ii). 테스트 환경이 신호에 접근하려면 래퍼가 필요하며, 래퍼는 access point를 정의하지만 테스트 대상의 기능은 수행하지 않는다(iii 틀림). 테스트 대상은 래퍼의 도움으로 테스트 환경과 연결되고(iv), 테스트는 특수 하드웨어 없는 컴퓨터에서 실행한다(v 틀림).\n함정 포인트: iii은 앞 절반(access point 정의)이 맞아서 통째로 맞다고 고르기 쉽다.","why":["iii 틀림. 래퍼는 access point를 정의하지만 테스트 대상의 기능을 수행하지 않는다(3.2.2.1). 맞는 ii도 빠졌다.","v 틀림. SiL 테스트는 특수 하드웨어 없는 컴퓨터에서 실행한다(3.2.2.1). 맞는 i도 빠졌다.","iii 틀림. 맞는 iv도 빠졌다.","정답. i, ii, iv가 3.2.2.1과 맞다."],"trap":"타깃 보드나 development kit에서 컴파일된 코드를 돌리는 것도 SiL이라고 생각하기 쉽다. 3.2.2.1은 SiL 테스트 실행이 특수 하드웨어 없는 컴퓨터에서 이루어진다고 한다.","ref":"3.2.2.1","hard":true},{"id":"h3-013","ch":3,"lo":"AuT-3.2.2.2","k":1,"q":"SiL 테스트 환경에서 평가하는 일이 흔하지 않은(unusual) 테스트 유형과 그 이유를 실라버스 3.2.2.2에 맞게 짝지은 것은?","opts":["리그레션 테스트: 시뮬레이션 시간으로 실행되므로 이전 결과와 비교할 수 없다.","신뢰도(reliability) 테스트: 이 품질 특성은 주로 타깃 하드웨어의 영향을 받는다.","인터페이스 테스트: 래퍼가 테스트 대상과 환경 사이의 인터페이스를 가린다.","수행 효율성(performance efficiency) 테스트: 래퍼가 테스트 대상 기능 일부를 대신 수행한다."],"ans":[1],"exp":"3.2.2.2: SiL에서 매우 흔하게 평가하는 테스트 유형은 기능 적합성 테스트, 인터페이스 테스트, 리그레션 테스트다. 수행 효율성 테스트와 신뢰도 테스트는 흔하지 않은데, 이 품질 특성은 주로 타깃 하드웨어의 영향을 받기 때문이다.\n함정 포인트: 수행 효율성 보기는 테스트 유형이 맞아서 끌리지만 이유가 실라버스와 다르다.\n(v2.1 기준. 2018년판은 같은 내용을 'functional, interface and regression tests', 'performance and reliability tests'로 적었다.)","why":["3.2.2.2: 리그레션 테스트는 SiL에서 평가하는 매우 흔한 테스트 유형이다.","정답. 3.2.2.2: 수행 효율성 테스트와 신뢰도 테스트는 SiL에서 흔하지 않고, 이 품질 특성은 주로 타깃 하드웨어의 영향을 받는다.","3.2.2.2: 인터페이스 테스트는 SiL에서 매우 흔한 테스트 유형이다. 래퍼는 access point를 정의한다(3.2.2.1).","수행 효율성 테스트가 SiL에서 흔하지 않은 것은 맞지만 이유가 틀렸다. 래퍼는 테스트 대상의 기능을 수행하지 않으며(3.2.2.1), 실라버스가 든 이유는 타깃 하드웨어의 영향이다."],"trap":"호스트 PC에서 코드 실행 시간을 재면 성능도 확인된다고 생각하기 쉽다. 실라버스 3.2.2.2는 수행 효율성·신뢰도 테스트가 SiL에서 흔하지 않고, 이 품질 특성은 주로 타깃 하드웨어의 영향을 받는다고 한다.","ref":"3.2.2.2","hard":true},{"id":"h3-014","ch":3,"lo":"AuT-3.2.3.1","k":1,"q":"도어 ECU용 HiL(hardware-in-the-loop) 테스트 환경을 꾸린다. 필요한 기능 1~4와 실라버스 3.2.3.1의 HiL 구성 요소 A~E를 바르게 짝지은 것은?\n1. 공급 전압을 여러 값으로 바꿔 ECU에 공급한다.\n2. 실제 도어 락 액추에이터를 환경 모델로 만들지 않고 그대로 연결해 쓴다.\n3. 와이어링 하네스에 추가 접근 인터페이스를 두어 신호선을 측정한다.\n4. 아직 없는 다른 ECU처럼, 존재하지 않는 버스 참여자를 시뮬레이션한다.\nA. breakout box\nB. remaining bus\nC. 전원 공급 장치(power supply)\nD. 실제 부품(real parts)\nE. FIU(fault insertion unit)","opts":["1-C, 2-D, 3-A, 4-B","1-C, 2-B, 3-A, 4-D","1-C, 2-D, 3-E, 4-B","1-E, 2-D, 3-A, 4-B"],"ans":[0],"exp":"3.2.3.1의 HiL 구성 요소: 여러 공급 전압을 설정하는 전원 공급 장치, 환경 모델을 실행하는 real-time capable computer, 환경 모델에 구현되지 않은 여러 실제 부품, 신호 종류·진폭을 다루는 signal processing unit, 단선·단락을 시뮬레이션하는 FIU, 와이어링 하네스의 추가 접근 인터페이스인 breakout box, 존재하지 않는 버스 참여자를 시뮬레이션하는 remaining bus.\n함정 포인트: 하네스를 다루는 장비라서 3번을 FIU와 잇기 쉽지만, 측정용 추가 접근 인터페이스는 breakout box다.\n(v2.1 기준 이름. 2018년판은 remaining bus를 'remaining bus simulation', signal processing unit을 'signal processing'이라고 불렀다.)","why":["정답. 전원 공급 장치는 여러 공급 전압 설정, 실제 부품은 환경 모델에 구현되지 않은 부분, breakout box는 하네스의 추가 접근 인터페이스, remaining bus는 존재하지 않는 버스 참여자 시뮬레이션이다(3.2.3.1).","2와 4가 바뀌었다. remaining bus는 존재하지 않는 버스 참여자를 시뮬레이션하고, 환경 모델에 없는 실제 장치는 실제 부품이다.","3이 틀렸다. FIU는 단선·단락 시뮬레이션용이고, 하네스의 추가 접근 인터페이스는 breakout box다.","1이 틀렸다. 여러 공급 전압 설정은 전원 공급 장치가 한다. FIU는 단선·단락 시뮬레이션용이다."],"trap":"하네스에 연결하는 장비는 모두 결함 주입용이라고 생각해 FIU를 고르기 쉽다. 3.2.3.1에서 FIU는 단선·단락 시뮬레이션용이고, 하네스에 추가 접근 인터페이스를 주는 것은 breakout box다.","ref":"3.2.3.1","hard":true},{"id":"h3-015","ch":3,"lo":"AuT-3.2.3.2","k":2,"q":"엔진 ECU와 변속기 ECU를 대상으로 HiL 테스트를 계획한다. 계획한 작업은 다음 세 가지다.\n(가) 변속기 ECU 하나만 연결해 변속 기능이 올바른지 테스트한다.\n(나) 두 ECU를 함께 연결해 둘 사이에 오가는 토크 요청 데이터 교환을 테스트한다.\n(다) 변속 오류가 나는 순간 실행을 일시 정지하고 신호를 자세히 분석한다.\n실라버스 3.2.3.2에 따른 판단으로 옳은 것은?","opts":["(가)와 (나) 모두 component HiL에 해당하고, (다)는 HiL에서 할 수 없다.","(가)는 component HiL, (나)는 system HiL에 해당하고, (다)는 real-time capable computer가 있어 할 수 있다.","(가)는 component HiL, (나)는 system HiL에 해당하고, (다)는 HiL에서 할 수 없다.","(가)는 system HiL, (나)는 component HiL에 해당하고, (다)는 HiL에서 할 수 없다."],"ans":[2],"exp":"3.2.3.2: 테스트 대상이 ECU 하나면 component HiL이고 ECU의 기능을 테스트한다. 여러 ECU의 조합이면 system HiL이고 ECU 사이 데이터 교환과 시스템 테스팅에 초점을 둔다. HiL은 소프트웨어가 실제 하드웨어에서 돌기 때문에 시뮬레이션 시간이 항상 실시간으로 흐르고, 일시 정지나 중단을 할 수 없다.\n함정 포인트: MiL·SiL처럼 원하는 순간에 멈춰 분석할 수 있다고 생각하면 (다)를 가능하다고 고르게 된다.","why":["(나)는 두 ECU의 조합이 테스트 대상이고 초점이 ECU 사이 데이터 교환이므로 system HiL이다.","HiL에서는 일시 정지나 중단을 할 수 없다. real-time capable computer는 정해진 시간 안에 관련 신호를 수집·제공하려고 둔다(3.2.3.2).","정답. 단일 ECU는 component HiL, 여러 ECU 조합과 그 사이 데이터 교환은 system HiL이며, HiL은 실시간으로 흘러 일시 정지할 수 없다(3.2.3.2).","(가)는 단일 ECU라 component HiL, (나)는 여러 ECU 조합이라 system HiL이다. 둘이 바뀌었다."],"trap":"SW 테스트 감각으로는 디버거로 멈추듯 HiL도 원하는 순간에 멈출 수 있다고 생각하기 쉽다. 3.2.3.2는 HiL에서 소프트웨어가 실제 하드웨어에서 돌아 항상 실시간으로 흐르며, 일시 정지나 중단이 불가능하다고 한다.","ref":"3.2.3.2","hard":true},{"id":"h3-016","ch":3,"lo":"AuT-3.2.3.2","k":2,"q":"HiL 테스트 환경의 적용 영역과 경계 조건에 대한 진술 i~v 가운데 실라버스 3.2.3.2와 맞는 것만 모두 고른 것은?\ni. HiL의 access point는 다양하며, 잘못된 access point를 쓰면 테스트 결과가 쓸모없어질 수 있다.\nii. HiL은 여러 구성 요소 때문에 MiL·SiL보다 복잡하며, 테스터는 이 복잡성을 다룰 수 있어야 한다.\niii. HiL은 시스템 테스팅 전용이고, 컴포넌트 테스팅과 통합 테스팅은 MiL·SiL에서 한다.\niv. HiL 테스트 환경으로 여러 테스트 레벨을 분석할 수 있다.\nv. HiL의 시뮬레이션 시간은 테스트 대상이 단일 ECU인 component HiL에서만 실시간으로 흐른다.","opts":["i, ii, iii","i, ii, iv","ii, iv, v","i, iii, iv"],"ans":[1],"exp":"3.2.3.2: HiL의 access point는 다양하고 잘못 쓰면 테스트 결과가 쓸모없어질 수 있다(i). HiL은 여러 구성 요소 때문에 MiL·SiL보다 복잡하고, 테스터가 이 복잡성을 다뤄야 한다(ii). HiL은 컴포넌트·통합·시스템 테스팅에 쓸 수 있고(iii 틀림), 여러 테스트 레벨을 분석할 수 있다(iv). 시뮬레이션 시간은 항상 실시간으로 흐른다(v 틀림).\n함정 포인트: V-모델 배치(3.2.4.3)에서 HiL이 시스템 테스팅 자리에 있어 iii을 맞다고 고르기 쉽다.","why":["iii 틀림. HiL은 컴포넌트·통합·시스템 테스팅에 쓸 수 있다(3.2.3.2). 맞는 iv도 빠졌다.","정답. i, ii, iv가 3.2.3.2와 맞다.","v 틀림. HiL의 시뮬레이션 시간은 component HiL이든 system HiL이든 항상 실시간으로 흐른다. 맞는 i도 빠졌다.","iii 틀림. 맞는 ii도 빠졌다."],"trap":"V-모델 배치(3.2.4.3)에서 HiL이 시스템 테스팅에 놓여 있어 HiL을 시스템 테스팅 전용으로 기억하기 쉽다. 3.2.3.2는 HiL을 컴포넌트·통합·시스템 테스팅에 쓸 수 있다고 한다.","ref":"3.2.3.2","hard":true},{"id":"h3-017","ch":3,"lo":"AuT-3.2.3.2","k":2,"q":"화이트박스 테스트 팀장이 HiL 도입 회의에서 이렇게 말했다.\n\"소프트웨어 결함은 SiL까지 다 잡으니까, HiL 테스트의 목적은 하드웨어의 비기능 결함을 찾는 것뿐입니다.\"\n실라버스 3.2.3.2에 비추어 가장 적절한 판단은?","opts":["HiL은 실제 하드웨어를 쓰는 환경이므로, 하드웨어의 비기능 결함만 찾는다는 이 말은 실라버스와 맞다.","HiL은 기능 결함만 찾고 비기능 결함은 찾지 않으므로, 목적을 하드웨어의 기능 결함 발견으로 바꿔야 한다.","HiL의 목적은 소프트웨어 결함 발견이고, 하드웨어 결함은 FIU가 찾아 주므로 HiL 테스트의 목적이 아니다.","HiL의 목적에는 소프트웨어와 하드웨어의 기능·비기능 결함 발견이 들어가므로, 이 말은 실라버스와 맞지 않는다."],"ans":[3],"exp":"3.2.3.2: HiL 테스트 환경은 컴포넌트·통합·시스템 테스팅에 쓸 수 있고, 그 목적에는 소프트웨어와 하드웨어의 기능·비기능 결함을 찾는 것이 들어간다. 표 4 아래 설명(3.2.4.2)도 HiL을 기술적인 하드웨어/소프트웨어 결함 발견에 쓴다고 한다.\n함정 포인트: '실제 하드웨어를 쓰니 하드웨어 확인용'이라는 감각 때문에 하드웨어 결함만 찾는다는 보기가 끌린다.","why":["3.2.3.2는 HiL의 목적에 소프트웨어 결함과 기능 결함도 넣는다.","3.2.3.2는 HiL에서 기능 결함과 비기능 결함을 모두 찾는다고 한다.","FIU는 단선·단락을 시뮬레이션하는 구성 요소다(3.2.3.1). HiL의 목적에는 하드웨어 결함 발견도 들어간다(3.2.3.2).","정답. 3.2.3.2: HiL의 목적에는 소프트웨어와 하드웨어의 기능·비기능 결함을 찾는 것이 들어간다."],"trap":"컴포넌트 테스팅과 SiL 단계에서 소프트웨어 결함을 다 걸러 냈다고 보고 HiL을 하드웨어 확인 단계로만 여기기 쉽다. 3.2.3.2는 HiL의 목적에 소프트웨어와 하드웨어의 기능·비기능 결함 발견이 들어간다고 한다.","ref":"3.2.3.2","hard":true},{"id":"h3-018","ch":3,"lo":"AuT-3.2.4.1","k":2,"q":"실라버스 표 3을 바탕으로 MiL → SiL → HiL 순서로 갈 때의 변화를 요약한 진술 i~v 가운데 맞는 것만 모두 고른 것은?\ni. 현실과의 근접성(closeness to reality)은 높아진다.\nii. 테스트 대상에 대한 접근(access to the test object)은 낮아진다.\niii. 디버깅 시간과 노력(time and effort in debugging)은 줄어든다.\niv. 테스트 베이시스(명세)에 필요한 상세 수준은 높아진다.\nv. 테스트 준비 노력은 MiL과 SiL의 설명 문장이 같으므로 impact도 둘 다 Low다.","opts":["i, ii, iv","i, iii, iv","ii, iv, v","i, ii, v"],"ans":[0],"exp":"표 3(3.2.4.1)의 impact: 현실과의 근접성 MiL Low → SiL Low to medium → HiL High(i 맞음). 테스트 대상에 대한 접근 High → Medium → Low(ii 맞음). 디버깅 시간과 노력 Low(모델 조정) → Medium(소프트웨어 조정) → High(시스템 조정)(iii 틀림). 테스트 베이시스에 필요한 상세 수준 Medium → Medium to high → High(iv 맞음). 테스트 준비 노력은 MiL과 SiL 모두 '환경을 빨리 구성할 수 있다'로 설명되지만 impact는 Low와 Medium으로 다르다(v 틀림).\n함정 포인트: v는 설명 문장이 정말 같아서 impact도 같다고 넘겨짚기 쉽다.","why":["정답. i, ii, iv가 표 3과 맞다.","iii 틀림. 디버깅 시간과 노력은 MiL Low, SiL Medium, HiL High로 커진다. 맞는 ii도 빠졌다.","v 틀림. 테스트 준비 노력의 설명 문장은 MiL·SiL이 같지만 impact는 MiL Low, SiL Medium이다. 맞는 i도 빠졌다.","v 틀림. 맞는 iv도 빠졌다."],"trap":"결함을 실제 하드웨어에서 재현하면 원인도 더 빨리 찾는다고 생각하기 쉽다. 표 3에서 디버깅 시간과 노력은 MiL Low(모델 조정), SiL Medium(소프트웨어 조정), HiL High(시스템 조정)로 커진다.","ref":"3.2.4.1","hard":true},{"id":"h3-019","ch":3,"lo":"AuT-3.2.4.1","k":2,"q":"실라버스 표 3의 설명 1~4가 각각 어느 테스트 환경의 설명인지 바르게 짝지은 것은?\n1. [디버깅 시간과 노력] 프로그래밍된 소프트웨어에서 결함이 발견되어 소프트웨어 조정이 필요하다.\n2. [구현·유지보수 노력] 환경 모델을 만들고 하드웨어 컴포넌트를 배선한다.\n3. [현실과의 근접성] 컴파일된 실제 소프트웨어를 하드웨어 없이 실행할 수 있다.\n4. [테스트 대상에 필요한 성숙도] 시스템 모델을 시뮬레이션한다.","opts":["1-SiL, 2-HiL, 3-MiL, 4-MiL","1-MiL, 2-HiL, 3-SiL, 4-SiL","1-SiL, 2-HiL, 3-SiL, 4-MiL","1-SiL, 2-SiL, 3-SiL, 4-MiL"],"ans":[2],"exp":"표 3(3.2.4.1): 디버깅 시간과 노력은 MiL 모델 조정(Low), SiL 소프트웨어 조정(Medium), HiL 시스템 조정(High). 구현·유지보수 노력은 MiL 환경 모델 생성(Low), SiL 환경 모델과 래퍼 생성(Medium), HiL 환경 모델 생성과 하드웨어 컴포넌트 배선(High). 현실과의 근접성은 MiL 현실을 시뮬레이션하고 구조·로직에 초점(Low), SiL 컴파일된 실제 소프트웨어를 하드웨어 없이 실행(Low to medium), HiL 실행 가능한 통합 시스템(High). 필요한 성숙도는 MiL 시스템 모델 시뮬레이션(Low), SiL 타깃 소프트웨어로 초기 기능 테스트(Medium), HiL 실행 가능한 ECU나 부분 시스템을 최대한 전체로 테스트(High).\n함정 포인트: 2번의 '환경 모델을 만든다'만 보고 SiL로 잇기 쉽지만, 하드웨어 배선이 붙으면 HiL이다.","why":["3이 틀렸다. 컴파일된 실제 소프트웨어를 하드웨어 없이 실행하는 것은 SiL의 현실 근접성 설명이다. MiL은 현실을 시뮬레이션하며 많은 특성을 추상화한다.","1과 4가 틀렸다. 소프트웨어 조정은 SiL, 시스템 모델 시뮬레이션은 MiL이다. MiL에서 찾은 결함은 모델 조정이 필요하다.","정답. 소프트웨어 조정(SiL, Medium), 환경 모델 생성과 하드웨어 배선(HiL, High), 하드웨어 없이 컴파일된 실제 소프트웨어 실행(SiL, Low to medium), 시스템 모델 시뮬레이션(MiL, Low)이다.","2가 틀렸다. SiL의 구현·유지보수 노력은 환경 모델과 래퍼를 만드는 것이고, 하드웨어 컴포넌트 배선은 HiL이다."],"trap":"실제 하드웨어를 쓰면 환경 모델은 필요 없다고 생각하기 쉽다. 표 3에서 HiL의 구현·유지보수 노력은 '환경 모델을 만들고 하드웨어 컴포넌트를 배선'하는 것이고, HiL 구성 요소에도 환경 모델을 실행하는 real-time capable computer가 있다(3.2.3.1).","ref":"3.2.4.1","hard":true},{"id":"h3-020","ch":3,"lo":"AuT-3.2.4.1","k":2,"q":"실라버스 표 3의 기준으로 볼 때 SiL 테스트 환경의 장점과 단점을 바르게 짝지은 것은?","opts":["장점: 모델의 모든 신호를 관찰·제어할 수 있다 / 단점: 환경 모델과 래퍼를 만들어야 해서 구현·유지보수 노력이 Medium이다","장점: 실행 가능한 통합 시스템이라 현실 근접성이 High다 / 단점: 하드웨어나 통신 프로토콜로 제공되는 신호만 다룰 수 있다","장점: 불완전한 명세로도 테스트할 수 있어 필요한 명세 상세 수준이 가장 낮다 / 단점: 디버깅 노력이 HiL보다 크다","장점: 컴파일된 실제 소프트웨어를 하드웨어 없이 실행해 MiL보다 현실에 가깝다 / 단점: 래퍼에 있는 신호만 다룰 수 있다"],"ans":[3],"exp":"표 3(3.2.4.1)에서 SiL은 현실과의 근접성이 Low to medium(컴파일된 실제 소프트웨어를 하드웨어 없이 실행)으로 MiL(Low)보다 높다. 대신 테스트 대상에 대한 접근은 Medium으로, 래퍼에 있는 신호만 관찰·제어할 수 있어 모든 신호를 다루는 MiL(High)보다 낮다.\n함정 포인트: 단점 절반이 맞는 보기(구현·유지보수 Medium)가 있어 장점 쪽을 꼼꼼히 보지 않으면 고르게 된다.","why":["단점 부분은 맞지만 '모델의 모든 신호 관찰·제어'는 MiL의 접근성(High) 설명이다.","장점과 단점 모두 HiL 설명이다(현실 근접성 High, 접근성 Low).","필요한 명세 상세 수준은 SiL이 Medium to high로 MiL(Medium)보다 높다. 디버깅 노력도 SiL(Medium)이 HiL(High)보다 작다.","정답. 표 3: SiL의 현실 근접성은 Low to medium으로 MiL(Low)보다 높고, 테스트 대상 접근은 래퍼에 있는 신호만 다루는 Medium이다."],"trap":"화이트박스 테스터는 SiL에서 소스 코드의 모든 변수를 볼 수 있다고 생각하기 쉽다. 표 3에서 모든 신호를 관찰·제어할 수 있는 것은 MiL이고, SiL은 래퍼에 있는 신호만 다룬다.","ref":"3.2.4.1","hard":true},{"id":"h3-021","ch":3,"lo":"AuT-3.2.4.2","k":3,"q":"모델에서 코드를 생성하는 ECU 소프트웨어 프로젝트다. 테스트 환경은 MiL(1개월 차), SiL(4개월 차), HiL(9개월 차) 순서로 준비된다. 테스트 관리자는 다음 규칙으로 세 작업을 배정한다.\n규칙: 작업 2는 표 4의 테스트 목적 행으로 판단해 + recommended인 환경을, 작업 1과 3은 실라버스 3장 본문이 그 작업을 할 수 있다고 명시한 환경을 후보로 삼고, 후보 가운데 가장 먼저 준비되는 환경에 배정한다.\n작업 1. 모델(주로 부동소수점)과 생성·컴파일한 코드(주로 고정소수점)의 데이터 타입 차이 때문에 생긴 동작 차이를 확인한다.\n작업 2. 결함이 defect memory에 올바르게 기록되는지 등 진단 기능을 테스트한다.\n작업 3. 센서 신호선(와이어링 하네스)의 단선을 시뮬레이션해 ECU의 반응을 확인한다.\n작업 1~3의 배정으로 옳은 것은?\n표 4 범례(원문): + recommended, o possible, - not sensible. 기호는 범례에 맞춰 소문자 o로 적었다(원문 표 4의 MiL·SiL 일부 칸은 대문자 O로 인쇄되어 있다).","table":{"head":["테스트 목적(test objective)","설명(예)","MiL","SiL","HiL"],"rows":[["고객 요구사항 테스트","요구 기능을 올바르게 제공한다. 입력의 올바른 처리, 입력에 대한 올바른 반응, 출구 지점의 올바른 데이터 출력을 포함한다.","o","o","+"],["결함 탐지·처리 메커니즘 테스트","랜덤 하드웨어 결함의 탐지·처리, 소프트웨어 결함의 탐지·처리, 결함 탐지 후 안전 상태로 전환(예: 시스템 비활성화)","+","+","+"],["구성 데이터(configuration data)에 대한 반응 테스트","구성 데이터가 테스트 대상의 동작에 주는 영향 확인","o","+","+"],["진단 기능 테스트","결함 탐지, 결함 활성화와 리셋 요구, defect memory의 결함 활성화(예: OBD 또는 정비소) 등 요구된 진단 기능을 올바르게 제공한다.","-","+","+"],["인터페이스 상호작용 테스트","테스트 대상의 내부·외부 인터페이스 확인","o","+","+"],["유용성(usability) 입증","테스트 대상이 사용자의 유용성 요구사항을 만족해야 한다.","-","o","+"]]},"opts":["작업 1: MiL / 작업 2: SiL / 작업 3: HiL","작업 1: SiL / 작업 2: SiL / 작업 3: HiL","작업 1: SiL / 작업 2: HiL / 작업 3: HiL","작업 1: SiL / 작업 2: SiL / 작업 3: SiL"],"ans":[1],"exp":"풀이\n① 작업 1: 3.2.2.2는 모델과 컴파일된 코드의 데이터 타입·메모리 공간 차이로 생긴 이상을 SiL에서 처음 테스트할 수 있다고 한다. 3장이 명시한 가장 이른 환경은 SiL이다(3.2.1.1: MiL의 테스트 대상은 특수 하드웨어용으로 컴파일되지 않은 모델이다).\n② 작업 2: 표 4 '진단 기능 테스트' 행은 MiL -, SiL +, HiL +다. +인 환경 가운데 먼저 준비되는 것은 SiL(4개월 차)이다.\n③ 작업 3: 3.2.3.1에서 단선·단락을 시뮬레이션하는 FIU는 HiL 구성 요소다. 3.2.1.2는 MiL 환경 모델로 단선·단락 같은 물리적 동작을 시뮬레이션하는 것이 흔하지 않다고 한다. SiL을 다루는 3.2.2에는 단선 시뮬레이션 수단이 나오지 않는다. 그래서 3장이 이 작업의 수단을 명시한 환경은 HiL뿐이다. (참고: 4.2.3은 외부·인터페이스 관련 결함은 보통 HiL에서 FIU로, 인터페이스·내부 결함 같은 소프트웨어 기반 결함은 흔히 SiL이나 개발 환경에서 시뮬레이션한다고 한다. 이 문제의 규칙은 3장 본문만 후보로 삼는다.)\n④ 결과: SiL / SiL / HiL.\n검산 1: 작업 2를 HiL로 보내면 SiL도 +라는 점을 놓친 것이고, 작업 1을 MiL로 보내면 '처음 테스트할 수 있는 곳은 SiL'이라는 3.2.2.2와 어긋난다.\n검산 2: 작업 3을 SiL로 보내려면 3장에 SiL의 단선 시뮬레이션 수단이 있어야 하는데 없다. 세 작업 모두 다른 배정은 규칙을 만족하지 않으므로 답은 하나다.\n함정 포인트: 진단은 실제 ECU 통신이 있어야 의미 있다는 감각 때문에 작업 2를 HiL로 미루는 보기가 끌린다.\n표 4의 기호 값은 2018년판과 같다.","why":["작업 1이 틀렸다. 모델과 컴파일된 코드의 데이터 타입 차이는 SiL에서 처음 테스트할 수 있다(3.2.2.2).","정답. 작업 1은 SiL에서 처음 테스트할 수 있고(3.2.2.2), 작업 2는 표 4에서 SiL부터 +이며, 작업 3의 단선 시뮬레이션 수단(FIU)은 HiL 구성 요소다(3.2.3.1).","작업 2가 틀렸다. 표 4에서 진단 기능 테스트는 SiL도 +이고, SiL이 HiL보다 먼저 준비된다.","작업 3이 틀렸다. 3장에서 단선 시뮬레이션 수단(FIU)을 둔 환경은 HiL이다(3.2.3.1). SiL을 다루는 3.2.2에는 단선 시뮬레이션 수단이 나오지 않는다."],"trap":"진단 기능은 실제 ECU와 진단 통신이 있어야 테스트할 수 있다고 생각해 HiL로 미루기 쉽다. 표 4는 진단 기능 테스트를 SiL에서도 +(recommended)로 둔다.","ref":"3.2.4.2","hard":true},{"id":"h3-022","ch":3,"lo":"AuT-3.2.4.2","k":3,"q":"테스터가 ECU 소프트웨어 내부 컴포넌트 사이의 인터페이스 상호작용을 테스트하려 한다. 확인해야 할 내부 신호는 래퍼에는 노출되어 있지만, ECU 핀이나 통신 프로토콜로는 나오지 않는다. 테스트 관리자는 표 3과 표 4를 함께 적용해 두 조건을 모두 만족하는 환경에 배정하라고 했다.\n조건 1: 표 4에서 이 테스트 목적이 + recommended인 환경\n조건 2: 표 3의 '테스트 대상에 대한 접근' 기준으로 그 신호를 관찰·제어할 수 있는 환경\n배정할 환경은?\n표 4 범례(원문): + recommended, o possible, - not sensible. 표 3에는 범례가 없다(원문 표 3은 기준마다 세 줄이고, 줄마다 MiL·SiL·HiL 가운데 한 칸만 +, 나머지 두 칸은 o다). 기호는 범례에 맞춰 소문자 o로 적었다(원문 표 4의 MiL·SiL 일부 칸은 대문자 O로 인쇄되어 있다).","table":{"head":["출처","기준·테스트 목적","설명","Impact","MiL","SiL","HiL"],"rows":[["표 4","인터페이스 상호작용 테스트","테스트 대상의 내부·외부 인터페이스 확인","(표 4에는 없음)","o","+","+"],["표 3","테스트 대상에 대한 접근(access to the test object)","모델의 모든 신호를 관찰·제어할 수 있다.","High","+","o","o"],["표 3","테스트 대상에 대한 접근","래퍼에 있는 신호만 관찰·제어할 수 있다.","Medium","o","+","o"],["표 3","테스트 대상에 대한 접근","하드웨어나 통신 프로토콜로 제공되는 신호만 관찰·제어할 수 있다.","Low","o","o","+"]]},"opts":["SiL만","HiL만","MiL만","SiL과 HiL"],"ans":[0],"exp":"풀이\n① 조건 1(표 4 '인터페이스 상호작용 테스트' 행): MiL o, SiL +, HiL +. 후보는 SiL, HiL.\n② 조건 2(표 3 '테스트 대상에 대한 접근'): MiL은 모델의 모든 신호, SiL은 래퍼에 있는 신호만, HiL은 하드웨어나 통신 프로토콜로 제공되는 신호만 관찰·제어할 수 있다. 신호가 래퍼에는 있고 ECU 핀·통신 프로토콜에는 없으므로 후보 중 SiL만 만족한다.\n③ 두 조건을 모두 만족하는 환경은 SiL이다.\n검산 1: 조건 1만 보면 SiL과 HiL이, 조건 2만 보면 MiL과 SiL이 남는다. 교집합은 SiL 하나다.\n검산 2: 3.2.4.2는 표 3과 표 4의 기준을 결합해 최적의 테스트 환경을 고른다고 한다. 한 표만 쓰면 MiL이나 HiL이 남아 답이 갈린다.\n함정 포인트: 실제 ECU가 붙은 HiL이면 무엇이든 측정할 수 있다는 감각 때문에 HiL을 고르기 쉽다.\n원문 표 4의 MiL 칸은 대문자 O로 인쇄되어 있다. 이 문제는 +인지 아닌지만 따지므로 대문자 O를 어떻게 읽든 답이 같다.","why":["정답. 표 4에서 +이고(조건 1), 래퍼에 있는 신호를 관찰·제어할 수 있다(조건 2).","조건 1은 만족하지만, 표 3에서 HiL은 하드웨어나 통신 프로토콜로 제공되는 신호만 관찰·제어할 수 있어 조건 2를 만족하지 못한다.","표 3에서 MiL은 모델의 모든 신호에 접근할 수 있지만, 표 4 인터페이스 상호작용 테스트 행의 MiL 칸이 +가 아니라 조건 1을 만족하지 못한다.","HiL이 조건 2를 만족하지 못하므로 둘 다는 아니다."],"trap":"실제 ECU와 breakout box가 있으면 내부 신호까지 다 볼 수 있다고 생각해 HiL을 고르기 쉽다. 표 3에서 HiL은 하드웨어나 통신 프로토콜로 제공되는 신호만 관찰·제어할 수 있어 접근성이 Low다.","ref":"3.2.4.2","hard":true},{"id":"h3-023","ch":3,"lo":"AuT-3.2.4.2","k":3,"q":"이번 릴리스 주기에는 HiL 테스트 벤치를 쓸 수 없고 MiL과 SiL 테스트 환경만 있다. 테스트 관리자는 표 4에서 + recommended인 환경에만 테스트 목적을 배정하기로 했다. 이 주기에 배정할 수 없는 테스트 목적을 두 개 고르시오.\n표 4 범례(원문): + recommended, o possible, - not sensible. 기호는 범례에 맞춰 소문자 o로 적었다(원문 표 4의 MiL·SiL 일부 칸은 대문자 O로 인쇄되어 있다).","table":{"head":["테스트 목적(test objective)","설명(예)","MiL","SiL","HiL"],"rows":[["고객 요구사항 테스트","요구 기능을 올바르게 제공한다. 입력의 올바른 처리, 입력에 대한 올바른 반응, 출구 지점의 올바른 데이터 출력을 포함한다.","o","o","+"],["결함 탐지·처리 메커니즘 테스트","랜덤 하드웨어 결함의 탐지·처리, 소프트웨어 결함의 탐지·처리, 결함 탐지 후 안전 상태로 전환(예: 시스템 비활성화)","+","+","+"],["구성 데이터(configuration data)에 대한 반응 테스트","구성 데이터가 테스트 대상의 동작에 주는 영향 확인","o","+","+"],["진단 기능 테스트","결함 탐지, 결함 활성화와 리셋 요구, defect memory의 결함 활성화(예: OBD 또는 정비소) 등 요구된 진단 기능을 올바르게 제공한다.","-","+","+"],["인터페이스 상호작용 테스트","테스트 대상의 내부·외부 인터페이스 확인","o","+","+"],["유용성(usability) 입증","테스트 대상이 사용자의 유용성 요구사항을 만족해야 한다.","-","o","+"]]},"opts":["진단 기능 테스트","고객 요구사항 테스트","구성 데이터에 대한 반응 테스트","인터페이스 상호작용 테스트","유용성(usability) 입증"],"ans":[1,4],"exp":"풀이(표 4)\n① 각 행에서 MiL·SiL 칸에 +가 있는지 본다.\n② 고객 요구사항 o/o → 없음. 결함 탐지·처리 +/+ → 있음. 구성 데이터 o/+ → 있음. 진단 기능 -/+ → 있음. 인터페이스 상호작용 o/+ → 있음. 유용성 입증 -/o → 없음.\n③ 배정할 수 없는 것은 고객 요구사항 테스트와 유용성 입증이다. 두 행 모두 +는 HiL에만 있다.\n검산 1: HiL 열은 여섯 행 모두 +이고, MiL·SiL 둘 다 +가 아닌 행은 정확히 두 개다.\n검산 2: 진단 기능 테스트는 MiL이 -라서 눈에 띄지만 SiL이 +라서 이 주기에 배정할 수 있다.\n함정 포인트: 고객 요구사항 확인은 기능 테스트라 SiL로 충분하다고 생각하기 쉽지만, 표 4에서 SiL은 +가 아니다.\n원문 표 4의 o 칸은 대문자 O로 인쇄되어 있다. 이 문제는 +인지 아닌지만 따지므로 답에 영향이 없다. 표 4의 기호 값은 2018년판과 같다.","why":["진단 기능 테스트는 MiL이 -지만 SiL이 +라서 SiL에 배정할 수 있다.","정답. 고객 요구사항 테스트는 MiL·SiL 칸이 o이고 +는 HiL뿐이다.","구성 데이터에 대한 반응 테스트는 SiL이 +라서 배정할 수 있다.","인터페이스 상호작용 테스트는 SiL이 +라서 배정할 수 있다.","정답. 유용성 입증은 MiL -, SiL o이고 +는 HiL뿐이다."],"trap":"고객 요구사항의 기능 확인은 SiL에서 충분히 할 수 있다고 생각하기 쉽다. 표 4에서 고객 요구사항 테스트가 +(recommended)인 환경은 HiL뿐이다.","ref":"3.2.4.2","hard":true},{"id":"h3-024","ch":3,"lo":"AuT-3.2.4.2","k":3,"q":"테스트 관리자가 표 3과 표 4를 함께 써서 테스트 목적 네 개를 배정한다.\n규칙: 표 4에서 + recommended인 환경 가운데, 표 3의 구현·유지보수 노력(effort for implementation and maintenance) impact가 가장 낮은 환경에 배정한다.\n(가) 결함 탐지·처리 메커니즘 테스트\n(나) 인터페이스 상호작용 테스트\n(다) 유용성 입증\n(라) 구성 데이터에 대한 반응 테스트\n배정 결과로 옳은 것은?\n표 4 범례(원문): + recommended, o possible, - not sensible. 표 3에는 범례가 없다(원문 표 3은 기준마다 세 줄이고, 줄마다 MiL·SiL·HiL 가운데 한 칸만 +, 나머지 두 칸은 o다). 기호는 범례에 맞춰 소문자 o로 적었다(원문 표 4의 MiL·SiL 일부 칸은 대문자 O로 인쇄되어 있다).","table":{"head":["출처","기준·테스트 목적","설명","Impact","MiL","SiL","HiL"],"rows":[["표 4","결함 탐지·처리 메커니즘 테스트","랜덤 하드웨어 결함의 탐지·처리, 소프트웨어 결함의 탐지·처리, 결함 탐지 후 안전 상태로 전환(예: 시스템 비활성화)","(표 4에는 없음)","+","+","+"],["표 4","인터페이스 상호작용 테스트","테스트 대상의 내부·외부 인터페이스 확인","(표 4에는 없음)","o","+","+"],["표 4","유용성(usability) 입증","테스트 대상이 사용자의 유용성 요구사항을 만족해야 한다.","(표 4에는 없음)","-","o","+"],["표 4","구성 데이터(configuration data)에 대한 반응 테스트","구성 데이터가 테스트 대상의 동작에 주는 영향 확인","(표 4에는 없음)","o","+","+"],["표 3","구현·유지보수 노력(effort for implementation and maintenance)","환경 모델을 만든다.","Low","+","o","o"],["표 3","구현·유지보수 노력","환경 모델과 래퍼를 만든다.","Medium","o","+","o"],["표 3","구현·유지보수 노력","환경 모델을 만들고 하드웨어 컴포넌트를 배선한다.","High","o","o","+"]]},"opts":["(가) MiL, (나) MiL, (다) HiL, (라) MiL","(가) HiL, (나) SiL, (다) HiL, (라) SiL","(가) MiL, (나) SiL, (다) SiL, (라) SiL","(가) MiL, (나) SiL, (다) HiL, (라) SiL"],"ans":[3],"exp":"풀이\n① 표 3 구현·유지보수 노력: MiL Low(환경 모델 생성), SiL Medium(환경 모델과 래퍼 생성), HiL High(환경 모델 생성과 하드웨어 배선). 낮은 순서는 MiL → SiL → HiL.\n② (가) 결함 탐지·처리: +/+/+ → 후보 셋 중 가장 낮은 MiL.\n③ (나) 인터페이스 상호작용: o/+/+ → 후보 SiL, HiL → SiL.\n④ (다) 유용성 입증: -/o/+ → 후보 HiL뿐 → HiL.\n⑤ (라) 구성 데이터: o/+/+ → 후보 SiL, HiL → SiL.\n검산 1: 각 행의 + 칸 수는 (가) 3개, (나) 2개, (다) 1개, (라) 2개다. 후보 안에서 MiL → SiL → HiL 순으로 첫 번째를 고르면 MiL, SiL, HiL, SiL이다.\n검산 2: (나)·(라)를 MiL로 둔 보기와 (다)를 SiL로 둔 보기는 o를 +로 읽었다. (가)를 HiL로 둔 보기는 '가장 낮은 노력' 조건을 어겼다.\n함정 포인트: (가)에 '랜덤 하드웨어 결함'이 들어 있어 실제 하드웨어가 있는 HiL로 보내기 쉽다.\n원문 표 4의 o 칸은 대문자 O로 인쇄되어 있다. 이 문제는 +인지 아닌지만 따지므로 답에 영향이 없다.","why":["(나)와 (라)의 MiL 칸은 +가 아니라 o라서 후보가 아니다.","(가)는 세 환경 모두 +이므로 구현·유지보수 노력이 가장 낮은 MiL을 골라야 한다.","(다) 유용성 입증의 SiL 칸은 +가 아니라 o다. +는 HiL뿐이다.","정답. + 후보 가운데 구현·유지보수 노력이 가장 낮은 환경을 고르면 MiL, SiL, HiL, SiL이다."],"trap":"'랜덤 하드웨어 결함의 탐지·처리'라는 설명 때문에 결함 처리 메커니즘은 실제 하드웨어가 있어야 테스트할 수 있다고 생각하기 쉽다. 표 4는 이 테스트 목적을 MiL·SiL·HiL 모두 +로 두고, 3.2.4.2는 이 행에서 여러 환경을 나눠 쓰는 접근이 특히 드러난다고 한다.","ref":"3.2.4.2","hard":true},{"id":"h3-025","ch":3,"lo":"AuT-3.2.4.3","k":1,"q":"테스트 환경을 테스트 레벨에 올바르게 배정하면 테스트 프로세스 전체를 세 측면(A~C)에서 최적화할 수 있다. 실라버스 3.2.4.3의 항목 1~4와 측면 A~C를 바르게 짝지은 것은?\n1. ISO 26262의 method table은 ASIL에 따라 테스트 환경을 권장한다.\n2. 테스트 레벨마다 알맞은 테스트 유형이 필요하다.\n3. 테스트 레벨별 장애 유형을 찾는다(예: HiL 환경의 시스템 레벨에서 수행 효율성).\n4. 테스트를 더 이르고 비용이 적은 가상 테스트 레벨로 옮긴다.\nA. 제품 리스크 최소화\nB. 테스트 비용 최소화\nC. 표준 적합성","opts":["1-C, 2-A, 3-A, 4-B","1-C, 2-B, 3-A, 4-B","1-C, 2-B, 3-B, 4-A","1-B, 2-B, 3-A, 4-C"],"ans":[1],"exp":"3.2.4.3: 테스트 환경을 테스트 레벨에 올바르게 배정하면 세 측면에서 테스트 프로세스를 최적화한다. 제품 리스크 최소화는 테스트 레벨별 장애 유형 찾기(예: HiL 환경의 시스템 레벨에서 수행 효율성)다. 테스트 비용 최소화는 테스트 레벨마다 알맞은 테스트 유형, 더 이르고 비용이 적은 가상 테스트 레벨로 테스트 옮기기다. 표준 적합성은 ISO 26262 method table이 ASIL에 따라 테스트 환경을 권장한다는 것이다.\n함정 포인트: 2번은 '알맞은 유형을 고른다'는 말이 리스크 대응처럼 들려 제품 리스크와 잇기 쉽다.\n(v2.1 기준. 2018년판은 2번을 '테스트 유형마다 알맞은 테스트 레벨이 필요하다'로, 3번 예시를 '시스템 레벨의 성능 테스트'로 적었다. 두 판 모두 2번은 테스트 비용 최소화 아래에 있다.)","why":["2는 제품 리스크가 아니라 테스트 비용 최소화 항목이다.","정답. 3은 제품 리스크 최소화, 2와 4는 테스트 비용 최소화, 1은 표준 적합성 항목이다(3.2.4.3).","3과 4가 바뀌었다. 테스트 레벨별 장애 유형 찾기는 제품 리스크, 이르고 싼 가상 테스트 레벨로 옮기기는 테스트 비용 쪽이다.","1과 4가 바뀌었다. ASIL에 따라 테스트 환경을 권장하는 method table은 표준 적합성 항목이고, 가상 테스트 레벨로 옮기기는 테스트 비용 쪽이다."],"ref":"3.2.4.3","hard":true},{"id":"h3-026","ch":3,"lo":"AuT-3.2.4.3","k":1,"q":"한 ECU 프로젝트의 V-모델 진행 상황이다.\n(가) V-모델 왼쪽의 설계를 모델로 표현했고, 모델과 테스트 환경을 계속 발전시키고 있다.\n(나) 테스트 대상의 단일 컴포넌트 몇 개를 프로그래밍하고 컴파일했다.\n(다) 테스트 대상의 특정 기능들이 완전히 개발되었다.\n실라버스 3.2.4.3의 XiL 배치에 맞는 설명은?","opts":["(가)는 MiL로 설계만 테스트할 수 있고, 컴포넌트 테스팅은 (나)에서 SiL이 준비되어야 비로소 시작할 수 있다.","(나)는 SiL로 시스템 테스팅을 하며, SiL의 대표 테스트들은 V-모델 왼쪽(설계 쪽)에 놓인다.","(가) MiL: 설계, 컴포넌트·통합 테스팅 / (나) SiL: 컴포넌트·통합 테스팅 / (다) HiL: 시스템 테스팅","(다)는 HiL을 쓰는데, 실라버스는 HiL을 시스템 테스팅에만 쓸 수 있는 환경으로 정해 둔다."],"ans":[2],"exp":"3.2.4.3: V-모델 왼쪽의 설계는 MiL로 테스트할 수 있고, 모델과 테스트 환경을 더 발전시키면 MiL로 컴포넌트 테스팅과 통합 테스팅도 실행할 수 있다. 단일 컴포넌트를 프로그래밍·컴파일하면 SiL을 쓰며, 대표 테스트인 컴포넌트·통합 테스팅은 V-모델 오른쪽에 있다. 특정 기능이 완전히 개발된 시스템 테스팅은 HiL로 실행할 수 있다.\n함정 포인트: 모델 단계는 설계 검증용이라는 감각 때문에 컴포넌트 테스팅을 SiL부터 시작한다는 보기가 끌린다.","why":["3.2.4.3: 모델과 테스트 환경을 더 발전시키면 MiL로도 컴포넌트 테스팅과 통합 테스팅을 실행할 수 있다.","3.2.4.3: SiL의 대표 테스트는 컴포넌트 테스팅과 통합 테스팅이고, V-모델 오른쪽에 있다.","정답. 3.2.4.3: 모델과 테스트 환경을 더 발전시키면 MiL로 컴포넌트·통합 테스팅도 할 수 있고, 단일 컴포넌트가 프로그래밍·컴파일되면 SiL, 특정 기능이 완전히 개발된 시스템 테스팅은 HiL로 한다.","3.2.4.3은 시스템 테스팅을 HiL로 실행할 수 있다고 할 뿐이다. 3.2.3.2는 HiL을 컴포넌트·통합·시스템 테스팅에 쓸 수 있다고 한다."],"trap":"모델은 설계 산출물이라 MiL로는 설계만 검증하고 컴포넌트 테스팅은 코드가 나와야 시작한다고 생각하기 쉽다. 3.2.4.3은 모델과 테스트 환경을 더 발전시키면 MiL로 컴포넌트·통합 테스팅도 할 수 있다고 한다.","ref":"3.2.4.3","hard":true},{"id":"h3-101","ch":3,"lo":"AuT-3.1.1","k":1,"q":"테스터가 ECU의 네트워크 통신 과부하 상황을 시험 차량에서 직접 만들지 않고, 테스트 환경에서 시뮬레이션하기로 했다.\n실라버스 3.1.1에 비추어 이 결정에 대한 판단으로 옳은 것은?","opts":["실라버스와 맞다. 테스트 환경은 실제 차량보다 현실적이어서 완성 제품의 결함을 더 잘 찾는다.","실라버스와 맞지 않는다. 통신 과부하 같은 상황은 실제 차량에서만 재현할 수 있다.","실라버스와 맞다. 통신 과부하는 실제 차량에서 재현하기 어렵고, 테스트 환경으로 시뮬레이션할 수 있다.","실라버스와 맞지 않는다. 테스트 환경은 ECU가 완전히 개발된 뒤에만 쓸 수 있다."],"ans":[2],"exp":"3.1.1: 여러 테스트 환경을 쓰면 실제 차량에서 재현하기 어려운 상황을 시뮬레이션할 수 있다. 실라버스가 든 예는 단락, 네트워크 통신 과부하, 와이어링 하네스(wiring harness)의 단락·단선이다. 그래서 통신 과부하를 테스트 환경에서 시뮬레이션하는 결정은 실라버스와 맞는다.","why":["근거가 틀렸다. 3.1.1은 완성 제품에서 나타날 결함을 찾으려면 현실적인 환경이 필요하다고 할 뿐, 테스트 환경이 실제 차량보다 현실적이라고 하지 않는다.","3.1.1은 통신 과부하를 실제 차량에서 재현하기 어려운 상황의 예로 들고, 테스트 환경으로 시뮬레이션할 수 있다고 한다.","정답. 3.1.1이 든 예(네트워크 통신 과부하)와 근거(실제 차량에서 재현하기 어려운 상황을 시뮬레이션)가 그대로다.","3.1.1은 알맞은 테스트 환경을 쓰면 ECU가 완전히 생산·개발되기 전에도 개별 테스트 작업을 구현하고 실행할 수 있다고 한다."],"ref":"3.1.1","hard":true},{"id":"h3-102","ch":3,"lo":"AuT-3.1.2","k":1,"q":"실라버스 3.1.2에 따르면 테스트 환경은 여러 access point를 제공한다.\naccess point에 대한 설명으로 옳은 것은?","opts":["테스터가 테스트 대상을 관찰·측정하고, 필요하면 테스트 대상에 영향을 주거나 제어할 수 있게 한다.","테스터가 테스트 대상을 관찰·측정할 수 있게 하지만, 테스트 대상을 제어하는 데는 쓰지 않는다.","ISO/IEC/IEEE 29119-1이 테스트 환경의 구성 요소로 나열한 다섯 부분 가운데 하나다.","연소 엔진·변속기·차량 센서나 운전자·도로 조건 같은 실제 세계의 측면을 표현한다."],"ans":[0],"exp":"3.1.2: 테스트 환경은 여러 access point도 제공한다. access point로 테스터는 테스트 대상을 관찰·측정하고, 필요할 때 테스트 대상에 영향을 주거나 제어할 수 있다.","why":["정답. 3.1.2의 access point 설명 그대로다.","3.1.2는 access point로 필요할 때 테스트 대상에 영향을 주거나 제어할 수도 있다고 한다.","29119-1에 따른 구성 요소 다섯은 하드웨어, 소프트웨어, 통신 설비, 도구, 실험실이다. access point는 이 목록에 없다(3.1.2).","실제 세계의 측면을 표현하는 것은 모델(환경 모델)이다(3.1.2)."],"ref":"3.1.2","hard":true},{"id":"h3-103","ch":3,"lo":"AuT-3.1.3","k":2,"q":"테스트 대상은 실내등 ECU다. 이 ECU는 도어 신호와 스위치 입력에 따라 상태가 바뀌는 상태 머신(state machine)처럼 동작한다.\n실라버스 3.1.3에 따라 고를 시스템 유형과 그 이유로 알맞은 것은?","opts":["closed-loop 시스템: 상태가 바뀌면 출력이 달라지므로, 환경 모델로 출력을 입력에 되먹여야 한다.","closed-loop 시스템: 실내·섀시 전장은 closed-loop 시스템을 쓰는 대표 예이기 때문이다.","open-loop 시스템: 환경 모델이 출력을 모아 입력에 간접적으로 넘기므로 피드백이 생기지 않는다.","open-loop 시스템: 상태 머신을 반영하는 테스트 대상이므로, 테스터가 테스트 절차에서 입력을 직접 정한다."],"ans":[3],"exp":"3.1.3.2: 테스트 대상이 reactive behavior를 보이거나 상태 머신을 반영하면 open-loop 시스템이 선호된다. open-loop 시스템에서는 테스트 대상의 입력을 테스터가 테스트 절차에서 직접 정한다. 실내·섀시 전장에는 open-loop 시스템의 예(조명, 스위치)가 많다.","why":["출력을 환경 모델로 입력에 되먹이는 것은 closed-loop 시스템이다(3.1.3.1). 상태 머신을 반영하는 테스트 대상에는 open-loop 시스템이 선호된다(3.1.3.2).","3.1.3.2는 실내·섀시 전장에 open-loop 시스템의 예(조명, 스위치)가 많다고 한다.","환경 모델이 출력을 모아 입력에 넘기는 것은 closed-loop 시스템의 설명이다(3.1.3.1). open-loop 시스템에는 피드백 루프가 없다(3.1.3.2).","정답. 상태 머신을 반영하므로 open-loop 시스템이 선호되고, 입력은 테스터가 테스트 절차에서 정한다(3.1.3.2)."],"trap":"상태가 바뀌면서 출력이 달라지니 피드백을 만들어야 한다고 보기 쉽다. 실라버스는 테스트 대상이 reactive behavior를 보이거나 상태 머신을 반영하면 open-loop 시스템이 선호된다고 한다(3.1.3.2).","ref":"3.1.3.2","hard":true},{"id":"h3-104","ch":3,"lo":"AuT-3.1.3","k":2,"q":"closed-loop 시스템과 open-loop 시스템의 적용에 대한 설명으로 실라버스 3.1.3과 맞는 것은?","opts":["제어기(controller)는 closed-loop 시스템으로만 테스트할 수 있고, open-loop 시스템은 쓸 수 없다.","open-loop와 closed-loop 가운데 어느 쪽을 적용할지는 테스트 대상의 동작에 크게 좌우된다.","테스트 대상의 출력이 입력에 영향을 주어 피드백이 생길 때 open-loop 시스템이 선호된다.","어느 쪽을 적용할지는 테스트 레벨로 정해지며, 시스템 테스팅에는 closed-loop 시스템을 쓴다."],"ans":[1],"exp":"3.1.3.2: open-loop 시스템과 closed-loop 시스템의 적용 사례는 테스트 대상의 동작에 크게 좌우된다(depends strongly on the test object behavior). closed-loop 시스템은 출력이 입력에 영향을 주어 피드백이 생기고, open-loop 시스템에는 이 피드백 메커니즘이 없다. 3.1.3.1은 제어기를 테스트할 때 closed-loop 시스템을 '더 자주' 쓴다고 한다.","why":["3.1.3.1은 제어기 테스트에 closed-loop 시스템을 '더 자주(more often)' 쓴다고 할 뿐, closed-loop로만 테스트할 수 있다고 하지 않는다.","정답. 3.1.3.2 문장 그대로다.","출력이 입력에 영향을 주어 피드백이 생기는 것은 closed-loop 시스템의 특징이다(3.1.3.2). open-loop 시스템에는 피드백이 없다.","3.1.3.2는 어느 쪽을 적용할지가 테스트 대상의 동작에 달려 있다고 한다. 테스트 레벨로 정한다는 내용은 없다."],"trap":"제어 기능이면 무조건 closed-loop로 구성한다고 외우기 쉽다. 실라버스 표현은 '더 자주(more often)'이고, 선택 기준은 테스트 대상의 동작이다(3.1.3).","ref":"3.1.3","hard":true},{"id":"h3-105","ch":3,"lo":"AuT-3.1.4","k":1,"q":"실라버스 3.1.4가 설명하는 ECU에 대한 진술 가운데 옳지 **않은** 것은?","opts":["자동차 환경의 ECU는 하드웨어와 소프트웨어로 이루어진 임베디드 시스템으로 동작한다.","communication bus system은 센서나 다른 ECU에서 오는 정보를 ECU에 추가로 제공한다.","ECU는 아날로그·디지털 입력으로 전압·전류·온도 데이터를 시동할 때 한 번만 읽는다.","데이터베이스와 통신 프로토콜을 무엇으로 고를지는 ECU의 기능에 따라 달라진다."],"ans":[2],"exp":"3.1.4: ECU는 아날로그·디지털 입력으로 전압·전류·온도 형태의 환경 데이터를 끊임없이(constantly) 수집한다. '시동할 때 한 번만 읽는다'는 이 문장과 반대다. 나머지 셋은 3.1.4 문장 그대로다.","why":["3.1.4 첫 문장 그대로다(하드웨어와 소프트웨어로 이루어진 임베디드 시스템).","3.1.4: communication bus system은 센서나 다른 ECU에서 오는 추가 데이터를 제공한다.","정답(옳지 않은 진술). 3.1.4는 ECU가 아날로그·디지털 입력으로 환경 데이터를 끊임없이 수집한다고 한다.","3.1.4: 데이터베이스와 통신 프로토콜의 선택은 ECU의 기능에 따라 달라진다."],"ref":"3.1.4","hard":true},{"id":"h3-106","ch":3,"lo":"AuT-3.2.1.2","k":2,"q":"팀이 MiL(model-in-the-loop) 테스트 환경 구축 계획을 세우고 있다.\n실라버스 3.2.1.2가 MiL 테스트 실행에 필요하다고 든 것은?","opts":["테스트를 실행할 컴퓨터와, 환경 모델까지 포함한 그에 맞는 시뮬레이션 소프트웨어","real-time capable computer와, 여러 공급 전압을 설정할 전원 공급 장치","래퍼(wrapper)를 만드는 소프트웨어 도구와, 그 래퍼가 정의하는 access point","development kit과, 실제 부품을 연결한 ECU 프로토타입"],"ans":[0],"exp":"3.2.1.2: MiL 테스트를 실행하려면 컴퓨터와, 환경 모델을 포함한 해당 시뮬레이션 소프트웨어가 필요하다. MiL은 모든 구성 요소가 모델로 있어 실시간이 아니라 시뮬레이션 시간으로 실행된다. access point는 테스트 대상 모델과 환경 모델 안에 임의로 둘 수 있다(3.2.1.1).","why":["정답. 3.2.1.2 문장 그대로다.","real-time capable computer와 전원 공급 장치는 HiL의 전형적인 구성 요소다(3.2.3.1). MiL 테스트는 실시간이 아니라 시뮬레이션 시간으로 실행된다(3.2.1.2).","래퍼와 그것을 만드는 소프트웨어 도구는 SiL에 필요하다(3.2.2.1). MiL의 access point는 모델 안에 임의로 둘 수 있다(3.2.1.1).","MiL의 테스트 대상은 특수 하드웨어용으로 컴파일되지 않은 모델이다(3.2.1.1). 테스트 대상이 프로토타입으로 있으면 HiL을 쓸 수 있다(3.2.3.1)."],"ref":"3.2.1.2","hard":true},{"id":"h3-107","ch":3,"lo":"AuT-3.2.1.2","k":2,"q":"모델 기반 개발 초기라 아직 모델에서 코드를 생성하지 않았다. 테스터는 MiL에서 (가) 개별 컴포넌트 모델의 기능 테스트와 (나) 컴포넌트 모델을 묶은 전체 시스템 모델의 테스트를 하려 한다.\n실라버스 3.2.1.2에 비추어 옳은 판단은?","opts":["(가)만 할 수 있다. 전체 시스템 모델은 HiL에서 테스트해야 한다.","(나)만 할 수 있다. 개별 컴포넌트는 코드를 컴파일한 뒤 SiL에서 테스트해야 한다.","둘 다 할 수 없다. MiL로는 functional system design만 테스트할 수 있다.","둘 다 할 수 있다. MiL로 단일 컴포넌트부터 전체 시스템까지 테스트할 수 있다."],"ans":[3],"exp":"3.2.1.2: MiL로 functional system design을 테스트할 수 있고, 개발 중에(예: 일반 V-모델) 단일 컴포넌트부터 전체 시스템까지 테스트할 수도 있다. 같은 절은 MiL로 개발 초기(V-모델 왼쪽)에 모든 개발 레벨에 걸쳐 모델의 기능 적합성(functional suitability)을 테스트할 수 있다고 한다. 그래서 (가)와 (나) 모두 MiL에서 할 수 있다.","why":["3.2.1.2는 MiL로 단일 컴포넌트부터 전체 시스템까지 테스트할 수 있다고 한다. 전체 시스템 모델도 MiL에서 테스트할 수 있다.","개별 컴포넌트 모델도 MiL에서 테스트할 수 있다(3.2.1.2). SiL의 테스트 대상은 컴파일된 코드라서(3.2.2.1) 코드가 없는 지금은 쓸 수 없다.","3.2.1.2는 functional system design 테스트에 더해 단일 컴포넌트부터 전체 시스템까지 테스트할 수 있다고 한다.","정답. 3.2.1.2 설명과 맞다."],"ref":"3.2.1.2","hard":true},{"id":"h3-108","ch":3,"lo":"AuT-3.2.2.2","k":1,"q":"실라버스 3.2.2.2에 따르면 SiL(software-in-the-loop) 테스트 환경에서 평가하는 일이 매우 흔한(very common) 테스트 유형으로만 묶인 것은?","opts":["기능 적합성 테스트, 인터페이스 테스트, 신뢰도 테스트","기능 적합성 테스트, 인터페이스 테스트, 리그레션 테스트","인터페이스 테스트, 리그레션 테스트, 수행 효율성 테스트","기능 적합성 테스트, 리그레션 테스트, 수행 효율성 테스트"],"ans":[1],"exp":"3.2.2.2: 기능 적합성(functional suitability) 테스트, 인터페이스 테스트, 리그레션 테스트는 SiL에서 평가하는 매우 흔한 테스트 유형이다. 반면 수행 효율성(performance efficiency) 테스트와 신뢰도(reliability) 테스트는 흔하지 않다. 이 품질 특성은 주로 타깃 하드웨어의 영향을 받기 때문이다.\n(v2.1 기준. 2018년판은 같은 내용을 functional tests, performance tests라는 이름으로 적었다.)","why":["신뢰도 테스트는 SiL에서 흔하지 않다. 주로 타깃 하드웨어의 영향을 받는 품질 특성이다(3.2.2.2).","정답. 3.2.2.2가 매우 흔하다고 든 세 유형이다.","수행 효율성 테스트는 SiL에서 흔하지 않다. 주로 타깃 하드웨어의 영향을 받는 품질 특성이다(3.2.2.2).","수행 효율성 테스트는 SiL에서 흔하지 않다(3.2.2.2)."],"trap":"SiL에서도 실행 시간을 잴 수 있으니 성능 쪽 테스트를 하기 좋다고 여기기 쉽다. 실라버스는 수행 효율성·신뢰도 테스트를 SiL에서 흔하지 않다고 하고, 그 이유로 이 품질 특성이 주로 타깃 하드웨어의 영향을 받는다는 점을 든다(3.2.2.2).","ref":"3.2.2.2","hard":true},{"id":"h3-109","ch":3,"lo":"AuT-3.2.3.1","k":1,"q":"HiL(hardware-in-the-loop) 테스트 환경의 구성 요소와 그 역할을 짝지은 것 가운데 실라버스 3.2.3.1과 맞지 **않는** 것은?","opts":["전원 공급 장치: 여러 공급 전압을 설정한다","FIU(fault insertion unit): 단선과 단락을 시뮬레이션한다","breakout box: ECU 소프트웨어 내부 변수에 접근하는 추가 인터페이스다","signal processing unit: 신호 종류와 신호 진폭을 처리한다"],"ans":[2],"exp":"3.2.3.1: breakout box는 와이어링 하네스(cable harness)에 두는 추가 접근 인터페이스다. ECU 소프트웨어 내부 변수에 접근하는 장치가 아니다. 나머지 셋은 3.2.3.1 목록 그대로다(전원 공급 장치: 여러 공급 전압 설정, FIU: 단선·단락 시뮬레이션, signal processing unit: 신호 종류·신호 진폭).","why":["3.2.3.1: 전원 공급 장치는 여러 공급 전압을 설정한다.","3.2.3.1: FIU는 단선과 단락을 시뮬레이션한다.","정답(맞지 않는 짝). breakout box는 와이어링 하네스에 두는 추가 접근 인터페이스다(3.2.3.1).","3.2.3.1: signal processing unit은 신호 종류와 신호 진폭을 다룬다."],"ref":"3.2.3.1","hard":true},{"id":"h3-110","ch":3,"lo":"AuT-3.2.3.2","k":2,"q":"HiL 테스트 환경에 real-time capable computer가 들어가는 이유로 실라버스 3.2.3.2가 설명하는 것은?","opts":["소프트웨어가 실제 하드웨어에서 돌아 항상 실시간으로 진행되므로, 정해진 시간 안에 관련 신호를 모두 모으고 내보내야 하기 때문이다.","시뮬레이션을 원하는 순간에 일시 정지했다가 같은 시점부터 다시 이어 가며, 멈춘 동안 신호를 자세히 분석해야 하기 때문이다.","래퍼가 정의하는 access point로 컴파일된 소프트웨어 신호를 관찰·제어하고, 그 결과를 시뮬레이션 시간으로 기록해야 하기 때문이다.","실제 부품을 모두 환경 모델로 바꿔, 실물 부품 없이도 여러 ECU로 이루어진 시스템 전체를 시뮬레이션해야 하기 때문이다."],"ans":[0],"exp":"3.2.3.2: MiL·SiL과 달리 HiL에서는 소프트웨어가 실제 하드웨어에서 돌기 때문에 시뮬레이션 시간이 항상 실시간으로 흐르고, 일시 정지나 중단을 할 수 없다. 그래서 HiL 테스트 환경에는 정해진 시간 안에 모든 관련 신호를 모으고 내보낼 수 있는 real-time capable computer가 들어간다. 3.2.3.1은 환경 모델이 이 컴퓨터에서 실행된다고 한다.","why":["정답. 3.2.3.2의 설명 그대로다.","HiL에서는 일시 정지나 중단을 할 수 없다(3.2.3.2). 언제든 일시 정지할 수 있는 것은 MiL과 SiL이다(3.2.1.2, 3.2.2.2).","래퍼로 access point를 정의하고 시뮬레이션 시간으로 실행하는 것은 SiL의 특징이다(3.2.2.1, 3.2.2.2). HiL은 항상 실시간으로 실행된다.","HiL에는 환경 모델에 구현하지 않은 실제 부품 여러 개가 들어간다(3.2.3.1)."],"ref":"3.2.3.2","hard":true},{"id":"h3-111","ch":3,"lo":"AuT-3.2.3.2","k":2,"q":"HiL 테스트 환경은 테스트 대상에 따라 component HiL과 system HiL로 나뉜다.\ncomponent HiL이라는 이름의 'component'가 실라버스에서 가리키는 것은?","opts":["AUTOSAR application layer에 있는 소프트웨어 컴포넌트(SW-C) 하나","ECU 소프트웨어를 이루는 소프트웨어 유닛(unit) 하나","HiL 테스트 벤치를 이루는 전원 공급 장치·FIU 같은 하드웨어 구성 요소 하나","E/E 시스템이라는 맥락에서 본 ECU 하나, 즉 테스트 대상인 단일 ECU"],"ans":[3],"exp":"3.2.3.2: 테스트 대상이 ECU 하나이면 component HiL, 여러 ECU의 조합이면 system HiL이라고 부른다. 각주 28은 여기서 component라는 말을 E/E 시스템 맥락의 ECU에 쓴다고 밝힌다. 테스터는 component HiL로 제어 장치의 기능을 테스트하고, system HiL에서는 ECU 사이 데이터 교환과 시스템 테스트에 초점을 둔다.","why":["SW-C는 AUTOSAR application layer의 컴포넌트를 부르는 이름이다(2.3.2). component HiL의 component는 ECU를 가리킨다(3.2.3.2 각주 28).","component HiL의 component는 소프트웨어 유닛이 아니라 E/E 시스템 맥락의 ECU다(3.2.3.2 각주 28).","전원 공급 장치·FIU는 HiL 테스트 환경의 구성 요소다(3.2.3.1). component HiL이라는 이름은 테스트 대상이 단일 ECU라는 뜻이다(3.2.3.2).","정답. 3.2.3.2 각주 28 그대로다."],"ref":"3.2.3.2","hard":true},{"id":"h3-112","ch":3,"lo":"AuT-3.2.4.1","k":2,"q":"실라버스 표 3의 기준 '현실 근접성(closeness to reality)'에서 MiL 테스트 환경에 해당하는 설명과 impact는?","opts":["컴파일된 실제 소프트웨어를 하드웨어 없이 실행할 수 있다. impact는 Low to medium이다.","현실을 시뮬레이션하고 많은 특성을 추상화하며, 구조와 로직에 초점을 둔다. impact는 Low다.","모델의 모든 신호를 관찰·제어할 수 있어 세 환경 가운데 현실에 가장 가깝다. impact는 High다.","통합된 시스템을 실행할 수 있어 세 환경 가운데 현실에 가장 가깝다. impact는 High다."],"ans":[1],"exp":"표 3 '현실 근접성' 기준은 세 줄이다. MiL: 현실을 시뮬레이션하고 많은 특성을 추상화하며 구조와 로직에 초점을 둔다(impact Low). SiL: 컴파일된 실제 소프트웨어를 하드웨어 없이 실행할 수 있다(Low to medium). HiL: 실행할 수 있는 통합 시스템(High). MiL에서 HiL로 갈수록 현실에 가까워진다(3.2.4.1).","why":["SiL 줄의 설명과 impact다(표 3).","정답. 표 3의 MiL 줄 그대로다.","모든 신호를 관찰·제어할 수 있다는 것은 '테스트 대상에 대한 접근' 기준의 MiL 설명이다(표 3). MiL의 현실 근접성 impact는 Low다.","HiL 줄의 설명과 impact다(표 3)."],"ref":"3.2.4.1","hard":true},{"id":"h3-113","ch":3,"lo":"AuT-3.2.4.1","k":2,"q":"실라버스 표 3에서 '디버깅 시간과 노력(time and effort in debugging)'의 impact는 MiL Low, SiL Medium, HiL High다.\n표 3이 이 기준에 적은 설명에 비추어, 이 차이가 생기는 이유로 옳은 것은?","opts":["결함은 세 환경에서 같은 곳에서 발견되지만, HiL은 테스트 설계·구현·평가에 노력이 더 들기 때문이다.","SiL과 HiL은 실시간으로 실행되어 일시 정지할 수 없으므로, 결함 분석에 시간이 더 들기 때문이다.","결함이 발견되어 조정할 대상이 모델에서 프로그래밍된 소프트웨어, 시스템 레벨로 넓어지기 때문이다.","MiL에서는 결함이 거의 발견되지 않고, 결함 대부분이 SiL과 HiL에서 발견되기 때문이다."],"ans":[2],"exp":"표 3 '디버깅 시간과 노력' 기준은 세 줄이다. MiL: 테스트 대상 모델에서 결함이 발견된다(모델 조정, Low). SiL: 프로그래밍된 소프트웨어에서 결함이 발견된다(소프트웨어 조정, Medium). HiL: 시스템 레벨에서 결함이 발견된다(시스템 조정, High). 표는 결함이 발견되는 곳과 조정 대상이 모델 → 소프트웨어 → 시스템으로 바뀌는 것과 impact Low → Medium → High를 함께 적는다(3.2.4.1).","why":["표 3은 결함이 발견되는 곳을 환경마다 다르게 적는다(모델, 프로그래밍된 소프트웨어, 시스템 레벨). 테스트 설계·구현·평가 노력은 '테스트 준비 노력' 기준의 HiL 설명이다.","SiL은 시뮬레이션 시간으로 실행되고 언제든 일시 정지할 수 있다(3.2.2.2). 항상 실시간으로 실행되어 일시 정지할 수 없는 것은 HiL이다(3.2.3.2).","정답. 표 3 디버깅 기준의 세 줄(모델 조정, 소프트웨어 조정, 시스템 조정)과 맞다.","표 3은 MiL에서 결함이 테스트 대상 모델에서 발견된다고 적는다. 결함이 거의 발견되지 않는다는 내용은 없다."],"ref":"3.2.4.1","hard":true},{"id":"h3-114","ch":3,"lo":"AuT-3.2.4.2","k":3,"q":"모델 없이 C 코드로 직접 개발하는 ECU 소프트웨어다. 컴포넌트 몇 개를 코딩·컴파일했고 상세 컴포넌트 명세도 있다. 시스템 명세는 미완성이고 실행할 수 있는 ECU는 아직 없다.\n실라버스 표 3의 '테스트 대상에 필요한 성숙도'와 '테스트 베이시스(명세)에 필요한 상세 수준' 기준을 적용할 때, 지금 쓸 환경과 그 근거로 알맞은 것은?","opts":["SiL: 타깃 소프트웨어로 초기 기능을 테스트하는 단계이고, 필요한 소프트웨어 레벨 정보(상세 컴포넌트 명세)도 있다.","MiL: MiL의 테스트 대상은 컴파일된 코드이므로, 코딩·컴파일한 컴포넌트를 MiL에서 먼저 테스트한다.","HiL: 시스템 레벨 요구사항은 미완성 명세로도 테스트할 수 있으므로, 실행할 수 있는 ECU 없이 HiL을 쓴다.","SiL: 필요한 명세 상세 수준이 Low라서, 상세 컴포넌트 명세가 없었더라도 SiL을 쓸 수 있다."],"ans":[0],"exp":"풀이\n① 테스트 대상의 성숙도: 컴포넌트 몇 개를 코딩·컴파일했고 실행할 수 있는 ECU는 없다. 표 3에서 SiL 줄은 '타깃 소프트웨어로 초기 기능을 테스트한다'(Medium), HiL 줄은 '실행할 수 있는 ECU 하나 이상이나 부분 시스템을 최대한 전체로 테스트한다'(High)다. MiL 줄은 '시스템 모델을 시뮬레이션한다'(Low)인데 이 프로젝트에는 모델이 없다.\n② 명세 상세 수준: 상세 컴포넌트 명세가 있고 시스템 명세는 미완성이다. 표 3에서 SiL은 소프트웨어 레벨의 관련 정보(예: 상세 컴포넌트 명세)가 있어야 하고(Medium to high), HiL은 완전한 시스템 명세로 시스템 레벨에서 요구사항을 테스트한다(High).\n③ 두 기준을 모두 만족하는 환경은 SiL이다.\n검산 1: HiL은 실행할 수 있는 ECU와 완전한 시스템 명세가 둘 다 없어 두 기준 모두 맞지 않는다.\n검산 2: MiL의 테스트 대상은 특수 하드웨어용으로 컴파일되지 않은 모델이다(3.2.1.1). 모델 없이 코드로 개발하므로 MiL로 테스트할 대상이 없다. 3.2.4.3도 단일 컴포넌트를 프로그래밍·컴파일했을 때 SiL을 쓸 수 있다고 해 결과가 같다.","why":["정답. 성숙도(타깃 소프트웨어로 초기 기능 테스트)와 명세 상세 수준(소프트웨어 레벨 정보 필요)이 모두 표 3의 SiL 줄과 맞다.","MiL의 테스트 대상은 컴파일된 코드가 아니라 특수 하드웨어용으로 컴파일되지 않은 모델이다(3.2.1.1). 이 프로젝트에는 모델이 없다.","표 3에서 HiL은 실행할 수 있는 ECU(또는 부분 시스템)와 완전한 시스템 명세가 필요하다. 둘 다 아직 없다.","표 3에서 SiL에 필요한 명세 상세 수준은 Medium to high이고, 소프트웨어 레벨 정보(예: 상세 컴포넌트 명세)가 있어야 한다."],"ref":"3.2.4.2","hard":true},{"id":"h3-115","ch":3,"lo":"AuT-3.2.4.2","k":3,"q":"ECU 소프트웨어의 진단 기능을 테스트하려 한다. 결함 활성화와 리셋 요구사항이 올바르게 제공되는지가 대상이다.\n테스트 관리자는 실라버스 표 4에서 이 테스트 목적이 recommended(+)인 환경마다 이 테스트를 배정하기로 했다. 배정할 환경을 빠짐없이 고른 것은?\n표 4 범례(원문): + recommended, o possible, - not sensible","opts":["MiL, SiL, HiL 모두","HiL만","MiL과 SiL","SiL과 HiL"],"ans":[3],"exp":"풀이\n① 테스트 목적 찾기: 결함 활성화와 리셋 요구사항은 표 4 '진단 기능 테스트' 행의 예다. 이 행은 필요한 진단 기능을 올바르게 제공하는지를 보며, 예로 결함 탐지, 결함 활성화와 리셋 요구사항, defect memory의 결함 활성화(예: OBD(on-board diagnostics), 정비소)를 든다.\n② 그 행의 값: MiL -, SiL +, HiL +.\n③ +(recommended)인 환경은 SiL과 HiL이다.\n검산 1: '결함 탐지·처리 메커니즘 테스트' 행(MiL·SiL·HiL 모두 +)의 예는 랜덤 하드웨어 결함·소프트웨어 결함의 탐지와 처리, 결함 발견 뒤 안전 상태로 전환(예: 시스템 비활성화)이다. 결함 활성화와 리셋 요구사항은 이 행에 없다.\n검산 2: MiL은 -(not sensible)라 빠지고, SiL과 HiL은 둘 다 +라 둘 다 배정한다(3.2.4.2 표 4).","why":["세 환경이 모두 +인 행은 결함 탐지·처리 메커니즘 테스트다. 진단 기능 테스트 행에서 MiL은 -(not sensible)다(표 4).","표 4의 진단 기능 테스트 행에서 SiL도 +(recommended)다. HiL만 +인 행은 고객 요구사항 테스트와 유용성 입증이다.","진단 기능 테스트 행에서 MiL은 -(not sensible)이고, HiL이 +(recommended)다(표 4).","정답. 표 4의 진단 기능 테스트 행은 MiL -, SiL +, HiL +다."],"trap":"'결함'이라는 말 때문에 결함 탐지·처리 메커니즘 행(세 환경 모두 +)으로 읽거나, 진단은 실제 ECU가 있어야 한다고 보고 HiL만 고르기 쉽다. 표 4의 진단 기능 테스트 행은 MiL -, SiL +, HiL +다(3.2.4.2).","ref":"3.2.4.2","hard":true},{"id":"h4-001","ch":4,"lo":"AuT-4.1.1","k":2,"q":"어느 공급업체(supplier)가 사내 MISRA-C 적용 지침 초안에 다음 진술 i~v를 적었다.\ni. MISRA-C 가이드라인은 종류에 따라 rule과 directive로 나뉜다. 이와 별도로, 각 가이드라인은 mandatory, required, advisory 세 의무 수준(level of obligation) 중 하나로 분류된다.\nii. advisory 가이드라인도 준수에 드는 노력이 합리적이라면 개발자가 따라야 한다.\niii. 조직은 특정 가이드라인의 의무 수준을 자체적으로 높여 적용할 수 있다.\niv. 예외를 둘 수 있는 것은 advisory 가이드라인뿐이다. required 가이드라인은 공식 승인이 있어도 예외를 둘 수 없다.\nv. 코딩 가이드라인(coding guideline)은 결함으로 이어질 수 있는 코드의 이상 사항(anomaly)을 피하게 돕는다. 다만 유지 가능성(maintainability)이나 이동성(portability)과는 관계가 없다.\n\n실라버스 4.1.1과 맞는 진술만 모두 고른 것은?","opts":["i, ii, iv","i, iii, v","i, ii, iii","ii, iii, iv"],"ans":[2],"exp":"진술마다 4.1.1 원문과 대조한다.\ni: MISRA-C는 두 종류의 가이드라인(rules, directives)을 정의하고, \"Each guideline is categorized at one of the following three levels of obligation\"이라고 한다(맞음).\nii: \"'advisory' guidelines must be followed by the developer if the effort is reasonable.\"(맞음)\niii: \"Organizations may individually raise the level of obligation for a guideline but may never lower it.\"(맞음)\niv: required 가이드라인은 예외가 가능하되 공식 승인(예: 품질 관리)을 받아야 한다. 예외가 없는 것은 mandatory다(틀림).\nv: 코딩 가이드라인은 이상 사항을 피하게 돕고, 동시에 유지 가능성과 이동성을 지원한다(틀림).\n검산: 맞는 진술 i, ii, iii만 담고 iv, v가 없는 조합은 하나다.\n함정 포인트: advisory를 '참고용이라 안 지켜도 되는 것'으로 여기면 ii를 빼게 된다.\n(v2.1 기준. 2018년판은 advisory를 '노력이 적절하면 따라야 한다(should)', required를 '개발자가 납득할 만하게 설명할 수 있을 때만 무시할 수 있다'고 적었다. iv가 틀렸다는 판정은 두 판이 같다.)","why":["iv가 틀렸다. required 가이드라인은 공식 승인을 받으면 예외를 둘 수 있다. 맞는 진술 iii도 빠졌다.","v가 틀렸다. 코딩 가이드라인은 유지 가능성과 이동성도 지원한다. 맞는 진술 ii도 빠졌다.","정답. i, ii, iii이 4.1.1 원문과 같다.","iv가 틀렸다. 예외가 아예 없는 것은 mandatory이고, required는 공식 승인으로 예외가 가능하다. 맞는 진술 i도 빠졌다."],"trap":"advisory를 '권고 수준이라 안 지켜도 되는 것'으로 여기면 ii를 빼기 쉽다. 실라버스 v2.1 4.1.1은 advisory도 노력이 합리적이면 따라야 한다(must)고 적는다.","ref":"4.1.1","hard":true},{"id":"h4-002","ch":4,"lo":"AuT-4.1.1","k":2,"q":"정적 분석(static analysis) 도구가 브레이크 제어 SW에서 MISRA-C 위반 3건을 보고했다. 각 건의 처리 기록은 다음과 같다.\n(1) mandatory 가이드라인 위반: 개발자가 '실행 시간 제약 때문에 불가피하다'는 사유를 문서로 남겼고, 품질 관리 부서도 이를 승인했다.\n(2) required 가이드라인 위반: 개발자가 예외 사유를 문서로 설명했고, 품질 관리 부서가 이 예외를 공식 승인했다.\n(3) advisory 가이드라인 위반: 준수에 드는 노력이 합리적인 수준을 크게 넘는다고 판단해 따르지 않았고, 그 판단 근거를 기록했다.\n\n실라버스 4.1.1의 의무 수준 기준으로, 지금 기록만으로는 받아들일 수 없어 추가 조치가 필요한 건을 모두 고른 것은?","opts":["(1) 한 건만","(1)과 (2)","(1)과 (3)","(2)와 (3)"],"ans":[0],"exp"
