결과를 비교하지 않는다.","요구사항은 보통 테스트 입력을 도출하는 기반으로 쓰지만, 기대 결과를 정하는 테스트 오라클로는 쓰지 않는다."],"ans":[3],"exp":"4.2.2: 테스트 대상들은 내용 면에서 같은 요구사항에 기반해야 비교 가능한 동작을 보인다. 이 요구사항은 보통 테스트 입력 도출의 기반으로 쓰이지만, 기대 결과를 정하는 테스트 오라클로는 쓰이지 않는다. 대신 한 테스트 대상의 동작을 다른 테스트 대상의 pseudo-oracle로 삼아 비교한다. (v2.1 기준. 2018년판에서는 '요구사항은 테스트 설계의 test basis가 아니다'라고 했다.)","why":["반대다. 요구사항은 입력 도출에 쓰고, 기대 결과는 다른 테스트 대상(pseudo-oracle)이 만든다.","테스트 대상들은 내용 면에서 같은 요구사항에 기반해야 비교 가능한 동작을 보인다.","back-to-back 테스팅은 같은 테스트 케이스를 모든 variant에 실행하고 결과를 서로 비교하는 것이 핵심이다.","정답. 4.2.2의 설명 그대로다."],"ref":"4.2.2"},{"id":"c4-016","ch":4,"lo":"AuT-4.2.2","k":2,"q":"엔진 제어 SW를 v1.3에서 v1.4로 수정했다. 테스터는 back-to-back 테스팅으로 같은 테스트 케이스를 두 버전에 실행하고 결과를 비교한다. 결과 판정에 대한 설명으로 옳은 것은?","opts":["결과가 같으면 통과다. 결과가 다르면 아주 작은 차이라도 그 원인을 분석한다.","결과가 조금이라도 다르면 v1.4를 결함으로 판정하고 바로 결함 보고서를 쓴다.","결과가 아주 작게 다르면 허용 범위로 보고 통과로 처리한다.","테스트 케이스는 v1.4에만 실행하고, v1.3의 결과는 요구사항 명세에서 계산해 기대 결과로 쓴다."],"ans":[0],"exp":"4.2.2: 테스터는 같은 테스트 케이스를 모든 variant에 실행하고 결과를 비교한다. 결과가 같으면 통과, 다르면 발견된 차이의 원인을 분석한다. back-to-back 테스팅은 테스트 대상 사이(또는 그 환경 사이)의 의도하지 않은 차이를 아주 작은 것까지 드러낼 것으로 기대된다. 가장 단순한 경우가 같은 SW의 다른 버전 비교이며, 이때 이전 버전(v1.3)이 리그레션 테스트처럼 pseudo-oracle 역할을 한다. (pseudo-oracle 표현은 v2.1 기준. 2018년판에서는 'test oracle'이라고 했다.)","why":["정답. 4.2.2의 판정 방식 그대로다.","다르면 차이의 원인을 분석한다. 원인을 확인하기 전에 v1.4의 결함으로 정하지 않는다.","back-to-back 테스팅은 아주 작은 의도하지 않은 차이까지 드러내는 것을 기대한다. 결과가 같을 때 통과다.","같은 테스트 케이스를 모든 variant(여기서는 두 버전)에 실행해 결과를 비교한다. 요구사항은 기대 결과를 정하는 데 쓰지 않는다."],"ref":"4.2.2"},{"id":"c4-017","ch":4,"lo":"AuT-4.2.3","k":2,"q":"HiL 테스트 환경에서 브레이크 페달 센서 신호선의 단락(short circuit)에 ECU가 안전하게 반응하는지 확인하려 한다. 실라버스에 따른 fault injection(결함 주입) 테스팅 방법으로 가장 적절한 것은?","opts":["fault injection은 SW 내부 결함만 다루므로, 신호선 단락은 fault injection의 대상이 아니다.","실행 중에는 결함을 넣을 수 없으므로, 매번 테스트를 멈추고 배선을 바꾼 뒤 처음부터 다시 실행해야 한다.","HiL 테스트 환경에서 FIU를 이용해 실행 중에 단락을 시뮬레이션한다.","정적 분석 도구로 단락 처리 코드의 MISRA-C 준수 여부를 확인하는 것으로 대신한다."],"ans":[2],"exp":"4.2.3: 테스터가 결함을 넣는 위치에는 인터페이스 결함(예: 단락이나 메시지 손실로 인한 피해 방지)이 있다. 외부 결함이나 인터페이스 관련 결함은 보통 HiL 테스트 환경에서 FIU(fault insertion unit)를 사용해 실행 중에 시뮬레이션한다.","why":["인터페이스 결함(예: 단락, 메시지 손실)도 결함 주입 위치에 들어간다.","실행 중에도 결함을 넣을 수 있다. 외부·인터페이스 관련 결함은 보통 HiL에서 FIU로 실행 중(run-time)에 시뮬레이션한다(4.2.3).","정답. 외부·인터페이스 관련 결함은 보통 HiL에서 FIU로 실행 중에 시뮬레이션한다(4.2.3).","정적 분석은 코드를 실행하지 않고 검사한다. fault injection은 결함 같은 adverse condition에 대한 시스템의 반응을 평가한다."],"ref":"4.2.3"},{"id":"c4-018","ch":4,"lo":"AuT-4.2.3","k":2,"q":"제어 SW의 내부 변수에 비정상 값을 넣어, SW 안의 오류 처리(error handling) 루틴이 내부 결함을 감지하고 처리하는지 확인하려 한다. 실라버스에 따르면 이런 SW 기반 결함은 주로 어떻게 주입하는가?","opts":["HiL 테스트 환경의 FIU로 ECU 배선에 단선을 만들어 주입한다.","SiL 테스트 환경이나 개발 환경에서 디버거나 XCP 같은 도구로 시뮬레이션한다.","실차 주행 시험에서만 주입할 수 있다.","SW 내부 결함은 fault injection의 대상이 아니므로, 단위 테스트의 positive 테스트 케이스로만 확인한다."],"ans":[1],"exp":"4.2.3: 결함 주입 위치에는 애플리케이션 결함(내부 결함을 감지하고 처리)이 포함된다. 인터페이스 결함이나 내부 결함 같은 SW 기반 결함은 SiL 테스트 환경이나 개발 환경에서 디버거나 XCP(Universal Measurement and Calibration Protocol) 같은 도구로 시뮬레이션하는 경우가 많다. (v2.1 기준. 2018년판에서는 SW 내부 결함은 개발 환경에서 디버거나 XCP로만 넣을 수 있는 경우가 많다고 했고, SiL은 SW 기반 인터페이스 결함에만 언급했다.)","why":["FIU는 외부·인터페이스 관련 결함을 HiL에서 시뮬레이션할 때 쓴다. SW 내부 변수에 비정상 값을 넣는 수단이 아니다.","정답. SW 기반 결함(인터페이스·내부 결함)은 SiL이나 개발 환경에서 디버거·XCP로 시뮬레이션하는 경우가 많다(4.2.3).","실라버스는 SiL 테스트 환경이나 개발 환경에서 시뮬레이션한다고 한다. 실차로 한정하지 않는다.","애플리케이션 결함(내부 결함 감지·처리)도 결함 주입 위치에 들어간다."],"ref":"4.2.3"},{"id":"c4-019","ch":4,"lo":"AuT-4.2.3","k":2,"q":"fault injection 테스팅에 대한 설명으로 옳은 것을 두 개 고르시오.","opts":["주입한 결함을 테스트 스위트가 몇 개나 찾아내는지 세어 테스트 케이스의 결함 검출력을 평가하는 것이 목적이다.","classic fault injection에서 테스터는 물리적 테스트 대상을 조작해 결함을 넣는다.","결함 주입 위치는 애플리케이션 내부로 한정되며, 외부 컴포넌트나 인터페이스는 대상이 아니다.","정상 범위의 입력만 사용해 요구사항이 충족되는지 확인하는 positive 테스트다.","결함을 주입하는 방법은 시스템과 테스트 환경에 따라 달라진다."],"ans":[1,4],"exp":"4.2.3: fault injection 테스팅은 컴포넌트나 시스템이 adverse condition(예: 결함)에 어떻게 반응하는지 평가한다. 결함은 시스템과 테스트 환경에 따라 여러 방법으로 주입할 수 있다. classic fault injection에서는 테스터가 물리적 테스트 대상을 조작해 결함을 넣는다. 외부·인터페이스 결함은 보통 HiL에서 FIU로, SW 기반 결함(예: 인터페이스·내부 결함)은 흔히 SiL이나 개발 환경에서 디버거·XCP로 시뮬레이션한다. 결함 주입 위치는 외부 컴포넌트, 인터페이스, 애플리케이션 세 곳이다.","why":["실라버스의 목적은 테스트 스위트 평가가 아니라 컴포넌트나 시스템이 결함에 어떻게 반응하는지 평가하는 것이다.","정답. 4.2.3의 classic fault injection 설명 그대로다.","외부 컴포넌트(예: 센서의 비정상 값)와 인터페이스(예: 단락, 메시지 손실)도 결함 주입 위치다.","fault injection은 결함 같은 adverse condition을 만들어 반응을 본다. 정상 입력만 쓰는 positive 테스트가 아니다.","정답. 4.2.3: 결함은 시스템과 테스트 환경에 따라 여러 방법으로 주입된다."],"trap":"'결함 주입'이라고 하면 소스 코드를 일부러 고쳐 넣는 방식을 먼저 떠올리기 쉽다. 실라버스의 classic fault injection은 물리적 테스트 대상을 조작하는 방식이고, SW 기반 결함은 SiL·개발 환경에서 디버거나 XCP로 시뮬레이션하는 경우가 많다(4.2.3).","ref":"4.2.3"},{"id":"c4-020","ch":4,"lo":"AuT-4.2.4","k":1,"q":"실라버스에 따르면 요구사항 기반 테스팅(requirements-based testing)에서 요구사항 커버리지는 어떻게 측정하는가?","opts":["요구사항 기반 테스트 케이스 중 통과한 테스트 케이스 수 ÷ 실행한 전체 테스트 케이스 수","테스트 케이스 1개 이상과 연결된 요구사항 문서 항목(분해 전 요구사항 ID) 수 ÷ 전체 요구사항 문서 항목 수","실행된 구문 수 ÷ 전체 실행 가능한 구문 수","테스트 케이스 1개 이상으로 커버된 atomic requirement 수 ÷ 전체 atomic requirement 수"],"ans":[3],"exp":"4.2.4: 요구사항 커버리지는 테스트 케이스 1개 이상으로 커버된 atomic requirement 수를 전체 atomic requirement 수로 나눈 비율이다. 테스터는 복잡하거나 상위 수준인 요구사항을 동작이나 조건 하나만 담은 atomic requirement로 나눠, 숨은 기대나 암묵적 기대를 놓치지 않게 한다. (v2.1 기준. 2018년판 4.2.4에는 atomic requirement와 이 공식이 없다.)","why":["테스트 결과(통과율)이지 요구사항 커버리지가 아니다.","실라버스는 분해 전 문서 항목(요구사항 ID)이 아니라 atomic requirement 단위로 센다.","구문 커버리지다. 화이트박스 테스트 기법의 커버리지다.","정답. 4.2.4의 요구사항 커버리지 정의 그대로다."],"trap":"요구사항 관리 도구의 요구사항 ID(문서 항목) 단위로 커버리지를 세기 쉽다. 실라버스는 atomic requirement 단위로 센다(4.2.4). ID 하나에 여러 동작이 들어 있으면 두 값이 달라질 수 있다.","ref":"4.2.4"},{"id":"c4-021","ch":4,"lo":"AuT-4.2.4","k":1,"q":"요구사항 기반 테스팅의 테스트 케이스에 대한 설명으로 옳은 것은?","opts":["보통 positive 테스트 케이스이고, negative 테스트 케이스는 동등 분할, 오류 추정 같은 보완 기법으로 도출하는 경우가 많다.","주로 negative 테스트 케이스이며, positive 테스트 케이스는 요구사항이 아니라 탐색적 테스팅으로 따로 만든다.","요구사항에 negative 조건이 명시돼 있어도 negative 테스트 케이스는 요구사항에서 도출하지 않는다.","요구사항 커버리지를 채우려면 요구사항에서 만들 수 있는 모든 입력 조합을 실행하는 것이 원칙이다."],"ans":[0],"exp":"4.2.4: 요구사항 기반 테스팅의 테스트 케이스는 보통 명시된 요구사항이 충족되는지 확인하는 positive 테스트 케이스다. negative 테스트 케이스는 동등 분할(equivalence partitioning), 오류 추정(error guessing), 탐색적 테스팅(exploratory testing) 같은 보완 기법으로 도출하는 경우가 많다. 다만 요구사항이 negative 조건을 명시적으로 정의할 수도 있다. (v2.1 기준. 2018년판 4.2.4에는 positive/negative 설명이 없다.)","why":["정답. 4.2.4의 설명 그대로다.","반대다. 요구사항 기반 테스팅의 테스트 케이스는 주로 명시된 요구사항이 충족되는지 확인하는 positive 테스트 케이스다.","실라버스는 요구사항이 negative 조건을 명시적으로 정의할 수도 있다고 한다.","실라버스는 atomic requirement에서 테스트 컨디션을 도출해 요구사항을 실행하는 테스트 케이스를 설계한다고 한다. 요구사항 커버리지도 테스트 케이스 1개 이상으로 커버된 atomic requirement의 비율이다. 모든 입력 조합을 원칙으로 두지 않는다."],"ref":"4.2.4"},{"id":"c4-022","ch":4,"lo":"AuT-4.KW","k":1,"q":"ISTQB 용어집에서 back-to-back 테스팅(back-to-back testing)의 정의로 옳은 것은?","opts":["atomic requirement에서 테스트 컨디션을 도출하는 블랙박스 테스트 기법","pseudo-oracle을 사용하는 테스트 접근법","테스트 대상을 실행하지 않고 작업 산출물을 검토하는 테스팅","실제 하드웨어와 통합된 SW를 테스트하는 가상 테스트 환경"],"ans":[1],"exp":"ISTQB 용어집(Version 2): back-to-back testing = 'A test approach in which a pseudo-oracle is used.' 실라버스 4.2.2도 back-to-back 테스팅을 pseudo-oracle을 사용해 기대 결과를 만드는 test approach로 설명한다. (v2.1 기준. 2018년판 키워드에 연결된 용어집 정의(Version 1)는 '두 개 이상의 variant에 같은 테스트 케이스를 실행해 결과를 비교하는 테스팅'이었다.)","why":["용어집의 requirements-based testing 정의다.","정답. 용어집 정의 'A test approach in which a pseudo-oracle is used.'","정적 테스팅에 대한 설명이다(4.1 도입부).","용어집의 HiL 정의다."],"ref":"4.2.2"},{"id":"c4-023","ch":4,"lo":"AuT-4.KW","k":1,"q":"요구사항 기반 테스팅에서 테스트 컨디션(test condition)을 도출하는 대상으로 실라버스와 ISTQB 용어집(영문)이 공통으로 드는 것은?","opts":["소스 코드의 구조(구문, 분기, 조건)","이전 버전 SW나 실행 가능한 모델의 실행 결과","테스터의 경험과 과거 결함 이력","atomic requirement"],"ans":[3],"exp":"ISTQB 용어집: requirements-based testing은 '... test conditions are derived from atomic requirements.' 실라버스 4.2.4: 테스터는 보통 텍스트로 된 요구사항을 분석해 개별 atomic requirement에서 테스트 컨디션을 도출하고, 요구사항을 실행하는 테스트 케이스를 설계해 실행한다. atomic requirement는 독립적으로 검증할 수 있는 동작이나 조건 하나만 기술해야 한다(should). ISTQB 용어집 한국어판(ko_KR)은 '테스트 케이스를 요구사항을 기반으로 설계'라고만 해 atomic까지 말하지는 않지만, 요구사항이 출발점이라는 점은 같다. (v2.1 기준. 2018년판 4.2.4에는 atomic requirement가 없다.)","why":["구문 테스팅, 분기 테스팅, MC/DC 같은 화이트박스 테스트 기법이 쓰는 테스트 베이시스다.","back-to-back 테스팅에서 pseudo-oracle로 쓰는 것이다.","오류 추정 같은 경험 기반 테스트 기법의 출발점이다.","정답. 용어집과 4.2.4 모두 atomic requirement에서 테스트 컨디션을 도출한다고 한다."],"ref":"4.2.4"},{"id":"c4-024","ch":4,"lo":"AuT-4.KW","k":1,"q":"다음은 실라버스 4.2.3의 설명이다. 이 설명에 해당하는 4장 키워드는?\n\n\"컴포넌트나 시스템이 adverse condition(예: 결함. 이 맥락에서는 fault라고도 한다)에 어떻게 반응하는지 평가하도록 설계된 테스트 접근법\"","opts":["back-to-back testing","requirements-based testing","fault injection","정적 분석(static analysis)"],"ans":[2],"exp":"실라버스 4.2.3: fault injection 테스팅은 컴포넌트나 시스템이 adverse condition(예: 결함. 이 맥락에서는 fault라고도 한다)에 어떻게 반응하는지 평가하도록 설계된 테스트 접근법이다. 테스터는 외부 컴포넌트, 인터페이스, 애플리케이션에 결함을 골라 넣는다. ISTQB 용어집의 fault injection 정의는 판마다 문장이 달라서, 이 문항은 실라버스 4.2.3 본문만 근거로 한다.","why":["pseudo-oracle을 사용해 테스트 대상끼리 결과를 비교한다. adverse condition을 만들지 않는다.","atomic requirement에서 테스트 컨디션을 도출해 요구사항이 충족되는지 확인한다.","정답. 4.2.3의 fault injection 테스팅 설명이다.","코드를 실행하지 않고 검사하므로 실행 중 반응을 평가하지 않는다."],"ref":"4.2.3"},{"id":"c4-025","ch":4,"lo":"AuT-4.2.5","k":3,"q":"아래 표는 실라버스 4.2.5의 표 6이다. 한 사용자가 시스템 테스팅에 쓸 테스트 기법·테스트 접근법을 여러 선택 요인으로 평가하고 선택한 예다(빈칸은 선택하지 않음).\n이 표에서 MC/DC가 선택되지 않은 이유로 표 값이 뒷받침하는 것은?","table":{"head":["번호","테스트 기법 / 테스트 접근법","ASIL A에 권고?","테스트 베이시스 적합?","결함 미발견 시 리스크","시스템 테스트 레벨에서 타당?","선택"],"rows":[["1","요구사항 기반 테스팅","++","YES","++","YES","X"],["2","동등 분할","+","YES","++","YES","X"],["3","경계값 분석","+","NO","-","YES",""],["4","구문 테스팅","++","YES","++","NO",""],["5","결정 테스팅","+","YES","++","NO",""],["6","MC/DC","+","YES","+","NO",""],["7","오류 추정","+","NO","++","YES",""],["8","fault injection 테스팅","+","YES","+","NO",""],["9","back-to-back 테스팅","+","NO","++","YES",""]]},"opts":["시스템 테스트 레벨에서 타당하지 않다고 평가했기 때문이다.","ASIL A에서 권고되지 않기 때문이다.","테스트 베이시스가 MC/DC에 적합하지 않기 때문이다.","실라버스 4.2.5가 자동차 시스템과 관련된 기법으로 MC/DC를 들지 않기 때문이다."],"ans":[0],"exp":"풀이\n① MC/DC 행: ASIL A 권고 '+', 테스트 베이시스 적합 YES, 리스크 '+', '시스템 테스트 레벨에서 타당?' NO, 선택 없음.\n② 보기의 이유를 표 값에 대 본다. ASIL A 권고(+)와 테스트 베이시스(YES)는 선택을 막는 값이 아니다. 보기 중 표 값과 맞는 이유는 '시스템 테스트 레벨에서 타당?' NO뿐이다.\n③ 4.2.5의 테스트 레벨 요인: 화이트박스 테스팅은 소스 코드나 내부 구조가 테스트 베이시스일 때 특히 적합하다.\n검산 1: 선택된 1·2행은 테스트 베이시스와 테스트 레벨이 모두 YES다. 둘 중 하나라도 NO인 3~9행은 하나도 선택되지 않았다.\n검산 2: 같은 '시스템 테스트 레벨에서 타당?' NO인 구문 테스팅(4행)은 ASIL A '++', 리스크 '++'인데도 선택되지 않았다. 권고 수준이 높아도 테스트 레벨이 NO면 이 예에서는 선택되지 않는다.","why":["정답. MC/DC 행의 '시스템 테스트 레벨에서 타당?' 값은 NO다.","MC/DC 행의 ASIL A 권고 값은 '+'(recommended)다.","MC/DC 행의 테스트 베이시스 적합 값은 YES다.","4.2.5의 목록에 modified condition/decision testing이 들어 있다."],"trap":"MC/DC를 ASIL이 요구하는 커버리지로만 떠올리기 쉽다. 실라버스 4.2.5는 state of the art(표준 권고) 외에 테스트 베이시스, 리스크, 테스트 레벨을 함께 따진다. 표 6에서 MC/DC는 권고(+)가 있지만 '시스템 테스트 레벨에서 타당?'이 NO이고, 선택되지 않았다.","ref":"4.2.5"},{"id":"c4-026","ch":4,"lo":"AuT-4.2.5","k":3,"q":"시스템 테스팅에서 테스터가 '배터리 전압 입력'에 경계값 분석(boundary value analysis)을 적용할지 검토한다. 확인된 사실은 다음과 같다.\n- 요구사항에 입력 전압 범위가 9V~16V로 선형으로 정의돼 있다.\n- 시스템 테스팅에서 전압 입력을 제어하고 결과를 관찰할 수 있다.\n- 팀은 이 목적에 경계값 분석이 state of the art에 해당한다고 확인했다.\n- 제품 리스크 분석 결과, 이 입력에는 범위 경계를 넘는 값이 들어올 리스크가 없고, 경계를 넘더라도 그 영향이 리스크가 되지 않는다고 평가됐다.\n실라버스 4.2.5의 선택 요인 중 경계값 분석 적용을 다시 검토하게 만드는 요인은?","opts":["state of the art","리스크 기반 테스팅","테스트 베이시스","테스트 레벨"],"ans":[1],"exp":"풀이(4.2.5의 네 가지 선택 요인에 사실을 하나씩 대 본다)\n① state of the art: 이 목적에 state of the art로 확인됨 → 걸리지 않음.\n② 테스트 베이시스(test basis): 경계값은 값 범위가 선형으로 정의돼 있어야 테스트할 수 있다. 9V~16V로 선형 정의됨 → 걸리지 않음.\n③ 테스트 레벨(test level): 블랙박스 테스팅은 테스트 대상을 쓸 수 있고 관찰할 수 있어야 한다. 시스템 테스팅에서 입력 제어·결과 관찰 가능 → 걸리지 않음.\n④ 리스크 기반 테스팅(risk-based testing): 4.2.5는 '경계값 테스트는 경계 위반이 생길 리스크가 있고, 그 위반의 영향이 리스크가 될 때만 의미가 있다'고 한다. 여기서는 둘 다 없다고 평가됐다 → 재검토 요인.\n검산: 네 요인 중 주어진 사실과 충돌하는 것은 ④ 하나뿐이다.","why":["state of the art에 해당한다고 확인됐으므로 걸리지 않는다.","정답. 경계값 테스트는 경계 위반 리스크가 있고 그 영향이 리스크일 때만 의미가 있다(4.2.5).","값 범위가 선형으로 정의돼 있어 경계값을 테스트할 수 있다.","시스템 테스팅에서 테스트 대상을 쓸 수 있고 관찰할 수 있어 블랙박스 테스팅 조건을 충족한다."],"ref":"4.2.5"},{"id":"c4-027","ch":4,"lo":"AuT-4.2.5","k":3,"q":"브레이크 제어 ECU의 시스템 테스팅을 맡은 테스터가 구문 테스팅(statement testing) 적용을 검토한다. 시스템 테스팅에서는 ECU 내부 구조를 볼 수 없어 구문 커버리지를 측정할 수 없다. 테스트 전략에는 같은 SW의 소스 코드를 테스트 베이시스로 쓰는 다른 테스트 레벨이 있다. 실라버스 4.2.5에 따른 판단으로 가장 적절한 것은?","opts":["시스템 테스팅에서 쓸 수 없는 기법이므로, 다른 레벨은 따질 필요 없이 이 프로젝트에서 구문 테스팅을 뺀다.","표준 권고에서 벗어나는 결정은 테스터 재량이므로 근거를 남기지 않고 구문 테스팅을 생략해도 된다.","시스템 테스팅에서 동등 분할을 충분히 수행하면 구문 커버리지 100%를 달성한 것으로 간주한다.","이 레벨에서는 쓸 수 없으므로, 테스트 전략에 따라 소스 코드를 테스트 베이시스로 쓰는 다른 테스트 레벨에서 적용한다."],"ans":[3],"exp":"풀이\n① 테스트 레벨 요인(4.2.5): 화이트박스 테스팅은 소스 코드나 내부 구조가 테스트 베이시스일 때 특히 적합하고, 이상적으로는 구조 커버리지를 측정할 수 있다.\n② 이 시스템 테스팅에서는 내부 구조를 볼 수 없고 구문 커버리지도 측정할 수 없다 → 이 레벨에서는 쓸 수 없다.\n③ 4.2.5: 어떤 기법·접근법을 한 테스트 레벨에서 쓸 수 없으면, 테스터는 테스트 전략에 따라 다른 테스트 레벨을 고른다.\n검산: 표 6에서도 구문 테스팅은 '시스템 테스트 레벨에서 타당?' NO라 시스템 테스팅용으로 선택되지 않았다. 표 6은 시스템 테스팅 기준의 선택만 보여 준다.","why":["4.2.5는 한 레벨에서 쓸 수 없으면 다른 테스트 레벨을 고르라고 한다. 바로 빼지 않는다.","4.2.5: 표준 권고에서 벗어나는 것은 신중히 검토하고 근거를 대야 한다.","구문 커버리지는 화이트박스 기법인 구문 테스팅으로 측정하는 구조 커버리지다. 블랙박스 기법인 동등 분할로 대신할 수 없다.","정답. 한 테스트 레벨에서 쓸 수 없으면 테스트 전략에 따라 다른 테스트 레벨을 고른다(4.2.5)."],"ref":"4.2.5"},{"id":"h1-001","ch":1,"lo":"AuT-1.1","k":2,"q":"공급업체(supplier) S가 OEM(완성차 업체)에 납품하는 차체 제어 SW에 대해, OEM이 다음과 같이 요구했다.\n- 이번 프로젝트는 차종 하나만 개발한다.\n- 새 기능은 추가하지 않는다. 대신 고객이 트림과 옵션 패키지에 따라 기존 기능을 골라 조합할 수 있게 한다. 그래서 차종 하나에 기능 조합이 수십 가지가 된다.\n- 조합이 이렇게 많아졌어도 고객은 이전 차종과 같거나 더 높은 품질을 기대한다.\n\n이 상황에 나타난 어려움을 실라버스 1.1의 구분으로 가장 정확하게 짝지은 것은?","opts":["기능 범위(range of functionality) 증가, 품질 요구사항 증가","차종 수와 복잡성 증가, 구성(configuration) 수 증가","구성(configuration) 수 증가, 품질 요구사항 증가","구성(configuration) 수 증가, 기능 범위 증가"],"ans":[2],"exp":"1.1의 네 가지 어려움에 상황을 하나씩 대 본다.\n① 차종 하나만 개발한다. 차종을 늘리다 차종당 수량이 줄어 공통 플랫폼으로 가는 '차종 수와 복잡성 증가'가 아니다.\n② 새 기능이 없다. '혁신 기능을 요구하면서 기존 기능도 유지'해 생기는 '기능 범위 증가'가 아니다.\n③ 고객이 차종 하나를 자기 희망에 맞추려 해서 기능 측면까지 포함한 구성이 많아진다. 1.1의 '구성 수 증가'다(\"including in terms of functionality\").\n④ 기능·복잡성이 늘어도 같거나 더 높은 품질을 기대한다. '품질 요구사항 증가'다.\n검산: 상황 문장 세 개 중 첫째·둘째는 해당 항목을 지우는 조건이고, 셋째 문장의 앞뒤가 ③과 ④에 하나씩 대응한다.\n함정 포인트: 옵션으로 '기능'을 고른다는 표현 때문에 기능 범위 증가가 끌리지만, 새 기능이 없다고 못 박았으므로 구성 수 증가다.","why":["새 기능은 추가하지 않는다고 했다. 기능 범위 증가는 혁신 기능 요구가 늘면서 생기는 어려움이다.","차종 하나만 개발하므로 차종 수와 복잡성 증가가 아니다. 품질 요구사항 증가도 빠졌다.","정답. 기능까지 포함한 구성이 차종 하나에 많아지는 것은 구성 수 증가, 같거나 더 높은 품질 기대는 품질 요구사항 증가다.","새 기능이 없으므로 기능 범위 증가가 아니다. 품질 기대가 높아진 점(품질 요구사항 증가)이 빠졌다."],"trap":"현업에서는 옵션 패키지로 기능을 고르는 것을 '기능이 늘었다'고 말하기 쉽다. 실라버스 1.1은 혁신 기능 요구로 기능 수가 늘어나는 것을 기능 범위 증가로, 차종 하나를 개인 희망에 맞추려고 기능까지 조합하는 것을 구성 수 증가로 나눈다.","ref":"1.1","hard":true},{"id":"h1-002","ch":1,"lo":"AuT-1.1","k":2,"q":"어느 공급업체(supplier)의 신규 입사자 교육 자료에 실라버스 1.1을 요약한 진술 i~v가 있다.\ni. 차종이 늘어 차종당 수량이 줄면 개발·생산 비용이 늘어난다. 이를 감당하려고 생산자는 여러 차종을 공통 플랫폼의 변형으로 개발한다.\nii. 플랫폼 개발이 단일 차종 개발보다 훨씬 복잡한 이유는 수많은 변형을 통제해야 해서가 아니라, 플랫폼 하나에 들어가는 기능 수가 단일 차종보다 많기 때문이다.\niii. 구성(configuration) 수 증가는 고객이 차종을 자기 희망에 맞추려는 데서 나온다. 다만 이 구성에 기능 측면의 구성은 들어가지 않는다.\niv. 기능 범위가 넓어지는 것은 최종 고객이 혁신 기능을 계속 요구하면서 기존 기능도 유지되기를 원하기 때문이다.\nv. 시간·비용·범위는 서로 경쟁하는 프로젝트 목표(프로젝트 관리 삼각형)이므로, OEM(완성차 업체)과 공급업체는 예산과 일정을 지키려면 고객의 품질 기대를 낮추는 쪽으로 가야 한다.\n\n실라버스 1.1과 맞는 진술만 모두 고른 것은?","opts":["i, ii","i, iv","iii, iv","iv, v"],"ans":[1],"exp":"진술마다 1.1 원문과 대조한다.\ni: 차종 증가 → 차종당 수량 감소 → 개발·생산 비용 증가 → 공통 플랫폼의 변형으로 개발. 원문 순서와 같다(맞음).\nii: 원문은 플랫폼 개발이 더 복잡한 이유를 \"the need to keep control over the many possible variations\"라고 적는다. 변형 통제를 이유에서 빼고 기능 수로 바꿨다(틀림).\niii: 원문은 구성이 \"including in terms of functionality\"라고 해 기능 측면도 포함한다(틀림).\niv: 혁신 기능 요구 + 기존 기능 유지 → 기능 범위 증가. 원문과 같다(맞음).\nv: 목표가 경쟁하므로 OEM과 공급업체는 복잡성 증가, 품질 요구사항 증가, 예산 축소 속에서도 개발 기간을 줄이는 더 효율적인 시스템 개발을 추구해야 한다. 고객은 같거나 더 높은 품질을 기대하므로 품질 기대를 낮추는 방향은 원문과 반대다(틀림).\n검산: 맞는 진술은 i, iv 두 개뿐이고, 이 둘만 담은 조합은 하나다.\n함정 포인트: ii는 '플랫폼이 더 복잡하다'는 결론은 맞고 이유만 바꿨다. 결론만 보고 고르면 틀린다.\n(v2.1 기준. 2018년판은 프로젝트 관리 삼각형을 시간·비용·품질로 적었다. v의 판정은 어느 판으로 봐도 틀림이다.)","why":["ii가 틀렸다. 플랫폼 개발이 복잡한 이유는 수많은 변형을 통제해야 하기 때문이다. 맞는 진술 iv도 빠졌다.","정답. i과 iv만 1.1 원문과 같다.","iii이 틀렸다. 구성 수 증가에는 기능 측면의 구성도 들어간다. 맞는 진술 i도 빠졌다.","v가 틀렸고, 맞는 진술 i이 빠졌다. 고객은 같거나 더 높은 품질을 기대하므로 품질 기대를 낮추는 것은 1.1이 말하는 방향이 아니다."],"trap":"플랫폼이 복잡한 이유를 '기능이 많아서'로 떠올리기 쉬워 ii가 맞아 보인다. 실라버스 1.1이 든 이유는 수많은 변형(variation)을 통제해야 한다는 점이다.","ref":"1.1","hard":true},{"id":"h1-003","ch":1,"lo":"AuT-1.2","k":1,"q":"OEM(완성차 업체)과 공급업체(supplier)가 공동 개발 계약을 앞두고, ISO 26262나 ASPICE 같은 표준을 따르는 것이 프로젝트에 주는 영향을 정리했다.\n실라버스 1.2와 맞는 것을 두 개 고르시오.","opts":["표준은 통일된 명명, 더 나은 투명성 등으로 프로세스 효율을 높인다. 예를 들어 품질은 안정적으로 유지하며 개발 기간이나 비용을 줄인다.","표준을 따르면 프로세스 효율은 높아지지만, 그 대가로 표준 도입 초기에는 제품 품질이 일시적으로 떨어지는 것을 감수해야 한다.","표준은 감사(audit)의 근거가 되지만, 감사자(auditor)가 표준으로 평가할 수 있는 것은 프로세스의 품질뿐이고 제품의 품질은 아니다.","표준이 영향을 주는 주요 프로젝트 측면에는 시간·비용·품질뿐 아니라 프로젝트 리스크와 제품 리스크도 들어간다.","표준이 쉽게 해 주는 협업은 조직 내부 협업이다. OEM과 공급업체 사이 같은 외부 협업은 표준이 아니라 계약으로만 다룬다."],"ans":[0,3],"exp":"1.2 원문: 표준은 시간, 비용, 품질, 프로젝트 리스크, 제품 리스크 같은 주요 프로젝트 측면에 영향을 준다. 표준은 통일된 명명, 더 나은 투명성, 쉬운 협업(내부와 외부 모두), 재사용성 증가, 축적된 경험(Best Practice)으로 프로세스 효율을 높인다. 예시는 \"reducing development time or cost while maintaining stable quality\"다. 또 표준은 감사의 근거가 되어 감사자가 제품이나 프로세스의 품질을 평가할 수 있게 하고, 계약·규제 조항과 가이드라인의 일부가 된다.\n함정 포인트: ASPICE 심사처럼 프로세스를 보는 평가에 익숙하면 '감사는 프로세스만 본다'는 보기가 끌린다. 1.2는 \"quality of a product or process\"라고 둘 다 적는다.","why":["정답. 효율 향상 수단과 '안정된 품질을 유지하면서 기간·비용 절감'이라는 예시가 1.2 원문과 같다.","1.2의 예시는 품질을 안정적으로 유지하면서 기간이나 비용을 줄이는 것이다. 품질 저하를 감수한다는 내용은 없다.","1.2는 감사자가 제품이나 프로세스의 품질을 평가할 수 있다고 한다. 제품을 뺀 것이 틀렸다.","정답. 1.2는 표준이 영향을 주는 측면으로 시간, 비용, 품질, 프로젝트 리스크, 제품 리스크를 든다.","1.2는 쉬운 협업을 내부와 외부 모두로 든다. 또 표준 자체가 계약 조항의 일부가 되기도 한다."],"trap":"ASPICE 심사처럼 프로세스를 평가하는 감사를 주로 겪어 '표준 기반 감사 = 프로세스 평가'로 생각하기 쉽다. 실라버스 1.2는 감사자가 제품이나 프로세스의 품질을 평가할 수 있다고 적는다.","ref":"1.2","hard":true},{"id":"h1-004","ch":1,"lo":"AuT-1.3","k":1,"q":"한 ECU의 시스템 수명주기(system lifecycle) 동안 다음 테스트 관련 활동이 있었다.\n1. 개발에 들어가기 전에 테스트 전략과 테스트 목적을 정한다.\n2. 양산 라인에서 조립을 마친 ECU가 출하할 준비가 됐는지 확인한다.\n3. 차량이 판매된 뒤, 운행 중인 차량에 배포할 결함 수정 SW를 테스트해 차량이 계속 신뢰할 수 있게 동작하도록 한다.\n4. 단종된 ECU를 폐기하면서, 저장돼 있던 데이터가 새 시스템으로 제대로 옮겨졌는지 확인한다.\n\nA. concept(개념)  B. production(생산)  C. utilization(활용)  D. support(지원)  E. retirement(폐기)\n\n각 활동을 실라버스 1.3의 단계(단계별 전형적인 테스트 활동 기준)에 바르게 연결한 것은?","opts":["1-A, 2-B, 3-C, 4-E","1-A, 2-B, 3-D, 4-D","1-A, 2-E, 3-D, 4-E","1-A, 2-B, 3-D, 4-E"],"ans":[3],"exp":"1.3의 단계별 전형적인 테스트 활동과 하나씩 맞춘다.\n① 테스트 전략과 테스트 목적을 정하는 테스트 계획 → concept(A).\n② 출하 준비 상태를 확인하는 EOL 테스트(end of line testing) → production(B).\n③ 지속적인 신뢰도를 확보하는 유지보수 테스팅(maintenance testing) → support(D).\n④ 폐기나 데이터 이전을 밸리데이션하는 마이그레이션 테스팅(migration testing) → retirement(E).\nutilization(C)은 \"Typically, no test activities are performed.\"라서 어느 활동에도 맞지 않는다.\n검산: 1-A, 2-B, 3-D, 4-E를 다시 원문 6개 항목에 대 보면 네 쌍 모두 일치하고 C만 남는다.\n함정 포인트: 3은 '차량이 판매된 뒤 운행 중'이라는 말 때문에 utilization으로 고르기 쉽다.\n(v2.1 기준 표현. 2018년판은 단계별 테스트 활동 이름만 들고 '출하 준비 확인', '지속적인 신뢰도', '폐기·데이터 이전 밸리데이션' 같은 목적 설명은 없다. 단계와 활동의 짝은 두 판이 같다.)","why":["3을 utilization에 연결했다. utilization 단계에는 보통 테스트 활동이 없고, 유지보수 테스팅은 support 단계다.","4를 support에 연결했다. 데이터 이전·폐기를 확인하는 마이그레이션 테스팅은 retirement 단계다.","2를 retirement에 연결했다. 양산 라인의 출하 준비 확인은 production 단계의 EOL 테스트(end of line testing)다.","정답. concept-테스트 계획, production-EOL 테스트, support-유지보수 테스팅, retirement-마이그레이션 테스팅이다."],"trap":"현업에서는 차량이 고객 손에 넘어가 쓰이는 기간을 통틀어 '운행 단계'로 묶어 생각하기 쉽다. 실라버스 1.3은 utilization에는 보통 테스트 활동이 없고, 유지보수 테스팅은 support 단계에 둔다.","ref":"1.3","hard":true},{"id":"h1-005","ch":1,"lo":"AuT-1.3","k":1,"q":"시스템 수명주기(system lifecycle)에 대한 설명으로 실라버스 1.3과 맞는 것은?","opts":["6단계 수명주기는 차량 전체에 적용된다. ECU 같은 구성품은 차량 수명주기와 별개로 자체 단계 구성을 따른다.","정해진 시작 조건과 완료 조건을 가진 마일스톤이 성숙한 프로세스를 보장하고, 시스템 수명주기를 6개 단계로 구조화한다.","EOL 테스트는 end of life 테스트를 줄인 말로, 차량이 수명을 다하는 retirement(폐기) 단계의 전형적인 테스트 활동이다.","ISO 26262의 safety lifecycle(안전 수명주기)은 시스템 수명주기와 단계 구성이 전혀 달라서, 두 수명주기의 단계를 서로 대응시킬 수 없다."],"ans":[1],"exp":"1.3 원문: \"Milestones with defined entry criteria and exit criteria ensure mature processes and structure the system lifecycle into six stages\". 정해진 시작 조건(entry criteria)과 완료 조건(exit criteria)을 가진 마일스톤이 성숙한 프로세스를 보장하고 수명주기를 6단계로 나눈다.\n나머지는 원문과 어긋난다. 수명주기는 차량과 그 구성품(각주: HW·SW를 포함한 ECU와 컴포넌트)에 적용된다. EOL 테스트는 end of line testing으로 production 단계에서 준비 상태를 확인하고, retirement 단계의 활동은 마이그레이션 테스팅이다. ISO 26262의 safety lifecycle(안전 수명주기)은 비슷한 단계로 이뤄진다(각주).\n함정 포인트: EOL을 end of life로 읽으면 retirement와 묶게 된다. 실라버스의 EOL은 양산 라인 끝(end of line)의 테스트다.","why":["1.3은 차량과 그 구성품의 수명주기라고 하고, 각주에서 구성품을 HW·SW를 포함한 ECU와 컴포넌트라고 적는다. 구성품을 따로 떼지 않는다.","정답. 마일스톤의 시작·완료 조건이 성숙한 프로세스를 보장하고 수명주기를 6단계로 구조화한다는 1.3 원문과 같다.","EOL 테스트는 end of line testing이며 production 단계에서 준비 상태를 확인하는 활동이다. retirement 단계의 활동은 마이그레이션 테스팅이다.","1.3 각주는 ISO 26262의 safety lifecycle이 비슷한 단계로 이뤄진다고 적는다."],"trap":"EOL을 end of life(수명 종료)로 읽으면 retirement와 묶기 쉽다. 실라버스 1.3의 EOL 테스트는 end of line testing이고 production 단계 활동이다.","ref":"1.3","hard":true},{"id":"h1-006","ch":1,"lo":"AuT-1.4","k":1,"q":"SW 릴리스를 앞두고 테스터가 맡은 일을 정리하고 있다.\n다음 중 테스터가 최종 테스트 보고서(final test report)로 전달하는 정보가 아니라, 릴리스와 관련된 추가 산출물을 만드는 데 참여하는 일에 해당하는 것은?","opts":["응답 시간, 자원 사용량 같은 평가된 품질 특성을 정리한다.","완료 조건을 달성했을 때 release level에 근거한 릴리스 권고 정보를 제공한다.","변경 사항의 우선순위를 정하고 변경 여부 결정에 참여한다.","테스트한 항목(tested items)을 정리해 보고한다."],"ans":[2],"exp":"1.4는 테스터의 기여를 두 묶음으로 나눈다.\n① 최종 테스트 보고서로 전달하는 정보: 테스트한 항목, 평가된 품질 특성(예: 응답 시간, 자원 사용량), 알려진 결함, 제품 메트릭, 완료 조건 달성 시 Best Practice Guidelines에 정의된 release level(예: 폐쇄된 시험장 테스트, 공공 도로 테스트, installation recommendation)에 근거한 릴리스 권고 정보.\n② 릴리스 관련 추가 산출물 작성 참여: 변경 사항의 우선순위를 정하고 변경 결정에 참여, 구현 순서를 위한 기능 우선순위 결정.\n변경 우선순위와 변경 결정 참여만 ②에 속한다.\n함정 포인트: 릴리스 권고를 보고서와 별개의 결정 문서로 생각하면 그 보기를 고르게 된다. 1.4는 릴리스 권고 정보를 최종 테스트 보고서 항목으로 든다.\n(v2.1 기준. 2018년판은 '테스트한 항목과 성능 특성(버전 포함)'을 한 항목으로 묶었고, 릴리스 권고 근거를 release level이 아니라 release regulation으로 적었다. 변경 결정 참여가 추가 산출물 쪽이라는 점은 두 판이 같다.)","why":["평가된 품질 특성은 최종 테스트 보고서로 전달하는 정보다.","릴리스 권고 정보는 최종 테스트 보고서로 전달하는 정보다.","정답. 변경 사항의 우선순위를 정하고 변경 결정에 참여하는 것은 최종 테스트 보고서 밖에서 테스터가 참여하는 릴리스 관련 산출물이다.","테스트한 항목은 최종 테스트 보고서로 전달하는 정보다."],"trap":"릴리스 권고를 테스트 보고서와 별개의 승인 문서나 회의 결정으로 생각하기 쉽다. 실라버스 1.4는 릴리스 권고 정보를 최종 테스트 보고서가 담는 항목으로 든다.","ref":"1.4","hard":true},{"id":"h1-101","ch":1,"lo":"AuT-1.1","k":2,"q":"한 OEM(완성차 업체)이 다음 연식 모델에 차로 유지 보조와 원격 주차 기능을 새로 넣기로 했다. 고객 조사에서는 기존 기능을 하나도 빼지 말라는 요구가 많았다. 이 모델은 모든 고객에게 같은 사양으로 판매된다.\n실라버스 1.1의 구분으로 이 상황에 가장 잘 맞는 어려움과 그 설명은?","opts":["구성(configuration) 수 증가: 새 기능이 더해질수록 차종 하나에 준비할 기능 구성이 늘어난다.","차종 수와 복잡성 증가: 기능이 늘어난 모델은 공통 플랫폼의 변형으로 따로 개발해야 한다.","기능 범위(range of functionality) 증가: 혁신 기능을 요구하면서 기존 기능도 유지되길 원한다.","품질 요구사항 증가: 기존 기능을 빼지 말라는 요구는 이전과 같은 품질을 유지하라는 요구다."],"ans":[2],"exp":"1.1은 자동차 제품 개발의 어려움으로 차종 수와 복잡성 증가, 기능 범위 증가, 구성 수 증가, 품질 요구사항 증가를 든다. 기능 범위 증가는 최종 고객이 기존 기능을 유지하면서 더 많은 혁신을 요구해 기능 범위가 넓어지는 것이다. 지문은 새 기능 추가와 기존 기능 유지 요구가 함께 나오므로 여기에 맞는다. 모든 고객이 같은 사양을 받으므로 고객이 자기 희망에 맞춰 차를 바꾸는 구성 수 증가가 아니고, 차종도 하나라 차종 수 증가도 아니다.","why":["구성 수 증가는 최종 고객이 차종을 자기 희망에 맞추려 해서 생긴다(1.1). 지문은 모든 고객이 같은 사양을 받는다.","차종 수와 복잡성 증가는 차종이 늘어 차종당 수량이 줄고, 그래서 공통 플랫폼의 변형으로 개발하는 이야기다(1.1). 지문은 차종 하나다.","정답. 혁신 기능 요구와 기존 기능 유지가 함께 있어 기능 범위가 넓어진다(1.1).","품질 요구사항 증가는 기능과 복잡성이 늘어도 고객이 같거나 더 높은 품질을 기대하는 것이다(1.1). 기능을 빼지 말라는 요구는 품질 이야기가 아니다."],"trap":"현업에서는 기능이 늘어나는 것과 옵션·사양 조합이 늘어나는 것을 묶어 '사양 증가'라고 부르기도 한다. 실라버스는 고객이 차를 자기 희망에 맞추려는 데서 나오는 것을 구성 수 증가로, 혁신 기능 요구와 기존 기능 유지에서 나오는 것을 기능 범위 증가로 나눈다(1.1).","ref":"1.1","hard":true},{"id":"h1-102","ch":1,"lo":"AuT-1.2","k":1,"q":"OEM(완성차 업체)과 공급업체(supplier)가 잘 정립된 기술 가이드라인을 담은 표준을 함께 따르기로 했다.\n실라버스 1.2에 따르면 이런 가이드라인이 리스크와 결함에 대해 하는 일은?","opts":["리스크와 결함을 조기에 발견하도록 돕고, 발견한 리스크와 결함을 해결하는 것도 돕는다.","리스크와 결함을 조기에 발견하도록 돕지만, 해결 방법은 표준이 아니라 프로젝트가 따로 정한다.","리스크와 결함을 개발 후반의 통합 단계에서 한꺼번에 발견하고 해결하도록 돕는다.","제품 리스크와 결함을 줄이도록 돕지만, 프로젝트 리스크는 표준이 영향을 주는 측면이 아니다."],"ans":[0],"exp":"1.2: 표준은 잘 정립된 기술 가이드라인으로 리스크와 결함을 조기에 발견하고, 발견한 리스크와 결함을 해결하도록 돕는다. 같은 절은 표준이 영향을 주는 주요 프로젝트 측면으로 시간, 비용, 품질, 프로젝트 리스크, 제품 리스크를 든다.","why":["정답. 조기 발견과 해결을 모두 돕는다(1.2).","1.2는 가이드라인이 발견한 리스크와 결함의 해결까지 돕는다고 쓴다. 해결을 표준 밖으로 빼지 않는다.","1.2는 리스크와 결함을 '조기에' 발견하도록 돕는다고 쓴다. 후반에 한꺼번에 찾는 것이 아니다.","1.2는 표준이 영향을 주는 측면에 프로젝트 리스크와 제품 리스크를 함께 든다."],"ref":"1.2","hard":true},{"id":"h1-103","ch":1,"lo":"AuT-1.3","k":1,"q":"ISO/IEC/IEEE 24748-1에 따른 시스템 수명주기(system lifecycle) 6단계 가운데 utilization(활용) 단계에 대한 실라버스 1.3의 설명은?","opts":["유지보수 테스팅(maintenance testing)으로 계속 신뢰할 수 있게 동작하는지 확인한다.","EOL 테스트(end of line testing)로 출하할 준비가 됐는지를 확인한다.","6단계를 흔히 3개 주요 단계로 압축할 때 남는 단계로, 대부분의 테스팅이 일어난다.","일반적으로(typically) 이 단계에서는 테스트 활동을 수행하지 않는다."],"ans":[3],"exp":"1.3의 6단계와 전형적인 테스트 활동: concept(개념) 테스트 계획, development(개발) 테스트 분석부터 테스트 완료까지, production(생산) EOL 테스트, utilization(활용) 일반적으로 테스트 활동 없음, support(지원) 유지보수 테스팅, retirement(폐기) 마이그레이션 테스팅. 자동차 제품 개발 프로세스는 흔히 이를 concept, development, production 3단계로 압축하고, 대부분의 테스팅과 릴리스 활동이 여기서 일어난다.\n(v2.1 기준. 2018년판은 utilization을 'no test activities'로 적어 '일반적으로'라는 말이 없었다. 어느 판이든 utilization에는 전형적인 테스트 활동이 없다.)","why":["유지보수 테스팅은 support(지원) 단계의 테스트 활동이다(1.3).","EOL 테스트는 production(생산) 단계의 테스트 활동이다(1.3).","3개 주요 단계는 concept, development, production이다(1.3). utilization은 여기에 들지 않는다.","정답. utilization에서는 일반적으로 테스트 활동을 수행하지 않는다(1.3)."],"trap":"차량이 운행되는 동안에도 SW 업데이트나 현장 문제 대응으로 테스트를 한다고 생각하면 utilization에 유지보수 테스팅을 붙이기 쉽다. 실라버스는 유지보수 테스팅을 support(지원) 단계에 두고, utilization은 일반적으로 테스트 활동이 없다고 쓴다(1.3).","ref":"1.3","hard":true},{"id":"h1-104","ch":1,"lo":"AuT-1.4","k":1,"q":"실라버스 1.4에 따르면, 테스터가 최종 테스트 보고서(final test report)로 전달하는 릴리스 권고(release recommendation) 정보는 무엇에 근거하는가?","opts":["완료 조건을 달성했을 때, ISO 26262에 따라 정해진 ASIL 등급","완료 조건을 달성했을 때, Best Practice Guidelines에 정의된 release level","완료 조건을 달성했을 때, 최근 ASPICE 심사에서 받은 프로세스 capability level","완료 조건 달성 여부와 관계없이, 최종 테스트 보고서에 남은 알려진 결함의 수"],"ans":[1],"exp":"1.4: 최종 테스트 보고서 항목 가운데 하나가 '완료 조건을 달성했을 때, Best Practice Guidelines에 정의된 release level에 근거한 릴리스 권고 정보'다. 나머지 항목은 테스트한 항목, 평가된 품질 특성, 알려진 결함, 제품 메트릭이다.\n(v2.1 기준. 2018년판은 근거를 'release regulation'이라고 썼다.)","why":["ASIL은 ISO 26262의 안전 무결성 수준이다(2.2.4.1). 1.4는 릴리스 권고 정보의 근거로 release level을 든다.","정답. 완료 조건 달성 시 Best Practice Guidelines의 release level에 근거한다(1.4).","capability level은 ASPICE 심사에서 프로세스 capability를 나타낸다(2.1.1.3). 릴리스 권고의 근거가 아니다.","1.4는 릴리스 권고 정보를 완료 조건을 달성했을 때 준다고 쓴다. 알려진 결함은 보고서의 별도 항목이다."],"trap":"'level'이 붙은 말이 여럿이다. ASIL은 ISO 26262의 안전 무결성 수준, capability level은 ASPICE 심사 결과, release level은 Best Practice Guidelines에 정의된 릴리스 수준이다. 릴리스 권고 정보의 근거는 release level이다(1.4).","ref":"1.4","hard":true},{"id":"h2-001","ch":2,"lo":"AuT-2.1.1.1","k":1,"q":"ASPICE 심사 모델의 두 차원(dimension)에 대한 다음 진술을 보자.\ni. process dimension에서 각 프로세스의 목적(purpose), 결과(results), 필요한 활동(base practice)을 정의한다.\nii. capability dimension의 process attribute는 측정 가능한 특성이며, capability level을 나눈다.\niii. process attribute에는 모든 프로세스에 공통인 generic attribute만 있고, 프로세스별(process specific) attribute는 없다.\niv. ISO/IEC 33020은 process reference model(PRM)을 만드는 기반이 된다.\nv. 이 모델로 프로세스(process dimension)를 그 capability(capability dimension) 관점에서 심사할 수 있다.\n실라버스와 맞는 진술만 모두 고른 것은?","opts":["i, ii, iv, v","i, ii, v","ii, iii, v","i, iii, iv"],"ans":[1],"exp":"2.1.1.1: process dimension에서 ASPICE는 PRM을 정의하고, 프로세스마다 목적, 결과, 필요한 활동(base practice), information item을 정의한다(i 맞음). capability dimension에서는 capability level을 나누는 process attribute(측정 가능한 특성)를 정의한다(ii 맞음). 프로세스마다 generic attribute와 process specific attribute가 모두 있으므로 iii은 틀리다. ISO/IEC 33020은 프로세스 capability 심사의 기반이지 PRM의 기반이 아니므로 iv도 틀리다. 이 모델로 프로세스를 capability 관점에서 심사할 수 있다(v 맞음).\n함정 포인트: iv는 33020이라는 맞는 이름을 엉뚱한 대상(PRM)에 붙인 진술이다. 이름만 기억하면 'i, ii, iv, v'를 고르게 된다.\n(v2.1 기준 표현. 2018년판은 process attribute를 '프로세스 capability의 측정 가능한 특성'이라고만 썼고, 'capability level을 나눈다'는 표현은 없었다. iii, iv가 틀린 이유는 두 판이 같다.)","why":["iv가 틀리다. ISO/IEC 33020은 프로세스 capability 심사의 기반이지 PRM의 기반이 아니다(2.1.1.1).","정답. i, ii, v는 2.1.1.1 문장과 같다.","iii이 틀리다. 프로세스마다 generic attribute와 process specific attribute가 모두 있다. 맞는 진술 i도 빠졌다(2.1.1.1).","iii과 iv가 틀리고, 맞는 진술 ii와 v가 빠졌다(2.1.1.1)."],"trap":"ASPICE 심사라고 하면 ISO/IEC 33020부터 떠올리기 쉬워, PRM을 포함한 심사 모델 전체가 33020에 기반한다고 뭉뚱그리기 쉽다. 실라버스는 33020을 프로세스 capability 심사의 기반으로만 든다(2.1.1.1).","ref":"2.1.1.1","hard":true},{"id":"h2-002","ch":2,"lo":"AuT-2.1.1.3","k":2,"q":"공급업체(supplier) A의 software verification(SWE.6) 테스트 프로세스를 심사한 결과는 다음과 같다.\n- 프로젝트마다 테스트 관리자가 테스트 목적을 정하고, 테스트 활동을 계획하고, 편차가 생기면 대응한다.\n- 작업 산출물(work product)에 대한 요구사항이 정해져 있고, 프로젝트 구성원이 산출물을 리뷰하고 승인한다.\n- 다만 테스트 프로세스가 프로젝트마다 제각각이고, 끝난 프로젝트에서 얻은 발견 사항은 어디에도 반영되지 않는다.\nA사는 다음 심사에서 Level 3(established process) 설명에 맞는 모습을 보이려 한다. 실라버스의 Level 3 설명에 비추어 새로 갖춰야 할 것으로 가장 적절한 것은?","opts":["작업 산출물의 리뷰와 승인을 프로젝트 구성원 대신 독립된 품질 조직이 맡도록 바꾼다.","테스트 실행 중 편차가 생기면 테스트 목적을 맞추도록 진행 방식을 조정하는 절차를 문서로 만든다.","테스트 관리자가 테스트 활동 계획을 더 잘게 나눠 모든 테스트 케이스의 실행 일정을 관리한다.","프로젝트가 표준화된 테스트 프로세스를 쓰고, 발견 사항을 지속적 개선에 쓰도록 한다."],"ans":[3],"exp":"2.1.1.3: Level 3(established process)은 프로젝트가 표준화된 테스트 프로세스를 쓰고, 발견 사항을 지속적 개선에 쓰는 수준이다. A사에 없는 것이 바로 이 두 가지다. 테스트 목적·계획·편차 대응, 작업 산출물 요구사항 정의, 프로젝트 구성원의 리뷰·승인은 Level 2(managed process) 설명이고, A사는 이미 갖췄다.\n함정 포인트: '독립 조직이 승인하면 성숙도가 올라간다'는 감각으로 리뷰 주체를 바꾸는 보기를 고르기 쉽지만, 실라버스의 Level 3 설명에는 리뷰 주체 이야기가 없다.","why":["Level 3 설명에 리뷰·승인 주체를 바꾸라는 내용은 없다. Level 2 설명도 프로젝트 구성원이 리뷰·승인한다고 쓴다(2.1.1.3).","실행 중 진행 방식 조정은 Level 2 설명이고, A사는 이미 편차에 대응하고 있다(2.1.1.3).","테스트 활동 계획은 Level 2 설명에 속한다. 계획을 더 잘게 나눠도 Level 3의 표준화와 지속적 개선은 생기지 않는다(2.1.1.3).","정답. Level 3은 표준화된 테스트 프로세스 사용과 발견 사항을 통한 지속적 개선이다(2.1.1.3)."],"trap":"현업에서는 독립된 품질 조직의 승인을 프로세스 성숙도의 표시로 여기기 쉽다. 실라버스의 Level 3 설명은 표준화된 테스트 프로세스와 발견 사항을 통한 지속적 개선이고, 리뷰·승인은 Level 2 설명에서 프로젝트 구성원이 맡는다(2.1.1.3).","ref":"2.1.1.3","hard":true},{"id":"h2-003","ch":2,"lo":"AuT-2.1.1.3","k":2,"q":"SWE.6 테스트 프로세스 심사에서 두 프로젝트가 똑같이 '테스트 실행 방식이 일정하지 않다'는 지적을 받았다.\n- 프로젝트 P: 테스트 관리자가 테스트 목적을 정하고 테스트 활동을 계획·감독한다. HiL(hardware-in-the-loop) 벤치 고장으로 일정이 밀리자, 테스트 목적을 맞추려고 남은 테스트의 실행 순서를 바꿨다. 작업 산출물 요구사항이 정해져 있고 프로젝트 구성원이 리뷰·승인한다. 이 방식은 이 프로젝트에서만 정해 쓴다.\n- 프로젝트 Q: 완전한 테스트 계획은 보이지 않고, 릴리스마다 테스터가 그때그때 다른 방식으로 테스트한다. 그래도 프로세스는 목적을 달성하고, 테스터는 요구사항 충족 정도를 보여 줄 수 있다.\n실라버스의 capability level 설명에 비추어 두 프로젝트를 가장 적절하게 판단한 것은?","opts":["두 프로젝트 모두 실행 방식이 일정하지 않으므로, P와 Q 모두 Level 1 설명에 맞는다.","P는 Level 2 설명에 맞지만, Q는 완전한 테스트 계획이 없으므로 Level 0 설명에 맞는다.","P의 순서 변경은 목적을 맞추려는 실행 중 조정이라 Level 2, Q는 Level 1 설명에 맞는다.","P의 순서 변경은 발견 사항을 개선에 쓴 것이라 Level 3 설명에 맞고, Q는 Level 1 설명에 맞는다."],"ans":[2],"exp":"2.1.1.3: Level 1(performed process)은 구현된 프로세스가 목적을 달성하지만 일관되지 않게 수행될 수도 있는 수준이다. 실라버스 예시도 '완전한 테스트 계획은 보이지 않지만 테스터가 요구사항 충족 정도를 보여 줄 수 있다'이다. Q가 여기에 맞는다.\nLevel 2(managed process)는 프로젝트가 테스트 실행에서 테스트 프로세스를 계획·감독하고, 상황에 따라 테스트 목적을 맞추려고 테스트 실행 중 진행 방식을 조정하는 수준이다. 작업 산출물 요구사항 정의와 프로젝트 구성원의 리뷰·승인도 Level 2 설명에 있다. P의 순서 변경은 이 '조정'에 해당한다.\nP는 이 프로젝트에서만 쓰는 방식이라 표준화된 테스트 프로세스를 쓰는 Level 3(established process) 설명에는 맞지 않는다.\n함정 포인트: '실행 방식이 바뀌었다'는 겉모습만 보면 P와 Q를 똑같이 Level 1로 묶게 되고, 계획서가 없다는 점만 보면 Q를 Level 0으로 내리게 된다.","why":["P의 변경은 계획·감독 아래 테스트 목적을 맞추려는 조정이다. 이것은 Level 2 설명에 있는 내용이고, Level 1의 '일관되지 않은 수행'과 다르다(2.1.1.3).","Q는 완전한 계획이 없어도 목적을 달성하고 요구사항 충족 정도를 보여 줄 수 있으므로 Level 1 설명에 맞는다. Level 0은 목적을 달성하지 못하는 경우다(2.1.1.3).","정답. P는 테스트 목적을 맞추려는 실행 중 조정과 산출물 리뷰·승인이 있어 Level 2, Q는 일관되지 않아도 목적을 달성해 Level 1 설명에 맞는다(2.1.1.3).","Level 3은 프로젝트가 표준화된 테스트 프로세스를 쓰고 발견 사항을 지속적 개선에 쓰는 수준이다. P는 이 프로젝트에서만 쓰는 방식이고, 순서 변경은 실행 중 조정이다(2.1.1.3)."],"trap":"현업에서는 계획과 다르게 실행했다는 사실 자체를 프로세스 미흡으로 보기 쉽다. 실라버스는 상황에 따라 테스트 목적을 맞추려고 테스트 실행 중 진행 방식을 조정하는 것을 Level 2(managed process) 설명에 넣는다(2.1.1.3).","ref":"2.1.1.3","hard":true},{"id":"h2-004","ch":2,"lo":"AuT-2.1.1.3","k":2,"q":"어느 ECU 프로젝트의 테스트 프로세스가 Level 1(performed process)로 평가됐다. 프로세스는 목적을 달성하고 테스터는 요구사항 충족 정도를 보여 줄 수 있지만, 테스트 계획과 관리는 체계적이지 않다.\n이 프로젝트가 실라버스의 Level 2(managed process) 설명에 맞추려면 새로 갖춰야 할 것 두 개를 고르시오.","opts":["조직 테스트 전략을 정의하고, 테스트 완료 후 테스트 관리자가 그 전략을 발전시킨다.","상황에 따라 테스트 실행 중 진행 방식을 조정해 테스트 목적을 달성한다.","심사원(assessor)이 작업 산출물을 리뷰하고 승인한다.","테스터가 요구사항이 어느 정도 충족됐는지 보여 줄 수 있게 한다.","작업 산출물 요구사항을 정하고, 프로젝트 구성원이 산출물을 리뷰·승인한다."],"ans":[1,4],"exp":"2.1.1.3: Level 2는 프로젝트가 테스트 실행에서 테스트 프로세스를 계획·감독하고, 상황에 따라 테스트 목적을 맞추려고 진행 방식을 조정하는 수준이다. 또 작업 산출물에 대한 요구사항이 정해져 있고, 프로젝트 구성원이 산출물을 리뷰하고 승인한다. 두 정답이 여기에 해당한다. 조직 테스트 전략과 그 발전은 Level 3 예시이고, 요구사항 충족 정도 제시는 Level 1 예시로 이 프로젝트가 이미 갖춘 것이다.\n함정 포인트: '리뷰·승인'이라는 말이 맞아 보여 심사원 보기를 고르기 쉽지만, 실라버스가 말하는 주체는 프로젝트 구성원이다.\n(v2.1 표현 기준. 2018년판은 프로젝트 구성원이 작업 산출물을 '확인(checks)'하고 승인한다고 썼다. 뜻은 같다.)","why":["Level 3(established process)의 예시다. Level 2에 필요한 것보다 한 단계 위다(2.1.1.3).","정답. Level 2 설명에 '상황에 따라 테스트 실행 중 진행 방식을 조정한다'가 있다(2.1.1.3).","리뷰·승인 주체가 틀렸다. Level 2 설명에서 작업 산출물을 리뷰·승인하는 사람은 프로젝트 구성원이다(2.1.1.3).","Level 1 예시로, 이 프로젝트는 이미 갖추고 있다. 새로 갖출 것이 아니다(2.1.1.3).","정답. 작업 산출물 요구사항 정의와 프로젝트 구성원의 리뷰·승인은 Level 2 설명이다(2.1.1.3)."],"ref":"2.1.1.3","hard":true},{"id":"h2-005","ch":2,"lo":"AuT-2.1.2.1","k":1,"q":"ASPICE 4.0의 테스트 관련 프로세스(1~4)와, 각 프로세스가 평가 기준으로 삼는 것(A~D)을 바르게 짝지은 것은?\n1. software component verification and integration verification(SWE.5)\n2. software verification(SWE.6)\n3. software unit verification(SWE.4)\n4. system verification(SYS.5)\nA. software requirements analysis(SWE.1)\nB. software architectural design(SWE.2)\nC. software detailed design(SWE.3)\nD. system requirements analysis(SYS.2)","opts":["1-A, 2-B, 3-C, 4-D","1-C, 2-A, 3-B, 4-D","1-B, 2-A, 3-C, 4-D","1-B, 2-D, 3-C, 4-A"],"ans":[2],"exp":"2.1.2.1: SWE.4는 소프트웨어의 컴포넌트(원문 components of the software)를 상세 설계(SWE.3) 기준으로, SWE.5는 통합된 소프트웨어를 software architectural design(SWE.2) 기준으로, SWE.6은 통합된 소프트웨어를 software requirements analysis(SWE.1) 기준으로, SYS.5는 통합된 시스템을 system requirements analysis(SYS.2) 기준으로 평가한다.\n함정 포인트: 통합 테스트를 요구사항 문서로 설계하는 습관이 있으면 SWE.5와 SWE.6의 기준을 뒤바꾼 짝을 고르게 된다.\n(v2.1 기준 이름. 2018년판(ASPICE 3.1)에서는 SWE.5 software integration test, SWE.6 software qualification test, SYS.5 system qualification test였고, 기준 산출물도 software architecture, software requirements, system requirements로 불렀다. 짝 자체는 같다.)","why":["SWE.5와 SWE.6의 기준이 뒤바뀌었다. SWE.5는 SWE.2, SWE.6은 SWE.1 기준이다(2.1.2.1).","SWE.4와 SWE.5의 기준이 뒤바뀌었다. SWE.4는 상세 설계(SWE.3), SWE.5는 아키텍처 설계(SWE.2) 기준이다(2.1.2.1).","정답. 네 짝 모두 2.1.2.1과 같다.","SWE.6과 SYS.5의 기준이 뒤바뀌었다. SWE.6은 SWE.1, SYS.5는 SYS.2 기준이다(2.1.2.1)."],"trap":"소프트웨어 통합 테스트 케이스도 소프트웨어 요구사항 문서를 보고 뽑는다고 생각하면 SWE.5의 기준을 SWE.1로 고르기 쉽다. 실라버스는 SWE.5가 software architectural design(SWE.2)을 기준으로 평가한다고 쓴다(2.1.2.1).","ref":"2.1.2.1","hard":true},{"id":"h2-006","ch":2,"lo":"AuT-2.1.2.2","k":2,"q":"software verification(SWE.6) 심사에서 심사원(assessor)이 process attribute(PA)별 capability indicator의 이행 정도를 아래 표처럼 판단했다.\n각 PA의 평가 등급(rating level)을 바르게 묶은 것은?","table":{"head":["process attribute","capability indicator 이행 정도"],"rows":[["PA 1.1 process performance","86%"],["PA 2.1 process performance management","85%"],["PA 2.2 work product management","15%"]]},"opts":["PA 1.1 F, PA 2.1 F, PA 2.2 P","PA 1.1 F, PA 2.1 L, PA 2.2 N","PA 1.1 L, PA 2.1 L, PA 2.2 N","PA 1.1 F, PA 2.1 L, PA 2.2 P"],"ans":[1],"exp":"2.1.2.2의 네 평가 등급 구간: N(None) 0% 이상 15% 이하, P(Partly) 15% 초과 50% 이하, L(Largely) 50% 초과 85% 이하, F(Fully) 85% 초과 100% 이하.\n- PA 1.1: 86%는 85%를 넘으므로 F.\n- PA 2.1: 85%는 L 구간의 상한(≤ 85%)에 들어가므로 L. F가 되려면 85%를 넘어야 한다.\n- PA 2.2: 15%는 N 구간의 상한(≤ 15%)에 들어가므로 N. P가 되려면 15%를 넘어야 한다.\n이 문제는 평가 등급만 묻는다.\n함정 포인트: 경계값 85%와 15%를 위쪽 등급으로 올려 읽으면 'F, F, P'를 고르게 된다.\n(v2.1 기준 이름. 2018년판에서 PA 2.1 이름은 performance management였다. 등급 구간은 두 판이 같다.)","why":["85%는 F가 아니라 L, 15%는 P가 아니라 N이다. 두 경계값 모두 아래쪽 등급의 상한에 들어간다(2.1.2.2).","정답. 86%는 F, 85%는 L, 15%는 N이다(2.1.2.2).","86%는 85%를 넘으므로 L이 아니라 F다(2.1.2.2).","15%는 N 구간(0% 이상 15% 이하)에 들어간다. P는 15%를 넘어야 한다(2.1.2.2)."],"trap":"경계값 분석에 익숙한 테스터도 'Fully는 85% 이상'처럼 경계를 위쪽 등급에 넣어 기억하기 쉽다. 실라버스 구간은 L이 '> 50% ~ ≤ 85%', F가 '> 85% ~ ≤ 100%'라서 85%는 L이다(2.1.2.2).","ref":"2.1.2.2","hard":true},{"id":"h2-007","ch":2,"lo":"AuT-2.1.2.2","k":2,"q":"software verification(SWE.6) 심사를 앞두고 테스트 팀장이 이렇게 말했다.\n'PA 2.2 work product management는 고객에게 납품하는 테스트 계획서와 테스트 보고서만 대상이다. 팀 안에서 쓰는 테스트 로그나 리뷰 기록은 품질을 따로 볼 필요가 없다.'\n실라버스 설명에 비추어 가장 적절한 판단은?","opts":["팀장 말이 맞다. PA 2.2는 고객에게 납품하는 테스트 산출물의 품질만 다룬다.","ASPICE 4.0은 테스트웨어에 요구사항을 두지 않으므로, PA 2.2는 테스트 프로세스에 적용되지 않는다.","PA 2.2는 문서화된 모든 정보에 적용되므로, 팀 내부 테스트 로그와 리뷰 기록도 그 대상이다.","팀 내부 기록은 PA 2.2가 아니라 PA 3.1 process definition에서 다룬다."],"ans":[2],"exp":"2.1.2.2: 실라버스가 SWE.6을 예로 든 PA 2.2 work product management의 예시는 '테스터가 테스트웨어의 품질을 확인한다'이다. 각주는 work product management가 문서화된 모든 정보에 적용된다고 쓴다. 납품 여부로 대상을 가르지 않는다.\n함정 포인트: 2.1.2.4의 'ASPICE 4.0은 테스트웨어에 요구사항을 두지 않는다'는 맞는 문장을 PA 2.2에 끌어다 붙이면 테스트웨어가 심사 대상이 아니라고 오해하게 된다. 2.1.2.4는 테스트웨어 대신 테스트 중 생기는 특정 정보의 문서화에 요구사항을 둔다는 뜻이다.\n(v2.1 기준. 2018년판은 PA 2.2 예시를 '테스트 문서의 품질 확인'으로 썼고 '문서화된 모든 정보' 각주가 없었다. ASPICE 4.0 문장도 v2.1에만 있다.)","why":["실라버스 각주는 work product management가 문서화된 모든 정보에 적용된다고 쓴다. 납품 여부로 범위를 줄이지 않는다(2.1.2.2).","2.1.2.4 문장은 테스트웨어 대신 테스트 중 생기는 정보의 문서화에 요구사항을 둔다는 뜻이다. 실라버스는 SWE.6의 PA 2.2 예시로 테스트웨어 품질 확인을 든다(2.1.2.2, 2.1.2.4).","정답. 각주: work product management는 문서화된 모든 정보에 적용된다(2.1.2.2).","PA 3.1 예시는 테스트 프로세스 책임자가 조직 테스트 전략을 정의하는 것이다. 작업 산출물 관리는 PA 2.2다(2.1.2.2)."],"trap":"현업에서는 심사 대상 문서를 고객 납품 문서로 좁혀 준비하기 쉽다. 실라버스는 work product management가 문서화된 모든 정보에 적용된다고 각주로 밝힌다(2.1.2.2).","ref":"2.1.2.2","hard":true},{"id":"h2-008","ch":2,"lo":"AuT-2.1.2.2","k":2,"q":"software verification(SWE.6) 심사에서 다음이 확인됐다.\n- 테스트 프로세스 책임자가 조직 테스트 전략을 정의해 두었다.\n- 프로젝트 테스터는 그 전략을 실제 테스트에 적용한다.\n- 테스터는 테스트웨어의 품질을 확인한다.\n- 그러나 테스트 활동 계획이 없고, 진행 상황을 감독하거나 통제하는 사람도 없다.\n실라버스가 SWE.6을 예로 든 process attribute(PA) 설명에 비추어, 마지막 항목은 어느 PA의 예시와 관련된 약점인가?","opts":["PA 3.2","PA 1.1","PA 2.2","PA 2.1"],"ans":[3],"exp":"2.1.2.2가 SWE.6을 예로 든 PA 설명: PA 1.1 process performance는 테스터가 테스트 프로세스를 따르는 것, PA 2.1 process performance management는 테스터가 테스트 활동을 계획·감독·통제하는 것, PA 2.2 work product management는 테스터가 테스트웨어 품질을 확인하는 것, PA 3.1 process definition은 테스트 프로세스 책임자가 조직 테스트 전략을 정의하는 것, PA 3.2 process deployment는 테스터가 PA 3.1에서 정의한 테스트 전략을 적용하는 것이다. 계획·감독·통제가 없다는 것은 PA 2.1 예시와 관련된 약점이다. 나머지 항목은 PA 3.1, PA 3.2, PA 2.2 예시에 해당하며 이미 확인됐다.\n함정 포인트: '전략을 적용한다'와 '활동을 관리한다'를 같은 일로 보면 PA 3.2를 고르게 된다.\n(v2.1 기준 이름. 2018년판에서 PA 2.1 이름은 performance management였고, PA 2.2와 PA 3.1 예시는 '테스트 문서 품질 확인', '일반 프로젝트 전략 정의'로 썼다. 정답 근거인 PA 2.1 예시(계획·감독·통제)는 두 판이 같다.)","why":["PA 3.2 예시는 테스터가 정의된 테스트 전략을 적용하는 것이다. 이 프로젝트는 이미 적용하고 있다(2.1.2.2).","PA 1.1 예시는 테스터가 테스트 프로세스를 따르는 것이다. 계획·감독·통제는 PA 1.1 예시가 아니다(2.1.2.2).","PA 2.2 예시는 테스트웨어 품질 확인이다. 이 프로젝트는 이미 하고 있다(2.1.2.2).","정답. PA 2.1 예시는 테스터가 테스트 활동을 계획·감독·통제하는 것이다(2.1.2.2)."],"ref":"2.1.2.2","hard":true},{"id":"h2-009","ch":2,"lo":"AuT-2.1.2.3","k":2,"q":"어느 공급업체의 테스트 관리자가 ASPICE에 맞춘 테스트 전략(test strategy)을 준비하며 다음 메모를 남겼다.\ni. 테스트 전략은 테스트 계획(test planning) 중에 테스트 관리자가 만든다.\nii. 테스트 지침(test guidelines), 프로젝트 목표, 계약 요구사항과 규제 요구사항을 테스트 전략의 기반으로 삼는다.\niii. 상위 테스트 레벨의 테스트 환경이 훨씬 비싸므로, 자동차 환경에서는 조기 테스팅(early testing) 원리 대신 비용 기준으로 테스트 시점을 정한다.\niv. 테스트 전략에는 레벨별 테스트 환경과, 어떤 테스트를 어느 테스트 환경에서 해야 하는지를 정한다.\nv. 테스트 전략은 테스트 프로세스마다 둘 필요 없이 조직 전체에 하나만 둔다.\n실라버스와 맞는 메모만 모두 고른 것은?","opts":["i, ii, iii, iv","i, ii, iv","ii, iv, v","i, iii, v"],"ans":[1],"exp":"2.1.2.3: 테스트 관리자가 테스트 계획 중에 테스트 전략을 만들고(i), 테스트 지침, 프로젝트 목표, 계약 및 규제 요구사항이 그 기반이다(ii). 테스트 전략은 레벨별 테스트 환경과 어떤 테스트를 어느 환경에서 할지를 정한다(iv). iii은 틀리다. 실라버스는 조기 테스팅 원리가 자동차 환경의 소프트웨어 테스팅에도 적용된다고 쓰고, 상위 레벨 환경의 비용은 여기에 더해 고려할 측면으로 든다. v도 틀리다. ASPICE는 2.1.2.1의 테스트 프로세스마다 테스트 전략을 요구한다.\n함정 포인트: iii은 비용 문제라는 맞는 배경에 '조기 테스팅 대신'이라는 틀린 결론을 붙였다. 비용 이야기에 끌리면 'i, ii, iii, iv'를 고르게 된다.","why":["iii이 틀리다. 조기 테스팅 원리는 자동차 환경의 소프트웨어 테스팅에도 적용된다(2.1.2.3).","정답. i, ii, iv는 2.1.2.3 문장과 같다.","v가 틀리고, 맞는 메모 i이 빠졌다. ASPICE는 테스트 프로세스마다 테스트 전략을 요구한다(2.1.2.3).","iii과 v가 틀리고, 맞는 메모 ii와 iv가 빠졌다(2.1.2.3)."],"trap":"HiL(hardware-in-the-loop) 벤치나 시제품 ECU 비용 때문에 '비싼 환경에서 몰아서 테스트한다'는 쪽으로 판단하기 쉽다. 실라버스는 조기 테스팅이 자동차 환경에도 적용된다고 한 뒤, 상위 레벨 환경 비용을 이유로 테스트 전략이 레벨별 환경과 테스트 배치를 정한다고 쓴다(2.1.2.3).","ref":"2.1.2.3","hard":true},{"id":"h2-010","ch":2,"lo":"AuT-2.1.2.3","k":2,"q":"ASPICE 4.0 심사를 준비하는 공급업체에 OEM(완성차 업체)이 물었다. '각 테스트 프로세스의 테스트 전략은 어떤 information item으로 보여 줄 겁니까?'\n실라버스 설명에 비추어 가장 적절한 답은?","opts":["08-60 Verification measures다. 테스트 전략이 곧 verification measures이고 보통 테스트 계획서에 적는다.","15-52 Verification results다. 전략대로 했다는 근거는 테스트 보고서와 베리피케이션 로그로만 보여 줄 수 있다.","따로 없다. ASPICE 4.0은 테스트웨어에 요구사항을 두지 않으므로 테스트 전략도 information item이 아니다.","criteria for regression verification 문서다. 테스트 전략의 핵심 부분이므로 이 문서가 전략 전체를 대신한다."],"ans":[0],"exp":"2.1.2.3은 'ASPICE는 각 테스트 프로세스에 테스트 전략(즉, verification measures)을 요구한다'고 쓴다. 2.1.2.4는 테스트 활동에 요구되는 information item으로 08-60 Verification measures(예: 시뮬레이션, 동적 테스트, 정적 테스트)를 들고, 이것을 보통 테스트 계획서에 문서화한다고 쓴다. 두 문장을 이으면 테스트 전략은 08-60으로 보여 준다.\n함정 포인트: 2.1.2.4의 '테스트웨어에 요구사항을 두지 않는다'만 기억하면 '따로 없다'를 고르게 된다. 그 문장 바로 뒤에서 ASPICE는 테스트 중 생기는 특정 정보의 문서화를 요구하며 08-60과 15-52를 든다.\n(v2.1 기준. 2018년판(ASPICE 3.1)은 테스트 전략을 base practice로 요구한다고 썼고, 테스트 문서를 work product WP 08-50, 08-52(테스트 계획서), 13-50으로 설명했다.)","why":["정답. 테스트 전략은 verification measures이고(2.1.2.3), 08-60 Verification measures는 보통 테스트 계획서에 문서화한다(2.1.2.4).","15-52는 베리피케이션 로그, 테스트 보고서, 결함 보고서 같은 verification results를 담는다. 전략(수단)이 아니라 실행 결과다(2.1.2.4).","ASPICE 4.0은 테스트웨어 대신 테스트 중 생기는 특정 정보의 문서화를 요구하며, 테스트 활동에 08-60과 15-52를 요구한다(2.1.2.4).","criteria for regression verification은 테스트 전략의 핵심 '부분'이다. 전략 전체를 대신하지 않는다(2.1.2.3)."],"trap":"현업에서는 테스트 전략을 테스트 계획서와 다른 별도 '전략서'로 생각하기 쉽다. 실라버스는 ASPICE의 테스트 전략을 verification measures로 보고, 08-60 Verification measures는 보통 테스트 계획서에 문서화한다고 쓴다(2.1.2.3, 2.1.2.4).","ref":"2.1.2.3, 2.1.2.4","hard":true},{"id":"h2-011","ch":2,"lo":"AuT-2.1.2.3","k":2,"q":"브레이크 제어 ECU 소프트웨어의 릴리스 R3에서 모듈 두 개가 바뀌었다. 리그레션 테스트 범위를 정하는 회의에서 여러 의견이 나왔다.\nASPICE의 criteria for regression verification에 대한 실라버스 설명과 맞는 의견 두 개를 고르시오.","opts":["criteria for regression verification으로 리그레션 테스트 선택의 목적과 접근법을 정하자.","ASPICE가 릴리스마다 자동화된 테스트 케이스 전체를 다시 실행하라고 요구하니, 따로 고를 필요가 없다.","ASPICE가 정한 선택 방식은 리스크 기반뿐이므로, 리스크 분석 없이는 리그레션 테스트를 고를 수 없다.","테스트 관리자는 릴리스마다 자동화된 테스트 케이스 전체를 다시 실행하라고 테스터에게 요청할 수도 있다.","리그레션 테스트 선택의 어려운 점은 커버리지를 최대로 올리는 것이므로, 가장 많은 케이스를 고르자."],"ans":[0,3],"exp":"2.1.2.3: criteria for regression verification은 테스트 전략의 핵심 부분으로, 리그레션 테스트를 고를 때의 테스트 목적과 테스트 접근법을 정한다. 선택은 예를 들어 리스크 기반일 수 있고, 영향도 분석은 테스터가 리그레션 테스트로 집중할 영역을 찾는 데 도움이 된다. 한편 테스트 관리자가 릴리스마다 자동화된 테스트 케이스 전체를 반복하라고 요청할 수도 있다(may). 어려운 점은 테스트 케이스를 경제적으로 합리적으로 고르는 것(테스팅의 부가가치)이다.\n함정 포인트: '요청할 수도 있다(may)'를 'ASPICE가 요구한다'로, '예를 들어 리스크 기반일 수 있다'를 '리스크 기반뿐'으로 강도를 올리면 오답이 된다.\n(v2.1 기준 용어. 2018년판은 regression test strategy라고 불렀고, 리그레션 테스트 선택에서 정하는 것을 '목적과 기법(objective and technique)'이라고 썼다. 영향도 분석, 리스크 기반 예시, 자동화 테스트 전체 반복 요청, 경제적 선택이라는 어려움은 같다.)","why":["정답. criteria for regression verification은 리그레션 테스트를 고르기 위한 테스트 목적과 테스트 접근법을 정한다(2.1.2.3).","실라버스는 테스트 관리자가 그렇게 '요청할 수도 있다'고 쓸 뿐, ASPICE의 요구로 쓰지 않는다(2.1.2.3).","리스크 기반은 '예를 들어'로 든 선택 방식이다. 유일한 방식이 아니다(2.1.2.3).","정답. 테스트 관리자가 릴리스마다 자동화된 테스트 케이스 전체를 반복하라고 요청할 수도 있다(2.1.2.3).","실라버스가 말하는 어려운 점은 테스트 케이스를 경제적으로 합리적으로 고르는 것이다. 많이 고르는 것이 아니다(2.1.2.3)."],"trap":"빌드마다 자동 테스트 전체를 돌리는 팀이라면 그 운영을 ASPICE의 요구로 여기기 쉽다. 실라버스는 이를 테스트 관리자가 요청할 수도 있는 선택으로만 쓰고, 어려운 점은 테스트 케이스를 경제적으로 합리적으로 고르는 것이라고 한다(2.1.2.3).","ref":"2.1.2.3","hard":true},{"id":"h2-012","ch":2,"lo":"AuT-2.1.2.4","k":1,"q":"공급업체 테스트 팀이 ASPICE 4.0 심사를 준비하며 information item에 대해 다음과 같이 정리했다.\ni. ASPICE 4.0은 테스트웨어 자체에 요구사항을 두지 않고, 테스팅 중에 생기는 특정 정보의 문서화에 요구사항을 둔다.\nii. 08-60 Verification measures는 반드시 테스트 계획서 안에 문서화해야 한다.\niii. 15-52 Verification results의 예로 문서화된 베리피케이션 로그, 테스트 보고서, 결함 보고서가 있다.\niv. information item characteristics(IIC)는 ASPICE가 information item마다 정한 필수 양식이므로 그 목차를 그대로 따라야 한다.\nv. ASPICE가 information item마다 정한 IIC와 내용의 예는 프로세스 실행의 객관적 지표 역할을 한다.\n실라버스와 맞는 진술만 모두 고른 것은?","opts":["i, ii, iii, v","i, iii, iv","ii, iii, v","i, iii, v"],"ans":[3],"exp":"2.1.2.4: ASPICE 4.0은 테스트웨어에 요구사항을 두지 않고, 테스팅 중 생기는 특정 정보의 문서화에 요구사항을 둔다(i 맞음). 테스트 활동에 요구하는 information item은 08-60 Verification measures(예: 시뮬레이션, 동적 테스트, 정적 테스트)와 15-52 Verification results(예: 문서화된 베리피케이션 로그(verification logs), 테스트 보고서, 결함 보고서)다(iii 맞음). 08-60은 '보통(typically)' 테스트 계획서에 문서화한다고 했을 뿐이므로 '반드시'라고 한 ii는 틀리다. ASPICE는 information item마다 IIC와 내용의 '예(examples)'를 정하고, 이것이 프로세스 실행의 객관적 지표가 된다(v 맞음). 예를 든 것이지 필수 양식이 아니므로 iv는 틀리다.\n함정 포인트: ii와 iv는 원문의 '보통'과 '예'를 '반드시', '필수 양식'으로 강도를 올린 진술이다. 심사 준비 감각으로 읽으면 맞는 말처럼 보인다.\n(v2.1 기준. 2018년판(ASPICE 3.1)은 work product WP 08-50 테스트 명세, 08-52 테스트 계획서, 13-50 테스트 결과로 설명했고, '테스트웨어에 요구사항을 두지 않는다'는 문장이 없었다.)","why":["ii가 틀리다. 08-60은 '보통' 테스트 계획서에 문서화한다고 했을 뿐, 반드시 그래야 한다는 말은 없다(2.1.2.4).","iv가 틀리다. ASPICE는 IIC와 내용의 '예'를 정하며 필수 양식이 아니다. 맞는 진술 v도 빠졌다(2.1.2.4).","ii가 틀리고, 맞는 진술 i이 빠졌다(2.1.2.4).","정답. i, iii, v는 2.1.2.4 문장과 같다."],"ref":"2.1.2.4","hard":true},{"id":"h2-013","ch":2,"lo":"AuT-2.1.2.5","k":3,"q":"당신은 software unit verification(SWE.4) 담당 테스터로, 유닛 U(브레이크 압력 제한 로직)의 verification measures를 정의한다. 검증할 것은 세 가지다.\n(1) MISRA-C rule '소스 코드에 중첩 주석이 없어야 한다'의 준수\n(2) MISRA-C directive '개발자는 구현한 동작을 충분히 문서화해야 한다'의 준수\n(3) 상세 설계에 적힌 '입력 압력이 상한값을 넘으면 출력을 상한값으로 제한한다'는 동작\n실라버스 2.1.2.5가 든 verification measures 예시(테스트 데이터를 포함한 단위 테스트 케이스, 도구 지원 정적 분석, 리뷰)를 하나씩 배정할 때 가장 적절한 것은?","opts":["(1) 도구 지원 정적 분석, (2) 도구 지원 정적 분석, (3) 단위 테스트 케이스","(1) 도구 지원 정적 분석, (2) 리뷰, (3) 단위 테스트 케이스","(1) 단위 테스트 케이스, (2) 리뷰, (3) 도구 지원 정적 분석","(1) 리뷰, (2) 단위 테스트 케이스, (3) 도구 지원 정적 분석"],"ans":[1],"exp":"풀이 과정\n① 2.1.2.5의 예시 수단과 쓰임: (가) 테스트 데이터를 포함한 단위 테스트 케이스, (나) 코딩 가이드라인(예: MISRA-C) 준수를 평가하는 도구 지원 정적 분석, (다) 도구 지원 정적 분석으로 평가할 수 없는 소프트웨어 유닛이나 그 일부의 리뷰.\n② (1) rule: 4.1.1은 rule을 정적 분석 도구로 검증할 수 있다고 쓰고, 예로 '중첩 주석 금지'를 든다 → (나).\n③ (2) directive: 4.1.1은 directive가 정적 분석 도구로 완전히 검증되지 않고, 개발 프로세스나 소프트웨어 밖 문서의 세부 사항을 다룬다고 쓴다. 도구로 평가할 수 없는 부분이므로 → (다).\n④ (3) 상세 설계의 동작: 입력값에 따라 출력이 어떻게 되는지 보는 것이므로 상한값 초과 입력 같은 테스트 데이터를 넣은 단위 테스트 케이스 → (가). 실라버스에서 도구 지원 정적 분석은 코딩 가이드라인 준수를 평가하는 수단으로 나온다.\n검산 1: 정답 배정을 원문에 다시 대 봤다. (나)는 '코딩 가이드라인 준수 평가', (다)는 '도구로 평가할 수 없는 부분', (가)는 '테스트 데이터를 포함한 테스트 케이스'로 세 대상과 하나씩 맞는다.\n검산 2: 오답마다 틀린 배정을 하나 이상 찾았다. (2)를 정적 분석에 맡긴 보기는 directive가 도구로 완전히 검증되지 않는다는 4.1.1에 걸린다. (3)을 정적 분석에 맡긴 두 보기는 동작 검증을 코딩 가이드라인 평가 수단에 맡겼다.\n함정 포인트: MISRA-C 검사는 도구가 다 해 준다고 여기면 (2)까지 정적 분석에 맡긴 보기를 고르게 된다.\n(v2.1 기준 용어. 2018년판은 같은 예시를 verification strategy와 criteria for unit verification(SWE.4.BP.2)으로 설명했고, 예시 목록에 테스트 커버리지 목표가 더 있었다. 세 수단의 쓰임은 같다.)","why":["(2) directive는 정적 분석 도구로 완전히 검증되지 않는다. 도구로 평가할 수 없는 부분은 리뷰로 확인한다(2.1.2.5, 4.1.1).","정답. rule은 정적 분석, directive는 리뷰, 상세 설계의 동작은 단위 테스트 케이스다(2.1.2.5, 4.1.1).","(3) 동작 검증을 정적 분석에 맡겼고, 도구로 검증할 수 있는 (1) rule을 단위 테스트에 맡겼다(2.1.2.5, 4.1.1).","(3) 동작 검증을 정적 분석에 맡겼고, (2) 문서화 directive를 단위 테스트로 보려 했다(2.1.2.5, 4.1.1)."],"trap":"정적 분석 리포트에 MISRA-C 위반이 없으면 코딩 가이드라인 검증이 끝났다고 여기기 쉽다. 실라버스는 directive가 정적 분석 도구로 완전히 검증되지 않는다고 하고(4.1.1), 도구로 평가할 수 없는 부분의 리뷰를 유닛 베리피케이션 수단의 예로 든다(2.1.2.5).","ref":"2.1.2.5, 4.1.1","hard":true},{"id":"h2-014","ch":2,"lo":"AuT-2.1.2.5","k":3,"q":"개발자가 결함 D-31을 고치려고 유닛 V의 함수 f1을 수정했다. 유닛 V에는 수정하지 않은 함수 f2, f3도 있다. 수정한 f1에는 새 매크로 구간이 생겼는데, 프로젝트의 정적 분석 도구는 이 구간을 분석하지 못한다(도구 매뉴얼에 명시).\n테스터가 유닛 V의 verification measures에 따라 세운 계획 가운데 실라버스와 가장 잘 맞는 것은?","opts":["f1 정적 분석·단위 테스트, D-31 재현 테스트 재실행, f2·f3 정적 분석·단위 테스트 재실행(매크로 구간은 도구 결과로 갈음)","f1 정적 분석·단위 테스트와 매크로 구간 리뷰, D-31 재현 테스트 재실행, f2·f3은 단위 테스트만 자동 재실행","f1 정적 분석·단위 테스트와 매크로 구간 리뷰, D-31 재현 테스트 재실행, f2·f3 정적 분석·단위 테스트 재실행","f1 정적 분석·단위 테스트와 매크로 구간 리뷰, D-31 재현 테스트 재실행, f2·f3은 영향도 분석상 영향이 없어 반복 베리피케이션 생략"],"ans":[2],"exp":"풀이 과정\n① 2.1.2.5: 개발자가 유닛을 바꾸면 테스터도 그 변경을 평가해야 하므로, 유닛의 verification measures에는 criteria for regression verification이 들어간다. 그 내용은 (가) 변경된 코드의 베리피케이션, (나) 확인 테스팅(confirmation testing), (다) 변경되지 않은 부분의 반복 베리피케이션(정적·동적 리그레션 테스트)이다.\n② 변경된 f1 안의 매크로 구간은 도구가 분석하지 못한다. 2.1.2.5는 도구 지원 정적 분석으로 평가할 수 없는 부분에 리뷰를 예시 수단으로 들고, 2.1.2.1은 SWE.4가 정적 테스팅과 동적 테스팅을 요구한다고 쓴다. 따라서 (가)에서 이 구간을 정적으로 검증하는 데 맞는 예시 수단은 리뷰다.\n③ 계획마다 확인: 도구 결과로 갈음한 계획은 ②가 빠졌다. f2·f3을 단위 테스트만 돌리는 계획은 (다)의 정적 리그레션이 빠졌다. 영향도 분석으로 f2·f3을 생략한 계획은 (다)가 통째로 빠졌다. 남는 것은 f1 정적 분석·단위 테스트와 매크로 구간 리뷰, D-31 재현 테스트, f2·f3 정적 분석·단위 테스트 재실행을 모두 넣은 계획이다.\n검산 1: 정답 계획을 하나씩 대응시켰다. f1 정적 분석·단위 테스트와 리뷰는 (가)와 ②, D-31 재현 테스트는 (나), f2·f3 정적 분석·단위 테스트 재실행은 (다)다. 빈 칸이 없다.\n검산 2: 오답 세 개가 각각 어느 칸에서 비는지 다시 셌다. 도구 갈음 계획은 ②, 단위 테스트만 재실행하는 계획은 (다)의 정적 부분, 반복 베리피케이션 생략 계획은 (다) 전체가 빈다.\n함정 포인트: 영향도 분석은 2.1.2.3에서 리그레션 테스트의 집중 영역을 찾는 데 도움이 된다고 나오지만, 유닛 변경 시 변경되지 않은 부분의 반복 베리피케이션을 빼도 된다는 근거는 아니다.\n(v2.1 기준 용어. 2018년판은 유닛 베리피케이션 전략(verification strategy) 안의 regression strategy라고 불렀다. 변경 코드 베리피케이션, 확인 테스팅, 변경되지 않은 부분의 정적·동적 반복 베리피케이션이라는 내용은 같다.)","why":["매크로 구간은 도구가 분석하지 못하므로 도구 결과로 갈음할 수 없다. SWE.4는 정적 테스팅을 요구하고, 도구로 평가할 수 없는 부분의 수단으로 실라버스는 리뷰를 든다(2.1.2.1, 2.1.2.5).","변경되지 않은 부분의 반복 베리피케이션은 정적·동적 리그레션 테스트 둘 다다. 단위 테스트만으로는 정적 쪽이 빠진다(2.1.2.5).","정답. 변경 코드 베리피케이션(리뷰 포함), 확인 테스팅, 변경되지 않은 부분의 정적·동적 반복 베리피케이션이 모두 있다(2.1.2.5).","2.1.2.5는 유닛이 바뀌면 criteria for regression verification에 변경되지 않은 부분의 반복 베리피케이션이 들어간다고 쓴다. 영향도 분석으로 이를 생략해도 된다는 내용은 없다."],"trap":"지속적 통합(CI) 환경에서는 변경 안 된 함수를 단위 테스트만 자동으로 돌리고 끝내거나, 영향도 분석상 영향이 없으면 건너뛰기 쉽다. 실라버스는 유닛이 바뀌면 변경되지 않은 부분도 정적·동적 리그레션 테스트로 다시 검증한다고 쓴다(2.1.2.5).","ref":"2.1.2.5","hard":true},{"id":"h2-015","ch":2,"lo":"AuT-2.1.2.6","k":2,"q":"추적성 도구를 점검했더니 이해관계자 요구사항 → 시스템 요구사항 → 소프트웨어 요구사항까지는 링크가 이어져 있었다. 그런데 소프트웨어 요구사항이 소프트웨어 유닛에 바로 연결돼 있고, software architectural design과 software detailed design의 요소는 어디에도 연결돼 있지 않았다.\n팀장은 '요구사항에서 유닛까지 끝과 끝이 이어졌으니 충분하다'고 했다. 실라버스 설명에 비추어 가장 적절한 판단은?","opts":["수직 추적성은 모든 개발 레벨을 거쳐 소프트웨어 유닛까지 이어져야 하므로, 설계 레벨 링크를 보완해야 한다.","끝과 끝이 이어졌으므로 수직 추적성(vertical traceability)은 충족되고, 중간 레벨은 나중에 추가해도 된다.","빠진 것은 수평 추적성(horizontal traceability)이다. 설계 요소와 유닛 연결은 개발 결과와 테스트를 잇는 것이다.","설계 레벨 링크는 SUP.10이 요구하는 변경 요청 추적성에 속하므로, 변경 요청이 생길 때 만들면 된다."],"ans":[0],"exp":"2.1.2.6: 수직으로 ASPICE는 이해관계자 요구사항이 모든 레벨에 걸쳐 소프트웨어 유닛까지 연결될 것을 요구한다. 모든 개발 레벨을 거치는 연결이 관련 작업 산출물 사이의 일관성을 보장한다. 아키텍처 설계와 상세 설계를 건너뛴 링크는 이 '모든 레벨'을 채우지 못한다.\n함정 포인트: 양 끝이 연결되면 추적이 된다고 보기 쉽지만, 실라버스가 수직 추적성에서 말하는 것은 모든 레벨을 거치는 연결과 그로 인한 일관성이다.\n(v2.1 기준. 2018년판은 수직 추적성의 끝을 software components라고 썼다. 모든 개발 레벨에 걸친 연결이 일관성을 보장한다는 내용은 같다.)","why":["정답. 이해관계자 요구사항은 모든 레벨에 걸쳐 소프트웨어 유닛까지 연결돼야 한다(2.1.2.6).","실라버스는 '모든 레벨에 걸쳐' 유닛까지 연결해야 한다고 쓴다. 중간 레벨을 빼면 관련 작업 산출물 사이의 일관성을 보장하지 못한다(2.1.2.6).","수평 추적성은 개발 작업 결과와 대응 테스트 명세·테스트 결과 사이의 추적성이다. 설계 요소와 유닛은 둘 다 개발 작업 결과다(2.1.2.6).","SUP.10 관련 추적성은 변경 요청과 영향받는 작업 산출물, 변경 요청과 결함 보고서 사이의 것이다. 개발 레벨 사이의 연결은 수직 추적성이다(2.1.2.6)."],"trap":"요구사항을 코드나 유닛에 바로 거는 방식으로 도구를 운영하면 중간 설계 레벨을 빼먹기 쉽다. 실라버스는 수직 추적성이 모든 개발 레벨을 거쳐 소프트웨어 유닛까지 이어져야 한다고 쓴다(2.1.2.6).","ref":"2.1.2.6","hard":true},{"id":"h2-016","ch":2,"lo":"AuT-2.1.2.6","k":2,"q":"고객의 변경 요청으로 소프트웨어 요구사항 SR-12의 경고 조건이 '차속 60 km/h 이상'에서 '80 km/h 이상'으로 바뀌었다. software verification(SWE.6) 테스트 명세 TS-12는 SR-12와 양방향으로 연결돼 있지만, 내용은 아직 60 km/h 경계를 시험한다. 추적성 도구의 링크 커버리지는 100%로 나온다.\n실라버스의 ASPICE 추적성 설명에 비추어 가장 적절한 판단은?","opts":["링크가 있어도 SR-12와 TS-12의 내용이 어긋나면, 수평 추적성이 요구하는 일관성이 깨진 것이다.","양방향 링크가 있으므로 ASPICE 추적성 요구는 충족됐다. 내용 차이는 추적성과 무관한 결함 관리 영역이다.","요구사항과 테스트 명세의 연결은 수직 추적성이므로, 이해관계자 요구사항부터 링크를 다시 만들어야 한다.","추적성은 연결된 요소의 텍스트 일치만 다루고 의미상 일관성은 다루지 않으므로, ID와 제목만 맞으면 된다."],"ans":[0],"exp":"2.1.2.6: 수평으로 ASPICE는 개발 작업 결과와 그에 대응하는 테스트 명세·테스트 결과 사이의 추적성과 일관성(traceability and consistency)을 요구한다. 또 양방향 추적성으로 테스터는 연결된 요소 사이의 일관성을 텍스트상으로도 의미상으로도 확인할 수 있다. SR-12(개발 작업 결과)와 TS-12(대응 테스트 명세)는 링크는 있지만 내용이 어긋나 일관성이 깨졌다.\n함정 포인트: 링크 커버리지 100%를 추적성 완료로 읽으면 '요구 충족' 보기를 고르게 된다. 실라버스는 링크의 존재만이 아니라 연결된 요소 사이의 일관성까지 말한다.","why":["정답. 수평 추적성은 개발 작업 결과와 대응 테스트 명세 사이의 추적성과 일관성을 함께 요구한다(2.1.2.6).","실라버스는 수평으로 추적성과 일관성을 함께 요구한다. 링크만 있다고 충족되지 않는다(2.1.2.6).","개발 작업 결과와 대응 테스트 명세의 연결은 수평 추적성이다. 수직은 이해관계자 요구사항을 개발 레벨 전체에 걸쳐 잇는 것이다(2.1.2.6).","실라버스는 추적성으로 연결된 요소 사이의 일관성을 텍스트상으로도 의미상으로도 확인할 수 있다고 쓴다(2.1.2.6)."],"trap":"추적성 도구의 링크 커버리지가 100%면 추적성 작업이 끝났다고 보기 쉽다. 실라버스는 수평 추적성에서 추적성과 함께 일관성을 요구하고, 연결된 요소의 텍스트·의미 일관성 확인을 추적성의 쓰임으로 든다(2.1.2.6).","ref":"2.1.2.6","hard":true},{"id":"h2-051","ch":2,"lo":"AuT-2.1.1.1","k":1,"q":"ASPICE의 process dimension에서 ASPICE는 프로세스마다 목적, 결과, base practice, information item을 정의한다.\n실라버스가 이 가운데 information item을 풀어 쓴 것은?","opts":["그 프로세스를 수행하는 데 필요한 활동","capability level을 나누는 측정 가능한 특성","심사원이 매기는 N, P, L, F 평가 등급","작업 결과와 작업 산출물을 함께 이르는 것"],"ans":[3],"exp":"2.1.1.1: process dimension에서 ASPICE는 process reference model(PRM)을 정의하고, 프로세스마다 목적(purpose), 결과(results), 필요한 활동(즉 base practice), information item(즉 작업 결과와 작업 산출물(work product))을 정의한다. 필요한 활동은 base practice의 설명이고, 측정 가능한 특성은 capability dimension의 process attribute 설명이다. N, P, L, F는 process attribute를 평가하는 평가 등급(rating level)이다(2.1.2.2).","why":["필요한 활동(required actions)은 base practice를 풀어 쓴 말이다(2.1.1.1).","capability level을 나누는 측정 가능한 특성은 capability dimension의 process attribute다(2.1.1.1).","N, P, L, F는 process attribute 평가에 쓰는 네 평가 등급(rating level)이다(2.1.2.2). information item 설명이 아니다.","정답. information item은 작업 결과(work results)와 작업 산출물(work products)이다(2.1.1.1)."],"ref":"2.1.1.1","hard":true},{"id":"h2-053","ch":2,"lo":"AuT-2.1.2.1","k":1,"q":"실라버스 2.1.2.1이 정적 테스팅과 동적 테스팅을 요구한다고 명시한 ASPICE 프로세스는?","opts":["software verification(SWE.6)","software component verification and integration verification(SWE.5)","software unit verification(SWE.4)","system integration and integration verification(SYS.4)"],"ans":[2],"exp":"2.1.2.1: software unit verification(SWE.4)은 정적 테스팅과 동적 테스팅을 요구하며, software detailed design(SWE.3)을 기준으로 소프트웨어의 컴포넌트를 평가한다. 나머지 프로세스는 무엇을 무엇 기준으로 평가하는지만 적혀 있다. SWE.5는 통합된 소프트웨어를 SWE.2 기준으로, SWE.6은 통합된 소프트웨어를 SWE.1 기준으로, SYS.4는 통합된 시스템을 SYS.3 기준으로 평가한다.","why":["2.1.2.1은 SWE.6에 대해 통합된 소프트웨어를 SWE.1 기준으로 평가한다고만 쓴다. 정적·동적 테스팅 요구는 SWE.4에 적혀 있다.","2.1.2.1은 SWE.5에 대해 통합된 소프트웨어를 SWE.2 기준으로 평가한다고만 쓴다.","정답. SWE.4는 정적 테스팅과 동적 테스팅을 요구한다(2.1.2.1).","2.1.2.1은 SYS.4에 대해 통합된 시스템을 SYS.3 기준으로 평가한다고만 쓴다."],"trap":"단위 테스트라고 하면 테스트 케이스를 실행하는 동적 테스트만 떠올리기 쉽다. 실라버스는 SWE.4가 정적 테스팅과 동적 테스팅을 모두 요구한다고 쓴다(2.1.2.1).","ref":"2.1.2.1","hard":true},{"id":"h2-054","ch":2,"lo":"AuT-2.1.2.3","k":2,"q":"ASPICE가 테스트 전략(test strategy)을 어디에, 언제부터 요구하는지에 대한 실라버스 설명으로 맞는 것은?","opts":["capability level 3부터, 프로세스별 전략 대신 조직 테스트 전략 하나를 요구한다.","capability level 2부터, 테스트 프로세스마다 테스트 전략(verification measures)을 요구한다.","capability level 2부터, SWE.6과 SYS.5 같은 상위 레벨 테스트 프로세스에만 요구한다.","capability level과 관계없이, 심사원(assessor)이 심사 전에 정한 테스트 전략을 요구한다."],"ans":[1],"exp":"2.1.2.3: ASPICE는 capability level 2부터 각 테스트 프로세스(2.1.2.1의 SWE.4, SWE.5, SWE.6, SYS.4, SYS.5)마다 테스트 전략(즉 verification measures)을 요구한다. 테스트 전략은 테스트 관리자가 테스트 계획 중에 만들고, 테스트 지침, 프로젝트 목표, 계약 요구사항과 규제 요구사항을 기반으로 한다.\n(v2.1 기준. 2018년판은 테스트 전략을 base practice로 요구한다고 썼고 capability level 2라는 조건이 없었다.)","why":["조직 테스트 전략은 2.1.1.3에서 Level 3의 예로 나온다. 2.1.2.3은 capability level 2부터 테스트 프로세스마다 테스트 전략을 요구한다고 쓴다.","정답. capability level 2부터 각 테스트 프로세스마다 요구한다(2.1.2.3).","2.1.2.3은 2.1.2.1의 각 테스트 프로세스마다 요구한다고 쓴다. 상위 레벨 프로세스로 한정하지 않는다.","테스트 전략은 테스트 관리자가 테스트 계획 중에 만든다(2.1.2.3). 요구 시점도 capability level 2부터다."],"trap":"2.1.1.3의 Level 3 예시에 '조직 테스트 전략'이 나와서, 테스트 전략은 Level 3부터 조직 단위로 요구된다고 기억하기 쉽다. 2.1.2.3은 capability level 2부터 테스트 프로세스마다 테스트 전략을 요구한다고 쓴다.","ref":"2.1.2.3","hard":true},{"id":"h2-055","ch":2,"lo":"AuT-2.1.2.4","k":1,"q":"실라버스에 따르면 ASPICE 4.0이 테스트 활동에 요구하는 information item 두 가지는?","opts":["Test plan, Test specification","Test case specification, Test procedure specification","Test log, Test completion report","Verification measures, Verification results"],"ans":[3],"exp":"2.1.2.4: ASPICE 4.0은 테스트웨어 자체에 요구사항을 두지 않고, 테스팅 중에 생기는 특정 정보의 문서화를 요구한다. 테스트 활동에 요구하는 information item은 08-60 Verification measures(예: 시뮬레이션, 동적 테스트, 정적 테스트. 보통 테스트 계획서에 문서화)와 15-52 Verification results(예: 문서화된 베리피케이션 로그, 테스트 보고서, 결함 보고서) 두 가지다.\n(v2.1 기준. 2018년판은 ASPICE 3.1 기준으로 work product 08-50 Test specification, 08-52 Test plan, 13-50 Test result 등을 들었다.)","why":["테스트 계획서는 Verification measures를 보통 문서화하는 곳으로 나올 뿐 information item 이름이 아니다(2.1.2.4).","ASPICE 4.0은 테스트웨어 자체에 요구사항을 두지 않는다(2.1.2.4). 테스트 케이스·절차 명세를 종류별로 요구하지 않는다.","베리피케이션 로그와 테스트 보고서는 Verification results의 예로 나온다(2.1.2.4). 이 둘이 따로 요구되는 information item은 아니다.","정답. Verification measures와 Verification results다(2.1.2.4)."],"trap":"회사 산출물 목록이 ASPICE 3.1 시절 이름(Test specification, Test plan, Test result)으로 남아 있으면 그쪽을 고르기 쉽다. 실라버스 v2.1은 ASPICE 4.0 기준으로 Verification measures와 Verification results 두 가지를 든다(2.1.2.4).","ref":"2.1.2.4","hard":true},{"id":"h2-056","ch":2,"lo":"AuT-2.1.2.6","k":2,"q":"팀의 추적성 도구는 요구사항에서 테스트 케이스로 가는 링크만 관리한다. 테스트 케이스 쪽에서는 그 케이스가 어떤 요구사항을 검증하는지 거꾸로 찾을 수 없다.\n실라버스의 ASPICE 추적성 설명에 비추어 가장 적절한 판단은?","opts":["ASPICE는 양방향 추적성을 요구하므로, 테스트 케이스에서 요구사항으로 가는 방향도 갖춰야 한다.","양방향 추적성은 SUP.10의 변경 요청 링크에만 요구되므로, 지금 도구 구성으로 충분하다.","커버리지 평가에는 요구사항에서 테스트 케이스 방향만 있으면 되므로, 지금 구성으로 충분하다.","양방향은 수직 추적성에만 필요하고, 요구사항과 테스트를 잇는 수평 추적성은 단방향이면 된다."],"ans":[0],"exp":"2.1.2.6: CTFL과 마찬가지로 ASPICE도 양방향 추적성을 요구한다. 실라버스 각주는 이후 '추적성'이라고 하면 항상 양방향 추적성을 뜻한다고 밝힌다. 개발 작업 결과(요구사항)와 대응 테스트 명세를 잇는 수평 추적성도 여기에 들어간다. SUP.10.BP4의 변경 요청 추적성은 이에 더해(in addition) 요구되는 것이다.","why":["정답. ASPICE는 양방향 추적성을 요구한다(2.1.2.6).","SUP.10.BP4는 추가로 요구되는 것이다. 양방향 추적성 요구는 수직·수평 추적성에도 적용된다(2.1.2.6).","추적성은 커버리지 평가 말고도 영향도 분석, 상태 추적에 쓰이고, ASPICE는 양방향을 요구한다(2.1.2.6).","실라버스에서 추적성은 항상 양방향 추적성을 뜻한다(2.1.2.6 각주). 수평 추적성만 단방향으로 두지 않는다."],"trap":"현업 도구에서는 요구사항에 테스트 케이스를 매다는 한쪽 방향 링크만 써도 커버리지 보고서가 나온다. 실라버스는 ASPICE가 양방향 추적성을 요구한다고 쓰고, 이후 추적성은 항상 양방향을 뜻한다고 정한다(2.1.2.6).","ref":"2.1.2.6","hard":true},{"id":"h2-057","ch":2,"lo":"AuT-2.1.2.6","k":2,"q":"software verification(SWE.6)의 테스트 명세는 소프트웨어 요구사항과 링크돼 있다. 하지만 테스트 실행 결과는 테스트 보고서에만 있고, 어떤 요구사항이나 테스트 명세와도 링크돼 있지 않다.\n실라버스의 ASPICE 추적성 설명에 비추어 가장 적절한 판단은?","opts":["결과를 Verification results로 문서화했으므로, 추적성 요구와는 관계없이 이미 충족됐다.","결과와 요구사항을 잇는 것은 수직 추적성이므로, 이해관계자 요구사항부터 다시 링크한다.","수평 추적성은 개발 작업 결과와 테스트 명세에 더해 테스트 결과까지 이어야 하므로 보완한다.","테스트 결과 링크는 SUP.10이 요구하는 것이므로, 변경 요청이 생겼을 때 만들면 된다."],"ans":[2],"exp":"2.1.2.6: 수평 추적성으로 ASPICE는 개발 작업 결과와 그에 대응하는 테스트 명세 및 테스트 결과 사이의 추적성과 일관성을 요구한다. 지문은 요구사항과 테스트 명세는 이어져 있지만 테스트 결과가 빠져 있다. 수직 추적성은 이해관계자 요구사항을 모든 레벨을 거쳐 소프트웨어 유닛까지 잇는 것이고, SUP.10.BP4는 변경 요청과 영향을 받는 작업 산출물 사이의 추적성이다.","why":["Verification results로 문서화하는 것(2.1.2.4)과 따로, 수평 추적성은 개발 작업 결과와 테스트 결과 사이의 추적성을 요구한다(2.1.2.6).","수직 추적성은 이해관계자 요구사항을 소프트웨어 유닛까지 잇는 것이다(2.1.2.6). 개발 결과와 테스트 결과의 연결은 수평 추적성이다.","정답. 수평 추적성은 테스트 명세와 테스트 결과를 함께 다룬다(2.1.2.6).","SUP.10.BP4는 변경 요청과 영향받는 작업 산출물 사이의 추적성이다(2.1.2.6). 테스트 결과 연결은 수평 추적성에 속한다."],"ref":"2.1.2.6","hard":true},{"id":"h2-058","ch":2,"lo":"AuT-2.1.2.5","k":3,"q":"SWE.4 담당 테스터가 유닛 U의 verification measures에 리뷰(review)를 넣으려 한다. U에는 '실행 시간 1 ms 이하'라는 비기능 요구사항이 있다.\n실라버스에 비추어 리뷰의 쓰임으로 적절하지 **않은** 것은?","opts":["도구 지원 정적 분석으로는 평가할 수 없는 유닛 U의 일부를 리뷰로 확인한다.","리뷰로 유닛 U의 실제 실행 시간을 재서, 1 ms 이하라는 비기능 요구사항의 근거로 삼는다.","정적 테스트 기법인 리뷰를 동적 테스트 기법과 조합해 유닛 U가 요구사항을 지키는지 검증한다.","U가 바뀌면 바뀐 부분 중 도구 지원 정적 분석으로 평가할 수 없는 곳을 다시 리뷰해 확인한다."],"ans":[1],"exp":"풀이.\n1) 2.1.2.5가 든 software unit verification measures의 예는 테스트 데이터를 포함한 단위 테스트 케이스, 코딩 가이드라인 준수를 평가하는 도구 지원 정적 분석, 도구 지원 정적 분석으로 평가할 수 없는 유닛이나 유닛 일부의 리뷰다. 테스터는 정적 테스트 기법과 동적 테스트 기법을 조합해 유닛을 검증할 수 있다. 유닛이 바뀌면 verification measures에 들어 있는 criteria for regression verification에 따라 변경된 코드도 베리피케이션한다.\n2) 리뷰가 어떤 기법인지는 4.1 도입이 정한다. 정적 테스팅은 소프트웨어 개발의 작업 산출물을 실행하지 않고 검토하는 것이고, 사람이 하는 리뷰가 여기에 들어간다. 2.2.5도 리뷰를 정적 테스트 기법의 예로 든다.\n3) 보기마다 확인한다. 정적 분석으로 평가할 수 없는 부분의 리뷰는 2.1.2.5 예시 그대로다. 정적 기법(리뷰)과 동적 기법의 조합도 2.1.2.5 문장 그대로다. 바뀐 부분 중 정적 분석으로 평가할 수 없는 곳의 리뷰는 같은 예시를 변경 코드 베리피케이션에 쓴 것이다.\n4) 리뷰는 유닛을 실행하지 않으므로 실제 실행 시간을 잴 수 없다. 이 보기만 적절하지 않다.\n검산: 리뷰가 실행 없이 검토하는 정적 테스팅이라는 4.1 문장 하나로 실행 시간 측정 보기만 걸러지고, 나머지 셋은 2.1.2.5 문장으로 각각 방어된다.","why":["도구 지원 정적 분석으로 평가할 수 없는 유닛이나 유닛 일부의 리뷰는 2.1.2.5의 예시 그대로다.","정답. 리뷰는 작업 산출물을 실행하지 않고 검토하는 정적 테스팅이라(4.1) 실제 실행 시간을 잴 수 없다.","2.1.2.5는 테스터가 정적 테스트 기법과 동적 테스트 기법을 조합해 유닛을 검증할 수 있다고 쓴다.","유닛이 바뀌면 변경된 코드도 베리피케이션하고(2.1.2.5), 정적 분석으로 평가할 수 없는 부분은 리뷰가 예시 수단이다."],"trap":"리뷰는 2.1.2.5 예시에 있는 수단이라 어디에나 쓸 수 있다고 보기 쉽다. 리뷰는 실행하지 않고 검토하는 정적 테스팅이므로(4.1), 실행해야 알 수 있는 값은 재지 못한다.","ref":"2.1.2.5","hard":true},{"id":"h2-201","ch":2,"lo":"AuT-2.3.1","k":1,"q":"다음 중 두 항목이 모두 실라버스 2.3.1의 AUTOSAR 프로젝트 목표(project objective)인 것은?","opts":["자동차 소프트웨어용 개방형 아키텍처(open architecture) 정의 / 기능 영역마다 따로 쓰는 독자 소프트웨어 아키텍처 정의","소프트웨어의 portability 지원 / ASPICE 심사에서 쓸 개발 프로세스 평가 기준 정의","서로 다른 기능 영역(functional domain) 지원 / AUTOSAR가 아닌 시스템과의 데이터 교환 지원","파트너 간 협업(collaboration) 지원 / 테스트 레벨별 테스트 기법을 ASIL에 따라 권고"],"ans":[2],"exp":"실라버스 2.3.1이 드는 AUTOSAR 프로젝트 목표는 8개다. 소프트웨어의 portability 지원, 서로 다른 아키텍처와 하드웨어 variant에 걸친 scalability 지원, 서로 다른 기능 영역 지원, AUTOSAR가 아닌 시스템과의 데이터 교환 지원, 자동차 소프트웨어용 개방형 아키텍처 정의, dependable 시스템 개발 지원, 파트너 간 협업 지원, 적용 가능한 국제 자동차 표준과 state of the art 기술 지원.\n정답 보기의 두 항목은 모두 이 목록에 있다. 나머지 보기는 앞 항목만 목표이고, 뒤 항목은 목표가 아니거나 다른 표준의 역할이다.","why":["개방형 아키텍처 정의는 목표지만, 기능 영역마다 따로 쓰는 독자 아키텍처를 정의하는 것은 2.3.1 목록에 없다. 목록은 '서로 다른 기능 영역 지원'을 목표로 든다.","portability 지원은 목표지만, 개발 프로세스를 심사할 기준을 정의하는 것은 ASPICE의 역할이다(2.4.1).","두 항목 모두 2.3.1 목록에 있다.","파트너 간 협업 지원은 목표지만, ASIL에 따라 테스트 레벨별 테스트 기법을 권고하는 것은 ISO 26262 method table이다(2.4.2)."],"trap":"AUTOSAR를 'AUTOSAR ECU끼리 맞추는 표준'으로만 떠올리기 쉽지만, 2.3.1은 AUTOSAR가 아닌 시스템과의 데이터 교환 지원도 목표로 든다.","ref":"2.3.1","hard":true},{"id":"h2-202","ch":2,"lo":"AuT-2.3.3","k":1,"q":"실라버스 2.3.3에 비추어, AUTOSAR가 테스터의 업무에 주는 영향으로 옳은 것은?","opts":["실제 ECU에서 SW 컴포넌트 테스팅(software component testing)을 할 때 RTE 통신에 접근해, 실행 중인 SW-C의 동작을 관찰·제어할 수 있다.","SiL 같은 가상 환경에서 SW-C를 일찍 테스트하려면 RTE만 시뮬레이션하고, BSW는 실제 ECU에 들어가는 것을 그대로 붙여 써야 한다.","AUTOSAR acceptance test는 소프트웨어 시스템의 애플리케이션 레벨만 확인하며, 통신 레벨의 AUTOSAR 기능 준수는 다루지 않는다.","시스템 통합 테스팅(system integration testing)에서는 여러 ECU에 나뉜 기능이 모두 구현된 뒤에야 시스템 동작을 평가할 수 있다."],"ans":[0],"exp":"실라버스 2.3.3: 실제 ECU에서 하는 SW 컴포넌트 테스팅과 SW 통합 테스팅(software integration testing)에서는 테스터가 RTE의 통신에 접근한다. 그래서 런타임에 SW-C의 동작을 관찰하고 제어할 수 있다.\n2.3.3이 드는 나머지 영향도 함께 기억한다. 가상 환경(예: SiL)에서는 BSW와 RTE의 시뮬레이션으로 SW-C를 일찍 테스트한다. AUTOSAR acceptance test는 통신 레벨과 애플리케이션 레벨의 AUTOSAR 기능 준수를 보장하며 수행은 선택 사항이다. 시스템 통합 테스팅에서는 아직 구현되지 않은 기능을 시뮬레이션해 시스템 동작을 일찍 평가한다.","why":["2.3.3의 '실제 ECU에서의 SW 컴포넌트 테스팅·SW 통합 테스팅' 항목 그대로다.","2.3.3은 가상 환경에서 BSW와 RTE를 둘 다 시뮬레이션해 SW-C를 일찍 테스트한다고 한다.","AUTOSAR acceptance test는 통신 레벨과 애플리케이션 레벨 모두에서 AUTOSAR 기능의 준수를 보장한다(2.3.3).","2.3.3은 아직 구현되지 않은 기능을 시뮬레이션해 시스템 동작을 일찍 평가할 수 있다고 한다."],"ref":"2.3.3","hard":true},{"id":"h2-203","ch":2,"lo":"AuT-2.4.1","k":1,"q":"한 공급업체(supplier)가 ASIL B 아이템과 ASIL D 아이템을 함께 개발한다. 실라버스 2.4.1에 따르면 두 아이템 사이에서 달라질 수 있는 것은?","opts":["ASPICE가 심사(assessment)를 위해 개발 프로세스에 대해 정의한 심사 가능한 기준","ISO 26262가 리스크를 피하려고 다루는 장애(failure)의 범위, 곧 하드웨어 장애와 소프트웨어 장애","실라버스 표 2에서 ISTQB 테스트 레벨을 ISO 26262와 ASPICE의 테스트 레벨에 대응시킨 관계","ISO 26262가 정의하는, E/E 시스템 개발에서 테스터가 써야 할 테스트 프로세스와 method의 요구사항"],"ans":[3],"exp":"실라버스 2.4.1: ISO 26262는 E/E 시스템 개발에서 테스터가 써야 할 테스트 프로세스와 method의 요구사항을 정의하고, 이 요구사항은 아이템의 ASIL에 따라 달라진다. 그래서 ASIL B 아이템과 ASIL D 아이템은 이 요구사항이 다를 수 있다.\n반대로 ASPICE가 정의한 심사 가능한 기준은 ISO 26262와 달리 제품의 ASIL과 무관하다.","why":["2.4.1은 ASPICE의 심사 가능한 기준이 제품의 ASIL과 무관하다고 한다.","2.4.1에서 ISO 26262의 목적은 하드웨어와 소프트웨어 양쪽 장애로 인한 리스크를 피하는 것이다. ASIL에 따라 달라진다고 한 것은 테스트 프로세스와 method의 요구사항이다.","표 2(2.4.2)는 테스트 레벨끼리의 대응표이고, 표에 ASIL에 따른 구분이 없다.","2.4.1 그대로다. 이 요구사항은 아이템의 ASIL에 따라 달라진다."],"ref":"2.4.1","hard":true},{"id":"h2-204","ch":2,"lo":"AuT-2.4.2","k":2,"q":"실라버스 2.4.2에 따르면, 테스터가 ISO 26262·ASPICE·CTFL의 모든 테스트 레벨에 대해 공통된 이해를 갖춰야 하는 이유는?","opts":["ISO 26262와 ASPICE는 테스트 레벨을 따로 기술하지 않아서, 개발 팀 전체가 CTFL 테스트 레벨 하나만 기준으로 삼아 일해야 하기 때문이다.","ISO 26262와 ASPICE도 테스트 레벨을 기술하지만 CTFL 테스트 레벨과 완전히 일치하지는 않아서, 개발 팀 안에서 효율적이고 효과적으로 협업하려면 필요하다.","세 체계의 테스트 레벨은 이름만 다를 뿐 범위가 일대일로 같아서, 팀이 서로의 레벨 이름을 바꿔 부르는 법만 알면 되기 때문이다.","CTFL의 'system'도 ISO 26262의 'item'처럼 하드웨어와 소프트웨어로 된 제품을 뜻해서, 두 체계의 시스템 레벨을 그대로 맞대어 쓰기 때문이다."],"ans":[1],"exp":"실라버스 2.4.2: ISO 26262와 ASPICE는 둘 다 테스트 레벨을 기술하지만, 이 레벨들은 CTFL의 테스트 레벨과 완전히 일치하지 않는다. 그래서 개발 팀 안에서 효율적이고 효과적으로 협업하려면 테스터가 모든 테스트 레벨에 대해 공통된 이해를 갖춰야 한다.\n이어서 2.4.2는 'system'이라는 말의 뜻 차이(ASPICE·ISO 26262는 하드웨어와 소프트웨어로 된 제품, CTFL은 소프트웨어만)를 설명하고 표 2로 테스트 레벨을 대응시킨다. 표 2 각주에 따르면 safety validation(4-8)과 validation(VAL.1)은 ISTQB 인수 테스팅의 일부만 다룬다.","why":["2.4.2 첫 문장은 ISO 26262와 ASPICE가 둘 다 테스트 레벨을 기술한다고 한다.","2.4.2 그대로다. 레벨이 완전히 일치하지 않아서, 팀 안의 협업을 위해 공통된 이해가 필요하다.","2.4.2는 세 체계의 테스트 레벨이 완전히 일치하지 않는다고 한다. 표 2 각주도 safety validation(4-8)과 VAL.1이 ISTQB 인수 테스팅의 일부만 다룬다고 적는다.","2.4.2는 CTFL이 'system'이라는 말로 소프트웨어만 가리킨다고 한다. 하드웨어와 소프트웨어로 된 제품을 뜻하는 것은 ASPICE의 'system'과 ISO 26262의 'system'·'item'이다."],"ref":"2.4.2","hard":true},{"id":"h2-205","ch":2,"lo":"AuT-2.KW","k":1,"q":"2장 키워드의 정의에 대한 설명으로 옳지 **않은** 것은?","opts":["기능 안전(functional safety): E/E 시스템이 정상 동작하는 중에 생기는 hazard 때문에 발생하는 불합리한 리스크가 없는 것","method table(메소드 테이블): ASIL과 테스트 대상의 정황에 따라 요구되는 테스트 접근법, 테스트 기법, 테스트 유형을 담은 표","software verification(ASPICE): Automotive SPICE에서, 통합된 소프트웨어가 소프트웨어 요구사항과 일치하는지 베리피케이션하는 것","system verification(ASPICE): Automotive SPICE에서, 시스템이 시스템 요구사항과 일치하는지 베리피케이션(verification)하는 것"],"ans":[0],"exp":"ISTQB 용어집의 기능 안전(functional safety) 정의는 'E/E 시스템의 오작동(malfunctioning behavior)으로 생긴 hazard 때문에 발생하는 불합리한 리스크가 없는 것'이다. 이 보기는 '오작동'을 '정상 동작'으로 바꿔 틀렸다.\n나머지 셋은 용어집(method table)과 실라버스 6장(software verification, system verification) 정의 그대로다.","why":["용어집 정의의 원인은 E/E 시스템의 오작동(malfunctioning behavior)으로 생긴 hazard다. '정상 동작'으로 바꾸면 틀린 정의가 된다.","용어집 method table 정의와 같다.","실라버스 6장 software verification(ASPICE) 정의와 같다.","실라버스 6장 system verification(ASPICE) 정의와 같다."],"trap":"'안전 = 위험이 없는 상태'로 넓게 받아들이기 쉽지만, 용어집의 기능 안전 정의는 E/E 시스템의 오작동으로 생긴 hazard를 기준으로 한다. 단어 하나 바뀐 보기를 조심한다.","ref":"2장 Keywords(ISTQB 용어집), 6장 Domain Specific Terms","hard":true},{"id":"h2-101","ch":2,"lo":"AuT-2.2.1.1","k":2,"q":"자율 주차 기능을 개발하는 공급업체(supplier)의 신규 입사자 교육 자료에 아래 문장이 있다.\ni. 임베디드 시스템이 복잡해질수록 개발 중에 잘못된 행동(erroneous action)이 일어날 리스크도 커진다.\nii. 개발 중 잘못된 행동의 결과로, 아무도 알아채지 못한 결함이 시스템에 남을 수 있다.\niii. 생명·신체에 위험을 줄 수 있는 시스템이면 테스터가 잠재 리스크를 분석하고, 실제 리스크가 있으면 줄일 조치를 정한다.\niv. 기능 안전(functional safety)은 E/E 시스템이 오작동으로 인한 hazard 때문에 불합리한 리스크를 일으키지 않고 동작하게 하는 것으로, product safety나 occupational safety와 구분되는 개념이다.\nv. 실제 리스크가 확인되면, 그 리스크의 영향이 완전히 없어질 때까지 조치를 찾아야 한다.\n실라버스 2.2.1.1과 맞는 문장만 모두 고른 것은?","opts":["i, iii, iv","ii, iv, v","i, ii, iv","i, ii, iv, v"],"ans":[2],"exp":"2.2.1.1: ① 복잡도가 커지면서 개발 중 잘못된 행동이 일어날 리스크도 커지고(i), 그 결과 알아채지 못한 결함이 시스템에 남을 수 있다(ii). ② 생명·신체에 위험을 줄 수 있는 시스템이면 safety engineer나 safety manager가 잠재 리스크를 분석한다. 테스터가 아니다(iii 틀림). ③ 실제 리스크가 있으면 리스크 영향을 수용 가능한 리스크 수준(acceptable risk level)까지 줄일 조치를 찾는다. 완전히 없애는 것이 아니다(v 틀림). ④ 기능 안전의 뜻과, 정보 보안(information security, 또는 사이버보안)·product safety·occupational safety와의 구분은 iv와 같다.\n함정 포인트: 테스터도 안전 분석에 참여할 수 있다고 생각하면 iii이 맞아 보이지만, 실라버스는 분석 주체를 safety engineer·safety manager로 적는다.\n(v2.1 기준 표현. 2018년판은 분석 주체를 'the person responsible for safety'로, 구분 대상을 'informational safety, product safety or work safety'로 적었다. 분석 주체가 테스터가 아니라는 점과 수용 가능한 수준까지 줄인다는 점은 같다.)","why":["iii이 틀렸다. 잠재 리스크 분석은 safety engineer나 safety manager의 일이다. 맞는 문장 ii도 빠졌다.","v가 틀렸다. 리스크 영향은 수용 가능한 리스크 수준까지 줄이며, 완전히 없애라는 문장은 없다. 맞는 문장 i도 빠졌다.","정답. i, ii, iv 모두 2.2.1.1 문장과 같다.","v가 틀렸다. 리스크 영향은 수용 가능한 리스크 수준까지 줄이면 되며, 완전히 없애라는 문장은 없다."],"trap":"테스터도 안전 분석 회의에 들어갈 수 있다는 생각에 iii을 맞다고 고르기 쉽다. 실라버스 2.2.1.1은 잠재 리스크 분석을 safety engineer 또는 safety manager의 일로 적는다.","ref":"2.2.1.1","hard":true},{"id":"h2-102","ch":2,"lo":"AuT-2.2.1.1","k":2,"q":"차량 통합 테스트 중, 위조된 메시지가 텔레매틱스 쪽에서 차량 네트워크로 들어오면 제동 제어 ECU가 의도하지 않은 제동을 거는 것이 발견됐다. 프로젝트 회의에서 이 발견을 기능 안전(functional safety) 관점에서 어떻게 볼지 의견이 갈렸다.\n실라버스 2.2.1.1에 비추어 가장 적절한 해석은?","opts":["사이버보안(cybersecurity)은 ISO 26262의 초점이 아니므로, 이 건은 기능 안전과 무관한 보안 이슈로만 분류해 보안 담당 조직에 넘긴다.","사이버보안이 부족하면 기능 안전이 위험해질 수 있음을 보여 주는 사례다. 다만 사이버보안 자체는 ISO 26262의 초점이 아니다.","사이버보안은 product safety에는 기여하지만 기능 안전과는 관계가 없으므로, 이 건은 기능 안전이 아닌 product safety 이슈로만 분류한다.","기능 안전과 사이버보안은 서로 구분되는 개념이라 한쪽의 부족이 다른 쪽에 영향을 줄 수 없으므로, 제동 오작동의 원인은 따로 찾는다."],"ans":[1],"exp":"2.2.1.1: occupational safety와 사이버보안은 ISO 26262의 초점이 아니다. 하지만 사이버보안이 부족하면 기능 안전이 위험해질 수 있다(a lack of cybersecurity can endanger functional safety). 위조 메시지 때문에 의도하지 않은 제동이 걸렸으므로 이 경우에 해당한다. 기능 안전과 사이버보안은 구분되는 개념이지만 둘 다 product safety에 기여한다.\n함정 포인트: 'ISO 26262의 초점이 아니다'만 기억하면 보안 이슈로만 분류하는 보기가 끌리지만, 실라버스는 사이버보안 부족이 기능 안전을 위협할 수 있다고 바로 이어서 말한다.\n(v2.1 기준 표현. 2018년판은 'cybersecurity contributes to product safety'라고만 적었고, 기능 안전도 product safety에 기여한다는 말은 없었다. 사이버보안 부족이 기능 안전을 위협할 수 있다는 내용은 같다.)","why":["사이버보안이 ISO 26262의 초점은 아니지만, 사이버보안 부족은 기능 안전을 위협할 수 있으므로 기능 안전과 무관하다고 할 수 없다.","정답. 2.2.1.1의 설명과 같다.","사이버보안이 product safety에 기여하는 것은 맞지만, 사이버보안 부족은 기능 안전도 위협할 수 있으므로 기능 안전과 관계없다는 판단은 틀렸다.","두 개념은 구분되지만, 실라버스는 사이버보안 부족이 기능 안전을 위협할 수 있다고 한다."],"trap":"보안 이슈와 안전 이슈를 담당 조직별로 나눠 생각하면 보안 쪽으로만 넘기기 쉽다. 실라버스 2.2.1.1은 사이버보안 부족이 기능 안전을 위험하게 할 수 있다고 적는다.","ref":"2.2.1.1","hard":true},{"id":"h2-103","ch":2,"lo":"AuT-2.2.1.2","k":1,"q":"ASIL C 제동 제어 SW를 맡은 공급업체(supplier) 테스터 K가 OEM(완성차 업체)의 시스템 테스트 일정이 바뀌었다는 연락을 받았다. 이 변경은 K 팀의 통합 테스트 범위에도 영향을 준다.\n실라버스 2.2.1.2의 안전 문화(safety culture) 설명에 비추어 K의 대응으로 가장 적절한 것은?","opts":["K 팀의 프로세스는 이미 심사를 통과해 잘 지켜지고 있으므로, OEM 쪽 변경은 OEM이 관리하게 두고 K 팀은 기존 계획대로 진행한다.","안전 문화는 safety manager가 책임지는 영역이므로, 변경 내용을 safety manager에게 넘기고 K는 테스트 실행 결과의 정확성만 챙긴다.","안전 관련 책임은 시장 출시(market launch) 시점까지이므로, 출시 일정에 영향이 없는 범위에서만 이번 변경을 테스트 계획에 반영한다.","자기 작업이 OEM 쪽 프로세스와 따로 일어나지 않음을 인식하고, 이 변경이 개발 프로세스와 최종 제품의 안전에 주는 영향을 살펴 대응한다."],"ans":[3],"exp":"2.2.1.2: ISO 26262에 따른 제품 개발에서는 자기 조직의 프로세스만 모니터링하는 것으로 충분하지 않고, 외부 파트너와 공급업체를 포함한 모든 참여자가 cross-process 접근을 따라야 한다. 참여자는 자기 행동이 다른 프로세스와 독립적으로 일어나지 않는다는 것을 이해해야 하고, 이 책임은 시장 출시로 끝나지 않고 safety lifecycle 끝까지 이어진다. 테스터는 SW 개발 수명주기 단계에 책임감 있게 참여하고 제품 개발 전체 맥락을 계속 보면서 일함으로써 안전 문화에 기여한다.\n함정 포인트: '우리 프로세스만 잘 지키면 된다'는 생각으로 심사 통과를 내세운 보기를 고르기 쉽지만, 실라버스는 자기 조직 프로세스 모니터링만으로는 충분하지 않다고 한다.\n(v2.1 기준 표현. 2018년판은 cross-process 대신 'process-independent approach', 시장 출시 대신 'product launch', safety lifecycle 대신 'system lifecycle'이라고 적었다. 자기 조직만 보면 안 되고 출시 뒤에도 책임이 이어진다는 내용은 같다.)","why":["자기 조직의 프로세스만 모니터링하는 것으로는 충분하지 않다. 외부 파트너와 공급업체를 포함한 모든 참여자가 cross-process 접근을 따라야 한다.","모든 참여자가 자기 일이 개발 프로세스와 최종 제품 안전에 주는 영향을 이해해야 한다. safety manager에게만 맡길 일이 아니다.","이 책임은 시장 출시로 끝나지 않고 safety lifecycle(안전 수명주기) 끝까지 이어진다.","정답. 다른 프로세스와의 연관을 인식하고 제품 개발 전체 맥락에서 일하는 것이 2.2.1.2가 말하는 테스터의 기여다."],"trap":"현업에서는 계약 범위를 기준으로 상대 조직의 변경을 상대 쪽 일로 보기 쉽다. 실라버스 2.2.1.2는 외부 파트너와 공급업체를 포함해 모두가 cross-process 접근을 따라야 한다고 한다.","ref":"2.2.1.2","hard":true},{"id":"h2-104","ch":2,"lo":"AuT-2.2.2","k":2,"q":"ISO 26262 safety lifecycle(안전 수명주기)에서 테스터 활동(1~4)과 그 활동이 이루어지는 시점(A~D)을 실라버스 2.2.2에 맞게 연결한 것은?\n1. 테스트 계획(test planning)\n2. 테스트 계획서나 테스트 명세 같은 결과 문서의 조정\n3. 테스트 실행(test execution)\n4. 3단계(production, operation, service and decommissioning)에서 생긴 제품 변경에 대한 참여\nA. 주로 product development 하위 단계 사이의 전환 시점(예: 구현 → SW 통합 → HW-SW 통합)\nB. 보통 concept phase 안에서\nC. 변경 범위에 따라 1단계나 2단계로 돌아가서\nD. 어느 단계에서든 필요할 수 있음","opts":["1-B, 2-D, 3-A, 4-C","1-A, 2-D, 3-B, 4-C","1-D, 2-B, 3-A, 4-C","1-B, 2-C, 3-A, 4-D"],"ans":[0],"exp":"2.2.2: ① 테스트 계획은 보통 concept phase 안에서 한다(1-B). ② 그 결과 문서(테스트 계획서, 테스트 명세 등)는 어느 단계에서든 조정이 필요할 수 있다(2-D). ③ 테스트 실행은 주로 product development 하위 단계 사이의 전환 시점에 한다. 실라버스는 구현에서 SW 통합으로, 다시 HW-SW 통합으로 넘어가는 때를 예로 든다(3-A). ④ 3단계에서 제품이 바뀌면 변경 범위에 따라 1단계나 2단계로 돌아가며, 테스터도 이 변경에 참여한다(4-C).\n함정 포인트: 양산 뒤 변경을 그 자리에서 처리하는 유지보수 감각으로 보면 4를 D로 잇는 보기가 끌린다.\n(v2.1 기준 단계 이름. 2018년판은 1단계를 Product concept, 3단계를 Product production and maintenance라고 불렀다. 활동별 시점은 같다.)","why":["정답. 2.2.2의 설명과 같다.","계획과 실행의 시점이 뒤바뀌었다. 계획은 보통 concept phase에서, 실행은 주로 product development 하위 단계 사이의 전환 시점에 한다.","계획은 보통 concept phase에서 한다. 어느 단계에서든 생길 수 있는 것은 결과 문서의 조정이다.","3단계의 제품 변경은 변경 범위에 따라 1단계나 2단계로 돌아가 처리한다. 어느 단계에서든 생길 수 있는 것은 결과 문서의 조정이다."],"trap":"양산 뒤 변경을 유지보수 단계 안에서 바로 처리하는 일로 생각하면 4를 '어느 단계에서든'과 잇기 쉽다. 실라버스 2.2.2는 3단계의 변경이 범위에 따라 1단계나 2단계로 돌아간다고 한다.","ref":"2.2.2","hard":true},{"id":"h2-105","ch":2,"lo":"AuT-2.2.2","k":2,"q":"ASIL C 조향 보조 기능을 개발하는 공급업체(supplier)가 product development 단계에 있다. 테스트 리더가 정한 다음 방침 중 실라버스 2.2.2와 가장 맞는 것은?","opts":["테스트 기법은 테스트 레벨별 사내 표준 템플릿으로 미리 고정해 두고, 안전 요구사항이 나오면 템플릿에 맞춰 테스트 케이스만 채운다.","테스트 계획서는 concept phase에서 승인받았으므로, product development 중에 요구사항이 바뀌어도 계획서는 고치지 않고 그대로 따른다.","안전 관련 요구사항을 바탕으로 테스트 기법을 고르고, 베리피케이션과 밸리데이션용 테스트 케이스를 설계해 해당 하위 단계에서 수행한다.","테스트 활동은 release for production 전에 모두 끝나므로, 3단계로 넘어가는 일은 테스트 결과와 관계없이 생산 부서가 판단한다."],"ans":[2],"exp":"2.2.2: 안전 관련 요구사항을 바탕으로 테스트 기법을 고르고, 이 요구사항의 베리피케이션(verification)과 밸리데이션(validation)을 위한 테스트 케이스를 설계한다. 테스터는 이 작업을 product development의 해당 하위 단계에서 수행한다. 계획의 결과 문서는 어느 단계에서든 조정이 필요할 수 있고, 테스터는 테스트 활동으로 3단계로의 전환에 크게 기여한다.\n함정 포인트: 레벨별로 기법을 고정해 두는 사내 관행에 익숙하면 템플릿 보기가 효율적으로 보이지만, 실라버스는 기법 선택의 출발점을 안전 관련 요구사항으로 둔다.\n(v2.1 기준 표현. 2018년판은 3단계를 'release for production 이후'의 Product production and maintenance라고 불렀다. 테스터 역할에 대한 내용은 같다.)","why":["테스트 기법은 안전 관련 요구사항을 바탕으로 고른다. 요구사항과 상관없이 미리 고정하는 방식은 2.2.2와 맞지 않는다.","테스트 계획서나 테스트 명세는 어느 단계에서든 조정이 필요할 수 있다.","정답. 2.2.2의 설명과 같다.","테스터는 테스트 활동으로 3단계로의 전환에 크게 기여한다."],"trap":"테스트 레벨마다 쓰는 기법을 사내 표준으로 미리 고정해 두면 된다고 생각하기 쉽다. 실라버스 2.2.2는 안전 관련 요구사항을 바탕으로 테스트 기법을 고른다고 한다.","ref":"2.2.2","hard":true},{"id":"h2-106","ch":2,"lo":"AuT-2.2.3.2","k":1,"q":"SW 테스터가 아날로그 센서 입력을 읽는 SW 드라이버의 베리피케이션(verification)을 맡았다. 이 작업에는 하드웨어와 소프트웨어 양쪽에 걸친 측면이 있다.\n실라버스 2.2.3.2에 따르면, 이런 측면을 다루는 ISO 26262의 범위는?","opts":["5부: 하드웨어 쪽 요소가 들어가므로 하드웨어 수준의 제품 개발 부분만 찾아본다","8부: 모든 테스트 레벨의 베리피케이션 프로세스 특성을 설명하므로 이 부에서만 다룬다","6부: SW 드라이버도 결국 소프트웨어이므로 소프트웨어 수준의 제품 개발만 본다","4~6부: HW와 SW 양쪽에 걸친 측면은 HW-SW 인터페이스 범위로 다룬다"],"ans":[3],"exp":"2.2.3.2: 하드웨어 고유 측면이 필요하면 5부를 보고, 하드웨어와 소프트웨어 모두에 관한 측면은 하드웨어-소프트웨어 인터페이스 범위에서 4~6부가 다룬다. 시스템 수준은 4부(safety validation 포함), 소프트웨어 수준은 6부이고, 8부는 모든 테스트 레벨 베리피케이션의 프로세스 특성과 형상 관리·도구 qualification 같은 지원 프로세스를 다룬다.\n함정 포인트: 하드웨어가 얽혀 있다는 말에 5부만, 또는 드라이버가 SW라는 생각에 6부만 고르기 쉽지만, 양쪽에 걸친 측면은 4~6부 범위다.\n(2018년판도 같은 내용이다. 2018년판은 부(part)를 'volume'이라고도 불렀다.)","why":["5부는 하드웨어 고유 측면을 볼 때다. HW와 SW 양쪽에 걸친 측면은 4~6부의 하드웨어-소프트웨어 인터페이스 범위다.","8부는 모든 테스트 레벨 베리피케이션의 프로세스 특성과 지원 프로세스를 다룬다. HW-SW 양쪽 측면을 8부에서만 다룬다는 설명은 없다.","6부는 소프트웨어 수준이다. 양쪽에 걸친 측면은 4~6부 범위에서 다룬다.","정답. 2.2.3.2의 설명과 같다."],"trap":"현업에서는 드라이버를 SW 산출물로만 보고 SW 쪽 기준만 찾기 쉽다. 실라버스 2.2.3.2는 HW와 SW 모두에 관한 측면을 하드웨어-소프트웨어 인터페이스 범위(4~6부)에서 다룬다고 한다.","ref":"2.2.3.2","hard":true},{"id":"h2-107","ch":2,"lo":"AuT-2.2.4.1","k":1,"q":"ASIL(automotive safety integrity level)에 대한 설명으로 실라버스 2.2.4.1과 맞는 것을 두 개 고르시오.","opts":["HARA 결과 ASIL A보다 낮게 나온 요구사항은 'QM'으로 표시하며, 표준 기준으로는 ASIL A보다 한 단계 낮은 안전 관련 요구사항으로 다룬다.","ASIL은 기능 안전 조치로 이뤄야 할 리스크 감소의 척도이며, 그런 조치의 예로 E/E 시스템을 감시하는 독립적인 안전 기능이 있다.","안전 목표(safety goal)는 바탕이 된 hazard의 ASIL을 받지만, 거기서 나온 안전 요구사항은 한 단계 낮은 ASIL을 받을 수 있다.","리스크 수준이 높을수록 더 정교한 조치가 필요할 수 있으며, 특별히 정의된 방법을 적용하는 것도 그런 조치에 들어간다.","ASIL은 HARA에서 hazard마다 정하는 것이 아니라, 안전 요구사항을 모두 정의한 뒤 요구사항마다 따로 정한다."],"ans":[1,3],"exp":"2.2.4.1: ASIL은 기능 안전 조치로 필요한 리스크 감소의 척도다. 조치의 예는 E/E 시스템을 감시하는 독립적인 안전 기능이나 특별히 정의된 방법의 적용이고, 리스크 수준이 높으면 더 정교한 조치가 필요할 수 있다. 프로젝트 초기에 전문가 팀이 HARA(hazard analysis and risk assessment)를 수행해 hazard마다 ASIL을 정하고, 이어서 정의하는 안전 목표와 안전 요구사항은 바탕이 된 hazard와 같은 ASIL을 가진다. ASIL A 미만 요구사항은 표준 기준으로 안전 관련이 아니어서 기능 안전 활동이 필요 없고 기존 품질경영시스템(QMS)으로 충분하다. 'QM' 표시는 ASIL 요구사항과 구분하려는 실무 관행이다.\n함정 포인트: 'QM'을 ASIL 바로 아래 레벨처럼 부르다 보면 안전 관련 요구사항으로 다루는 보기가 그럴듯해 보인다.\n(v2.1 기준 표현. 2018년판은 'For each risk identified'라고 적어 hazard 대신 risk라는 말을 썼고, 'QM' 표시 관행 설명 없이 기존 품질경영(QM)으로 다룬다고만 적었다. 같은 ASIL을 받는다는 점과 ASIL A 미만은 안전 관련이 아니라는 점은 같다.)","why":["ASIL A 미만 요구사항은 표준 기준으로 안전 관련이 아니다. 기능 안전 활동이 필요 없고 기존 QMS로 다루면 충분하다.","정답. 2.2.4.1 첫 문단의 내용이다.","안전 목표와 안전 요구사항은 바탕이 된 hazard와 같은 ASIL을 가진다.","정답. 2.2.4.1 첫 문단의 내용이다.","HARA로 찾은 hazard마다 ASIL을 정하고, 그다음에 안전 목표와 안전 요구사항을 정의한다."],"trap":"'QM'을 ASIL A 바로 아래 레벨처럼 생각하면 약한 안전 요구사항으로 여기기 쉽다. 실라버스 2.2.4.1은 ASIL A 미만 요구사항이 표준 기준으로 안전 관련이 아니라고 한다.","ref":"2.2.4.1","hard":true},{"id":"h2-108","ch":2,"lo":"AuT-2.2.4.2","k":2,"q":"ASIL B 안전 요구사항의 테스트를 계획하던 테스터가 다음 결정을 적었다.\n'method table(메소드 테이블)에서 이 ASIL에 권고가 없는(no recommendation) 방법 M을 추가로 적용한다. M이 결함을 더 잘 찾으므로, 같은 ASIL에서 recommended인 방법 N은 M으로 대신한다.'\n실라버스 2.2.4.2에 비추어 이 결정을 평가한 것으로 맞는 것은?","opts":["M은 보조 조치로 문제없이 쓸 수 있지만, M을 수행한다고 해서 recommended인 N을 대신할 수는 없다.","M은 표준이 권고하지 않은 방법이므로, ISO 26262에 따른 개발에서는 보조 조치로도 쓰면 안 된다.","N은 highly recommended가 아니라 recommended일 뿐이므로, M을 쓰면 별도 근거 없이 뺄 수 있다.","테스터는 결함 검출력을 근거로 ASIL과 관계없이 기법을 자유롭게 고를 수 있으므로 결정은 타당하다."],"ans":[0],"exp":"2.2.4.2: no recommendation은 표준이 그 조치의 사용을 권하지도 말리지도 않는다는 뜻이다. 보조 조치로는 문제없이 쓸 수 있지만, 그 수행이 recommended나 highly recommended 조치를 대신하지는 않는다. recommended인 방법은 적용하는 것이 원칙(should)이고, 적용하지 않으면 그 근거를 제시해야(shall) 한다. 또 테스터는 표준이 그 특수한 경우에 허용하는 범위 안에서만 자유롭게 결정할 수 있다.\n함정 포인트: 더 좋은 기법으로 바꾸는 것이 실무에서는 합리적으로 보여 '자유롭게 고른다'나 '근거 없이 뺀다' 보기가 끌리지만, o인 방법은 권고 방법을 대신하지 못한다.\n(v2.1 기준. 2018년판에는 recommended를 '적용이 원칙, 미적용 시 근거 제시'로 해석하는 문장이 없고, 2.2.5에서 '증거에 유용하면 적용'으로 설명했다. no recommendation 조치가 권고 조치를 대신하지 못한다는 내용은 두 판이 같다.)","why":["정답. no recommendation 조치는 보조로 쓸 수 있지만 권고 조치를 대신하지 못한다.","no recommendation은 사용을 권하지도 말리지도 않는다는 뜻이다. 보조 조치로 문제없이 쓸 수 있다.","no recommendation 조치의 수행은 recommended 조치를 대신하지 못한다. 또 recommended 방법을 적용하지 않으려면 근거를 제시해야 한다.","테스터는 표준이 그 경우에 허용하는 범위 안에서만 자유롭게 결정할 수 있다."],"trap":"현업에서는 결함을 더 잘 찾는 기법으로 갈아 끼우는 것을 개선으로 보기 쉽다. 실라버스 2.2.4.2는 no recommendation 조치가 recommended·highly recommended 조치를 대신하지 않는다고 한다.","ref":"2.2.4.2","hard":true},{"id":"h2-109","ch":2,"lo":"AuT-2.2.4.2","k":2,"q":"ASIL이 테스트에 주는 영향에 대한 아래 진술 중 실라버스와 맞는 것만 모두 고른 것은?\ni. ASIL이 낮으면 명시된 조치의 수행이 선택 사항인 경우가 많다.\nii. 동등 분할(equivalence partitioning)과 경계값 분석(boundary value analysis)은 ASIL C 이상에서만 highly recommended다.\niii. ASIL에 따른 ISO 26262의 권고는 동적 테스트 기법뿐 아니라 리뷰나 정적 분석 같은 정적 테스트 기법에도 해당한다.\niv. 테스터는 표준이 그 특수한 경우에 허용하는 범위 안에서만 자유롭게 결정할 수 있다.\nv. 한 제품 안의 안전 요구사항은 그 제품에 정해진 ASIL 하나를 함께 쓰므로, 요구사항마다 테스트 노력이 크게 달라지지 않는다.","opts":["i, ii, iv","i, iii, iv","iii, iv, v","i, ii, iii, iv"],"ans":[1],"exp":"2.2.4.2: ① ASIL이 낮으면 명시된 조치의 수행이 선택 사항인 경우가 많다(i 맞음). ② 동등 분할과 경계값 분석은 ASIL A에서는 recommended일 뿐이고 ASIL B 이상에서 highly recommended다. ASIL C부터가 아니다(ii 틀림). ③ ISO 26262가 method table로 권고하는 method에는 테스트 기법, 테스트 유형뿐 아니라 리뷰·정적 분석 같은 정적 테스트 기법도 들어 있고, method table은 ASIL마다 권고 방법을 정한다(2.2.5, iii 맞음). ④ 테스터는 표준이 그 특수한 경우에 허용하는 범위 안에서만 자유롭게 결정한다(iv 맞음). ⑤ ASIL은 제품 전체의 특성이 아니라 특정 안전 목표와 거기서 나온 안전 요구사항에 묶인다. 같은 제품이라도 ASIL이 다른 안전 요구사항은 테스트 노력이 크게 다를 수 있다(v 틀림).\n함정 포인트: 'ASIL B 이상'을 'ASIL C 이상'으로 기억하면 ii가 맞아 보이고, 제품 단위로 ASIL을 부르는 습관이 있으면 v가 자연스럽게 들린다.\n(2018년판도 같은 내용이다. 2018년판은 테스트 기법을 'test design techniques'라고 적었다.)","why":["ii가 틀렸다. 동등 분할과 경계값 분석은 ASIL B 이상에서 highly recommended다. 맞는 진술 iii이 빠졌다.","정답.","v가 틀렸다. ASIL은 제품 전체가 아니라 안전 목표와 안전 요구사항에 묶이므로 요구사항마다 테스트 노력이 크게 다를 수 있다. 맞는 진술 i도 빠졌다.","ii가 틀렸다. 동등 분할과 경계값 분석은 ASIL B 이상에서 highly recommended다."],"trap":"'ASIL D ECU'처럼 제품 이름에 ASIL을 붙인 표현에 익숙하면 v가 자연스럽게 들린다. 실라버스 2.2.4.2는 ASIL이 제품 전체의 특성이 아니라 특정 안전 목표와 안전 요구사항에 묶인다고 한다.","ref":"2.2.4.2, 2.2.5","hard":true},{"id":"h2-110","ch":2,"lo":"AuT-2.2.5","k":3,"q":"아래 표는 실라버스 2.2.5의 표 1(method table(메소드 테이블) 예시)이다. ++ = highly recommended, + = recommended, o = 권고 없음(no recommendation). 3a와 3b처럼 같은 번호에 문자 접미사가 붙은 행은 동등한 대안 방법이다.\n같은 ECU에 ASIL B 안전 요구사항 R1과 ASIL C 안전 요구사항 R2가 있다. 테스트 계획서 초안에 아래 결정이 적혀 있다.\ni. R2에는 method x를 적용한다. 대안이 없는 행이고 ASIL C에서 ++이기 때문이다.\nii. R1에는 method x를 적용하지 않는다. ASIL B에서 +일 뿐이므로 따로 근거를 남기지 않는다.\niii. R2에는 method y를 적용하는 것을 원칙으로 하고, 적용하지 않으면 그 근거를 남긴다.\niv. R2의 대안 행에서는 적어도 method z1을 고른다. ASIL C에서 권고 수준이 가장 높기 때문이다.\nv. R1의 대안 행 3a/3b는 선택 사항이므로, 둘 중 아무것도 고르지 않아도 된다.\n표와 실라버스의 해석 규칙에 맞는 결정만 모두 고른 것은?","table":{"head":["행","Method","ASIL A","ASIL B","ASIL C","ASIL D"],"rows":[["1","Method x","o","+","++","++"],["2","Method y","o","o","+","+"],["3a","Method z1","+","++","++","++"],["3b","Method z2","++","+","o","o"]]},"opts":["i, ii, iv","i, iii, v","i, iii, iv","i, iii, iv, v"],"ans":[2],"exp":"풀이(2.2.4.2, 2.2.5)\n① 열을 읽는다. ASIL B: x +, y o, z1 ++, z2 +. ASIL C: x ++, y +, z1 ++, z2 o.\n② i: 행 1은 대안이 없는 행이다. 대안이 없는 행에서는 선택권이 없고 그 ASIL에서 highly recommended인 방법을 모두 적용해야 한다. ASIL C에서 x는 ++이므로 맞다.\n③ ii: ASIL B에서 x는 +(recommended)다. recommended는 적용하는 것이 원칙(should)이고, 적용하지 않으면 그 근거를 제시해야(shall) 한다. 근거를 남기지 않는다는 결정은 틀렸다.\n④ iii: ASIL C에서 y는 +다. 적용을 원칙으로 하고 적용하지 않으면 근거를 남기는 것은 맞다.\n⑤ iv: 실라버스는 바로 이 ASIL C 경우를 예로 들어, z1이 ASIL C에서 권고 수준이 가장 높으므로 적어도 z1을 골라야 한다(should be chosen)고 한다. 맞다.\n⑥ v: 대안 행에서 테스터는 요구사항을 ASIL에 맞게 베리피케이션할 수 있는 적합한 조합을 골라야 하고, 고른 조합의 유용성(usefulness)을 정당화해야 한다. 아무것도 고르지 않아도 된다는 결정은 틀렸다.\n결과: i, iii, iv.\n검산 1: 원문 표 1의 ASIL B·C 열을 다시 대조했다. x + / ++, y o / +, z1 ++ / ++, z2 + / o로 같다.\n검산 2: 틀린 결정 ii나 v가 들어간 보기를 지우면 i, iii, iv 보기 하나만 남는다.\n함정 포인트: recommended를 '해도 되고 안 해도 되는 것'으로 운영하는 데 익숙하면 ii가 맞아 보이지만, 적용하지 않을 때는 근거가 필요하다.\n(v2.1 기준. 2018년판은 highly recommended를 '보통 적용', recommended를 '증거에 유용하면 적용'으로 설명했고, 대안 조합의 선택은 '설명해야 한다(should be explained)'고 적었다. 표 1의 값은 두 판이 같다.)","why":["ii가 틀렸다. ASIL B에서 x는 +이므로 적용하지 않으려면 근거를 제시해야 한다. 맞는 결정 iii도 빠졌다.","v가 틀렸다. 대안 행에서도 적합한 조합을 골라 그 유용성을 정당화해야 한다. 맞는 결정 iv도 빠졌다.","정답. ASIL B·C 열과 해석 규칙을 그대로 적용한 결과다.","v가 틀렸다. 대안 행을 선택 사항으로 보고 아무것도 고르지 않는 것은 해석 규칙에 맞지 않는다."],"trap":"현업에서는 recommended를 일정이나 공수에 따라 빼도 되는 항목으로 다루기 쉽다. 실라버스 2.2.4.2는 recommended 방법을 적용하는 것이 원칙이고, 적용하지 않으면 근거를 제시해야 한다고 한다.","ref":"2.2.5","hard":true},{"id":"h2-111","ch":2,"lo":"AuT-2.2.5","k":3,"q":"아래 표는 실라버스 2.2.5의 표 1(method table(메소드 테이블) 예시)이다. ++ = highly recommended, + = recommended, o = 권고 없음(no recommendation). 3a와 3b처럼 같은 번호에 문자 접미사가 붙은 행은 동등한 대안 방법이다.\n품질 담당자가 대안이 없는 행(행 1과 2)만 보고, ASIL별로 '선택의 여지 없이 반드시 적용해야(must) 하는 방법' 목록을 만들려 한다. 실라버스의 해석 규칙에 따라 바르게 정리한 것은?","table":{"head":["행","Method","ASIL A","ASIL B","ASIL C","ASIL D"],"rows":[["1","Method x","o","+","++","++"],["2","Method y","o","o","+","+"],["3a","Method z1","+","++","++","++"],["3b","Method z2","++","+","o","o"]]},"opts":["ASIL A: 없음 / ASIL B: x /
